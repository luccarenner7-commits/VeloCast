// One wheel's card: target/baseline/estimate chips, the "Aufgepumpt"
// baseline-log action, and (once a baseline exists) the combined
// "Nachmessen & neu aufpumpen" form. Inputs are uncontrolled (read via
// closure at submit time) rather than mirrored into `state` on every
// keystroke -- same reasoning as settingsFieldRow()'s onchange-not-oninput
// convention, just taken one step further since these values are never
// needed before their one submit action fires.
function buildTireWheelCard(data, wheel, label){
  const s = data.settings;
  const w = data[wheel];
  const calcOn = s.calculatorEnabled !== false;
  const target = getWheelTargetBar(data, wheel); // null when calc is off and no manual target entered yet
  const hasBaseline = w.lastBaselineBar != null && w.lastBaselineAtMs != null;

  // id: 'tp-card-' + wheel is unconditional -- unlike every input inside this
  // card, which comes and goes with hasBaseline/calcOn, the card root itself
  // always renders. refreshTirePressureWheelsSection() relies on that to
  // detect "are the wheel cards mounted" without being tripped up by which
  // inner fields happen to exist right now.
  const card = el('div', {class: 'card', id: 'tp-card-' + wheel});
  card.appendChild(el('h2', {}, [label]));

  if(!calcOn){
    // Same direct-DOM refresh discipline as tirePressureNumberRow() --
    // onchange (not oninput), no full render() here either.
    const zielInput = el('input', {
      type: 'number', step: '0.1', min: '0', value: target != null ? target.toFixed(1) : '', style: 'width:90px;',
      id: 'tp-ziel-' + wheel, onchange: (e) => {
        const v = parseFloat(e.target.value);
        w.manualTargetBar = (isFinite(v) && v > 0) ? Math.round(v * 10) / 10 : null;
        saveTirePressureData(data);
        state.tirePressureReminder = computeTirePressureReminder(data);
        refreshTirePressureWheelsSection(data);
      }
    });
    card.appendChild(el('div', {class: 'tsettings-row'}, [
      el('div', {class: 'tsettings-row-main'}, [
        el('label', {}, ['Zieldruck']),
        el('span', {class: 'tsettings-input-wrap'}, [zielInput, el('span', {class: 'tsettings-unit'}, ['bar'])])
      ])
    ]));
  }

  const chips = el('div', {style: 'display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;'}, []);
  if(calcOn){
    // Stable id so refreshTirePressureWheelsSection() can update this chip
    // in place after a settings change, without a full render().
    chips.appendChild(statChip(target.toFixed(1) + ' bar', 'Ziel', null, 'tp-target-' + wheel));
  }
  if(hasBaseline){
    const now = Date.now();
    const estimated = estimateCurrentPressureBar(w.lastBaselineBar, w.lastBaselineAtMs, w.learnedRateBarPerDay, now);
    const ageDays = Math.round((now - w.lastBaselineAtMs) / 86400000);
    const ageText = ageDays <= 0 ? 'heute' : `vor ${ageDays} Tag${ageDays === 1 ? '' : 'en'}`;
    chips.appendChild(statChip(w.lastBaselineBar.toFixed(1) + ' bar', `Aufgepumpt (${ageText})`));
    const low = target != null && isPressureLow(estimated, target, s.reminderThresholdPercent);
    chips.appendChild(statChip(estimated.toFixed(1) + ' bar', 'Geschätzt aktuell', low ? 'color:var(--cross); background:var(--cross-bg);' : null, 'tp-estimated-' + wheel));
  }
  card.appendChild(chips);

  // dataset.auto marks the field as still showing the auto-filled target --
  // refreshTirePressureWheelsSection() only overwrites it while that holds,
  // so a value the rider typed by hand is never clobbered by a later
  // settings-driven target change. Falls back to '' (no auto-fill) while
  // calc is off and no manual target has been entered yet.
  if(!hasBaseline){
    const aufpumpenInput = el('input', {
      type: 'number', step: '0.1', min: '0', value: target != null ? target.toFixed(1) : '', style: 'width:90px;',
      id: 'tp-aufpumpen-' + wheel, oninput: e => { e.target.dataset.auto = 'false'; }
    });
    aufpumpenInput.dataset.auto = 'true';
    card.appendChild(el('div', {class: 'tsettings-row'}, [
      el('div', {class: 'tsettings-row-main'}, [
        el('label', {}, ['Aufgepumpt auf']),
        el('span', {class: 'tsettings-input-wrap'}, [aufpumpenInput, el('span', {class: 'tsettings-unit'}, ['bar'])])
      ])
    ]));
    card.appendChild(el('button', {class: 'btn secondary', style: 'margin-top:8px;', onclick: () => {
      const bar = parseFloat(aufpumpenInput.value);
      if(!(isFinite(bar) && bar > 0)) return;
      w.lastBaselineBar = Math.round(bar * 10) / 10;
      w.lastBaselineAtMs = Date.now();
      saveTirePressureData(data);
      state.tirePressureReminder = computeTirePressureReminder(data);
      render();
    }}, ['Aufgepumpt']));
  }

  if(hasBaseline){
    const gemessenInput = el('input', {type: 'number', step: '0.1', min: '0', style: 'width:90px;'});
    const neuInput = el('input', {
      type: 'number', step: '0.1', min: '0', value: target != null ? target.toFixed(1) : '', style: 'width:90px;',
      id: 'tp-neu-' + wheel, oninput: e => { e.target.dataset.auto = 'false'; }
    });
    neuInput.dataset.auto = 'true';
    const remeasureBlock = el('div', {style: 'margin-top:14px; padding-top:14px; border-top:1px solid var(--line);'});
    remeasureBlock.appendChild(el('div', {style: 'display:flex; align-items:center; gap:6px; margin-bottom:8px;'}, [
      'Nachmessen & neu aufpumpen',
      infoButton('Ein Schritt für beides: berechnet aus der gemessenen Restluft seit dem letzten Aufpumpen die Verlustrate (fließt per gleitendem Durchschnitt in die künftige Schätzung ein) und setzt den neuen Ausgangspunkt auf den frisch aufgepumpten Wert.')
    ]));
    remeasureBlock.appendChild(el('div', {class: 'tsettings-row'}, [
      el('div', {class: 'tsettings-row-main'}, [
        el('label', {}, ['Gemessen']),
        el('span', {class: 'tsettings-input-wrap'}, [gemessenInput, el('span', {class: 'tsettings-unit'}, ['bar'])])
      ])
    ]));
    remeasureBlock.appendChild(el('div', {class: 'tsettings-row'}, [
      el('div', {class: 'tsettings-row-main'}, [
        el('label', {}, ['Neu aufgepumpt auf']),
        el('span', {class: 'tsettings-input-wrap'}, [neuInput, el('span', {class: 'tsettings-unit'}, ['bar'])])
      ])
    ]));
    remeasureBlock.appendChild(el('button', {class: 'btn secondary', style: 'margin-top:4px;', onclick: () => {
      const measured = parseFloat(gemessenInput.value);
      const neu = parseFloat(neuInput.value);
      if(!applyNachmessenUpdate(w, measured, neu, Date.now())) return;
      saveTirePressureData(data);
      state.tirePressureReminder = computeTirePressureReminder(data);
      render();
    }}, ['Nachmessen & neu aufpumpen']));
    card.appendChild(remeasureBlock);
  }

  return card;
}

// Fills #tp-wheels-container (either the two wheel cards or the empty-state
// card) from scratch. Used both for the initial render and, from
// refreshTirePressureWheelsSection() below, for the rare structural case
// where settingsReady itself flips (the wheel cards need to appear/disappear)
// -- still scoped to this one container, not a full app render().
function populateTirePressureWheelsSection(container, data){
  container.innerHTML = '';
  const s = data.settings;
  // With the calculator off there's nothing to wait on -- the wheel cards
  // show immediately and the rider fills in "Zieldruck" themselves per wheel.
  const settingsReady = s.calculatorEnabled === false || (isFinite(s.riderWeightKg) && s.riderWeightKg > 0
    && isFinite(s.bikeWeightKg) && s.bikeWeightKg > 0
    && isFinite(s.tireWidthMm) && s.tireWidthMm > 0);
  if(!settingsReady){
    const emptyCard = el('div', {class: 'card'});
    emptyCard.appendChild(el('div', {class: 'empty-state'}, ['Fahrergewicht, Radgewicht und Reifenbreite eingeben, um Zielwerte zu berechnen.']));
    container.appendChild(emptyCard);
    return;
  }
  container.appendChild(buildTireWheelCard(data, 'front', 'Vorderrad'));
  container.appendChild(buildTireWheelCard(data, 'rear', 'Hinterrad'));
}

// Scoped, no-render() refresh of the per-wheel target-pressure display after
// a tirePressureNumberRow() settings change (see there for why render() is
// avoided). Normal case: the wheel cards are already showing, so just update
// their "Ziel" text and "Geschätzt aktuell" low-pressure styling in place by
// id. Rare case: settingsReady itself changed (rider just finished or
// cleared riderWeightKg/bikeWeightKg/tireWidthMm) -- that's a structural
// swap between the empty-state card and the wheel cards, handled by rebuild-
// ing just #tp-wheels-container via populateTirePressureWheelsSection(),
// still without touching the rest of the page.
function refreshTirePressureWheelsSection(data){
  const container = document.getElementById('tp-wheels-container');
  if(!container) return; // not currently on the Reifendruck page
  const s = data.settings;
  const settingsReady = s.calculatorEnabled === false || (isFinite(s.riderWeightKg) && s.riderWeightKg > 0
    && isFinite(s.bikeWeightKg) && s.bikeWeightKg > 0
    && isFinite(s.tireWidthMm) && s.tireWidthMm > 0);
  // tp-card-front always exists once the wheel cards are showing, regardless
  // of calculator mode OR baseline state (unlike tp-target-front, which only
  // renders with the calculator on, and tp-aufpumpen-front, which disappears
  // once a baseline is logged) -- so it's the one reliable presence marker.
  const wheelsPresent = !!document.getElementById('tp-card-front');
  if(settingsReady !== wheelsPresent){
    populateTirePressureWheelsSection(container, data);
    return;
  }
  if(!settingsReady) return; // still incomplete, empty-state already showing

  ['front', 'rear'].forEach(wheel => {
    const target = getWheelTargetBar(data, wheel);
    const targetChip = document.getElementById('tp-target-' + wheel);
    if(targetChip){
      const valueEl = targetChip.querySelector('.v');
      if(valueEl) valueEl.textContent = target.toFixed(1) + ' bar';
    }

    const autoValue = target != null ? target.toFixed(1) : '';
    ['tp-aufpumpen-' + wheel, 'tp-neu-' + wheel].forEach(id => {
      const input = document.getElementById(id);
      if(input && input.dataset.auto === 'true') input.value = autoValue;
    });

    const w = data[wheel];
    if(w.lastBaselineBar == null || w.lastBaselineAtMs == null) return;
    const estimatedChip = document.getElementById('tp-estimated-' + wheel);
    if(!estimatedChip) return;
    const estimated = estimateCurrentPressureBar(w.lastBaselineBar, w.lastBaselineAtMs, w.learnedRateBarPerDay, Date.now());
    const low = target != null && isPressureLow(estimated, target, s.reminderThresholdPercent);
    estimatedChip.style.cssText = low ? 'color:var(--cross); background:var(--cross-bg);' : '';
  });
}

function renderReifendruckPage(){
  const frag = document.createDocumentFragment();
  const data = state.tirePressure;

  // No other loaded (non-empty/non-error) page repeats its own nav label as
  // a bare title-only card (renderProfilPage()/renderTrainerPage()'s happy
  // paths have no page-title element at all; their `<h2>title</h2>` only
  // shows up inside the loading/error/empty-state guard cards). Since
  // Reifendruck's title genuinely doesn't fit inside either functional card
  // below (it names the whole page, not just "Angaben"), a lightweight
  // heading directly in the page -- not wrapped in its own bordered `.card`
  // -- is the closest match: `.page-title` reuses `.card h2`'s exact type
  // treatment (see CSS) instead of inventing a new heading style.
  frag.appendChild(el('h2', {class: 'page-title'}, ['Reifendruck']));

  frag.appendChild(renderTirePressureSettingsCard(data));

  // .tp-wheels-row (see CSS): 2-column on >=900px (.app's own tablet/
  // desktop breakpoint), single column on mobile. Class lives on the
  // container itself so it applies whichever populateTirePressureWheelsSection()
  // fills it with (the two wheel cards, or the single empty-state card --
  // :only-child in the CSS handles that single-card case).
  const wheelsContainer = el('div', {id: 'tp-wheels-container', class: 'tp-wheels-row'});
  populateTirePressureWheelsSection(wheelsContainer, data);
  frag.appendChild(wheelsContainer);

  frag.appendChild(buildChainWearCard());

  return frag;
}

// Dismissible startup notice (see init()/state.tirePressureReminder) --
// dismissal is session-only (state.tirePressureReminderDismissed), never
// persisted. Rendered inline as a normal render()-driven card (unlike
// infoButton()'s direct-DOM toggling) since this isn't a rapid-toggle
// interaction, just a one-off per-session notice.
function renderTirePressureBanner(){
  const r = state.tirePressureReminder;
  if(!r || state.tirePressureReminderDismissed || (!r.front && !r.rear)) return null;
  const data = state.tirePressure;
  const now = Date.now();
  const parts = [];
  ['front', 'rear'].forEach(wheel => {
    if(!r[wheel]) return;
    const w = data[wheel];
    const target = getWheelTargetBar(data, wheel);
    if(target == null) return; // calculator off, rider hasn't entered a manual target yet
    const estimated = estimateCurrentPressureBar(w.lastBaselineBar, w.lastBaselineAtMs, w.learnedRateBarPerDay, now);
    parts.push(`${wheel === 'front' ? 'Vorderrad' : 'Hinterrad'}: ca. ${estimated.toFixed(1)} bar, Ziel ${target.toFixed(1)} bar`);
  });
  if(parts.length === 0) return null;
  const text = `Reifendruck vermutlich niedrig (${parts.join('; ')}) — Seite „Reifendruck" öffnen?`;

  return el('div', {class: 'card', style: 'border-color:var(--cross); display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;', onclick: () => {
    state.activePage = 'reifendruck';
    render();
  }}, [
    el('div', {style: 'color:var(--cross); font-size:13px;'}, [text]),
    el('button', {class: 'btn secondary', style: 'flex-shrink:0;', onclick: (e) => {
      e.stopPropagation();
      state.tirePressureReminderDismissed = true;
      render();
    }}, ['×'])
  ]);
}

// Kettenverschleiß card (Task 2) -- same barRow()/"Zurückgesetzt" visual
// treatment as renderProfilKernGearCard()'s Ausrüstung bars, but a single
// independent component instead of a per-gear-object GEAR_COMPONENTS loop.
// `totalDistanceM` is captured once here and reused in both closures below
// (reset button, threshold input) rather than re-summed at click time --
// same "closure captures the value as of this render()" convention as
// renderProfilKernGearCard()'s `g.distance` closures.
function buildChainWearCard(){
  const chainWear = state.chainWear;
  const distanceSinceResetM = getChainWearDistanceM(chainWear.resetAtMs);
  const status = gearWearStatus(distanceSinceResetM, 0, chainWear.thresholdKm);
  const color = status.level === 'danger' ? 'var(--head)' : status.level === 'warn' ? 'var(--cross)' : 'var(--tail)';

  const card = el('div', {class: 'card'});
  card.appendChild(el('h2', {}, ['Kette']));

  const row = barRow('Seit dem Wachsen', Math.min(100, status.pct), color, `${Math.round(status.sinceKm)} / ${chainWear.thresholdKm} km`);
  row.appendChild(el('button', {
    class: 'btn secondary', style: 'margin-left:8px; padding:2px 9px; font-size:11px; flex-shrink:0;',
    onclick: () => {
      state.chainWear = applyChainWearReset(chainWear);
      saveChainWearData(state.chainWear);
      state.chainWearReminder = computeChainWearReminder(state.chainWear, getChainWearDistanceM(state.chainWear.resetAtMs));
      render();
    }
  }, ['Gewachst']));
  card.appendChild(row);

  // Unlike GEAR_COMPONENTS.intervalKm (a hardcoded constant), the threshold
  // here is rider-editable -- same onchange-persist convention as
  // settingsFieldRow()/tirePressureNumberRow() (onchange, not oninput, so a
  // render() never fires mid-keystroke). Invalid/cleared input resets back
  // to the last valid value, same reset-and-reflect-in-the-DOM idiom as
  // tirePressureNumberRow()'s `defaultValue` handling.
  const thresholdInput = el('input', {
    type: 'number', id: 'chain-threshold', step: 100, min: '1', value: chainWear.thresholdKm,
    onchange: (e) => {
      const v = parseFloat(e.target.value);
      if(isFinite(v) && v > 0){
        chainWear.thresholdKm = v;
      } else {
        e.target.value = chainWear.thresholdKm;
      }
      saveChainWearData(chainWear);
      state.chainWearReminder = computeChainWearReminder(chainWear, distanceSinceResetM);
      render();
    }
  });
  card.appendChild(el('div', {class: 'tsettings-row', style: 'margin-top:12px;'}, [
    el('div', {class: 'tsettings-row-main'}, [
      el('label', {for: 'chain-threshold'}, ['Schwelle']),
      el('span', {class: 'tsettings-input-wrap'}, [thresholdInput, el('span', {class: 'tsettings-unit'}, ['km'])])
    ])
  ]));

  return card;
}

// Dismissible startup/session notice, exact same pattern as
// renderTirePressureBanner() above (session-only dismissed flag, clickable
// card that navigates to Reifendruck, `e.stopPropagation()` on the × so
// dismissing doesn't also navigate) -- triggers on the harder "danger"
// level (pct>=100) specifically, not the softer "warn" pre-level.
function renderChainWearBanner(){
  if(!state.chainWearReminder || state.chainWearReminderDismissed) return null;
  const chainWear = state.chainWear;
  const distanceSinceResetM = getChainWearDistanceM(chainWear.resetAtMs);
  const status = gearWearStatus(distanceSinceResetM, 0, chainWear.thresholdKm);
  const text = `Kette sollte bald neu gewachst werden (${Math.round(status.sinceKm)} / ${chainWear.thresholdKm} km) — Seite „Reifendruck" öffnen?`;

  return el('div', {class: 'card', style: 'border-color:var(--cross); display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;', onclick: () => {
    state.activePage = 'reifendruck';
    render();
  }}, [
    el('div', {style: 'color:var(--cross); font-size:13px;'}, [text]),
    el('button', {class: 'btn secondary', style: 'flex-shrink:0;', onclick: (e) => {
      e.stopPropagation();
      state.chainWearReminderDismissed = true;
      render();
    }}, ['×'])
  ]);
}

// ---------- init ----------
async function init(){
  // Synchronous localStorage load + reminder check, done before the first
  // render() so the startup banner (if any) is present on first paint
  // instead of popping in a frame later.
  state.tirePressure = loadTirePressureData();
  state.tirePressureReminder = computeTirePressureReminder(state.tirePressure);

  // Same synchronous-before-first-paint idea as tirePressure above --
  // getChainWearDistanceM() reads straight from localStorage
  // (loadAktivitaetenListCache()), so unlike the old state.activities-based
  // version this is already correct on first paint, not stuck at 0km until
  // fetchActivities() resolves. Still recomputed again in loadActivitiesStep()
  // for good measure (harmless, cheap).
  state.chainWear = loadChainWearData();
  state.chainWearReminder = computeChainWearReminder(state.chainWear, getChainWearDistanceM(state.chainWear.resetAtMs));

  render();

  state.hammerheadConnected = !!(await loadStoredHammerheadToken());

  // Strava just redirected back to this page with ?code=...
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code");
  const stateParam = params.get("state");
  const errorParam = params.get("error");
  let justConnected = false;

  if(codeParam && stateParam === "hammerhead"){
    // buildHammerheadAuthUrl() setzt immer state=hammerhead; Stravas
    // buildAuthUrl() schickt gar keinen state-Parameter -- eindeutig
    // unterscheidbar auf derselben Landing-Page.
    window.history.replaceState({}, document.title, window.location.pathname);
    await connectWithHammerheadCode(codeParam);
  } else if(errorParam && stateParam === "hammerhead"){
    window.history.replaceState({}, document.title, window.location.pathname);
    state.trainerPage.hammerheadResult = { ok:false, message:"Verbindung zu Hammerhead abgebrochen." };
    render();
  } else if(codeParam){
    window.history.replaceState({}, document.title, window.location.pathname);
    await connectWithCode(codeParam);
    justConnected = true;
  }

  if(!justConnected){
    const stored = await loadStoredToken();
    if(stored){
      state.loading.connect = true;
      startupProgressBegin(1 + autoLoadStepCount());
      startupProgressStep("Token wird aktualisiert…");
      render();
      try{
        const tokenData = await refreshAccessToken(stored);
        state.accessToken = tokenData.access_token;
        await saveToken(tokenData.refresh_token);
        state.connected = true;
        await loadActivitiesAndSegments();
      }catch(e){
        // stored token invalid, stay on connect screen
      }
      state.loading.connect = false;
      startupProgressEnd();
      render();
    }
  }
}
init();
</script>
