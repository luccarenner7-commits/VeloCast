async function connectWithCode(code){
  state.error = null;
  state.loading.connect = true; render();
  try{
    const tokenData = await exchangeCode(code);
    state.accessToken = tokenData.access_token;
    state.athlete = tokenData.athlete;
    await saveToken(tokenData.refresh_token);
    state.connected = true;
    await loadActivitiesAndSegments();
  }catch(e){
    state.error = e.message || "Verbindung fehlgeschlagen.";
  }
  state.loading.connect = false;
  render();
}

async function loadActivitiesAndSegments(){
  state.loading.activities = true; render();
  try{
    state.activities = await fetchActivities(state.accessToken);
    if(state.activities.length){
      await selectActivity(state.activities[0]);
    }
  }catch(e){ state.error = e.message; }
  state.loading.activities = false;

  state.loading.segments = true; render();
  try{
    state.segments = await fetchStarredSegments(state.accessToken);
    await loadSegmentExtras(state.segments, segmentBucket("starred"));
  }catch(e){ state.error = e.message; }
  state.loading.segments = false;
  render();
}

// Bundles a segment source's four parallel state fields (list + weather +
// details + PR-watts) into one object, so the segment-rendering pipeline
// (renderSegmentRow, computeSegmentStatChips, ensureSegmentPrWatts, etc.) can
// operate identically on either the user's starred segments or the
// route-explore segments (Task 3) without duplicating ~150 lines of rendering
// logic per source. "starred" == today's Markierte Segmente / state.segments;
// "route" == the new Segmente-auf-der-Strecke / state.routeSegments.
function segmentBucket(source){
  return source === "route"
    ? { source, list: state.routeSegments, weather: state.routeSegmentWeather, details: state.routeSegmentDetails, prWatts: state.routeSegmentPrWatts }
    : { source: "starred", list: state.segments, weather: state.segmentWeather, details: state.segmentDetails, prWatts: state.segmentPrWatts };
}

// True while the map should be showing a single segment's detail view
// (instead of the full route / the plain segment list) — i.e. a segment is
// selected AND it belongs to whichever bucket is relevant on the currently
// active page (a starred segment selected on "Meine Segmente" stays shown
// there even if you'd left activePage on "route" some other way; a
// route-explore segment only makes sense inside the route page). Centralized
// here so renderRouteCard(), renderSegmentsPage(), currentRouteKey() and
// mountRouteMap() can't disagree about it.
function isShowingSegmentDetail(){
  if(!state.selectedSegmentId) return false;
  if(state.activePage === "segments") return state.selectedSegmentSource === "starred";
  if(state.activePage === "route") return state.selectedSegmentSource === "route";
  return false;
}

// Clears the route-explore segment bucket (Task 3) — called wherever the
// underlying route identity changes (new activity/route/GPX selected), same
// set of call sites as the existing elevationProfile/windFieldPoints resets
// below, since a previous route's nearby-segments list has no meaning for a
// newly selected route. Also drops the current selection if it pointed at a
// route-explore segment that's about to be wiped out from under it.
function resetRouteSegments(){
  state.routeSegments = [];
  state.routeSegmentWeather = {};
  state.routeSegmentDetails = {};
  state.routeSegmentPrWatts = {};
  if(state.selectedSegmentSource === "route"){
    state.selectedSegmentId = null;
    state.selectedSegmentSource = null;
  }
}

async function selectActivity(activity){
  state.selectedActivity = activity;
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  render();
  if(!activity.map || !activity.map.summary_polyline){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  const coords = decodePolyline(activity.map.summary_polyline);
  state.fullRouteCoords = coords;
  const cumDist = buildCumulativeDistances(coords);
  state.routePoints = pickRoutePoints(coords, cumDist, state.routePointDistanceKm);
  render();
  ensureRouteSegments(); // not awaited - independent of weather, runs in the background (same pattern as ensureWindField)
  await loadRouteWeather();
}

// Re-samples routePoints from the already-loaded fullRouteCoords — used
// whenever Punktabstand changes, and after loading a GPX file or a saved
// Strava route, since the full coordinate list doesn't need to change,
// just how it's sliced into wind-sample points. Deliberately does NOT touch
// elevationProfile/windFieldPoints/routeSegments — Punktabstand changing
// doesn't change which route is loaded, so none of those need to reset.
function recomputeRoutePoints(){
  if(!state.fullRouteCoords.length) return;
  const cumDist = buildCumulativeDistances(state.fullRouteCoords);
  state.routePoints = pickRoutePoints(state.fullRouteCoords, cumDist, state.routePointDistanceKm);
  render();
  loadRouteWeather();
}

function selectRouteSourceTab(tab){
  state.routeSourceTab = tab;
  render();
  if(tab === "routes") ensureStravaRoutesLoaded();
}

async function ensureStravaRoutesLoaded(){
  if(state.stravaRoutes.length || state.loading.routes) return;
  state.loading.routes = true; render();
  try{
    state.stravaRoutes = await fetchStravaRoutes(state.accessToken);
  }catch(e){
    state.error = e.message;
  }
  state.loading.routes = false;
  render();
}

async function selectStravaRoute(route){
  state.selectedActivity = { id: "route-" + route.id, name: route.name, isRoute: true };
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  render();
  const poly = route.map && (route.map.polyline || route.map.summary_polyline);
  if(!poly){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  state.fullRouteCoords = decodePolyline(poly);
  recomputeRoutePoints();
  ensureRouteSegments(); // not awaited, see selectActivity()
}

// ---------- GPX import ----------
// Lets the wind/map pipeline run on any route, not just past Strava
// activities — works without being connected to Strava at all.
function parseGpxTrack(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if(doc.querySelector("parsererror")) return null;
  const points = [...doc.querySelectorAll("trkpt, rtept")];
  const coords = [], eles = [];
  points.forEach(p=>{
    const lat = parseFloat(p.getAttribute("lat"));
    const lon = parseFloat(p.getAttribute("lon"));
    if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    coords.push([lat, lon]);
    const eleEl = p.querySelector("ele");
    const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
    eles.push(Number.isFinite(ele) ? ele : null);
  });
  return coords.length >= 2 ? { coords, eles } : null;
}

async function loadGpxFile(file){
  state.error = null;
  let track = null;
  try{
    track = parseGpxTrack(await file.text());
  }catch(e){
    track = null;
  }
  if(!track){
    state.error = "GPX-Datei konnte nicht gelesen werden.";
    render();
    return;
  }
  state.selectedActivity = { name: file.name.replace(/\.gpx$/i, ""), isGpx: true };
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  state.fullRouteCoords = track.coords;
  state.elevationProfile = track.eles.every(e => e != null)
    ? { distances: buildCumulativeDistances(track.coords), elevations: track.eles }
    : { distances: [], elevations: [] };
  recomputeRoutePoints();
  // No-op if not connected (ensureRouteSegments needs an access token) - a
  // GPX-only route just never gets this data, see renderRouteSegmentsCard().
  ensureRouteSegments();
}

async function loadRouteWeather(){
  if(!state.routePoints.length) return;
  state.loading.weather = true; render();
  const startDate = new Date(state.startTime);
  const weatherResults = [];
  for(const p of state.routePoints){
    const arrival = estimateArrival(startDate, p.distanceKm, state.avgSpeedKmh);
    p.arrivalTime = arrival;
    try{
      const w = await fetchWeather(p.lat.toFixed(4), p.lon.toFixed(4), arrival);
      weatherResults.push(w);
    }catch(e){
      weatherResults.push(null);
    }
  }
  state.weatherAtRoute = weatherResults;
  state.loading.weather = false;
  render();
}

// Fetches per-segment weather + Strava detail (PR, KOM/QOM, elevation,
// effort count) for a list of segments into the given bucket's weather/
// details maps. Shared by both segment sources (see segmentBucket()) — the
// starred-segments flow calls this from loadActivitiesAndSegments(), the
// route-explore flow from ensureRouteSegments() below.
async function loadSegmentExtras(list, bucket){
  for(const seg of list.slice(0, 12)){
    if(seg.start_latlng){
      try{
        const w = await fetchWeather(seg.start_latlng[0].toFixed(4), seg.start_latlng[1].toFixed(4));
        bucket.weather[seg.id] = w;
      }catch(e){
        bucket.weather[seg.id] = null;
      }
    }
    try{
      bucket.details[seg.id] = await fetchSegmentDetail(seg.id, state.accessToken);
    }catch(e){
      bucket.details[seg.id] = null;
    }
    render();
  }
}

// PR power isn't in the segment summary — it takes a whole extra activity
// fetch per segment to find it, so we only do this on demand (when a
// segment is clicked) instead of eagerly for all visible segments, to keep
// Strava API usage down.
async function ensureSegmentPrWatts(seg, bucket){
  if(bucket.prWatts[seg.id] !== undefined) return;
  const detail = bucket.details[seg.id];
  const prActivityId = detail && detail.athlete_segment_stats && detail.athlete_segment_stats.pr_activity_id;
  if(!prActivityId){ bucket.prWatts[seg.id] = null; return; }
  try{
    const activity = await fetchActivityDetail(prActivityId, state.accessToken);
    const effort = (activity.segment_efforts || []).find(e => e.segment && e.segment.id === seg.id);
    bucket.prWatts[seg.id] = (effort && effort.average_watts != null)
      ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
      : null;
  }catch(e){
    bucket.prWatts[seg.id] = null;
  }
  render();
}

// ---------- "Segmente auf der Strecke" (Task 3): Strava public segment
// database via segments/explore, matched against the current route ----------
// segments/explore is bbox-based, caps results per call (historically ~10),
// and has no idea what the route's actual path looks like — a single call
// over the whole route's bounding box would both miss segments (long/winding
// routes) and surface segments that are just "somewhere in that rectangle",
// nowhere near the actual path. So the route gets sliced into several
// smaller bboxes along its length instead (one explore call each, capped),
// results are deduped by id, then filtered down to segments whose start
// point is genuinely close to the route.
const ROUTE_SEGMENT_CHUNK_KM = 8;      // target route-length per bbox chunk
const ROUTE_SEGMENT_MAX_CALLS = 8;     // hard cap on explore API calls per route
const ROUTE_SEGMENT_BBOX_PAD_DEG = 0.01; // ~1.1km padding so segments right at a chunk's edge aren't missed
const ROUTE_SEGMENT_BUFFER_KM = 0.3;   // proximity buffer (~300m) to state.fullRouteCoords for the final path-relevance filter

// Splits the route into up to ROUTE_SEGMENT_MAX_CALLS bounding boxes along
// its length. If distance-based chunking would need more calls than the cap
// (long routes), evenly-spaced chunks covering the FULL route length are
// kept instead of just the first N, so a long route's back half isn't
// silently skipped.
function computeRouteExploreBboxes(coords){
  if(coords.length < 2) return [];
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm <= 0) return [];

  const rawChunkCount = Math.max(1, Math.ceil(totalKm / ROUTE_SEGMENT_CHUNK_KM));
  let chunkIndexes = Array.from({length: rawChunkCount}, (_, i) => i);
  if(rawChunkCount > ROUTE_SEGMENT_MAX_CALLS){
    const picked = new Set();
    for(let i=0;i<ROUTE_SEGMENT_MAX_CALLS;i++){
      picked.add(Math.round(i * (rawChunkCount - 1) / (ROUTE_SEGMENT_MAX_CALLS - 1)));
    }
    chunkIndexes = [...picked].sort((a,b)=>a-b);
  }

  const chunkKm = totalKm / rawChunkCount;
  const bboxes = [];
  chunkIndexes.forEach(i=>{
    const fromKm = i * chunkKm;
    const toKm = Math.min(totalKm, (i + 1) * chunkKm);
    let lats = [], lons = [];
    for(let k=0;k<coords.length;k++){
      if(cumDist[k] >= fromKm - 1e-9 && cumDist[k] <= toKm + 1e-9){
        lats.push(coords[k][0]); lons.push(coords[k][1]);
      }
    }
    if(!lats.length) return;
    bboxes.push({
      swLat: Math.min(...lats) - ROUTE_SEGMENT_BBOX_PAD_DEG,
      swLon: Math.min(...lons) - ROUTE_SEGMENT_BBOX_PAD_DEG,
      neLat: Math.max(...lats) + ROUTE_SEGMENT_BBOX_PAD_DEG,
      neLon: Math.max(...lons) + ROUTE_SEGMENT_BBOX_PAD_DEG
    });
  });
  return bboxes;
}

// Fetches + filters segments along the current route into state.routeSegments.
// No-ops (and leaves the card showing its "connect to Strava" hint instead)
// when not connected, since the explore endpoint needs an access token and
// has no meaning for a GPX-only route.
async function ensureRouteSegments(){
  if(!state.connected || !state.fullRouteCoords.length) return;
  state.loading.routeSegments = true; render();
  try{
    const bboxes = computeRouteExploreBboxes(state.fullRouteCoords);
    const seen = new Map();
    for(const bbox of bboxes){
      try{
        const data = await fetchSegmentExplore(bbox, state.accessToken);
        (data.segments || []).forEach(s=>{
          if(!seen.has(s.id)) seen.set(s.id, s);
        });
      }catch(e){
        // one chunk failing shouldn't block the rest of the route
      }
    }
    // Path-relevance filter: keep only segments whose start point is close
    // to SOME point on the actual route, not merely inside one of the
    // (rectangular, path-agnostic) bboxes above — same level of
    // approximation the per-list-item wind tag already uses elsewhere in
    // this file (checking against the route's start point only).
    const near = [...seen.values()].filter(s =>
      s.start_latlng && state.fullRouteCoords.some(c => haversineKm(c, s.start_latlng) <= ROUTE_SEGMENT_BUFFER_KM)
    ).map(s => ({
      // segments/explore returns `avg_grade`, while the starred-segments /
      // segment-detail endpoints use `average_grade` — normalize here so
      // renderSegmentRow() can read one consistent field regardless of
      // source bucket.
      ...s,
      average_grade: s.average_grade != null ? s.average_grade : s.avg_grade
    }));
    state.routeSegments = near;
    await loadSegmentExtras(state.routeSegments, segmentBucket("route"));
  }catch(e){
    state.error = e.message;
  }
  state.loading.routeSegments = false;
  render();
}

// Distance-weighted tail/cross/head wind-mix for a route/activity list chip.
// The polyline is decoded and split into bearings entirely client-side
// (free); only a single Open-Meteo call is made (wind at the start point) to
// classify all of those segments against, so this stays cheap enough to run
// for every visible list item.
async function ensureListItemWindTag(key, polyline){
  if(state.routeWindCache[key] !== undefined) return;
  state.routeWindCache[key] = null;
  if(!polyline) return;
  const coords = decodePolyline(polyline);
  if(coords.length < 2) return;
  try{
    const w = await fetchWeather(coords[0][0].toFixed(4), coords[0][1].toFixed(4));
    let tailDist = 0, crossDist = 0, totalDist = 0;
    for(let i=0;i<coords.length-1;i++){
      const dist = haversineKm(coords[i], coords[i+1]);
      if(dist <= 0) continue;
      const bearing = bearingBetween(coords[i], coords[i+1]);
      const rel = windRelative(bearing, w.windDir);
      if(rel.type === "tail") tailDist += dist;
      else if(rel.type === "cross") crossDist += dist;
      totalDist += dist;
    }
    if(totalDist <= 0) return;
    const tailPct = Math.round(tailDist / totalDist * 100);
    const crossPct = Math.round(crossDist / totalDist * 100);
    const headPct = Math.max(0, 100 - tailPct - crossPct);
    state.routeWindCache[key] = { tailPct, crossPct, headPct };
    render();
  }catch(e){
    // leave cached as null (no rating shown)
  }
}

function renderListItemWindTag(key){
  const mix = state.routeWindCache[key];
  if(!mix) return null;
  return el("div", {class:"wind-mix-mini"}, [
    el("div", {class:"tag mini tail", title:"Rückenwind"}, [`${mix.tailPct}%`]),
    el("div", {class:"tag mini cross", title:"Seitenwind"}, [`${mix.crossPct}%`]),
    el("div", {class:"tag mini head", title:"Gegenwind"}, [`${mix.headPct}%`])
  ]);
}

function renderRouteCard(){
  const card = el("div", {class:"card"});

  if(isShowingSegmentDetail()){
    const bucket = segmentBucket("route");
    const seg = bucket.list.find(s => s.id === state.selectedSegmentId);
    card.appendChild(el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;"}, [
      el("h2", {style:"margin:0;"}, ["Segment"]),
      el("button", {class:"btn secondary", style:"padding:8px 14px; font-size:12px;", onclick:()=>{ state.selectedSegmentId = null; state.selectedSegmentSource = null; render(); }}, ["Zur Strecke"])
    ]));

    if(seg){
      card.appendChild(renderSegmentRow(seg, bucket, {clickable:false}));
    }

    card.appendChild(routeMapContainer);
    return card;
  }

  card.appendChild(el("h2", {}, ["Strecke"]));

  // Sync the persistent settings-row inputs' live values from state before
  // (re)inserting them — see the "persistent settings-row inputs" comment
  // near their declaration below for why these are never recreated by el().
  syncPersistentInputValue(startTimeInput, state.startTime);
  syncPersistentInputValue(avgSpeedInput, String(state.avgSpeedKmh));
  syncPersistentInputValue(routePointDistanceSelect, String(state.routePointDistanceKm));

  const settingsRow = el("div", {class:"settings-row"}, [
    el("div", {}, [
      el("label", {}, ["Startzeit"]),
      el("div", {style:"display:flex; justify-content:center;"}, [
        startTimeInput
      ])
    ]),
    el("div", {}, [
      el("label", {}, ["Ø Geschwindigkeit (km/h)"]),
      avgSpeedInput
    ]),
    el("div", {}, [
      el("label", {}, ["Punktabstand"]),
      routePointDistanceSelect
    ])
  ]);
  card.appendChild(settingsRow);
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:12px; font-size:12px;"}, ["Wetterwerte werden jeweils für den erwarteten Ankunftszeitpunkt an diesem Punkt berechnet."]));

  {
    const tabs = [];
    if(state.connected){
      tabs.push({id:"routes", label:"Routen"});
      tabs.push({id:"activities", label:"Fahrten"});
    }
    tabs.push({id:"gpx", label:"GPX"});
    // routeSourceTab may point at a tab that isn't currently visible (e.g.
    // "activities" is the initial default but hidden until Strava is
    // connected) - fall back to something that's actually shown.
    if(!tabs.some(t => t.id === state.routeSourceTab)){
      state.routeSourceTab = state.connected ? "routes" : "gpx";
    }

    card.appendChild(el("div", {class:"source-tabs"}, tabs.map(t =>
      el("div", {
        class:"source-tab" + (state.routeSourceTab === t.id ? " active" : ""),
        onclick: ()=>selectRouteSourceTab(t.id)
      }, [t.label])
    )));

    if(state.routeSourceTab === "routes"){
      if(state.loading.routes){
        card.appendChild(el("div", {class:"loading"}, ["Lade Routen…"]));
      } else if(state.stravaRoutes.length){
        const list = el("div", {});
        state.stravaRoutes.slice(0,10).forEach(route=>{
          const key = "route-" + route.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === key;
          const km = (route.distance/1000).toFixed(1);
          const poly = route.map && (route.map.polyline || route.map.summary_polyline);
          ensureListItemWindTag(key, poly);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectStravaRoute(route)}, [
            el("div", {}, [
              el("div", {class:"name"}, [route.name]),
              el("div", {class:"meta"}, [`${km} km · ${Math.round(route.elevation_gain || 0)} Hm`])
            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else {
        card.appendChild(el("div", {class:"muted"}, ["Keine gespeicherten Routen gefunden."]));
      }
    } else if(state.routeSourceTab === "activities"){
      if(state.loading.activities){
        card.appendChild(el("div", {class:"loading"}, ["Lade letzte Aktivitäten…"]));
      } else if(state.activities.length){
        const list = el("div", {});
        state.activities.filter(a => a.type === "Ride" || a.type === "VirtualRide" || a.type === "GravelRide" || a.type === "MountainBikeRide" || !a.type).slice(0,5).forEach(a=>{
          const key = "activity-" + a.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === a.id;
          const km = (a.distance/1000).toFixed(1);
          const date = new Date(a.start_date_local).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
          ensureListItemWindTag(key, a.map && a.map.summary_polyline);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectActivity(a)}, [
            el("div", {}, [
              el("div", {class:"name"}, [a.name]),
              el("div", {class:"meta"}, [`${date} · ${km} km`])
            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else if(!state.fullRouteCoords.length){
        card.appendChild(el("div", {class:"muted"}, ["Keine Aktivitäten gefunden."]));
      }
    } else if(state.routeSourceTab === "gpx"){
      card.appendChild(renderGpxUploadRow());
    }
  }

  // The map container is appended whenever we have coordinates at all —
  // including while weather is still loading — rather than only once
  // weatherAtRoute is populated. It's the same persistent routeMapContainer
  // node every time, so keeping it present across the
  // loading-true -> loading-false transition means mountRouteMap() never
  // sees it disappear and tear down the Leaflet instance in between.
  if(state.fullRouteCoords.length){
    if(state.loading.weather){
      card.appendChild(el("div", {class:"loading", style:"margin-top:14px;"}, ["Berechne Wind entlang der Strecke…"]));
    }
    const weatherReady = state.routePoints.length && state.weatherAtRoute.length;
    if(weatherReady){
      const mix = computeWindMix();
      if(mix){
        // Hero percentages above a thin pill bar: the three numbers are the
        // primary metric here, the bar is a secondary at-a-glance visual.
        card.appendChild(el("div", {style:"margin-top:14px;"}, [
          el("div", {class:"wind-mix-stats"}, [
            el("div", {class:"wind-mix-stat", style:"align-items:flex-start;"}, [
              el("div", {class:"v", style:"color:var(--tail);"}, [`${mix.tailPct}%`]),
              el("div", {class:"l"}, ["Rückenwind"])
            ]),
            el("div", {class:"wind-mix-stat", style:"align-items:center; text-align:center;"}, [
              el("div", {class:"v", style:"color:var(--cross);"}, [`${mix.crossPct}%`]),
              el("div", {class:"l"}, ["Seitenwind"])
            ]),
            el("div", {class:"wind-mix-stat", style:"align-items:flex-end; text-align:right;"}, [
              el("div", {class:"v", style:"color:var(--head);"}, [`${mix.headPct}%`]),
              el("div", {class:"l"}, ["Gegenwind"])
            ])
          ]),
          el("div", {class:"wind-mix-bar"}, [
            el("div", {style:`flex:${mix.tailPct}; background:var(--tail);`}),
            el("div", {style:`flex:${mix.crossPct}; background:var(--cross);`}),
            el("div", {style:`flex:${mix.headPct}; background:var(--head);`})
          ])
        ]));
      }
      const ringsRow = renderRangeRingsRow();
      if(ringsRow) card.appendChild(ringsRow);
      const strongWind = computeStrongWindWarning();
      if(strongWind){
        const parts = [];
        if(strongWind.maxWind >= STRONG_WIND_KMH) parts.push(`${Math.round(strongWind.maxWind)} km/h Wind`);
        if(strongWind.maxGust >= STRONG_GUST_KMH) parts.push(`${Math.round(strongWind.maxGust)} km/h Böen`);
        // No emoji/glyph icon — the bold "WARNUNG" label plus the head-red
        // border/background already carries the meaning (and reuses the
        // real wind-favorability color, since this genuinely is about wind).
        card.appendChild(el("div", {style:"margin-top:14px; padding:10px 12px; border-radius:var(--r-sm); background:var(--head-bg); border:1px solid var(--head); display:flex; align-items:center; gap:10px;"}, [
          el("span", {style:"font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700; color:var(--head); text-transform:uppercase; letter-spacing:0.05em; flex-shrink:0;"}, ["Warnung"]),
          el("span", {style:"font-size:12.5px; color:var(--head); font-family:'IBM Plex Mono', monospace;"}, [
            `Starker Wind entlang der Strecke: bis zu ${parts.join(" · ")}`
          ])
        ]));
      }
      card.appendChild(el("div", {style:"display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer;", onclick:()=>{ state.windFieldEnabled = !state.windFieldEnabled; render(); }}, [
        el("div", {style:`width:34px; height:20px; border-radius:var(--r-full); flex-shrink:0; background:${state.windFieldEnabled ? "var(--route)" : "var(--asphalt-3)"}; position:relative; transition:background 0.15s;`}, [
          el("div", {style:`width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:2px; left:${state.windFieldEnabled ? "16px" : "2px"}; transition:left 0.15s;`})
        ]),
        el("span", {class:"muted", style:"font-size:12px;"}, [
          "Windfeld der Umgebung anzeigen" + (state.windFieldEnabled && state.loading.windField ? " (lädt…)" : "")
        ])
      ]));
      if(state.windFieldEnabled){
        card.appendChild(el("div", {class:"muted", style:"font-size:10.5px; margin-top:4px;"}, [
          "Windstärke: helles Blau <15 · Blau <30 · dunkleres Blau <45 · dunkelblau ≥45 km/h"
        ]));
      }
    }

    card.appendChild(routeMapContainer);

    if(weatherReady){
      const legend = el("div", {class:"legend", style:"margin-top:10px;"}, [
        el("span",{},[el("span",{class:"swatch", style:"background:var(--tail)"}), "Rückenwind"]),
        el("span",{},[el("span",{class:"swatch", style:"background:var(--cross)"}), "Seitenwind"]),
        el("span",{},[el("span",{class:"swatch", style:"background:var(--head)"}), "Gegenwind"]),
      ]);
      card.appendChild(legend);

      const first = state.weatherAtRoute.find(w=>w);
      if(first){
        const strip = el("div", {class:"weather-strip", style:"margin-top:16px;"});
        state.routePoints.forEach((p,i)=>{
          const w = state.weatherAtRoute[i];
          if(!w) return;
          strip.appendChild(el("div", {class:"weather-chip", onclick:()=>{
            const marker = routeMarkerByIndex[i];
            if(marker){
              if(leafletMapInstance) leafletMapInstance.panTo(marker.getLatLng());
              marker.openPopup();
            }
            const mapEl = document.getElementById("route-map");
            if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
          }}, [
            el("div", {class:"t"}, [Math.round(w.temp) + "°"]),
            el("div", {class:"hr"}, ["Ankunft " + fmtTime(p.arrivalTime) + " · " + p.distanceKm.toFixed(0) + " km"]),
            el("div", {class:"w"}, [w.precip + "% Regen" + (w.uvIndex != null ? " · UV " + Math.round(w.uvIndex) : "")])
          ]));
        });
        card.appendChild(strip);
      }
    }
  } else if(state.selectedActivity){
    card.appendChild(el("div", {class:"muted", style:"margin-top:12px;"}, ["Für diese Aktivität liegt keine Streckenkarte vor."]));
  }

  return card;
}

// Created once and re-inserted (a plain DOM move, not a re-creation) into
// the freshly rebuilt tree on every render() — letting el() create a brand
// new #route-map div each render meant the Leaflet map bound to it (and all
// its map tiles) got torn down and rebuilt from scratch on every single
// render, which is what caused the visible flicker whenever a route was
// selected (multiple renders fire in quick succession while weather loads).
const routeMapContainer = el("div", {id:"route-map", style:"margin-top:14px;"});

// Persistent settings-row inputs — same "created once, re-inserted not
// re-created" pattern as routeMapContainer above. Letting el() build a fresh
// <input>/<select> node on every render() is merely wasteful for a plain
// number/select, but it's actively dangerous for the Startzeit
// datetime-local input: Safari's datetime-local control is backed by a real
// OS-level picker overlay, and WebKit can crash the whole renderer process
// if the DOM node underneath an actively-focused/mid-interaction native
// control gets destroyed and replaced out from under it. That's exactly
// what happened here — this input's own onchange calls loadRouteWeather(),
// which calls render() twice in quick succession (once synchronously when
// weather loading starts, once again when it finishes), and Safari can fire
// `change` per-segment (e.g. right after editing just the hour) while the
// native picker overlay is still open. Keeping the node persistent and only
// ever mutating its .value (never recreating it) avoids that entirely. The
// avg-speed input and Punktabstand select are fixed the same way for
// consistency, since they're the same category of bug even though a plain
// number/select is much less likely to crash outright.
const startTimeInput = el("input", {
  type:"datetime-local", style:"width:100%;",
  onchange:(e)=>{ state.startTime = e.target.value; loadRouteWeather(); }
});
const avgSpeedInput = el("input", {
  type:"number", style:"width:100%;", min:"5", max:"60", step:"1",
  onchange:(e)=>{ state.avgSpeedKmh = parseFloat(e.target.value) || 25; saveSettings(); loadRouteWeather(); }
});
const routePointDistanceSelect = el("select", {
  style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
  onchange:(e)=>{
    state.routePointDistanceKm = parseInt(e.target.value, 10) || 10;
    saveSettings();
    if(state.fullRouteCoords.length) recomputeRoutePoints();
  }
}, [
  el("option", {value:"5"}, ["alle 5 km"]),
  el("option", {value:"10"}, ["alle 10 km"]),
  el("option", {value:"15"}, ["alle 15 km"]),
  el("option", {value:"20"}, ["alle 20 km"]),
  el("option", {value:"25"}, ["alle 25 km"])
]);

// Pushes a fresh state value into a persistent input/select's live .value —
// guarded so it never overwrites a value the user is still actively typing.
// Note: render() does `app.innerHTML = ""` before rebuilding the tree (see
// render() above), which itself synchronously blurs whatever was focused —
// so in practice, by the time this runs from inside renderRouteCard()/
// renderSegmentsCard(), document.activeElement is never still inputEl. That
// blur-on-every-render is a pre-existing property of the "rebuild everything"
// architecture (it happened before this fix too — el() used to hand back a
// brand new node every render either way) and is not what this fix targets;
// it isn't a regression. What matters for the Safari crash is that the same
// <input> Element object survives that detach/reattach instead of being
// destroyed and replaced by a new one (which is what let WebKit's native
// datetime-local picker end up pointing at a torn-down node). The guard is
// still kept, both because it's what was asked for and because it's the
// correct defensive check if this ever gets called from anywhere that
// *doesn't* wipe focus first — and since state.startTime/etc. were only
// ever written here from that same input's own already-committed onchange
// value, re-syncing never actually discards unsaved user input either way.
function syncPersistentInputValue(inputEl, value){
  if(document.activeElement === inputEl) return;
  if(inputEl.value !== value) inputEl.value = value;
}

let leafletMapInstance = null;
let routeMapLayers = null; // L.layerGroup holding everything drawn on top of the base tiles for the current route/segment
let mountedRouteKey = null; // identifies which route/segment leafletMapInstance is currently showing
let routeMarkerByIndex = {}; // routePoints index -> Leaflet marker (for weather-chip clicks)

// Distinguishes "still the same route/segment, just re-rendering with new
// data" (keep the map + tiles, only redraw the overlay layer) from
// "switched to a different route" (full teardown + fresh mount needed).
function currentRouteKey(){
  if(isShowingSegmentDetail()) return "segment-" + state.selectedSegmentSource + "-" + state.selectedSegmentId;
  if(!state.fullRouteCoords.length) return null;
  const a = state.selectedActivity;
  return "route-" + (a ? (a.id || a.name || "") : "");
}

function mountRouteMap(){
  const container = document.getElementById("route-map");
  const key = currentRouteKey();

  if(!container || key === null){
    if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; routeMapLayers = null; mountedRouteKey = null; }
    return;
  }

  const isNewRoute = key !== mountedRouteKey || !leafletMapInstance;
  if(isNewRoute){
    if(leafletMapInstance) leafletMapInstance.remove();
    leafletMapInstance = L.map(container, { scrollWheelZoom:true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap Mitwirkende &copy; CARTO',
      maxZoom: 20,
      subdomains: 'abcd'
    }).addTo(leafletMapInstance);
    routeMapLayers = L.layerGroup().addTo(leafletMapInstance);
    mountedRouteKey = key;
  } else {
    routeMapLayers.clearLayers();
  }

  if(isShowingSegmentDetail()){
    mountSegmentView(leafletMapInstance, routeMapLayers, state.selectedSegmentId, isNewRoute);
  } else {
    mountFullRouteView(leafletMapInstance, routeMapLayers, isNewRoute);
  }
}

function mountSegmentView(map, layers, segId, isNewRoute){
  const bucket = segmentBucket(state.selectedSegmentSource);
  const seg = bucket.list.find(s => s.id === segId);
  const detail = bucket.details[segId];
  const poly = detail && detail.map && (detail.map.polyline || detail.map.summary_polyline);
  if(!seg || !poly) return;

  const coords = decodePolyline(poly);
  const latlngs = coords.map(c => [c[0], c[1]]);

  let color = "#82a2d1", label = escapeHtml(seg.name);
  const w = bucket.weather[segId];
  if(w && seg.start_latlng && seg.end_latlng){
    const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
    const rel = windRelative(bearing, w.windDir);
    color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#f2766b" : "#e2b23e";
    const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
    label = `<b>${escapeHtml(seg.name)}</b><br>${typeLabel} · ${Math.round(w.windSpeed)} km/h`;
  }

  const line = L.polyline(latlngs, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(layers);
  if(isNewRoute) map.fitBounds(line.getBounds(), { padding:[30,30] });
  line.bindPopup(label).openPopup();

  // Start/finish markers use a filled-vs-hollow dot (not color) to tell them
  // apart — "start = green dot, finish = red dot" would silently borrow the
  // tail/head wind vocabulary for an unrelated meaning (these mark route
  // endpoints, not wind favorability).
  L.circleMarker(latlngs[0], { radius:6, weight:2, color:"#f2efe9", fillColor:"#f2efe9", fillOpacity:1 })
    .addTo(layers).bindTooltip("Start");
  L.circleMarker(latlngs[latlngs.length - 1], { radius:6, weight:2, color:"#f2efe9", fillColor:"#14171d", fillOpacity:1 })
    .addTo(layers).bindTooltip("Ziel");

  // wind direction arrow at the segment's midpoint — points where the wind
  // blows toward, absolute compass direction (north-up), same convention
  // as the full-route markers
  if(w){
    const midPoint = latlngs[Math.floor(latlngs.length / 2)];
    const rotateDeg = (w.windDir + 180) % 360;
    const icon = L.divIcon({
      className: "",
      html: `<svg width="26" height="26" viewBox="0 0 16 16" style="transform:rotate(${rotateDeg}deg); filter: drop-shadow(0 0 2px rgba(20,23,29,0.9));">
               <circle cx="8" cy="8" r="2.4" fill="${color}" opacity="0.95"/>
               <line x1="8" y1="13.5" x2="8" y2="3" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
               <path d="M3.8 6.6 L8 2 L12.2 6.6" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>`,
      iconSize: [26,26], iconAnchor: [13,13]
    });
    L.marker(midPoint, { icon }).addTo(layers).bindPopup(label);
  }
}

function mountFullRouteView(map, layers, isNewRoute){
  const coords = state.fullRouteCoords;
  const latlngs = coords.map(c=>[c[0], c[1]]);

  // faint base line — carries the route where no wind data covers it
  const baseLine = L.polyline(latlngs, { color:"#333a47", weight:3, opacity:0.55, lineCap:"round", lineJoin:"round" }).addTo(layers);
  if(isNewRoute) map.fitBounds(baseLine.getBounds(), { padding:[26,26] });

  // optional "Windfeld" overlay — a field of small wind arrows sampled along
  // the route, toggled in renderRouteCard(). Added before the route
  // line/markers below so it stays visually underneath them.
  if(state.windFieldEnabled){
    if(!state.windFieldPoints && !state.loading.windField){
      ensureWindField();
    } else if(state.windFieldPoints){
      state.windFieldPoints.forEach(p=>{
        const color = windSpeedColor(p.windSpeed);
        const rotateDeg = (p.windDir + 180) % 360;
        const icon = L.divIcon({
          className: "",
          html: `<svg width="11" height="11" viewBox="0 0 16 16" style="transform:rotate(${rotateDeg}deg);">
                   <line x1="8" y1="13" x2="8" y2="4" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>
                   <path d="M4.8 6.6 L8 3 L11.2 6.6" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                 </svg>`,
          iconSize: [11,11], iconAnchor: [5.5,5.5]
        });
        L.marker([p.lat, p.lon], { icon }).addTo(layers).bindTooltip(`${Math.round(p.windSpeed)} km/h`);
      });
    }
  }

  // continuous colored line: one segment per stretch between two
  // consecutive wind-sampled points, colored by that stretch's wind relation
  const pts = state.routePoints;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    const color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#f2766b" : "#e2b23e";
    const from = pts[i].idx, to = pts[i+1].idx;
    if(to <= from) continue;
    const segCoords = coords.slice(from, to + 1).map(c=>[c[0], c[1]]);
    L.polyline(segCoords, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(layers);
  }

  // small chevrons along the line showing which way the ride goes — placed
  // at even distance intervals independent of the (much sparser)
  // wind-sample points, so direction stays legible on loops/out-and-backs
  // regardless of the chosen Punktabstand.
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm > 0){
    const chevronCount = Math.min(20, Math.max(4, Math.round(totalKm / 2)));
    const spacingKm = totalKm / chevronCount;
    for(let c=1;c<chevronCount;c++){
      const targetKm = c * spacingKm;
      let idx = cumDist.findIndex(d => d >= targetKm);
      if(idx <= 0) idx = 1;
      if(idx >= coords.length) idx = coords.length - 1;
      const bearing = bearingBetween(coords[idx-1], coords[idx]);
      const icon = L.divIcon({
        className: "",
        html: `<svg width="14" height="14" viewBox="0 0 16 16" style="transform:rotate(${bearing}deg); filter: drop-shadow(0 0 1.5px rgba(20,23,29,0.9));">
                 <path d="M8 2.5 L12.5 11 L8 8.8 L3.5 11 Z" fill="#f2efe9" opacity="0.95"/>
               </svg>`,
        iconSize: [14,14], iconAnchor: [7,7]
      });
      L.marker(coords[idx], { icon, interactive:false }).addTo(layers);
    }
  }

  // invisible anchors at each sampled point — no visual marker on the map
  // (the colored line segments + Windfeld overlay already convey wind
  // direction/type), these just let the weather-strip chips below the map
  // pan to / open a popup on the right spot when clicked — skip points that
  // sit too close to an already-placed anchor (e.g. where the route crosses
  // itself)
  const markerDedupeRadiusKm = 0.5;
  const shownMarkerPositions = [];
  const invisibleIcon = L.divIcon({ className:"", html:"", iconSize:[0,0] });
  routeMarkerByIndex = {};
  pts.forEach((p,i)=>{
    const near = shownMarkerPositions.find(m => haversineKm([m.lat, m.lon], [p.lat, p.lon]) < markerDedupeRadiusKm);
    if(near){ routeMarkerByIndex[i] = near.marker; return; }

    const w = state.weatherAtRoute[i];
    let label = "Keine Winddaten";
    if(w){
      const rel = windRelative(p.bearing, w.windDir);
      const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
      label = `<b>Ankunft ${fmtTime(p.arrivalTime)} Uhr</b> · ${p.distanceKm.toFixed(0)} km<br><b>${typeLabel}</b><br>${Math.round(w.windSpeed)} km/h · ${Math.round(w.temp)}° · ${w.precip}% Regen`;
    }
    const marker = L.marker([p.lat, p.lon], { icon: invisibleIcon })
      .addTo(layers).bindPopup(label);
    shownMarkerPositions.push({ lat:p.lat, lon:p.lon, marker });
    routeMarkerByIndex[i] = marker;
  });
}

// PR time, PR watts, KOM/QOM, elevation gain, effort count — as {value,
// label} pairs (value = the hero numeral, label = the small caption under
// it), used both in the segment list and the segment map view. Takes a
// bucket (see segmentBucket()) so it works identically for starred and
// route-explore segments.
function computeSegmentStatChips(seg, bucket){
  const detail = bucket.details[seg.id];
  const stats = [];
  if(detail){
    const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
    if(pr != null) stats.push({value: fmtDuration(pr), label:"PR"});
    const prWatts = bucket.prWatts[seg.id];
    if(prWatts) stats.push({value: `${prWatts.measured ? "" : "~"}${prWatts.watts}`, label:"Watt"});
    if(detail.xoms && detail.xoms.kom) stats.push({value: `${detail.xoms.kom}`, label:"KOM"});
    if(detail.xoms && detail.xoms.qom) stats.push({value: `${detail.xoms.qom}`, label:"QOM"});
    if(detail.total_elevation_gain != null) stats.push({value: `${Math.round(detail.total_elevation_gain)}`, label:"Hm"});
    const effortCount = detail.athlete_segment_stats && detail.athlete_segment_stats.effort_count;
    if(effortCount) stats.push({value: `${effortCount}`, label:"× gefahren"});
  }
  return stats;
}

// diff = 0 means pure tailwind, 180 means pure headwind (see windRelative)
function segmentTailwindDiff(seg, bucket){
  const w = bucket.weather[seg.id];
  if(!w || !seg.start_latlng || !seg.end_latlng) return Infinity;
  const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  return windRelative(bearing, w.windDir).diff;
}

// Sorting UI only exists on the "Meine Segmente" (starred) page today, so
// this stays keyed off the shared state.segmentSortBy — but it's still
// bucket-parameterized like everything else here in case a future nav entry
// wants sorting over a different bucket.
function sortedVisibleSegments(bucket){
  const list = bucket.list.slice(0, 12);
  const effortCount = seg => (bucket.details[seg.id] && bucket.details[seg.id].athlete_segment_stats && bucket.details[seg.id].athlete_segment_stats.effort_count) || 0;
  switch(state.segmentSortBy){
    case "effort": return list.slice().sort((a,b) => effortCount(b) - effortCount(a));
    case "shortest": return list.slice().sort((a,b) => a.distance - b.distance);
    case "longest": return list.slice().sort((a,b) => b.distance - a.distance);
    case "steepest": return list.slice().sort((a,b) => b.average_grade - a.average_grade);
    case "tailwind": return list.slice().sort((a,b) => segmentTailwindDiff(a, bucket) - segmentTailwindDiff(b, bucket));
    default: return list;
  }
}

// Renders a single segment "card" (icon, name, distance/grade, wind tag,
// stat chips) — shared between both segment lists (starred + route-explore)
// and the segment map view, so all three look identical. `bucket` supplies
// this segment's weather/details/PR-watts data; opts.source ("starred" |
// "route", default "starred") is what gets passed to selectSegment() so the
// right bucket is looked up again on click/selection-highlight.
function renderSegmentRow(seg, bucket, opts){
  opts = opts || {};
  const source = opts.source || bucket.source || "starred";
  const w = bucket.weather[seg.id];
  let bearing = null;
  if(seg.start_latlng && seg.end_latlng){
    bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  }
  const isSelected = state.selectedSegmentId === seg.id && state.selectedSegmentSource === source;
  const clickable = opts.clickable !== false;
  const rowClass = "segment" + (isSelected ? " selected" : "") + (clickable ? "" : " static");
  const row = el("div", clickable ? {class:rowClass, onclick:()=>selectSegment(seg, source)} : {class:rowClass});

  let badgeColor = "var(--chalk-dim)", tagClass = "", tagText = "k.A.", arrowHtml = "";
  if(w && bearing !== null){
    const rel = windRelative(bearing, w.windDir);
    badgeColor = rel.type === "tail" ? "var(--tail)" : rel.type==="head" ? "var(--head)" : "var(--cross)";
    tagClass = rel.type === "tail" ? "tail" : rel.type==="head" ? "head" : "cross";
    tagText = (rel.type === "tail" ? "Rückenwind" : rel.type==="head" ? "Gegenwind" : "Seitenwind") + " · " + Math.round(w.windSpeed) + " km/h";
    arrowHtml = arrowSvg(bearing, w.windDir, "#0d1712");
  }
  const badge = el("div", {class:"arrow-badge", style:`background:${badgeColor}`, html: arrowHtml});

  const info = el("div", {style:"flex:1; min-width:0;"}, [
    el("div", {class:"name"}, [seg.name]),
    el("div", {class:"meta", style:"display:flex; justify-content:space-between; gap:10px;"}, [
      el("span", {}, [`${(seg.distance/1000).toFixed(1)} km`]),
      el("span", {}, [`${seg.average_grade}% Ø-Steigung`])
    ])
  ]);
  const left = el("div", {class:"left"}, [badge, info]);
  const top = el("div", {class:"top"}, [left, el("div", {class:"tag " + tagClass}, [tagText])]);
  row.appendChild(top);

  const stats = computeSegmentStatChips(seg, bucket);
  if(stats.length){
    const chips = el("div", {class:"stat-chips"});
    stats.forEach(s => chips.appendChild(statChip(s.value, s.label)));
    row.appendChild(chips);
  }

  return row;
}

function selectSegment(seg, source){
  source = source || "starred";
  const same = state.selectedSegmentId === seg.id && state.selectedSegmentSource === source;
  state.selectedSegmentId = same ? null : seg.id;
  state.selectedSegmentSource = same ? null : source;
  render();
  if(state.selectedSegmentId) ensureSegmentPrWatts(seg, segmentBucket(source));
  requestAnimationFrame(()=>{
    const mapEl = document.getElementById("route-map");
    if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
  });
}

// Same persistent-node pattern as the settings-row inputs above (see the
// comment there) — this select's onchange also calls render() directly, so
// letting el() recreate it fresh every render meant this <select> node was
// destroyed and replaced from under itself on every single sort change.
const segmentSortSelect = el("select", {
  style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
  onchange:(e)=>{ state.segmentSortBy = e.target.value; render(); }
}, [
  el("option", {value:"default"}, ["Standard"]),
  el("option", {value:"tailwind"}, ["Bester Rückenwind zuerst"]),
  el("option", {value:"effort"}, ["Am häufigsten gefahren"]),
  el("option", {value:"shortest"}, ["Länge: kurz → lang"]),
  el("option", {value:"longest"}, ["Länge: lang → kurz"]),
  el("option", {value:"steepest"}, ["Steilste zuerst"])
]);

// The plain starred-segments list (sort dropdown + rows) — content/behavior
// unchanged from before Task 2, just now rendered from renderSegmentsPage()
// on the "Meine Segmente" nav page instead of inline below the route card.
function renderSegmentsCard(){
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Markierte Segmente"]));

  if(state.loading.segments){
    card.appendChild(el("div", {class:"loading"}, ["Lade Segmente & Wind…"]));
    return card;
  }
  if(!state.segments.length){
    card.appendChild(el("div", {class:"muted"}, ["Keine markierten (gesternten) Segmente gefunden."]));
    return card;
  }

  syncPersistentInputValue(segmentSortSelect, state.segmentSortBy);
  card.appendChild(el("div", {style:"margin-bottom:14px;"}, [
    el("label", {}, ["Sortierung"]),
    segmentSortSelect
  ]));

  const bucket = segmentBucket("starred");
  sortedVisibleSegments(bucket).forEach(seg=>{
    card.appendChild(renderSegmentRow(seg, bucket));
  });

  return card;
}

// "Meine Segmente" nav page (Task 2). Connect-prompt when not connected
// (mirrors renderConnectCard()'s Strava button, since starred segments have
// no meaning without an account); the plain list when connected and nothing
// selected; or — when a starred segment is selected — that segment's detail
// view (map + back button) as the page's ENTIRE content, unlike the route
// page where the equivalent detail view sits above the still-visible full
// list. That's a deliberate difference from the route page's pattern: this
// page has no separate "route" above it to hold a persistent list, so
// swapping the whole page is the natural equivalent of the "Zur Strecke"
// back-button pattern there.
function renderSegmentsPage(){
  if(!state.connected){
    const card = el("div", {class:"card"});
    card.appendChild(el("h2", {}, ["Meine Segmente"]));
    card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px;"}, [
      "Verbinde dich mit Strava, um deine markierten (gesternten) Segmente mit Windbewertung zu sehen."
    ]));
    const stravaBtn = el("button", {class:"btn", style:"width:100%;", onclick: ()=>{ window.location.href = buildAuthUrl(); }}, [state.loading.connect ? "Verbinde…" : "Mit Strava einloggen →"]);
    if(state.loading.connect) stravaBtn.disabled = true;
    card.appendChild(stravaBtn);
    return card;
  }

  if(isShowingSegmentDetail()){
    const bucket = segmentBucket("starred");
    const seg = bucket.list.find(s => s.id === state.selectedSegmentId);
    const card = el("div", {class:"card"});
    card.appendChild(el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;"}, [
      el("h2", {style:"margin:0;"}, ["Segment"]),
      el("button", {class:"btn secondary", style:"padding:8px 14px; font-size:12px;", onclick:()=>{ state.selectedSegmentId = null; state.selectedSegmentSource = null; render(); }}, ["Zurück zur Liste"])
    ]));
    if(seg) card.appendChild(renderSegmentRow(seg, bucket, {clickable:false}));
    card.appendChild(routeMapContainer);
    return card;
  }

  return renderSegmentsCard();
}

// "Segmente auf der Strecke" (Task 3) — Strava's public segment-explore
// results matched against the current route, rendered with the exact same
// row treatment as the starred-segments list via the shared bucket-based
// functions above.
function renderRouteSegmentsCard(){
  if(!state.fullRouteCoords.length) return null;
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Segmente auf der Strecke"]));

  if(!state.connected){
    card.appendChild(el("div", {class:"muted"}, ["Verbinde mit Strava, um Segmente entlang dieser Strecke zu sehen."]));
    return card;
  }

  // Honest about what this is: segments/explore is a curated/popular-segment
  // API scoped to a handful of bounding boxes along the route, not an
  // exhaustive scan of every Strava segment that touches the path.
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px; font-size:12px;"}, [
    "Beliebte Strava-Segmente entlang dieser Strecke."
  ]));

  if(state.loading.routeSegments){
    card.appendChild(el("div", {class:"loading"}, ["Suche Segmente entlang der Strecke…"]));
    return card;
  }

  const bucket = segmentBucket("route");
  const list = bucket.list.slice(0, 12);
  if(!list.length){
    card.appendChild(el("div", {class:"muted"}, ["Keine bekannten Strava-Segmente entlang dieser Strecke gefunden."]));
    return card;
  }

  list.forEach(seg => card.appendChild(renderSegmentRow(seg, bucket)));
  return card;
}

function renderFootnote(){
  return el("div", {class:"footnote"}, [
    "Wetterdaten: Open-Meteo. Wind wird an ausgewählten Punkten entlang der Strecke bzw. am Startpunkt jedes Segments abgefragt und mit der Streckenrichtung verglichen. ",
    state.connected ? el("a", {href:"#", onclick:(e)=>{e.preventDefault(); loadActivitiesAndSegments();}}, ["Neu laden"]) : ""
  ]);
}

// ---------- init ----------
async function init(){
  render();

  // Strava just redirected back to this page with ?code=...
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code");
  let justConnected = false;
  if(codeParam){
    window.history.replaceState({}, document.title, window.location.pathname);
    await connectWithCode(codeParam);
    justConnected = true;
  }

  if(!justConnected){
    const stored = await loadStoredToken();
    if(stored){
      state.loading.connect = true; render();
      try{
        const tokenData = await refreshAccessToken(stored);
        state.accessToken = tokenData.access_token;
        await saveToken(tokenData.refresh_token);
        state.connected = true;
        await loadActivitiesAndSegments();
      }catch(e){
        // stored token invalid, stay on connect screen
      }
      state.loading.connect = false;
      render();
    }
  }
}
init();
</script>
