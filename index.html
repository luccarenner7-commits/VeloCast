// ---------- Profil: local caches ----------
// Same "fully-processed activity, keyed by id, never needs to change once
// computed" idea as the Artifact's ACTIVITY_CACHE_KEY — ported almost
// verbatim, just under fresh key names that can't collide with the
// existing velocast_settings key or with each other.
const PROFIL_ACTIVITY_CACHE_KEY = "velocast_activity_cache";
const PROFIL_ACTIVITY_CACHE_MAX = 400;
// Bumped whenever processProfilRide()'s derived `metrics` shape changes in a
// way that makes an old cached row stale (e.g. a new field the app now
// depends on that can't be backfilled without re-fetching the raw stream,
// which itself isn't cached). Cache-hit rows without a matching
// metricsVersion fall through to a real re-fetch instead of being reused
// verbatim -- see the cache-hit check in loadProfilData(). Bumped to 3 to
// backfill `speedCal` (personalized gradient×power speed calibration, see
// computeSpeedCalibrationFromStream()) onto every cached row.
const PROFIL_METRICS_VERSION = 3;

function loadProfilActivityCache(){
  try{
    const raw = localStorage.getItem(PROFIL_ACTIVITY_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, row]) => {
      if(!row || typeof row !== "object" || !row.date || !row.id) return;
      const d = new Date(row.date);
      if(isNaN(d.getTime())) return;
      out[String(id)] = { ...row, id: String(row.id), date: d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveProfilActivityCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort((a,b)=>b.date-a.date).slice(0, cap);
    const trimmed = {};
    entries.forEach(r => { trimmed[r.id] = r; });
    localStorage.setItem(PROFIL_ACTIVITY_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(PROFIL_ACTIVITY_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function clearProfilActivityCache(){ try{ localStorage.removeItem(PROFIL_ACTIVITY_CACHE_KEY); }catch(e){} }

// Activities skipped for a structural reason (no power meter, no qualifying
// 5/10/20-min effort) aren't "results" and don't belong in the cache above,
// but re-checking them costs a real API call every reload — cache the
// verdict separately, same split the Artifact used.
const PROFIL_SKIP_CACHE_KEY = "velocast_activity_skip_cache";
const PROFIL_SKIP_CACHE_MAX = 800;
const PROFIL_SKIP_STATUSES = new Set(["noWatts","noBestEffort"]);

function loadProfilSkipCache(){
  try{
    const raw = localStorage.getItem(PROFIL_SKIP_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, v]) => {
      if(!v || typeof v !== "object" || !PROFIL_SKIP_STATUSES.has(v.status)) return;
      const d = v.date ? new Date(v.date) : new Date(0);
      out[String(id)] = { status:v.status, date: isNaN(d.getTime()) ? new Date(0) : d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveProfilSkipCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.entries(cacheObj).sort((a,b)=>b[1].date-a[1].date).slice(0, cap);
    const trimmed = {};
    // Guard against an unparseable a.start_date_local producing an invalid Date here
    // (toISOString() throws on those) — same new Date(0) fallback the read path uses,
    // so one bad entry can't make the whole cache write silently fail.
    entries.forEach(([id,v]) => { const dt = (v.date instanceof Date && !isNaN(v.date.getTime())) ? v.date : new Date(0); trimmed[id] = { status:v.status, date:dt.toISOString() }; });
    localStorage.setItem(PROFIL_SKIP_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(PROFIL_SKIP_CACHE_MAX); }
  catch(e){ try{ attempt(200); }catch(e2){} }
}
function clearProfilSkipCache(){ try{ localStorage.removeItem(PROFIL_SKIP_CACHE_KEY); }catch(e){} }

// Rider-entered "this part was replaced on this date" markers for the
// Ausrüstung wear bars — not Strava data at all (Strava has no field for
// it), a local rider preference like avgSpeedKmh, just its own key since it
// doesn't fit velocast_settings' flat shape.
const PROFIL_GEAR_RESET_KEY = "velocast_gear_resets";
const GEAR_COMPONENTS = [
  { key:"chain",    label:"Kette",           intervalKm:3000 },
  { key:"cassette", label:"Kassette/Ritzel", intervalKm:9000 },
  { key:"brakes",   label:"Bremsbeläge",     intervalKm:5000 },
  { key:"tires",    label:"Reifen (hinten)", intervalKm:4000 }
];
function loadGearResets(){
  try{
    const raw = localStorage.getItem(PROFIL_GEAR_RESET_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([gearId, comps]) => {
      if(!comps || typeof comps !== "object") return;
      const clean = {};
      GEAR_COMPONENTS.forEach(c => {
        const v = comps[c.key];
        if(typeof v === "number" && isFinite(v) && v >= 0) clean[c.key] = v;
      });
      out[String(gearId)] = clean;
    });
    return out;
  }catch(e){ return {}; }
}
function saveGearResets(resets){ try{ localStorage.setItem(PROFIL_GEAR_RESET_KEY, JSON.stringify(resets)); }catch(e){} }
function gearWearStatus(totalDistanceM, resetKm, intervalKm){
  const totalKm = (totalDistanceM||0)/1000;
  const sinceKm = Math.max(0, totalKm - (resetKm||0));
  const pct = intervalKm > 0 ? sinceKm/intervalKm*100 : 0;
  const level = pct >= 100 ? "danger" : (pct >= 80 ? "warn" : "good");
  return { sinceKm, pct: Math.min(999, pct), level };
}

// ---------- Kettenverschleiß (unabhängig von Ausrüstung) ----------
// A separate, independent wear tracker for the Reifendruck page -- explicit
// rider decision: does NOT share data with GEAR_COMPONENTS/PROFIL_GEAR_RESET_KEY
// above (different storage key, no gear-id keying, only one component). It
// reuses gearWearStatus() directly (generic, doesn't care about the source
// of totalDistanceM) instead of duplicating the wear-math. Two deliberate
// deviations from the Ausrüstung pattern: the interval ("Schwelle") is
// rider-editable here instead of a hardcoded GEAR_COMPONENTS.intervalKm, and
// this tool shows a dismissible startup/session banner (see
// computeChainWearReminder()/renderChainWearBanner() below), which Ausrüstung
// has no equivalent of.
const CHAIN_WEAR_KEY = 'velocast_chain_wear';
// 250 km, not the old 3000 km wear-replacement figure: this is a re-wax
// interval (see the "Kette" card, renamed away from "Verschleiß"/wear
// framing since the underlying tool tracks when to re-wax the chain, not
// when it's worn out), and hot-wax lubrication typically needs reapplying
// every ~200-300 km. Rider-editable either way (see the "Schwelle" input in
// buildChainWearCard()).
function defaultChainWearData(){
  return { thresholdKm: 250, resetAtMs: 0 };
}
// Same "any failure silently falls back to a safe default" discipline as
// loadTirePressureData()/loadGearResets().
function loadChainWearData(){
  try{
    const raw = localStorage.getItem(CHAIN_WEAR_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        const out = defaultChainWearData();
        if(isFinite(parsed.thresholdKm) && parsed.thresholdKm > 0) out.thresholdKm = parsed.thresholdKm;
        if(isFinite(parsed.resetAtMs) && parsed.resetAtMs >= 0) out.resetAtMs = parsed.resetAtMs;
        return out;
      }
    }
  }catch(e){}
  return defaultChainWearData();
}
function saveChainWearData(data){
  try{ localStorage.setItem(CHAIN_WEAR_KEY, JSON.stringify(data)); }catch(e){}
}
// VeloCast doesn't track odometer/gear-tagged distance independently of
// Strava's gear objects -- this tool has no gear object to read from at all,
// so "lifetime km" is derived straight from the rider's own ridden activities
// instead. Same RIDE_SPORT_TYPES/`a.sport_type||a.type` filter convention as
// every other call site of that Set (see e.g. loadActivitiesStep() below).
// Pure function of its `activities` param (not a direct state read) so it
// stays unit-testable in isolation, same reasoning as
// computeChainWearReminder() below. See getChainWearDistanceM() right below
// for which activities list this actually gets called with.
// `sinceMs` (optional): only sum activities that started at or after this
// timestamp. Needed because loadAktivitaetenListCache() below is not an
// append-only ledger -- paging further back on the Aktivitäten tab ("Weitere
// laden") backfills OLDER activities into the same cache, so a plain sum
// over the whole cache is not monotonic in time and can't be used as a
// reset baseline (see applyChainWearReset()'s comment for the bug this
// caused). Filtering by date instead of by distance keeps the sum immune to
// that backfill: an activity from before the reset point never counts
// toward wear-since-reset, no matter when it gets paged into the cache.
function sumRiddenDistanceM(activities, sinceMs){
  return (activities||[])
    .filter(a => a && RIDE_SPORT_TYPES.has(a.sport_type || a.type))
    .filter(a => !sinceMs || new Date(a.start_date_local || a.start_date).getTime() >= sinceMs)
    .reduce((sum, a) => sum + (a.distance||0), 0);
}
// Bug fix: every call site below used to pass state.activities, which is
// fetchActivities()'s hardcoded `per_page=8` result (index.html's
// fetchActivities(), ~line 2153) -- only a rolling window of the 8 most
// recent rides, NOT lifetime distance. With typical ~60km rides that window
// sums to a roughly constant ~480km forever, so the "danger" reminder could
// never fire, and worse, resetting the chain baseline pinned resetAtKm to
// that same near-constant window sum -- as new rides pushed old ones out of
// the 8-item window, the window sum stayed flat (or even dropped), so wear
// never visibly accumulated again after a reset.
//
// Fix: read loadAktivitaetenListCache() (velocast_activity_list_cache)
// instead. That cache is a persistent, ever-growing (up to
// AKTIVITAETEN_LIST_CACHE_MAX) accumulation of every activity the
// Aktivitäten tab has ever paged in across sessions -- a much better proxy
// for lifetime ridden distance than the 8-item rolling window. It does NOT
// require a new network fetch (no extra API call from this page) and
// degrades gracefully: if the rider has never opened Aktivitäten yet, the
// cache is simply empty and this returns 0 (no crash), then grows as more
// pages get cached over time.
//
// Deliberately not pp.gear[].distance (Strava's own gear odometer, which is
// what Ausrüstung/GEAR_COMPONENTS reads for the exact same "lifetime
// distance" need, see renderProfilKernGearCard() above) -- that field is
// scoped to one specific bike/gear object and requires the Profil page's
// full FTP-analysis pipeline to have loaded first, whereas this tool has no
// bike-selection UI and only cares about one chain, so it's simpler and
// more available to keep deriving lifetime km straight from ridden
// activities as the existing sumRiddenDistanceM() comment already committed
// to -- just from the right (accumulating, date-filterable) activities list.
function getChainWearDistanceM(sinceMs){
  return sumRiddenDistanceM(Object.values(loadAktivitaetenListCache()), sinceMs);
}
// Startup/mutation-site check (see init() and every chainWear-mutating call
// site in buildChainWearCard()): true once wear has reached gearWearStatus()'s
// "danger" level (pct>=100, i.e. sinceKm>=thresholdKm) -- deliberately the
// harder "threshold reached" bar, not the softer 80% "warn" pre-level, to
// match renderChainWearBanner()'s "Kette sollte bald neu gewachst werden" wording.
// A plain boolean (not a {front,rear}-shaped object like
// computeTirePressureReminder()'s result) since there's only one chain to
// track here. `distanceSinceResetM` must already be pre-filtered to
// chainWear.resetAtMs (via getChainWearDistanceM(chainWear.resetAtMs)) --
// resetKm is passed as 0 here since the date filter already excludes
// pre-reset riding, see sumRiddenDistanceM()'s comment for why a
// distance-based resetKm baseline doesn't work with this cache.
function computeChainWearReminder(chainWear, distanceSinceResetM){
  return gearWearStatus(distanceSinceResetM, 0, chainWear.thresholdKm).level === 'danger';
}
// Pure "Zurückgesetzt" baseline update, extracted out of buildChainWearCard()'s
// reset-button onclick closure so it's unit-testable on its own (that
// closure previously wasn't reachable at all from a test -- same reasoning
// as computeChainWearReminder()/sumRiddenDistanceM() being kept pure above).
//
// Bug fix: this used to pin resetAtKm to the current lifetime-distance
// total. That broke as soon as the rider paged further back on the
// Aktivitäten tab afterwards -- loadAktivitaetenListCache() backfills OLDER
// activities into the same cache (it's not append-only from "now"
// forward), so the lifetime total can retroactively grow past a reset point
// with rides that happened *before* the reset, making sinceKm balloon on a
// freshly-replaced chain. Fixed by baselining on a timestamp instead of a
// distance: resetAtMs = now, and getChainWearDistanceM(resetAtMs) only ever
// sums activities that started at or after that moment, so backfilled older
// rides can never retroactively count. Returns a new object rather than
// mutating `chainWear` in place, same "caller decides what to do with the
// result" convention as applyNachmessenUpdate(). Takes no distance argument
// now -- the reset point is simply "this instant", not a snapshot of a
// number that can later be invalidated by cache backfill.
function applyChainWearReset(chainWear){
  return { ...chainWear, resetAtMs: Date.now() };
}

// ---------- Reifendruckrechner mit Reminder ----------
// Deliberately simple, explainable reference-table model (not a "real"
// calibrated formula) -- base pressure by tire width in mm, linearly
// interpolated, then scaled by weight/terrain/tubeless/wheel factors. Front
// wheel, road terrain, non-tubeless, 75kg total weight is the reference
// point the table itself is expressed in.
//
// Power-law shape (pressure falls off with width faster than it rises with
// weight) fitted against real recommendations pulled from SRAM's tire
// pressure calculator (4 data points: 35mm/47mm width at 93.4kg and 47mm at
// 69.4kg system weight, hooked/tubed) -- an earlier hand-guessed lookup
// table ran ~40-60% too high compared to that reference. WIDTH_EXPONENT and
// WEIGHT_EXPONENT and BASE_COEFFICIENT are the fitted constants; matches
// SRAM's own numbers to within ~1%.
const TIRE_PRESSURE_BASE_COEFFICIENT = 46.1;
const TIRE_PRESSURE_WIDTH_EXPONENT = 1.3;
const TIRE_PRESSURE_WEIGHT_EXPONENT = 0.45;
// Pure, DOM/state-free by design (see project test convention) -- `wheel` is
// 'front'|'rear', `terrain` is 'road'|'gravel'|'offroad'.
function computeTargetPressureBar({ riderWeightKg, bikeWeightKg, tireWidthMm, tubeless, terrain, wheel }){
  const clampedWidth = Math.min(55, Math.max(23, tireWidthMm));
  const widthFactor = Math.pow(clampedWidth, -TIRE_PRESSURE_WIDTH_EXPONENT);
  const weightFactor = Math.pow(riderWeightKg + bikeWeightKg, TIRE_PRESSURE_WEIGHT_EXPONENT);
  const terrainFactor = terrain === 'gravel' ? 0.85 : (terrain === 'offroad' ? 0.7 : 1.0);
  const tubelessFactor = tubeless ? 0.9 : 1.0;
  const wheelFactor = wheel === 'rear' ? 1.065 : 1.0;
  const raw = TIRE_PRESSURE_BASE_COEFFICIENT * widthFactor * weightFactor * terrainFactor * tubelessFactor * wheelFactor;
  const clamped = Math.min(9.0, Math.max(1.5, raw));
  return Math.round(clamped * 10) / 10;
}

// Loss-rate learning: sparse, manually-entered data (a rider measures maybe
// once every few rides) doesn't support anything fancier than an EMA of
// observed rates -- see task brief.
function computeLossRateBarPerDay(priorBar, measuredBar, hoursElapsed){
  if(!(hoursElapsed > 0)) return null; // guards hoursElapsed<=0 and NaN in one comparison
  return (priorBar - measuredBar) / (hoursElapsed / 24);
}
// Sanity-clamp range for a single measured rate before it's allowed to move
// the learned average: 0 is the floor (a "gain" reading is a bad/mistimed
// measurement, not negative loss -- e.g. topping up mid-week); 3 bar/day is
// already a blatant leak, so anything above that is almost certainly a
// fat-fingered manual entry rather than a real data point, and letting it
// through unclamped would let one typo dominate the EMA for a long time.
function updateLearnedRateBarPerDay(oldRate, newMeasuredRate, alpha = 0.3){
  const clamped = Math.min(3, Math.max(0, newMeasuredRate));
  return alpha * clamped + (1 - alpha) * oldRate;
}
function estimateCurrentPressureBar(lastBaselineBar, lastBaselineAtMs, learnedRateBarPerDay, nowMs){
  const daysElapsed = (nowMs - lastBaselineAtMs) / 86400000;
  return Math.max(0, lastBaselineBar - learnedRateBarPerDay * daysElapsed);
}
function isPressureLow(estimatedBar, targetBar, thresholdPercent){
  return estimatedBar < targetBar * (thresholdPercent / 100);
}

// Target pressure per wheel, calculator-mode-aware: with the calculator on
// (default), the target is computed from rider/bike/tire settings as before;
// with it off, the rider enters their own target per wheel directly (see
// buildTireWheelCard's "Zieldruck" field) and this just reads it back --
// null until they do, same "not ready yet" meaning as computeTargetPressureBar
// never having run. `data` is the full {settings, front, rear} shape.
function getWheelTargetBar(data, wheel){
  const s = data.settings;
  if(s.calculatorEnabled === false) return data[wheel].manualTargetBar;
  return computeTargetPressureBar({ riderWeightKg: s.riderWeightKg, bikeWeightKg: s.bikeWeightKg, tireWidthMm: s.tireWidthMm, tubeless: s.tubeless, terrain: s.terrain, wheel });
}

// Reasonable generic default for a clincher road tire, used only until the
// wheel has at least one real "Nachmessen"-derived data point.
const TIRE_PRESSURE_DEFAULT_RATE_BAR_PER_DAY = 0.15;
const TIRE_PRESSURE_KEY = 'velocast_tire_pressure';
function defaultTireWheelData(){
  return { lastBaselineBar: null, lastBaselineAtMs: null, learnedRateBarPerDay: TIRE_PRESSURE_DEFAULT_RATE_BAR_PER_DAY, history: [], manualTargetBar: null };
}
function defaultTirePressureData(){
  return {
    settings: { riderWeightKg: null, bikeWeightKg: null, tireWidthMm: null, tubeless: false, terrain: 'road', reminderThresholdPercent: 85, calculatorEnabled: true },
    front: defaultTireWheelData(),
    rear: defaultTireWheelData()
  };
}
// Same read-helper convention as loadGearResets()/loadConfigOverrides()
// above: any failure (missing key, corrupt JSON, wrong shape) silently falls
// back to a safe default instead of throwing into render().
function loadTirePressureData(){
  try{
    const raw = localStorage.getItem(TIRE_PRESSURE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        const out = defaultTirePressureData();
        if(parsed.settings && typeof parsed.settings === 'object') Object.assign(out.settings, parsed.settings);
        ['front', 'rear'].forEach(wheel => {
          if(parsed[wheel] && typeof parsed[wheel] === 'object'){
            out[wheel] = Object.assign(defaultTireWheelData(), parsed[wheel]);
            if(!Array.isArray(out[wheel].history)) out[wheel].history = [];
          }
        });
        return out;
      }
    }
  }catch(e){}
  return defaultTirePressureData();
}
// Cap history to the last 50 entries, same pattern as saveTrainerHistory()'s
// .slice(-100) -- nothing in the UI shows full history, this is just to keep
// localStorage from growing unboundedly.
function saveTirePressureData(data){
  try{
    ['front', 'rear'].forEach(wheel => { data[wheel].history = data[wheel].history.slice(-50); });
    localStorage.setItem(TIRE_PRESSURE_KEY, JSON.stringify(data));
  }catch(e){}
}
// Startup check (see init()): {front, rear} booleans, both false if settings
// aren't filled in yet or a wheel has no baseline yet -- computeTargetPressureBar
// can't run without riderWeightKg/bikeWeightKg/tireWidthMm.
function computeTirePressureReminder(data){
  const s = data.settings;
  const result = { front: false, rear: false };
  if(s.calculatorEnabled !== false){
    const settingsReady = isFinite(s.riderWeightKg) && s.riderWeightKg > 0
      && isFinite(s.bikeWeightKg) && s.bikeWeightKg > 0
      && isFinite(s.tireWidthMm) && s.tireWidthMm > 0;
    if(!settingsReady) return result;
  }
  ['front', 'rear'].forEach(wheel => {
    const w = data[wheel];
    if(w.lastBaselineBar == null || w.lastBaselineAtMs == null) return;
    const target = getWheelTargetBar(data, wheel);
    if(target == null) return; // calculator off, rider hasn't entered a manual target yet
    const estimated = estimateCurrentPressureBar(w.lastBaselineBar, w.lastBaselineAtMs, w.learnedRateBarPerDay, Date.now());
    result[wheel] = isPressureLow(estimated, target, s.reminderThresholdPercent);
  });
  return result;
}

// "Nachmessen & neu aufpumpen" button logic (see buildTireWheelCard): folds
// two cases into one so the button works whether or not "Gemessen" was
// filled in. If `measured` is a finite number, runs the loss-rate-learning
// path (rate computed from the prior baseline -> measured, folded into the
// learned EMA, appended to history) before resetting the baseline. If not
// (field left empty/invalid), skips all of that and just resets the
// baseline, same as the old standalone "Aufgepumpt" button. Mutates `w` in
// place, matching how the onclick handler it replaces already worked; a
// no-op (leaves `w` untouched) if `neu` isn't a valid positive number --
// returns false in that case (true otherwise) so the caller can skip the
// save/render that follows, same as the early `return` this replaces.
function applyNachmessenUpdate(w, measured, neu, now){
  if(!(isFinite(neu) && neu > 0)) return false;
  if(isFinite(measured)){
    const hoursElapsed = (now - w.lastBaselineAtMs) / 3600000;
    const rate = computeLossRateBarPerDay(w.lastBaselineBar, measured, hoursElapsed);
    if(rate != null){
      w.learnedRateBarPerDay = updateLearnedRateBarPerDay(w.learnedRateBarPerDay, rate);
      w.history.push({ measuredAtMs: now, priorBar: w.lastBaselineBar, measuredBar: measured, hoursElapsed, rateBarPerDay: rate });
    }
  }
  w.lastBaselineBar = Math.round(neu * 10) / 10;
  w.lastBaselineAtMs = now;
  return true;
}

// ---------- Profil: per-ride estimation math ----------
// Ported from the Artifact's estimateFtpFromBestEfforts()/computeStreamMetrics()
// etc. (see strava-ftp-forecast/index.html ~L747-921), adapted to work
// directly off a raw {time,watts,heartrate,altitude,distance} stream instead
// of the Artifact's MCP-tool-supplied `best_efforts`/`segment_efforts` —
// Strava's real REST API doesn't expose a power best-efforts endpoint for
// rides, so the mean-maximal-power ladder is computed here directly from
// the stream with the same sliding-window technique the Artifact already
// used elsewhere (bestWindowHrStats).
const RIDE_SPORT_TYPES = new Set([
  "Ride","VirtualRide","GravelRide","MountainBikeRide","EBikeRide","Velomobile","Handcycle"
]);
const MMP_DURATIONS_SEC = [5,15,30,60,120,180,300,480,600,900,1200,1800,2700,3600];
const FTP_FACTORS = [
  { sec:1200, factor:0.95, confidence:"hoch" },
  { sec:600,  factor:0.89, confidence:"mittel" },
  { sec:300,  factor:0.80, confidence:"niedrig" }
];
const CONFIDENCE_WEIGHT = { hoch:1.0, mittel:0.6, niedrig:0.3, "unbestätigt":0.12 };
// Strava's 7 power zones, used for time-in-zone/polarization. Colors reuse
// the exact hex values behind --route/--tail/--cross/--head/--kom-near as a
// plain cool-to-hot categorical ramp for this one stacked bar chart — same
// kind of deliberate cross-domain reuse as --accent already makes of
// --tail's hue elsewhere in this file, safe here because a 7-zone power
// chart never appears next to wind or KOM-closeness data.
const POWER_ZONE_META = [
  { name:"Z1 Aktive Erholung", color:"#5b6472", band:"low"  },
  { name:"Z2 Grundlage",       color:"#82a2d1", band:"low"  },
  { name:"Z3 Tempo",           color:"#4fb08c", band:"grey" },
  { name:"Z4 Schwelle",        color:"#e2b23e", band:"grey" },
  { name:"Z5 VO2max",          color:"#e08a4f", band:"high" },
  { name:"Z6 Anaerob",         color:"#f2766b", band:"high" },
  { name:"Z7 Neuromuskulär",   color:"#c792ea", band:"high" }
];
const CEILING_WINDOW_DAYS = 365;
// Test-Klasse Staleness-Fenster (s. computeTestDueSignal() weiter unten) --
// bewusst eigenständig statt an CEILING_WINDOW_DAYS gekoppelt: ein
// Leistungstest soll nach 42 Tagen als fällig gelten, unabhängig davon, wie
// lang das Fenster für die FTP-/Potential-Bestwert-Ceiling ist.
const TEST_STALENESS_DAYS = 42;

function fmtDurLabel(sec){ return sec % 60 === 0 ? (sec/60) + "min" : sec + "s"; }

// Highest average over any contiguous window of `windowSamples`, within [from,to).
function bestWindowAvg(values, windowSamples, from, to){
  const lo = from ?? 0, hi = to ?? values.length;
  if(windowSamples <= 0 || hi - lo < windowSamples) return null;
  let sum = 0;
  for(let i = lo; i < lo + windowSamples; i++) sum += values[i] || 0;
  let best = sum;
  for(let i = lo + windowSamples; i < hi; i++){
    sum += (values[i]||0) - (values[i-windowSamples]||0);
    if(sum > best) best = sum;
  }
  return best / windowSamples;
}

function bestWindowHrStats(time, watts, hr, targetSec){
  const n = Array.isArray(time) ? time.length : 0;
  if(n < 2 || !Array.isArray(watts) || !Array.isArray(hr)) return null;
  const avgDt = (time[n-1]-time[0])/(n-1);
  if(!avgDt || avgDt <= 0) return null;
  const windowSamples = Math.max(1, Math.round(targetSec/avgDt));
  if(windowSamples >= n){
    const v = hr.filter(x=>x!=null);
    if(!v.length) return null;
    return { avgHr: v.reduce((s,x)=>s+x,0)/v.length, maxHr: Math.max(...v) };
  }
  const prefix = new Array(n+1).fill(0);
  for(let i=0;i<n;i++) prefix[i+1] = prefix[i] + (watts[i]||0);
  let bestI=0, bestAvg=-Infinity;
  for(let i=0;i<=n-windowSamples;i++){
    const avg=(prefix[i+windowSamples]-prefix[i])/windowSamples;
    if(avg>bestAvg){ bestAvg=avg; bestI=i; }
  }
  const w=[];
  for(let i=bestI;i<bestI+windowSamples;i++) if(hr[i]!=null) w.push(hr[i]);
  if(!w.length) return null;
  return { avgHr: w.reduce((s,x)=>s+x,0)/w.length, maxHr: Math.max(...w) };
}

// Mean-maximal-power ladder computed straight from the stream — the
// replacement for the Artifact's MCP-supplied best_efforts.
function computeMmpFromStream(stream){
  const time = stream.time, watts = stream.watts;
  if(!Array.isArray(time) || !Array.isArray(watts) || time.length < 5) return null;
  const n = time.length;
  const avgDt = (time[n-1]-time[0])/(n-1);
  if(!avgDt || avgDt <= 0) return null;
  // Duplicate-window guard: if the stream's own sampling interval is coarser
  // than a target duration, windowSamples collapses to the same tiny number
  // (often 1) for several short durations in a row -- e.g. avgDt=11s makes
  // both "5s" and "15s" resolve to a single raw sample, so both would report
  // the identical value under two different duration labels. Keep only the
  // longest duration per distinct windowSamples so a coarse sample never
  // masquerades as more than one (mis-labeled) short best effort.
  const windows = MMP_DURATIONS_SEC.map(sec => ({ sec, windowSamples: Math.max(1, Math.round(sec/avgDt)) }));
  const mmp = {};
  windows.forEach((w, i) => {
    if(w.windowSamples > n) return;
    const next = windows[i+1];
    if(next && next.windowSamples === w.windowSamples) return; // superseded by a longer, equally-coarse duration
    const avg = bestWindowAvg(watts, w.windowSamples, 0, n);
    if(avg != null) mmp[w.sec] = avg;
  });
  return Object.keys(mmp).length ? mmp : null;
}

// Log-log-Interpolation zwischen den zwei nächstgelegenen MMP-Stützpunkten,
// da Segmentzeiten (z.B. 4:47) fast nie exakt auf einen der 14
// MMP_DURATIONS_SEC-Werte fallen. Außerhalb des verfügbaren Bereichs wird
// auf den Randwert geklemmt (flache Extrapolation) statt zu extrapolieren --
// z.B. hat ein 90-Sekunden-Segment kein verlässliches Analogon, wenn die
// kürzeste vorhandene MMP-Messung 2 Minuten ist.
function estimatePowerCurveAt(durationSec, mmpCurve){
  if(!mmpCurve) return null;
  const pts = MMP_DURATIONS_SEC.filter(s => mmpCurve[s] != null).map(s => [s, mmpCurve[s]]);
  if(pts.length < 2) return null;
  if(durationSec <= pts[0][0]) return pts[0][1];
  if(durationSec >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for(let i=0; i<pts.length-1; i++){
    const [d0,p0] = pts[i], [d1,p1] = pts[i+1];
    if(durationSec >= d0 && durationSec <= d1){
      const t = (Math.log(durationSec)-Math.log(d0)) / (Math.log(d1)-Math.log(d0));
      return Math.exp(Math.log(p0) + t*(Math.log(p1)-Math.log(p0)));
    }
  }
  return null;
}

function estimateFtpFromMmp(mmp){
  if(!mmp) return null;
  const candidates = FTP_FACTORS.filter(f => mmp[f.sec] != null)
    .map(f => ({ sec:f.sec, confidence:f.confidence, ftp: Math.round(mmp[f.sec]*f.factor) }));
  if(!candidates.length) return null;
  const best = candidates.reduce((a,b) => b.ftp>a.ftp ? b : a);
  return {
    ftp: best.ftp, sec: best.sec, confidence: best.confidence, weight: CONFIDENCE_WEIGHT[best.confidence],
    basis: candidates.length>1
      ? `${fmtDurLabel(best.sec)} (max von ${candidates.map(c=>fmtDurLabel(c.sec)).join('/')})`
      : `${fmtDurLabel(best.sec)} (einziger Wert)`
  };
}

// ---------- Trainer: HF-only LTHR-Schätzung (Mean-Maximal-HF) ----------
// Mean-maximal-HF ladder computed straight from a stream — same technique as
// computeMmpFromStream() above, just walked over stream.heartrate instead of
// stream.watts. Feeds estimateLthrFromHrCurve() below.
function computeHrMmpFromStream(stream){
  const time = stream.time, hr = stream.heartrate;
  if(!Array.isArray(time) || !Array.isArray(hr) || time.length < 5) return null;
  const n = time.length;
  const avgDt = (time[n-1]-time[0])/(n-1);
  if(!avgDt || avgDt <= 0) return null;
  const mmp = {};
  MMP_DURATIONS_SEC.forEach(sec => {
    const windowSamples = Math.max(1, Math.round(sec/avgDt));
    if(windowSamples > n) return;
    const avg = bestWindowAvg(hr, windowSamples, 0, n);
    if(avg != null) mmp[sec] = avg;
  });
  return Object.keys(mmp).length ? mmp : null;
}

// Friel's LTHR field-test protocol: a 20-30-minute hard, steady effort's raw
// average HR *is* the LTHR estimate — no discount factor. This is a
// deliberate, load-bearing difference from estimateFtpFromMmp()'s
// FTP_FACTORS (0.95/0.89/0.80): power output can spike well above what's
// sustainable for the full test duration (hence FTP needing a haircut off a
// shorter best effort), but heart rate does not overshoot the same way — it
// converges toward threshold over the course of the effort rather than
// spiking early. Do NOT copy the FTP_FACTORS discount pattern here; that
// would systematically under-estimate LTHR.
const LTHR_ESTIMATION_WINDOWS_SEC = [
  { sec:1800, confidence:'hoch' },   // 30-min test
  { sec:1200, confidence:'mittel' }, // 20-min test (shorter, thus lower confidence)
];
// maxHr (optional): the ride's own observed max heart rate (a.max_heartrate),
// used as a plausibility ceiling on top of the hard sanity range below — a
// 20/30-min average can never exceed the ride's own peak (it's a mean over a
// window that includes non-peak samples), so a plain "> maxHr" check is
// mathematically unreachable and would silently no-op. Instead this requires
// meaningful separation from the peak: a genuine threshold effort should sit
// noticeably below the ride's short-term max, so an estimate that creeps
// above 98% of maxHr is more likely a sensor artifact (e.g. a chest-strap
// dropout spike dragging the whole window up) than a real LTHR.
function estimateLthrFromHrCurve(hrMmpCurve, maxHr){
  if(!hrMmpCurve) return null;
  // Ordered longest-first above, so the first hit is the longest available
  // window — no discount applied, see the block comment above.
  const win = LTHR_ESTIMATION_WINDOWS_SEC.find(w => hrMmpCurve[w.sec] != null);
  if(!win) return null;
  const lthr = Math.round(hrMmpCurve[win.sec]);
  // Hard physiological sanity range — mirrors the intent of
  // checkEffortPlausibility() used for FTP estimation above, just without a
  // zones-based floor since Strava doesn't expose a comparable HR-zone table
  // here. This must always apply, regardless of whether maxHr is available.
  if(lthr < 100 || lthr > 210) return null;
  // 30-min-Schnitt sollte spürbar unter dem Fahrt-Maximum liegen; sonst
  // Hinweis auf Sensor-Artefakt/Dropout statt eines echten Schwellenwerts.
  if(maxHr != null && lthr > maxHr * 0.98) return null;
  return {
    lthr, sec: win.sec, confidence: win.confidence,
    basis: `${fmtDurLabel(win.sec)}-Fenster`
  };
}

function checkEffortPlausibility(maxHr, heartRateZones){
  if(maxHr == null) return null;
  if(!Array.isArray(heartRateZones) || heartRateZones.length < 3 || heartRateZones[2].min == null) return null;
  const tempoFloor = heartRateZones[2].min;
  return { plausible: maxHr >= tempoFloor, tempoFloor };
}

function weightedLinearRegression(points){
  const n = points.length;
  if(n < 2) return null;
  const sw=points.reduce((s,p)=>s+p.w,0), swx=points.reduce((s,p)=>s+p.w*p.x,0);
  const swy=points.reduce((s,p)=>s+p.w*p.y,0), swxy=points.reduce((s,p)=>s+p.w*p.x*p.y,0);
  const swxx=points.reduce((s,p)=>s+p.w*p.x*p.x,0);
  const den = sw*swxx - swx*swx;
  if(den === 0) return null;
  const slope=(sw*swxy-swx*swy)/den;
  return { slope, intercept:(swy-slope*swx)/sw };
}

// Normalized Power, time-in-zone, aerobic decoupling, durability and an
// aggregate climbing-power figure — all derived straight from the stream.
// Ported near-verbatim from the Artifact's computeStreamMetrics().
function computeStreamMetrics(stream, powerZones, weightKg){
  if(!stream || !Array.isArray(stream.time) || !Array.isArray(stream.watts)) return null;
  const time = stream.time, watts = stream.watts, hr = stream.heartrate, alt = stream.altitude;
  const n = time.length;
  if(n < 4) return null;
  const dt = (time[n-1]-time[0])/(n-1);
  if(!dt || dt <= 0) return null;
  const durationSec = time[n-1]-time[0];

  const win = Math.max(1, Math.round(30/dt));
  const rolled = [];
  let s = 0;
  for(let i=0;i<n;i++){
    s += watts[i]||0;
    if(i>=win) s -= watts[i-win]||0;
    if(i>=win-1) rolled.push(s/Math.min(win,i+1));
  }
  let s4 = 0;
  rolled.forEach(v => { s4 += Math.pow(v,4); });
  const np = rolled.length ? Math.pow(s4/rolled.length, 0.25) : 0;

  const avgPower = watts.reduce((a,b)=>a+(b||0),0)/n;

  const zoneIndexFor = w => {
    let zi = powerZones.findIndex(z => z.max == null || w <= z.max);
    if(zi < 0) zi = powerZones.length-1;
    if(zi >= POWER_ZONE_META.length) zi = POWER_ZONE_META.length-1;
    return zi;
  };

  const zoneTimes = new Array(POWER_ZONE_META.length).fill(0);
  const sampleZoneIdx = new Array(n).fill(-1);
  if(Array.isArray(powerZones) && powerZones.length){
    for(let i=0;i<n;i++){
      const zi = zoneIndexFor(watts[i]||0);
      zoneTimes[zi] += dt;
      sampleZoneIdx[i] = zi;
    }
  }

  // Weekly-budget-only gate (weeklyClassProgress()/trainedOnDate()): for
  // classes representing genuine sustained intervals (tempo/threshold/
  // vo2max/anaerobic), a contiguous span of time-in-zone -- with a generous
  // grace-period tolerance for brief dips (traffic lights, corners, a few
  // seconds of coasting -- routine outdoor riding, not just indoor noise),
  // mirroring detectRideClimbs()'s start/lastClimbingIdx state machine below
  // -- must clear a minimum duration before it counts. zoneTimes above (used
  // by charts) stays pure cumulative time, unchanged; this is a separate
  // parallel array that starts as a copy of it, so classes without a gate
  // (recovery/endurance/sprint/longdistance) end up byte-identical to
  // zoneTimes automatically.
  const intervalZoneTimes = zoneTimes.slice();
  if(Array.isArray(powerZones) && powerZones.length){
    const idCfg = (typeof TRAINING_CONFIG !== 'undefined' && TRAINING_CONFIG.intervalDetection) || {};
    const graceSec = idCfg.graceSec ?? 20;
    const minSecByClass = idCfg.minSecByClass || { tempo:480, threshold:480, vo2max:150, anaerobic:30 };
    const classList = (typeof TRAINING_CLASSES !== 'undefined') ? TRAINING_CLASSES : [];
    Object.keys(minSecByClass).forEach(classKey => {
      const cls = classList.find(c => c.key === classKey);
      if(!cls || cls.zoneIdx == null) return;
      const zoneIdx = cls.zoneIdx;
      const minSec = minSecByClass[classKey];
      intervalZoneTimes[zoneIdx] = 0;
      let start = null, lastInZoneIdx = null, inZoneSec = 0;
      const finalize = (endIdx) => {
        // +dt: time[endIdx]-time[start] measures between the first and last
        // in-zone SAMPLE, one dt short of the span's actual elapsed duration
        // (inZoneSec, which accumulates dt per sample), so add it back to
        // avoid a systematic 1-sample-too-strict minSec gate.
        const totalSpan = time[endIdx] - time[start] + dt;
        // Grace-period gap seconds are only tolerated to avoid fragmenting a
        // real span (like detectRideClimbs()) -- they don't themselves count
        // toward the credited zone time, so only inZoneSec (accumulated from
        // actual in-zone samples) is added, not totalSpan.
        if(totalSpan >= minSec) intervalZoneTimes[zoneIdx] += inZoneSec;
      };
      for(let i=0;i<n;i++){
        if(sampleZoneIdx[i] === zoneIdx){
          if(start === null){ start = i; inZoneSec = 0; }
          inZoneSec += dt;
          lastInZoneIdx = i;
        } else if(start !== null && (time[i]-time[lastInZoneIdx]) > graceSec){
          finalize(lastInZoneIdx);
          start = null; lastInZoneIdx = null; inZoneSec = 0;
        }
      }
      if(start !== null) finalize(lastInZoneIdx);
    });
  }

  let decoupling = null, efFactor = null;
  if(Array.isArray(hr)){
    const mid = Math.floor(n/2);
    const seg = (a,b) => {
      let pw=0,bpm=0,c=0;
      for(let i=a;i<b;i++){ if(hr[i]!=null && hr[i]>0){ pw+=watts[i]||0; bpm+=hr[i]; c++; } }
      return c ? { p: pw/c, h: bpm/c } : null;
    };
    const first = seg(0,mid), second = seg(mid,n);
    if(first && second && first.h>0 && second.h>0 && first.p>0){
      const r1 = first.p/first.h, r2 = second.p/second.h;
      decoupling = (r1-r2)/r1*100;
    }
    const all = seg(0,n);
    if(all && all.h > 0) efFactor = np/all.h;
  }

  let durability = null;
  const tenMin = Math.round(600/dt);
  if(durationSec >= 5400 && tenMin >= 2 && n > tenMin*3){
    const overall = bestWindowAvg(watts, tenMin, 0, n);
    const lastThird = bestWindowAvg(watts, tenMin, Math.floor(n*2/3), n);
    if(overall && lastThird && overall > 0) durability = lastThird/overall;
  }

  let climbPower = null, climbSec = 0;
  if(Array.isArray(alt)){
    let pw = 0, c = 0;
    for(let i=1;i<n;i++){
      const dAlt = (alt[i]??0)-(alt[i-1]??0);
      const dTime = time[i]-time[i-1];
      if(dTime <= 0) continue;
      const vam = dAlt/dTime*60;
      if(vam >= 6){ pw += watts[i]||0; c++; climbSec += dTime; }
    }
    if(c >= 3) climbPower = pw/c;
  }

  return {
    np: Math.round(np), avgPower: Math.round(avgPower), durationSec,
    zoneTimes, intervalZoneTimes, decoupling, efFactor, durability,
    climbPower: climbPower!=null?Math.round(climbPower):null, climbSec,
    climbWkg: (climbPower!=null && weightKg) ? climbPower/weightKg : null
  };
}

// Discrete climb events (name/gradient/duration/watts/date) for the
// Profil-Kern "Kletterleistung" table. The Artifact sourced these from
// Strava's segment_efforts (needs a per-ride detail-endpoint call this app
// doesn't otherwise make); this instead segments the same watts/altitude/
// distance stream already fetched for the MMP ladder above by sustained
// vertical rate — same >=6 m/min threshold computeStreamMetrics() uses for
// its aggregate climbPower figure, just kept as discrete spans here instead
// of one whole-ride average. No Strava segment name is available this way,
// so climbs are labeled generically (see renderProfilKernSection()).
function detectRideClimbs(stream, weightKg){
  const { time, watts, altitude, distance } = stream;
  if(!Array.isArray(time) || !Array.isArray(watts) || !Array.isArray(altitude) || !Array.isArray(distance)) return [];
  const n = time.length;
  const climbs = [];

  // Strava's altitude stream is quantized (~0.1m) and near-1Hz, so raw per-
  // sample dAlt/dt is noisy — real shallow-but-genuine climbs frequently read
  // dAlt=0 for a tick or two, which fragments a sustained climb into
  // sub-threshold pieces (and, combined with the 120s min-duration filter
  // below, can make it vanish entirely). Smooth altitude over a ~20s rolling
  // window before thresholding, and tolerate a short below-threshold run
  // (grace period) before actually closing a climb span, so brief stream
  // noise doesn't fragment a real climb.
  const SMOOTH_WINDOW_SEC = 20, GRACE_SEC = 8;
  const smoothedAlt = new Array(n);
  { let lo=0, hi=0, sum=0, cnt=0;
    for(let i=0;i<n;i++){
      while(hi<n && time[hi]-time[i] <= SMOOTH_WINDOW_SEC/2){ sum += altitude[hi]??0; cnt++; hi++; }
      while(lo<i && time[i]-time[lo] > SMOOTH_WINDOW_SEC/2){ sum -= altitude[lo]??0; cnt--; lo++; }
      smoothedAlt[i] = cnt ? sum/cnt : (altitude[i]??0);
    }
  }

  let start = null, lastClimbingIdx = null;
  const finalize = (a,b) => {
    const sec = time[b]-time[a];
    const dist = (distance[b]??0)-(distance[a]??0);
    const elev = (altitude[b]??0)-(altitude[a]??0);
    if(sec < 120 || dist <= 0 || elev <= 0) return;
    const gradient = elev/dist*100;
    if(gradient < 3) return;
    let wsum=0, wc=0;
    for(let i=a;i<=b;i++){ wsum += watts[i]||0; wc++; }
    const avgWatts = wc ? wsum/wc : 0;
    if(avgWatts <= 0) return;
    climbs.push({ gradient, watts:avgWatts, sec, elev, wkg: weightKg ? avgWatts/weightKg : null });
  };
  for(let i=1;i<n;i++){
    const dt = time[i]-time[i-1];
    if(dt <= 0) continue;
    const dAlt = smoothedAlt[i]-smoothedAlt[i-1];
    const climbing = (dAlt/dt*60) >= 6;
    if(climbing){
      if(start === null) start = i-1;
      lastClimbingIdx = i;
    } else if(start !== null && (time[i]-time[lastClimbingIdx]) > GRACE_SEC){
      finalize(start, lastClimbingIdx);
      start = null; lastClimbingIdx = null;
    }
  }
  if(start !== null) finalize(start, lastClimbingIdx ?? n-1);
  return climbs;
}

// ---------- Profil: aggregate analysis ----------
// Ported from the Artifact's computeFtpAnalysis/buildTrainingLoad/
// buildZoneDistribution/buildPowerCurve/buildEfficiency/buildClimbing/
// buildDurability/buildRiderProfile/detectWeaknesses (~L1169-1456,
// ~L1665-1727) — same math, operating on `results` rows built by
// processProfilRide() below instead of the Artifact's MCP-shaped rows.
function computeFtpAnalysis(results){
  if(!results.length) return null;
  const first = results[0].date;
  const plausible = results.filter(r=>r.confidence!=='unbestätigt')
    .map(r=>({ x:(r.date-first)/86400000, y:r.estFtp }));
  const ceilingSeries = plausible.map((p,idx)=>{
    const start = p.x - CEILING_WINDOW_DAYS;
    let maxY = p.y;
    for(let j=idx;j>=0 && plausible[j].x>=start;j--) if(plausible[j].y>maxY) maxY=plausible[j].y;
    return { x:p.x, y:maxY, w:1 };
  });
  const reg = weightedLinearRegression(ceilingSeries);
  const today = new Date();
  const daysSinceFirst = (today-first)/86400000;
  let weeklySlope=null, forecast4=null, forecast8=null, forecast12=null, modelToday=null;
  if(reg){
    weeklySlope = reg.slope*7;
    modelToday = Math.round(reg.slope*daysSinceFirst+reg.intercept);
    forecast4 = Math.round(reg.slope*(daysSinceFirst+28)+reg.intercept);
    forecast8 = Math.round(reg.slope*(daysSinceFirst+56)+reg.intercept);
    forecast12 = Math.round(reg.slope*(daysSinceFirst+84)+reg.intercept);
  }
  return { first, ceilingSeries, reg, today, daysSinceFirst,
    weeklySlope, forecast4, forecast8, forecast12, modelToday,
    currentCeiling: ceilingSeries.length ? ceilingSeries[ceilingSeries.length-1].y : null };
}

// Local (not UTC) calendar-day key - r.date and the day-series Dates are both
// local-midnight-based, so keying via toISOString() would shift them a day for UTC+ zones.
function localDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function computeEwmaLoadSeries(daily, startDate){
  const start = new Date(startDate); start.setHours(0,0,0,0);
  const end = new Date(); end.setHours(0,0,0,0);
  const series = [];
  let ctl=0, atl=0;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    const key = localDateKey(d);
    const tss = daily.get(key)||0;
    ctl = ctl + (tss-ctl)/42;
    atl = atl + (tss-atl)/7;
    series.push({ date:new Date(d), tss, ctl, atl, tsb: ctl-atl });
  }
  const last = series[series.length-1];
  const rampWeekly = series.length>7 ? last.ctl - series[Math.max(0,series.length-8)].ctl : 0;

  let formVerdict, formClass, formWhy;
  const tsb = last ? last.tsb : 0;
  if(tsb > 15){ formVerdict='Sehr frisch / Formspitze'; formClass='good';
    formWhy=`Dein TSB liegt bei ${tsb.toFixed(0)}. Das ist Wettkampf-Frische — gut für einen Test oder ein Rennen, auf Dauer aber ein Zeichen für zu wenig Reiz.`; }
  else if(tsb > 5){ formVerdict='Erholt'; formClass='good';
    formWhy=`TSB ${tsb.toFixed(0)}: du bist ausgeruht und aufnahmefähig für harte Einheiten.`; }
  else if(tsb > -10){ formVerdict='Produktiv'; formClass='good';
    formWhy=`TSB ${tsb.toFixed(0)}: der Bereich, in dem Anpassung passiert, ohne dass Ermüdung überhandnimmt.`; }
  else if(tsb > -30){ formVerdict='Deutlich belastet'; formClass='warn';
    formWhy=`TSB ${tsb.toFixed(0)}: hoher Trainingsreiz. Kurzfristig produktiv, braucht aber bald Entlastung.`; }
  else { formVerdict='Überlastet'; formClass='danger';
    formWhy=`TSB ${tsb.toFixed(0)}: sehr tief. Das Risiko, dass Ermüdung die Anpassung auffrisst, ist hoch.`; }

  return { series, last, rampWeekly, formVerdict, formClass, formWhy,
    ctl: last?last.ctl:0, atl: last?last.atl:0, tsb };
}

function buildTrainingLoad(results, ftp){
  const withNp = results.filter(r=>r.metrics && r.metrics.np>0 && r.metrics.durationSec>0);
  if(!withNp.length || !ftp) return null;

  const daily = new Map();
  withNp.forEach(r => {
    const np = r.metrics.np, sec = r.metrics.durationSec;
    const intensity = np/ftp;
    const tss = (sec*np*intensity)/(ftp*3600)*100;
    const key = localDateKey(r.date);
    daily.set(key, (daily.get(key)||0) + tss);
  });

  return computeEwmaLoadSeries(daily, withNp[0].date);
}

function buildZoneDistribution(results){
  const weeks = new Map();
  results.forEach(r => {
    if(!r.metrics || !r.metrics.zoneTimes) return;
    const d = new Date(r.date);
    const day = (d.getDay()+6)%7;
    const monday = new Date(d); monday.setDate(d.getDate()-day); monday.setHours(0,0,0,0);
    const key = monday.toISOString().slice(0,10);
    if(!weeks.has(key)) weeks.set(key, { date:monday, zones:new Array(POWER_ZONE_META.length).fill(0) });
    const w = weeks.get(key);
    r.metrics.zoneTimes.forEach((t,i)=>{ if(i<w.zones.length) w.zones[i]+=t; });
  });
  const list = Array.from(weeks.values()).sort((a,b)=>a.date-b.date);

  let low=0, grey=0, high=0;
  const recent = list.slice(-8);
  recent.forEach(w => w.zones.forEach((t,i)=>{
    const band = POWER_ZONE_META[i].band;
    if(band==='low') low+=t; else if(band==='grey') grey+=t; else high+=t;
  }));
  const total = low+grey+high;
  const pct = total>0 ? { low:low/total*100, grey:grey/total*100, high:high/total*100 } : null;

  let verdict='Unbekannt', verdictClass='warn', why='Zu wenig Streamdaten für eine Bewertung.';
  if(pct){
    if(pct.grey > 35){ verdict='Grauzonen-Lastig'; verdictClass='warn';
      why=`${pct.grey.toFixed(0)}% deiner Zeit liegt in Tempo/Schwelle (Z3–Z4). Das ist der klassische "zu hart für locker, zu locker für hart"-Bereich: er erzeugt viel Ermüdung bei wenig Anpassung. Polarisiert wäre: mehr Zeit klar unter Z3, dafür die harten Einheiten wirklich hart.`; }
    else if(pct.low > 75 && pct.high < 4){ verdict='Sehr locker, wenig Intensität'; verdictClass='warn';
      why=`${pct.low.toFixed(0)}% in Z1–Z2, aber nur ${pct.high.toFixed(0)}% über der Schwelle. Gute Basis, aber ohne harte Reize bleibt die Leistungsdecke stehen.`; }
    else if(pct.low >= 70 && pct.high >= 4){ verdict='Gut polarisiert'; verdictClass='good';
      why=`${pct.low.toFixed(0)}% locker, ${pct.grey.toFixed(0)}% Grauzone, ${pct.high.toFixed(0)}% hart — nah am polarisierten Ideal (rund 80/20).`; }
    else { verdict='Gemischt'; verdictClass='warn';
      why=`${pct.low.toFixed(0)}% locker / ${pct.grey.toFixed(0)}% Grauzone / ${pct.high.toFixed(0)}% hart. Kein klares Muster — eine bewusstere Trennung von leichten und harten Tagen würde vermutlich mehr bringen.`; }
  }
  return { weeks:list, pct, verdict, verdictClass, why };
}

function buildPowerCurve(results, fromDate, toDate){
  const inRange = results.filter(r=>r.date>=fromDate && r.date<=toDate);
  const curve = {};
  inRange.forEach(r => {
    if(!r.mmp) return;
    Object.entries(r.mmp).forEach(([sec,w])=>{
      const s = Number(sec);
      if(!curve[s] || w > curve[s]) curve[s] = w;
    });
  });
  return { curve, rides: inRange.length };
}

function buildEfficiency(results){
  const pts = results
    .filter(r => r.metrics && r.metrics.efFactor && r.metrics.durationSec>1800)
    .map(r => ({ date:r.date, ef:r.metrics.efFactor, decoupling:r.metrics.decoupling }));
  if(!pts.length) return null;
  const first = pts[0].date;
  const reg = weightedLinearRegression(pts.map(p=>({x:(p.date-first)/86400000,y:p.ef,w:1})));
  const recent = pts.slice(-10).filter(p=>p.decoupling!=null).map(p=>p.decoupling);
  const recentDec = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : null;

  let verdict, verdictClass, why;
  if(recentDec == null){ verdict='Unbekannt'; verdictClass='warn'; why='Keine Herzfrequenzdaten für eine Entkopplungs-Analyse.'; }
  else if(recentDec < 5){ verdict='Sehr gute aerobe Basis'; verdictClass='good';
    why=`Deine Entkopplung liegt bei ${recentDec.toFixed(1)}%. Unter 5% gilt als aerob gut ausgebaut: dein Puls bleibt über die Fahrt hinweg stabil bei gleicher Leistung.`; }
  else if(recentDec < 10){ verdict='Solide, ausbaufähig'; verdictClass='warn';
    why=`Entkopplung ${recentDec.toFixed(1)}%. Im zweiten Teil deiner Fahrten kostet dieselbe Leistung merklich mehr Puls — mehr Grundlagenumfang würde das verbessern.`; }
  else { verdict='Aerobe Basis ist die Schwachstelle'; verdictClass='danger';
    why=`Entkopplung ${recentDec.toFixed(1)}%. Deutlich über der 5%-Marke: deine Ermüdung setzt früh ein. Das ist typischerweise ein Zeichen für zu wenig lange, lockere Fahrten.`; }

  return { points:pts, first, reg, recentDec, verdict, verdictClass, why,
    weeklyEfSlope: reg ? reg.slope*7 : null };
}

function buildClimbing(results, weightKg){
  const all = results.flatMap(r => (r.climbs||[]).map(c => ({ ...c, date:r.date })));
  if(!all.length) return null;
  const best = all.slice().sort((a,b)=>(b.wkg||0)-(a.wkg||0)).slice(0,15);
  const byDate = all.slice().sort((a,b)=>a.date-b.date);
  const first = byDate[0].date;
  const sustained = byDate.filter(c=>c.sec>=240 && c.wkg);
  const reg = sustained.length>2
    ? weightedLinearRegression(sustained.map(c=>({x:(c.date-first)/86400000,y:c.wkg,w:1}))) : null;
  return { all, best, sustained, first, reg,
    bestWkg: best.length?best[0].wkg:null, count:all.length,
    weeklySlope: reg ? reg.slope*7 : null };
}

function buildDurability(results){
  const longRides = results.filter(r=>r.metrics && r.metrics.durability!=null);
  if(!longRides.length) return null;
  const recent = longRides.slice(-5);
  const recentAvg = recent.reduce((s,r)=>s+r.metrics.durability,0)/recent.length;

  let verdict, verdictClass, why;
  if(recentAvg >= 0.95){ verdict='Sehr ermüdungsresistent'; verdictClass='good';
    why=`Im letzten Drittel langer Fahrten erreichst du noch ${(recentAvg*100).toFixed(0)}% deiner besten 10-Minuten-Leistung. Du hältst deine Leistung, auch wenn es lange dauert.`; }
  else if(recentAvg >= 0.85){ verdict='Gute Ermüdungsresistenz'; verdictClass='good';
    why=`${(recentAvg*100).toFixed(0)}% deiner besten 10-Min-Leistung bleiben im letzten Drittel übrig — ein solider Wert.`; }
  else if(recentAvg >= 0.75){ verdict='Ausbaufähig'; verdictClass='warn';
    why=`Im letzten Drittel langer Fahrten fällst du auf ${(recentAvg*100).toFixed(0)}% deiner Bestleistung ab. Längere Grundlagenfahrten und Intervalle im ermüdeten Zustand würden das verbessern.`; }
  else { verdict='Schwachstelle'; verdictClass='danger';
    why=`Nur ${(recentAvg*100).toFixed(0)}% deiner besten 10-Min-Leistung bleiben spät in langen Fahrten übrig. Deine Spitzenwerte sagen wenig darüber aus, was du nach 3 Stunden noch kannst.`; }

  return { rides:longRides, recentAvg, verdict, verdictClass, why };
}

// 2700 (45min) is an authored interpolation, not a separately cited value:
// FTP_FACTORS already treats ~0.95x20-min-power as the file's own FTP
// convention, and ratio-to-20min is by definition 1.0 at 20min itself, so
// 0.965 sits between those two anchors for the 45-minute point.
const REFERENCE_RATIOS = { 60:1.72, 300:1.18, 600:1.06, 2700:0.965 };
// Authored/reasoned estimate (not a single cited published value, same
// disclaimer style as classBaselineScore below) for 5s sprint peak power
// vs 1-minute power.
const SPRINT_REFERENCE_RATIO = 1.55;
// Wie oben: authored/reasoned estimates für die übrigen 5 Schwellenwerte in
// detectWeaknesses(). Jeder hat zusätzlich einen "Severe Span" -- wie weit
// die Abweichung reichen muss, damit score=100 erreicht wird. Bewusst pro
// Kategorie einzeln gewählt statt eines globalen Faktors: ein einheitlicher
// Faktor würde bei kleinen Referenzwerten (z.B. 4%) sofort sättigen.
const FTP_RATIO_LIMIT = 1.30;
const FTP_RATIO_SEVERE_SPAN = 0.20;
const GREYZONE_LIMIT_PCT = 35;
const GREYZONE_SEVERE_SPAN_PCT = 30;
const HARD_INTENSITY_MIN_PCT = 4;
const HARD_INTENSITY_SEVERE_SPAN_PCT = 4;
const DECOUPLING_LIMIT_PCT = 5;
const DECOUPLING_SEVERE_SPAN_PCT = 10;
const DURABILITY_MIN_RATIO = 0.9;
const DURABILITY_SEVERE_SPAN_RATIO = 0.3;

function buildRiderProfile(pp, ftpAnalysis){
  const results = pp.results;
  const zonesRaw = pp.zonesRaw || {};
  const today = new Date();
  const daysAgo = d => (today-d)/86400000;
  const recentWindow = results.filter(r=>daysAgo(r.date)<=CEILING_WINDOW_DAYS);
  const pool = recentWindow.length>=3 ? recentWindow : results;

  const mmpCurve = {};
  pool.forEach(r => r.mmp && Object.entries(r.mmp).forEach(([sec,w])=>{
    const s=Number(sec); if(!mmpCurve[s] || w>mmpCurve[s]) mmpCurve[s]=w;
  }));
  const p1=mmpCurve[60]??null, p5=mmpCurve[300]??null, p10=mmpCurve[600]??null, p20=mmpCurve[1200]??null;

  const dataFtp = ftpAnalysis ? ftpAnalysis.currentCeiling : null;
  const profileFtp = (pp.athleteDetail && pp.athleteDetail.ftp) || null;
  const ftp = dataFtp || profileFtp;
  const ftpSource = dataFtp ? `aus deinen Fahrten (${CEILING_WINDOW_DAYS}-Tage-Bestwert)` : "aus deinem Strava-Profil";
  const weight = (pp.athleteDetail && pp.athleteDetail.weight) || null;

  let riderType='Unbestimmt', riderTypeWhy='Zu wenig Bestleistungs-Daten für eine Einordnung.', ratio5_20=null;
  if(p5 && p20){
    ratio5_20 = p5/p20;
    const pctTxt = Math.round((ratio5_20-1)*100);
    if(ratio5_20>=1.22){ riderType='Puncheur / anaerob veranlagt';
      riderTypeWhy=`Deine 5-Minuten-Leistung liegt ${pctTxt}% über deiner 20-Minuten-Leistung – eine steile Kurve. Deine Stärke liegt über der Schwelle: kurze Anstiege, Antritte, Attacken.`; }
    else if(ratio5_20<=1.12){ riderType='Diesel / Zeitfahrer-Typ';
      riderTypeWhy=`Deine 5-Minuten-Leistung liegt nur ${pctTxt}% über deiner 20-Minuten-Leistung – eine sehr flache Kurve. Du hältst Leistung lange konstant, hast aber wenig Spitze obendrauf.`; }
    else { riderType='Allrounder';
      riderTypeWhy=`Deine 5-Minuten-Leistung liegt ${pctTxt}% über deiner 20-Minuten-Leistung – ein ausgewogenes Verhältnis zwischen Schwellenleistung und Spitze.`; }
  }

  return { ftp, ftpSource, weight, p1, p5, p10, p20, mmpCurve, ratio5_20,
    riderType, riderTypeWhy, weeklySlope: ftpAnalysis ? ftpAnalysis.weeklySlope : null,
    sampleSize: results.length };
}

function detectWeaknesses(rp, zoneDist, efficiency, durability){
  const items = [];
  const p20 = rp.p20;

  if(p20){
    const shape = [
      { sec:60,  label:'Anaerobe Kapazität (1 Min)', goal:'anaerobic' },
      { sec:300, label:'VO2max (5 Min)',              goal:'vo2max' },
      { sec:600, label:'Aerobe Leistung (10 Min)',    goal:'vo2max' },
      { sec:2700, label:'Tempo-Ausdauer (45 Min)',    goal:'tempo' }
    ];
    shape.forEach(s => {
      const actual = rp.mmpCurve ? rp.mmpCurve[s.sec] : null;
      if(!actual) return;
      const ratio = actual/p20;
      const ref = REFERENCE_RATIOS[s.sec];
      const deficit = (ref-ratio)/ref*100;
      if(deficit > 3) items.push({
        area: s.label, goal: s.goal, score: Math.min(100, deficit*6),
        numText: `${(ratio*100).toFixed(0)}% · Ziel ${(ref*100).toFixed(0)}%`,
        why: `Deine ${fmtDurLabel(s.sec)}-Leistung liegt bei ${(ratio*100).toFixed(0)}% deiner 20-Minuten-Leistung; typisch wären etwa ${(ref*100).toFixed(0)}%. Relativ zu deiner Schwelle fehlt hier Spitze.`
      });
    });
    const p5 = rp.p5;
    if(p5 && p5/p20 > FTP_RATIO_LIMIT){
      const excess = p5/p20 - FTP_RATIO_LIMIT;
      items.push({
        area:'Schwellenleistung (FTP)', goal:'ftp', score: Math.min(100, excess/FTP_RATIO_SEVERE_SPAN*100),
        numText: `${(p5/p20*100).toFixed(0)}% · Grenze ${(FTP_RATIO_LIMIT*100).toFixed(0)}%`,
        why:`Deine 5-Minuten-Leistung liegt ${((p5/p20-1)*100).toFixed(0)}% über deiner 20-Minuten-Leistung — eine sehr steile Kurve. Deine Spitze ist gut, dein Unterbau hinkt hinterher — mehr Schwellenarbeit würde das ausgleichen.`
      });
    }
  }

  // Sprint uses its own ratio (5s peak vs 1-min power) instead of vs-p20,
  // so it isn't part of the `shape` loop above.
  if(rp.mmpCurve && rp.mmpCurve[5] && rp.p1){
    const p5s = rp.mmpCurve[5];
    const ratio = p5s/rp.p1;
    const deficit = (SPRINT_REFERENCE_RATIO-ratio)/SPRINT_REFERENCE_RATIO*100;
    if(deficit > 3) items.push({
      area:'Sprintleistung (5 Sek.)', goal:'sprint', score: Math.min(100, deficit*6),
      numText: `${(ratio*100).toFixed(0)}% · Ziel ${(SPRINT_REFERENCE_RATIO*100).toFixed(0)}%`,
      why:`Deine 5-Sekunden-Spitzenleistung liegt bei ${(ratio*100).toFixed(0)}% deiner 1-Minuten-Leistung; typisch wären etwa ${(SPRINT_REFERENCE_RATIO*100).toFixed(0)}%. Dir fehlt kurze, maximale Sprintpower obendrauf.`
    });
  }

  if(zoneDist && zoneDist.pct){
    if(zoneDist.pct.grey > GREYZONE_LIMIT_PCT){
      const excess = zoneDist.pct.grey - GREYZONE_LIMIT_PCT;
      items.push({
        area:'Trainingsverteilung (Grauzone)', goal:'endurance',
        score: Math.min(100, excess/GREYZONE_SEVERE_SPAN_PCT*100),
        numText: `${zoneDist.pct.grey.toFixed(0)}% · Grenze ${GREYZONE_LIMIT_PCT}%`,
        why:`${zoneDist.pct.grey.toFixed(0)}% deiner Zeit liegt in Z3–Z4. Diese Grauzone erzeugt Ermüdung ohne den Reiz einer echten harten Einheit — mehr klar lockere Fahrten würden deine harten Tage besser machen.`
      });
    }
    if(zoneDist.pct.high < HARD_INTENSITY_MIN_PCT){
      const deficitAbs = HARD_INTENSITY_MIN_PCT - zoneDist.pct.high;
      items.push({
        area:'Intensitätsanteil', goal:'vo2max',
        score: Math.min(100, deficitAbs/HARD_INTENSITY_SEVERE_SPAN_PCT*100),
        numText: `${zoneDist.pct.high.toFixed(1)}% · Ziel ≥${HARD_INTENSITY_MIN_PCT}%`,
        why:`Nur ${zoneDist.pct.high.toFixed(1)}% deiner Zeit liegt über der Schwelle. Ohne regelmäßige harte Reize bleibt deine Leistungsdecke, wo sie ist.`
      });
    }
  }

  if(efficiency && efficiency.recentDec != null && efficiency.recentDec > DECOUPLING_LIMIT_PCT){
    const excess = efficiency.recentDec - DECOUPLING_LIMIT_PCT;
    items.push({
      area:'Aerobe Entkopplung', goal:'endurance', score: Math.min(100, excess/DECOUPLING_SEVERE_SPAN_PCT*100),
      numText: `${efficiency.recentDec.toFixed(1)}% · Grenze ${DECOUPLING_LIMIT_PCT}%`,
      why:`Deine Herzfrequenz driftet um ${efficiency.recentDec.toFixed(1)}% nach oben, während die Leistung gleich bleibt. Das deutet auf eine Grundlage hin, die für deine aktuellen Fahrtdauern zu dünn ist.`
    });
  }

  if(durability && durability.recentAvg < DURABILITY_MIN_RATIO){
    const deficitAbs = DURABILITY_MIN_RATIO - durability.recentAvg;
    items.push({
      area:'Ermüdungsresistenz', goal:'endurance', score: Math.min(100, deficitAbs/DURABILITY_SEVERE_SPAN_RATIO*100),
      numText: `${(durability.recentAvg*100).toFixed(0)}% · Ziel ≥${(DURABILITY_MIN_RATIO*100).toFixed(0)}%`,
      why:`Spät in langen Fahrten bleiben nur ${(durability.recentAvg*100).toFixed(0)}% deiner besten 10-Minuten-Leistung übrig. Deine Frischwerte übersetzen sich nicht in Leistung nach mehreren Stunden.`
    });
  }

  items.sort((a,b)=>b.score-a.score);
  const top = items[0] || null;
  return {
    items,
    headline: top ? top.area : 'Keine klare Schwachstelle',
    reason: top ? top.why : 'Dein Profil wirkt ausgewogen — Schwellenarbeit ist dann meist der solideste Standard.'
  };
}

function computeProfilAnalysis(){
  const pp = state.profilPage;
  const results = pp.results;
  pp.ftpAnalysis = computeFtpAnalysis(results);
  const weightKg = pp.athleteDetail && pp.athleteDetail.weight;
  const ftpForLoad = (pp.athleteDetail && pp.athleteDetail.ftp) || (pp.ftpAnalysis && pp.ftpAnalysis.currentCeiling) || null;
  pp.trainingLoad = buildTrainingLoad(results, ftpForLoad);
  pp.zoneDist = buildZoneDistribution(results);
  pp.efficiency = buildEfficiency(results);
  pp.climbing = buildClimbing(results, weightKg);
  pp.durability = buildDurability(results);
  pp.riderProfile = buildRiderProfile(pp, pp.ftpAnalysis);
  pp.weak = detectWeaknesses(pp.riderProfile, pp.zoneDist, pp.efficiency, pp.durability);
}

// ---------- Profil: loading pipeline ----------
async function processProfilRide(a, token, weightKg, zonesRaw){
  const id = String(a.id);
  let raw;
  try{ raw = await fetchActivityPowerStreams(id, token); }
  catch(e){ return { status:'apiError' }; }
  const stream = normalizeStreams(raw);
  if(!stream.time || !stream.watts || stream.time.length < 30) return { status:'noBestEffort' };

  const mmp = computeMmpFromStream(stream);
  const est = mmp ? estimateFtpFromMmp(mmp) : null;
  if(!est) return { status:'noBestEffort' };

  const windowStats = bestWindowHrStats(stream.time, stream.watts, stream.heartrate, est.sec);
  let avgHr=null, maxHr=null, hrSource=null;
  if(windowStats){ avgHr=Math.round(windowStats.avgHr); maxHr = windowStats.maxHr!=null?Math.round(windowStats.maxHr):null; hrSource='interval'; }
  else if(a.average_heartrate!=null){ avgHr=Math.round(a.average_heartrate); maxHr = a.max_heartrate!=null?Math.round(a.max_heartrate):null; hrSource='whole-ride (Fallback)'; }

  const hrZones = zonesRaw && zonesRaw.heart_rate && zonesRaw.heart_rate.zones;
  const plaus = checkEffortPlausibility(maxHr, hrZones);
  let confidence = est.confidence, weight = est.weight, hrNote = null;
  if(plaus && plaus.plausible === false){
    confidence = 'unbestätigt'; weight = CONFIDENCE_WEIGHT['unbestätigt'];
    hrNote = `Max-HF im ${fmtDurLabel(est.sec)}-Fenster (${hrSource}) war ${maxHr} bpm, unter Zone 3 (ab ${plaus.tempoFloor}).`;
  } else if(avgHr!=null){
    hrNote = `HF im ${fmtDurLabel(est.sec)}-Fenster (${hrSource}): Ø ${avgHr} bpm, Max ${maxHr ?? '–'} bpm.`;
  }

  const powerZonesRaw = zonesRaw && zonesRaw.power && zonesRaw.power.zones;
  const powerZonesNorm = Array.isArray(powerZonesRaw) ? powerZonesRaw.map(z=>({ max: z.max===-1 ? null : z.max })) : null;
  const metrics = computeStreamMetrics(stream, powerZonesNorm, weightKg);
  const climbs = detectRideClimbs(stream, weightKg);
  // Ausgeschlossen bei 'unbestätigt' (dieselbe Plausibilitätsprüfung wie
  // oben) -- eine unplausible FTP-Schätzung würde sonst die ganze
  // Leistungs-Achse dieser Fahrt fürs Tempo-Modell verfälschen.
  const speedCal = confidence !== 'unbestätigt' ? computeSpeedCalibrationFromStream(stream, est.ftp) : null;

  return { status:'ok', row: {
    id, date: new Date(a.start_date_local || a.start_date), name: a.name,
    movingMin: Math.round((a.moving_time||0)/60), movingSec: a.moving_time||0,
    distanceKm: a.distance ? a.distance/1000 : 0,
    avgWatts: a.average_watts!=null ? Math.round(a.average_watts) : null,
    mmp, intervalAvgHr:avgHr, intervalMaxHr:maxHr, hrSource,
    estFtp: est.ftp, basis: est.basis, confidence, weight, hrNote,
    metrics, climbs, speedCal, metricsVersion: PROFIL_METRICS_VERSION
  }};
}

// Orchestrates the whole load: athlete/zones/gear once, then paginates
// /athlete/activities until rideBudget qualifying rides are collected,
// skips anything already known (cache/skip-cache or no device_watts) for
// free, and only fetches streams for genuinely new candidates.
async function loadProfilData(token, opts){
  opts = opts || {};
  const pp = state.profilPage;
  if(pp.loading) return;
  pp.loading = true; pp.error = null;
  pp.progress = { label: "Athlet-Profil wird geladen…" };
  render();
  try{
    if(!pp.athleteDetail || opts.forceRefresh){
      const [athleteDetail, zonesRaw] = await Promise.all([
        fetchAthleteDetail(token),
        fetchAthleteZones(token).catch(()=>null)
      ]);
      pp.athleteDetail = athleteDetail;
      pp.zonesRaw = zonesRaw;
      // `kind` is tagged here (not inferred later from response shape) since
      // it's the one piece of info that's unambiguous right now — /athlete
      // already tells us which list each gear ref came from — but gets
      // genuinely ambiguous once merged with a shoe's DetailedGear response,
      // which has no field of its own that says "this is a shoe".
      const gearRefs = [
        ...(athleteDetail.bikes||[]).map(g => ({ ref:g, kind:'Bike' })),
        ...(athleteDetail.shoes||[]).map(g => ({ ref:g, kind:'Shoe' }))
      ];
      const gearDetails = [];
      for(const { ref, kind } of gearRefs){
        try{ gearDetails.push({ ...(await fetchGearDetail(ref.id, token)), kind }); }
        catch(e){ gearDetails.push({ ...ref, kind }); }
      }
      pp.gear = gearDetails;
    }

    const weightKg = pp.athleteDetail.weight || null;
    if(opts.forceRefresh){ clearProfilActivityCache(); clearProfilSkipCache(); }
    const cache = loadProfilActivityCache();
    const skipCache = loadProfilSkipCache();

    let candidates = [];
    let page = 1;
    const perPage = 100;
    while(candidates.length < pp.rideBudget && page <= 10){
      pp.progress = { label: `Aktivitäten werden gesucht… (${candidates.length} von ${pp.rideBudget})` };
      render();
      const batch = await fetchActivitiesPage(token, page, perPage);
      if(!batch || !batch.length) break;
      candidates = candidates.concat(batch.filter(a => RIDE_SPORT_TYPES.has(a.sport_type || a.type)));
      if(batch.length < perPage) break;
      page++;
    }
    candidates = candidates.slice(0, pp.rideBudget);

    const cachedRows = [], toFetch = [];
    let skippedNoWatts = 0, skippedNoBestEffort = 0;
    candidates.forEach(a => {
      const id = String(a.id);
      const hit = cache[id];
      // Only reuse a cached row if it was computed under the current
      // metrics shape (PROFIL_METRICS_VERSION) -- an old row is missing
      // fields like intervalZoneTimes that can't be backfilled without
      // re-fetching the raw stream, so let it fall through to toFetch below.
      if(hit && hit.metricsVersion === PROFIL_METRICS_VERSION){ cachedRows.push(hit); return; }
      const skip = skipCache[id];
      if(skip){
        if(skip.status==='noWatts') skippedNoWatts++; else skippedNoBestEffort++;
        return;
      }
      if(!a.device_watts){
        skipCache[id] = { status:'noWatts', date: new Date(a.start_date_local || a.start_date) };
        skippedNoWatts++;
        return;
      }
      toFetch.push(a);
    });

    let fetched = 0, skippedApiError = 0;
    const freshRows = [];
    const concurrency = 4;
    for(let i=0;i<toFetch.length;i+=concurrency){
      const batch = toFetch.slice(i, i+concurrency);
      pp.progress = { label: `Leistungsdaten werden geladen… (${i} von ${toFetch.length})` };
      render();
      const results = await Promise.all(batch.map(a => processProfilRide(a, token, weightKg, pp.zonesRaw)));
      results.forEach((r, idx) => {
        const a = batch[idx];
        const id = String(a.id);
        if(r.status === 'ok'){ cache[id] = r.row; freshRows.push(r.row); fetched++; }
        else if(r.status === 'noBestEffort'){ skipCache[id] = { status:'noBestEffort', date: new Date(a.start_date_local || a.start_date) }; skippedNoBestEffort++; }
        else { skippedApiError++; }
      });
      if(i+concurrency < toFetch.length) await new Promise(r=>setTimeout(r,150));
    }
    saveProfilActivityCache(cache);
    saveProfilSkipCache(skipCache);

    pp.results = cachedRows.concat(freshRows).sort((a,b)=>a.date-b.date);
    pp.stats = { candidates: candidates.length, cached: cachedRows.length, fetched, skippedNoWatts, skippedNoBestEffort, skippedApiError };
    computeProfilAnalysis();
  }catch(e){
    pp.error = e.message || "Trainingsdaten konnten nicht geladen werden.";
  }
  pp.loading = false; pp.loaded = true; pp.progress = null;
  render();
}

// ---------- Open-Meteo ----------
async function fetchWeather(lat, lon, targetDate){
  targetDate = targetDate || new Date();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation_probability,uv_index&forecast_days=7&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Wetterdaten nicht verfügbar");
  const data = await res.json();
  // find the forecast hour closest to the target (arrival) time
  const hours = data.hourly.time;
  let idx = 0, best = Infinity;
  hours.forEach((t,i)=>{
    const diff = Math.abs(new Date(t) - targetDate);
    if(diff < best){ best = diff; idx = i; }
  });
  return {
    temp: data.hourly.temperature_2m[idx],
    windSpeed: data.hourly.wind_speed_10m[idx],
    windDir: data.hourly.wind_direction_10m[idx],
    windGust: data.hourly.wind_gusts_10m[idx],
    precip: data.hourly.precipitation_probability[idx],
    uvIndex: data.hourly.uv_index ? data.hourly.uv_index[idx] : null,
    forecastTime: new Date(hours[idx]),
    hourly: data.hourly,
    idx
  };
}
