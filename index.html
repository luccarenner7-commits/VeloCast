<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloCast</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171d">
<!-- iOS doesn't fully honor the manifest above yet, so it needs its own
     "add to home screen" hints for the standalone (no browser chrome) look. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VeloCast">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --asphalt: #14171d;
    --asphalt-2: #1c212a;
    --asphalt-3: #262c37;
    --line: #333a47;
    --chalk: #f2efe9;
    --chalk-dim: #98a1ae;
    /* Locked wind-favorability triad — tail/cross/head are used TOGETHER
       to mean tailwind/crosswind/headwind favorability in scannable, repeated
       data (route line, tags, chart lines, wind-mix bar/rings). Any other
       "state" color (selected, active, connected, error, climb grade,
       wind-speed intensity, etc.) intentionally uses --route (neutral info
       blue) or one of the dedicated intensity ramps below instead, so
       green/amber/red never gets diluted with an unrelated meaning across
       repeated UI. The one deliberate exception is the strong-wind safety
       banner (see computeStrongWindWarning / its render in renderRouteCard):
       it's a rare, one-off alarm rather than a repeated data point a user
       scans across many rows, so red-as-danger there is a distinct, legitimate
       UX pattern on its own — not the same "could be misread as tailwind"
       risk as e.g. coloring every Windfeld arrow or every climb chip.
       --accent is a second, separate exception: it happens to share
       tail-green's hue for brand/primary-action identity (wordmark, CTA
       button) — that's a *brand* color choice, not a wind-favorability
       signal, so it's named and used separately from --tail. */
    --tail: #4fb08c;
    --tail-bg: rgba(79,176,140,0.12);
    --head: #f2766b;
    --head-bg: rgba(242,118,107,0.12);
    --cross: #e2b23e;
    --cross-bg: rgba(226,178,62,0.12);
    --accent: #4fb08c;
    /* Neutral informational accent — hover/selected/active UI states, links,
       non-wind stat chips (PR time, distance, KOM…), the elevation chart
       line. Deliberately not part of the wind vocabulary above. */
    --route: #82a2d1;
    --route-bg: rgba(130,162,209,0.14);
    /* Climb-grade intensity ramp: a separate, single-hue (blue) scale for
       steepness, distinct from the wind-favorability colors so a steep climb
       chip never reads as "headwind". Brightness (light = more intense)
       stands in for intensity. Tuned for the DARK climb-chart/chip context
       (asphalt-family backgrounds) — do not reuse this ramp anywhere the
       backdrop is light (see --wind-* below for that case). */
    --grade-1: #7f97bd; --grade-1-bg: rgba(127,151,189,0.10);
    --grade-2: #82a2d1; --grade-2-bg: rgba(130,162,209,0.14);
    --grade-3: #9fb8dc; --grade-3-bg: rgba(159,184,220,0.18);
    --grade-4: #c3d5ec; --grade-4-bg: rgba(195,213,236,0.22);
    /* Wind-speed (absolute, not direction-relative) intensity ramp for the
       Windfeld map overlay — its own token family, deliberately NOT the
       --grade-* ramp above, because the Leaflet basemap tiles are light
       (cartodb light_all, ~#f2f0eb), the inverse of the dark climb-chart
       context --grade-* was tuned for. Direction is reversed from --grade-*
       too: here DARKER/more saturated = stronger wind, so the most
       dangerous reading is the most visually prominent against light tiles,
       not the least. Alpha is baked into each stop (not a separate opacity
       multiplier) so contrast against the tiles can be tuned per step —
       measured (blended-pixel vs. #f2f0eb) at roughly 3.2:1 / 4.8:1 / 7.3:1 /
       11.7:1 for tiers 1→4, all above the 3:1 WCAG floor for non-text
       graphics conveying information. */
    --wind-1: rgba(90,123,168,0.90);
    --wind-2: rgba(63,95,143,0.92);
    --wind-3: rgba(42,69,112,0.94);
    --wind-4: rgba(22,41,77,0.97);
    /* Shape system: one radius per element category, applied everywhere that
       category appears. Circular controls (toggle, arrow-badge, swatch) are
       an intentional exception — they're glyphs/switches, not chips. */
    --r-xs: 6px;   /* tags, stat-chips */
    --r-sm: 8px;   /* inputs, selects, popups */
    --r-md: 10px;  /* buttons, list rows, weather chips */
    --r-lg: 14px;  /* cards, map container */
    --r-full: 999px; /* pills */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:transparent; color:var(--chalk); }
  body{
    font-family:'Inter', sans-serif;
    background: var(--asphalt);
    min-height:100vh;
  }
  .app{ max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 22px; }
  .brand .brand-left{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size: 26px; letter-spacing: -0.02em; margin:0;
    color: var(--chalk);
  }
  .brand h1 span{ color: var(--accent); }
  .brand .status{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.08em; }

  /* Hamburger nav trigger — plain icon button, same asphalt/line vocabulary
     as .btn.secondary rather than a borderless glyph, so it reads as a
     tappable control at a glance. */
  .hamburger-btn{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; flex-shrink:0; align-self:center;
    background: var(--asphalt-3); border:1px solid var(--line); border-radius:var(--r-sm);
    cursor:pointer; padding:0;
  }
  .hamburger-btn:hover{ border-color:var(--route); }
  .hamburger-btn svg{ display:block; }

  /* Left slide-in nav drawer + backdrop. Both are plain el()-built nodes
     recreated on every render() like the rest of the tree (unlike
     routeMapContainer/the settings inputs, neither holds any mid-interaction
     native browser state, so there's no Safari-crash-style reason to make
     them persistent module-level nodes). The slide transition is real CSS
     (transform/opacity), which the file-wide
     `@media (prefers-reduced-motion: reduce)` rule below already collapses
     to instant show/hide for every element, this one included. */
  .nav-backdrop{
    position:fixed; inset:0; background:rgba(20,23,29,0.6);
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
    z-index:40;
  }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }
  .nav-drawer{
    position:fixed; top:0; left:0; bottom:0; width:260px; max-width:80vw;
    background:var(--asphalt-2); border-right:1px solid var(--line);
    transform:translateX(-100%); transition:transform 0.22s ease;
    z-index:41; padding:24px 16px; display:flex; flex-direction:column; gap:4px;
    overflow-y:auto;
  }
  .nav-drawer.open{ transform:translateX(0); }
  .nav-drawer .nav-drawer-title{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px;
    letter-spacing:-0.02em; margin:0 0 18px; color:var(--chalk);
  }
  .nav-drawer .nav-drawer-title span{ color:var(--accent); }
  /* Same neutral "active" treatment as .source-tab.active (asphalt-3 fill +
     chalk border/text) for visual consistency across the app's tab/nav
     controls. */
  .nav-item{
    padding:12px 14px; border-radius:var(--r-md); cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    color:var(--chalk-dim); border:1px solid transparent;
  }
  .nav-item:hover{ border-color:var(--route); color:var(--chalk); }
  .nav-item.active{ background:var(--asphalt-3); border-color:var(--chalk); color:var(--chalk); }
  /* Connection status is a UI on/off state, not a wind-favorability judgment
     — deliberately neutral (chalk-dim/route) rather than red/green so it
     can't be misread as "bad wind / good wind". */
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--chalk-dim); }
  .dot.on{ background: var(--route); }

  .card{
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    margin: 0 0 14px; color: var(--chalk);
    text-transform: uppercase; letter-spacing:0.06em;
  }
  .muted{ color: var(--chalk-dim); font-size: 14px; line-height:1.55; }

  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    background: var(--accent); color: #0d1712; border:none; border-radius:var(--r-md);
    padding: 12px 18px; cursor:pointer; letter-spacing:0.01em;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn.secondary{ background: var(--asphalt-3); color: var(--chalk); border:1px solid var(--line); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  input[type=text], input[type=datetime-local], input[type=number], select{
    width:100%; background: var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:11px 12px; color: var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;
    margin-bottom:10px;
  }
  label{ font-size:12px; color:var(--chalk-dim); display:block; margin-bottom:6px; font-family:'IBM Plex Mono', monospace; }

  .settings-row{ display:grid; grid-template-columns: repeat(3, minmax(190px,1fr)); gap:10px; margin-bottom:16px; }
  .settings-row > div{ min-width:0; }
  @media (max-width:620px){ .settings-row{ grid-template-columns: 1fr; } }

  /* Route source tabs. "Active" is a UI-selection state, not a wind
     judgment — kept neutral (chalk on asphalt-3) rather than tail-green so
     it can't be misread as "this tab = good wind". */
  .source-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .source-tab{
    flex:1; text-align:center; padding:9px 8px; border-radius:var(--r-sm); border:1px solid var(--line);
    background:var(--asphalt); color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .source-tab:hover{ border-color:var(--route); }
  .source-tab.active{ background:var(--asphalt-3); border-color:var(--chalk); color:var(--chalk); }

  /* Activity picker. Same rule: "selected" is a neutral UI state (uses the
     --route info accent, consistent with hover), never tail/head/cross. */
  .activity{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 14px; border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:8px;
    cursor:pointer; background: var(--asphalt);
  }
  .activity:hover{ border-color: var(--route); }
  .activity.selected{ border-color: var(--route); background: var(--route-bg); }
  .activity .name{ font-weight:600; font-size:14px; }
  .activity .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:2px; }

  .legend{ display:flex; gap:18px; margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  /* Small 10px legend marks read fine at a tighter radius than the 6px chip
     scale below — kept as a deliberate exception, not a stray value. */
  .swatch{ width:10px; height:10px; border-radius:2px; }

  /* Route map — same large-container radius as .card since it visually
     behaves like one. */
  #route-map{
    width:100%; height:340px; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--line); background: var(--asphalt);
  }
  .leaflet-popup-content-wrapper{ background: var(--asphalt-2); color: var(--chalk); border-radius:var(--r-sm); }
  .leaflet-popup-content{ font-family:'IBM Plex Mono', monospace; font-size:12px; margin:8px 10px; }
  .leaflet-popup-tip{ background: var(--asphalt-2); }
  .leaflet-container{ font-family:'Inter', sans-serif; }

  /* Segments */
  .segment{
    display:flex; flex-direction:column; gap:10px; cursor:pointer;
    padding:14px; border-radius:var(--r-md); margin-bottom:8px; border:1px solid var(--line);
  }
  .segment:hover{ border-color:var(--route); }
  .segment.static{ cursor:default; }
  .segment.static:hover{ border-color:var(--line); }
  .segment.static.selected:hover{ border-color:var(--route); }
  .segment.selected{ border-color:var(--route); background:var(--route-bg); }
  .segment .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .segment .left{ display:flex; align-items:flex-start; gap:12px; min-width:0; flex:1; }
  .segment .arrow-badge{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .segment .name{ font-weight:600; font-size:14px; }
  .segment .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:3px; }
  /* Stat chips: hero-numeral pill — a bold, larger value line over a small
     uppercase label line, instead of one flat string, so the number (PR
     time, watts, climb length…) reads at a glance. */
  .stat-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .stat-chip{
    display:inline-flex; flex-direction:column; align-items:flex-start; white-space:nowrap;
    color:var(--route); background:var(--route-bg);
    border-radius:var(--r-xs); padding:5px 9px; min-width:0;
  }
  .stat-chip .v{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; line-height:1.1; letter-spacing:-0.01em; color:inherit; }
  .stat-chip .l{ font-family:'IBM Plex Mono', monospace; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:inherit; opacity:0.75; margin-top:2px; }
  .tag{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:var(--r-xs); white-space:nowrap;
  }
  .tag.tail{ background:var(--tail-bg); color:var(--tail); }
  .tag.head{ background:var(--head-bg); color:var(--head); }
  .tag.cross{ background:var(--cross-bg); color:var(--cross); }
  .tag.mini{ padding:3px 6px; font-size:10px; }
  .wind-mix-mini{ display:flex; gap:4px; flex-shrink:0; }

  /* Weather chip: temperature is the hero numeral (principle: oversized
     primary metric, muted secondary text underneath). */
  .weather-strip{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
  .weather-chip{
    flex: 0 0 auto; min-width:84px; text-align:center; background:var(--asphalt);
    border:1px solid var(--line); border-radius:var(--r-md); padding:12px 10px 10px; cursor:pointer;
  }
  .weather-chip:hover{ border-color:var(--route); }
  .weather-chip .t{ font-family:'Space Grotesk', sans-serif; font-size:28px; font-weight:700; letter-spacing:-0.02em; line-height:1; color:var(--chalk); }
  .weather-chip .hr{ font-size:10px; color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace; margin-top:7px; }
  .weather-chip .w{ font-size:11px; color:var(--route); margin-top:3px; font-family:'IBM Plex Mono', monospace; }

  /* Errors are app/network failures, not a wind judgment — kept off the
     red/amber wind vocabulary entirely and rendered as a neutral chip
     instead (bold chalk text, accent left-border). */
  .error{
    color: var(--chalk); font-size:13px; font-weight:600; font-family:'IBM Plex Mono', monospace;
    margin-top:8px; padding:8px 10px; background:var(--asphalt-3); border:1px solid var(--line);
    border-left:3px solid var(--chalk-dim); border-radius:var(--r-sm);
  }
  .loading{ color: var(--chalk-dim); font-size:13px; font-family:'IBM Plex Mono', monospace; }

  .footnote{ font-size:11px; color: var(--chalk-dim); margin-top:26px; line-height:1.6; }
  a{ color: var(--route); }

  /* Plain (non-pill) hero value + muted label pair — used for summary
     figures that sit inline rather than inside a chip (elevation min/max,
     total distance, climb km range). */
  .stat-block{ display:flex; flex-direction:column; }
  .stat-block.right{ align-items:flex-end; text-align:right; }
  .stat-block .sb-v{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; color:var(--chalk); line-height:1.1; letter-spacing:-0.02em; }
  .stat-block .sb-l{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); margin-top:2px; }

  /* Wind-mix breakdown: hero percentages above a thin pill-shaped bar,
     rather than small inline labels — same hero/secondary hierarchy as the
     weather chip, applied to the route's headline wind numbers. */
  .wind-mix-stats{ display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .wind-mix-stat{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .wind-mix-stat .v{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1; letter-spacing:-0.01em; }
  .wind-mix-stat .l{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); margin-top:4px; text-transform:uppercase; letter-spacing:0.04em; }
  .wind-mix-bar{ display:flex; height:8px; border-radius:var(--r-full); overflow:hidden; background:var(--asphalt-3); }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STRAVA_CLIENT_ID = "268232";
// Token exchange happens server-side (Cloudflare Worker) so client secrets
// never ship to the browser. Replace with your deployed worker URL, e.g.
// "https://rueckenwind-oauth.<subdomain>.workers.dev".
const TOKEN_ENDPOINT = "https://rueckenwind-oauth.lucca-renner7.workers.dev";

function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalInputValue(date){
  return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}
function defaultStartTime(){
  const d = new Date(); d.setMinutes(d.getMinutes()+60);
  return toLocalInputValue(d);
}
function fmtTime(date){
  if(!date) return "--:--";
  return pad2(date.getHours())+":"+pad2(date.getMinutes());
}
function fmtDuration(sec){
  if(sec == null) return null;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}

const savedSettings = loadSettings();

let state = {
  connected: false,
  athlete: null,
  accessToken: null,
  activities: [],
  selectedActivity: null,
  routePoints: [], // [{lat,lon,bearing,distanceKm,arrivalTime}] - sampled points used for wind markers
  fullRouteCoords: [], // [[lat,lon], ...] full-resolution line for the map
  weatherAtRoute: [], // aligned with routePoints
  startTime: defaultStartTime(),
  avgSpeedKmh: savedSettings.avgSpeedKmh || 25,
  routePointDistanceKm: savedSettings.routePointDistanceKm || 10,
  segments: [],
  segmentWeather: {}, // id -> weather
  segmentDetails: {}, // id -> detailed segment (PR, KOM/QOM, elevation, effort count)
  segmentPrWatts: {}, // id -> {watts, measured} for the PR effort, fetched lazily on click
  segmentSortBy: "default",
  selectedSegmentId: null, // when set, the map shows this segment instead of the full route
  selectedSegmentSource: null, // "starred" | "route" - which of the two segment buckets selectedSegmentId belongs to
  // "Segmente auf der Strecke" (Task 3): segments found via Strava's public
  // segment-explore API along the currently selected route, kept in a
  // separate parallel bucket from the user's starred segments above so the
  // two sources never overwrite each other's weather/details/PR-watts data.
  routeSegments: [],
  routeSegmentWeather: {},
  routeSegmentDetails: {},
  routeSegmentPrWatts: {},
  navOpen: false, // left slide-in nav drawer open/closed
  activePage: "route", // "route" | "segments" - which NAV_ITEMS entry is active
  routeSourceTab: "activities", // "routes" | "activities" | "gpx"
  stravaRoutes: [], // saved/planned Strava routes, fetched lazily when that tab opens
  routeInfoTab: "elevation", // "elevation" | "climbs" | "beststart"
  elevationProfile: null, // {distances:[km,...], elevations:[m,...]} for the current route, or null if not (yet) loaded
  climbIndex: 0, // which detected climb is shown in the Anstiege tab
  routeWindCache: {}, // "activity-123" / "route-45" -> {type, windSpeed} quick wind rating for list chips
  windFieldEnabled: false, // "Windfeld" overlay toggle - grid of small wind arrows over the route's map area
  windFieldPoints: null, // [{lat,lon,windSpeed,windDir}, ...] for the overlay, or null if not (yet) loaded for the current route
  loading: {},
  error: null,
  authCodeInput: ""
};

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k] == null) continue; // omit conditional attrs (e.g. `selected: cond ? "selected" : null`) instead of stringifying null/undefined
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

// Strava segment/activity names come from arbitrary Strava users (anyone can
// create a public segment), so they're untrusted text — must be escaped
// before ever landing in a raw HTML string (e.g. Leaflet popup content).
function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------- polyline decode (Strava / Google encoded polyline) ----------
function decodePolyline(str){
  let index = 0, lat = 0, lng = 0, coords = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

function bearingBetween(p1, p2){
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  let θ = Math.atan2(y,x)*180/Math.PI;
  return (θ+360)%360;
}

function haversineKm(p1, p2){
  const R = 6371;
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δφ = (p2[0]-p1[0])*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildCumulativeDistances(coords){
  const cum = [0];
  for(let i=1;i<coords.length;i++){
    cum.push(cum[i-1] + haversineKm(coords[i-1], coords[i]));
  }
  return cum;
}

function estimateArrival(startDate, distanceKm, avgSpeedKmh){
  const hours = distanceKm / Math.max(1, avgSpeedKmh);
  return new Date(startDate.getTime() + hours*3600*1000);
}

function pickRoutePoints(coords, cumDist, stepKm){
  if(coords.length < 2) return [];

  const step = Math.max(1, stepKm);
  const totalDistance = cumDist[cumDist.length - 1] || 0;
  const points = [];
  let targetDistance = 0;
  let idx = 0;

  while (targetDistance <= totalDistance + 1e-9) {
    while (idx < cumDist.length - 1 && cumDist[idx] < targetDistance) idx++;
    const p = coords[idx];
    const nextIdx = idx + 1 < coords.length ? idx + 1 : idx;
    const prevIdx = idx > 0 ? idx - 1 : idx;
    const bearing = idx < coords.length - 1 ? bearingBetween(coords[idx], coords[nextIdx]) : bearingBetween(coords[prevIdx], coords[idx]);
    points.push({ lat: p[0], lon: p[1], bearing, distanceKm: cumDist[idx], idx });
    targetDistance += step;
  }

  if (points.length && points[points.length - 1].distanceKm < totalDistance - 1e-6) {
    const last = coords[coords.length - 1];
    const lastIdx = coords.length - 1;
    points.push({
      lat: last[0],
      lon: last[1],
      bearing: bearingBetween(coords[lastIdx - 1] || coords[lastIdx], coords[lastIdx]),
      distanceKm: cumDist[lastIdx],
      idx: lastIdx
    });
  }

  return points;
}

// ---------- wind relative classification ----------
function windRelative(routeBearing, windFromDeg){
  // windFromDeg = direction wind is coming FROM (meteorological convention)
  // wind blowing TOWARD = windFromDeg + 180
  const windToward = (windFromDeg + 180) % 360;
  let diff = Math.abs(routeBearing - windToward);
  if(diff > 180) diff = 360 - diff;
  // diff small = tailwind (wind pushes same direction as travel)
  if(diff <= 55) return { type:"tail", diff };
  if(diff >= 125) return { type:"head", diff };
  return { type:"cross", diff };
}

// Distance-weighted breakdown of the whole route by wind relation, so a
// short but very headwind-y stretch doesn't count the same as a long one.
function computeWindMix(){
  const pts = state.routePoints;
  let tailDist = 0, crossDist = 0, totalDist = 0;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const dist = pts[i+1].distanceKm - pts[i].distanceKm;
    if(dist <= 0) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    if(rel.type === "tail") tailDist += dist;
    else if(rel.type === "cross") crossDist += dist;
    totalDist += dist;
  }
  if(totalDist <= 0) return null;
  const tailPct = Math.round(tailDist / totalDist * 100);
  const crossPct = Math.round(crossDist / totalDist * 100);
  const headPct = Math.max(0, 100 - tailPct - crossPct);
  return { tailPct, crossPct, headPct };
}

// Thresholds for the strong-wind banner. Sustained wind and gusts are judged
// separately since gusts spike well above the sustained speed even on an
// otherwise rideable day.
const STRONG_WIND_KMH = 35;
const STRONG_GUST_KMH = 50;

// Scans the already-fetched weather at each route point (no extra API calls)
// for the worst sustained wind / gust expected anywhere along the route at
// the currently chosen start time, so a gusty stretch in the middle of an
// otherwise calm route still surfaces a warning.
function computeStrongWindWarning(){
  let maxWind = 0, maxGust = 0;
  state.weatherAtRoute.forEach(w=>{
    if(!w) return;
    if(w.windSpeed > maxWind) maxWind = w.windSpeed;
    if(w.windGust > maxGust) maxGust = w.windGust;
  });
  if(maxWind < STRONG_WIND_KMH && maxGust < STRONG_GUST_KMH) return null;
  return { maxWind, maxGust };
}

// ---------- wind field overlay (arrows sampled along the route) ----------
// Optional, off by default (toggle in renderRouteCard): a field of small
// wind arrows tracking the route, similar in spirit to a Windy.com-style
// field but without animation. Open-Meteo accepts comma-separated lists of
// coordinates in a single request, so the whole field costs exactly one
// extra API call, regardless of point count.
//
// This used to be a fixed 10x10 grid spanning the map's current
// getBounds() — fine for a short, roughly square-ish route, but for a long
// route (which needs the map zoomed out much further to fit) the same 100
// points get spread across a much bigger box, so arrow density near the
// route itself drops and long stretches can end up with no nearby arrows at
// all. Sampling along state.fullRouteCoords instead (reusing the same
// buildCumulativeDistances()/pickRoutePoints() pattern used to place the
// weather-sample route points) keeps arrow density tied to the route's own
// length, not the map's zoom level, so both a short loop and a long century
// route end up with arrows tracking their whole path.
const WIND_FIELD_MAX_POINTS = 100; // Open-Meteo's per-request location cap (see ensureWindField below)
const WIND_FIELD_LATERAL_OFFSETS_KM = [-1.2, 0, 1.2]; // perpendicular spread around each along-route sample, so arrows read as a "field" around the route rather than markers directly on top of the line
const WIND_FIELD_MIN_STEP_KM = 0.5; // floor so very short routes don't get a near-zero along-route step

// Offsets (lat, lon) from a point by a compass bearing (0=N, clockwise) and
// a distance in km — flat-earth approximation, plenty accurate at the scale
// of a single ride route.
function offsetLatLon(lat, lon, bearingDeg, distanceKm){
  const bearingRad = bearingDeg * Math.PI / 180;
  const kmPerDegLat = 110.574;
  const kmPerDegLon = 111.320 * Math.cos(lat * Math.PI / 180) || 1e-6;
  return {
    lat: lat + (distanceKm * Math.cos(bearingRad)) / kmPerDegLat,
    lon: lon + (distanceKm * Math.sin(bearingRad)) / kmPerDegLon
  };
}

function computeWindFieldRoutePoints(coords){
  if(coords.length < 2) return [];
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm <= 0) return [];

  // Budget the along-route samples so samples * lateral-offsets stays within
  // the Open-Meteo per-request cap, then space them evenly across the whole
  // route length (short routes get a dense field, long routes get a sparser
  // one, but both cover start-to-finish).
  const samplesBudget = Math.max(1, Math.floor(WIND_FIELD_MAX_POINTS / WIND_FIELD_LATERAL_OFFSETS_KM.length));
  const stepKm = Math.max(WIND_FIELD_MIN_STEP_KM, totalKm / samplesBudget);
  const samples = pickRoutePoints(coords, cumDist, stepKm);

  const points = [];
  samples.forEach(s=>{
    const perpBearing = (s.bearing + 90) % 360;
    WIND_FIELD_LATERAL_OFFSETS_KM.forEach(offsetKm=>{
      if(offsetKm === 0) points.push({ lat: s.lat, lon: s.lon });
      else points.push(offsetLatLon(s.lat, s.lon, perpBearing, offsetKm));
    });
  });

  // Hard cap regardless of how pickRoutePoints() rounds its last point —
  // stay within Open-Meteo's documented per-request location cap.
  return points.slice(0, WIND_FIELD_MAX_POINTS);
}

// Windfeld overlay arrows encode ABSOLUTE wind speed, drawn directly on top
// of the route line (which encodes DIRECTION-RELATIVE wind favorability
// using tail/cross/head). Sharing the same green/amber/red hexes here would
// put e.g. a green "calm" arrow on a green "tailwind" line segment, two
// completely different meanings in the same color — so this uses its own
// --wind-* token family instead (NOT --grade-*, which is tuned for the dark
// climb chart and washes out on the map's light basemap tiles — see the
// --wind-* comment in :root). Darker/more saturated = stronger wind here,
// so the most dangerous reading is the most visible against the light tiles.
function windSpeedColor(kmh){
  if(kmh < 15) return "var(--wind-1)";
  if(kmh < 30) return "var(--wind-2)";
  if(kmh < 45) return "var(--wind-3)";
  return "var(--wind-4)";
}

// ---------- range rings (Whoop-style min/max dashboard icons) ----------
function computeMetricRange(list, field){
  const vals = list.filter(w => w && w[field] != null).map(w => w[field]);
  if(!vals.length) return null;
  return { min: Math.min(...vals), max: Math.max(...vals) };
}

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

// SVG arc between two angles (0deg = top, clockwise), used to draw the
// min->max band on the ring rather than a from-zero progress fill.
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
}

// Small glyphs drawn inside each ring so the metric is identifiable without
// a text caption underneath (icon path coordinates assume a 16x16 viewBox).
function ringIconSvg(kind, color){
  switch(kind){
    case "temp": return `
      <rect x="7" y="1.5" width="2" height="7" rx="1" fill="none" stroke="${color}" stroke-width="1.2"/>
      <circle cx="8" cy="11.5" r="2.6" fill="${color}"/>
      <rect x="7.4" y="3" width="1.2" height="6.8" fill="${color}"/>`;
    case "rain": return `
      <path d="M8 1.5C8 1.5 3.6 7.2 3.6 10.2a4.4 4.4 0 0 0 8.8 0C12.4 7.2 8 1.5 8 1.5Z" fill="${color}"/>`;
    case "wind": return `
      <path d="M2 6.5h7.2a2 2 0 1 0-2-2" fill="none" stroke="${color}" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M2 10.5h5.6a1.7 1.7 0 1 1-1.7 1.7" fill="none" stroke="${color}" stroke-width="1.3" stroke-linecap="round"/>`;
    case "uv": return `
      <circle cx="8" cy="8" r="3" fill="${color}"/>
      <g stroke="${color}" stroke-width="1.2" stroke-linecap="round">
        <line x1="8" y1="1" x2="8" y2="2.6"/><line x1="8" y1="13.4" x2="8" y2="15"/>
        <line x1="1" y1="8" x2="2.6" y2="8"/><line x1="13.4" y1="8" x2="15" y2="8"/>
        <line x1="3.2" y1="3.2" x2="4.3" y2="4.3"/><line x1="11.7" y1="11.7" x2="12.8" y2="12.8"/>
        <line x1="3.2" y1="12.8" x2="4.3" y2="11.7"/><line x1="11.7" y1="4.3" x2="12.8" y2="3.2"/>
      </g>`;
    default: return "";
  }
}

// Renders one ring: a full pale track circle plus a colored arc spanning
// from the route's min value to its max value for that metric, mapped onto
// a fixed domain (so e.g. a 30-45 km/h wind range visibly sits further
// around the ring than a 5-10 km/h range on a calm day). The icon + value
// live inside the ring itself so no caption text is needed below it.
function renderRangeRing({ icon, unit, range, domainMin, domainMax, color }){
  const size = 76, r = 30, cx = size/2, cy = size/2;
  const valueToAngle = v => Math.min(1, Math.max(0, (v - domainMin) / (domainMax - domainMin))) * 360;
  const startAngle = valueToAngle(range.min);
  let endAngle = valueToAngle(range.max);
  if(endAngle - startAngle < 8) endAngle = Math.min(360, startAngle + 8);
  const arcPath = describeArc(cx, cy, r, startAngle, endAngle);
  const valueText = Math.round(range.min) === Math.round(range.max)
    ? `${Math.round(range.min)}${unit}`
    : `${Math.round(range.min)}–${Math.round(range.max)}${unit}`;
  const svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#262c37" stroke-width="7"/>
    <path d="${arcPath}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
    <svg x="${cx-8}" y="${cy-15}" width="16" height="16" viewBox="0 0 16 16">${ringIconSvg(icon, color)}</svg>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#f2efe9">${valueText}</text>
  </svg>`;
  return el("div", {style:"display:flex; justify-content:center; flex:1; min-width:0;"}, [
    el("div", {html: svg})
  ]);
}

function renderRangeRingsRow(){
  const tempRange = computeMetricRange(state.weatherAtRoute, "temp");
  const precipRange = computeMetricRange(state.weatherAtRoute, "precip");
  const windRange = computeMetricRange(state.weatherAtRoute, "windSpeed");
  const uvRange = computeMetricRange(state.weatherAtRoute, "uvIndex");

  const rings = [];
  // Each ring gets its own identity color, distinct from the tail/cross/head
  // wind-favorability vocabulary — in particular the "wind" ring (absolute
  // wind-speed range, not direction-relative) is deliberately NOT amber, so
  // it can't be misread as "crosswind".
  if(tempRange) rings.push(renderRangeRing({ icon:"temp", unit:"°", range:tempRange, domainMin:-10, domainMax:35, color:"#e2895c" }));
  if(precipRange) rings.push(renderRangeRing({ icon:"rain", unit:"%", range:precipRange, domainMin:0, domainMax:100, color:"#82a2d1" }));
  if(windRange) rings.push(renderRangeRing({ icon:"wind", unit:"", range:windRange, domainMin:0, domainMax:60, color:"#5ea7a8" }));
  if(uvRange) rings.push(renderRangeRing({ icon:"uv", unit:"", range:uvRange, domainMin:0, domainMax:11, color:"#c26bc2" }));
  if(!rings.length) return null;

  return el("div", {style:"display:flex; justify-content:space-around; gap:6px; margin-top:14px;"}, rings);
}

async function ensureWindField(){
  if(state.windFieldPoints || state.loading.windField) return;
  state.loading.windField = true; render();
  const grid = computeWindFieldRoutePoints(state.fullRouteCoords);
  try{
    const lats = grid.map(p => p.lat.toFixed(3)).join(",");
    const lons = grid.map(p => p.lon.toFixed(3)).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=wind_speed_10m,wind_direction_10m&forecast_days=7&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("Winddaten nicht verfügbar");
    const data = await res.json();
    const results = Array.isArray(data) ? data : [data];
    const targetDate = new Date(state.startTime);
    state.windFieldPoints = results.map((r, i)=>{
      const hours = r.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - targetDate);
        if(diff < best){ best = diff; idx = hi; }
      });
      return {
        lat: grid[i].lat,
        lon: grid[i].lon,
        windSpeed: r.hourly.wind_speed_10m[idx],
        windDir: r.hourly.wind_direction_10m[idx]
      };
    });
  }catch(e){
    state.windFieldPoints = [];
  }
  state.loading.windField = false;
  render();
}

// Finds the best departure times for the current route within the next 48h,
// reusing the hourly forecast we already fetched per route point (Open-Meteo
// returns 7 days of hourly data in a single call) — no extra API requests.
function findBestStartTimes(){
  const pts = state.routePoints;
  if(!pts.length || !state.weatherAtRoute.some(w => w && w.hourly)) return [];

  const now = new Date();
  now.setMinutes(0, 0, 0);
  now.setHours(now.getHours() + 1);
  const candidates = [];
  for(let h=0; h<48; h++){
    candidates.push(new Date(now.getTime() + h*3600*1000));
  }

  const scored = candidates.map(startDate=>{
    let totalDist = 0, tailDist = 0, headDist = 0, sumDiff = 0;
    for(let i=0;i<pts.length-1;i++){
      const w = state.weatherAtRoute[i];
      if(!w || !w.hourly) continue;
      const dist = pts[i+1].distanceKm - pts[i].distanceKm;
      if(dist <= 0) continue;

      const arrival = estimateArrival(startDate, pts[i].distanceKm, state.avgSpeedKmh);
      const hours = w.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - arrival);
        if(diff < best){ best = diff; idx = hi; }
      });
      const windDir = w.hourly.wind_direction_10m[idx];
      const rel = windRelative(pts[i].bearing, windDir);
      sumDiff += rel.diff * dist;
      totalDist += dist;
      if(rel.type === "tail") tailDist += dist;
      if(rel.type === "head") headDist += dist;
    }
    if(totalDist <= 0) return null;
    return {
      startDate,
      avgDiff: sumDiff / totalDist,
      tailPct: Math.round(tailDist / totalDist * 100),
      headPct: Math.round(headDist / totalDist * 100)
    };
  }).filter(Boolean);

  scored.sort((a,b) => a.avgDiff - b.avgDiff);
  return scored.slice(0, 3);
}

async function ensureElevationProfile(){
  if(state.elevationProfile !== null || state.loading.elevation) return;
  // GPX elevation comes straight from the parsed file (elevationProfile is
  // set immediately in loadGpxFile) - nothing to lazily fetch for those.
  if(!state.selectedActivity || state.selectedActivity.isGpx) return;
  state.loading.elevation = true; render();
  try{
    let raw;
    if(state.selectedActivity.isRoute){
      raw = await fetchRouteStreams(state.selectedActivity.id.replace(/^route-/, ""), state.accessToken);
    } else {
      raw = await fetchActivityStreams(state.selectedActivity.id, state.accessToken);
    }
    const streams = normalizeStreams(raw);
    // Strava's distance stream is in meters; elevationProfile.distances is
    // documented (and consumed by renderElevationChart) as km.
    state.elevationProfile = (streams.distance && streams.altitude)
      ? { distances: streams.distance.map(d => d / 1000), elevations: streams.altitude }
      : { distances: [], elevations: [] };
  }catch(e){
    state.elevationProfile = { distances: [], elevations: [] };
  }
  state.loading.elevation = false;
  render();
}

// Builds the elevation line/area SVG for any distance/elevation slice —
// shared by the full-route Höhenprofil tab and the per-climb zoom-in view
// in the Anstiege tab. Distances don't need to start at 0 (a climb's slice
// starts at its own km mark); the x-scale is relative to the slice's own
// first point.
function buildElevationChartSvg(distances, elevations){
  const width = 600, height = 140, pad = 6;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const rangeE = Math.max(1, maxE - minE);
  const d0 = distances[0];
  const totalD = (distances[distances.length - 1] - d0) || 1;
  const x = d => pad + ((d - d0) / totalD) * (width - pad*2);
  const y = e => (height - pad) - ((e - minE) / rangeE) * (height - pad*2);

  let linePath = `M ${x(distances[0]).toFixed(1)} ${y(elevations[0]).toFixed(1)}`;
  for(let i=1;i<distances.length;i++){
    linePath += ` L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}`;
  }
  const areaPath = `${linePath} L ${x(distances[distances.length-1]).toFixed(1)} ${height-pad} L ${x(distances[0]).toFixed(1)} ${height-pad} Z`;

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:140px; display:block;">
    <path d="${areaPath}" fill="rgba(130,162,209,0.18)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="#82a2d1" stroke-width="2"/>
  </svg>`;
}

// ---------- hero-numeral stat helpers ----------
// Shared building blocks for the "oversized primary number, small muted
// label" hierarchy used throughout the app (weather chips, wind-mix,
// elevation summary, climb/segment stat chips).
function statBlock(value, label, alignRight){
  return el("div", {class:"stat-block" + (alignRight ? " right" : "")}, [
    el("div", {class:"sb-v"}, [value]),
    el("div", {class:"sb-l"}, [label])
  ]);
}
function statChip(value, label, style){
  return el("div", {class:"stat-chip", style: style || null}, [
    el("div", {class:"v"}, [value]),
    el("div", {class:"l"}, [label])
  ]);
}

function renderElevationChart(){
  if(state.loading.elevation){
    return el("div", {class:"loading"}, ["Lade Höhenprofil…"]);
  }
  const profile = state.elevationProfile;
  if(!profile || profile.distances.length < 2){
    return el("div", {class:"muted", style:"font-size:12px;"}, ["Für diese Strecke sind keine Höhendaten verfügbar."]);
  }
  const { distances, elevations } = profile;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const totalD = distances[distances.length - 1] - distances[0];
  const svg = buildElevationChartSvg(distances, elevations);

  return el("div", {}, [
    el("div", {html: svg}),
    el("div", {style:"display:flex; justify-content:space-between; margin-top:10px;"}, [
      statBlock(`${Math.round(minE)}–${Math.round(maxE)}`, "Höhe (m)"),
      statBlock(totalD.toFixed(1), "Distanz (km)", true)
    ])
  ]);
}

// ---------- climb detection ----------
// Simple grade-threshold segmentation over the elevation profile: walk the
// (lightly smoothed, to filter out GPS/barometric noise) distance/elevation
// samples and grow a "climb" candidate wherever the grade stays at/above
// MIN_GRADE, tolerating short dips/flats (MAX_GAP_KM) so one climb with a
// brief false-flat doesn't get split into two. Candidates below the minimum
// length/elevation-gain are discarded as noise, not real climbs.
const CLIMB_MIN_GRADE = 3;      // % - below this it's not "climbing"
const CLIMB_MAX_GAP_KM = 0.3;   // tolerate short interruptions within a climb
const CLIMB_MIN_LENGTH_KM = 0.5;
const CLIMB_MIN_GAIN_M = 30;

function smoothElevations(elevations, radius){
  return elevations.map((_, i) => {
    let sum = 0, count = 0;
    for(let j = Math.max(0, i - radius); j <= Math.min(elevations.length - 1, i + radius); j++){
      sum += elevations[j]; count++;
    }
    return sum / count;
  });
}

function gradeBetween(distances, elevations, i, j){
  const dKm = distances[j] - distances[i];
  if(dKm <= 0) return 0;
  return (elevations[j] - elevations[i]) / (dKm * 1000) * 100;
}

function detectClimbs(profile){
  const { distances, elevations } = profile;
  if(distances.length < 3) return [];
  const smoothed = smoothElevations(elevations, 2);

  const candidates = [];
  let start = null, lastAboveIdx = null;
  for(let i=1;i<distances.length;i++){
    const grade = gradeBetween(distances, smoothed, i-1, i);
    if(grade >= CLIMB_MIN_GRADE){
      if(start === null) start = i-1;
      lastAboveIdx = i;
    } else if(start !== null && distances[i] - distances[lastAboveIdx] > CLIMB_MAX_GAP_KM){
      candidates.push([start, lastAboveIdx]);
      start = null; lastAboveIdx = null;
    }
  }
  if(start !== null) candidates.push([start, lastAboveIdx]);

  return candidates.map(([fromIdx, toIdx])=>{
    const lengthKm = distances[toIdx] - distances[fromIdx];
    let gainM = 0, maxGrade = 0;
    for(let k=fromIdx+1;k<=toIdx;k++){
      const diff = elevations[k] - elevations[k-1];
      if(diff > 0) gainM += diff;
      const g = gradeBetween(distances, smoothed, k-1, k);
      if(g > maxGrade) maxGrade = g;
    }
    const avgGrade = lengthKm > 0 ? (gainM / (lengthKm * 1000)) * 100 : 0;
    return { fromIdx, toIdx, fromKm: distances[fromIdx], toKm: distances[toIdx], lengthKm, gainM: Math.round(gainM), avgGrade, maxGrade };
  }).filter(c => c.lengthKm >= CLIMB_MIN_LENGTH_KM && c.gainM >= CLIMB_MIN_GAIN_M)
    .sort((a,b) => a.fromKm - b.fromKm); // route order, so prev/next paging moves along the route
}

// Maps a grade percentage to a color (+ matching translucent background),
// used to color-code stat-chips and the chart line by steepness. This is
// deliberately its own single-hue (blue) brightness ramp — NOT the
// green/amber/red wind-favorability colors — because climb steepness has
// nothing to do with wind direction, and reusing tail/head/cross here would
// make a steep-but-tailwind climb chip look like a headwind warning.
function gradeColor(grade){
  if(grade < 4) return { color:"var(--grade-1)", bg:"var(--grade-1-bg)" };
  if(grade < 7) return { color:"var(--grade-2)", bg:"var(--grade-2-bg)" };
  if(grade < 10) return { color:"var(--grade-3)", bg:"var(--grade-3-bg)" };
  return { color:"var(--grade-4)", bg:"var(--grade-4-bg)" };
}

// Same shape as buildElevationChartSvg, but colors each small line segment
// by its local (smoothed, to avoid GPS-noise flicker) grade instead of one
// flat color — steeper sections get a more intense step of the single-hue
// blue --grade-* ramp (see gradeColor()), gentle sections the faintest step.
// Only used for the zoomed-in climb view; the full-route Höhenprofil tab
// keeps its plain line.
function buildClimbChartSvg(distances, elevations){
  const width = 600, height = 140, pad = 6;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const rangeE = Math.max(1, maxE - minE);
  const d0 = distances[0];
  const totalD = (distances[distances.length - 1] - d0) || 1;
  const x = d => pad + ((d - d0) / totalD) * (width - pad*2);
  const y = e => (height - pad) - ((e - minE) / rangeE) * (height - pad*2);
  const smoothed = smoothElevations(elevations, 2);

  let areaPath = `M ${x(distances[0]).toFixed(1)} ${(height-pad).toFixed(1)}`;
  for(let i=0;i<distances.length;i++){
    areaPath += ` L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}`;
  }
  areaPath += ` L ${x(distances[distances.length-1]).toFixed(1)} ${(height-pad).toFixed(1)} Z`;

  let segmentPaths = "";
  for(let i=1;i<distances.length;i++){
    const grade = gradeBetween(distances, smoothed, i-1, i);
    const color = gradeColor(grade).color;
    segmentPaths += `<path d="M ${x(distances[i-1]).toFixed(1)} ${y(elevations[i-1]).toFixed(1)} L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
  }

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:140px; display:block;">
    <path d="${areaPath}" fill="rgba(130,162,209,0.12)" stroke="none"/>
    ${segmentPaths}
  </svg>`;
}

// Same visual language as the Höhenprofil tab (chart + min/max-elevation
// and distance caption below it), but zoomed to one climb at a time with
// prev/next arrows to page through, and the climb's own stats as stat-chips
// underneath instead of a list of every climb.
function renderClimbsContent(card){
  if(state.loading.elevation){
    card.appendChild(el("div", {class:"loading"}, ["Lade Höhenprofil…"]));
    return;
  }
  const profile = state.elevationProfile;
  if(!profile || profile.distances.length < 3){
    card.appendChild(el("div", {class:"muted", style:"font-size:12px;"}, ["Für diese Strecke sind keine Höhendaten verfügbar."]));
    return;
  }
  const climbs = detectClimbs(profile);
  if(!climbs.length){
    card.appendChild(el("div", {class:"muted", style:"font-size:12px;"}, ["Keine nennenswerten Anstiege auf dieser Strecke gefunden."]));
    return;
  }
  if(state.climbIndex >= climbs.length) state.climbIndex = climbs.length - 1;
  if(state.climbIndex < 0) state.climbIndex = 0;
  const c = climbs[state.climbIndex];

  const segDistances = profile.distances.slice(c.fromIdx, c.toIdx + 1);
  const segElevations = profile.elevations.slice(c.fromIdx, c.toIdx + 1);
  const svg = buildClimbChartSvg(segDistances, segElevations);
  const minE = Math.min(...segElevations), maxE = Math.max(...segElevations);
  const avgColor = gradeColor(c.avgGrade), maxColor = gradeColor(c.maxGrade);

  card.appendChild(el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;"}, [
    el("button", {
      class:"btn secondary", style:"padding:6px 14px; font-size:14px;",
      disabled: state.climbIndex === 0 ? "disabled" : null,
      onclick:()=>{ state.climbIndex--; render(); }
    }, ["←"]),
    el("div", {class:"muted", style:"font-family:'IBM Plex Mono', monospace; font-size:12px;"}, [`Anstieg ${state.climbIndex+1} / ${climbs.length}`]),
    el("button", {
      class:"btn secondary", style:"padding:6px 14px; font-size:14px;",
      disabled: state.climbIndex === climbs.length - 1 ? "disabled" : null,
      onclick:()=>{ state.climbIndex++; render(); }
    }, ["→"])
  ]));

  card.appendChild(el("div", {html: svg}));
  card.appendChild(el("div", {style:"display:flex; justify-content:space-between; margin-top:10px;"}, [
    statBlock(`${Math.round(minE)}–${Math.round(maxE)}`, "Höhe (m)"),
    statBlock(`${c.fromKm.toFixed(1)}–${c.toKm.toFixed(1)}`, "km", true)
  ]));
  card.appendChild(el("div", {class:"stat-chips", style:"margin-top:10px;"}, [
    statChip(c.lengthKm.toFixed(1), "km"),
    statChip(`${c.gainM}`, "Hm"),
    statChip(`${c.avgGrade.toFixed(1)}%`, "Ø Steigung", `color:${avgColor.color}; background:${avgColor.bg};`),
    statChip(`${c.maxGrade.toFixed(0)}%`, "Max Steigung", `color:${maxColor.color}; background:${maxColor.bg};`)
  ]));
}

function arrowSvg(routeBearing, windFromDeg, color){
  // arrow points in the direction wind blows TOWARD, rotated relative to route bearing (route = "up")
  const windToward = (windFromDeg + 180) % 360;
  const relAngle = windToward - routeBearing;
  return `<svg viewBox="0 0 24 24" style="transform:rotate(${relAngle}deg)">
    <path d="M12 3 L18 15 L12 11.5 L6 15 Z" fill="${color}"/>
  </svg>`;
}

// The actual client_id/client_secret exchange happens in the Cloudflare

async function exchangeCode(code){

    method:"POST",
    headers:{"Content-Type":"application/json"},

}

// Strava's activity streams come back key_by_type (an object), route streams
// come back as an array of {type, data} — normalize both to {distance, altitude}.
function normalizeStreams(raw){
  const byType = {};
  if(Array.isArray(raw)){
    raw.forEach(s => { if(s && s.type) byType[s.type] = s.data; });
  } else if(raw){
    Object.keys(raw).forEach(k => { byType[k] = raw[k] && raw[k].data; });
  }
  return byType;
}

// Strava's public segment database, bbox-scoped (see computeRouteExploreBboxes
// / ensureRouteSegments below for how the route gets chunked into several of
// these calls). Distinct from fetchStarredSegments — this surfaces segments
// the athlete hasn't necessarily starred/ridden, anywhere Strava considers
// "popular" within the given rectangle.
async function fetchSegmentExplore(bbox, token){
  const bounds = `${bbox.swLat.toFixed(5)},${bbox.swLon.toFixed(5)},${bbox.neLat.toFixed(5)},${bbox.neLon.toFixed(5)}`;
  const res = await fetch(`https://www.strava.com/api/v3/segments/explore?bounds=${bounds}&activity_type=riding`, {
    headers:{ Authorization: "Bearer " + token }
  });
  if(!res.ok) throw new Error("Segmente konnten nicht geladen werden (" + res.status + ")");
  return res.json();
}

// ---------- Open-Meteo ----------
async function fetchWeather(lat, lon, targetDate){
  targetDate = targetDate || new Date();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation_probability,uv_index&forecast_days=7&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Wetterdaten nicht verfügbar");
  const data = await res.json();
  // find the forecast hour closest to the target (arrival) time
  const hours = data.hourly.time;
  let idx = 0, best = Infinity;
  hours.forEach((t,i)=>{
    const diff = Math.abs(new Date(t) - targetDate);
    if(diff < best){ best = diff; idx = i; }
  });
  return {
    temp: data.hourly.temperature_2m[idx],
    windSpeed: data.hourly.wind_speed_10m[idx],
    windDir: data.hourly.wind_direction_10m[idx],
    windGust: data.hourly.wind_gusts_10m[idx],
    precip: data.hourly.precipitation_probability[idx],
    uvIndex: data.hourly.uv_index ? data.hourly.uv_index[idx] : null,
    forecastTime: new Date(hours[idx]),
    hourly: data.hourly,
    idx
  };
}

  app.appendChild(renderBrand());
  renderNavDrawer().forEach(n => app.appendChild(n));

  if(state.activePage === "segments"){
    app.appendChild(renderSegmentsPage());
  } else if(!state.connected && !state.fullRouteCoords.length){

    // screen. Only applies to the "route" page; "Meine Segmente" has its own
    // always-visible connect prompt inside renderSegmentsPage().
    app.appendChild(renderConnectCard());

    if(infoTabsCard) app.appendChild(infoTabsCard);

  app.appendChild(renderFootnote());

  // from a page that had the Leaflet map mounted still tears it down

  requestAnimationFrame(mountRouteMap);
