            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else {
        card.appendChild(el("div", {class:"empty-state"}, ["Keine gespeicherten Routen gefunden."]));
      }
    } else if(state.routeSourceTab === "activities"){
      if(state.loading.activities){
        card.appendChild(el("div", {class:"loading"}, ["Lade letzte Aktivitäten…"]));
      } else if(state.activities.length){
        const list = el("div", {});
        state.activities.filter(a => a.type === "Ride" || a.type === "VirtualRide" || a.type === "GravelRide" || a.type === "MountainBikeRide" || !a.type).slice(0,5).forEach(a=>{
          const key = "activity-" + a.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === a.id;
          const km = (a.distance/1000).toFixed(1);
          const date = new Date(a.start_date_local).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
          ensureListItemWindTag(key, a.map && a.map.summary_polyline);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectActivity(a)}, [
            el("div", {}, [
              el("div", {class:"name"}, [a.name]),
              el("div", {class:"meta"}, [`${date} · ${km} km`])
            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else if(!state.fullRouteCoords.length){
        card.appendChild(el("div", {class:"empty-state"}, ["Keine Aktivitäten gefunden."]));
      }
    } else if(state.routeSourceTab === "gpx"){
      card.appendChild(renderGpxUploadRow());
    }
  }
}

function renderRouteMapSection(card){
  // The map container is appended whenever we have coordinates at all —
  // including while weather is still loading — rather than only once
  // weatherAtRoute is populated. It's the same persistent routeMapContainer
  // node every time, so keeping it present across the
  // loading-true -> loading-false transition means mountRouteMap() never
  // sees it disappear and tear down the Leaflet instance in between.
  if(state.fullRouteCoords.length){
    if(state.loading.weather){
      card.appendChild(el("div", {class:"loading", style:"margin-top:14px;"}, ["Berechne Wind entlang der Strecke…"]));
    }
    const weatherReady = state.routePoints.length && state.weatherAtRoute.length;
    if(weatherReady){
      card.appendChild(renderToggleSwitch(state.routeReversed, "Strecke umgekehrt anzeigen (Wind-Vergleich)", toggleRouteReversed));

      const mix = computeWindMix();
      if(mix){
        // Hero percentages above a thin pill bar: the three numbers are the
        // primary metric here, the bar is a secondary at-a-glance visual.
        card.appendChild(el("div", {style:"margin-top:14px;"}, [
          el("div", {class:"wind-mix-stats"}, [
            el("div", {class:"wind-mix-stat", style:"align-items:flex-start;"}, [
              el("div", {class:"v", style:"color:var(--tail);"}, [`${mix.tailPct}%`]),
              el("div", {class:"l"}, ["Rückenwind"])
            ]),
            el("div", {class:"wind-mix-stat", style:"align-items:center; text-align:center;"}, [
              el("div", {class:"v", style:"color:var(--cross);"}, [`${mix.crossPct}%`]),
              el("div", {class:"l"}, ["Seitenwind"])
            ]),
            el("div", {class:"wind-mix-stat", style:"align-items:flex-end; text-align:right;"}, [
              el("div", {class:"v", style:"color:var(--head);"}, [`${mix.headPct}%`]),
              el("div", {class:"l"}, ["Gegenwind"])
            ])
          ]),
          el("div", {class:"wind-mix-bar"}, [
            el("div", {style:`flex:${mix.tailPct}; background:var(--tail);`}),
            el("div", {style:`flex:${mix.crossPct}; background:var(--cross);`}),
            el("div", {style:`flex:${mix.headPct}; background:var(--head);`})
          ])
        ]));
      }
      const halves = computeWindMixHalves();
      // A first-vs-second split only means anything when BOTH halves have
      // data. Short routes (point spacing >= route length, e.g. the 10km
      // default) produce exactly one inter-point segment whose midpoint
      // lands exactly at totalKm/2 — the half-open [fromKm, toKm) test in
      // computeWindMixForRange puts that segment in the second half only,
      // so `first` comes back null while `second` ends up holding the
      // *entire* route's wind mix mislabeled as "2. Hälfte". Requiring both
      // halves non-null avoids ever asserting that false split; when it's
      // false, omit the block entirely (silent, matching this app's
      // established convention for missing optional data elsewhere).
      if(halves && halves.first && halves.second){
        // Folded into the same bar language as the whole-route block above
        // instead of repeating its full hero-stats-over-bar layout twice —
        // that read as three near-identical stacked graphics (see git
        // history for the earlier version). Each half gets one small label,
        // one colored number for whichever wind type dominates that half
        // (not all three — the thin bar below already shows the full mix),
        // and its own thin proportional bar, side by side.
        const dominantWindOf = mix => mix.tailPct >= mix.crossPct && mix.tailPct >= mix.headPct
          ? {pct: mix.tailPct, label: "Rückenwind", color: "var(--tail)"}
          : mix.headPct >= mix.crossPct
            ? {pct: mix.headPct, label: "Gegenwind", color: "var(--head)"}
            : {pct: mix.crossPct, label: "Seitenwind", color: "var(--cross)"};
        const halfColumn = (mix, label) => {
          const dominant = dominantWindOf(mix);
          return el("div", {style:"flex:1; min-width:0;"}, [
            el("div", {style:"font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.05em;"}, [label]),
            el("div", {class:"stat-secondary", style:"margin-top:2px;"}, [
              el("span", {style:`color:${dominant.color};`}, [`${dominant.pct}% ${dominant.label}`])
            ]),
            el("div", {class:"wind-mix-bar", style:"margin-top:6px;"}, [
              el("div", {style:`flex:${mix.tailPct}; background:var(--tail);`}),
              el("div", {style:`flex:${mix.crossPct}; background:var(--cross);`}),
              el("div", {style:`flex:${mix.headPct}; background:var(--head);`})
            ])
          ]);
        };
        card.appendChild(el("div", {style:"display:flex; gap:16px; margin-top:14px;"}, [
          halfColumn(halves.first, "1. Hälfte"),
          halfColumn(halves.second, "2. Hälfte")
        ]));
      }
      const ringsRow = renderRangeRingsRow();
      if(ringsRow) card.appendChild(ringsRow);
      const strongWind = computeStrongWindWarning();
      if(strongWind){
        const parts = [];
        if(strongWind.maxWind >= STRONG_WIND_KMH) parts.push(`${Math.round(strongWind.maxWind)} km/h Wind`);
        if(strongWind.maxGust >= STRONG_GUST_KMH) parts.push(`${Math.round(strongWind.maxGust)} km/h Böen`);
        // No emoji/glyph icon — the bold "WARNUNG" label plus the head-red
        // border/background already carries the meaning (and reuses the
        // real wind-favorability color, since this genuinely is about wind).
        card.appendChild(el("div", {style:"margin-top:14px; padding:10px 12px; border-radius:var(--r-sm); background:var(--head-bg); border:1px solid var(--head); display:flex; align-items:center; gap:10px;"}, [
          el("span", {style:"font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:700; color:var(--head); text-transform:uppercase; letter-spacing:0.05em; flex-shrink:0;"}, ["Warnung"]),
          el("span", {style:"font-size:12.5px; color:var(--head); font-family:'IBM Plex Mono', monospace;"}, [
            `Starker Wind entlang der Strecke: bis zu ${parts.join(" · ")}`
          ])
        ]));
      }
      card.appendChild(el("div", {style:"margin-top:14px;"}, [
        renderToggleSwitch(
          state.windFieldEnabled,
          [
            "Windfeld der Umgebung anzeigen" + (state.windFieldEnabled && state.loading.windField ? " (lädt…)" : ""),
            state.windFieldEnabled ? infoButton("Windstärke: helles Blau <15 · Blau <30 · dunkleres Blau <45 · dunkelblau ≥45 km/h") : ""
          ],
          ()=>{ state.windFieldEnabled = !state.windFieldEnabled; render(); }
        )
      ]));
    }

    card.appendChild(routeMapContainer);

    if(weatherReady){
      const legend = el("div", {class:"legend", style:"margin-top:10px;"}, [
        el("span",{},[el("span",{class:"swatch", style:"background:var(--tail)"}), "Rückenwind"]),
        el("span",{},[el("span",{class:"swatch", style:"background:var(--cross)"}), "Seitenwind"]),
        el("span",{},[el("span",{class:"swatch", style:"background:var(--head)"}), "Gegenwind"]),
      ]);
      card.appendChild(legend);

      const first = state.weatherAtRoute.find(w=>w);
      if(first){
        const strip = el("div", {class:"weather-strip", style:"margin-top:16px;"});
        state.routePoints.forEach((p,i)=>{
          const w = state.weatherAtRoute[i];
          if(!w) return;
          strip.appendChild(el("div", {class:"weather-chip", onclick:()=>{
            const marker = routeMarkerByIndex[i];
            if(marker){
              if(leafletMapInstance) leafletMapInstance.panTo(marker.getLatLng());
              marker.openPopup();
            }
            const mapEl = document.getElementById("route-map");
            if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
          }}, [
            el("div", {class:"t"}, [Math.round(w.temp) + "°"]),
            el("div", {class:"hr"}, ["Ankunft " + fmtTime(p.arrivalTime) + " · " + p.distanceKm.toFixed(0) + " km"]),
            el("div", {class:"w"}, [w.precip + "% Regen" + (w.uvIndex != null ? " · UV " + Math.round(w.uvIndex) : "")])
          ]));
        });
        card.appendChild(strip);
      }
    }
  } else if(state.selectedActivity){
    card.appendChild(el("div", {class:"empty-state", style:"margin-top:12px;"}, ["Für diese Aktivität liegt keine Streckenkarte vor."]));
  }
}

function renderRouteCard(){
  const card = el("div", {class:"card"});

  if(isShowingSegmentDetail()){
    const bucket = segmentBucket("route");
    const seg = bucket.list.find(s => s.id === state.selectedSegmentId);
    if(!seg){
      // Selection survived into a state where the "route" bucket no longer
      // has this id (e.g. stale after a route change raced with a fetch) —
      // recover by clearing it and falling through to the normal route card
      // below instead of rendering an empty "Segment" shell (heading + back
      // button + blank map, with nothing in between).
      state.selectedSegmentId = null;
      state.selectedSegmentSource = null;
    } else {
      card.appendChild(renderDetailHeader("Segment", "Zur Strecke", () => {
        // Capture BEFORE clearing selectedSegmentId/Source below — reading
        // them after would already be null. Mirrors selectSegment()'s own
        // open-path scroll idiom (requestAnimationFrame + scrollIntoView),
        // just pointed at the list row instead of the map, so closing the
        // tall map+detail view lands the user back where they were instead
        // of at whatever raw pixel offset the page reflowed to.
        const segId = seg.id, source = "route";
        state.selectedSegmentId = null; state.selectedSegmentSource = null;
        render();
        requestAnimationFrame(()=>{
          document.getElementById(`segment-row-${source}-${segId}`)?.scrollIntoView({behavior:"smooth", block:"center"});
        });
      }));
      card.appendChild(renderSegmentRow(seg, bucket, {clickable:false}));
      card.appendChild(renderSegmentLeaderboard(seg));
      card.appendChild(routeMapContainer);
      return card;
    }
  }

  card.appendChild(el("h2", {}, ["Strecke"]));

  // Augments (doesn't replace) the tab-level "Lade Aktivitäten…"-style
  // loading text below with the shared startup-sequence bar, while the
  // automatic connect/revisit flow is running (see startupProgressBegin()).
  // The manual-load flow's own card (renderManualLoadCard()) shows this
  // separately since renderRouteCard() isn't reached at all in that state.
  const startupBar = renderStartupProgressBar();
  if(startupBar) card.appendChild(startupBar);

  renderRoutePersistentSettingsRow(card);

  renderRouteSourceTabs(card);

  renderRouteMapSection(card);

  return card;
}

// Created once and re-inserted (a plain DOM move, not a re-creation) into
// the freshly rebuilt tree on every render() — letting el() create a brand
// new #route-map div each render meant the Leaflet map bound to it (and all
// its map tiles) got torn down and rebuilt from scratch on every single
// render, which is what caused the visible flicker whenever a route was
// selected (multiple renders fire in quick succession while weather loads).
const routeMapContainer = el("div", {id:"route-map", style:"margin-top:14px;"});

// Persistent settings-row inputs — same "created once, re-inserted not
// re-created" pattern as routeMapContainer above. Letting el() build a fresh
// <input>/<select> node on every render() is merely wasteful for a plain
// number/select, but it's actively dangerous for the Startzeit
// datetime-local input: Safari's datetime-local control is backed by a real
// OS-level picker overlay, and WebKit can crash the whole renderer process
// if the DOM node underneath an actively-focused/mid-interaction native
// control gets destroyed and replaced out from under it. That's exactly
// what happened here — this input's own onchange calls loadRouteWeather(),
// which calls render() twice in quick succession (once synchronously when
// weather loading starts, once again when it finishes), and Safari/Chrome's
// datetime-local widget fires `change` per SEGMENT (hour, then minute, ...),
// not just once for the whole value, while the field is still being typed
// into. Keeping the node persistent (never recreated) fixed the Safari
// crash, but every one of those per-segment `change` events still triggered
// an immediate render() -- which wipes and rebuilds the DOM tree
// (app.innerHTML="") and blurs the input mid-edit. Once blurred,
// syncPersistentInputValue()'s activeElement guard no longer applies, so the
// next render() re-synced .value from state.startTime -- resetting the
// browser's internal typing/segment buffer and making it look like only the
// hour's first digit "took" before jumping to the next segment (couldn't
// type e.g. "15" as two digits). Debouncing so a change event only actually
// triggers loadRouteWeather()/render() after a short pause fixes this: rapid
// per-segment events while still typing collapse into the one that follows
// once the user stops. The avg-speed input and Punktabstand select are kept
// persistent the same way for consistency (same category of bug even though
// a plain number/select is much less likely to crash outright), but don't
// need the debounce since a plain number input doesn't have this
// multi-segment/per-keystroke `change` behavior.
let startTimeChangeTimer = null;
const startTimeInput = el("input", {
  type:"datetime-local", style:"width:100%;",
  onchange:(e)=>{
    state.startTime = e.target.value;
    clearTimeout(startTimeChangeTimer);
    startTimeChangeTimer = setTimeout(loadRouteWeather, 600);
  }
});
const avgSpeedInput = el("input", {
  type:"number", style:"width:100%;", min:"5", max:"60", step:"1",
  onchange:(e)=>{ state.avgSpeedKmh = parseFloat(e.target.value) || 25; saveSettings(); loadRouteWeather(); }
});
const routePointDistanceSelect = el("select", {
  style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
  onchange:(e)=>{
    state.routePointDistanceKm = parseInt(e.target.value, 10) || 10;
    saveSettings();
    if(state.fullRouteCoords.length) recomputeRoutePoints();
  }
}, [
  el("option", {value:"5"}, ["alle 5 km"]),
  el("option", {value:"10"}, ["alle 10 km"]),
  el("option", {value:"15"}, ["alle 15 km"]),
  el("option", {value:"20"}, ["alle 20 km"]),
  el("option", {value:"25"}, ["alle 25 km"])
]);

// Pushes a fresh state value into a persistent input/select's live .value —
// guarded so it never overwrites a value the user is still actively typing.
// Note: render() does `app.innerHTML = ""` before rebuilding the tree (see
// render() above), which itself synchronously blurs whatever was focused —
// so in practice, by the time this runs from inside renderRouteCard()/
// renderSegmentsCard(), document.activeElement is never still inputEl. That
// blur-on-every-render is a pre-existing property of the "rebuild everything"
// architecture (it happened before this fix too — el() used to hand back a
// brand new node every render either way) and is not what this fix targets;
// it isn't a regression. What matters for the Safari crash is that the same
// <input> Element object survives that detach/reattach instead of being
// destroyed and replaced by a new one (which is what let WebKit's native
// datetime-local picker end up pointing at a torn-down node). The guard is
// still kept, both because it's what was asked for and because it's the
// correct defensive check if this ever gets called from anywhere that
// *doesn't* wipe focus first — and since state.startTime/etc. were only
// ever written here from that same input's own already-committed onchange
// value, re-syncing never actually discards unsaved user input either way.
function syncPersistentInputValue(inputEl, value){
  if(document.activeElement === inputEl) return;
  if(inputEl.value !== value) inputEl.value = value;
}

let leafletMapInstance = null;
let routeMapLayers = null; // L.layerGroup holding everything drawn on top of the base tiles for the current route/segment
let mountedRouteKey = null; // identifies which route/segment leafletMapInstance is currently showing
let routeMarkerByIndex = {}; // routePoints index -> Leaflet marker (for weather-chip clicks)

// The starred segments currently visible on "Meine Segmente" (respects
// state.hideIrrelevantSegments via sortedVisibleSegments — the exact same
// list the page's rows come from, see renderSegmentsCard()) that have
// geometry already loaded — i.e. what the overview map
// (mountSegmentsOverviewView()) can actually draw. Every starred segment's
// detail (incl. geometry) is eagerly fetched by loadSegmentExtras() for the
// whole bucket, so this never triggers a new fetch — it just filters down to
// whichever details have already arrived, skipping any segment still loading
// or genuinely lacking a polyline. Shared by currentRouteKey() (decides
// whether the overview map view is even active) and
// mountSegmentsOverviewView() (the actual polylines) and renderSegmentsCard()
// (whether to show the map container at all) so all three can never disagree
// about which segments are "on the map".
function segmentsWithOverviewGeometry(){
  const bucket = segmentBucket("starred");
  return sortedVisibleSegments(bucket).filter(seg => {
    const detail = bucket.details[seg.id];
    return !!(detail && detail.map && (detail.map.polyline || detail.map.summary_polyline));
  });
}

// Distinguishes "still the same route/segment, just re-rendering with new
// data" (keep the map + tiles, only redraw the overlay layer) from
// "switched to a different route" (full teardown + fresh mount needed).
function currentRouteKey(){
  if(isShowingSegmentDetail()) return "segment-" + state.selectedSegmentSource + "-" + state.selectedSegmentId;
  // "Meine Segmente" list page (Task 2): the shared overview key only while
  // there's at least one starred segment with usable geometry — otherwise
  // null, same as the route-page branch below when there's no route yet, so
  // mountRouteMap() tears down/no-ops instead of showing a blank canvas.
  if(state.activePage === "segments") return segmentsWithOverviewGeometry().length ? "segments-overview" : null;
  // Segmentjäger: its own key namespace ("segmentjaeger-" prefix, not
  // "route-") so navigating here with the same activity already selected on
  // the Strecke page still gets a fresh mount instead of silently reusing
  // that page's map instance — same "no route yet -> null" fallback as the
  // route-page branch below.
  if(state.activePage === "segmentjaeger"){
    if(!state.fullRouteCoords.length) return null;
    const a = state.selectedActivity;
    return "segmentjaeger-" + (a ? (a.id || a.name || "") : "");
  }
  if(!state.fullRouteCoords.length) return null;
  const a = state.selectedActivity;
  return "route-" + (a ? (a.id || a.name || "") : "");
}

function mountRouteMap(){
  const container = document.getElementById("route-map");
  const key = currentRouteKey();

  if(!container || key === null){
    if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; routeMapLayers = null; mountedRouteKey = null; }
    return;
  }

  const isNewRoute = key !== mountedRouteKey || !leafletMapInstance;
  if(isNewRoute){
    if(leafletMapInstance) leafletMapInstance.remove();
    leafletMapInstance = L.map(container, { scrollWheelZoom:true });
    // CARTO retired its key-less raster basemap (basemaps.cartocdn.com) --
    // every tile now renders an "API key required" watermark unless a
    // registered CARTO API key is attached to the URL. Standard OSM tiles
    // are the only major provider left that's genuinely free with no
    // signup/key at all, so that's what this uses now.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap Mitwirkende',
      maxZoom: 19,
      subdomains: 'abc'
    }).addTo(leafletMapInstance);
    routeMapLayers = L.layerGroup().addTo(leafletMapInstance);
    mountedRouteKey = key;
  } else {
    routeMapLayers.clearLayers();
  }

  if(isShowingSegmentDetail()){
    mountSegmentView(leafletMapInstance, routeMapLayers, state.selectedSegmentId, isNewRoute);
  } else if(state.activePage === "segments"){
    mountSegmentsOverviewView(leafletMapInstance, routeMapLayers, isNewRoute);
  } else if(state.activePage === "segmentjaeger"){
    mountSegmentjaegerView(leafletMapInstance, routeMapLayers, isNewRoute);
  } else {
    mountFullRouteView(leafletMapInstance, routeMapLayers, isNewRoute);
  }
}

// Shared builder for every rotated map-direction icon (Leaflet L.divIcon
// html string) — replaces three previously independent inline SVG strings
// (segment wind marker, Windfeld overlay arrow, route-direction chevron)
// that all drew "an arrow rotated to point somewhere" with slightly
// different, hand-picked line/chevron coordinates and no shared code. Wind
// icons (outline line+chevron, optional center dot) and the plain
// travel-direction icon (filled solid arrowhead, always neutral chalk) stay
// visually distinct on purpose — they mean different things (wind
// direction vs. which way the ride goes) — but are now one drawing
// function with explicit params instead of three ad-hoc copies.
function mapDirectionArrowSvg({size, rotateDeg, color, withDot, filled, strokeWidth, dropShadow}){
  // fill/stroke set via style="" (not bare attributes) so a CSS custom
  // property color like var(--chalk) reliably resolves once Leaflet inserts
  // this markup into the live DOM.
  const shadow = dropShadow ? ` filter: drop-shadow(0 0 ${dropShadow}px rgba(20,23,29,0.9));` : '';
  const dot = withDot ? `<circle cx="8" cy="8" r="2.4" style="fill:${color}; opacity:0.95;"/>` : '';
  const body = filled
    ? `<path d="M8 2.5 L12.5 11 L8 8.8 L3.5 11 Z" style="fill:${color}; opacity:0.95;"/>`
    : `<line x1="8" y1="13.2" x2="8" y2="3.5" style="stroke:${color}; stroke-width:${strokeWidth}px;" stroke-linecap="round"/>
       <path d="M4.3 6.8 L8 2.5 L11.7 6.8" fill="none" style="stroke:${color}; stroke-width:${strokeWidth}px;" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 16 16" style="transform:rotate(${rotateDeg}deg);${shadow}">${dot}${body}</svg>`;
}

function mountSegmentView(map, layers, segId, isNewRoute){
  const bucket = segmentBucket(state.selectedSegmentSource);
  const seg = bucket.list.find(s => s.id === segId);
  const detail = bucket.details[segId];
  const poly = detail && detail.map && (detail.map.polyline || detail.map.summary_polyline);
  if(!seg || !poly) return;

  const coords = decodePolyline(poly);
  const latlngs = coords.map(c => [c[0], c[1]]);

  let color = "#82a2d1", label = escapeHtml(seg.name);
  const w = bucket.weather[segId];
  if(w && seg.start_latlng && seg.end_latlng){
    const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
    const rel = windRelative(bearing, w.windDir);
    color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#f2766b" : "#e2b23e";
    const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
    label = `<b>${escapeHtml(seg.name)}</b><br>${typeLabel} · ${Math.round(w.windSpeed)} km/h`;
  }

  const line = L.polyline(latlngs, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(layers);
  if(isNewRoute) map.fitBounds(line.getBounds(), { padding:[30,30] });
  line.bindPopup(label).openPopup();

  // Start/finish markers use a filled-vs-hollow dot (not color) to tell them
  // apart — "start = green dot, finish = red dot" would silently borrow the
  // tail/head wind vocabulary for an unrelated meaning (these mark route
  // endpoints, not wind favorability).
  L.circleMarker(latlngs[0], { radius:6, weight:2, color:"#f2efe9", fillColor:"#f2efe9", fillOpacity:1 })
    .addTo(layers).bindTooltip("Start");
  L.circleMarker(latlngs[latlngs.length - 1], { radius:6, weight:2, color:"#f2efe9", fillColor:"#14171d", fillOpacity:1 })
    .addTo(layers).bindTooltip("Ziel");

  // wind direction arrow at the segment's midpoint — points where the wind
  // blows toward, absolute compass direction (north-up), same convention
  // as the full-route markers
  if(w){
    const midPoint = latlngs[Math.floor(latlngs.length / 2)];
    const rotateDeg = (w.windDir + 180) % 360;
    const icon = L.divIcon({
      className: "",
      html: mapDirectionArrowSvg({ size:26, rotateDeg, color, withDot:true, filled:false, strokeWidth:1.8, dropShadow:2 }),
      iconSize: [26,26], iconAnchor: [13,13]
    });
    L.marker(midPoint, { icon }).addTo(layers).bindPopup(label);
  }
}

// "Meine Segmente" overview map (Task 2): every visible starred segment with
// already-loaded geometry (see segmentsWithOverviewGeometry()), each as its
// own static polyline in one consistent color — the same neutral --route
// blue mountSegmentView() itself falls back to when there's no wind data for
// a segment. This is a static overview, not a per-segment detail view, so
// there's deliberately no wind coloring/popups/direction arrows/start-finish
// markers and no click-to-select here, unlike mountSegmentView() above — just
// the shapes, so the rider can see where all their starred segments are
// relative to each other. On a fresh mount, fits the map to the combined
// bounds of every polyline drawn (same [30,30] padding convention as
// mountSegmentView()'s single-segment fitBounds above).
function mountSegmentsOverviewView(map, layers, isNewRoute){
  const bucket = segmentBucket("starred");
  const drawnLines = [];
  segmentsWithOverviewGeometry().forEach(seg => {
    const detail = bucket.details[seg.id];
    const poly = detail && detail.map && (detail.map.polyline || detail.map.summary_polyline);
    if(!poly) return;
    const coords = decodePolyline(poly);
    const latlngs = coords.map(c => [c[0], c[1]]);
    // A plain #82a2d1 line at weight 5 reads fine as the single highlighted
    // route on mountSegmentView(), but with many overview lines at once it
    // gets lost against OSM's own light road/water/forest tile colors. A
    // dark casing underneath (same #333a47 neutral-dark already used as
    // mountFullRouteView()'s uncovered-route base line) fixes contrast on
    // any tile background without changing the route color itself.
    L.polyline(latlngs, { color:"#333a47", weight:8, opacity:0.7, lineCap:"round", lineJoin:"round" }).addTo(layers);
    const line = L.polyline(latlngs, { color:"#82a2d1", weight:4, opacity:1, lineCap:"round", lineJoin:"round" }).addTo(layers);
    drawnLines.push(line);
  });
  if(isNewRoute && drawnLines.length){
    map.fitBounds(L.featureGroup(drawnLines).getBounds(), { padding:[30,30] });
  }
}

// Segmentjäger's own map view: the ridden activity's plain route line (same
// neutral base-line treatment as mountFullRouteView()'s uncovered-route line
// below — no wind coloring/Windfeld/reversed-direction handling here, this
// page isn't about wind) plus an overlay for only the currently-SELECTED
// segments (state.segmentjaegerSelection), drawn with the exact same dark-
// casing + route-blue treatment mountSegmentsOverviewView() above already
// uses for "Meine Segmente"'s multi-segment overview. Deselected segments
// are omitted from the map entirely rather than dimmed — this is a static
// overview, not an interactive picker (see the task brief: not clickable,
// matches "Meine Segmente"'s static-map convention); the list below the map
// is where selection actually happens.
function mountSegmentjaegerView(map, layers, isNewRoute){
  if(!state.fullRouteCoords.length) return;
  const coords = activeRouteCoords();
  const latlngs = coords.map(c => [c[0], c[1]]);
  const baseLine = L.polyline(latlngs, { color:"#333a47", weight:3, opacity:0.55, lineCap:"round", lineJoin:"round" }).addTo(layers);
  const fitTargets = [baseLine];

  const bucket = segmentBucket("route");
  state.routeSegments.forEach(seg => {
    if(!state.segmentjaegerSelection[seg.id]) return;
    const detail = bucket.details[seg.id];
    const poly = detail && detail.map && (detail.map.polyline || detail.map.summary_polyline);
    if(!poly) return;
    const segLatlngs = decodePolyline(poly).map(c => [c[0], c[1]]);
    L.polyline(segLatlngs, { color:"#333a47", weight:8, opacity:0.7, lineCap:"round", lineJoin:"round" }).addTo(layers);
    const line = L.polyline(segLatlngs, { color:"#82a2d1", weight:4, opacity:1, lineCap:"round", lineJoin:"round" }).addTo(layers);
    fitTargets.push(line);
  });

  if(isNewRoute) map.fitBounds(L.featureGroup(fitTargets).getBounds(), { padding:[26,26] });
}

function mountFullRouteView(map, layers, isNewRoute){
  // Must match whatever coord order routePoints was built from (see
  // recomputeRoutePoints()) — pts[i].idx indexes into that same array, used
  // below to slice the colored wind segments and to place direction chevrons.
  const coords = activeRouteCoords();
  const latlngs = coords.map(c=>[c[0], c[1]]);

  // faint base line — carries the route where no wind data covers it
  const baseLine = L.polyline(latlngs, { color:"#333a47", weight:3, opacity:0.55, lineCap:"round", lineJoin:"round" }).addTo(layers);
  if(isNewRoute) map.fitBounds(baseLine.getBounds(), { padding:[26,26] });

  // optional "Windfeld" overlay — a field of small wind arrows sampled along
  // the route, toggled in renderRouteCard(). Added before the route
  // line/markers below so it stays visually underneath them.
  if(state.windFieldEnabled){
    if(!state.windFieldPoints && !state.loading.windField){
      ensureWindField();
    } else if(state.windFieldPoints){
      state.windFieldPoints.forEach(p=>{
        const color = windSpeedColor(p.windSpeed);
        const rotateDeg = (p.windDir + 180) % 360;
        const icon = L.divIcon({
          className: "",
          html: mapDirectionArrowSvg({ size:11, rotateDeg, color, withDot:false, filled:false, strokeWidth:1.6, dropShadow:0 }),
          iconSize: [11,11], iconAnchor: [5.5,5.5]
        });
        L.marker([p.lat, p.lon], { icon }).addTo(layers).bindTooltip(`${Math.round(p.windSpeed)} km/h`);
      });
    }
  }

  // continuous colored line: one segment per stretch between two
  // consecutive wind-sampled points, colored by that stretch's wind relation
  const pts = state.routePoints;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    const color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#f2766b" : "#e2b23e";
    const from = pts[i].idx, to = pts[i+1].idx;
    if(to <= from) continue;
    const segCoords = coords.slice(from, to + 1).map(c=>[c[0], c[1]]);
    L.polyline(segCoords, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(layers);
  }

  // small chevrons along the line showing which way the ride goes — placed
  // at even distance intervals independent of the (much sparser)
  // wind-sample points, so direction stays legible on loops/out-and-backs
  // regardless of the chosen Punktabstand.
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm > 0){
    const chevronCount = Math.min(20, Math.max(4, Math.round(totalKm / 2)));
    const spacingKm = totalKm / chevronCount;
    for(let c=1;c<chevronCount;c++){
      const targetKm = c * spacingKm;
      let idx = cumDist.findIndex(d => d >= targetKm);
      if(idx <= 0) idx = 1;
      if(idx >= coords.length) idx = coords.length - 1;
      const bearing = bearingBetween(coords[idx-1], coords[idx]);
      const icon = L.divIcon({
        className: "",
        html: mapDirectionArrowSvg({ size:14, rotateDeg:bearing, color:"var(--chalk)", withDot:false, filled:true, dropShadow:1.5 }),
        iconSize: [14,14], iconAnchor: [7,7]
      });
      L.marker(coords[idx], { icon, interactive:false }).addTo(layers);
    }
  }

  // invisible anchors at each sampled point — no visual marker on the map
  // (the colored line segments + Windfeld overlay already convey wind
  // direction/type), these just let the weather-strip chips below the map
  // pan to / open a popup on the right spot when clicked — skip points that
  // sit too close to an already-placed anchor (e.g. where the route crosses
  // itself)
  const markerDedupeRadiusKm = 0.5;
  const shownMarkerPositions = [];
  const invisibleIcon = L.divIcon({ className:"", html:"", iconSize:[0,0] });
  routeMarkerByIndex = {};
  pts.forEach((p,i)=>{
    const near = shownMarkerPositions.find(m => haversineKm([m.lat, m.lon], [p.lat, p.lon]) < markerDedupeRadiusKm);
    if(near){ routeMarkerByIndex[i] = near.marker; return; }

    const w = state.weatherAtRoute[i];
    let label = "Keine Winddaten";
    if(w){
      const rel = windRelative(p.bearing, w.windDir);
      const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
      label = `<b>Ankunft ${fmtTime(p.arrivalTime)} Uhr</b> · ${p.distanceKm.toFixed(0)} km<br><b>${typeLabel}</b><br>${Math.round(w.windSpeed)} km/h · ${Math.round(w.temp)}° · ${w.precip}% Regen`;
    }
    const marker = L.marker([p.lat, p.lon], { icon: invisibleIcon })
      .addTo(layers).bindPopup(label);
    shownMarkerPositions.push({ lat:p.lat, lon:p.lon, marker });
    routeMarkerByIndex[i] = marker;
  });
}

// All-time PR time/watts, KOM/QOM, elevation gain, effort count — split into
// a `hero` list ({value, label[, style]} pairs, rendered as the big
// hero-numeral .stat-chip boxes) and a `secondary` list (plain strings,
// rendered as one small muted summary line). Only 1-2 stats get to be
// hero-sized per the file's WHOOP-inspired "one clearly primary number"
// hierarchy — flooding 7+ equally-loud chips into one row (the pre-existing
// behavior here) defeated the point of that hierarchy. For the starred list,
// the all-time PR is the closest equivalent to "the one number that matters
// most" (no single ride to anchor on), plus the KOM/QOM delta chips (the
// actual point of this feature — see buildXomChip) which stay hero-sized in
// both lists so they read the same way everywhere. Watts, elevation gain and
// effort count are still shown, just demoted to the quieter summary line —
// "cleaner", not "less complete". Used both in the segment list and the
// segment map view. This is the starred-segments (bucket.efforts == null)
// shape, which needs the detail/PR-lookup fetches since it has no single
// ride to read numbers off of. For the ride-completed-segments bucket
// (bucket.efforts set, see ensureRideSegments()), computeRideEffortStatChips()
// below is used instead — it leads with this ride's own time, then appends
// the same all-time detail-derived stats built here (bucket.details[seg.id]
// is fetched for both buckets by loadSegmentExtras(), so no new fetch is
// needed for the ride case either). Takes a bucket (see segmentBucket()) so
// callers don't need to know which shape applies.
function computeSegmentStatChips(seg, bucket){
  if(bucket.efforts) return computeRideEffortStatChips(bucket.efforts[seg.id], bucket.prWatts[seg.id], bucket.details[seg.id]);
  const detail = bucket.details[seg.id];
  const hero = [], secondary = [];
  if(detail){
    const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
    if(pr != null) hero.push({value: fmtDuration(pr), label:"PR"});
    const prWatts = bucket.prWatts[seg.id];
    if(prWatts) secondary.push(`${prWatts.measured ? "" : "~"}${prWatts.watts} W`);
    const potential = prWatts ? buildPotentialChip(prWatts.watts, pr) : null;
    if(potential) hero.push(potential);
    if(state.showKomChip && detail.xoms && detail.xoms.kom) hero.push(buildXomChip(detail.xoms.kom, pr, "KOM"));
    if(state.showQomChip && detail.xoms && detail.xoms.qom) hero.push(buildXomChip(detail.xoms.qom, pr, "QOM"));
    if(detail.total_elevation_gain != null) secondary.push(`${Math.round(detail.total_elevation_gain)} Hm`);
    const effortCount = detail.athlete_segment_stats && detail.athlete_segment_stats.effort_count;
    if(effortCount) secondary.push(`${effortCount}× gefahren`);
  }
  return {hero, secondary};
}

// Builds the KOM/QOM stat chip: the record time stays the hero value (.v,
// unchanged — the primary number this chip exists to show), with the
// athlete's delta-to-record folded into the label (.l) whenever it can be
// computed, e.g. "KOM +0:47" ("this far behind the record"), so the chip's
// existing value/label structure and width stay intact. Falls back to the
// plain "KOM"/"QOM" label — exactly today's rendering — when xomTime is
// missing/unparseable or prSeconds (the athlete's all-time PR,
// detail.athlete_segment_stats.pr_elapsed_time in both callers — same field
// used for the "PR" chip, not a ride-specific effort time) is unavailable.
// A PR that is <= the KOM/QOM time (should not normally happen — the athlete
// would then *be* the record holder — but can occur with a stale/cached
// xoms value) shows a distinct "on par" label instead of a negative delta.
// Shared by computeSegmentStatChips() (starred bucket) and
// computeRideEffortStatChips() (ride-completed bucket) so the parsing/delta
// logic lives in one place and the two lists can't drift out of sync.
//
// Whenever a delta IS computed, the chip also gets a closeness tint (see
// --kom-near/--kom-mid in :root) — how close the athlete's PR is to the
// record, as a PERCENTAGE of the record time (deltaSeconds / xomSeconds),
// not raw seconds: 10s is huge on a 30s sprint segment but trivial on a
// 20-minute climb, so the fraction is the fair basis. Within ~5% of the
// record is the closest/most-prominent tier, within ~15% the milder "getting
// close" tier, beyond that the chip keeps its plain neutral styling (no
// style override — statChip() then falls back to the default --route/
// --route-bg chip look). "On par" (delta <= 0) is treated as the closest
// possible tier since there's nothing closer than tied-or-ahead.
function buildXomChip(xomTime, prSeconds, label){
  const xomSeconds = parseDuration(xomTime);
  let chipLabel = label;
  let style = null;
  if(xomSeconds != null && prSeconds != null){
    const deltaSeconds = prSeconds - xomSeconds;
    if(deltaSeconds > 0){
      chipLabel = `${label} +${fmtDuration(deltaSeconds)}`;
      const closeness = deltaSeconds / xomSeconds;
      if(closeness <= 0.05) style = "color:var(--kom-near); background:var(--kom-near-bg);";
      else if(closeness <= 0.15) style = "color:var(--kom-mid); background:var(--kom-mid-bg);";
    } else {
      chipLabel = `${label} GLEICHAUF`;
      style = "color:var(--kom-near); background:var(--kom-near-bg);";
    }
  }
  return {value: `${xomTime}`, label: chipLabel, style};
}

// "Genutztes Potential": Segment-Ø-Watt als Anteil der auf die gleiche Dauer
// interpolierten MMP-Bestleistung. state.profilPage.riderProfile ist vor dem
// ersten "Trainingsdaten laden" null -- dann liefert das still null zurück
// und der Chip wird schlicht weggelassen (keine Meldung, kein Auto-Fetch,
// gleiche Konvention wie andere teure/optionale Zusatzdaten im Code).
// >100% ist zulässig (nicht gekappt): die MMP-Kurve deckt nur die letzten
// CEILING_WINDOW_DAYS Tage ab, ein älterer Segment-PR kann darüber liegen --
// das ist eine echte Aussage, kein Rechenfehler.
// Farbe nutzt --tail/--cross (die App-weite Gut/Mittel-Ampel, z.B.
// Terrain-Match, Status-Badges) statt der KOM/QOM-Lila-Töne (--kom-near/
// --kom-mid) -- die bedeuten "nah an einem Strava-Rekord", ein anderes
// Konzept als "eigenes Potential ausgeschöpft", und dieselbe Farbe für beide
// sorgte für Verwirrung.
// Bare numeric % (or null if not computable), factored out of
// buildPotentialChip() below so the "Potential zuerst" sort (see
// segmentPotentialValue()/sortSegmentsBy()'s "potential" case) can reuse the
// exact same watts/duration -> % math without duplicating it or building a
// display chip it doesn't need — same split as buildXomChip()/
// segmentXomCloseness().
function computePotentialPercent(watts, durationSec){
  if(watts == null || durationSec == null) return null;
  const rp = state.profilPage.riderProfile;
  const best = estimatePowerCurveAt(durationSec, rp && rp.mmpCurve);
  if(best == null || best <= 0) return null;
  return Math.round((watts/best) * 100);
}

function buildPotentialChip(watts, durationSec){
  const pct = computePotentialPercent(watts, durationSec);
  if(pct == null) return null;
  let style = null;
  if(pct >= 95) style = "color:var(--tail); background:var(--tail-bg);";
  else if(pct >= 85) style = "color:var(--cross); background:var(--cross-bg);";
  return {value: `${pct}%`, label: "Potential", style};
}

// This ride's own time on the segment, plus the same all-time KOM/QOM delta
// chips the starred list uses — pulled straight from the activity's
// segment_efforts (see ensureRideSegments()), no extra fetches. Split into
// `hero`/`secondary` the same way computeSegmentStatChips() is: this ride's
// own time (the "how did I do on this ride" framing this card exists for)
// and the KOM/QOM delta chips are the 1-2 hero numbers; a rare PR on this
// very effort is folded INTO the Zeit hero chip itself (label becomes
// "Zeit · PR!", tail-colored) rather than getting its own separate hero
// chip, since it's just as prominent that way with one fewer box competing
// for attention. Everything else — watts, this effort's kom_rank ("was this
// specific effort itself in the segment's all-time top 10" — a different
// thing from detail.xoms.kom, the segment's current KOM time, and both are
// still shown, just not merged), all-time PR, elevation gain, effort count —
// is demoted to the quiet secondary summary line. `detail` can be missing
// (e.g. a failed detail fetch) same as in the starred branch, so every
// detail-derived stat below is guarded.
function computeRideEffortStatChips(effort, prWatts, detail){
  const hero = [], secondary = [];
  if(!effort) return {hero, secondary};
  if(effort.elapsed_time != null){
    const isPr = effort.pr_rank === 1;
    hero.push({
      value: fmtDuration(effort.elapsed_time),
      label: isPr ? "Zeit · PR!" : "Zeit",
      style: isPr ? "color:var(--tail); background:var(--tail-bg);" : null
    });
  }
  // "Ø" prefix deliberately added here (NOT in computeSegmentStatChips()'s
  // identical-looking line for the starred bucket, where prWatts genuinely
  // IS the athlete's PR-effort wattage) — `prWatts` here is
  // effort.average_watts for THIS ride's own completion (see
  // ensureRideSegments()), not the athlete's all-time PR effort's wattage
  // (that's a different, starred-bucket-only lookup via
  // fetchSegmentPrWatts()/ensureSegmentPrWatts(), an extra per-segment API
  // call deliberately not made here). Sitting right next to the "PR
  // {duration}" secondary text below without a label, this used to read as
  // if it were the PR's own wattage — the "Ø" (ride average) makes clear
  // it's this ride's number instead.
  if(prWatts) secondary.push(`Ø ${prWatts.measured ? "" : "~"}${prWatts.watts} W`);
  const potential = prWatts && effort.elapsed_time != null ? buildPotentialChip(prWatts.watts, effort.elapsed_time) : null;
  if(potential) hero.push(potential);
  if(effort.kom_rank) secondary.push(`Platz ${effort.kom_rank} (Effort)`);
  if(detail){
    const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
    if(pr != null) secondary.push(`PR ${fmtDuration(pr)}`);
    if(state.showKomChip && detail.xoms && detail.xoms.kom) hero.push(buildXomChip(detail.xoms.kom, pr, "KOM"));
    if(state.showQomChip && detail.xoms && detail.xoms.qom) hero.push(buildXomChip(detail.xoms.qom, pr, "QOM"));
    if(detail.total_elevation_gain != null) secondary.push(`${Math.round(detail.total_elevation_gain)} Hm`);
    const effortCount = detail.athlete_segment_stats && detail.athlete_segment_stats.effort_count;
    if(effortCount) secondary.push(`${effortCount}× gefahren`);
  }
  return {hero, secondary};
}

// diff = 0 means pure tailwind, 180 means pure headwind (see windRelative)
function segmentTailwindDiff(seg, bucket){
  const w = bucket.weather[seg.id];
  if(!w || !seg.start_latlng || !seg.end_latlng) return Infinity;
  const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  return windRelative(bearing, w.windDir).diff;
}

// How close `seg`'s all-time PR is to its current KOM/QOM, as a fraction of
// the record time — the exact same delta/closeness math buildXomChip() uses
// for the chip's tint tiers (deltaSeconds / xomSeconds, negative/on-par
// deltas clamped to 0 so "tied or ahead of the record" reads as maximally
// close rather than sorting as if it were far away). Kept separate from
// buildXomChip() itself since that function's job is building a display chip
// (value/label/style), not returning a bare sortable number — but the two
// must never compute the delta differently, hence the shared parseDuration()
// + pr-minus-xom subtraction. Returns null (not sortable / "no data") when
// detail, the PR, the xom time, or a parseable duration is missing, so
// sortSegmentsBy()'s "kom"/"qom" cases can push those segments to the end
// regardless of sort direction.
function segmentXomCloseness(seg, bucket, xomKey){
  const detail = bucket.details[seg.id];
  if(!detail) return null;
  const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
  if(pr == null) return null;
  const xomTime = detail.xoms && detail.xoms[xomKey];
  if(!xomTime) return null;
  const xomSeconds = parseDuration(xomTime);
  if(xomSeconds == null) return null;
  const deltaSeconds = pr - xomSeconds;
  return Math.max(0, deltaSeconds) / xomSeconds;
}

// Ascending comparator for the "Nähe zum KOM/QOM" sorts where null means "no
// closeness could be computed" (see segmentXomCloseness()) rather than
// "zero/closest" — nulls always sort after every real number, on both ends
// of the list, so segments with no PR/xom data don't masquerade as the
// closest-to-the-record entries.
function compareClosenessNullsLast(a, b){
  if(a == null && b == null) return 0;
  if(a == null) return 1;
  if(b == null) return -1;
  return a - b;
}

// Reusable "Genutztes Potential" % as a plain sortable number (or null when
// not computable), for the "potential" sort case in sortSegmentsBy() below —
// same display-vs-sortable-number split as segmentXomCloseness()/
// buildXomChip(). Mirrors computeSegmentStatChips()/computeRideEffortStatChips()'s
// own watts+duration lookup for each bucket shape (starred vs. ride-
// completed) so the sort never disagrees with what the chip itself shows.
function segmentPotentialValue(seg, bucket){
  const prWatts = bucket.prWatts[seg.id];
  if(!prWatts) return null;
  if(bucket.efforts){
    const effort = bucket.efforts[seg.id];
    if(!effort || effort.elapsed_time == null) return null;
    return computePotentialPercent(prWatts.watts, effort.elapsed_time);
  }
  const detail = bucket.details[seg.id];
  if(!detail) return null;
  const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
  if(pr == null) return null;
  return computePotentialPercent(prWatts.watts, pr);
}

// Descending comparator for the "Bestes Potential zuerst" sort — highest %
// first, nulls (no MMP data / not computable, see segmentPotentialValue())
// always sink to the end regardless of how small a real value is, matching
// compareClosenessNullsLast()'s "no data is worse than any real number"
// convention above.
function comparePotentialNullsLast(a, b){
  if(a == null && b == null) return 0;
  if(a == null) return 1;
  if(b == null) return -1;
  return b - a;
}

// Shared sort logic for both segment lists (starred "Meine Segmente" and
// ride-completed "Abgeschlossene Segmente") — takes the already-sliced list
// to sort plus the bucket (for detail/weather lookups) and a sortBy key, so
// the two pages' sort dropdowns (state.segmentSortBy / state.
// routeSegmentSortBy — deliberately separate state, see state.
// routeSegmentSortBy's declaration) can each drive this one switch without
// duplicating it. See sortedVisibleSegments()/sortedRouteSegments() below
// for the two thin per-page wrappers.
function sortSegmentsBy(list, bucket, sortBy){
  const effortCount = seg => (bucket.details[seg.id] && bucket.details[seg.id].athlete_segment_stats && bucket.details[seg.id].athlete_segment_stats.effort_count) || 0;
  switch(sortBy){
    case "effort": return list.slice().sort((a,b) => effortCount(b) - effortCount(a));
    case "shortest": return list.slice().sort((a,b) => a.distance - b.distance);
    case "longest": return list.slice().sort((a,b) => b.distance - a.distance);
    case "steepest": return list.slice().sort((a,b) => b.average_grade - a.average_grade);
    case "tailwind": return list.slice().sort((a,b) => segmentTailwindDiff(a, bucket) - segmentTailwindDiff(b, bucket));
    // Closest-to-record first (ascending fraction), no-data segments pushed
    // to the end — see segmentXomCloseness()/compareClosenessNullsLast().
    case "kom": return list.slice().sort((a,b) => compareClosenessNullsLast(segmentXomCloseness(a, bucket, "kom"), segmentXomCloseness(b, bucket, "kom")));
    case "qom": return list.slice().sort((a,b) => compareClosenessNullsLast(segmentXomCloseness(a, bucket, "qom"), segmentXomCloseness(b, bucket, "qom")));
    // Highest "Genutztes Potential" % first, no-data segments pushed to the
    // end — see segmentPotentialValue()/comparePotentialNullsLast().
    case "potential": return list.slice().sort((a,b) => comparePotentialNullsLast(segmentPotentialValue(a, bucket), segmentPotentialValue(b, bucket)));
    default: return list;
  }
}

// Whether `seg` has been locally marked "nicht relevant" — see
// state.irrelevantSegmentIds' declaration for why this is one global,
// id-keyed set shared by both segment lists rather than per-page state.
function isSegmentIrrelevant(seg){
  return !!state.irrelevantSegmentIds[seg.id];
}

// Flips `seg`'s membership in state.irrelevantSegmentIds and persists it.
// Purely local curation — unlike toggleSegmentStar() above, there is no
// Strava API call here (Strava has no concept of "relevance"), so this can
// flip synchronously with no pending/error state to track.
function toggleSegmentIrrelevant(seg){
  if(state.irrelevantSegmentIds[seg.id]) delete state.irrelevantSegmentIds[seg.id];
  else state.irrelevantSegmentIds[seg.id] = true;
  saveSettings();
  render();
}

// Shared filter step for both sorted*Segments() functions below: drops
// segments marked irrelevant when state.hideIrrelevantSegments is on. Kept
// as its own function (rather than inlined twice) so the starred and
// ride-completed lists can never disagree about which segments are
// currently hidden — both read the exact same state.hideIrrelevantSegments
// field, which is the whole point of it being one shared switch (see the
// toggle in renderSegmentsCard()/renderRouteSegmentsCard()).
function visibleSegmentList(list){
  return list.filter(seg => !(state.hideIrrelevantSegments && isSegmentIrrelevant(seg)));
}

// Sorting UI has existed on the "Meine Segmente" (starred) page for a while,
// keyed off state.segmentSortBy. No cap — shows every starred segment, same
// as sortedRouteSegments() shows every completed one.
function sortedVisibleSegments(bucket){
  return sortSegmentsBy(visibleSegmentList(bucket.list), bucket, state.segmentSortBy);
}

// Same sorting, no cap — used by "Abgeschlossene Segmente" (see
// renderRouteSegmentsCard()), which intentionally shows every completed
// segment on the ride regardless of sort order. Keyed off its own
// state.routeSegmentSortBy so the two pages' sort choices can't collide.
function sortedRouteSegments(bucket){
  return sortSegmentsBy(visibleSegmentList(bucket.list), bucket, state.routeSegmentSortBy);
}

// ---------- Lokale Segment-Favoriten (Herz) — unabhängig vom Strava-Stern ----------
// The Strava star (see toggleSegmentStar()/starSegment() below) has always
// doubled as Lucas' own "don't forget this segment" list -- the "Meine
// Segmente" page just showed whatever was starred on Strava. That collides
// with using the star for anything ride-specific (e.g. marking a segment
// live on a Karoo for today's ride, see renderStarButton() now also being
// used from the Segmentjäger page): re-starring different segments per ride
// would silently wipe the old "don't forget" list, since Strava only has
// ONE star field per segment, not a per-purpose one.
//
// Fix: a second, independent, purely local list ("Herz"/favorite) that has
// nothing to do with Strava at all -- no API call, no OAuth scope, never
// touched by anything star-related. "Meine Segmente" is now driven by THIS
// list (see loadSegmentsStep()), not by fetchStarredSegments(). The star
// button keeps meaning exactly what it always has (a real Strava star) and
// stays completely untouched by this section -- the two are deliberately
// never linked in either direction (favoriting doesn't star, unfavoriting
// doesn't unstar, and vice versa).
const LOCAL_FAVORITES_KEY = 'velocast_local_favorite_segments';
// Stores the FULL segment summary object per id (not just the id) so a
// favorited segment's name/distance/grade can render immediately without a
// network round-trip -- same reasoning as state.segments already holding
// full summaries today, not just a list of starred ids.
function loadLocalFavoriteSegments(){
  try{
    const raw = localStorage.getItem(LOCAL_FAVORITES_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return {};
}
function saveLocalFavoriteSegments(map){
  try{ localStorage.setItem(LOCAL_FAVORITES_KEY, JSON.stringify(map)); }catch(e){}
}
function isLocalFavorite(seg){
  return !!loadLocalFavoriteSegments()[seg.id];
}
// Synchronous, no network call, no pending/error state to track -- same
// "pure local curation" shape as toggleSegmentIrrelevant() above. Also
// keeps state.segments (the "Meine Segmente"/Favoriten page's list, see
// loadSegmentsStep()) in sync immediately, regardless of which page the
// toggle happened on -- without this, un-hearting a segment while actually
// looking at the Favoriten list would leave a stale row behind until the
// next reload, since that page doesn't otherwise re-read localStorage on
// every render().
function toggleLocalFavorite(seg){
  const map = loadLocalFavoriteSegments();
  if(map[seg.id]) delete map[seg.id];
  else map[seg.id] = seg;
  saveLocalFavoriteSegments(map);
  state.segments = Object.values(map);
  render();
}

// One-time seed of the new local list from whatever's currently starred on
// Strava, so switching to the local-favorites model doesn't silently lose
// Lucas' existing "don't forget" list. Gated on a marker so it only ever
// runs once; adds to the existing local list rather than replacing it (a
// segment already favorited locally, e.g. by a re-run in a test, is left
// alone). Deliberately read-only against Strava -- never un-stars or
// re-stars anything, just copies. Silently no-ops on any failure (no
// token yet, network error, ...) WITHOUT setting the marker, so it simply
// retries the next time loadSegmentsStep() runs with a working connection.
const LOCAL_FAVORITES_MIGRATED_KEY = 'velocast_local_favorites_migrated';
// Pure merge step, extracted out of migrateStarredSegmentsToLocalFavorites()
// so the actual "add-only, never overwrite an existing local favorite" rule
// is unit-testable without a real network fetch (the test sandbox's fetch
// stub always rejects, see test/support/loadApp.js). Returns a NEW object,
// same "caller decides what to do with the result" convention as
// applyChainWearReset().
function mergeFavoritesFromStarred(existingMap, starredList){
  const map = { ...existingMap };
  (starredList || []).forEach(seg => { if(!map[seg.id]) map[seg.id] = seg; });
  return map;
}
async function migrateStarredSegmentsToLocalFavorites(token){
  if(!token) return;
  try{
    if(localStorage.getItem(LOCAL_FAVORITES_MIGRATED_KEY)) return;
  }catch(e){ return; }
  try{
    const starred = await fetchStarredSegments(token);
    saveLocalFavoriteSegments(mergeFavoritesFromStarred(loadLocalFavoriteSegments(), starred));
    localStorage.setItem(LOCAL_FAVORITES_MIGRATED_KEY, '1');
  }catch(e){}
}

// Whether `seg` is currently starred on Strava, for the star button's
// initial icon state. Prefers a successful star action already recorded in
// state.segmentStars (so the icon reflects what THIS session just did,
// without waiting on a re-fetch) over the fetched segment detail's own
// `starred` field (bucket.details[seg.id] — the full DetailedSegment from
// loadSegmentExtras(), which reliably carries `starred` unlike the summary
// shapes some segment lists are built from) over the bare seg.starred on
// the summary object itself, which may be present or absent depending on
// which endpoint/response shape a given segment came from (starred-segments
// list vs. segment detail vs. an activity's segment_efforts). When none of
// those resolve it, default to "not starred" rather than guess, and let a
// successful star action flip it.
function segmentIsStarred(seg, bucket){
  const known = state.segmentStars[seg.id];
  if(known && known.starred != null) return known.starred;
  const detail = bucket && bucket.details[seg.id];
  if(detail && detail.starred != null) return detail.starred;
  return seg.starred === true;
}

// Stars/un-stars `seg` on the athlete's Strava account via starSegment(),
// tracking pending/success/error in state.segmentStars[seg.id]. Shared by
// toggleSegmentStar() below (single-row star button) AND
// syncSegmentjaegerStars() (bulk Segmentjäger sync) -- both just need to
// apply a known target starred state and let this one place own the
// pending flag + the 401/403 "please reconnect" special-case message, so
// that handling never has to be kept in sync between two copies.
async function applySegmentStar(seg, nextStarred){
  const prior = state.segmentStars[seg.id] || {};
  if(prior.pending) return;
  state.segmentStars[seg.id] = { starred: prior.starred, pending: true, error: null };
  render();
  try{
    await starSegment(seg.id, nextStarred, state.accessToken);
    state.segmentStars[seg.id] = { starred: nextStarred, pending: false, error: null };
  }catch(e){
    const reconnectNeeded = e.status === 401 || e.status === 403;
    state.segmentStars[seg.id] = {
      starred: prior.starred,
      pending: false,
      error: reconnectNeeded
        ? "Strava hat die Berechtigung zum Markieren verweigert — bitte trenne die Verbindung und verbinde dich neu mit Strava, um die neue Berechtigung zu erteilen."
        : (e.message || "Markieren fehlgeschlagen.")
    };
  }
  render();
}

// Stars/un-stars `seg` on the athlete's Strava account -- shared by all
// three segment lists (Meine Segmente, Abgeschlossene Segmente,
// Segmentjäger — see renderStarButton() below) since a Strava segment id
// means the same real segment regardless of which list's row triggered
// this. Deliberately unrelated to the local favorites ("Herz") list above
// -- starring/un-starring here never touches loadLocalFavoriteSegments(),
// and toggleLocalFavorite() never touches Strava, by design (see that
// section's comment for why the two used to be tangled together through
// the star field and no longer are).
async function toggleSegmentStar(seg, bucket){
  if((state.segmentStars[seg.id] || {}).pending) return;
  const nextStarred = !segmentIsStarred(seg, bucket);
  await applySegmentStar(seg, nextStarred);
}

// Star icon button, placed inline in the stat-chips row — used by
// renderSegmentRow() (Meine Segmente/Abgeschlossene Segmente) and
// renderSegmentjaegerRow() (Segmentjäger, so a segment can be starred for
// the Karoo's Live Segments directly from the ride-target list). Same
// button everywhere -- a Strava segment id means the same real segment
// regardless of which row triggered this. ev.stopPropagation() keeps a
// click here from also bubbling up into the row's own onclick
// (selectSegment()'s detail-view navigation, or Segmentjäger's selection
// toggle — an unrelated action either way, this button must not trigger it).
function renderStarButton(seg, bucket){
  const st = state.segmentStars[seg.id] || {};
  const starred = segmentIsStarred(seg, bucket);
  return el("button", {
    class: "star-btn" + (starred ? " on" : ""),
    type: "button",
    "aria-label": starred ? "Segment auf Strava demarkieren" : "Segment auf Strava markieren",
    disabled: st.pending ? "disabled" : null,
    onclick: (ev)=>{ ev.stopPropagation(); toggleSegmentStar(seg, bucket); }
  }, [el("span", {html: starIconSvg(starred)})]);
}

// "Nicht relevant" toggle button for renderSegmentRow(), placed inline right
// next to the star button in the same stat-chips row — same icon-button
// idiom (ev.stopPropagation() so it doesn't also trigger the row's own
// onclick into the segment's map detail view), but synchronous: this is pure
// local state (see toggleSegmentIrrelevant()), no network round-trip to wait
// on, so there's no `pending`/`disabled` case to render.
function renderIrrelevantButton(seg){
  const hidden = isSegmentIrrelevant(seg);
  return el("button", {
    class: "star-btn hide-btn" + (hidden ? " on" : ""),
    type: "button",
    "aria-label": hidden ? "Markierung als nicht relevant aufheben" : "Segment als nicht relevant markieren",
    onclick: (ev)=>{ ev.stopPropagation(); toggleSegmentIrrelevant(seg); }
  }, [el("span", {html: hideIconSvg(hidden)})]);
}

// Local-favorite ("Herz") toggle button — same icon-button idiom/size as
// renderStarButton()/renderIrrelevantButton() (ev.stopPropagation() so a
// click here never also triggers the row's own onclick), but synchronous
// like renderIrrelevantButton() -- toggleLocalFavorite() is a pure local
// write, no pending/error/disabled state to render.
function renderFavoriteButton(seg){
  const favorited = isLocalFavorite(seg);
  return el("button", {
    class: "star-btn favorite-btn" + (favorited ? " on" : ""),
    type: "button",
    "aria-label": favorited ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen",
    onclick: (ev)=>{ ev.stopPropagation(); toggleLocalFavorite(seg); }
  }, [el("span", {html: heartIconSvg(favorited)})]);
}

// App-wide toggle switch — the single shared component for every on/off
// setting (Windfeld-Anzeige, KOM/QOM, Auto-Load, Tubeless, Segmente
// ausblenden, ...). Built on the same accessible <input type="checkbox"> +
// .tsettings-switch pattern already used by the Trainer-Einstellungen fields
// (see settingsFieldRow()) instead of a fake div+onclick knob — a real,
// keyboard-focusable checkbox with a real :checked state, not just a
// visual mimic. `label` is a single node/string or an array of nodes (e.g.
// text plus an infoButton()). The whole row is ONE outer <label> (not
// nested inside .tsettings-switch's own wrapper) so a click anywhere in the
// row — switch or text — toggles the single nested checkbox via native
// browser label semantics; no manual onclick needed, and interactive
// descendants like infoButton() (which stopPropagation()s its own clicks)
// are unaffected by the row's implicit toggle.
function renderToggleSwitch(checked, label, onToggle){
  const cb = el('input', {type:'checkbox', onchange:onToggle});
  if(checked) cb.checked = true;
  const pill = el('span', {class:'tsettings-switch'}, [cb, el('span', {class:'tsettings-slider'})]);
  const labelChildren = Array.isArray(label) ? label : [label];
  return el('label', {style:'display:flex; align-items:center; gap:8px; margin-bottom:14px; cursor:pointer;'}, [
    pill,
    el('span', {class:'muted', style:'font-size:12px; display:flex; align-items:center; gap:6px;'}, labelChildren)
  ]);
}

// Renders a single segment "card" (icon, name, distance/grade, wind tag,
// stat chips) — shared between both segment lists (starred + ride-completed)
// and the segment map view, so all three look identical. `bucket` supplies
// this segment's weather/details/PR-watts(/efforts) data; opts.source
// ("starred" | "route", default "starred") is what gets passed to
// selectSegment() so the right bucket is looked up again on
// click/selection-highlight.
function renderSegmentRow(seg, bucket, opts){
  opts = opts || {};
  const source = opts.source || bucket.source || "starred";
  const w = bucket.weather[seg.id];
  let bearing = null;
  if(seg.start_latlng && seg.end_latlng){
    bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  }
  const isSelected = state.selectedSegmentId === seg.id && state.selectedSegmentSource === source;
  const clickable = opts.clickable !== false;
  const rowClass = "segment" + (isSelected ? " selected" : "") + (clickable ? "" : " static");
  // Stable id so the detail view's back button can scroll back to this exact
  // row on close (see renderRouteCard()/renderSegmentsPage()'s back-button
  // handlers). ONLY on the clickable list-context row, never on the static
  // `{clickable:false}` copy rendered inside the detail view's own shell —
  // renderRouteSegmentsCard() renders unconditionally even while a route
  // segment's detail view is open elsewhere on the same page, so the static
  // detail copy and the still-rendered clickable list copy of the SAME
  // segment can coexist in the DOM simultaneously; giving both the same id
  // would be a duplicate-id collision.
  const row = el("div", clickable
    ? {class:rowClass, id:`segment-row-${source}-${seg.id}`, onclick:()=>selectSegment(seg, source)}
    : {class:rowClass});

  let badgeColor = "var(--chalk-dim)", tagClass = "", tagText = "k.A.", arrowHtml = "";
  if(w && bearing !== null){
    const rel = windRelative(bearing, w.windDir);
    badgeColor = rel.type === "tail" ? "var(--tail)" : rel.type==="head" ? "var(--head)" : "var(--cross)";
    tagClass = rel.type === "tail" ? "tail" : rel.type==="head" ? "head" : "cross";
    tagText = (rel.type === "tail" ? "Rückenwind" : rel.type==="head" ? "Gegenwind" : "Seitenwind") + " · " + Math.round(w.windSpeed) + " km/h";
    arrowHtml = arrowSvg(bearing, w.windDir, cssVar('--ink-on-accent'));
  }
  const badge = el("div", {class:"arrow-badge", style:`background:${badgeColor}`, html: arrowHtml});

  const info = el("div", {style:"flex:1; min-width:0;"}, [
    el("div", {class:"name"}, [seg.name]),
    el("div", {class:"meta", style:"display:flex; justify-content:space-between; gap:10px;"}, [
      el("span", {}, [`${(seg.distance/1000).toFixed(1)} km`]),
      el("span", {}, [`${seg.average_grade}% Ø-Steigung`])
    ])
  ]);
  const left = el("div", {class:"left"}, [badge, info]);
  const top = el("div", {class:"top"}, [left, el("div", {class:"tag " + tagClass}, [tagText])]);
  row.appendChild(top);

  // Hero-numeral chips (1-2 stats — PR/Zeit + KOM/QOM delta, see
  // computeSegmentStatChips()/computeRideEffortStatChips()) plus the star
  // button always render together in one row, even when there are no hero
  // chips yet (detail still loading) — the star action should stay
  // discoverable regardless of fetch state. Everything else demoted to
  // `secondary` renders as one quiet compact line underneath instead of
  // more equally-sized chip boxes.
  const stats = computeSegmentStatChips(seg, bucket);
  const chips = el("div", {class:"stat-chips"});
  stats.hero.forEach(s => chips.appendChild(statChip(s.value, s.label, s.style)));
  chips.appendChild(renderFavoriteButton(seg));
  chips.appendChild(renderStarButton(seg, bucket));
  chips.appendChild(renderIrrelevantButton(seg));
  row.appendChild(chips);
  if(stats.secondary.length){
    row.appendChild(el("div", {class:"stat-secondary"}, [stats.secondary.join(" · ")]));
  }
  const starError = state.segmentStars[seg.id] && state.segmentStars[seg.id].error;
  if(starError){
    row.appendChild(el("div", {class:"error", style:"margin-top:8px;"}, [starError]));
  }

  return row;
}

// Segment Top-10 leaderboard — factored into ONE shared function called from
// both segment-detail-view branches (renderRouteCard()'s "Zur Strecke" shell
// and renderSegmentsPage()'s "Zurück zur Liste" shell), which are otherwise
// structurally identical, rather than duplicating this across both. Reads
// state.segmentLeaderboards[seg.id], written only by ensureSegmentLeaderboard()
// (lazy/manual — see its comment for why).
function renderSegmentLeaderboard(seg){
  const lb = state.segmentLeaderboards[seg.id];
  const wrap = el("div", {style:"margin-top:14px;"});

  if(!lb || (!lb.loading && !lb.entries && !lb.error)){
    wrap.appendChild(el("button", {
      class:"btn secondary", style:"padding:8px 14px; font-size:12px;",
      onclick: ()=>ensureSegmentLeaderboard(seg)
    }, ["Top 10 anzeigen"]));
    return wrap;
  }

  if(lb.loading){
    wrap.appendChild(el("div", {class:"loading"}, ["Lade Bestenliste…"]));
    return wrap;
  }

  if(lb.error){
    wrap.appendChild(el("div", {class:"error"}, [lb.error]));
    // ensureSegmentLeaderboard()'s guard only skips on loading/entries
    // truthy, so calling it again here after an error is a genuine retry,
    // not a no-op.
    wrap.appendChild(el("button", {
      class:"btn secondary", style:"margin-top:8px; padding:8px 14px; font-size:12px;",
      onclick: ()=>ensureSegmentLeaderboard(seg)
    }, ["Erneut versuchen"]));
    return wrap;
  }

  // lb.entries is present — dense table-like list, deliberately NOT another
  // stack of big .segment-style card rows (this app's only table-like
  // treatment anywhere): rank/name/time/watts/HR as fixed CSS-grid columns
  // per row, small mono type, tight padding, alternating-row tint instead of
  // per-row borders/cards. See .leaderboard/.leaderboard-row CSS.
  wrap.appendChild(el("div", {class:"muted", style:"font-size:11px; margin-bottom:6px;"}, ["Top " + lb.entries.length]));
  const list = el("div", {class:"leaderboard"});
  list.appendChild(el("div", {class:"leaderboard-row leaderboard-head"}, [
    el("div", {}, ["#"]),
    el("div", {}, ["Fahrer"]),
    el("div", {class:"lb-num"}, ["Zeit"]),
    el("div", {class:"lb-num"}, ["Watt"]),
    el("div", {class:"lb-num"}, ["Puls"])
  ]));
  lb.entries.forEach(entry=>{
    // average_watts/average_hr are absent on many entries (not every device
    // reports them) — omitted per-row rather than shown as an empty/
    // placeholder cell, per el()'s own convention of dropping null children.
    list.appendChild(el("div", {class:"leaderboard-row"}, [
      el("div", {}, [String(entry.rank)]),
      el("div", {class:"lb-name"}, [entry.athlete_name || "?"]),
      el("div", {class:"lb-num"}, [fmtDuration(entry.elapsed_time) || "–"]),
      el("div", {class:"lb-num"}, [entry.average_watts ? `${Math.round(entry.average_watts)} W` : ""]),
      el("div", {class:"lb-num"}, [entry.average_hr ? `${Math.round(entry.average_hr)} bpm` : ""])
    ]));
  });
  wrap.appendChild(list);
  return wrap;
}

function selectSegment(seg, source){
  source = source || "starred";
  const same = state.selectedSegmentId === seg.id && state.selectedSegmentSource === source;
  state.selectedSegmentId = same ? null : seg.id;
  state.selectedSegmentSource = same ? null : source;
  render();
  if(state.selectedSegmentId) ensureSegmentPrWatts(seg, segmentBucket(source));
  requestAnimationFrame(()=>{
    const mapEl = document.getElementById("route-map");
    if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
  });
}

// Same persistent-node pattern as the settings-row inputs above (see the
// comment there) — this select's onchange also calls render() directly, so
// letting el() recreate it fresh every render meant this <select> node was
// destroyed and replaced from under itself on every single sort change.
const segmentSortSelect = el("select", {
  style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
  onchange:(e)=>{ state.segmentSortBy = e.target.value; render(); }
}, [
  el("option", {value:"default"}, ["Standard"]),
  el("option", {value:"tailwind"}, ["Bester Rückenwind zuerst"]),
  el("option", {value:"effort"}, ["Am häufigsten gefahren"]),
  el("option", {value:"shortest"}, ["Länge: kurz → lang"]),
  el("option", {value:"longest"}, ["Länge: lang → kurz"]),
  el("option", {value:"steepest"}, ["Steilste zuerst"]),
  // Unlike kom/qom below, Potential has no show/hide Einstellungen toggle,
  // so it's a plain always-present static option, not synced by
  // syncXomSortOptionsFor().
  el("option", {value:"potential"}, ["Bestes Potential zuerst"])
]);

// Same persistent-node pattern and same reason as segmentSortSelect just
// above (Safari crash from a live <select> being torn down and rebuilt from
// under an open picker) — this is "Abgeschlossene Segmente"'s own sort
// select, kept as a fully separate node/state field (state.
// routeSegmentSortBy) so its dropdown selection can never leak into or be
// clobbered by segmentSortSelect's, and vice versa. Shares the same base 6
// static options as segmentSortSelect above, but NOT its static "Potential"
// option -- that one is specific to "Meine Segmente". Both selects
// independently gain/lose their own kom/qom options based on state.
// showKomChip/showQomChip, via the generalized syncXomSortOptionsFor()
// helper below (this select's own call site is syncXomSortOptions(),
// segmentSortSelect's is syncSegmentSortXomOptions()).
const routeSegmentSortSelect = el("select", {
  style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
  onchange:(e)=>{ state.routeSegmentSortBy = e.target.value; render(); }
}, [
  el("option", {value:"default"}, ["Standard"]),
  el("option", {value:"tailwind"}, ["Bester Rückenwind zuerst"]),
  el("option", {value:"effort"}, ["Am häufigsten gefahren"]),
  el("option", {value:"shortest"}, ["Länge: kurz → lang"]),
  el("option", {value:"longest"}, ["Länge: lang → kurz"]),
  el("option", {value:"steepest"}, ["Steilste zuerst"])
]);

// Kept as detached nodes, appended/removed by syncXomSortOptionsFor() (Task
// 1: KOM/QOM show/hide toggles in Einstellungen) rather than always living
// in routeSegmentSortSelect's option list above -- these two only make sense
// while the corresponding stat chip is actually shown.
const routeSegmentSortKomOption = el("option", {value:"kom"}, ["Nähe zum KOM (%)"]);
const routeSegmentSortQomOption = el("option", {value:"qom"}, ["Nähe zum QOM (%)"]);

// Same pattern, own detached nodes, for segmentSortSelect ("Meine Segmente")
// -- kept fully separate from routeSegmentSort{Kom,Qom}Option above so
// appending/removing one select's options can never touch the other
// select's DOM nodes.
const segmentSortKomOption = el("option", {value:"kom"}, ["Nähe zum KOM (%)"]);
const segmentSortQomOption = el("option", {value:"qom"}, ["Nähe zum QOM (%)"]);

// Generalized version of the sync logic both sort selects need: keeps
// `select`'s KOM/QOM options in sync with the Einstellungen toggles
// (state.showKomChip/showQomChip), falling back `select`'s OWN sort state
// field (`sortStateKey`, e.g. "segmentSortBy" or "routeSegmentSortBy") to
// "default" if it was pointed at the option being hidden. appendChild on an
// already-attached option just moves it to the end, so calling this on every
// render is cheap and idempotent, and always keeps KOM before QOM at the
// tail of the list regardless of which (if either) is currently shown. Each
// select passes its own detached option nodes and own state key, so the two
// selects' options/state can never leak into or clobber each other.
function syncXomSortOptionsFor(select, komOption, qomOption, sortStateKey){
  if(state.showKomChip){
    if(!komOption.parentNode) select.appendChild(komOption);
  } else {
    komOption.remove();
    if(state[sortStateKey] === "kom") state[sortStateKey] = "default";
  }
  if(state.showQomChip){
    if(!qomOption.parentNode) select.appendChild(qomOption);
  } else {
    qomOption.remove();
    if(state[sortStateKey] === "qom") state[sortStateKey] = "default";
  }
}

// routeSegmentSortSelect's ("Abgeschlossene Segmente") own sync call --
// unchanged call sites elsewhere in the file keep calling this exact name.
function syncXomSortOptions(){
  syncXomSortOptionsFor(routeSegmentSortSelect, routeSegmentSortKomOption, routeSegmentSortQomOption, "routeSegmentSortBy");
}

// segmentSortSelect's ("Meine Segmente") own sync call — see
// renderSegmentsCard() for the call site.
function syncSegmentSortXomOptions(){
  syncXomSortOptionsFor(segmentSortSelect, segmentSortKomOption, segmentSortQomOption, "segmentSortBy");
}

// The plain starred-segments list (sort dropdown + rows) — content/behavior
// unchanged from before Task 2, just now rendered from renderSegmentsPage()
// on the "Meine Segmente" nav page instead of inline below the route card.
function renderSegmentsCard(){
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Favoriten"]));

  if(state.loading.segments){
    card.appendChild(el("div", {class:"loading"}, ["Lade Segmente & Wind…"]));
    return card;
  }
  // autoLoadSegments is off (see Einstellungen) and nothing's been fetched
  // yet -- distinct from the genuine "no favorites yet" empty-state below,
