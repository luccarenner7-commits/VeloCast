  // computeTirePressureReminder()); tirePressureReminderDismissed is a
  // session-only flag (never persisted) so dismissing the banner just clears
  // it for the current page load, matching the feature's "no real push
  // notification, no dismissal tracking" scope.
  tirePressure: null,
  tirePressureReminder: null,
  tirePressureReminderDismissed: false,
  // Kettenverschleiß (Task 2) -- deliberately independent from the
  // Ausrüstung gear-wear feature above (own storage key, own reset state,
  // no GEAR_COMPONENTS involvement): see CHAIN_WEAR_KEY/loadChainWearData().
  // Same {loaded-in-init, session-only-dismissed} shape as tirePressure*
  // above, just sourced from the Aktivitäten list cache's summed distance
  // (see getChainWearDistanceM() below) instead of a Strava gear object --
  // chainWearReminder is a plain boolean (danger level reached), not a
  // per-wheel object, since there's only one chain.
  chainWear: null,
  chainWearReminder: false,
  chainWearReminderDismissed: false
};

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k] == null) continue; // omit conditional attrs (e.g. `selected: cond ? "selected" : null`) instead of stringifying null/undefined
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

// Strava segment/activity names come from arbitrary Strava users (anyone can
// create a public segment), so they're untrusted text — must be escaped
// before ever landing in a raw HTML string (e.g. Leaflet popup content).
function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------- polyline decode (Strava / Google encoded polyline) ----------
function decodePolyline(str){
  let index = 0, lat = 0, lng = 0, coords = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

function bearingBetween(p1, p2){
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  let θ = Math.atan2(y,x)*180/Math.PI;
  return (θ+360)%360;
}

function haversineKm(p1, p2){
  const R = 6371;
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δφ = (p2[0]-p1[0])*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildCumulativeDistances(coords){
  const cum = [0];
  for(let i=1;i<coords.length;i++){
    cum.push(cum[i-1] + haversineKm(coords[i-1], coords[i]));
  }
  return cum;
}

function estimateArrival(startDate, distanceKm, avgSpeedKmh){
  const hours = distanceKm / Math.max(1, avgSpeedKmh);
  return new Date(startDate.getTime() + hours*3600*1000);
}

// A bearing taken between two literally-adjacent raw GPS/polyline vertices
// can be a chord only a few meters long, so ordinary GPS jitter can swing it
// by tens of degrees and flip a whole reported segment's tail/cross/head
// classification (windRelative() itself and its thresholds are fine -- it's
// the noisy bearing fed into it that isn't). Averaging over a longer
// real-world chord smooths that out. Windowed by distance (via `cumDist`,
// which is already computed per point) rather than a fixed vertex count,
// since raw point density varies a lot between GPX files/Strava polylines.
const BEARING_SMOOTHING_WINDOW_KM = 0.2;

// Walks `cumDist` from `fromIdx` toward `dir` (-1 = backward, +1 = forward)
// until it reaches (or would overshoot) `targetKm`, clamped at the array's
// ends -- used to find the "before" and "after" ends of the smoothing
// window around a given index.
function indexAtDistance(cumDist, targetKm, fromIdx, dir){
  let idx = fromIdx;
  if(dir < 0){
    while(idx > 0 && cumDist[idx] > targetKm) idx--;
  } else {
    while(idx < cumDist.length - 1 && cumDist[idx] < targetKm) idx++;
  }
  return idx;
}

// Smoothed bearing at raw-vertex index `idx`: the bearing between a point
// ~BEARING_SMOOTHING_WINDOW_KM before it and ~BEARING_SMOOTHING_WINDOW_KM
// after it along the route, instead of just the bearing to the next
// adjacent vertex. Clamped to the route's start/end where a full window
// isn't available (e.g. very short routes), falling back to the immediate
// neighbor(s) if even that collapses to nothing.
function smoothedBearingAt(coords, cumDist, idx){
  const rawAdjacentBearing = () => {
    const nextIdx = idx + 1 < coords.length ? idx + 1 : idx;
    const prevIdx = idx > 0 ? idx - 1 : idx;
    return idx < coords.length - 1 ? bearingBetween(coords[idx], coords[nextIdx]) : bearingBetween(coords[prevIdx], coords[idx]);
  };
  const here = cumDist[idx];
  const beforeIdx = indexAtDistance(cumDist, here - BEARING_SMOOTHING_WINDOW_KM, idx, -1);
  const afterIdx = indexAtDistance(cumDist, here + BEARING_SMOOTHING_WINDOW_KM, idx, 1);
  if(beforeIdx === afterIdx){
    return rawAdjacentBearing();
  }
  // Hairpin/out-and-back guard: at a U-turn that falls inside the smoothing
  // window, `beforeIdx`/`afterIdx` are index-distinct but can still end up
  // almost spatially coincident (the route doubles back on itself between
  // them), producing a near-arbitrary long-chord bearing for this one
  // sample. Detect that by comparing the straight-line distance between them
  // to the along-route distance the window is supposed to span -- a real
  // straight-ish stretch keeps those close; a turnaround collapses the
  // straight-line distance well below it.
  const alongRouteKm = cumDist[afterIdx] - cumDist[beforeIdx];
  if(alongRouteKm > 0 && haversineKm(coords[beforeIdx], coords[afterIdx]) < alongRouteKm * 0.5){
    return rawAdjacentBearing();
  }
  return bearingBetween(coords[beforeIdx], coords[afterIdx]);
}

function pickRoutePoints(coords, cumDist, stepKm){
  if(coords.length < 2) return [];

  // Callers own their own step floor (WIND_FIELD_MIN_STEP_KM=0.5 for the
  // wind field, routePointDistanceKm/LIST_ITEM_WIND_STEP_KM=1 elsewhere) --
  // this is just a safety floor against a zero/negative stepKm causing an
  // infinite loop below, not an intended minimum sample spacing.
  const step = Math.max(0.05, stepKm);
  const totalDistance = cumDist[cumDist.length - 1] || 0;
  const points = [];
  let targetDistance = 0;
  let idx = 0;

  while (targetDistance <= totalDistance + 1e-9) {
    while (idx < cumDist.length - 1 && cumDist[idx] < targetDistance) idx++;
    const p = coords[idx];
    const bearing = smoothedBearingAt(coords, cumDist, idx);
    points.push({ lat: p[0], lon: p[1], bearing, distanceKm: cumDist[idx], idx });
    targetDistance += step;
  }

  if (points.length && points[points.length - 1].distanceKm < totalDistance - 1e-6) {
    const last = coords[coords.length - 1];
    const lastIdx = coords.length - 1;
    points.push({
      lat: last[0],
      lon: last[1],
      bearing: smoothedBearingAt(coords, cumDist, lastIdx),
      distanceKm: cumDist[lastIdx],
      idx: lastIdx
    });
  }

  return points;
}

// ---------- wind relative classification ----------
function windRelative(routeBearing, windFromDeg){
  // windFromDeg = direction wind is coming FROM (meteorological convention)
  // wind blowing TOWARD = windFromDeg + 180
  const windToward = (windFromDeg + 180) % 360;
  let diff = Math.abs(routeBearing - windToward);
  if(diff > 180) diff = 360 - diff;
  // diff small = tailwind (wind pushes same direction as travel)
  if(diff <= 55) return { type:"tail", diff };
  if(diff >= 125) return { type:"head", diff };
  return { type:"cross", diff };
}

// Distance-weighted breakdown of a [fromKm, toKm) slice of the route by wind
// relation, so a short but very headwind-y stretch doesn't count the same as
// a long one. Each inter-point segment is assigned by its midpoint distance,
// so it always lands wholly in one slice or the other (no proportional
// splitting of a segment straddling a boundary — the route's point spacing
// doesn't need that precision).
function computeWindMixForRange(fromKm, toKm){
  const pts = state.routePoints;
  let tailDist = 0, crossDist = 0, totalDist = 0;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const dist = pts[i+1].distanceKm - pts[i].distanceKm;
    if(dist <= 0) continue;
    const mid = (pts[i].distanceKm + pts[i+1].distanceKm) / 2;
    if(mid < fromKm || mid >= toKm) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    if(rel.type === "tail") tailDist += dist;
    else if(rel.type === "cross") crossDist += dist;
    totalDist += dist;
  }
  if(totalDist <= 0) return null;
  const tailPct = Math.round(tailDist / totalDist * 100);
  const crossPct = Math.round(crossDist / totalDist * 100);
  const headPct = Math.max(0, 100 - tailPct - crossPct);
  return { tailPct, crossPct, headPct };
}

// Whole-route wind mix — same computation as computeWindMixForRange, just
// unbounded. No segment midpoint can reach the last point's own distance
// (it's always the average of two smaller-or-equal values), so bounding by
// [0, totalKm) still includes every segment.
function computeWindMix(){
  const pts = state.routePoints;
  if(!pts.length) return null;
  const totalKm = pts[pts.length - 1].distanceKm;
  return computeWindMixForRange(0, totalKm);
}

// Same mix, split at the route's distance midpoint, for a first-half vs.
// second-half pacing read (e.g. "tailwind out, headwind back"). Either half
// can come back null (e.g. an extremely short route with no segment
// midpoint on that side) — callers should handle that gracefully.
function computeWindMixHalves(){
  const pts = state.routePoints;
  if(!pts.length) return null;
  const totalKm = pts[pts.length - 1].distanceKm;
  if(totalKm <= 0) return null;
  const halfKm = totalKm / 2;
  return {
    first: computeWindMixForRange(0, halfKm),
    second: computeWindMixForRange(halfKm, totalKm)
  };
}

// Thresholds for the strong-wind banner. Sustained wind and gusts are judged
// separately since gusts spike well above the sustained speed even on an
// otherwise rideable day.
const STRONG_WIND_KMH = 35;
const STRONG_GUST_KMH = 50;

// Scans the already-fetched weather at each route point (no extra API calls)
// for the worst sustained wind / gust expected anywhere along the route at
// the currently chosen start time, so a gusty stretch in the middle of an
// otherwise calm route still surfaces a warning.
function computeStrongWindWarning(){
  let maxWind = 0, maxGust = 0;
  state.weatherAtRoute.forEach(w=>{
    if(!w) return;
    if(w.windSpeed > maxWind) maxWind = w.windSpeed;
    if(w.windGust > maxGust) maxGust = w.windGust;
  });
  if(maxWind < STRONG_WIND_KMH && maxGust < STRONG_GUST_KMH) return null;
  return { maxWind, maxGust };
}

// ---------- wind field overlay (arrows sampled along the route) ----------
// Optional, off by default (toggle in renderRouteCard): a field of small
// wind arrows tracking the route, similar in spirit to a Windy.com-style
// field but without animation. Open-Meteo accepts comma-separated lists of
// coordinates in a single request, so the whole field costs exactly one
// extra API call, regardless of point count.
//
// This used to be a fixed 10x10 grid spanning the map's current
// getBounds() — fine for a short, roughly square-ish route, but for a long
// route (which needs the map zoomed out much further to fit) the same 100
// points get spread across a much bigger box, so arrow density near the
// route itself drops and long stretches can end up with no nearby arrows at
// all. Sampling along state.fullRouteCoords instead (reusing the same
// buildCumulativeDistances()/pickRoutePoints() pattern used to place the
// weather-sample route points) keeps arrow density tied to the route's own
// length, not the map's zoom level, so both a short loop and a long century
// route end up with arrows tracking their whole path.
const WIND_FIELD_MAX_POINTS = 100; // Open-Meteo's per-request location cap (see ensureWindField below)
const WIND_FIELD_LATERAL_OFFSETS_KM = [-1.2, 0, 1.2]; // perpendicular spread around each along-route sample, so arrows read as a "field" around the route rather than markers directly on top of the line
const WIND_FIELD_MIN_STEP_KM = 0.5; // floor so very short routes don't get a near-zero along-route step

// Offsets (lat, lon) from a point by a compass bearing (0=N, clockwise) and
// a distance in km — flat-earth approximation, plenty accurate at the scale
// of a single ride route.
function offsetLatLon(lat, lon, bearingDeg, distanceKm){
  const bearingRad = bearingDeg * Math.PI / 180;
  const kmPerDegLat = 110.574;
  const kmPerDegLon = 111.320 * Math.cos(lat * Math.PI / 180) || 1e-6;
  return {
    lat: lat + (distanceKm * Math.cos(bearingRad)) / kmPerDegLat,
    lon: lon + (distanceKm * Math.sin(bearingRad)) / kmPerDegLon
  };
}

function computeWindFieldRoutePoints(coords){
  if(coords.length < 2) return [];
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm <= 0) return [];

  // Budget the along-route samples so samples * lateral-offsets stays within
  // the Open-Meteo per-request cap, then space them evenly across the whole
  // route length (short routes get a dense field, long routes get a sparser
  // one, but both cover start-to-finish).
  const samplesBudget = Math.max(1, Math.floor(WIND_FIELD_MAX_POINTS / WIND_FIELD_LATERAL_OFFSETS_KM.length));
  const stepKm = Math.max(WIND_FIELD_MIN_STEP_KM, totalKm / samplesBudget);
  const samples = pickRoutePoints(coords, cumDist, stepKm);

  const points = [];
  samples.forEach(s=>{
    const perpBearing = (s.bearing + 90) % 360;
    WIND_FIELD_LATERAL_OFFSETS_KM.forEach(offsetKm=>{
      if(offsetKm === 0) points.push({ lat: s.lat, lon: s.lon });
      else points.push(offsetLatLon(s.lat, s.lon, perpBearing, offsetKm));
    });
  });

  // Hard cap regardless of how pickRoutePoints() rounds its last point —
  // stay within Open-Meteo's documented per-request location cap.
  return points.slice(0, WIND_FIELD_MAX_POINTS);
}

// Windfeld overlay arrows encode ABSOLUTE wind speed, drawn directly on top
// of the route line (which encodes DIRECTION-RELATIVE wind favorability
// using tail/cross/head). Sharing the same green/amber/red hexes here would
// put e.g. a green "calm" arrow on a green "tailwind" line segment, two
// completely different meanings in the same color — so this uses its own
// --wind-* token family instead (NOT --grade-*, which is tuned for the dark
// climb chart and washes out on the map's light basemap tiles — see the
// --wind-* comment in :root). Darker/more saturated = stronger wind here,
// so the most dangerous reading is the most visible against the light tiles.
function windSpeedColor(kmh){
  if(kmh < 15) return "var(--wind-1)";
  if(kmh < 30) return "var(--wind-2)";
  if(kmh < 45) return "var(--wind-3)";
  return "var(--wind-4)";
}

// ---------- range rings (Whoop-style min/max dashboard icons) ----------
function computeMetricRange(list, field){
  const vals = list.filter(w => w && w[field] != null).map(w => w[field]);
  if(!vals.length) return null;
  return { min: Math.min(...vals), max: Math.max(...vals) };
}

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

// SVG arc between two angles (0deg = top, clockwise), used to draw the
// min->max band on the ring rather than a from-zero progress fill.
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
}

// Small glyphs drawn inside each ring so the metric is identifiable without
// a text caption underneath (icon path coordinates assume a 16x16 viewBox).
function ringIconSvg(kind, color){
  switch(kind){
    case "temp": return `
      <rect x="7" y="1.5" width="2" height="7" rx="1" fill="none" stroke="${color}" stroke-width="1.2"/>
      <circle cx="8" cy="11.5" r="2.6" fill="${color}"/>
      <rect x="7.4" y="3" width="1.2" height="6.8" fill="${color}"/>`;
    case "rain": return `
      <path d="M8 1.5C8 1.5 3.6 7.2 3.6 10.2a4.4 4.4 0 0 0 8.8 0C12.4 7.2 8 1.5 8 1.5Z" fill="${color}"/>`;
    case "wind": return `
      <path d="M2 6.5h7.2a2 2 0 1 0-2-2" fill="none" stroke="${color}" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M2 10.5h5.6a1.7 1.7 0 1 1-1.7 1.7" fill="none" stroke="${color}" stroke-width="1.3" stroke-linecap="round"/>`;
    case "uv": return `
      <circle cx="8" cy="8" r="3" fill="${color}"/>
      <g stroke="${color}" stroke-width="1.2" stroke-linecap="round">
        <line x1="8" y1="1" x2="8" y2="2.6"/><line x1="8" y1="13.4" x2="8" y2="15"/>
        <line x1="1" y1="8" x2="2.6" y2="8"/><line x1="13.4" y1="8" x2="15" y2="8"/>
        <line x1="3.2" y1="3.2" x2="4.3" y2="4.3"/><line x1="11.7" y1="11.7" x2="12.8" y2="12.8"/>
        <line x1="3.2" y1="12.8" x2="4.3" y2="11.7"/><line x1="11.7" y1="4.3" x2="12.8" y2="3.2"/>
      </g>`;
    default: return "";
  }
}

// Renders one ring: a full pale track circle plus a colored arc spanning
// from the route's min value to its max value for that metric, mapped onto
// a fixed domain (so e.g. a 30-45 km/h wind range visibly sits further
// around the ring than a 5-10 km/h range on a calm day). The icon + value
// live inside the ring itself so no caption text is needed below it.
function renderRangeRing({ icon, unit, range, domainMin, domainMax, color }){
  const size = 76, r = 30, cx = size/2, cy = size/2;
  const valueToAngle = v => Math.min(1, Math.max(0, (v - domainMin) / (domainMax - domainMin))) * 360;
  const startAngle = valueToAngle(range.min);
  let endAngle = valueToAngle(range.max);
  if(endAngle - startAngle < 8) endAngle = Math.min(360, startAngle + 8);
  const arcPath = describeArc(cx, cy, r, startAngle, endAngle);
  const valueText = Math.round(range.min) === Math.round(range.max)
    ? `${Math.round(range.min)}${unit}`
    : `${Math.round(range.min)}–${Math.round(range.max)}${unit}`;
  const svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#262c37" stroke-width="7"/>
    <path d="${arcPath}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
    <svg x="${cx-8}" y="${cy-15}" width="16" height="16" viewBox="0 0 16 16">${ringIconSvg(icon, color)}</svg>
    <text x="${cx}" y="${cy+16}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#f2efe9">${valueText}</text>
  </svg>`;
  return el("div", {style:"display:flex; justify-content:center; flex:1; min-width:0;"}, [
    el("div", {html: svg})
  ]);
}

function renderRangeRingsRow(){
  const tempRange = computeMetricRange(state.weatherAtRoute, "temp");
  const precipRange = computeMetricRange(state.weatherAtRoute, "precip");
  const windRange = computeMetricRange(state.weatherAtRoute, "windSpeed");
  const uvRange = computeMetricRange(state.weatherAtRoute, "uvIndex");

  const rings = [];
  // Each ring gets its own identity color, distinct from the tail/cross/head
  // wind-favorability vocabulary — in particular the "wind" ring (absolute
  // wind-speed range, not direction-relative) is deliberately NOT amber, so
  // it can't be misread as "crosswind".
  if(tempRange) rings.push(renderRangeRing({ icon:"temp", unit:"°", range:tempRange, domainMin:-10, domainMax:35, color:"#e2895c" }));
  if(precipRange) rings.push(renderRangeRing({ icon:"rain", unit:"%", range:precipRange, domainMin:0, domainMax:100, color:"#82a2d1" }));
  if(windRange) rings.push(renderRangeRing({ icon:"wind", unit:"", range:windRange, domainMin:0, domainMax:60, color:"#5ea7a8" }));
  if(uvRange) rings.push(renderRangeRing({ icon:"uv", unit:"", range:uvRange, domainMin:0, domainMax:11, color:"#c26bc2" }));
  if(!rings.length) return null;

  return el("div", {style:"display:flex; justify-content:space-around; gap:6px; margin-top:14px;"}, rings);
}

// Renders one ring showing a single point-in-time value as a 0->value fill
// (rather than renderRangeRing's min->max band) -- same track-circle +
// colored-arc + centered-text visual language as the weather rings above,
// reused here for the Formkurve (CTL/ATL/TSB). No icon glyph (there's no
// existing icon for these metrics the way there is for temp/rain/wind/uv),
// so a caption sits below the ring instead.
function renderValueRing({ label, value, unit, domainMin, domainMax, color, signed }){
  const size = 76, r = 30, cx = size/2, cy = size/2;
  const valueToAngle = v => Math.min(1, Math.max(0, (v - domainMin) / (domainMax - domainMin))) * 360;
  let endAngle = valueToAngle(value);
  if(endAngle < 8) endAngle = 8;
  const arcPath = describeArc(cx, cy, r, 0, endAngle);
  const valueText = `${signed && value>0 ? '+' : ''}${Math.round(value)}${unit}`;
  const svg = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#262c37" stroke-width="7"/>
    <path d="${arcPath}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"/>
    <text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600" fill="#f2efe9">${valueText}</text>
  </svg>`;
  return el("div", {style:"display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; min-width:0;"}, [
    el("div", {html: svg}),
    el("div", {class:"legend-note"}, [label])
  ]);
}

// Formkurve ring row -- replaces the previous 4-chip metric-grid (CTL/ATL/
// TSB/Aufbaurate) with 3 rings for CTL/ATL/TSB, matching the Strecke-tab's
// ring visual language. Aufbaurate lost its dedicated chip here, but stays
// surfaced via the "Steiler Formaufbau"-warn-callout below when relevant
// (renderProfilFormSection) -- explicit user decision (all 4 chips out,
// only 3 rings in). TSB's ring color follows the existing good/warn/danger
// verdict classification (L.formClass) instead of a fixed identity color,
// since that classification already exists and reusing it beats inventing
// a second, parallel set of thresholds just for the ring.
function renderFormRingsRow(L){
  const cc = profilColors();
  const tsbColor = L.formClass === 'good' ? cc.tail : (L.formClass === 'warn' ? cc.cross : cc.head);
  const rings = [
    renderValueRing({ label:"Fitness (CTL)", value:L.ctl, unit:"", domainMin:0, domainMax:120, color:cc.route }),
    renderValueRing({ label:"Ermüdung (ATL)", value:L.atl, unit:"", domainMin:0, domainMax:120, color:cc.cross }),
    renderValueRing({ label:"Form (TSB)", value:L.tsb, unit:"", domainMin:-50, domainMax:50, color:tsbColor, signed:true }),
  ];
  return el("div", {style:"display:flex; justify-content:space-around; gap:6px; margin-top:14px;"}, rings);
}

async function ensureWindField(){
  if(state.windFieldPoints || state.loading.windField) return;
  state.loading.windField = true; render();
  const grid = computeWindFieldRoutePoints(state.fullRouteCoords);
  try{
    const lats = grid.map(p => p.lat.toFixed(3)).join(",");
    const lons = grid.map(p => p.lon.toFixed(3)).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=wind_speed_10m,wind_direction_10m&forecast_days=7&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("Winddaten nicht verfügbar");
    const data = await res.json();
    const results = Array.isArray(data) ? data : [data];
    const targetDate = new Date(state.startTime);
    state.windFieldPoints = results.map((r, i)=>{
      const hours = r.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - targetDate);
        if(diff < best){ best = diff; idx = hi; }
      });
      return {
        lat: grid[i].lat,
        lon: grid[i].lon,
        windSpeed: r.hourly.wind_speed_10m[idx],
        windDir: r.hourly.wind_direction_10m[idx]
      };
    });
  }catch(e){
    state.windFieldPoints = [];
  }
  state.loading.windField = false;
  render();
}

// Finds the best departure times for the current route within the next 48h,
// reusing the hourly forecast we already fetched per route point (Open-Meteo
// returns 7 days of hourly data in a single call) — no extra API requests.
function findBestStartTimes(){
  const pts = state.routePoints;
  if(!pts.length || !state.weatherAtRoute.some(w => w && w.hourly)) return [];

  const now = new Date();
  now.setMinutes(0, 0, 0);
  now.setHours(now.getHours() + 1);
  const candidates = [];
  for(let h=0; h<48; h++){
    candidates.push(new Date(now.getTime() + h*3600*1000));
  }

  const scored = candidates.map(startDate=>{
    let totalDist = 0, tailDist = 0, headDist = 0, sumDiff = 0;
    for(let i=0;i<pts.length-1;i++){
      const w = state.weatherAtRoute[i];
      if(!w || !w.hourly) continue;
      const dist = pts[i+1].distanceKm - pts[i].distanceKm;
      if(dist <= 0) continue;

      const arrival = estimateArrival(startDate, pts[i].distanceKm, state.avgSpeedKmh);
      const hours = w.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - arrival);
        if(diff < best){ best = diff; idx = hi; }
      });
      const windDir = w.hourly.wind_direction_10m[idx];
      const rel = windRelative(pts[i].bearing, windDir);
      sumDiff += rel.diff * dist;
      totalDist += dist;
      if(rel.type === "tail") tailDist += dist;
      if(rel.type === "head") headDist += dist;
    }
    if(totalDist <= 0) return null;
    return {
      startDate,
      avgDiff: sumDiff / totalDist,
      tailPct: Math.round(tailDist / totalDist * 100),
      headPct: Math.round(headDist / totalDist * 100)
    };
  }).filter(Boolean);

  scored.sort((a,b) => a.avgDiff - b.avgDiff);
  return scored.slice(0, 3);
}

async function ensureElevationProfile(){
  if(state.elevationProfile !== null || state.loading.elevation) return;
  // GPX elevation comes straight from the parsed file (elevationProfile is
  // set immediately in loadGpxFile) - nothing to lazily fetch for those.
  if(!state.selectedActivity || state.selectedActivity.isGpx) return;
  state.loading.elevation = true; render();
  try{
    let raw;
    if(state.selectedActivity.isRoute){
      raw = await fetchRouteStreams(state.selectedActivity.id.replace(/^route-/, ""), state.accessToken);
    } else {
      raw = await fetchActivityStreams(state.selectedActivity.id, state.accessToken);
    }
    const streams = normalizeStreams(raw);
    // Strava's distance stream is in meters; elevationProfile.distances is
    // documented (and consumed by renderElevationChart) as km.
    state.elevationProfile = (streams.distance && streams.altitude)
      ? { distances: streams.distance.map(d => d / 1000), elevations: streams.altitude }
      : { distances: [], elevations: [] };
  }catch(e){
    state.elevationProfile = { distances: [], elevations: [] };
  }
  state.loading.elevation = false;
  render();
}

// Shared SVG coordinate scales for any distance/elevation slice. Distances
// don't need to start at 0 (a climb's slice starts at its own km mark); the
// x-scale is relative to the slice's own first point.
function buildDistanceElevationScales(distances, elevations){
  const width = 600, height = 140, pad = 6;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const rangeE = Math.max(1, maxE - minE);
  const d0 = distances[0];
  const totalD = (distances[distances.length - 1] - d0) || 1;
  const x = d => pad + ((d - d0) / totalD) * (width - pad*2);
  const y = e => (height - pad) - ((e - minE) / rangeE) * (height - pad*2);
  return { width, height, pad, x, y };
}

// Builds the elevation line/area SVG for any distance/elevation slice —
// shared by the full-route Höhenprofil tab and the per-climb zoom-in view
// in the Anstiege tab.
function buildElevationChartSvg(distances, elevations){
  const { width, height, pad, x, y } = buildDistanceElevationScales(distances, elevations);

  let linePath = `M ${x(distances[0]).toFixed(1)} ${y(elevations[0]).toFixed(1)}`;
  for(let i=1;i<distances.length;i++){
    linePath += ` L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}`;
  }
  const areaPath = `${linePath} L ${x(distances[distances.length-1]).toFixed(1)} ${height-pad} L ${x(distances[0]).toFixed(1)} ${height-pad} Z`;

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:140px; display:block;">
    <path d="${areaPath}" fill="rgba(130,162,209,0.18)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="#82a2d1" stroke-width="2"/>
  </svg>`;
}

// ---------- hero-numeral stat helpers ----------
// Shared building blocks for the "oversized primary number, small muted
// label" hierarchy used throughout the app (weather chips, wind-mix,
// elevation summary, climb/segment stat chips).
function statBlock(value, label, alignRight){
  return el("div", {class:"stat-block" + (alignRight ? " right" : "")}, [
    el("div", {class:"sb-v"}, [value]),
    el("div", {class:"sb-l"}, [label])
  ]);
}
function statChip(value, label, style, id){
  return el("div", {class:"stat-chip", style: style || null, id: id || null}, [
    el("div", {class:"v"}, [value]),
    el("div", {class:"l"}, [label])
  ]);
}

// ---------- Click-to-reveal info button (sitewide, see Part A) ----------
// Small (i) icon + popover that replaces an always-visible explanatory
// caption: the label/heading/chart next to it stays visible, the prose only
// shows once tapped. `content` is either a string or an array of el() nodes
// (e.g. a row of legendDot() chart-color keys). Toggling is done by directly
// flipping a class on the popover node itself, deliberately NOT via
// state+render() -- same reasoning as flashSettingsSaved() above: a full
// render() would collapse any open <details> the rider is currently in and
// scroll-jump the page just to open a tooltip.
let openInfoPopover = null;
document.addEventListener('click', ()=>{
  if(openInfoPopover){ openInfoPopover.classList.remove('open'); openInfoPopover = null; }
});
function infoButton(content){
  const popover = el('div', {class:'info-popover'}, Array.isArray(content) ? content : [content]);
  const btn = el('button', {type:'button', class:'info-btn', 'aria-label':'Erklärung anzeigen', onclick:(e)=>{
    e.stopPropagation();
    const willOpen = !popover.classList.contains('open');
    if(openInfoPopover && openInfoPopover !== popover) openInfoPopover.classList.remove('open');
    popover.classList.remove('flip-x','flip-y');
    if(willOpen){
      popover.classList.add('open');
      openInfoPopover = popover;
      // clamp to the viewport -- important on a narrow phone screen (this is
      // a phone-first PWA), flip left/up instead of overflowing the edge
      const r = popover.getBoundingClientRect();
      if(r.right > window.innerWidth - 8) popover.classList.add('flip-x');
      if(r.bottom > window.innerHeight - 8) popover.classList.add('flip-y');
    } else {
      popover.classList.remove('open');
      openInfoPopover = null;
    }
  }}, ['i']);
  popover.addEventListener('click', e => e.stopPropagation());
  return el('span', {class:'info-wrap'}, [btn, popover]);
}

function renderElevationChart(){
  if(state.loading.elevation){
    return el("div", {class:"loading"}, ["Lade Höhenprofil…"]);
  }
  if(!state.elevationProfile || state.elevationProfile.distances.length < 2){
    return el("div", {class:"empty-state"}, ["Für diese Strecke sind keine Höhendaten verfügbar."]);
  }
  const profile = activeElevationProfile();
  const { distances, elevations } = profile;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const totalD = distances[distances.length - 1] - distances[0];
  const svg = buildElevationChartSvg(distances, elevations);

  return el("div", {}, [
    el("div", {html: svg}),
    el("div", {style:"display:flex; justify-content:space-between; margin-top:10px;"}, [
      statBlock(`${Math.round(minE)}–${Math.round(maxE)}`, "Höhe (m)"),
      statBlock(totalD.toFixed(1), "Distanz (km)", true)
    ])
  ]);
}

// ---------- climb detection ----------
// Simple grade-threshold segmentation over the elevation profile: walk the
// (lightly smoothed, to filter out GPS/barometric noise) distance/elevation
// samples and grow a "climb" candidate wherever the grade stays at/above
// MIN_GRADE, tolerating short dips/flats (MAX_GAP_KM) so one climb with a
// brief false-flat doesn't get split into two. Candidates below the minimum
// length/elevation-gain are discarded as noise, not real climbs.
const CLIMB_MIN_GRADE = 3;      // % - below this it's not "climbing"
const CLIMB_MAX_GAP_KM = 0.3;   // tolerate short interruptions within a climb
const CLIMB_MIN_LENGTH_KM = 0.5;
const CLIMB_MIN_GAIN_M = 30;

function smoothElevations(elevations, radius){
  return elevations.map((_, i) => {
    let sum = 0, count = 0;
    for(let j = Math.max(0, i - radius); j <= Math.min(elevations.length - 1, i + radius); j++){
      sum += elevations[j]; count++;
    }
    return sum / count;
  });
}

function gradeBetween(distances, elevations, i, j){
  const dKm = distances[j] - distances[i];
  if(dKm <= 0) return 0;
  return (elevations[j] - elevations[i]) / (dKm * 1000) * 100;
}

function detectClimbs(profile){
  const { distances, elevations } = profile;
  if(distances.length < 3) return [];
  const smoothed = smoothElevations(elevations, 2);

  const candidates = [];
  let start = null, lastAboveIdx = null;
  for(let i=1;i<distances.length;i++){
    const grade = gradeBetween(distances, smoothed, i-1, i);
    if(grade >= CLIMB_MIN_GRADE){
      if(start === null) start = i-1;
      lastAboveIdx = i;
    } else if(start !== null && distances[i] - distances[lastAboveIdx] > CLIMB_MAX_GAP_KM){
      candidates.push([start, lastAboveIdx]);
      start = null; lastAboveIdx = null;
    }
  }
  if(start !== null) candidates.push([start, lastAboveIdx]);

  return candidates.map(([fromIdx, toIdx])=>{
    const lengthKm = distances[toIdx] - distances[fromIdx];
    let gainM = 0, maxGrade = 0;
    for(let k=fromIdx+1;k<=toIdx;k++){
      const diff = elevations[k] - elevations[k-1];
      if(diff > 0) gainM += diff;
      const g = gradeBetween(distances, smoothed, k-1, k);
      if(g > maxGrade) maxGrade = g;
    }
    const avgGrade = lengthKm > 0 ? (gainM / (lengthKm * 1000)) * 100 : 0;
    return { fromIdx, toIdx, fromKm: distances[fromIdx], toKm: distances[toIdx], lengthKm, gainM: Math.round(gainM), avgGrade, maxGrade };
  }).filter(c => c.lengthKm >= CLIMB_MIN_LENGTH_KM && c.gainM >= CLIMB_MIN_GAIN_M)
    .sort((a,b) => a.fromKm - b.fromKm); // route order, so prev/next paging moves along the route
}

// Maps a grade percentage to a color (+ matching translucent background),
// used to color-code stat-chips and the chart line by steepness. This is
// deliberately its own single-hue (blue) brightness ramp — NOT the
// green/amber/red wind-favorability colors — because climb steepness has
// nothing to do with wind direction, and reusing tail/head/cross here would
// make a steep-but-tailwind climb chip look like a headwind warning.
function gradeColor(grade){
  if(grade < 4) return { color:"var(--grade-1)", bg:"var(--grade-1-bg)" };
  if(grade < 7) return { color:"var(--grade-2)", bg:"var(--grade-2-bg)" };
  if(grade < 10) return { color:"var(--grade-3)", bg:"var(--grade-3-bg)" };
  return { color:"var(--grade-4)", bg:"var(--grade-4-bg)" };
}

// Same shape as buildElevationChartSvg, but colors each small line segment
// by its local (smoothed, to avoid GPS-noise flicker) grade instead of one
// flat color — steeper sections get a more intense step of the single-hue
// blue --grade-* ramp (see gradeColor()), gentle sections the faintest step.
// Only used for the zoomed-in climb view; the full-route Höhenprofil tab
// keeps its plain line.
function buildClimbChartSvg(distances, elevations){
  const { width, height, pad, x, y } = buildDistanceElevationScales(distances, elevations);
  const smoothed = smoothElevations(elevations, 2);

  let areaPath = `M ${x(distances[0]).toFixed(1)} ${(height-pad).toFixed(1)}`;
  for(let i=0;i<distances.length;i++){
    areaPath += ` L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}`;
  }
  areaPath += ` L ${x(distances[distances.length-1]).toFixed(1)} ${(height-pad).toFixed(1)} Z`;

  let segmentPaths = "";
  for(let i=1;i<distances.length;i++){
    const grade = gradeBetween(distances, smoothed, i-1, i);
    const color = gradeColor(grade).color;
    segmentPaths += `<path d="M ${x(distances[i-1]).toFixed(1)} ${y(elevations[i-1]).toFixed(1)} L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
  }

  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:140px; display:block;">
    <path d="${areaPath}" fill="rgba(130,162,209,0.12)" stroke="none"/>
    ${segmentPaths}
  </svg>`;
}

// Same visual language as the Höhenprofil tab (chart + min/max-elevation
// and distance caption below it), but zoomed to one climb at a time with
// prev/next arrows to page through, and the climb's own stats as stat-chips
// underneath instead of a list of every climb.
function renderClimbsContent(card){
  if(state.loading.elevation){
    card.appendChild(el("div", {class:"loading"}, ["Lade Höhenprofil…"]));
    return;
  }
  if(!state.elevationProfile || state.elevationProfile.distances.length < 3){
    card.appendChild(el("div", {class:"empty-state"}, ["Für diese Strecke sind keine Höhendaten verfügbar."]));
    return;
  }
  const profile = activeElevationProfile();
  const climbs = detectClimbs(profile);
  if(!climbs.length){
    card.appendChild(el("div", {class:"empty-state"}, ["Keine nennenswerten Anstiege auf dieser Strecke gefunden."]));
    return;
  }
  if(state.climbIndex >= climbs.length) state.climbIndex = climbs.length - 1;
  if(state.climbIndex < 0) state.climbIndex = 0;
  const c = climbs[state.climbIndex];

  const segDistances = profile.distances.slice(c.fromIdx, c.toIdx + 1);
  const segElevations = profile.elevations.slice(c.fromIdx, c.toIdx + 1);
  const svg = buildClimbChartSvg(segDistances, segElevations);
  const minE = Math.min(...segElevations), maxE = Math.max(...segElevations);
  const avgColor = gradeColor(c.avgGrade), maxColor = gradeColor(c.maxGrade);

  card.appendChild(el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;"}, [
    el("button", {
      class:"btn secondary", style:"padding:6px 14px; font-size:14px;",
      disabled: state.climbIndex === 0 ? "disabled" : null,
      onclick:()=>{ state.climbIndex--; render(); }
    }, ["←"]),
    el("div", {class:"muted", style:"font-family:'IBM Plex Mono', monospace; font-size:12px;"}, [`Anstieg ${state.climbIndex+1} / ${climbs.length}`]),
    el("button", {
      class:"btn secondary", style:"padding:6px 14px; font-size:14px;",
      disabled: state.climbIndex === climbs.length - 1 ? "disabled" : null,
      onclick:()=>{ state.climbIndex++; render(); }
    }, ["→"])
  ]));

  card.appendChild(el("div", {html: svg}));
  card.appendChild(el("div", {style:"display:flex; justify-content:space-between; margin-top:10px;"}, [
    statBlock(`${Math.round(minE)}–${Math.round(maxE)}`, "Höhe (m)"),
    statBlock(`${c.fromKm.toFixed(1)}–${c.toKm.toFixed(1)}`, "km", true)
  ]));
  card.appendChild(el("div", {class:"stat-chips", style:"margin-top:10px;"}, [
    statChip(c.lengthKm.toFixed(1), "km"),
    statChip(`${c.gainM}`, "Hm"),
    statChip(`${c.avgGrade.toFixed(1)}%`, "Ø Steigung", `color:${avgColor.color}; background:${avgColor.bg};`),
    statChip(`${c.maxGrade.toFixed(0)}%`, "Max Steigung", `color:${maxColor.color}; background:${maxColor.bg};`)
  ]));
}

function renderBestStartContent(card){
  const best = findBestStartTimes();
  if(!best.length){
    card.appendChild(el("div", {class:"empty-state"}, ["Keine Vorhersagedaten verfügbar."]));
    return;
  }
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px; font-size:12px;"}, ["Basierend auf der 7-Tage-Vorhersage für diese Strecke, bei deiner eingestellten Geschwindigkeit."]));
  best.forEach((b,i)=>{
    const dateLabel = b.startDate.toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"});
    const row = el("div", {
      class:"activity" + (i===0 ? " selected" : ""),
      onclick:()=>{
        state.startTime = toLocalInputValue(b.startDate);
        render();
        loadRouteWeather();
      }
    }, [
      el("div", {}, [
        el("div", {class:"name"}, [`${dateLabel}, ${fmtTime(b.startDate)} Uhr`]),
        el("div", {class:"meta"}, [`${b.tailPct}% Rückenwind · ${b.headPct}% Gegenwind`])
      ])
    ]);
    card.appendChild(row);
  });
}

function renderRouteInfoTabsCard(){
  if(isShowingSegmentDetail()) return null;
  if(!state.routePoints.length || !state.weatherAtRoute.length) return null;

  const card = el("div", {class:"card"});
  const tabs = [
    {id:"elevation", label:"Höhenprofil"},
    {id:"climbs", label:"Anstiege"},
    {id:"beststart", label:"Beste Startzeit"}
  ];
  card.appendChild(el("div", {class:"source-tabs"}, tabs.map(t =>
    el("div", {
      class:"source-tab" + (state.routeInfoTab === t.id ? " active" : ""),
      onclick: ()=>{
        state.routeInfoTab = t.id;
        render();
      }
    }, [t.label])
  )));

  if(state.routeInfoTab === "elevation"){
    ensureElevationProfile();
    card.appendChild(renderElevationChart());
  } else if(state.routeInfoTab === "climbs"){
    ensureElevationProfile();
    renderClimbsContent(card);
  } else {
    renderBestStartContent(card);
  }

  return card;
}

function arrowSvg(routeBearing, windFromDeg, color){
  // arrow points in the direction wind blows TOWARD, rotated relative to route bearing (route = "up")
  const windToward = (windFromDeg + 180) % 360;
  const relAngle = windToward - routeBearing;
  return `<svg viewBox="0 0 24 24" style="transform:rotate(${relAngle}deg)">
    <path d="M12 3 L18 15 L12 11.5 L6 15 Z" fill="${color}"/>
  </svg>`;
}

// per-rider preferences. Startzeit is intentionally NOT persisted — it
// defaults to "now + 60min" each visit, a saved absolute timestamp would

// ---------- Strava API ----------
// The actual client_id/client_secret exchange happens in the Cloudflare
// Worker (see worker/), which is the only place that knows the secret.
async function exchangeCode(code){
  const res = await fetch(TOKEN_ENDPOINT, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ code })
  });
  if(!res.ok) throw new Error("Autorisierung fehlgeschlagen (" + res.status + ")");
  return res.json();
}

async function refreshAccessToken(refreshToken){
  const res = await fetch(TOKEN_ENDPOINT, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ refresh_token: refreshToken })
  });
  if(!res.ok) throw new Error("Token-Erneuerung fehlgeschlagen (" + res.status + ")");
  return res.json();
}

// ---------- Hammerhead API ----------
let cachedHammerheadClientId = null;
async function fetchHammerheadClientId(){
  if(cachedHammerheadClientId) return cachedHammerheadClientId;
  const res = await fetch(HAMMERHEAD_CLIENT_ID_ENDPOINT);
  if(!res.ok) throw new Error("Hammerhead-Konfiguration konnte nicht geladen werden (" + res.status + ")");
  const data = await res.json();
  cachedHammerheadClientId = data.client_id;
  return cachedHammerheadClientId;
}
async function buildHammerheadAuthUrl(){
  const clientId = await fetchHammerheadClientId();
  const redirectUri = window.location.origin + window.location.pathname;
  return `https://api.hammerhead.io/v1/auth/oauth/authorize?client_id=${encodeURIComponent(clientId)}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=workout:write&state=hammerhead`;
}

async function exchangeHammerheadCode(code){
  const redirectUri = window.location.origin + window.location.pathname;
  const res = await fetch(HAMMERHEAD_TOKEN_ENDPOINT, {

  });
  if(!res.ok) throw new Error("Hammerhead-Autorisierung fehlgeschlagen (" + res.status + ")");
  return res.json();
}

async function refreshHammerheadToken(refreshToken){
  const res = await fetch(HAMMERHEAD_TOKEN_ENDPOINT, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ refresh_token: refreshToken })

// Strava refresht seinen Token unconditional bei jedem init() (siehe unten),
// weil fast jede Seite davon abhängt. Der Hammerhead-Token wird nur vom
// Send-Button gebraucht -- ein eager Refresh bei jedem Seitenaufruf würde für
// alle, die Trainer nie öffnen, unnötig einen Request verbrauchen. Deshalb
// hier ein echter Expiry-Check (aus Hammerheads expires_in) statt des
// Strava-Musters.
async function ensureHammerheadToken(){
  const skewMs = 60000;
  if(state.hammerheadAccessToken && state.hammerheadExpiresAt && Date.now() < state.hammerheadExpiresAt - skewMs){
    return state.hammerheadAccessToken;
  }
  const stored = await loadStoredHammerheadToken();
  if(!stored){ state.hammerheadConnected = false; return null; }
  try{
    const tokenData = await refreshHammerheadToken(stored);
    state.hammerheadAccessToken = tokenData.access_token;
    state.hammerheadExpiresAt = Date.now() + tokenData.expires_in*1000;
    await saveHammerheadToken(tokenData.refresh_token);
    state.hammerheadConnected = true;
    return state.hammerheadAccessToken;
  }catch(e){
    state.hammerheadConnected = false;
    try{ localStorage.removeItem("hammerhead_refresh_token"); }catch(_){}
    return null;
  }
}

async function connectWithHammerheadCode(code){
  state.loading.hammerheadConnect = true; render();
  try{
    const tokenData = await exchangeHammerheadCode(code);
    state.hammerheadAccessToken = tokenData.access_token;
    state.hammerheadExpiresAt = Date.now() + tokenData.expires_in*1000;
    await saveHammerheadToken(tokenData.refresh_token);
    state.hammerheadConnected = true;
  }catch(e){
    state.trainerPage.hammerheadResult = { ok:false, message: e.message || "Verbindung zu Hammerhead fehlgeschlagen." };
  }
  state.loading.hammerheadConnect = false;
  render();
}
