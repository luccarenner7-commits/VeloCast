async function connectWithCode(code){
  state.error = null;
  state.loading.connect = true; render();
  try{
    const tokenData = await exchangeCode(code);
    state.accessToken = tokenData.access_token;
    state.athlete = tokenData.athlete;
    await saveToken(tokenData.refresh_token);
    state.connected = true;
    await loadActivitiesAndSegments();
  }catch(e){
    state.error = e.message || "Verbindung fehlgeschlagen.";
  }
  state.loading.connect = false;
  render();
}

async function loadActivitiesAndSegments(){
  state.loading.activities = true; render();
  try{
    state.activities = await fetchActivities(state.accessToken);
    if(state.activities.length){
      await selectActivity(state.activities[0]);
    }
  }catch(e){ state.error = e.message; }
  state.loading.activities = false;

  state.loading.segments = true; render();
  try{
    state.segments = await fetchStarredSegments(state.accessToken);
    await loadSegmentExtras(state.segments, segmentBucket("starred"));
  }catch(e){ state.error = e.message; }
  state.loading.segments = false;
  render();
}

// Bundles a segment source's parallel state fields (list + weather + details
// + PR-watts [+ ride-effort stats for the "route" bucket]) into one object,
// so the segment-rendering pipeline (renderSegmentRow, computeSegmentStatChips,
// ensureSegmentPrWatts, etc.) can operate identically on either the user's
// starred segments or the ride-completed segments without duplicating ~150
// lines of rendering logic per source. "starred" == Markierte Segmente /
// state.segments (all-time PR data); "route" == Abgeschlossene Segmente /
// state.routeSegments (this-ride effort data, see `efforts`).
function segmentBucket(source){
  return source === "route"
    ? { source, list: state.routeSegments, weather: state.routeSegmentWeather, details: state.routeSegmentDetails, prWatts: state.routeSegmentPrWatts, efforts: state.routeSegmentEfforts }
    : { source: "starred", list: state.segments, weather: state.segmentWeather, details: state.segmentDetails, prWatts: state.segmentPrWatts, efforts: null };
}

// True while the map should be showing a single segment's detail view
// (instead of the full route / the plain segment list) — i.e. a segment is
// selected AND it belongs to whichever bucket is relevant on the currently
// active page (a starred segment selected on "Meine Segmente" stays shown
// there even if you'd left activePage on "route" some other way; a
// route-explore segment only makes sense inside the route page). Centralized
// here so renderRouteCard(), renderSegmentsPage(), currentRouteKey() and
// mountRouteMap() can't disagree about it.
function isShowingSegmentDetail(){
  if(!state.selectedSegmentId) return false;
  if(state.activePage === "segments") return state.selectedSegmentSource === "starred";
  if(state.activePage === "route") return state.selectedSegmentSource === "route";
  return false;
}

// Clears the ride-completed-segments bucket — called wherever the underlying
// selection changes (new activity/route/GPX selected), same set of call
// sites as the existing elevationProfile/windFieldPoints resets below, since
// a previous ride's completed-segments list has no meaning for a newly
// selected activity/route/GPX. Also drops the current selection if it
// pointed at a ride segment that's about to be wiped out from under it.
// Deliberately does NOT call ensureRideSegments() — this only clears the
// cache back to the "Segmente laden" button state; fetching a fresh
// activity's segments is exclusively user-triggered (see
// renderRouteSegmentsCard()), never automatic.
function resetRouteSegments(){
  // Bumps the generation counter so an ensureRideSegments() call still in
  // flight for the PREVIOUS selection (mid-await when this reset fires)
  // recognizes on its next state-writing step that it's stale and bails out
  // silently instead of writing its (now-meaningless) results/errors on top
  // of whatever selection is current now. See the comment on
  // routeSegmentsGeneration for the full mechanism.
  routeSegmentsGeneration++;
  state.routeSegments = [];
  state.routeSegmentWeather = {};
  state.routeSegmentDetails = {};
  state.routeSegmentPrWatts = {};
  state.routeSegmentEfforts = {};
  state.routeSegmentsFetched = false;
  state.routeSegmentsError = null;
  state.loading.routeSegments = false;
  if(state.selectedSegmentSource === "route"){
    state.selectedSegmentId = null;
    state.selectedSegmentSource = null;
  }
}

async function selectActivity(activity){
  state.selectedActivity = activity;
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  render();
  if(!activity.map || !activity.map.summary_polyline){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  const coords = decodePolyline(activity.map.summary_polyline);
  state.fullRouteCoords = coords;
  const cumDist = buildCumulativeDistances(coords);
  state.routePoints = pickRoutePoints(coords, cumDist, state.routePointDistanceKm);
  render();
  // Deliberately NOT calling ensureRideSegments() here — explicitly
  // user-triggered only (see renderRouteSegmentsCard()'s "Segmente laden"
  // button), never automatic on activity selection.
  await loadRouteWeather();
}

// Re-samples routePoints from the already-loaded fullRouteCoords — used
// whenever Punktabstand changes, and after loading a GPX file or a saved
// Strava route, since the full coordinate list doesn't need to change,
// just how it's sliced into wind-sample points. Deliberately does NOT touch
// elevationProfile/windFieldPoints/routeSegments — Punktabstand changing
// doesn't change which route is loaded, so none of those need to reset.
function recomputeRoutePoints(){
  if(!state.fullRouteCoords.length) return;
  const cumDist = buildCumulativeDistances(state.fullRouteCoords);
  state.routePoints = pickRoutePoints(state.fullRouteCoords, cumDist, state.routePointDistanceKm);
  render();
  loadRouteWeather();
}

function selectRouteSourceTab(tab){
  state.routeSourceTab = tab;
  render();
  if(tab === "routes") ensureStravaRoutesLoaded();
}

async function ensureStravaRoutesLoaded(){
  if(state.stravaRoutes.length || state.loading.routes) return;
  state.loading.routes = true; render();
  try{
    state.stravaRoutes = await fetchStravaRoutes(state.accessToken);
  }catch(e){
    state.error = e.message;
  }
  state.loading.routes = false;
  render();
}

async function selectStravaRoute(route){
  state.selectedActivity = { id: "route-" + route.id, name: route.name, isRoute: true };
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  render();
  const poly = route.map && (route.map.polyline || route.map.summary_polyline);
  if(!poly){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  state.fullRouteCoords = decodePolyline(poly);
  recomputeRoutePoints();
  // Deliberately NOT calling ensureRideSegments() here, see selectActivity()
  // — also a no-op anyway, since this is a planned route (isRoute:true) with
  // no completed segments to fetch (see ensureRideSegments()'s own guard).
}

// ---------- GPX import ----------
// Lets the wind/map pipeline run on any route, not just past Strava
// activities — works without being connected to Strava at all.
function parseGpxTrack(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if(doc.querySelector("parsererror")) return null;
  const points = [...doc.querySelectorAll("trkpt, rtept")];
  const coords = [], eles = [];
  points.forEach(p=>{
    const lat = parseFloat(p.getAttribute("lat"));
    const lon = parseFloat(p.getAttribute("lon"));
    if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    coords.push([lat, lon]);
    const eleEl = p.querySelector("ele");
    const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
    eles.push(Number.isFinite(ele) ? ele : null);
  });
  return coords.length >= 2 ? { coords, eles } : null;
}

async function loadGpxFile(file){
  state.error = null;
  let track = null;
  try{
    track = parseGpxTrack(await file.text());
  }catch(e){
    track = null;
  }
  if(!track){
    state.error = "GPX-Datei konnte nicht gelesen werden.";
    render();
    return;
  }
  state.selectedActivity = { name: file.name.replace(/\.gpx$/i, ""), isGpx: true };
  state.windFieldPoints = null;
  state.climbIndex = 0;
  resetRouteSegments();
  state.fullRouteCoords = track.coords;
  state.elevationProfile = track.eles.every(e => e != null)
    ? { distances: buildCumulativeDistances(track.coords), elevations: track.eles }
    : { distances: [], elevations: [] };
  recomputeRoutePoints();
  // Deliberately NOT calling ensureRideSegments() here, see selectActivity()
  // — also a no-op anyway, since a GPX file (isGpx:true) has no completed
  // segments to fetch (see ensureRideSegments()'s own guard). The card shows
  // the explanatory message instead of the button in this case either way —
  // see renderRouteSegmentsCard().
}

async function loadRouteWeather(){
  if(!state.routePoints.length) return;
  state.loading.weather = true; render();
  const startDate = new Date(state.startTime);
  const weatherResults = [];
  for(const p of state.routePoints){
    const arrival = estimateArrival(startDate, p.distanceKm, state.avgSpeedKmh);
    p.arrivalTime = arrival;
    try{
      const w = await fetchWeather(p.lat.toFixed(4), p.lon.toFixed(4), arrival);
      weatherResults.push(w);
    }catch(e){
      weatherResults.push(null);
    }
  }
  state.weatherAtRoute = weatherResults;
  state.loading.weather = false;
  render();
}

// Fetches per-segment weather + Strava detail (PR, KOM/QOM, elevation,
// effort count) for a list of segments into the given bucket's weather/
// details maps. Shared by both segment sources (see segmentBucket()) — the
// starred-segments flow calls this from loadActivitiesAndSegments(), the
// ride-completed-segments flow from ensureRideSegments() below. For the
// ride-completed bucket the `details` fetched here still matters even
// though computeSegmentStatChips() prefers the richer per-ride effort data
// for its stat chips — mountSegmentView() needs detail.map.polyline to draw
// the segment's own path when it's clicked into the map detail view.
// `limit` caps how many of `list`'s segments get fetched — defaults to 12
// to preserve the starred-segments flow's existing behavior (keeps Strava
// API usage bounded for a page that can have many starred segments). The
// ride-completed flow passes Infinity: "Abgeschlossene Segmente" exists
// specifically to show everything actually completed on the ride, so
// capping it here would silently drop segments past the 12th — the exact
// bug this parameter exists to avoid reintroducing.
async function loadSegmentExtras(list, bucket, limit){
  if(limit === undefined) limit = 12;
  for(const seg of list.slice(0, limit)){
    if(seg.start_latlng){
      try{
        const w = await fetchWeather(seg.start_latlng[0].toFixed(4), seg.start_latlng[1].toFixed(4));
        bucket.weather[seg.id] = w;
      }catch(e){
        bucket.weather[seg.id] = null;
      }
    }
    try{
      bucket.details[seg.id] = await fetchSegmentDetail(seg.id, state.accessToken);
    }catch(e){
      bucket.details[seg.id] = null;
    }
    render();
  }
}

// PR power isn't in the segment summary — it takes a whole extra activity
// fetch per segment to find it, so we only do this on demand (when a
// segment is clicked) instead of eagerly for all visible segments, to keep
// Strava API usage down.
async function ensureSegmentPrWatts(seg, bucket){
  if(bucket.prWatts[seg.id] !== undefined) return;
  const detail = bucket.details[seg.id];
  const prActivityId = detail && detail.athlete_segment_stats && detail.athlete_segment_stats.pr_activity_id;
  if(!prActivityId){ bucket.prWatts[seg.id] = null; return; }
  try{
    const activity = await fetchActivityDetail(prActivityId, state.accessToken);
    const effort = (activity.segment_efforts || []).find(e => e.segment && e.segment.id === seg.id);
    bucket.prWatts[seg.id] = (effort && effort.average_watts != null)
      ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
      : null;
  }catch(e){
    bucket.prWatts[seg.id] = null;
  }
  render();
}

// Segment Top-10 leaderboard — lazy/manual only, same "extra Strava API
// call, don't burn it eagerly" discipline as ensureRideSegments()'s
// "Segmente laden" button (see renderSegmentLeaderboard()'s "Top 10
// anzeigen" button, the only call site). Id-keyed rather than bucket-keyed
// (see state.segmentLeaderboards) since the leaderboard is the same real
// Strava data regardless of whether the segment is shown via the "starred"
// or "route" bucket.
async function ensureSegmentLeaderboard(seg){
  const existing = state.segmentLeaderboards[seg.id];
  // Already loaded or a fetch is already in flight — do nothing. Note this
  // deliberately does NOT skip on a stored `error`, so calling this again
  // after a failure (the render function's "Erneut versuchen" button) is a
  // real retry rather than a permanent stuck state.
  if(existing && (existing.loading || existing.entries)) return;
  state.segmentLeaderboards[seg.id] = { loading: true, entries: null, error: null };
  render();
  try{
    const data = await fetchSegmentLeaderboard(seg.id, state.accessToken);
    state.segmentLeaderboards[seg.id] = { loading: false, entries: data.entries || [], error: null };
  }catch(e){
    // 401/403 most likely means Strava hasn't granted this app leaderboard
    // access at all (see fetchSegmentLeaderboard()'s comment) rather than
    // anything the user can fix by retrying, so it gets its own more honest
    // message instead of the generic one.
    const restricted = e.status === 401 || e.status === 403;
    state.segmentLeaderboards[seg.id] = {
      loading: false, entries: null,
      error: restricted
        ? "Bestenliste konnte nicht geladen werden (evtl. von Strava für diese App eingeschränkt)."
        : "Bestenliste konnte nicht geladen werden. Bitte erneut versuchen."
    };
  }
  render();
}

// ---------- "Abgeschlossene Segmente": segments actually ridden on the
// currently selected Strava ACTIVITY, read from that activity's own
// segment_efforts ----------
// This used to guess at nearby segments geographically (chunking the route
// into bounding boxes, calling Strava's public segments/explore per chunk,
// then proximity-matching each candidate's polyline against the route). That
// answered the wrong question: it surfaced segments merely near the path,
// not segments the athlete actually rode. Strava's activity detail endpoint
// (fetchActivityDetail(), already used elsewhere for PR-watts lookups)
// already returns exactly the right data in `segment_efforts` — one entry
// per segment the rider covered on that specific ride, complete with
// ride-specific stats (elapsed_time, average_watts, pr_rank, kom_rank) — so
// no exploration or matching is needed at all, just one direct fetch.
// This only makes sense for a genuine past ride, not a planned/saved route
// or an uploaded GPX file — nothing has been "completed" on those.

// Bumped by resetRouteSegments() every time the underlying selection changes
// (new activity/route/GPX). ensureRideSegments() captures this value at the
// start of its run; if it no longer matches by the time its one await
// resolves, a reset happened mid-flight and the in-progress fetch is for a
// selection that's no longer current — see ensureRideSegments() for how each
// state-writing step checks this before touching state.
let routeSegmentsGeneration = 0;

// Fetches the segments actually completed on the currently selected
// activity into state.routeSegments (+ their per-ride effort stats into
// state.routeSegmentEfforts). EXPLICITLY USER-TRIGGERED ONLY — called from
// the "Segmente laden" button in renderRouteSegmentsCard(), never
// automatically on activity selection (kept from the old design; still the
// right call even though this is now a single fast request rather than a
// slow chunked one). No-ops when not connected, no activity is selected, or
// the selection isn't a genuine ridden activity (a planned route or GPX file
// has no segment_efforts — renderRouteSegmentsCard() shows an explanatory
// message instead of the button in that case, so this shouldn't normally
// even be reachable then).
async function ensureRideSegments(){
  const activity = state.selectedActivity;
  if(!state.connected || !activity || activity.isRoute || activity.isGpx) return;
  if(state.loading.routeSegments) return;
  // Captured once, up front — see routeSegmentsGeneration's comment. Every
  // point below that's about to write state.routeSegments*/state.loading.
  // routeSegments re-checks this against the live counter first, and bails
  // out silently (no state writes, no render()) the moment they diverge,
  // since a diverging counter means resetRouteSegments() already ran for a
  // newer selection and put state back to "not fetched" for it — this stale
  // run must never overwrite that.
  const myGeneration = routeSegmentsGeneration;
  state.loading.routeSegments = true;
  // Clear out any error left over from a previous failed attempt at this
  // same activity (retry via the "Segmente laden" button) so it doesn't
  // linger stale alongside — or instead of — this run's own outcome.
  if(myGeneration === routeSegmentsGeneration) state.routeSegmentsError = null;
  render();
  try{
    const data = await fetchActivityDetail(activity.id, state.accessToken);
    if(myGeneration !== routeSegmentsGeneration) return;
    const efforts = data.segment_efforts || []; // empty = a normal "no segments on this ride", not an error
    const segments = [];
    const effortsById = {};
    const prWatts = {};
    efforts.forEach(effort=>{
      const seg = effort.segment;
      if(!seg || !seg.id || effortsById[seg.id]) return; // skip malformed entries + (rare) repeat efforts on the same segment, keep the first
      segments.push(seg);
      effortsById[seg.id] = effort;
      // This ride's own watts for the effort — no separate PR-activity
      // lookup needed the way ensureSegmentPrWatts() needs one for the
      // starred-segments bucket, since it's right here on the effort.
      prWatts[seg.id] = effort.average_watts != null
        ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
        : null;
    });
    state.routeSegments = segments;
    state.routeSegmentEfforts = effortsById;
    state.routeSegmentPrWatts = prWatts;
    // Still fetches per-segment weather + full segment detail (for the
    // map-detail-view polyline, see mountSegmentView()) the same way the
    // starred-segments bucket does — that part of the shared pipeline is
    // unrelated to the old explore/matching system and stays as-is.
    // Uncapped (Infinity): unlike the starred-segments call site, "every
    // segment actually completed on this ride" is the entire point of this
    // feature, so truncating it defeats the purpose (see renderRouteSegmentsCard()).
    await loadSegmentExtras(state.routeSegments, segmentBucket("route"), Infinity);
    if(myGeneration !== routeSegmentsGeneration) return;
    state.routeSegmentsFetched = true;
  }catch(e){
    if(myGeneration === routeSegmentsGeneration){
      // A real failure (expired token, rate limit, network error) — leave
      // routeSegmentsFetched false so the "Segmente laden" button reappears
      // for a retry instead of falling through to an empty-list message.
      state.routeSegmentsError = e.message || "Segmente konnten nicht geladen werden. Bitte erneut versuchen.";
      state.routeSegmentsFetched = false;
    }
  }
  if(myGeneration !== routeSegmentsGeneration) return;
  state.loading.routeSegments = false;
  render();
}

// Distance-weighted tail/cross/head wind-mix for a route/activity list chip.
// The polyline is decoded and split into bearings entirely client-side
// (free); only a single Open-Meteo call is made (wind at the start point) to
// classify all of those segments against, so this stays cheap enough to run
// for every visible list item.
async function ensureListItemWindTag(key, polyline){
  if(state.routeWindCache[key] !== undefined) return;
  state.routeWindCache[key] = null;
  if(!polyline) return;
  const coords = decodePolyline(polyline);
  if(coords.length < 2) return;
  try{
    const w = await fetchWeather(coords[0][0].toFixed(4), coords[0][1].toFixed(4));
    let tailDist = 0, crossDist = 0, totalDist = 0;
    for(let i=0;i<coords.length-1;i++){
      const dist = haversineKm(coords[i], coords[i+1]);
      if(dist <= 0) continue;
      const bearing = bearingBetween(coords[i], coords[i+1]);
      const rel = windRelative(bearing, w.windDir);
      if(rel.type === "tail") tailDist += dist;
      else if(rel.type === "cross") crossDist += dist;
      totalDist += dist;
    }
    if(totalDist <= 0) return;
    const tailPct = Math.round(tailDist / totalDist * 100);
    const crossPct = Math.round(crossDist / totalDist * 100);
    const headPct = Math.max(0, 100 - tailPct - crossPct);
    state.routeWindCache[key] = { tailPct, crossPct, headPct };
    render();
  }catch(e){
    // leave cached as null (no rating shown)
  }
}

function renderListItemWindTag(key){
  const mix = state.routeWindCache[key];
  if(!mix) return null;
  return el("div", {class:"wind-mix-mini"}, [
    el("div", {class:"tag mini tail", title:"Rückenwind"}, [`${mix.tailPct}%`]),
    el("div", {class:"tag mini cross", title:"Seitenwind"}, [`${mix.crossPct}%`]),
    el("div", {class:"tag mini head", title:"Gegenwind"}, [`${mix.headPct}%`])
  ]);
}
