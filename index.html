function hamburgerIconSvg(){
  // stroke="var(--chalk)" resolves against the SVG's computed style once it's
  // in the DOM (same as any other presentation attribute), so this stays
  // sourced from the single --chalk custom property instead of a duplicated
  // hex literal.
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
    <line x1="1.5" y1="4" x2="14.5" y2="4" stroke="var(--chalk)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="1.5" y1="8" x2="14.5" y2="8" stroke="var(--chalk)" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="1.5" y1="12" x2="14.5" y2="12" stroke="var(--chalk)" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
}

// Outline (not starred) vs. filled (starred) star, inline SVG — same
// zero-icon-dependency approach as hamburgerIconSvg() above. Filled state
// uses --route, the same "active/selected state" token .dot.on and
// .nav-item.active already use elsewhere in this file, so "starred" reads as
// an on/active toggle rather than borrowing the wind-favorability or KOM-
// closeness color vocabularies.
function starIconSvg(filled){
  const path = "M12 2.3 L15.09 8.97 L22.5 9.9 L16.97 14.86 L18.62 22.1 L12 18.2 L5.38 22.1 L7.03 14.86 L1.5 9.9 L8.91 8.97 Z";
  return filled
    ? `<svg width="14" height="14" viewBox="0 0 24 24"><path d="${path}" fill="var(--route)" stroke="var(--route)" stroke-width="1.3" stroke-linejoin="round"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 24 24"><path d="${path}" fill="none" stroke="var(--chalk-dim)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

// Icon for the "als nicht relevant markieren" button (see
// renderIrrelevantButton()) — an eye that gains a diagonal slash once the
// segment is marked irrelevant, the standard "hide/dismiss" glyph. Same
// two-state-function shape as starIconSvg() above (plain markup string built
// from CSS custom properties, no hardcoded colors), deliberately a different
// silhouette AND a different "on" color (--head, not --route) so it never
// reads as a second star button at this small size.
function hideIconSvg(hidden){
  const eye = "M1.5 12 C4 7.2 8 4.8 12 4.8 C16 4.8 20 7.2 22.5 12 C20 16.8 16 19.2 12 19.2 C8 19.2 4 16.8 1.5 12 Z";
  const color = hidden ? "var(--head)" : "var(--chalk-dim)";
  const slash = hidden ? `<line x1="3" y1="4" x2="21" y2="20" stroke-linecap="round"/>` : "";
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round">
    <path d="${eye}"/>
    <circle cx="12" cy="12" r="3" fill="${hidden ? "none" : color}"/>
    ${slash}
  </svg>`;
}

// Icon for the local-favorite ("Herz") button — see renderFavoriteButton().
// Deliberately --tail (green), not --route (already the star's color) or
// --head (already the "nicht relevant" hide-button's color, see
// hideIconSvg()'s comment on why that button picked a different hue than
// the star) -- three icon-buttons can end up next to each other on a
// Segmentjäger row now, so each needs its own unambiguous color.
function heartIconSvg(filled){
  const path = "M12 21 C12 21 3.5 15.6 3.5 9.6 C3.5 6.6 5.9 4.4 8.7 4.4 C10.3 4.4 11.5 5.1 12 6.1 C12.5 5.1 13.7 4.4 15.3 4.4 C18.1 4.4 20.5 6.6 20.5 9.6 C20.5 15.6 12 21 12 21 Z";
  return filled
    ? `<svg width="14" height="14" viewBox="0 0 24 24"><path d="${path}" fill="var(--tail)" stroke="var(--tail)" stroke-width="1.3" stroke-linejoin="round"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 24 24"><path d="${path}" fill="none" stroke="var(--chalk-dim)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function renderNavDrawer(){
  const close = ()=>{ state.navOpen = false; render(); };
  const backdrop = el("div", {
    class: "nav-backdrop" + (state.navOpen ? " open" : ""),
    onclick: close
  });
  // Factored out so "Einstellungen" (below) can render with the exact same
  // active-state highlighting and click behavior as a NAV_ITEMS entry, even
  // though it no longer lives in that array.
  const navItem = (item) => el("div", {
    class: "nav-item" + (state.activePage === item.id ? " active" : ""),
    onclick: ()=>{ state.activePage = item.id; if(item.id === "changelog") markChangelogSeen(); close(); }
  }, item.id === "changelog" && hasUnseenChangelog()
      ? [item.label, el("span", {class:"dot on", style:"margin-left:6px; margin-right:0;"}, [])]
      : [item.label]
  );
  const items = NAV_ITEMS.map(navItem);
  // "Einstellungen" sits below the divider but, unlike the Strava-only
  // actions further down, must stay reachable regardless of state.connected
  // (it was previously a NAV_ITEMS entry, always rendered) — so it's built
  // via the same navItem() helper rather than folded into connectedActions.
  const einstellungenItem = navItem({id:"einstellungen", label:"Einstellungen"});
  // Bottom-of-drawer utility actions — only meaningful while connected
  // (nothing to log out of / no app permissions to review otherwise), so
  // they're appended conditionally after "Einstellungen" rather than living
  // in NAV_ITEMS (which drives page tabs, not one-shot actions).
  const connectedActions = state.connected ? [
    el("a", {
      class:"nav-action",
      href:"https://www.strava.com/settings/apps",
      target:"_blank",
      rel:"noopener noreferrer"
    }, ["Strava-Berechtigungen verwalten"]),
    el("button", {
      class:"nav-action",
      type:"button",
      disabled: state.loading.disconnect ? "disabled" : null,
      onclick: disconnectFromStrava
    }, [state.loading.disconnect ? "Trenne…" : "Von Strava abmelden"])
  ] : [];
  const drawer = el("div", {class: "nav-drawer" + (state.navOpen ? " open" : "")}, [
    el("div", {class:"nav-drawer-title"}, ["Velo", el("span",{},["Cast"])]),
    ...items,
    el("div", {class:"nav-drawer-divider"}),
    einstellungenItem,
    ...connectedActions
  ]);
  return [backdrop, drawer];
}

// Logs out of Strava: best-effort revoke on Strava's side, then unconditional
// full local session teardown. These are two independent concerns — the
// revoke can fail for reasons that have nothing to do with whether the local
// logout should proceed (see try/catch below) — but "Von Strava abmelden" is
// a single user-facing action, so both live in one function.
async function disconnectFromStrava(){
  if(state.loading.disconnect) return; // guards a double-click from firing this twice
  state.loading.disconnect = true; render();

  // Best-effort revoke: this actually revokes VeloCast's Strava access
  // (not just a local logout), which is why it's worth attempting at all.
  // The access token can already be stale/expired or the network can be
  // down though, and neither of those should leave the user stuck "logged
  // in" locally — so failures here are swallowed (just a quiet console.warn)
  // rather than blocking the local teardown that follows. Only the access
  // token is needed as a query param; no client_id/secret involved, so this
  // is called directly from the frontend without the Cloudflare Worker.
  try{
    await fetch(`https://www.strava.com/oauth/deauthorize?access_token=${state.accessToken}`, { method:"POST" });
  }catch(e){
    console.warn("Strava deauthorize call failed (logging out locally anyway):", e);
  }

  // Unconditional local teardown, regardless of whether the revoke above
  // succeeded — see loadStoredToken()/saveToken() above for why this is the
  // exact key name Strava-related tokens are stored under.
  try{ localStorage.removeItem("strava_refresh_token"); }catch(e){}
  resetConnectionState();
  state.loading.disconnect = false;
  state.navOpen = false;
  state.activePage = "route"; // land back on the connect screen, not a page that requires a connection
  render();
}

// Resets every Strava-derived field back to its pristine `let state = {...}`
// initial value (see the top of this file). Deliberately leaves untouched:
// avgSpeedKmh/routePointDistanceKm (persisted rider prefs, unrelated to the
// Strava connection), startTime (recomputed fresh on next visit anyway), and
// segmentSortBy/routeSegmentSortBy (UI prefs, not connection-derived data).
function resetConnectionState(){
  state.connected = false;
  state.athlete = null;
  state.accessToken = null;
  state.activities = [];
  // The Kettenverschleiß CARD keeps reading correctly even while
  // disconnected (getChainWearDistanceM() reads the persistent Aktivitäten
  // list cache, which deliberately survives a disconnect -- see the
  // "left alone" comment near aktivitaetenPage below, same as the
  // Reifendruck page itself staying reachable while disconnected). But the
  // reminder BANNER is a startup/session notice, same category as
  // tirePressureReminder -- without an explicit reset here it would keep
  // showing "Kette sollte bald neu gewachst werden" indefinitely across a
  // disconnect/reconnect cycle instead of being freshly recomputed on the
  // next connected session, so clear it here like every other in-memory
  // startup flag this function resets.
  state.chainWearReminder = false;
  state.selectedActivity = null;
  state.routePoints = [];
  state.fullRouteCoords = [];
  state.weatherAtRoute = [];
  state.segments = [];
  state.segmentWeather = {};
  state.segmentDetails = {};
  state.segmentPrWatts = {};
  // Fetched-from-Strava data tied to the now-invalidated access token, same
  // category as segmentDetails/routeSegments above — a leaderboard fetched
  // under one account/token has no business surviving into the next login.
  state.segmentLeaderboards = {};
  state.selectedSegmentId = null;
  state.selectedSegmentSource = null;
  state.routeSegments = [];
  state.routeSegmentWeather = {};
  state.routeSegmentDetails = {};
  state.routeSegmentPrWatts = {};
  state.routeSegmentEfforts = {};
  state.routeSegmentsFetched = false;
  state.routeSegmentsError = null;
  state.stravaRoutes = [];
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.windFieldEnabled = false;
  state.segmentStars = {};
  state.routeWindCache = {};
  // Same "tied to the now-invalidated token" category as everything else
  // reset above — this does NOT touch the on-disk activity/skip caches
  // (velocast_activity_cache/velocast_activity_skip_cache) themselves, only
  // the in-memory view of them: those caches are keyed by Strava activity
  // id, which is stable across reconnects (even under a different token),
  // so clearing them on every logout would just force a full expensive
  // re-fetch of everything on the next login for no benefit.
  state.profilPage.loading = false;
  state.profilPage.loaded = false;
  state.profilPage.error = null;
  state.profilPage.progress = null;
  state.profilPage.athleteDetail = null;
  state.profilPage.zonesRaw = null;
  state.profilPage.gear = [];
  state.profilPage.results = [];
  state.profilPage.stats = null;
  state.profilPage.ftpAnalysis = null;
  state.profilPage.riderProfile = null;
  state.profilPage.trainingLoad = null;
  state.profilPage.zoneDist = null;
  state.profilPage.efficiency = null;
  state.profilPage.climbing = null;
  state.profilPage.durability = null;
  state.profilPage.weak = null;
  // Same "tied to the now-invalidated token, not to the on-disk cache"
  // split as profilPage above — velocast_activity_list_cache is left alone,
  // only the in-memory view resets.
  state.aktivitaetenPage.loading = false;
  state.aktivitaetenPage.loaded = false;
  state.aktivitaetenPage.error = null;
  state.aktivitaetenPage.items = [];
  state.aktivitaetenPage.page = 1;
  state.aktivitaetenPage.hasMore = true;
  state.aktivitaetenPage.selectedId = null;
  state.aktivitaetenPage.detail = { id:null, loading:false, error:null, notAvailable:false, stream:null, metrics:null };
  // Trainer page: mostly transient/session UI state, reset here.
  // `goal`/`exportDistanceMode` are rider preferences, not tied to the
  // connection, so they survive a reconnect. `hrProfile` IS token-derived
  // (an LTHR estimate built from this account's activity streams — see
  // loadHrLthrEstimate()) and must be reset too: without this, a
  // disconnect + reconnect as a different Strava account would keep the
  // previous account's LTHR estimate alive in state and feeding rp.lthr.
  state.trainerPage.selectedClassKey = null;
  state.trainerPage.selectedTestDurationSec = null;
  state.trainerPage.workoutPreviewOpen = false;
  state.trainerPage.routeError = null;
  state.trainerPage.loadingRoute = false;
  state.trainerPage.hammerheadResult = null;
  state.trainerPage.evalActivityId = null;
  state.trainerPage.evalLoading = false;
  state.trainerPage.evalError = null;
  state.trainerPage.evalResult = null;
  state.trainerPage.evalTestAchievedWatts = null;
  state.trainerPage.lastWorkout = null;
  state.trainerPage.hrProfile = { loading:false, loaded:false, error:null, estimate:null, source:null };
  // The in-memory reset above isn't enough on its own: syncCachedHrLthrEstimate()
  // reads velocast_hr_profile_cache directly and would immediately repopulate
  // hrProfile.estimate from the previous account's cached rides otherwise.
  clearHrProfileCache();
  clearHrProfileSkipCache();
  // Same cross-account leak risk as hrProfile above, for the blended
  // CTL/ATL/ACWR load series: without clearing the cache + fetched-at
  // stamp too, a reconnect as a different account would keep serving the
  // previous account's training load for up to BLENDED_LOAD_REFRESH_MS.
  state.trainerPage.blendedLoad = { loading:false, loaded:false, error:null, activities:null, fetchedAt:0 };
  clearBlendedLoadCache();
  clearBlendedLoadFetchedAt();
  // A fetch failure from while the user was still connected (e.g.
  // loadActivitiesAndSegments()'s catch) would otherwise survive logout and
  // render as a stale error banner on the very next-shown connect screen.
  state.error = null;
}

// ---------- render ----------
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderBrand());
  renderNavDrawer().forEach(n => app.appendChild(n));
  const tirePressureBanner = renderTirePressureBanner();
  if(tirePressureBanner) app.appendChild(tirePressureBanner);
  const chainWearBanner = renderChainWearBanner();
  if(chainWearBanner) app.appendChild(chainWearBanner);

  if(state.activePage === "segments"){
    app.appendChild(renderSegmentsPage());
  } else if(state.activePage === "segmentjaeger"){
    app.appendChild(renderSegmentjaegerPage());
  } else if(state.activePage === "profil"){
    app.appendChild(renderProfilPage());
  } else if(state.activePage === "aktivitaeten"){
    app.appendChild(renderAktivitaetenPage());
  } else if(state.activePage === "trainer"){
    app.appendChild(renderTrainerPage());
  } else if(state.activePage === "einstellungen"){
    app.appendChild(renderEinstellungenPage());
  } else if(state.activePage === "reifendruck"){
    app.appendChild(renderReifendruckPage());
  } else if(state.activePage === "changelog"){
    app.appendChild(renderChangelogPage());
  } else if(!state.connected && !state.fullRouteCoords.length){
    // Without any login there's no activity list or segments — but a loaded
    // GPX route still needs the route card + map, not the plain connect
    // screen. Only applies to the "route" page; "Meine Segmente" has its own
    // always-visible connect prompt inside renderSegmentsPage().
    app.appendChild(renderConnectCard());
  } else if(state.connected && state.needsManualLoad.activities){
    // autoLoadActivities is off — connected, but no activity list fetched
    // yet, and this page has nothing to show without one. Shown instead of
    // the normal route card until the user clicks "Daten laden" (see
    // renderManualLoadCard()/loadActivitiesAndSegments()). The other two
    // categories (segments/training) don't gate this page — see their own
    // pages' load-prompt cards instead (renderSegmentsCard(),
    // renderProfilLoadPromptCard()).
    app.appendChild(renderManualLoadCard());
  } else {
    app.appendChild(renderRouteCard());
    const infoTabsCard = renderRouteInfoTabsCard();
    if(infoTabsCard) app.appendChild(infoTabsCard);
    const routeSegmentsCard = renderRouteSegmentsCard();
    if(routeSegmentsCard) app.appendChild(routeSegmentsCard);
  }

  app.appendChild(renderFootnote());
  requestAnimationFrame(()=>{
    // Called unconditionally (not just on the route page) so navigating away
    // from a page that had the Leaflet map mounted still tears it down
    // properly — mountRouteMap() already no-ops/cleans up when #route-map
    // isn't present in the freshly rebuilt tree.
    mountRouteMap();
    // Same "no-op unless the canvas exists" contract as mountRouteMap() above
    // — mountProfilCharts() checks for each #<id>Chart canvas itself, so
    // this is safe to call on every render regardless of activePage.
    mountProfilCharts();
    // Same unconditional-no-op-unless-present contract, for the Aktivitäten
    // detail view's single chart canvas.
    mountAktivitaetenChart();
    // Same contract again, for the Trainer tab's single workout-preview chart.
    mountTrainerChart();
    // Mac Safari (user-reported) can leave a persistent <select>/<input> that
    // was just detached+reattached by the app.innerHTML="" rebuild above in a
    // stale native-rendering state — e.g. routeSegmentSortSelect showing an
    // incomplete/wrong-looking dropdown even though its .options/.value are
    // already objectively correct in the DOM at this point. Not reproducible
    // in Chromium, so this is presumed to be a WebKit quirk rather than a
    // data/logic bug. The only fix found so far was incidental: navigating
    // away and back happens to force a full Leaflet teardown/rebuild, which
    // reflows the whole page and seems to clear the stale state as a side
    // effect. This forces that same kind of reflow directly, on every
    // render, as a general (but unverified-on-real-Safari) attempt to fix it
    // without depending on unrelated map churn — needs live Safari
    // confirmation from the user before trusting it actually resolves this.
    document.querySelectorAll('#app select, #app input').forEach(elx => void elx.offsetHeight);
  });
}

function renderBrand(){
  return el("div", {class:"brand"}, [
    el("div", {class:"brand-left"}, [
      el("button", {
        class:"hamburger-btn", type:"button", "aria-label":"Menü öffnen",
        onclick: ()=>{ state.navOpen = true; render(); }
      }, [el("span", {html: hamburgerIconSvg()})]),
      el("h1", {}, ["Velo", el("span",{},["Cast"])])
    ]),
    el("div", {class:"status"}, [
      el("span", {class:"dot" + (state.connected?" on":"")}, []),
      state.connected ? "verbunden" : "nicht verbunden"
    ])
  ]);
}

function buildAuthUrl(){
  // Redirect back to this exact page — works because this page now lives at a
  // real, fixed URL (GitHub Pages) instead of localhost.
  const redirectUri = window.location.origin + window.location.pathname;
  // profile:write added for the segment star/un-star button (see
  // starSegment()) — Strava's scope for starring/unstarring segments and
  // other profile-level write actions. This is an ADDITIVE change to the
  // existing comma-separated scope list, not a replacement: every existing
  // stored refresh token was issued under the old, narrower scope, so it
  // does NOT carry profile:write — every user (including during testing)
  // must reconnect/re-authorize once through this URL before the star
  // button will work; a stale token hitting the starred endpoint fails with
  // 401/403, which starSegment()'s caller (toggleSegmentStar()) detects and
  // surfaces as a "please reconnect" message rather than a generic error.
  return `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&approval_prompt=auto&scope=read,activity:read_all,profile:read_all,profile:write`;
}

// File-picker button for GPX import, shared by the connect screen and the
// route card. Native file input keeps this a single tap on mobile.
function renderGpxUploadRow(){
  const fileInput = el("input", {
    type:"file", accept:".gpx", style:"display:none;",
    onchange:(e)=>{
      const file = e.target.files[0];
      if(file) loadGpxFile(file);
    }
  });
  const label = (state.selectedActivity && state.selectedActivity.isGpx)
    ? `GPX: ${state.selectedActivity.name}`
    : "GPX-Datei hochladen";
  const wrap = el("div", {style:"margin-bottom:14px;"}, [
    fileInput,
    el("button", {class:"btn secondary", style:"font-size:12px; padding:8px 14px;", onclick:()=>fileInput.click()}, [label])
  ]);
  if(state.error) wrap.appendChild(el("div", {class:"error", style:"margin-top:8px;"}, [state.error]));
  return wrap;
}

function pageTitleCard(title){
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, [title]));
  return card;
}

function renderStravaConnectCard(title, description){
  const card = pageTitleCard(title);
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px;"}, [description]));
  const btn = el("button", {class:"btn", style:"width:100%;", onclick: ()=>{ window.location.href = buildAuthUrl(); }}, [state.loading.connect ? "Verbinde…" : "Mit Strava einloggen →"]);
  if(state.loading.connect) btn.disabled = true;
  card.appendChild(btn);
  // Startup-sequence progress bar (see startupProgressBegin()/
  // renderStartupProgressBar()) -- null/no-op everywhere this card is shown
  // outside of an actual connect/revisit/manual-load sequence (segments/
  // profil/aktivitaeten/trainer's own "please connect" prompts included), but
  // visible here from the very first "Verbindung wird hergestellt…"/"Token
  // wird aktualisiert…" step, not just once loadActivitiesAndSegments()'s own
  // card takes over — this card (via renderConnectCard()) is what's actually
  // on screen during that first step, since state.connected is still false.
  const startupBar = renderStartupProgressBar();
  if(startupBar) card.appendChild(startupBar);
  return card;
}

function renderConnectCard(){
  const card = renderStravaConnectCard("Verbinden", "Autorisiere den Zugriff auf deine Aktivitäten/Routen. Du wirst weitergeleitet und kommst danach automatisch hierher zurück.");
  // renderStravaConnectCard()'s button has no bottom margin (nothing follows
  // it at its other call sites) -- restore it here since the button is an
  // inline-block (.btn has no display override), so its margin never
  // collapses with the "oder..." div's own margin-top below. Targeted via
  // querySelector rather than card.lastChild since the startup progress bar
  // (when a sequence is running) is now the actual last child, not the button.
  const connectBtn = card.querySelector(".btn");
  if(connectBtn) connectBtn.style.marginBottom = "8px";
  card.appendChild(el("div", {class:"muted", style:"margin:16px 0 8px; font-size:12px;"}, ["oder, ganz ohne Account:"]));
  card.appendChild(renderGpxUploadRow());
  return card;
}

// ---------- startup progress ----------
// Simple step counter for the connect/revisit/manual-"Daten laden" startup
// sequence (see renderStartupProgressBar()) -- token refresh -> activities
// fetch -> first activity's route/weather -> starred segments+extras, shared
// across all three call sites (connectWithCode(), init()'s stored-token
// branch, and the manual-load button) so the same bar appears wherever the
// chain runs. Left null/undefined outside of a startup sequence so it never
// lingers once the chain completes (see startupProgressEnd()). Deliberately
// NOT used for the app's other ~11 pre-existing .loading flags -- this is
// startup-sequence-only infrastructure, not a general loading indicator.
function startupProgressBegin(total){
  state.startupProgress = { step: 0, total, label: "" };
}
function startupProgressStep(label){
  if(!state.startupProgress) return;
  state.startupProgress.step++;
  state.startupProgress.label = label;
}
function startupProgressEnd(){
  state.startupProgress = null;
}

// Renders "Schritt X von N: <label>" + the visual bar, or null if no startup
// sequence is running. Callers place this wherever the connect/revisit/
// manual-load flow's own loading text already appeared.
function renderStartupProgressBar(){
  const p = state.startupProgress;
  if(!p) return null;
  const pct = p.total > 0 ? Math.round((p.step / p.total) * 100) : 0;
  return el("div", {class:"startup-progress"}, [
    el("div", {class:"loading"}, [`Schritt ${p.step} von ${p.total}: ${p.label}`]),
    el("div", {class:"track"}, [
      el("div", {class:"fill", style:`width:${pct}%;`})
    ])
  ]);
}

async function connectWithCode(code){
  state.error = null;
  state.loading.connect = true;
  startupProgressBegin(1 + autoLoadStepCount());
  startupProgressStep("Verbindung wird hergestellt…");
  render();
  try{
    const tokenData = await exchangeCode(code);
    state.accessToken = tokenData.access_token;
    state.athlete = tokenData.athlete;
    await saveToken(tokenData.refresh_token);
    state.connected = true;
    await loadActivitiesAndSegments();
  }catch(e){
    state.error = e.message || "Verbindung fehlgeschlagen.";
  }
  state.loading.connect = false;
  startupProgressEnd();
  render();
}

// How many progress-bar steps loadActivitiesAndSegments() will actually run,
// given the three per-category autoLoad* flags (see state) — used to size
// the shared startup-progress bar before it starts (connectWithCode(), the
// stored-token revisit branch in init()) since the step count now depends on
// which categories are enabled instead of always being the same fixed
// number. "Aktivitäten" is worth 2 steps (activity list, then the first
// activity's route/weather); segments and training are 1 step each.
function autoLoadStepCount(){
  return (state.autoLoadActivities ? 2 : 0) + (state.autoLoadSegments ? 1 : 0) + (state.autoLoadTraining ? 1 : 0);
}

// The three startup-sequence categories, each independently gated by its own
// autoLoad* setting (see state) and independently triggerable by hand: this
// function (the shared "everything enabled" chain), the manual "Daten
// laden" button (activities — see renderManualLoadCard()), and the segments
// page's own load-prompt card (see renderSegmentsCard()) call these
// directly, unconditionally, regardless of the autoLoad flag — the flag only
// decides whether loadActivitiesAndSegments() below calls them
// automatically, not whether they CAN run. startupProgressStep() is a no-op
// without an active state.startupProgress, so a standalone manual trigger
// (no surrounding chain) just relies on the page's own state.loading.* flag
// instead, same as before this split existed.
async function loadActivitiesStep(){
  state.loading.activities = true;
  startupProgressStep("Lade Aktivitäten…"); render();
  try{
    state.activities = await fetchActivities(state.accessToken);
    // Kettenverschleiß no longer sources its distance from state.activities
    // (that's fetchActivities()'s 8-item rolling window -- see
    // getChainWearDistanceM()'s comment), so this fetch resolving doesn't by
    // itself change the reminder's answer. Still recomputed here (harmless,
    // cheap) so a reload that also happens to pick up fresh
    // Aktivitäten-cache entries elsewhere in this same startup sequence
    // isn't stuck on init()'s earlier reading.
    state.chainWearReminder = computeChainWearReminder(state.chainWear, getChainWearDistanceM(state.chainWear.resetAtMs));
    startupProgressStep("Lade Route & Wetter…"); render();
    if(state.activities.length){
      await selectActivity(state.activities[0]);
    }
  }catch(e){ state.error = e.message; }
  state.loading.activities = false;
  state.needsManualLoad.activities = false;
}
async function loadSegmentsStep(){
  state.loading.segments = true;
  startupProgressStep("Lade Segmente & Wind…"); render();
  try{
    // One-time, no-op after the first successful run -- see
    // migrateStarredSegmentsToLocalFavorites()'s comment for why "Meine
    // Segmente" moved off Stravas starred list onto this local one.
    await migrateStarredSegmentsToLocalFavorites(state.accessToken);
    state.segments = Object.values(loadLocalFavoriteSegments());
    await loadSegmentExtras(state.segments, segmentBucket("starred"), Infinity);
  }catch(e){ state.error = e.message; }
  state.loading.segments = false;
  state.needsManualLoad.segments = false;
}
// The Profil training-data step was missing from the automatic chain
// originally, even though "alle Daten (Trainingsdaten usw)" is literally
// what autoLoadOnVisit (this setting's pre-granular predecessor) was
// requested for — without it, riderProfile.mmpCurve never got built
// automatically, which silently starved the "Potential"-Chip on Meine
// Segmente (buildPotentialChip() just omits the chip when there's no MMP
// curve, no visible error) unless the user happened to separately open
// Profil and click "Trainingsdaten laden" in the same session.
// loadProfilData() never throws (it catches its own errors into pp.error
// for the Profil page's existing load-prompt/error cards to show) and
// reuses pp.athleteDetail/the on-disk activity cache when already
// populated, so repeat calls (e.g. via "Neu laden") stay cheap — no separate
// needsManualLoad flag needed for this category, pp.loaded already serves
// that purpose for renderProfilLoadPromptCard().
async function loadTrainingStep(){
  startupProgressStep("Lade Trainingsdaten…"); render();
  await loadProfilData(state.accessToken);
}

// Runs whichever of the three startup categories are enabled — used by
// connectWithCode() and init()'s stored-token revisit branch (the only two
// callers: both right after a fresh connect/revisit, when needsManualLoad is
// still at its default all-false). `ownsProgress` tracks whether THIS call
// started the progress sequence itself versus being called after a caller
// already ran its own token-refresh step — only the call that started the
// sequence is responsible for ending it, so a nested call here never cuts
// off a step the caller still wants to show. A disabled category is marked
// as needing a manual load instead (see the per-category load-prompt cards)
// rather than being silently skipped.
//
// Deliberately NOT reused by the manual "Daten laden" button or the
// footnote's "Neu laden" link (see renderManualLoadCard()/reloadAllData()
// below) — both need to force-load a category regardless of its autoLoad*
// flag (that's the whole point of a MANUAL load), whereas this function
// respects the flags by design. Reusing it there would silently no-op a
// disabled category's manual load button, or worse, re-flip an
// already-manually-loaded category's needsManualLoad back to true.
async function loadActivitiesAndSegments(){
  const ownsProgress = !state.startupProgress;
  if(ownsProgress) startupProgressBegin(autoLoadStepCount());

  if(state.autoLoadActivities) await loadActivitiesStep();
  else state.needsManualLoad.activities = true;

  if(state.autoLoadSegments) await loadSegmentsStep();
  else state.needsManualLoad.segments = true;

  if(state.autoLoadTraining) await loadTrainingStep();

  if(ownsProgress) startupProgressEnd();
  render();
}

// Unconditionally re-runs all three categories, ignoring the autoLoad*
// flags entirely — used by the footnote's "Neu laden" link (see
// renderFootnote()), a manual "refresh everything now" action that must
// work the same way regardless of what's set to auto-load on connect.
async function reloadAllData(){
  const ownsProgress = !state.startupProgress;
  if(ownsProgress) startupProgressBegin(4);
  await loadActivitiesStep();
  await loadSegmentsStep();
  await loadTrainingStep();
  if(ownsProgress) startupProgressEnd();
  render();
}

// Shown in place of the normal route content when connected but
// state.needsManualLoad.activities is set (autoLoadActivities is off — see
// connectWithCode()/init()) — the route page has nothing to show without an
// activity list, unlike the segments/Profil pages, which have their own
// load-prompt cards and don't need this global gate. Clicking "Daten laden"
// calls loadActivitiesStep() directly (NOT loadActivitiesAndSegments() —
// see its comment above for why), which is sufficient on its own: any OTHER
// enabled category was already loaded automatically during connect, since
// this card only gates on needsManualLoad.activities.
function renderManualLoadCard(){
  const card = pageTitleCard("Verbunden");
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px;"}, [
    "Automatisches Laden von Aktivitäten & Route ist deaktiviert (siehe Einstellungen). Lade sie jetzt manuell."
  ]));
  const loading = state.loading.activities;
  const btn = el("button", {class:"btn", style:"width:100%;", onclick: ()=>{
    loadActivitiesStep().then(render);
  }}, [loading ? "Lade…" : "Daten laden"]);
  if(loading) btn.disabled = true;
  card.appendChild(btn);
  const bar = renderStartupProgressBar();
  if(bar) card.appendChild(bar);
  return card;
}

// Bundles a segment source's parallel state fields (list + weather + details
// + PR-watts [+ ride-effort stats for the "route" bucket]) into one object,
// so the segment-rendering pipeline (renderSegmentRow, computeSegmentStatChips,
// ensureSegmentPrWatts, etc.) can operate identically on either the user's
// starred segments or the ride-completed segments without duplicating ~150
// lines of rendering logic per source. "starred" == Markierte Segmente /
// state.segments (all-time PR data); "route" == Abgeschlossene Segmente /
// state.routeSegments (this-ride effort data, see `efforts`).
function segmentBucket(source){
  return source === "route"
    ? { source, list: state.routeSegments, weather: state.routeSegmentWeather, details: state.routeSegmentDetails, prWatts: state.routeSegmentPrWatts, efforts: state.routeSegmentEfforts }
    : { source: "starred", list: state.segments, weather: state.segmentWeather, details: state.segmentDetails, prWatts: state.segmentPrWatts, efforts: null };
}

// True while the map should be showing a single segment's detail view
// (instead of the full route / the plain segment list) — i.e. a segment is
// selected AND it belongs to whichever bucket is relevant on the currently
// active page (a starred segment selected on "Meine Segmente" stays shown
// there even if you'd left activePage on "route" some other way; a
// route-explore segment only makes sense inside the route page). Centralized
// here so renderRouteCard(), renderSegmentsPage(), currentRouteKey() and
// mountRouteMap() can't disagree about it.
function isShowingSegmentDetail(){
  if(!state.selectedSegmentId) return false;
  if(state.activePage === "segments") return state.selectedSegmentSource === "starred";
  if(state.activePage === "route") return state.selectedSegmentSource === "route";
  return false;
}

// Clears the ride-completed-segments bucket — called wherever the underlying
// selection changes (new activity/route/GPX selected), same set of call
// sites as the existing elevationProfile/windFieldPoints resets below, since
// a previous ride's completed-segments list has no meaning for a newly
// selected activity/route/GPX. Also drops the current selection if it
// pointed at a ride segment that's about to be wiped out from under it.
// Deliberately does NOT call ensureRideSegments() — this only clears the
// cache back to the "Segmente laden" button state; fetching a fresh
// activity's segments is exclusively user-triggered (see
// renderRouteSegmentsCard()), never automatic.
function resetRouteSegments(){
  // Bumps the generation counter so an ensureRideSegments() call still in
  // flight for the PREVIOUS selection (mid-await when this reset fires)
  // recognizes on its next state-writing step that it's stale and bails out
  // silently instead of writing its (now-meaningless) results/errors on top
  // of whatever selection is current now. See the comment on
  // routeSegmentsGeneration for the full mechanism.
  routeSegmentsGeneration++;
  state.routeSegments = [];
  state.routeSegmentWeather = {};
  state.routeSegmentDetails = {};
  state.routeSegmentPrWatts = {};
  state.routeSegmentEfforts = {};
  state.routeSegmentsFetched = false;
  state.routeSegmentsError = null;
  state.loading.routeSegments = false;
  if(state.selectedSegmentSource === "route"){
    state.selectedSegmentId = null;
    state.selectedSegmentSource = null;
  }
}

async function selectActivity(activity){
  state.selectedActivity = activity;
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  state.routeReversed = false;
  resetRouteSegments();
  render();
  if(!activity.map || !activity.map.summary_polyline){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  const coords = decodePolyline(activity.map.summary_polyline);
  state.fullRouteCoords = coords;
  const cumDist = buildCumulativeDistances(coords);
  state.routePoints = pickRoutePoints(coords, cumDist, state.routePointDistanceKm);
  render();
  // Deliberately NOT calling ensureRideSegments() here — explicitly
  // user-triggered only (see renderRouteSegmentsCard()'s "Segmente laden"
  // button), never automatic on activity selection.
  await loadRouteWeather();
}

// The coordinate order actually driving routePoints/the map line: normally
// just fullRouteCoords, but reversed in place when routeReversed is on
// (preview toggle, see toggleRouteReversed()) — fullRouteCoords itself is
// never mutated, so switching back is always exact.
function activeRouteCoords(){
  return state.routeReversed ? state.fullRouteCoords.slice().reverse() : state.fullRouteCoords;
}

// Mirror of activeRouteCoords() for state.elevationProfile: reverses the
// elevation samples and mirrors each distance-from-start around the total
// route length, so the Höhenprofil chart and the Anstiege tab (climb
// detection runs directly on this) both reflect the reversed direction.
// elevationProfile itself is never mutated, same non-destructive approach
// as activeRouteCoords().
function activeElevationProfile(){
  const profile = state.elevationProfile;
  if(!profile || !state.routeReversed || !profile.distances.length) return profile;
  const { distances, elevations } = profile;
  const span = distances[0] + distances[distances.length - 1];
  return {
    distances: distances.slice().reverse().map(d => span - d),
    elevations: elevations.slice().reverse()
  };
}

// Re-samples routePoints from the already-loaded fullRouteCoords — used
// whenever Punktabstand or the reversed-direction toggle changes, and after
// loading a GPX file or a saved Strava route, since the full coordinate list
// doesn't need to change, just how it's sliced into wind-sample points.
// Deliberately does NOT touch elevationProfile/windFieldPoints/routeSegments
// themselves — none of that raw data is direction-dependent, it just needs
// to be read through activeElevationProfile() (see there) at render time.
function recomputeRoutePoints(){
  if(!state.fullRouteCoords.length) return;
  const coords = activeRouteCoords();
  const cumDist = buildCumulativeDistances(coords);
  state.routePoints = pickRoutePoints(coords, cumDist, state.routePointDistanceKm);
  render();
  loadRouteWeather();
}

// Flips the wind-preview direction: recomputes routePoints (bearing +
// distance-from-start both naturally flip once the underlying coord order
// is reversed) and re-fetches weather, since arrival time per point shifts
// with the new distance-from-start. Preview-only — never mutates
// fullRouteCoords, so this is freely reversible and doesn't affect anything
// else that reads the loaded route. climbIndex resets since climb
// boundaries/order shift with direction (same as a fresh route load).
function toggleRouteReversed(){
  state.routeReversed = !state.routeReversed;
  state.climbIndex = 0;
  recomputeRoutePoints();
}

function selectRouteSourceTab(tab){
  state.routeSourceTab = tab;
  render();
  if(tab === "routes") ensureStravaRoutesLoaded();
}

async function ensureStravaRoutesLoaded(){
  if(state.stravaRoutes.length || state.loading.routes) return;
  state.loading.routes = true; render();
  try{
    state.stravaRoutes = await fetchStravaRoutes(state.accessToken);
  }catch(e){
    state.error = e.message;
  }
  state.loading.routes = false;
  render();
}

async function selectStravaRoute(route){
  state.selectedActivity = { id: "route-" + route.id, name: route.name, isRoute: true };
  state.elevationProfile = null;
  state.windFieldPoints = null;
  state.climbIndex = 0;
  state.routeReversed = false;
  resetRouteSegments();
  render();
  const poly = route.map && (route.map.polyline || route.map.summary_polyline);
  if(!poly){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  state.fullRouteCoords = decodePolyline(poly);
  recomputeRoutePoints();
  // Deliberately NOT calling ensureRideSegments() here, see selectActivity()
  // — also a no-op anyway, since this is a planned route (isRoute:true) with
  // no completed segments to fetch (see ensureRideSegments()'s own guard).
}

// ---------- GPX import ----------
// Lets the wind/map pipeline run on any route, not just past Strava
// activities — works without being connected to Strava at all.
function parseGpxTrack(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if(doc.querySelector("parsererror")) return null;
  const points = [...doc.querySelectorAll("trkpt, rtept")];
  const coords = [], eles = [];
  points.forEach(p=>{
    const lat = parseFloat(p.getAttribute("lat"));
    const lon = parseFloat(p.getAttribute("lon"));
    if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    coords.push([lat, lon]);
    const eleEl = p.querySelector("ele");
    const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
    eles.push(Number.isFinite(ele) ? ele : null);
  });
  return coords.length >= 2 ? { coords, eles } : null;
}

async function loadGpxFile(file){
  state.error = null;
  let track = null;
  try{
    track = parseGpxTrack(await file.text());
  }catch(e){
    track = null;
  }
  if(!track){
    state.error = "GPX-Datei konnte nicht gelesen werden.";
    render();
    return;
  }
  state.selectedActivity = { name: file.name.replace(/\.gpx$/i, ""), isGpx: true };
  state.windFieldPoints = null;
  state.climbIndex = 0;
  state.routeReversed = false;
  resetRouteSegments();
  state.fullRouteCoords = track.coords;
  state.elevationProfile = track.eles.every(e => e != null)
    ? { distances: buildCumulativeDistances(track.coords), elevations: track.eles }
    : { distances: [], elevations: [] };
  recomputeRoutePoints();
  // Deliberately NOT calling ensureRideSegments() here, see selectActivity()
  // — also a no-op anyway, since a GPX file (isGpx:true) has no completed
  // segments to fetch (see ensureRideSegments()'s own guard). The card shows
  // the explanatory message instead of the button in this case either way —
  // see renderRouteSegmentsCard().
}

async function loadRouteWeather(){
  if(!state.routePoints.length) return;
  state.loading.weather = true; render();
  const startDate = new Date(state.startTime);
  const weatherResults = [];
  for(const p of state.routePoints){
    const arrival = estimateArrival(startDate, p.distanceKm, state.avgSpeedKmh);
    p.arrivalTime = arrival;
    try{
      const w = await fetchWeather(p.lat.toFixed(4), p.lon.toFixed(4), arrival);
      weatherResults.push(w);
    }catch(e){
      weatherResults.push(null);
    }
  }
  state.weatherAtRoute = weatherResults;
  state.loading.weather = false;
  render();
}

// Fetches per-segment weather + Strava detail (PR, KOM/QOM, elevation,
// effort count) + PR watts (for the "Potential"-Chip, see buildPotentialChip())
// for a list of segments into the given bucket's weather/details/prWatts
// maps. Shared by both segment sources (see segmentBucket()) — the
// starred-segments flow calls this from loadActivitiesAndSegments(), the
// ride-completed-segments flow from ensureRideSegments() below. For the
// ride-completed bucket the `details` fetched here still matters even
// though computeSegmentStatChips() prefers the richer per-ride effort data
// for its stat chips — mountSegmentView() needs detail.map.polyline to draw
// the segment's own path when it's clicked into the map detail view; its
// `prWatts` is already filled in by ensureRideSegments() before this runs,
// so fetchSegmentPrWatts() below is a no-op there (no extra fetch).
// `limit` caps how many of `list`'s segments get fetched, if given — both
// call sites now pass Infinity (starred and ride-completed alike), since
// capping here silently drops segments past the cap, which is exactly the
// bug this parameter used to cause for "Meine Segmente" when a starred list
// grew past 12.
// Weather/detail are fetched in parallel per segment (prWatts needs detail's
// pr_activity_id first, so it stays a third sequential step); render() is
// called once after the whole list instead of once per segment — a
// re-render per segment (up to 30 on a starred list, each rebuilding the
// full DOM + remounting the route map) was the cause of visible jank right
// after connecting.
async function loadSegmentExtras(list, bucket, limit){
  if(limit === undefined) limit = Infinity;
  for(const seg of list.slice(0, limit)){
    const weatherPromise = seg.start_latlng
      ? fetchWeather(seg.start_latlng[0].toFixed(4), seg.start_latlng[1].toFixed(4)).catch(()=>null)
      : Promise.resolve(undefined);
    const detailPromise = fetchSegmentDetail(seg.id, state.accessToken).catch(()=>null);
    const [weather, detail] = await Promise.all([weatherPromise, detailPromise]);
    if(seg.start_latlng) bucket.weather[seg.id] = weather;
    bucket.details[seg.id] = detail;
    await fetchSegmentPrWatts(seg, bucket);
  }
  render();
}

// PR power isn't in the segment summary — it takes a whole extra activity
// fetch per segment to find it. loadSegmentExtras() above now fetches this
// eagerly (in its own per-segment iteration, after `details` is set) for
// every visible segment; this stays a separate function purely for
// selectSegment()'s on-demand retry path — after a real Strava disconnect/
// reconnect or a page load that skipped loadSegmentExtras, prWatts[seg.id]
// may still be undefined when a segment is clicked, and that click needs to
// trigger its own render() once the fetch resolves (loadSegmentExtras
// batches its render() for the whole list instead).
async function fetchSegmentPrWatts(seg, bucket){
  if(bucket.prWatts[seg.id] !== undefined) return;
  const detail = bucket.details[seg.id];
  const prActivityId = detail && detail.athlete_segment_stats && detail.athlete_segment_stats.pr_activity_id;
  if(!prActivityId){ bucket.prWatts[seg.id] = null; return; }
  try{
    const activity = await fetchActivityDetail(prActivityId, state.accessToken);
    const effort = (activity.segment_efforts || []).find(e => e.segment && e.segment.id === seg.id);
    bucket.prWatts[seg.id] = (effort && effort.average_watts != null)
      ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
      : null;
  }catch(e){
    bucket.prWatts[seg.id] = null;
  }
}

async function ensureSegmentPrWatts(seg, bucket){
  if(bucket.prWatts[seg.id] !== undefined) return;
  await fetchSegmentPrWatts(seg, bucket);
  render();
}

// Segment Top-10 leaderboard — lazy/manual only, same "extra Strava API
// call, don't burn it eagerly" discipline as ensureRideSegments()'s
// "Segmente laden" button (see renderSegmentLeaderboard()'s "Top 10
// anzeigen" button, the only call site). Id-keyed rather than bucket-keyed
// (see state.segmentLeaderboards) since the leaderboard is the same real
// Strava data regardless of whether the segment is shown via the "starred"
// or "route" bucket.
async function ensureSegmentLeaderboard(seg){
  const existing = state.segmentLeaderboards[seg.id];
  // Already loaded or a fetch is already in flight — do nothing. Note this
  // deliberately does NOT skip on a stored `error`, so calling this again
  // after a failure (the render function's "Erneut versuchen" button) is a
  // real retry rather than a permanent stuck state.
  if(existing && (existing.loading || existing.entries)) return;
  state.segmentLeaderboards[seg.id] = { loading: true, entries: null, error: null };
  render();
  try{
    const data = await fetchSegmentLeaderboard(seg.id, state.accessToken);
    state.segmentLeaderboards[seg.id] = { loading: false, entries: data.entries || [], error: null };
  }catch(e){
    // 401/403 most likely means Strava hasn't granted this app leaderboard
    // access at all (see fetchSegmentLeaderboard()'s comment) rather than
    // anything the user can fix by retrying, so it gets its own more honest
    // message instead of the generic one.
    const restricted = e.status === 401 || e.status === 403;
    state.segmentLeaderboards[seg.id] = {
      loading: false, entries: null,
      error: restricted
        ? "Bestenliste konnte nicht geladen werden (evtl. von Strava für diese App eingeschränkt)."
        : "Bestenliste konnte nicht geladen werden. Bitte erneut versuchen."
    };
  }
  render();
}

// ---------- "Abgeschlossene Segmente": segments actually ridden on the
// currently selected Strava ACTIVITY, read from that activity's own
// segment_efforts ----------
// This used to guess at nearby segments geographically (chunking the route
// into bounding boxes, calling Strava's public segments/explore per chunk,
// then proximity-matching each candidate's polyline against the route). That
// answered the wrong question: it surfaced segments merely near the path,
// not segments the athlete actually rode. Strava's activity detail endpoint
// (fetchActivityDetail(), already used elsewhere for PR-watts lookups)
// already returns exactly the right data in `segment_efforts` — one entry
// per segment the rider covered on that specific ride, complete with
// ride-specific stats (elapsed_time, average_watts, pr_rank, kom_rank) — so
// no exploration or matching is needed at all, just one direct fetch.
// This only makes sense for a genuine past ride, not a planned/saved route
// or an uploaded GPX file — nothing has been "completed" on those.

// Bumped by resetRouteSegments() every time the underlying selection changes
// (new activity/route/GPX). ensureRideSegments() captures this value at the
// start of its run; if it no longer matches by the time its one await
// resolves, a reset happened mid-flight and the in-progress fetch is for a
// selection that's no longer current — see ensureRideSegments() for how each
// state-writing step checks this before touching state.
let routeSegmentsGeneration = 0;

// Fetches the segments actually completed on the currently selected
// activity into state.routeSegments (+ their per-ride effort stats into
// state.routeSegmentEfforts). EXPLICITLY USER-TRIGGERED ONLY — called from
// the "Segmente laden" button in renderRouteSegmentsCard(), never
// automatically on activity selection (kept from the old design; still the
// right call even though this is now a single fast request rather than a
// slow chunked one). No-ops when not connected, no activity is selected, or
// the selection isn't a genuine ridden activity (a planned route or GPX file
// has no segment_efforts — renderRouteSegmentsCard() shows an explanatory
// message instead of the button in that case, so this shouldn't normally
// even be reachable then).
async function ensureRideSegments(){
  const activity = state.selectedActivity;
  if(!state.connected || !activity || activity.isRoute || activity.isGpx) return;
  if(state.loading.routeSegments) return;
  // Captured once, up front — see routeSegmentsGeneration's comment. Every
  // point below that's about to write state.routeSegments*/state.loading.
  // routeSegments re-checks this against the live counter first, and bails
  // out silently (no state writes, no render()) the moment they diverge,
  // since a diverging counter means resetRouteSegments() already ran for a
  // newer selection and put state back to "not fetched" for it — this stale
  // run must never overwrite that.
  const myGeneration = routeSegmentsGeneration;
  state.loading.routeSegments = true;
  // Clear out any error left over from a previous failed attempt at this
  // same activity (retry via the "Segmente laden" button) so it doesn't
  // linger stale alongside — or instead of — this run's own outcome.
  if(myGeneration === routeSegmentsGeneration) state.routeSegmentsError = null;
  render();
  try{
    const data = await fetchActivityDetail(activity.id, state.accessToken);
    if(myGeneration !== routeSegmentsGeneration) return;
    const efforts = data.segment_efforts || []; // empty = a normal "no segments on this ride", not an error
    const segments = [];
    const effortsById = {};
    const prWatts = {};
    efforts.forEach(effort=>{
      const seg = effort.segment;
      if(!seg || !seg.id || effortsById[seg.id]) return; // skip malformed entries + (rare) repeat efforts on the same segment, keep the first
      segments.push(seg);
      effortsById[seg.id] = effort;
      // This ride's own watts for the effort — no separate PR-activity
      // lookup needed the way ensureSegmentPrWatts() needs one for the
      // starred-segments bucket, since it's right here on the effort.
      prWatts[seg.id] = effort.average_watts != null
        ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
        : null;
    });
    state.routeSegments = segments;
    state.routeSegmentEfforts = effortsById;
    state.routeSegmentPrWatts = prWatts;
    // Still fetches per-segment weather + full segment detail (for the
    // map-detail-view polyline, see mountSegmentView()) the same way the
    // starred-segments bucket does — that part of the shared pipeline is
    // unrelated to the old explore/matching system and stays as-is.
    // Uncapped (Infinity): unlike the starred-segments call site, "every
    // segment actually completed on this ride" is the entire point of this
    // feature, so truncating it defeats the purpose (see renderRouteSegmentsCard()).
    await loadSegmentExtras(state.routeSegments, segmentBucket("route"), Infinity);
    if(myGeneration !== routeSegmentsGeneration) return;
    state.routeSegmentsFetched = true;
  }catch(e){
    if(myGeneration === routeSegmentsGeneration){
      // A real failure (expired token, rate limit, network error) — leave
      // routeSegmentsFetched false so the "Segmente laden" button reappears
      // for a retry instead of falling through to an empty-list message.
      state.routeSegmentsError = e.message || "Segmente konnten nicht geladen werden. Bitte erneut versuchen.";
      state.routeSegmentsFetched = false;
    }
  }
  if(myGeneration !== routeSegmentsGeneration) return;
  state.loading.routeSegments = false;
  render();
}

// ---------- Segmentjäger: curated target-segment picker for a ridden ride ----------
// Builds directly on "Abgeschlossene Segmente" above (same state.routeSegments/
// routeSegmentDetails/routeSegmentEfforts, no separate fetch). Purpose: for an
// activity the rider has already completed, suggest which of its segments are
// realistic to specifically target for a KOM/QOM or personal-best attempt on
// a future ride. Deliberately only ever reads the ride-completed bucket
// ensureRideSegments() already fetches — see the comment above that function
// for why route/GPX-based segment discovery was removed from this app
// entirely (false positives from proximity-matching); this feature never
// resurrects any form of that.

const SEGMENTJAEGER_XOM_TOLERANCE = 0.08; // 8%, see the task brief's default-selection rule
// Above this "Genutztes Potential" % (own PR watts as a share of the
// rider's MMP-curve ceiling for that duration, see segmentPotentialValue()),
// a segment is treated as already maxed out -- closing the remaining gap to
// the record isn't realistically a matter of pacing/execution on a future
// attempt, it needs an actual fitness gain, so it's excluded from the
// default selection even if the time-gap rule alone would have picked it.
const SEGMENTJAEGER_POTENTIAL_CEILING = 95;

// Whether `seg` currently has a tailwind at its start, for the wind gate in
// segmentjaegerIsDefaultEligible() below — extracted as its own pure
// function (bearing + windRelative(), same math segmentTailwindDiff() above
// already uses for sorting) so it's independently unit-testable without
// needing the whole eligibility rule. `weather` is bucket.weather[seg.id]
// (see loadSegmentExtras()/fetchWeather()) -- fetched WITHOUT an explicit
// targetDate, so it already defaults to "now", i.e. the closest forecast
// hour to whenever the segments were last loaded -- exactly the "planning
// an attempt soon" semantics this gate wants, no separate date picker or
// extra fetch needed.
// Returns true (tailwind), false (cross/head), or null when there's nothing
// to judge (no weather, or the segment has no start/end coords to compute a
// bearing from) -- null lets the caller treat "no data" as "don't exclude",
// same fail-open philosophy as the missing-potential-data case below.
function segmentjaegerFavorableWind(seg, weather){
  if(!weather || !seg.start_latlng || !seg.end_latlng) return null;
  const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  return windRelative(bearing, weather.windDir).type === "tail";
}

// Pure eligibility check for ONE segment's default selection — no state.*
// reads (showKomChip/showQomChip are passed in explicitly instead, see
// below), so it's directly unit-testable. `detail` is bucket.details[seg.id]
// (a DetailedSegment, possibly null/undefined if that fetch failed), `effort`
// is bucket.efforts[seg.id] (this ride's own DetailedSegmentEffort — always
// present for anything in state.routeSegments, since that's literally where
// the segment came from, see ensureRideSegments()). `showKomChip`/
// `showQomChip` mirror state.showKomChip/state.showQomChip (see
// computeRideEffortStatChips(), which already gates the KOM/QOM chips
// themselves on these) — pre-selecting a segment off a KOM or QOM gap the
// row then doesn't even display, because the matching chip is toggled off,
// would leave the rider confused about why it's highlighted.
//
// True when `detail` has a KOM and/or QOM time AND the rider's all-time PR
// on this segment is within SEGMENTJAEGER_XOM_TOLERANCE of it — (pr - xom) /
// xom <= 0.08 (a zero/negative delta, i.e. the PR already matches or beats
// the record, still counts as "within tolerance") — but the KOM side of this
// only counts when showKomChip is true, and likewise QOM/showQomChip —
// AND `potentialPercent` (see segmentPotentialValue(), the "Genutztes
// Potential" %) is either unavailable (no MMP curve loaded — can't
// judge, so this exclusion simply doesn't apply, falling back to the
// record-gap rule alone) or below SEGMENTJAEGER_POTENTIAL_CEILING: a
// close-to-the-record PR that already extracts ~all of the rider's own
// power ceiling for that duration isn't a realistic target for a future
// attempt — closing the gap needs an actual fitness gain, not a better
// pacing/execution on the same segment — AND `favorableWind` (see
// segmentjaegerFavorableWind() above) is either unavailable (can't judge,
// exclusion doesn't apply) or true: per explicit product decision this
// gate is strict (only a confirmed TAILWIND counts, cross/head both
// exclude, not just head) since the whole point is picking a genuinely
// good day for the attempt, not merely avoiding an actively bad one.
// A missing PR and/or missing xoms — can't judge realism — correctly falls
// through to `false` (deselected by default), per explicit product decision
// (see the task brief). No "already top-10 on this ride" bypass anymore —
// removed per explicit product decision (04.09.2026): an achieved placement
// used to qualify a segment unconditionally, but that meant it could still
// end up right next to another selected segment with no recovery gap in
// between (see segmentjaegerComputeDefaults()'s minimum-gap pass below) --
// simpler to have exactly one path to eligibility than to special-case the
// interaction between two independent rules. The rank itself is still
// visible elsewhere (computeRideEffortStatChips()'s "Platz X (Effort)" chip,
// the segment leaderboard) — this only removes its effect on the default
// selection. `effort` (this ride's own DetailedSegmentEffort) is no longer a
// parameter here as a result -- nothing in this function reads it anymore
// (it was only ever used for the removed rank check); segmentjaegerComputeDefaults()
// still receives the full `efforts` map for its own minimum-gap pass below.
function segmentjaegerIsDefaultEligible(detail, showKomChip, showQomChip, potentialPercent, favorableWind){
  const pr = detail && detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
  const nearRecord = (xomTime) => {
    if(pr == null || !xomTime) return false;
    const xomSeconds = parseDuration(xomTime);
    if(xomSeconds == null || xomSeconds <= 0) return false;
    return (pr - xomSeconds) / xomSeconds <= SEGMENTJAEGER_XOM_TOLERANCE;
  };
  const xoms = detail && detail.xoms;
  const viaRecord = !!xoms && (
    (!!showKomChip && nearRecord(xoms.kom)) ||
    (!!showQomChip && nearRecord(xoms.qom))
  );
  if(!viaRecord) return false;

  const alreadyMaxedOut = potentialPercent != null && potentialPercent >= SEGMENTJAEGER_POTENTIAL_CEILING;
  if(alreadyMaxedOut) return false;

  // Wind gate: per explicit product decision, only a CONFIRMED tailwind
  // counts (cross/head both exclude, not just head) -- stricter than the
  // potential gate above, which only excludes on a confirmed bad reading.
  // favorableWind === null (no data) falls through without excluding, same
  // fail-open philosophy as potentialPercent == null above.
  if(favorableWind === false) return false;
  return true;
}

// Seconds between the end of effortA and the start of effortB (both
// DetailedSegmentEffort-shaped, i.e. bucket.efforts[seg.id]), or null if
// either's start_date/elapsed_time is missing or unparseable -- "can't
// judge" rather than "0 seconds apart", so callers can fail open the same
// way segmentjaegerFavorableWind() does for missing weather. Negative
// results (effortB actually starts before effortA ends -- e.g. overlapping
// segments) are returned as-is; callers comparing against a minimum gap
// treat that the same as any other too-small gap.
function segmentjaegerGapSeconds(effortA, effortB){
  if(!effortA || !effortB) return null;
  const aEnd = effortA.start_date ? new Date(effortA.start_date).getTime() + (effortA.elapsed_time || 0) * 1000 : null;
  const bStart = effortB.start_date ? new Date(effortB.start_date).getTime() : null;
  if(aEnd == null || bStart == null || isNaN(aEnd) || isNaN(bStart)) return null;
  return (bStart - aEnd) / 1000;
}

// Runs segmentjaegerIsDefaultEligible() over every segment in `segments` —
// the whole-list default, computed exactly once per activity (see
// ensureSegmentjaegerSelection() below for when this actually runs).
// `showKomChip`/`showQomChip` are just forwarded through to each per-segment
// check — see segmentjaegerIsDefaultEligible()'s own comment for why they're
// parameters here rather than a global state.* read. `potentials`/`winds`
// are plain {segId: value|null} maps (the caller computes each value via
// segmentPotentialValue()/segmentjaegerFavorableWind(), which need the
// actual bucket/state — kept out of this function so it stays a pure
// map-in/map-out transform, no bucket coupling, same split as
// details/efforts above).
//
// `minGapSec` (see state.segmentjaegerMinGapMinutes) adds a second,
// LIST-level pass on top of the per-segment eligibility check: `segments`
// is already in ride-chronological order (see the caller's comment on why
// this deliberately never goes through sortedRouteSegments()), so a single
// forward walk is enough. A segment that's independently eligible still
// gets excluded if it starts too soon after the END of the last segment
// that actually ended up SELECTED (not just the last eligible one -- a
// suppressed segment never becomes the new reference point, which is what
// stops a chain of closely-spaced eligible segments from "passing the
// baton" to each other one gap-length at a time). The earlier segment
// always wins a conflict, per explicit product decision -- no scoring/
// priority between segments, just ride order. `minGapSec` missing/0
// disables this pass entirely (every independently-eligible segment stays
// selected, today's behavior); a gap that can't be computed (missing
// start_date, see segmentjaegerGapSeconds()) never excludes, same fail-open
// philosophy as the potential/wind gates above.
function segmentjaegerComputeDefaults(segments, details, efforts, showKomChip, showQomChip, potentials, winds, minGapSec){
  const out = {};
  let lastSelectedEffort = null;
  segments.forEach(seg => {
    const potentialPercent = potentials ? potentials[seg.id] : null;
    const favorableWind = winds ? winds[seg.id] : null;
    const eligible = segmentjaegerIsDefaultEligible(details[seg.id], showKomChip, showQomChip, potentialPercent, favorableWind);
    if(!eligible){ out[seg.id] = false; return; }

    const gap = lastSelectedEffort ? segmentjaegerGapSeconds(lastSelectedEffort, efforts[seg.id]) : null;
    const tooClose = !!minGapSec && gap != null && gap < minGapSec;
    if(tooClose){ out[seg.id] = false; return; }

    out[seg.id] = true;
    lastSelectedEffort = efforts[seg.id];
  });
  return out;
}

// Per-activity persisted selection — one localStorage blob shaped
// {[activityId]: {[segmentId]: boolean}}, same "everything in one key, keyed
// by id" shape as PROFIL_GEAR_RESET_KEY's per-gear-id map (see
// loadGearResets()). Keyed by activity.id, always present for a genuine
// ridden Strava activity — no fallback-key case to handle here. Same
// defensive-read discipline as every other localStorage reader in this file:
// never throws on missing/corrupt JSON, silently drops anything that isn't
// exactly the expected shape rather than trusting it.
const SEGMENTJAEGER_SELECTION_KEY = 'velocast_segmentjaeger_selection';
function loadSegmentjaegerSelections(){
  try{
    const raw = localStorage.getItem(SEGMENTJAEGER_SELECTION_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== 'object') return {};
    const out = {};
    Object.entries(parsed).forEach(([activityId, sel]) => {
      if(!sel || typeof sel !== 'object') return;
      const clean = {};
      Object.entries(sel).forEach(([segId, v]) => {
        // Must actually BE a boolean (not e.g. a truthy string) — an
        // explicit `false` is exactly the value this feature most needs to
        // survive a round-trip (a user-deselected default-eligible segment),
        // so this can't use a `||`/truthiness shortcut here either.
        if(typeof v === 'boolean') clean[segId] = v;
      });
      out[String(activityId)] = clean;
    });
    return out;
  }catch(e){ return {}; }
}
function saveSegmentjaegerSelection(activityId, selection){
  const all = loadSegmentjaegerSelections();
  all[String(activityId)] = selection;
  try{ localStorage.setItem(SEGMENTJAEGER_SELECTION_KEY, JSON.stringify(all)); }catch(e){}
}

// Populates state.segmentjaegerSelection for the currently selected activity
// — computed/restored at most once per activity (guarded by
// state.segmentjaegerSelectionActivityId), so re-rendering the page or
// toggling a row never re-runs the default computation and stomps a user's
// override. Waits for routeSegmentsFetched (not just routeSegments.length) so
// details/efforts (loadSegmentExtras(), awaited inside ensureRideSegments()
// before that flag flips) are actually in place before the eligibility check
// reads them — computing defaults off partially-loaded details would
// silently under-select. Called directly from renderSegmentjaegerPage()
// during render, same "mutate state synchronously mid-render, no nested
// render() call" pattern renderRouteSourceTabs() already uses for its own
// state.routeSourceTab fallback.
function ensureSegmentjaegerSelection(){
  const activity = state.selectedActivity;
  if(!activity || !state.routeSegmentsFetched || !state.routeSegments.length) return;
  if(state.segmentjaegerSelectionActivityId === activity.id) return;
  const stored = loadSegmentjaegerSelections()[String(activity.id)];
  if(stored){
    // Restore, never recompute — an activity's segment set is deterministic
    // (same activity -> same segment_efforts), so every id should already be
    // a key in `stored`; anything genuinely missing (defensive only) reads
    // as deselected rather than silently re-running the default computation.
    const restored = {};
    state.routeSegments.forEach(seg => { restored[seg.id] = stored[seg.id] === true; });
    state.segmentjaegerSelection = restored;
  } else {
    // Genutztes Potential" per segment, same computation/bucket the "Meine
    // Segmente"/route-page stat chips already use (segmentPotentialValue()) —
    // computed here (not inside segmentjaegerComputeDefaults() itself) so
    // that function stays a pure map-in/map-out transform with no bucket/
    // state coupling. Returns null per segment when no MMP curve is loaded,
    // which segmentjaegerIsDefaultEligible() already treats as "can't
    // judge, don't exclude" — no separate fallback needed here.
    const bucket = segmentBucket("route");
    const potentials = {};
    const winds = {};
    state.routeSegments.forEach(seg => {
      potentials[seg.id] = segmentPotentialValue(seg, bucket);
      winds[seg.id] = segmentjaegerFavorableWind(seg, bucket.weather[seg.id]);
    });
    const minGapSec = (state.segmentjaegerMinGapMinutes || 0) * 60;
    const defaults = segmentjaegerComputeDefaults(state.routeSegments, state.routeSegmentDetails, state.routeSegmentEfforts, state.showKomChip, state.showQomChip, potentials, winds, minGapSec);
    state.segmentjaegerSelection = defaults;
    saveSegmentjaegerSelection(activity.id, defaults);
  }
  state.segmentjaegerSelectionActivityId = activity.id;
}

// Row click handler — toggles one segment's target selection and persists
// the whole updated map immediately (not just on navigating away), so a
// selection survives even an unexpected tab close.
function toggleSegmentjaegerSelection(seg){
  const activity = state.selectedActivity;
  if(!activity) return;
  state.segmentjaegerSelection[seg.id] = !state.segmentjaegerSelection[seg.id];
  saveSegmentjaegerSelection(activity.id, state.segmentjaegerSelection);
  render();
}

// ---------- Segmentjäger: Auswahl <-> Strava-Stern abgleichen ----------
// The Segmentjäger selection above (state.segmentjaegerSelection) is only
// ever local UI state -- it means nothing to Strava/the Karoo's Live
// Segments feature, which reads the real Strava star instead (see
// toggleSegmentStar()). Without an explicit sync step, a segment could be
// "selected" here and still never show up live on a ride. This pure
// function is the diff: given this ride's segments, the current selection,
// and a plain {segId: boolean} snapshot of their current star state (the
// caller builds that from segmentIsStarred(), kept out of this function so
// it stays state-free/testable), it returns exactly which segments need a
// star added or removed to bring Strava in line with the selection. A
// missing entry in either map (undefined) is treated as falsy on purpose --
// "not selected"/"not starred" is the correct default, not an error case.
function segmentjaegerComputeStarSyncPlan(segments, selection, starredMap){
  const toStar = [], toUnstar = [];
  (segments || []).forEach(seg => {
    const shouldBeStarred = !!(selection && selection[seg.id]);
    const isStarred = !!(starredMap && starredMap[seg.id]);
    if(shouldBeStarred && !isStarred) toStar.push(seg);
    else if(!shouldBeStarred && isStarred) toUnstar.push(seg);
  });
  return { toStar, toUnstar };
}

// Orchestrates the actual Strava writes for the plan above -- EXPLICITLY
// USER-TRIGGERED ONLY (the "Auswahl mit Strava-Stern abgleichen" button on
// renderSegmentjaegerPage()), same discipline as ensureRideSegments()'s
// "Segmente laden" button: no auto-firing on selection changes, since that
// would mean an uncapped, unannounced burst of Strava writes on every tap.
// Deliberately scoped to state.routeSegments ONLY (this ride's own segment
// list) -- a segment starred for an unrelated reason on a different ride
// never appears in that array, so it's never touched here, no matter how
// the plan diff turns out. Sequential (not parallel), same rate-limit
// caution as loadSegmentExtras(); only mismatched segments cost a call at
// all, since segmentjaegerComputeStarSyncPlan() already skips segments
// whose star state already matches the selection.
async function syncSegmentjaegerStars(){
  if(state.segmentjaegerSyncRunning) return;
  const bucket = segmentBucket("route");
  const starredMap = {};
  state.routeSegments.forEach(seg => { starredMap[seg.id] = segmentIsStarred(seg, bucket); });
  const plan = segmentjaegerComputeStarSyncPlan(state.routeSegments, state.segmentjaegerSelection, starredMap);
  if(!plan.toStar.length && !plan.toUnstar.length) return;

  // Same stale-selection guard ensureRideSegments() uses: if the user picks
  // a different activity while this loop is still awaiting, routeSegments
  // (and this ride's whole segment set) is no longer what the plan was
  // built for, so any remaining star/unstar calls for it are abandoned.
  const myGeneration = routeSegmentsGeneration;
  state.segmentjaegerSyncRunning = true;
  render();
  for(const seg of plan.toStar){
    if(myGeneration !== routeSegmentsGeneration) break;
    await applySegmentStar(seg, true);
  }
  for(const seg of plan.toUnstar){
    if(myGeneration !== routeSegmentsGeneration) break;
    await applySegmentStar(seg, false);
  }
  if(myGeneration !== routeSegmentsGeneration) return;
  state.segmentjaegerSyncRunning = false;
  render();
}

// Step used to sample a list-chip's polyline into smoothed-bearing points
// (see pickRoutePoints()/smoothedBearingAt()) -- much finer than the
// route-page's user-configurable Punktabstand since this only drives a
// distance-weighted percentage mix, not individually shown wind markers.
const LIST_ITEM_WIND_STEP_KM = 1;

// Distance-weighted tail/cross/head wind-mix for a route/activity list chip.
// The polyline is decoded and split into bearings entirely client-side
// (free); only a single Open-Meteo call is made (wind at the start point) to
// classify all of those segments against, so this stays cheap enough to run
// for every visible list item. Reuses pickRoutePoints() purely to get evenly
// spaced ~LIST_ITEM_WIND_STEP_KM leg endpoints along the route -- but unlike
// the route map's own markers, each leg here is classified by the direct
// chord bearing across ITS OWN endpoints (coords[points[i].idx] ->
// coords[points[i+1].idx]), not by points[i].bearing (that field is the
// BEARING_SMOOTHING_WINDOW_KM-windowed bearing meant for the finer-grained
// map/route classification, centered on the leg's start point -- at this
// function's much coarser 1km step, that window barely reaches past the
// leg's own start and mostly reflects the previous leg, not the ~1km this
// bearing is meant to represent). The full-leg chord is both smoother
// (spans the whole ~1km) and actually descriptive of the leg being
// classified.
async function ensureListItemWindTag(key, polyline){
  if(state.routeWindCache[key] !== undefined) return;
  state.routeWindCache[key] = null;
  if(!polyline) return;
  const coords = decodePolyline(polyline);
  if(coords.length < 2) return;
  try{
    const w = await fetchWeather(coords[0][0].toFixed(4), coords[0][1].toFixed(4));
    const cumDist = buildCumulativeDistances(coords);
    const points = pickRoutePoints(coords, cumDist, LIST_ITEM_WIND_STEP_KM);
    let tailDist = 0, crossDist = 0, totalDist = 0;
    for(let i=0;i<points.length-1;i++){
      const dist = points[i+1].distanceKm - points[i].distanceKm;
      if(dist <= 0) continue;
      const legBearing = bearingBetween(coords[points[i].idx], coords[points[i+1].idx]);
      const rel = windRelative(legBearing, w.windDir);
      if(rel.type === "tail") tailDist += dist;
      else if(rel.type === "cross") crossDist += dist;
      totalDist += dist;
    }
    if(totalDist <= 0) return;
    const tailPct = Math.round(tailDist / totalDist * 100);
    const crossPct = Math.round(crossDist / totalDist * 100);
    const headPct = Math.max(0, 100 - tailPct - crossPct);
    state.routeWindCache[key] = { tailPct, crossPct, headPct };
    render();
  }catch(e){
    // leave cached as null (no rating shown)
  }
}

function renderListItemWindTag(key){
  const mix = state.routeWindCache[key];
  if(!mix) return null;
  return el("div", {class:"wind-mix-mini"}, [
    el("div", {class:"tag mini tail", title:"Rückenwind"}, [`${mix.tailPct}%`]),
    el("div", {class:"tag mini cross", title:"Seitenwind"}, [`${mix.crossPct}%`]),
    el("div", {class:"tag mini head", title:"Gegenwind"}, [`${mix.headPct}%`])
  ]);
}

// Shared "title + back button" header row for the 3 static detail views —
// same visual wrapper everywhere, but each caller supplies its own onBack
// closure since what gets cleared from state and which list-row id gets

  return el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--space-5); gap:var(--space-4);"}, [

    el("button", {class:"btn secondary", style:"padding:8px 14px; font-size:12px;", onclick: onBack}, [backLabel])
  ]);
}

function renderRouteSourceTabs(card){
  {
    const tabs = [];
    if(state.connected){
      tabs.push({id:"routes", label:"Routen"});
      tabs.push({id:"activities", label:"Fahrten"});
    }
    tabs.push({id:"gpx", label:"GPX"});
    // routeSourceTab may point at a tab that isn't currently visible (e.g.
    // "activities" is the initial default but hidden until Strava is
    // connected) - fall back to something that's actually shown.
    if(!tabs.some(t => t.id === state.routeSourceTab)){
      state.routeSourceTab = state.connected ? "routes" : "gpx";
    }

    card.appendChild(el("div", {class:"source-tabs"}, tabs.map(t =>
      el("div", {
        class:"source-tab" + (state.routeSourceTab === t.id ? " active" : ""),
        onclick: ()=>selectRouteSourceTab(t.id)
      }, [t.label])
    )));

    if(state.routeSourceTab === "routes"){
      if(state.loading.routes){
        card.appendChild(el("div", {class:"loading"}, ["Lade Routen…"]));
      } else if(state.stravaRoutes.length){
        const list = el("div", {});
        state.stravaRoutes.slice(0,10).forEach(route=>{
          const key = "route-" + route.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === key;
          const km = (route.distance/1000).toFixed(1);
          const poly = route.map && (route.map.polyline || route.map.summary_polyline);
          ensureListItemWindTag(key, poly);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectStravaRoute(route)}, [
            el("div", {}, [
              el("div", {class:"name"}, [route.name]),
              el("div", {class:"meta"}, [`${km} km · ${Math.round(route.elevation_gain || 0)} Hm`])
