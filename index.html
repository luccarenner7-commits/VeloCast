// ---------- Aktivitäten: local cache ----------
// Every activity Strava's list endpoint returns (any sport type, power
// meter or not) — deliberately separate from PROFIL_ACTIVITY_CACHE_KEY,
// which only holds the subset that passed FTP analysis (rides with
// device_watts AND a qualifying 5/10/20-min effort, see loadProfilData()).
// The list endpoint's summary objects already carry everything this page's
// list view needs (distance, elevation, speed, watts/HR where present), so
// unlike Profil this cache stores the raw Strava response as-is, no
// derived-metrics processing required just to show a list row.
const AKTIVITAETEN_LIST_CACHE_KEY = "velocast_activity_list_cache";
const AKTIVITAETEN_LIST_CACHE_MAX = 600;

function byStartDateDesc(a, b){
  return new Date(b.start_date_local || b.start_date) - new Date(a.start_date_local || a.start_date);
}

function loadAktivitaetenListCache(){
  try{
    const raw = localStorage.getItem(AKTIVITAETEN_LIST_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, a]) => {
      if(!a || typeof a !== "object" || a.id == null) return;
      out[String(id)] = a;
    });
    return out;
  }catch(e){ return {}; }
}
function saveAktivitaetenListCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort(byStartDateDesc).slice(0, cap);
    const trimmed = {};
    entries.forEach(a => { trimmed[a.id] = a; });
    localStorage.setItem(AKTIVITAETEN_LIST_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(AKTIVITAETEN_LIST_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}

// ---------- Aktivitäten: loading pipeline ----------
// Assumes the caller already set aktivitaetenPage.loading = true (and, for a
// button-triggered call, already rendered that state) — mirrors the
// ensureListItemWindTag() discipline elsewhere in this file: called directly
// from inside a render pass (see renderAktivitaetenPage() below), so it must
// not call render() synchronously itself before the first await, only once
// the fetch actually resolves.
async function loadAktivitaetenList(token, opts){
  opts = opts || {};
  const ap = state.aktivitaetenPage;
  try{
    const cache = loadAktivitaetenListCache();
    if(!opts.more && !ap.items.length){
      // First load (or a refresh before anything's shown yet): paint
      // whatever's cached instantly while the fresh page-1 fetch is in flight.
      ap.items = Object.values(cache).sort(byStartDateDesc);
      // ap.page must track what's actually on screen, not "fetches since page
      // load" - otherwise a cache primed with e.g. 90 items still thinks
      // page 0 was the last fetch, and "Weitere laden" re-requests Strava
      // pages 2 and 3 (already-cached activities) before anything new shows.
      ap.page = Math.floor(ap.items.length / ap.perPage);
    }
    const page = opts.more ? ap.page + 1 : 1;
    const batch = await fetchActivitiesPage(token, page, ap.perPage);
    batch.forEach(a => { cache[String(a.id)] = a; });
    saveAktivitaetenListCache(cache);

    const merged = {};
    ap.items.forEach(a => { merged[String(a.id)] = a; });
    batch.forEach(a => { merged[String(a.id)] = a; });
    ap.items = Object.values(merged).sort(byStartDateDesc);
    // Same reasoning as the cache-prime above, so "Aktualisieren" (which
    // always fetches raw page 1) doesn't rewind the resume point below
    // however far the user had already paged - Math.max keeps it from ever
    // going backwards relative to the page we just actually fetched.
    ap.page = Math.max(page, Math.floor(ap.items.length / ap.perPage));
    ap.hasMore = batch.length === ap.perPage;
    ap.error = null;
  }catch(e){
    ap.error = e.message || "Aktivitäten konnten nicht geladen werden.";
  }
  ap.loading = false; ap.loaded = true;
  render();
}

// Lazy auto-load on first visit to the page — cheap (one page fetch, no
// per-ride stream calls), unlike Profil's manual "Trainingsdaten laden"
// button which exists specifically because that load can mean dozens of API
// calls. Sets `loading` synchronously so the SAME render pass that calls
// this can immediately show the loading card (see the discipline note on
// loadAktivitaetenList() above).
function ensureAktivitaetenData(){
  const ap = state.aktivitaetenPage;
  if(ap.loading || ap.loaded) return;
  ap.loading = true;
  loadAktivitaetenList(state.accessToken, {more:false});
}

// Per-ride stream fetch for the detail view — single-flight per activity id
// (state.aktivitaetenPage.detail.id is the "who this result belongs to"
// guard), reusing fetchActivityPowerStreams()/normalizeStreams() from the
// Profil pipeline verbatim rather than adding a second stream fetcher.
async function loadAktivitaetenDetailStream(id, token){
  const d = state.aktivitaetenPage.detail;
  try{
    const raw = await fetchActivityPowerStreams(id, token);
    if(d.id !== id) return; // selection moved on while this was in flight - discard
    const stream = normalizeStreams(raw);
    d.stream = stream;
    if(Array.isArray(stream.watts) && stream.watts.some(w => w != null)){
      const weightKg = state.profilPage.athleteDetail && state.profilPage.athleteDetail.weight;
      const metrics = computeStreamMetrics(stream, null, weightKg);
      const maxWatts = stream.watts.reduce((m, w) => (w != null && w > m) ? w : m, 0);
      d.metrics = metrics ? { ...metrics, maxWatts: Math.round(maxWatts) } : { maxWatts: Math.round(maxWatts) };
    }
  }catch(e){
    if(d.id !== id) return;
    // A 404 here just means this particular activity has no streams at all
    // (e.g. a manually-entered activity with no GPS/sensor data) - that's
    // not a failure worth an alarming .error box, just nothing to chart.
    if(e.status === 404) d.notAvailable = true;
    else d.error = e.message || "Leistungsdaten nicht verfügbar.";
  }
  if(d.id === id) d.loading = false;
  render();
}

function ensureAktivitaetenDetailStream(id, token){
  const d = state.aktivitaetenPage.detail;
  if(d.id === id) return; // already fetching/fetched/failed for this activity
  d.id = id; d.loading = true; d.error = null; d.notAvailable = false; d.stream = null; d.metrics = null;
  loadAktivitaetenDetailStream(id, token);
}

// ---------- Aktivitäten: chart ----------
// Same mountChart()/chartRegistry/profilColors() plumbing as the Profil
// charts above — destroyProfilCharts() is generic over any id list despite
// its name, so it's reused directly rather than re-implementing teardown.
const AKTIVITAETEN_CHART_IDS = ["velocastActivityChart"];

function buildActivityDetailChart(stream){
  const time = stream.time;
  if(!Array.isArray(time) || time.length < 2) return;
  const watts = stream.watts, altitude = stream.altitude, distance = stream.distance, hr = stream.heartrate;
  const n = time.length;
  const hasWatts = Array.isArray(watts) && watts.some(w => w != null);
  const hasAlt = Array.isArray(altitude) && altitude.some(v => v != null);
  const hasHr = Array.isArray(hr) && hr.some(v => v != null);
  if(!hasWatts && !hasAlt && !hasHr) return;
  // No power meter: fall back to heart rate as the primary trace instead of
  // an empty chart (see Phase 2 spec: "show whatever's available").
  const primaryArr = hasWatts ? watts : (hasHr ? hr : null);
  const primaryLabel = hasWatts ? "Leistung (W)" : "Puls (bpm)";

  const maxPoints = 600; // downsample - a multi-hour ride is one point/second, way more than a line chart needs
  const stride = Math.max(1, Math.ceil(n / maxPoints));
  const c = profilColors();
  const useDistance = Array.isArray(distance) && distance.some(v => v != null);
  const xFor = i => useDistance ? (distance[i] || 0) / 1000 : (time[i] || 0) / 60;
  const xLabel = useDistance ? "Distanz (km)" : "Zeit (min)";

  const primaryData = [], altData = [];
  for(let i = 0; i < n; i += stride){
    const x = xFor(i);
    // Watts: `|| 0` is correct - coasting really is 0 W. HR: a missing/
    // dropped sample must stay a gap (`?? null`), not fake a 0 bpm spike.
    if(primaryArr) primaryData.push({ x, y: hasWatts ? (primaryArr[i] || 0) : (primaryArr[i] ?? null) });
    if(hasAlt) altData.push({ x, y: altitude[i] });
  }
  const datasets = [];
  if(primaryArr) datasets.push({ label:primaryLabel, data:primaryData, borderColor:c.route, backgroundColor:c.routeBg, borderWidth:1.3, pointRadius:0, tension:0.15, fill:!hasAlt, spanGaps: !hasWatts });
  if(hasAlt) datasets.push({ label:"Höhe (m)", data:altData, borderColor:c.chalkDim, borderWidth:1.2, pointRadius:0, tension:0.1, fill:!primaryArr, yAxisID: primaryArr ? "y2" : "y" });
  if(!datasets.length) return;

  mountChart("velocastActivityChart", {
    type:"line",
    data:{ datasets },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{display:datasets.length>1, labels:{color:c.chalkDim, boxWidth:12, font:{size:11}}},
        tooltip:{ callbacks:{ title: it => it.length ? `${xLabel}: ${it[0].parsed.x.toFixed(1)}` : "" } } },
      scales:{
        x:{ type:"linear", title:{display:true,text:xLabel,color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim} },
        y:{ title:{display:true,text:primaryLabel,color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim} },
        ...(hasAlt && primaryArr ? { y2:{ position:"right", title:{display:true,text:"Höhe (m)",color:c.chalkDim}, grid:{display:false}, ticks:{color:c.chalkDim} } } : {})
      } }
  });
}

// Called unconditionally from render()'s requestAnimationFrame block, same
// contract as mountProfilCharts(): no-op (and tear down) whenever the
// detail chart's canvas isn't actually in the DOM right now.
function mountAktivitaetenChart(){
  const ap = state.aktivitaetenPage;
  if(state.activePage !== "aktivitaeten" || !window.Chart || ap.selectedId == null){
    destroyProfilCharts(AKTIVITAETEN_CHART_IDS);
    return;
  }
  const d = ap.detail;
  if(!d.stream){ destroyProfilCharts(AKTIVITAETEN_CHART_IDS); return; }
  buildActivityDetailChart(d.stream);
}

function renderAktivitaetenRow(a){

  const date = new Date(a.start_date_local || a.start_date).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
  const type = a.sport_type || a.type || "Aktivität";

  const chips = [];
  if(a.device_watts && a.average_watts != null) chips.push(statChip(`${Math.round(a.average_watts)} W`, "Ø Leistung"));
  if(a.average_heartrate != null) chips.push(statChip(`${Math.round(a.average_heartrate)} bpm`, "Ø Puls"));

    id: `activity-row-${a.id}`,

function renderAktivitaetenDetailChartSection(a){
  const ap = state.aktivitaetenPage;
  const d = ap.detail;
  ensureAktivitaetenDetailStream(a.id, state.accessToken);

  // Mirrors buildActivityDetailChart()'s primary-trace pick (hasWatts /
  // primaryLabel there) so the heading matches whichever trace actually
  // gets plotted, instead of a fixed power-oriented label even when this
  // ride has no power meter and falls back to HR-only.
  const hasWatts = !!(d.stream && Array.isArray(d.stream.watts) && d.stream.watts.some(w => w != null));
  const hasHr = !!(d.stream && Array.isArray(d.stream.heartrate) && d.stream.heartrate.some(v => v != null));
  const heading = !hasWatts && hasHr ? "Herzfrequenz" : "Leistung & Höhe";

  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, [heading]));
  if(d.loading){
    card.appendChild(el("div", {class:"loading"}, ["Lade Leistungsdaten…"]));
  } else if(d.notAvailable){
    card.appendChild(el("div", {class:"empty-state"}, ["Für diese Aktivität sind keine Streckendaten (Leistung/Puls/Höhe) verfügbar."]));
  } else if(d.error){
    card.appendChild(el("div", {class:"error", style:"margin-bottom:10px;"}, [d.error]));
    card.appendChild(el("button", {class:"btn secondary", onclick: ()=>{ d.id = null; render(); }}, ["Erneut versuchen"]));
  } else if(d.stream){
    const hasAny = ["watts","altitude","heartrate"].some(k => Array.isArray(d.stream[k]) && d.stream[k].some(v => v != null));
    if(!hasAny){
      card.appendChild(el("div", {class:"empty-state"}, ["Für diese Aktivität sind keine Streckendaten (Leistung/Puls/Höhe) verfügbar."]));
    } else {
      card.appendChild(el("div", {class:"chart-box"}, [el("canvas", {id:"velocastActivityChart"})]));
      if(d.metrics){
        // On very short/degenerate power streams (< 4 samples, or zero
        // duration) computeStreamMetrics() returns null and the fallback
        // above only sets maxWatts - guard np/avgPower individually instead
        // of assuming all three fields are always present.
        const cards = [];
        if(d.metrics.np != null) cards.push(metricCard("Normalisierte Leistung", `${d.metrics.np} W`, null));
        if(d.metrics.avgPower != null) cards.push(metricCard("Ø Leistung", `${d.metrics.avgPower} W`, null));
        if(d.metrics.maxWatts != null) cards.push(metricCard("Max. Leistung", `${d.metrics.maxWatts} W`, null));
        if(cards.length) card.appendChild(el("div", {class:"metric-grid", style:"margin-top:14px; margin-bottom:0;"}, cards));
      }
    }
  }
  return card;
}

function renderAktivitaetenPage(){
  const frag = document.createDocumentFragment();

    frag.appendChild(renderStravaConnectCard("Aktivitäten", "Verbinde dich mit Strava, um deine Aktivitäten zu durchstöbern - mit Distanz, Höhenmetern, Leistung/Puls und Detailansicht je Fahrt."));

  return frag;

// ==================== Trainer ====================
// Phase 3: goal selection, route-adaptive/time-based workout generation,
// FIT/ZWO export, "Send to Hammerhead", and adaptive learning — ported from
// the strava-ftp-forecast Artifact's renderTrainerTab() and its supporting
// Training Decision Engine (goal/class picker, priority+weekly-budget
// engine, route suitability, interval placement, FIT/ZWO binary writers,
// evaluation/learning loop). Everything below is pure data transformation
// plus el()-based rendering, following the same state/render() discipline as
// the Profil/Aktivitäten pages — no innerHTML-string building or manual
// querySelectorAll wiring like the Artifact's own DOM layer used, since that
// doesn't fit this app's existing pattern.
//
// The Artifact's very last snapshot required a route for ANY workout to be
// generated at all (its own non-route generateWorkout()/`.ZWO` UI branch had
// gone unreachable). The Phase 3 spec explicitly asks for both a route-based
// AND a pure time-based path to stay available, so that gate is relaxed here:
// generateTimeBasedWorkout() below (a from-scratch adaptation of the
// Artifact's original, still-correct generateWorkout()) covers the no-route
// case, and the route-based generator only runs once a route is actually
// attached.

// ---------- Trainer: %FTP zone ladder ----------
// A 6-zone %FTP ladder for workout-STEP coloring (chart segments, step list,
// zone legend) — a different axis from Phase 1's POWER_ZONE_META (Strava's 7
// zones, used for time-in-zone analysis of already-ridden data). Colors reuse
// the first six POWER_ZONE_META hues directly so the two zone systems read as
// the same visual language rather than a clashing second palette.
const ZONES = [
  { max:0.55, name:'Erholung (Z1)', color: POWER_ZONE_META[0].color },
  { max:0.75, name:'Ausdauer (Z2)', color: POWER_ZONE_META[1].color },
  { max:0.90, name:'Tempo (Z3)',    color: POWER_ZONE_META[2].color },
  { max:1.05, name:'Schwelle (Z4)', color: POWER_ZONE_META[3].color },
  { max:1.20, name:'VO2max (Z5)',   color: POWER_ZONE_META[4].color },
  { max:99,   name:'Anaerob (Z6)',  color: POWER_ZONE_META[5].color },
];
function zoneFor(pct){ return ZONES.find(z=>pct<=z.max) || ZONES[ZONES.length-1]; }

// TrainingPeaks/Friel 7-zone %LTHR ladder — the HF analog of ZONES above,
// used once equipmentMode==='hr'. Boundaries are Joe Friel's published %LTHR
// zone system (The Cyclist's Training Bible; also reproduced in
// TrainingPeaks' own zone documentation) — like ZONES, these are fixed,
// published thresholds and not exposed in the Einstellungen tab.
const LTHR_ZONES = [
  { max:0.81, name:'Aktive Erholung (Z1)',     color: POWER_ZONE_META[0].color },
  { max:0.89, name:'Ausdauer (Z2)',            color: POWER_ZONE_META[1].color },
  { max:0.93, name:'Tempo (Z3)',               color: POWER_ZONE_META[2].color },
  { max:0.99, name:'Sub-Schwelle (Z4)',        color: POWER_ZONE_META[3].color },
  { max:1.02, name:'Supra-Schwelle (Z5a)',     color: POWER_ZONE_META[4].color },
  { max:1.06, name:'Aerobe Kapazität (Z5b)',   color: POWER_ZONE_META[5].color },
  { max:99,   name:'Anaerobe Kapazität (Z5c)', color: POWER_ZONE_META[6].color },
];
function lthrZoneFor(pct){ return LTHR_ZONES.find(z=>pct<=z.max) || LTHR_ZONES[LTHR_ZONES.length-1]; }

// Central resolver for every display-only call site below: `pct` is always
// "% of the active threshold metric" (FTP or LTHR) regardless of
// equipmentMode — these two functions are the only place that decides which
// metric that means. Consumed by buildRouteWorkoutChart(), drawStepPowerChart()
// and renderTrainerAblaufCard(). Generation/evaluation/export call sites
// (workoutMetrics, evaluateWorkout, buildFit, buildZwo, generateTimeBasedWorkout,
// buildIntervalSpec, ...) still don't use these helpers — they inline the
// `usingHr ? rp.lthr : rp.ftp` branch themselves instead.
function stepTargetValue(pct, rp){ return rp.usingHr ? pct*rp.lthr : pct*rp.ftp; }
function stepZoneFor(pct, rp){ return rp.usingHr ? lthrZoneFor(pct) : zoneFor(pct); }

// Top-bar goal selector — the classic 5-way manual pick (plus "auto"). Tempo
// and Sprint are only ever reached through the "Workout wählen" class picker
// below, not this dropdown, matching the Artifact's own GOALS scope.
const GOALS = {
  auto:      { label:'🎯 Automatisch (größter Hebel)' },
  ftp:       { label:'FTP / Schwellenleistung erhöhen' },
  vo2max:    { label:'VO2max erhöhen' },
  endurance: { label:'Grundlagenausdauer aufbauen' },
  anaerobic: { label:'Anaerobe Kapazität & Sprint' },
  recovery:  { label:'Regeneration / Entlastung' },
};

// ---------- Trainer: Training Decision Engine ----------
// Central "what should I train on?" model — every number here is a starting
// default, not a validated physiological constant, all in one place so it
// stays inspectable/tunable (a future Einstellungen tab, not built in this
// phase, would be where a rider could override it).
const TRAINING_CLASSES = [
  { key:'recovery',     label:'Erholung',                          zoneIdx:0, unit:'minutes', priorityEligible:false },
  { key:'endurance',    label:'Grundlagenausdauer (Z2)',            zoneIdx:1, unit:'minutes', priorityEligible:true  },
  { key:'tempo',        label:'Tempo / Sweet Spot',                 zoneIdx:2, unit:'quality',  priorityEligible:true  },
  { key:'threshold',    label:'Schwelle / FTP',                     zoneIdx:3, unit:'quality',  priorityEligible:true  },
  { key:'vo2max',       label:'VO2max',                             zoneIdx:4, unit:'quality',  priorityEligible:true  },
  { key:'anaerobic',    label:'Anaerobe Kapazität',                 zoneIdx:5, unit:'quality',  priorityEligible:true  },
  { key:'sprint',       label:'Sprint / Neuromuskulär',             zoneIdx:6, unit:'efforts',  priorityEligible:true  },
  { key:'longdistance', label:'Langstrecke / Ermüdungsresistenz',   zoneIdx:null, unit:'rides', priorityEligible:true  },
  // Deliberater Leistungstest -- eigene Einheit statt in bestehende
  // Intervalle eingebettet (s. Plan). zoneIdx:null (Präzedenzfall
  // longdistance oben) + priorityEligible:false (Präzedenzfall recovery
  // oben) verhindern zusammen, dass ein Test je automatisch als
  // Tagesempfehlung erscheint oder in die normale Zonen-/Prioritäts-Buchhaltung
  // einfließt -- er wird ausschließlich manuell über den "Test"-Chip gewählt.
  { key:'test', label:'Test', zoneIdx:null, unit:'test', priorityEligible:false },
];
function trainingClass(key){ return TRAINING_CLASSES.find(c=>c.key===key) || null; }
// A manually chosen top-bar goal still maps onto one class and forces it to
// HIGH priority — 'auto' and 'recovery' don't force anything.
const GOAL_TO_CLASS = { ftp:'threshold', vo2max:'vo2max', endurance:'endurance', anaerobic:'anaerobic' };
// Maps the 4 classes that used to share one weekly-quality-minutes value onto
// their own TRAINING_CONFIG table name (see weeklyTempoMinutesByPriority etc.
// below) -- used both by computeWeeklyBudgetTargets() and the Einstellungen
// chip group.
const WEEKLY_QUALITY_TABLE_BY_CLASS = { tempo:'weeklyTempoMinutesByPriority', threshold:'weeklyThresholdMinutesByPriority', vo2max:'weeklyVo2maxMinutesByPriority', anaerobic:'weeklyAnaerobicMinutesByPriority' };

const TRAINING_CONFIG = {
  classBaselineScore: { recovery:0, endurance:20, tempo:12, threshold:15, vo2max:10, anaerobic:5, sprint:0, longdistance:10 },
  priority: { highMin:55, mediumMin:25, lowMin:5 },
  // How many weeks in a row a class's weekly progress can fall below
  // floorFraction of its own fixed LOW-tier target before priority gets a
  // "neglected" boost — see classNeglectWeeks()/computeTrainingPriorities().
  neglect: { lookbackWeeks:4, floorFraction:0.5, boostPerWeek:8, boostMax:24 },
  // Minimum contiguous (grace-tolerant) time-in-zone before a span counts
  // toward the weekly training-class BUDGET (weeklyClassProgress()/
  // trainedOnDate() only -- NOT the raw cumulative zoneTimes used by charts).
  // Values are reasoned starting points based on common interval-training
  // convention, not single validated constants:
  //  - tempo/threshold (Sweet Spot/FTP work): typically prescribed in reps
  //    of >=8 min to produce a real training effect at that intensity.
  //  - vo2max: classic VO2max reps run 2-3 min; 150s (2.5 min) as the midpoint.
  //  - anaerobic: capacity reps run roughly 30-60s; 30s as the conservative
  //    (inclusive) lower bound so short-but-real reps still count.
  // endurance/longdistance (Z1/Z2) and sprint (Z7) are deliberately absent --
  // those stay on pure cumulative time / the existing synthetic effort-count
  // heuristic respectively.
  intervalDetection: {
    graceSec: 20, // generous enough for a real outdoor stop (traffic light, junction) without bridging two genuinely separate efforts
    minSecByClass: { tempo:480, threshold:480, vo2max:150, anaerobic:30 },
  },
  // Split per class (was one shared value for all four) so each class's
  // weekly quality-time target matches its actual research-backed session
  // structure instead of a single compromise number -- see plan for sources.
  weeklyTempoMinutesByPriority:     { HIGH:90, MEDIUM:60, LOW:30, MAINTENANCE:0 },
  weeklyThresholdMinutesByPriority: { HIGH:80, MEDIUM:40, LOW:20, MAINTENANCE:0 },

function deepMergeInto(target, source){

}
function getByPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }

// Re-keys Phase 1's detectWeaknesses() flat, goal-tagged item list onto the 8
// TRAINING_CLASSES — a durability/"Ermüdungsresistenz" item routes to
// 'longdistance' instead of 'endurance', since it's specifically about long
// rides under fatigue. Multiple items can map to the same class — the
// strongest one wins.
function classPerformanceScores(weaknessData){
  const scores = {};
  TRAINING_CLASSES.forEach(c => { scores[c.key] = { score:0, why:null }; });
  (weaknessData && weaknessData.items || []).forEach(item => {
    let key = item.goal;
    if(key === 'ftp') key = 'threshold';
    if(key === 'endurance' && item.area === 'Ermüdungsresistenz') key = 'longdistance';
    if(!scores[key]) return;
    if(item.score > scores[key].score) scores[key] = { score: item.score, why: item.why };
  });
  return scores;
}
function computeTrainingPriorities(scores, selectedGoal, config, results, todayIso){
  const cfg = config.priority;
  const neglect = classNeglectWeeks(results, todayIso, config);
  const priorities = {};
  TRAINING_CLASSES.forEach(c => {
    if(!c.priorityEligible){ priorities[c.key] = 'MAINTENANCE'; return; }
    const raw = (scores[c.key] && scores[c.key].score) || 0;
    const neglectBoost = Math.min(config.neglect?.boostMax ?? 24, (neglect[c.key]||0) * (config.neglect?.boostPerWeek ?? 8));
    const total = Math.min(100, raw + (config.classBaselineScore[c.key] || 0) + neglectBoost);
    priorities[c.key] = total >= cfg.highMin ? 'HIGH' : total >= cfg.mediumMin ? 'MEDIUM'
      : total >= cfg.lowMin ? 'LOW' : 'MAINTENANCE';
  });
  if(selectedGoal && GOAL_TO_CLASS[selectedGoal]) priorities[GOAL_TO_CLASS[selectedGoal]] = 'HIGH';
  return priorities;
}
function computeWeeklyBudgetTargets(priorities, config){
  const targets = {};
  TRAINING_CLASSES.forEach(c => {
    const tier = priorities[c.key] || 'MAINTENANCE';
    if(c.key === 'recovery') targets[c.key] = { unit:'minutes', amount: 0 };
    // Verified crash point: without this branch, 'test' falls into the bare
    // `else` below and does config[WEEKLY_QUALITY_TABLE_BY_CLASS['test']][tier]
    // -- WEEKLY_QUALITY_TABLE_BY_CLASS has no 'test' entry, so that's
    // undefined[tier], a TypeError that would crash the whole Trainer tab the
    // moment 'test' entered TRAINING_CLASSES. amount:0 is a placeholder --
    // formatBudgetLine() is never shown for 'test' (see
    // renderTrainerClassPicker()'s isTest branch), so this value is only ever
    // read defensively (reconcileWeeklyBudgets()), never displayed.
    else if(c.key === 'test') targets[c.key] = { unit:'test', amount: 0 };
    else if(c.key === 'endurance') targets[c.key] = { unit:'minutes', amount: config.weeklyEnduranceMinutesByPriority[tier] };
    else if(c.key === 'sprint') targets[c.key] = { unit:'efforts', amount: config.weeklySprintEffortsByPriority[tier] };
    else if(c.key === 'longdistance') targets[c.key] = { unit:'rides', amount: config.weeklyLongRidesByPriority[tier] };
    else targets[c.key] = { unit:'quality', amount: config[WEEKLY_QUALITY_TABLE_BY_CLASS[c.key]][tier] };
  });
  return targets;
}
// UTC-based date-string helpers for the weekly-budget window / "trained on
// date" checks — UTC-only throughout so they line up exactly with
// todayIsoKey() with no local-timezone drift.
function parseIsoDateUTC(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, (m||1)-1, d||1));
}
function toIsoDate(d){ return d.toISOString().slice(0,10); }
function addDaysUTC(d, n){ const out = new Date(d); out.setUTCDate(out.getUTCDate()+n); return out; }
function mondayOfUTC(d){ const day = (d.getUTCDay()+6)%7; return addDaysUTC(d, -day); }

function weeklyClassProgress(results, todayIso, config){
  const monday = mondayOfUTC(parseIsoDateUTC(todayIso));
  const nextMonday = addDaysUTC(monday, 7);
  const progress = {};
  TRAINING_CLASSES.forEach(c => { progress[c.key] = 0; });
  let longRideCount = 0;
  (results||[]).forEach(r => {
    const d = r.date instanceof Date ? r.date : new Date(r.date);
    if(isNaN(d.getTime()) || d < monday || d >= nextMonday) return;
    if(r.metrics && Array.isArray(r.metrics.zoneTimes)){
      // Prefer the interval-gated array so tempo/threshold/vo2max/anaerobic
      // only bank weekly-budget credit for genuine sustained efforts, not
      // scattered spikes -- see computeStreamMetrics(). Falls back to raw
      // zoneTimes for cached rows computed before intervalZoneTimes existed
      // (PROFIL_METRICS_VERSION), which is byte-identical for the
      // ungated classes anyway.
      const zt = Array.isArray(r.metrics.intervalZoneTimes) ? r.metrics.intervalZoneTimes : r.metrics.zoneTimes;
      TRAINING_CLASSES.forEach(c => {
        if(c.zoneIdx != null && zt[c.zoneIdx] != null) progress[c.key] += zt[c.zoneIdx]/60;
      });
    }
    if(r.movingMin != null && r.movingMin >= config.longRideMinMinutes) longRideCount++;
  });
  progress.longdistance = longRideCount;
  progress.sprint = Math.round((progress.sprint||0) / config.sprintMinutesPerEffort);
  return progress;
}
// Consecutive weeks (walking backward from the week before todayIso's week)
// that a class's weekly progress fell below floorFraction of its own fixed
// LOW-tier weekly target. Uses the fixed LOW-tier target rather than
// whatever tier is currently assigned as the reference floor, since
// priority itself now depends on this neglect count -- a dynamically
// assigned target would be circular. Counting stops at the first
// non-neglected week found going backward, and classes with no meaningful
// floor (0/undefined) are skipped (0 neglect weeks) rather than falsely
// flagged.
function classNeglectWeeks(results, todayIso, config){
  const neglect = {};
  const cfg = config.neglect || {};
  const lookbackWeeks = cfg.lookbackWeeks ?? 4;
  const floorFraction = cfg.floorFraction ?? 0.5;
  const thisMonday = mondayOfUTC(parseIsoDateUTC(todayIso));
  // Precompute each lookback week's progress once (not once per class) --
  // weeklyClassProgress() does a full pass over `results`, so this turns
  // O(classes * lookbackWeeks) full passes into O(lookbackWeeks).
  const weekProgress = [];
  for(let i=1; i<=lookbackWeeks; i++){
    const weekIso = toIsoDate(addDaysUTC(thisMonday, -7*i));
    weekProgress.push(weeklyClassProgress(results, weekIso, config));
  }
  TRAINING_CLASSES.forEach(c => {
    neglect[c.key] = 0;
    if(!c.priorityEligible) return;
    // Same per-class target lookup as computeWeeklyBudgetTargets(), fixed to
    // the LOW tier instead of whatever tier is currently assigned.
    let floor;
    if(c.key === 'endurance') floor = config.weeklyEnduranceMinutesByPriority?.LOW;
    else if(c.key === 'sprint') floor = config.weeklySprintEffortsByPriority?.LOW;
    else if(c.key === 'longdistance') floor = config.weeklyLongRidesByPriority?.LOW;
    else floor = config[WEEKLY_QUALITY_TABLE_BY_CLASS[c.key]]?.LOW;
    if(!floor) return;
    let count = 0;
    for(let i=0; i<lookbackWeeks; i++){
      const done = weekProgress[i][c.key] || 0;
      if(done < floor*floorFraction) count++;
      else break;
    }
    neglect[c.key] = count;
  });
  return neglect;
}
function reconcileWeeklyBudgets(targets, progress){
  const out = {};
  TRAINING_CLASSES.forEach(c => {
    const t = targets[c.key];
    if(!t) return;
    const done = progress[c.key] || 0;
    out[c.key] = { unit: t.unit, target: t.amount, done: Math.round(done*10)/10,
      remaining: Math.round(Math.max(0, t.amount-done)*10)/10, complete: t.amount>0 && done>=t.amount };
  });
  return out;
}
function computeTrainingDecisionState(results, weaknessData, selectedGoal, todayIso, config){
  const scores = classPerformanceScores(weaknessData);
  const priorities = computeTrainingPriorities(scores, selectedGoal, config, results, todayIso);
  const targets = computeWeeklyBudgetTargets(priorities, config);
  const progress = weeklyClassProgress(results, todayIso, config);
  const budgets = reconcileWeeklyBudgets(targets, progress);
  return { scores, priorities, budgets, weekStartIso: toIsoDate(mondayOfUTC(parseIsoDateUTC(todayIso))) };
}
function trainedOnDate(results, cls, dateIso, config){
  if(!cls || cls.zoneIdx == null) return false;
  const thresholdMin = config.recentTrainingMinMinutes || 12;
  return (results||[]).some(r => {
    const d = r.date instanceof Date ? r.date : new Date(r.date);
    if(isNaN(d.getTime()) || toIsoDate(d) !== dateIso) return false;
    if(!r.metrics) return false;
    // Same interval-gated preference (with graceful fallback for old cached
    // rows) as weeklyClassProgress() -- see there for rationale.
    const zt = Array.isArray(r.metrics.intervalZoneTimes) ? r.metrics.intervalZoneTimes : r.metrics.zoneTimes;
    return Array.isArray(zt) && (zt[cls.zoneIdx]||0)/60 >= thresholdMin;
  });
}
function pickIntendedTrainingClass(decisionState, results, todayIso, config, forceRecovery){
  if(forceRecovery) return { classKey:'recovery', reason:'safety' };
  const tierWeight = { HIGH:3, MEDIUM:2, LOW:1, MAINTENANCE:0 };
  const yesterdayIso = toIsoDate(addDaysUTC(parseIsoDateUTC(todayIso), -1));
  const ranked = TRAINING_CLASSES.filter(c => c.priorityEligible).slice().sort((a,b) => {
    const pa = tierWeight[decisionState.priorities[a.key]]||0, pb = tierWeight[decisionState.priorities[b.key]]||0;
    if(pa !== pb) return pb-pa;
    return ((decisionState.scores[b.key]&&decisionState.scores[b.key].score)||0) - ((decisionState.scores[a.key]&&decisionState.scores[a.key].score)||0);
  });
  for(const c of ranked){
    const budget = decisionState.budgets[c.key];
    if(budget && budget.target > 0 && budget.complete) continue;
    const cc = config.constraints.byClass[c.key];
    if(cc && cc.noConsecutiveDays && trainedOnDate(results, c, yesterdayIso, config)) continue;
    return { classKey:c.key, reason:'priority' };
  }
  return { classKey:'endurance', reason:'fallback' };
}
// Classes whose value doesn't depend on hitting specific terrain — any route
// supports them, so they skip the segment-level suitability gate entirely.
const SUITABILITY_EXEMPT_CLASSES = ['recovery', 'endurance', 'longdistance', 'test'];
function computeTrainingOpportunity(decisionState, route, results, todayIso, config, rp, options){
  const forceRecovery = !!(rp && ((rp.acwr!=null && rp.acwr>1.5) || (rp.daysSinceHard!=null && rp.daysSinceHard<=1)));
  const intended = pickIntendedTrainingClass(decisionState, results, todayIso, config, forceRecovery);
  const cls = trainingClass(intended.classKey);
  const exempt = SUITABILITY_EXEMPT_CLASSES.includes(intended.classKey);
  const suitability = (!exempt && route) ? computeRouteSuitability(route, intended.classKey, config, options) : null;
  const suitable = exempt || !route || (suitability && suitability.score >= config.suitability.minAcceptable);
  return {
    classKey: intended.classKey, className: cls ? cls.label : intended.classKey, reason: intended.reason,
    forceRecovery, suitability, suitable,
    budget: decisionState.budgets[intended.classKey],
    priority: decisionState.priorities[intended.classKey],
  };
}
function computeOpportunityForClass(decisionState, route, classKey, config, rp, options){
  const cls = trainingClass(classKey);
  const exempt = SUITABILITY_EXEMPT_CLASSES.includes(classKey);
  const suitability = (!exempt && route) ? computeRouteSuitability(route, classKey, config, options) : null;
  const suitable = exempt || !route || (suitability && suitability.score >= config.suitability.minAcceptable);
  return {
    classKey, className: cls ? cls.label : classKey, reason:'manual',
    forceRecovery:false, suitability, suitable,
    budget: decisionState.budgets[classKey],
    priority: decisionState.priorities[classKey],
  };
}

// Extends Phase 1's buildRiderProfile() output with the load/fatigue signals
// the Decision Engine needs (ACWR, freshness, hours/rides this week, days
// since a hard effort) — a read-only overlay rather than widening
// buildRiderProfile() itself, so the Profil tab's own render paths (which
// only ever read the narrower shape) can't be affected by this port. ACWR
// here is ATL/CTL (both already EWMA'd by Phase 1's buildTrainingLoad(), 7-
// day/42-day) rather than the Artifact's acute-vs-chronic sum of Strava's own
// "relative effort" score — VeloCast never fetches relative_effort, and this
// ratio answers the same "how loaded now vs. your longer-term average"
// question using the TSS-based load model Phase 1 already built.
// ---------- Trainer: HF-only LTHR-Schätzung (Ingestion-Pipeline) ----------
// processProfilRide()/loadProfilData() (see Profil pipeline further up)
// reject any ride without a watts stream before ever fetching one, so
// HF-only rides never reach the Profil page's analysis at all. Since Profil
// stays power-only by design (see plan), this is a separate, Trainer-owned
// ingestion that mirrors that pipeline's shape (pagination budget, cache +
// skip-cache, bounded concurrency) but walks HR streams instead of power
// streams. Populates state.trainerPage.hrProfile — see loadHrLthrEstimate().

// Mirrors PROFIL_ACTIVITY_CACHE_KEY/PROFIL_SKIP_CACHE_KEY, but under its own
// key so this pipeline's reload behavior can never affect (or be affected
// by) the Profil page's own cache.
const HR_PROFILE_CACHE_KEY = "velocast_hr_profile_cache";
const HR_PROFILE_CACHE_MAX = 400;
function loadHrProfileCache(){
  try{
    const raw = localStorage.getItem(HR_PROFILE_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, row]) => {
      if(!row || typeof row !== "object" || !row.date || !row.id) return;
      const d = new Date(row.date);
      if(isNaN(d.getTime())) return;
      out[String(id)] = { ...row, id: String(row.id), date: d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveHrProfileCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort((a,b)=>b.date-a.date).slice(0, cap);
    const trimmed = {};
    entries.forEach(r => { trimmed[r.id] = r; });
    localStorage.setItem(HR_PROFILE_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(HR_PROFILE_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function clearHrProfileCache(){ try{ localStorage.removeItem(HR_PROFILE_CACHE_KEY); }catch(e){} }

const HR_PROFILE_SKIP_CACHE_KEY = "velocast_hr_profile_skip_cache";
const HR_PROFILE_SKIP_CACHE_MAX = 800;
const HR_PROFILE_SKIP_STATUSES = new Set(["noHr","noBestEffort"]);
function loadHrProfileSkipCache(){
  try{
    const raw = localStorage.getItem(HR_PROFILE_SKIP_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, v]) => {
      if(!v || typeof v !== "object" || !HR_PROFILE_SKIP_STATUSES.has(v.status)) return;
      const d = v.date ? new Date(v.date) : new Date(0);
      out[String(id)] = { status:v.status, date: isNaN(d.getTime()) ? new Date(0) : d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveHrProfileSkipCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.entries(cacheObj).sort((a,b)=>b[1].date-a[1].date).slice(0, cap);
    const trimmed = {};
    entries.forEach(([id,v]) => { const dt = (v.date instanceof Date && !isNaN(v.date.getTime())) ? v.date : new Date(0); trimmed[id] = { status:v.status, date:dt.toISOString() }; });
    localStorage.setItem(HR_PROFILE_SKIP_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(HR_PROFILE_SKIP_CACHE_MAX); }
  catch(e){ try{ attempt(200); }catch(e2){} }
}
function clearHrProfileSkipCache(){ try{ localStorage.removeItem(HR_PROFILE_SKIP_CACHE_KEY); }catch(e){} }

// How many recent qualifying rides to consider — fixed budget, no "Mehr
// laden" UI for this pipeline in this phase (unlike pp.rideBudget); a single
// LTHR estimate needs far fewer samples than an FTP trend does.
const HR_PROFILE_RIDE_BUDGET = 60;

async function processHrProfileRide(a, token){
  const id = String(a.id);
  let raw;
  try{ raw = await fetchActivityHrStream(id, token); }
  catch(e){ return { status:'apiError' }; }
  const stream = normalizeStreams(raw);
  if(!stream.time || !stream.heartrate || stream.time.length < 30) return { status:'noBestEffort' };
  const mmp = computeHrMmpFromStream(stream);
  const est = mmp ? estimateLthrFromHrCurve(mmp, a.max_heartrate!=null ? a.max_heartrate : null) : null;
  if(!est) return { status:'noBestEffort' };
  return { status:'ok', row: {
    id, date: new Date(a.start_date_local || a.start_date),
    lthr: est.lthr, sec: est.sec, confidence: est.confidence, basis: est.basis
  }};
}

// Orchestrates the HF-only LTHR estimate: paginates /athlete/activities up
// to HR_PROFILE_RIDE_BUDGET qualifying rides (mirrors loadProfilData()'s
// device_watts filter, just on average_heartrate instead), skips anything
// already known from cache/skip-cache for free, fetches HR streams for
// genuinely new candidates in small concurrent batches, and picks the single
// best estimate (highest-confidence window wins; ties broken by the higher
// bpm value). Deliberately NOT a 42-day-ceiling regression like FTP's
// currentCeiling — LTHR is a physiological ceiling that doesn't trend across
// a season the way FTP does, so one best test-effort is the right model.
//
// Lazy by design: only ever called from the equipmentMode toggle (on first
// switch to 'hr' without an existing override/loaded estimate) or the
// explicit "Automatisch schätzen" button in Einstellungen — never from the
// normal Trainer-tab render path, so it can't block or regress it.
//
// opts.forceRefresh: clears both the estimate cache and the skip cache first,
// so a ride once skipped as noBestEffort/noHr (e.g. before a HR sensor issue
// was fixed, or before the plausibility check above existed) gets a genuine
// re-check instead of staying permanently skipped. Without this, clearHrProfileCache()/
// clearHrProfileSkipCache() had no caller at all.
async function loadHrLthrEstimate(token, opts){
  opts = opts || {};
  const tp = state.trainerPage;
  if(tp.hrProfile.loading) return;
  if(!token){ tp.hrProfile.error = "Bitte zuerst mit Strava verbinden."; render(); return; }
  if(opts.forceRefresh){ clearHrProfileCache(); clearHrProfileSkipCache(); }
  tp.hrProfile.loading = true; tp.hrProfile.error = null;
  render();
  try{
    const cache = loadHrProfileCache();
    const skipCache = loadHrProfileSkipCache();

    let candidates = [];
    let page = 1;
    const perPage = 100;
    while(candidates.length < HR_PROFILE_RIDE_BUDGET && page <= 10){
      const batch = await fetchActivitiesPage(token, page, perPage);
      if(!batch || !batch.length) break;
      candidates = candidates.concat(batch.filter(a => RIDE_SPORT_TYPES.has(a.sport_type || a.type)));
      if(batch.length < perPage) break;
      page++;
    }
    candidates = candidates.slice(0, HR_PROFILE_RIDE_BUDGET);

    const cachedRows = [], toFetch = [];
    candidates.forEach(a => {
      const id = String(a.id);
      const hit = cache[id];
      if(hit){ cachedRows.push(hit); return; }
      const skip = skipCache[id];
      if(skip) return;
      if(a.average_heartrate == null){
        skipCache[id] = { status:'noHr', date: new Date(a.start_date_local || a.start_date) };
        return;
      }
      toFetch.push(a);
    });

    const freshRows = [];
    const concurrency = 4;
    for(let i=0;i<toFetch.length;i+=concurrency){
      const batch = toFetch.slice(i, i+concurrency);
      const results = await Promise.all(batch.map(a => processHrProfileRide(a, token)));
      results.forEach((r, idx) => {
        const a = batch[idx];
        const id = String(a.id);
        if(r.status === 'ok'){ cache[id] = r.row; freshRows.push(r.row); }
        else if(r.status === 'noBestEffort'){ skipCache[id] = { status:'noBestEffort', date: new Date(a.start_date_local || a.start_date) }; }
        // apiError: neither cached nor skip-cached, so it's retried next run
      });
      if(i+concurrency < toFetch.length) await new Promise(r=>setTimeout(r,150));
    }
    saveHrProfileCache(cache);
    saveHrProfileSkipCache(skipCache);

    const allRows = cachedRows.concat(freshRows);
    const best = allRows.reduce((a,b) => {
      if(!a) return b;
      if(CONFIDENCE_WEIGHT[b.confidence] !== CONFIDENCE_WEIGHT[a.confidence]) return CONFIDENCE_WEIGHT[b.confidence] > CONFIDENCE_WEIGHT[a.confidence] ? b : a;
      return b.lthr > a.lthr ? b : a;
    }, null);

    tp.hrProfile.estimate = best ? best.lthr : null;
    tp.hrProfile.source = best ? `aus deinen Fahrten geschätzt (${best.basis}, ${best.confidence}e Zuversicht)` : null;
    if(!best) tp.hrProfile.error = "Keine geeigneten Fahrten mit Herzfrequenzdaten gefunden.";
  }catch(e){
    tp.hrProfile.error = e.message || "HF-Schwelle konnte nicht geschätzt werden.";
  }
  tp.hrProfile.loading = false; tp.hrProfile.loaded = true;
  render();
}

// Cheap, synchronous cache-only fallback for loadHrLthrEstimate() above: on a
// fresh page load state.trainerPage.hrProfile.estimate starts back at null —
// it's in-memory only, never persisted itself — so a user already restored
// into equipmentMode==='hr' from savedSettings would otherwise hit the
// "kein HF-Schwellenwert verfügbar" empty state on every reload until they
// manually click "Automatisch schätzen" again, even though their estimate is
// sitting right there in velocast_hr_profile_cache from last time. This reads
// that cache (no network, no fetchActivitiesPage) and picks the same "best"
// row loadHrLthrEstimate() would land on (highest confidence, ties broken by
// the higher bpm value). Called lazily from trainerRiderContext() below so it
// costs nothing on the power-only path and never blocks the normal render.
function syncCachedHrLthrEstimate(){
  const cache = loadHrProfileCache();
  const best = Object.values(cache).reduce((a,b) => {
    if(!a) return b;
    if(CONFIDENCE_WEIGHT[b.confidence] !== CONFIDENCE_WEIGHT[a.confidence]) return CONFIDENCE_WEIGHT[b.confidence] > CONFIDENCE_WEIGHT[a.confidence] ? b : a;
    return b.lthr > a.lthr ? b : a;
  }, null);
  if(!best) return;
  const tp = state.trainerPage;
  tp.hrProfile.estimate = best.lthr;
  tp.hrProfile.source = `aus deinen Fahrten geschätzt (${best.basis}, ${best.confidence}e Zuversicht)`;
}

// ---------- Trainer: blended training-load model for HF-only users ----------
// buildTrainingLoad() (~2393) only ever sees pp.results, which is Profil's
// own power-meter-only pipeline (device_watts filtered before a stream is
// even fetched) -- HF-only riders always get pp.trainingLoad === null there,
// silencing acwr/freshness/forceEasy entirely (see plan §7). This is a
// separate, additive per-day TSS series built straight from the raw Strava
// activity list instead of pp.results, so HF-only rides are captured too.
//
// Per ride: prefer a watt-based TSS when the ride has power data (mirrors
// buildTrainingLoad()'s own NP/FTP formula exactly, just sourced from the
// activity summary's own weighted_average_watts -- Strava's own NP-equivalent
// computed at upload time -- instead of a stream-derived NP, so this needs NO
// stream fetch at all: every field it reads already sits on the plain
// /athlete/activities list response). Otherwise, if average_heartrate and a
// resolved LTHR are available, fall back to the same simplified hrTSS formula
// used by workoutMetrics()'s HR branch (~6593, plan §6): IF_HR = avgHR/LTHR,
// hrTSS = hours × IF_HR² × 100. A ride with neither is skipped (no TSS that
// day), same as buildTrainingLoad() implicitly skipping rides with no NP.
//
// Independent of the currently active equipmentMode -- this answers "what
// actually happened", not "what is the current target" -- so a power-meter
// ride still contributes a watt-based TSS day even while the rider is
// currently in HR mode, and vice versa.
function buildBlendedTrainingLoad(activities, ftp, lthr){
  const daily = new Map();
  let earliest = null;
  (activities||[]).forEach(a => {
    const sec = a.moving_time || 0;
    if(sec <= 0) return;
    let tss = null;
    if(a.device_watts && a.weighted_average_watts && ftp){
      const np = a.weighted_average_watts, intensity = np/ftp;
      tss = (sec*np*intensity)/(ftp*3600)*100;
    } else if(a.average_heartrate != null && lthr){
      const ifHr = a.average_heartrate/lthr, hours = sec/3600;
      tss = hours*ifHr*ifHr*100;
    }
    if(tss == null || !isFinite(tss)) return;
    const d = new Date(a.date);
    if(isNaN(d.getTime())) return;
    const key = localDateKey(d);
    daily.set(key, (daily.get(key)||0) + tss);
    if(!earliest || d < earliest) earliest = d;
  });
  if(!earliest) return null;

  // Same EWMA procedure as buildTrainingLoad(), via the shared
  // computeEwmaLoadSeries() helper -- 42-day/7-day time constants -- just fed
  // by the blended daily TSS above instead of pp.results' NP-based TSS.
  // formVerdict/rampWeekly come out identical to buildTrainingLoad() too
  // (renderTrainerSummaryCards reads them for the Fitness/Ermüdung/Form cards
  // regardless of equipmentMode) so an HR-only rider gets the same cards
  // filled in, not a permanent "–".
  return computeEwmaLoadSeries(daily, earliest);
}

// Mirrors HR_PROFILE_CACHE_KEY's shape/rationale, under its own key. Caches
// the RAW per-ride summary fields buildBlendedTrainingLoad() needs -- NOT the
// derived CTL/ATL numbers -- since ftp/lthr can change (manual LTHR edited, a
// fresh estimate lands) without invalidating anything cached here; the blend
// is a cheap pure recompute over these rows on every trainerRiderContext() call.
const BLENDED_LOAD_CACHE_KEY = "velocast_blended_load_cache";
const BLENDED_LOAD_CACHE_MAX = 400;
// Same default as pp.rideBudget (~788) and HR_PROFILE_RIDE_BUDGET above --
// no separate "Mehr laden" UI for this pipeline in this phase either.
const BLENDED_LOAD_RIDE_BUDGET = 60;
// Separate key (not bundled into the ride cache) for the last fetch-ATTEMPT
// timestamp -- deliberately NOT the newest ride's date. Gating staleness on
// the newest cached ride's date re-triggers a fetch on every render whenever
// the rider hasn't ridden in >1 day (any rest day), or the fetch itself keeps
// failing, or the account has zero rides -- none of those make a fresh fetch
// any more likely to find newer data, so that version loops: render -> stale
// -> fetch -> render -> stale -> fetch -> ... Gating on "did we already TRY
// recently" instead bounds retries to once per BLENDED_LOAD_REFRESH_MS
// regardless of outcome, fixing the loop while still refreshing periodically.
const BLENDED_LOAD_FETCHED_AT_KEY = "velocast_blended_load_fetched_at";
const BLENDED_LOAD_REFRESH_MS = 6 * 60 * 60 * 1000; // 6h
function loadBlendedLoadCache(){
  try{
    const raw = localStorage.getItem(BLENDED_LOAD_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, row]) => {
      if(!row || typeof row !== "object" || !row.date || !row.id) return;
      out[String(id)] = row;
    });
    return out;
  }catch(e){ return {}; }
}
function saveBlendedLoadCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0, cap);
    const trimmed = {};
    entries.forEach(r => { trimmed[r.id] = r; });
    localStorage.setItem(BLENDED_LOAD_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(BLENDED_LOAD_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function clearBlendedLoadCache(){ try{ localStorage.removeItem(BLENDED_LOAD_CACHE_KEY); }catch(e){} }
function clearBlendedLoadFetchedAt(){ try{ localStorage.removeItem(BLENDED_LOAD_FETCHED_AT_KEY); }catch(e){} }
function loadBlendedLoadFetchedAt(){
  try{ const raw = localStorage.getItem(BLENDED_LOAD_FETCHED_AT_KEY); const n = raw ? Number(raw) : 0; return isFinite(n) ? n : 0; }
  catch(e){ return 0; }
}
function saveBlendedLoadFetchedAt(ts){ try{ localStorage.setItem(BLENDED_LOAD_FETCHED_AT_KEY, String(ts)); }catch(e){} }

// Orchestrates the blend ingestion: paginates /athlete/activities up to
// BLENDED_LOAD_RIDE_BUDGET rides (mirrors loadHrLthrEstimate()'s own
// pagination loop exactly), keeps only the handful of summary fields the
// blend formula needs -- no stream fetch, no concurrency batching required,
// since nothing here needs a per-ride network call -- and caches them.
//
// Triggered from two places: the equipmentMode toggle (eager first load, see
// buildEquipmentModeCard()) AND the normal Trainer-tab render path itself
// (trainerRiderContext(), see the staleness check there) -- a rider who
// leaves equipmentMode='hr' set across sessions would otherwise never
// refresh past that first toggle-triggered fetch, and the cache would go
// stale forever (ACWR decaying toward 0 as it reads an ever-older snapshot).
// The .loading guard above is what keeps both trigger sites safe together --
// whichever call gets here first wins, the other just returns.
// See syncCachedBlendedLoad() below for the cache-only fallback used on reload.
async function loadBlendedTrainingLoad(token, opts){
  opts = opts || {};
  const tp = state.trainerPage;
  if(tp.blendedLoad.loading) return;
  if(!token){ tp.blendedLoad.error = "Bitte zuerst mit Strava verbinden."; render(); return; }
  if(opts.forceRefresh) clearBlendedLoadCache();
  tp.blendedLoad.loading = true; tp.blendedLoad.error = null;
  // Mark the attempt NOW, before the network call, and persist it -- this is
  // what the staleness check in trainerRiderContext() gates on. Set here
  // (not only on success) so a persistently failing fetch still backs off
  // for BLENDED_LOAD_REFRESH_MS instead of being retried on every render.
  tp.blendedLoad.fetchedAt = Date.now();
  saveBlendedLoadFetchedAt(tp.blendedLoad.fetchedAt);
  render();
  let success = false;
  try{
    let candidates = [];
    let page = 1;
    const perPage = 100;
    while(candidates.length < BLENDED_LOAD_RIDE_BUDGET && page <= 10){
      const batch = await fetchActivitiesPage(token, page, perPage);
      if(!batch || !batch.length) break;
      candidates = candidates.concat(batch.filter(a => RIDE_SPORT_TYPES.has(a.sport_type || a.type)));
      if(batch.length < perPage) break;
      page++;
    }
    candidates = candidates.slice(0, BLENDED_LOAD_RIDE_BUDGET);

    const cache = loadBlendedLoadCache();
    candidates.forEach(a => {
      const id = String(a.id);
      cache[id] = {
        id,
        date: a.start_date_local || a.start_date,
        moving_time: a.moving_time || 0,
        device_watts: !!a.device_watts,
        weighted_average_watts: a.weighted_average_watts != null ? a.weighted_average_watts : null,
        average_heartrate: a.average_heartrate != null ? a.average_heartrate : null,
      };
    });
    saveBlendedLoadCache(cache);
    tp.blendedLoad.activities = Object.values(cache);
    success = true;
  }catch(e){
    tp.blendedLoad.error = e.message || "Trainingsbelastung konnte nicht geladen werden.";
  }
  tp.blendedLoad.loading = false;
  // Issue 3 fix: only mark `loaded` on an actual successful fetch. Setting it
  // unconditionally (including on a failed fetch that left `activities` at
  // whatever it was before, possibly still null on a first-ever attempt)
  // used to permanently defeat the `!activities && !loaded` cache-fallback
  // guard in trainerRiderContext() for the rest of the session -- a single
  // transient network blip would then keep a perfectly good previous
  // localStorage snapshot from ever being read again until a full reload.
  // Leaving `loaded` false on failure lets that guard keep retrying
  // syncCachedBlendedLoad() (a cheap, harmless local read) on every render.
  if(success) tp.blendedLoad.loaded = true;
  render();
}

// Cheap, synchronous cache-only fallback for loadBlendedTrainingLoad() above,
// mirroring syncCachedHrLthrEstimate()'s rationale exactly: on a fresh page
// load state.trainerPage.blendedLoad.activities starts back at null (in-
// memory only), so a reload with equipmentMode already 'hr' would otherwise
// show "Unbekannt" freshness until the network pipeline runs again this
// session, even though the raw rows are sitting in BLENDED_LOAD_CACHE_KEY
// from last time. No network call here. Called lazily from
// trainerRiderContext() so it costs nothing on the power-only path.
function syncCachedBlendedLoad(){
  const rows = Object.values(loadBlendedLoadCache());
  if(rows.length) state.trainerPage.blendedLoad.activities = rows;
  // Restore the persisted fetch-attempt timestamp too, so a page reload
  // within BLENDED_LOAD_REFRESH_MS of the last attempt doesn't look "stale"
  // in trainerRiderContext() and immediately re-fetch on first render.
  // Only overwrite when a persisted value actually exists: loadBlendedTrainingLoad()
  // already stamps fetchedAt in memory synchronously before its first await, so if
  // saveBlendedLoadFetchedAt() silently failed (private-mode Safari, quota pressure)
  // this must not clobber that fresh stamp back down to 0 -- doing so would make
  // every render look stale again and re-trigger a fetch loop against a failing API.
  const persisted = loadBlendedLoadFetchedAt();
  if(persisted) state.trainerPage.blendedLoad.fetchedAt = persisted;
}

function trainerRiderContext(pp){
  const rp0 = pp.riderProfile;
  if(!rp0) return null;
  const results = pp.results || [];
  const today = new Date();
  const daysAgo = d => (today-d)/86400000;

  // HF-only resolved LTHR, mirroring rp0.ftp/rp0.ftpSource's shape exactly.
  // rp.lthr/rp.lthrSource/rp.usingHr are read throughout the Trainer tab
  // (charts, step list, zone legend, context cards, gate, generation and
  // evaluation). Resolved BEFORE the load/acwr block below (moved up from
  // this function's original layout) since the blended-load branch needs
  // `lthr` for its hrTSS fallback -- purely a reordering, no behavior change
  // for the lthr/lthrSource/usingHr values themselves.
  //
  // Lazy cache-only fallback (see syncCachedHrLthrEstimate() above) so a
  // reload with equipmentMode already 'hr' doesn't fire the empty-state gate
  // before the full loadHrLthrEstimate() network pipeline has ever run this
  // session. Skipped once that pipeline has run (tp.hrProfile.loaded) so it
  // doesn't fight a real "no estimate found" outcome on every render.
  if(state.equipmentMode === 'hr' && !state.trainerPage.hrProfile.estimate && !state.trainerPage.hrProfile.loaded && !TRAINING_CONFIG.rider.lthrOverride){
    syncCachedHrLthrEstimate();
  }
  const lthrOverride = TRAINING_CONFIG.rider.lthrOverride;
  const lthrEstimate = state.trainerPage.hrProfile.estimate;
  const lthr = lthrOverride || lthrEstimate || null;
  const lthrSource = lthrOverride ? 'manuell in den Einstellungen hinterlegt'
    : (lthrEstimate ? 'aus deinen Fahrten geschätzt' : null);
  const usingHr = state.equipmentMode === 'hr';

  // Trainingsbelastung: power path is byte-for-byte pp.trainingLoad, exactly
  // as before this phase -- zero change for power users. HF path switches to
  // the additive blend source (buildBlendedTrainingLoad, see above), with the
  // same cache-only-on-reload fallback story as the LTHR estimate above.
  let load;
  if(usingHr){
    if(!state.trainerPage.blendedLoad.activities && !state.trainerPage.blendedLoad.loaded){
      syncCachedBlendedLoad();
    }
    // Bug 1 fix (round 2): refresh trigger from the render path itself, not
    // just the equipmentMode toggle's onchange handler (buildEquipmentModeCard()).
    // Without this, a rider who leaves equipmentMode='hr' set across sessions
    // only ever gets ONE fetch (from that first toggle flip) and every later
    // render/reload reads an increasingly stale localStorage snapshot forever
    // -- ACWR silently decays toward 0, the exact inverse of the overload-
    // protection this feature exists for.
    //
    // NOTE: the first version of this fix gated "stale" on the newest CACHED
    // RIDE's date (>1 day old). That re-triggers on every render whenever the
    // rider simply hasn't ridden today (any rest day), or the fetch keeps
    // failing, or the account has zero rides -- fetching never makes the
    // rider's last ride any newer, so render() -> stale -> fetch -> render()
    // -> stale -> fetch -> ... looped without bound. Gating on "did we already
    // ATTEMPT a fetch recently" (fetchedAt, set unconditionally -- success or
    // failure -- at the start of loadBlendedTrainingLoad() and persisted via
    // BLENDED_LOAD_FETCHED_AT_KEY so a page reload doesn't forget it) bounds
    // retries to once per BLENDED_LOAD_REFRESH_MS regardless of outcome,
    // fixing the loop while still refreshing periodically.
    //
    // Deferred via setTimeout(0) rather than calling loadBlendedTrainingLoad()
    // directly here: that function calls render() synchronously before its
    // first await, and trainerRiderContext() itself runs synchronously
    // inside an in-progress render() call (renderTrainerPage() -> here). A
    // same-tick render() call would re-enter the outer render() while it's
    // still building the current DOM tree (app.innerHTML was already
    // cleared) and end up appending a duplicated tree. Deferring to the next
    // tick lets the current render() finish first, so the refresh's own
    // render() is a normal, independent one. blendedLoad.loading is still
    // the guard that prevents duplicate concurrent fetches: even if several
    // renders happen to schedule this before the first callback fires, each
    // scheduled callback checks/sets that flag synchronously and in order,
    // so only the first actually calls the network -- and fetchedAt itself is
    // stamped synchronously at that same moment, before any await, so any
    // further renders in the same tick already see a fresh fetchedAt and
    // don't schedule a second attempt.
    if(state.accessToken && !state.trainerPage.blendedLoad.loading){
      const isStale = (Date.now() - (state.trainerPage.blendedLoad.fetchedAt || 0)) > BLENDED_LOAD_REFRESH_MS;
      if(isStale) setTimeout(()=>{ loadBlendedTrainingLoad(state.accessToken); }, 0);
    }
    load = state.trainerPage.blendedLoad.activities
      ? buildBlendedTrainingLoad(state.trainerPage.blendedLoad.activities, rp0.ftp, lthr)
      : null;
  } else {
    load = pp.trainingLoad;
  }

  const acwr = (load && load.ctl>0) ? load.atl/load.ctl : null;
  const wPerKg = (rp0.weight && rp0.ftp) ? rp0.ftp/rp0.weight : null;

  // Issue 4 fix: hoursIn7/ridesIn7/daysSinceHard/daysSinceRide used to be
  // derived from `results` (pp.results) unconditionally, even in HR mode --
  // but pp.results is Profil's device_watts-filtered pipeline (~2670) and is
  // always empty for HR-only riders, so "Woche bisher" permanently showed
  // "0,0 h / 0 Fahrten", "Letzte harte Einheit" permanently showed "keine
  // erkannt", and the rodeHardYesterday/hoursIn7>8 branches that feed
  // forceEasy/volume logic (~7292, 7478, 7559) were permanently dead in HR
  // mode -- silently weakening the overload guard on top of Bug 1. The HR
  // branch below derives the same four metrics from the blended-load cache
  // rows instead (same raw per-ride data buildBlendedTrainingLoad() above
  // uses -- date + moving_time + watts/heartrate -- covering the rider's
  // full activity history, power+HR combined, not just power rides). The
  // power branch is untouched, byte-for-byte the same computation as before.
  let hoursIn7, ridesIn7, daysSinceHard, daysSinceRide;
  if(usingHr){
    const blendedRows = state.trainerPage.blendedLoad.activities || [];
    const recentRows = blendedRows.filter(r=>{ const d=new Date(r.date); return !isNaN(d.getTime()) && daysAgo(d)<=7; });
    hoursIn7 = recentRows.reduce((s,r)=>s+(r.moving_time||0),0)/3600;
    ridesIn7 = recentRows.length;
    // "Hard" mirrors the power path's >=93%-of-threshold definition, just
    // sourced per-ride from whichever metric that ride actually has: NP vs
    // FTP when it's a power ride, avg HR vs LTHR otherwise (same fallback
    // buildBlendedTrainingLoad() uses for its per-ride TSS above).
    const hardBlendedRows = blendedRows.filter(r=>{
      if(r.device_watts && r.weighted_average_watts && rp0.ftp) return r.weighted_average_watts >= rp0.ftp*0.93;
      if(r.average_heartrate != null && lthr) return r.average_heartrate >= lthr*0.93;
      return false;
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lastHardBlended = hardBlendedRows.length ? hardBlendedRows[hardBlendedRows.length-1] : null;
    daysSinceHard = lastHardBlended ? Math.floor(daysAgo(new Date(lastHardBlended.date))) : null;
    const sortedRows = blendedRows.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lastBlendedRide = sortedRows.length ? sortedRows[sortedRows.length-1] : null;
    daysSinceRide = lastBlendedRide ? Math.floor(daysAgo(new Date(lastBlendedRide.date))) : null;
  } else {
    hoursIn7 = results.filter(r=>daysAgo(r.date)<=7).reduce((s,r)=>s+(r.movingSec||0),0)/3600;
    ridesIn7 = results.filter(r=>daysAgo(r.date)<=7).length;
    const hardRides = results.filter(r=>r.confidence!=='unbestätigt' && r.estFtp!=null && rp0.ftp && r.estFtp>=rp0.ftp*0.93);
    const lastHard = hardRides.length ? hardRides[hardRides.length-1] : null;
    daysSinceHard = lastHard ? Math.floor(daysAgo(lastHard.date)) : null;
    const lastRide = results.length ? results[results.length-1] : null;
    daysSinceRide = lastRide ? Math.floor(daysAgo(lastRide.date)) : null;
  }

  let freshness='Unbekannt', freshnessClass='warn', freshnessWhy='Zu wenig Belastungsdaten für eine Frische-Einschätzung.';
  if(acwr!=null){
    if(acwr>1.5){ freshness='Deutlich überlastet'; freshnessClass='danger';
      freshnessWhy=`Deine Ermüdung (ATL) liegt ${Math.round((acwr-1)*100)}% über deiner Fitness (CTL).`; }
    else if(acwr>1.25){ freshness='Erhöhte Belastung'; freshnessClass='warn';
      freshnessWhy=`ATL liegt ${Math.round((acwr-1)*100)}% über CTL – produktiv, aber bald ist ein Entlastungstag fällig.`; }
    else if(acwr<0.75){ freshness='Frisch / untertrainiert'; freshnessClass='good';
      freshnessWhy=`ATL liegt ${Math.round((1-acwr)*100)}% unter CTL. Gut erholt.`; }
    else { freshness='Ausgeglichen'; freshnessClass='good'; freshnessWhy='Deine Ermüdung entspricht ungefähr deiner Fitness.'; }
  }

  // blendedLoad is exposed (not just acwr) so renderTrainerSummaryCards() can
  // show real Fitness/Ermüdung/Form cards for HR-only riders too, instead of
  // permanent "–" placeholders next to a working Frische/ACWR card -- the
  // rows already carry ctl/atl/tsb/formVerdict, computed identically to
  // pp.trainingLoad's (see buildBlendedTrainingLoad()'s own comment).
  return { ...rp0, wPerKg, acwr, freshness, freshnessClass, freshnessWhy, hoursIn7, ridesIn7, daysSinceHard, daysSinceRide, lthr, lthrSource, usingHr, blendedLoad: usingHr ? load : null,
    speedModel: computeSpeedModel(results) };
}

// rp.usingHr branches to a simplified hrTSS (TrainingPeaks methodology:
// IF_HR = avgHR/LTHR, hrTSS = hours × IF_HR² × 100) instead of NP⁴-weighted
// power TSS -- HR has no NP-equivalent (it's already a self-smoothing,
// slower-moving signal than power, so a rolling 4th-power average would just
// double-smooth it, not add information). The full TrainingPeaks hrTSS
// formula also curve-corrects at very low/high HR; that correction needs a
// reference table this app doesn't have without an external library, so this
// is a deliberate simplification -- plain time-weighted IF_HR², no curve fit.
// `np`/`avgPower` are reused (not renamed) to keep this a single return
// shape both branches' one caller can consume identically; in the HR branch
// they both just hold the time-weighted average target bpm (no NP-style
// weighting exists to make them diverge from one another the way real
// power's np vs avgPower do).
function workoutMetrics(steps, rp){
  const usingHr = rp.usingHr;
  const metricValue = usingHr ? rp.lthr : rp.ftp;
  let totalSec=0;
  if(usingHr){
    let sumPctSec=0;
    steps.forEach(s=>{ const sec=s.minutes*60; totalSec+=sec; sumPctSec+=s.pct*sec; });
    if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0 };
    const avgIF = sumPctSec/totalSec, avgHrTarget = avgIF*metricValue, hours = totalSec/3600;
    return { totalMin:Math.round(totalSec/60), np:Math.round(avgHrTarget), avgPower:Math.round(avgHrTarget), intensityFactor:avgIF,
      tss: Math.round(hours*avgIF*avgIF*100) };
  }
  let sumP4=0, sumP=0;
  steps.forEach(s=>{ const sec=s.minutes*60, w=s.pct*metricValue; totalSec+=sec; sumP4+=Math.pow(w,4)*sec; sumP+=w*sec; });
  if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0 };
  const np=Math.pow(sumP4/totalSec,0.25), intensityFactor=np/metricValue;
  return { totalMin:Math.round(totalSec/60), np:Math.round(np), avgPower:Math.round(sumP/totalSec), intensityFactor,
    tss: Math.round((totalSec*np*intensityFactor)/(metricValue*3600)*100) };
}

// ---------- Trainer: route-based training ----------
// Turns an attached GPX/Strava route into a workout whose hard efforts sit on
// the route's own terrain (climbs) instead of being generic time blocks —
// ported near-verbatim from the Artifact (haversine/GPX parsing itself is
// NOT duplicated here — see handleTrainerGpxFile()/attachSavedStravaRouteToTrainer()
// below, which build the same {lat,lon,ele,dist} point shape by reusing
// VeloCast's own parseGpxTrack()/fetchRouteStreams()/buildCumulativeDistances()).
function smoothElevation(pts, windowM){
  const n = pts.length;
  const out = new Array(n);
  let lo = 0, hi = 0, sum = 0, cnt = 0;
  for(let i=0;i<n;i++){
    while(hi < n && pts[hi].dist - pts[i].dist <= windowM/2){ if(pts[hi].ele!=null){ sum+=pts[hi].ele; cnt++; } hi++; }
    while(lo < i && pts[i].dist - pts[lo].dist > windowM/2){ if(pts[lo].ele!=null){ sum-=pts[lo].ele; cnt--; } lo++; }
    out[i] = cnt>0 ? sum/cnt : (pts[i].ele??0);
  }
  return out;
}
function computeCurvature(pts, windowM){
  windowM = windowM == null ? 300 : windowM;
  const n = pts.length;
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const bearing = new Array(n).fill(0);
  for(let i=0;i<n-1;i++){
    const lat1=toRad(pts[i].lat), lat2=toRad(pts[i+1].lat), dLon=toRad(pts[i+1].lon-pts[i].lon);
    const y = Math.sin(dLon)*Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    bearing[i] = (toDeg(Math.atan2(y,x))+360)%360;
  }
  bearing[n-1] = n>1 ? bearing[n-2] : 0;
  const turn = new Array(n).fill(0);
  for(let i=1;i<n-1;i++){
    let d = Math.abs(bearing[i]-bearing[i-1]);
    if(d > 180) d = 360-d;
    turn[i] = d;
  }
  const curviness = new Array(n).fill(0);
  let lo=0, hi=0, sum=0;
  for(let i=0;i<n;i++){
    while(hi<n && pts[hi].dist-pts[i].dist <= windowM/2){ sum+=turn[hi]; hi++; }
    while(lo<i && pts[i].dist-pts[lo].dist > windowM/2){ sum-=turn[lo]; lo++; }
    const hiIdx = Math.min(hi, n-1), loIdx = Math.min(lo, n-1);
    const span = Math.max(1, pts[hiIdx].dist - pts[loIdx].dist);
    curviness[i] = sum/span*1000;
  }
  return curviness;
}
function detectIntersectionCandidates(pts, thresholdDeg, minGapM){
  thresholdDeg = thresholdDeg == null ? 55 : thresholdDeg;
  minGapM = minGapM == null ? 25 : minGapM;
  const n = pts.length;
  if(n < 3) return [];
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const bearing = new Array(n-1).fill(0);
  for(let i=0;i<n-1;i++){
    const lat1=toRad(pts[i].lat), lat2=toRad(pts[i+1].lat), dLon=toRad(pts[i+1].lon-pts[i].lon);
    const y = Math.sin(dLon)*Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    bearing[i] = (toDeg(Math.atan2(y,x))+360)%360;
  }
  const out = [];
  for(let i=1;i<n-1;i++){
    const gapM = pts[i+1].dist - pts[i-1].dist;
    if(gapM <= 0 || gapM > minGapM) continue;
    let d = Math.abs(bearing[i]-bearing[i-1]);
    if(d > 180) d = 360-d;
    if(d >= thresholdDeg) out.push({ idx:i, dist:pts[i].dist, turnDeg:Math.round(d) });
  }
  return out;
}
function analyzeRoute(pts, config){
  config = config || TRAINING_CONFIG;
  const rg = config.routeGeneration;
  const curvyThreshold = config.constraints.common.curveDensityThresholdDegPerKm;
  const n = pts.length;
  if(n < 2) return null;
  const totalDistanceM = pts[n-1].dist;
  const smoothed = smoothElevation(pts, rg.elevationSmoothingM);
  const curvinessArr = computeCurvature(pts, rg.curvinessWindowM);

  const LOOKAHEAD_M = rg.gradientLookaheadM, CLIMB_TH = rg.climbGradientThresholdPct, DESCENT_TH = rg.descentGradientThresholdPct;
  const classOf = g => g >= CLIMB_TH ? 'climb' : (g <= DESCENT_TH ? 'descent' : 'flat');
  const grad = new Array(n).fill(0);
  let j = 0;
  for(let i=0;i<n;i++){
    if(j < i) j = i;
    while(j < n-1 && pts[j].dist - pts[i].dist < LOOKAHEAD_M) j++;
    const dd = pts[j].dist - pts[i].dist;
    grad[i] = dd > 5 ? (smoothed[j]-smoothed[i])/dd*100 : 0;
  }

  let raw = [], curClass = classOf(grad[0]), start = 0;
  for(let i=1;i<n;i++){
    const c = classOf(grad[i]);
    if(c !== curClass){ raw.push({ type:curClass, startIdx:start, endIdx:i }); curClass = c; start = i; }
  }
  raw.push({ type:curClass, startIdx:start, endIdx:n-1 });

  const MIN_SEG_M = rg.minSegmentM;
  let merged = [];
  raw.forEach(seg => {
    const distM = pts[seg.endIdx].dist - pts[seg.startIdx].dist;
    if(distM < MIN_SEG_M && merged.length) merged[merged.length-1].endIdx = seg.endIdx;
    else merged.push({ ...seg });
  });
  if(merged.length > 1 && (pts[merged[0].endIdx].dist - pts[merged[0].startIdx].dist) < MIN_SEG_M){
    merged[1].startIdx = merged[0].startIdx;
    merged.shift();
  }

  const rawTyped = merged.map(seg => {
    const p0 = pts[seg.startIdx], p1 = pts[seg.endIdx];
    const e0 = smoothed[seg.startIdx], e1 = smoothed[seg.endIdx];
    const distanceM = p1.dist - p0.dist;
    const elevChangeM = e1 - e0;
    const avgGradient = distanceM > 0 ? elevChangeM/distanceM*100 : 0;
    const type = avgGradient >= CLIMB_TH ? 'climb' : (avgGradient <= DESCENT_TH ? 'descent' : 'flat');
    let curveSum = 0, curveCount = 0;
    for(let i=seg.startIdx;i<=seg.endIdx;i++){ curveSum += curvinessArr[i]; curveCount++; }
    const avgCurviness = curveCount ? curveSum/curveCount : 0;
    return { type, startDist:p0.dist, endDist:p1.dist, distanceM, elevChangeM, avgGradient,
             startIdx:seg.startIdx, endIdx:seg.endIdx, avgCurviness, curvy: avgCurviness > curvyThreshold };
  });

  // Der Merge oben entfernt nur zu kurze Zwischenabschnitte, indem sie in den
  // jeweils vorherigen Roh-Abschnitt aufgenommen werden; der Typ jedes
  // gemergten Abschnitts wird danach aus dessen tatsächlichem Höhenprofil neu
  // berechnet (oben). Das kann dazu führen, dass zwei direkt benachbarte
  // Abschnitte zufällig wieder denselben Typ bekommen, ohne je zu einem
  // Abschnitt verschmolzen worden zu sein -- sichtbar z.B. als mehrere
  // aufeinanderfolgende "Verbindung"-Schritte mit identischer Ziel-Leistung
  // im exportierten Workout, da baselinePctForSegment() nur nach `type`
  // unterscheidet. Zweiter Durchgang: direkt benachbarte, gleich-typige
  // Abschnitte zu einem zusammenfassen. Der gewichtete Mittelwert zweier
  // Gradienten, die beide in derselben Klassifikations-Spanne liegen, bleibt
  // zwangsläufig in derselben Spanne -- der Typ muss danach nicht neu geprüft
  // werden.
  const segments = [];
  rawTyped.forEach(seg => {
    const prev = segments[segments.length-1];
    if(prev && prev.type === seg.type){
      const distanceM = prev.distanceM + seg.distanceM;
      const elevChangeM = prev.elevChangeM + seg.elevChangeM;
      const avgGradient = distanceM > 0 ? elevChangeM/distanceM*100 : 0;
      const avgCurviness = distanceM > 0
        ? (prev.avgCurviness*prev.distanceM + seg.avgCurviness*seg.distanceM)/distanceM : 0;
      Object.assign(prev, { endDist:seg.endDist, endIdx:seg.endIdx, distanceM, elevChangeM, avgGradient,
                             avgCurviness, curvy: avgCurviness > curvyThreshold });
    } else {
      segments.push({ ...seg });
    }
  });

  let totalElevGainM = 0;
  for(let i=1;i<n;i++){ const d = smoothed[i]-smoothed[i-1]; if(d>0) totalElevGainM += d; }

  const climbs = segments.filter(s=>s.type==='climb' && s.distanceM>=150).sort((a,b)=>b.distanceM-a.distanceM);

  return { points: pts, smoothed, totalDistanceM, totalElevGainM, segments, climbs };
}
function gradientSuitability(gradient, band){
  const g = gradient == null ? 0 : gradient;
  if(!band) return 'unsuitable';
  if(g >= band.idealMin && g <= band.idealMax) return 'ideal';
  if(g >= band.acceptableMin && g <= band.acceptableMax) return 'acceptable';
  return 'unsuitable';
}
function segmentHasIntersection(segment, intersections){
  return (intersections||[]).some(p => p.dist >= segment.startDist && p.dist <= segment.endDist);
}
function evaluateSegmentForClass(segment, classKey, config, opts){
  opts = opts || {};
  const cc = config.constraints.byClass[classKey];
  const reasons = [];
  if(!cc || segment.type === 'descent'){
    return { tier:'unsuitable', reasons:['Gefälle wird für harte Trainingsreize nicht genutzt.'] };
  }
  let tier = gradientSuitability(segment.avgGradient, cc.gradient);
  if(tier === 'unsuitable') reasons.push('Steigung außerhalb des zulässigen Bereichs für diese Klasse.');
  if(!opts.ignoreCurve && segment.curvy){ tier = 'unsuitable'; reasons.push('Abschnitt zu kurvig.'); }
  if(!opts.ignoreIntersections && segmentHasIntersection(segment, opts.intersections)){
    tier = 'unsuitable'; reasons.push('Mögliche Kreuzung/Stop im Abschnitt erkannt.');
  }
  return { tier, reasons };
}
function computeRouteSuitability(route, classKey, config, options){
  const cc = config.constraints.byClass[classKey];
  if(!cc || !route || !route.segments || !route.segments.length){
    return { score:0, workableKm:0, reasons:['Keine Streckendaten vorhanden.'] };
  }
  options = options || {};
  const ignoreCurve = !!options.ignoreCurveConstraints;
  const ignoreIntersections = !!options.ignoreIntersectionConstraints;
  const intersections = options.intersectionCandidates
    || detectIntersectionCandidates(route.points, config.constraints.common.intersectionTurnDeg, config.constraints.common.intersectionGapM);

  let workableM = 0, eligibleM = 0;
  route.segments.forEach(seg => {
    if(seg.type === 'descent') return;
    eligibleM += seg.distanceM;
    const verdict = evaluateSegmentForClass(seg, classKey, config, { ignoreCurve, ignoreIntersections, intersections });
    if(verdict.tier === 'ideal') workableM += seg.distanceM;
    else if(verdict.tier === 'acceptable') workableM += seg.distanceM * 0.6;
  });

  const workableKm = workableM/1000;
  const routeKm = route.totalDistanceM/1000;
  let score = eligibleM > 0 ? Math.round(Math.min(100, workableM/eligibleM*100)) : 0;
  const reasons = [];
  if(routeKm < (cc.minRouteKm||0)){
    score = Math.min(score, 35);
    reasons.push(`Route ist mit ${routeKm.toFixed(0)}km kürzer als die für diese Klasse empfohlenen ${cc.minRouteKm}km.`);
  }
  if(workableKm < (cc.minWorkableKm||0)){
    score = Math.min(score, 40);
    reasons.push(`Nur ${workableKm.toFixed(1)}km geeignetes Terrain gefunden (empfohlen: ${cc.minWorkableKm}km).`);
  }
  if(!reasons.length && score < config.suitability.minAcceptable){
    reasons.push('Zu wenig zusammenhängend geeignetes Terrain für diese Trainingsklasse.');
  }
  return { score, workableKm: Math.round(workableKm*10)/10, reasons };
}

// Gleiche Test-Reihenfolge wie der ursprüngliche if-Chain (NICHT nach
// numerischem Wert sortiert -- g>=6 wird vor g<=-4 geprüft usw.), damit die
// Bucket-Zuordnung für estimateSpeedKmh()'s Fallback byte-identisch zum
// bisherigen Verhalten bleibt. fallbackKmh greift, solange rp.speedModel für
// diese Zelle noch keine ausreichend kalibrierten Daten hat (siehe
// computeSpeedModel unten).
const GRADIENT_BUCKETS = [
  { test: g => g >= 6,  fallbackKmh: 12 },
  { test: g => g >= 3,  fallbackKmh: 16 },
  { test: g => g >= 1,  fallbackKmh: 20 },
  { test: g => g <= -4, fallbackKmh: 42 },
  { test: g => g <= -1, fallbackKmh: 32 },
  { test: () => true,   fallbackKmh: 27 },
];
const GRADIENT_BUCKET_LABELS = ['Steiler Anstieg (≥6%)','Anstieg (3–6%)','Leichter Anstieg (1–3%)',
  'Steile Abfahrt (≤-4%)','Abfahrt (-4…-1%)','Flach (-1…1%)'];
