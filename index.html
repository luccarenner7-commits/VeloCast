        el("button", {class:"btn secondary", style:"padding:8px 14px; font-size:12px;", onclick:()=>{
          // Same capture-before-clear + scroll-back idiom as renderRouteCard()'s
          // equivalent back button above — see its comment for why.
          const segId = seg.id, source = "starred";
          state.selectedSegmentId = null; state.selectedSegmentSource = null;
          render();
          requestAnimationFrame(()=>{
            document.getElementById(`segment-row-${source}-${segId}`)?.scrollIntoView({behavior:"smooth", block:"center"});
          });
        }}, ["Zurück zur Liste"])
      ]));
      card.appendChild(renderSegmentRow(seg, bucket, {clickable:false}));
      card.appendChild(renderSegmentLeaderboard(seg));
      card.appendChild(routeMapContainer);
      return card;
    }
  }

  return renderSegmentsCard();
}

// "Abgeschlossene Segmente" — segments actually ridden/completed on the
// currently selected Strava ACTIVITY (see ensureRideSegments()), rendered
// with the exact same row treatment as the starred-segments list via the
// shared bucket-based functions above. Only meaningful for a genuine ridden
// activity; a planned/saved route or an uploaded GPX file gets an honest
// explanatory message instead (nothing has been "completed" on those), and
// so does the not-connected case (the activity-detail endpoint needs a
// token).
function renderRouteSegmentsCard(){
  if(!state.fullRouteCoords.length) return null;
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Abgeschlossene Segmente"]));

  const activity = state.selectedActivity;
  const isRideActivity = !!(state.connected && activity && !activity.isRoute && !activity.isGpx);

  if(!isRideActivity){
    card.appendChild(el("div", {class:"muted"}, [
      "Nur für bereits gefahrene Aktivitäten verfügbar - geplante Routen und GPX-Dateien haben noch keine abgeschlossenen Segmente."
    ]));
    return card;
  }

  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px; font-size:12px;"}, [
    "Segmente, die auf dieser Fahrt tatsächlich gefahren und abgeschlossen wurden."
  ]));

  if(state.loading.routeSegments){
    card.appendChild(el("div", {class:"loading"}, ["Lade Segmente…"]));
    return card;
  }

  // Local error display for THIS feature — state.error (rendered only inside
  // renderGpxUploadRow() on the GPX tab) would leave a failed "Segmente
  // laden" fetch invisible on every other tab/page, and could linger stale
  // into unrelated later views. routeSegmentsError is scoped to this card
  // and cleared by resetRouteSegments() (selection change) and at the start
  // of every ensureRideSegments() run (retry).
  if(state.routeSegmentsError){
    card.appendChild(el("div", {class:"error", style:"margin-bottom:14px;"}, [state.routeSegmentsError]));
  }

  // Not fetched yet for this activity (also true after a failure — see
  // above) — manual trigger only (see ensureRideSegments()'s comment for why
  // this never runs automatically).
  if(!state.routeSegmentsFetched){
    card.appendChild(el("button", {
      class:"btn secondary", style:"width:100%;",
      onclick: ()=>ensureRideSegments()
    }, ["Segmente laden"]));
    return card;
  }

  const bucket = segmentBucket("route");
  if(!bucket.list.length){
    // Reached only when routeSegmentsFetched is true, i.e. the fetch
    // genuinely completed — never on failure, which returns above instead.
    // A truly empty result here is a normal outcome (a short/flat ride with
    // no segments on it), not an error. No sort dropdown either — nothing to
    // sort.
    card.appendChild(el("div", {class:"muted"}, ["Auf dieser Fahrt wurden keine Segmente abgeschlossen."]));
    return card;
  }

  syncPersistentInputValue(routeSegmentSortSelect, state.routeSegmentSortBy);
  card.appendChild(el("div", {style:"margin-bottom:14px;"}, [
    el("label", {}, ["Sortierung"]),
    routeSegmentSortSelect
  ]));

  // Same shared state.hideIrrelevantSegments field as "Meine Segmente"'s
  // switch (see renderToggleSwitch()'s comment) — a segment marked
  // irrelevant from either page disappears from both.
  card.appendChild(renderToggleSwitch(
    state.hideIrrelevantSegments,
    "Nicht relevante Segmente ausblenden",
    ()=>{ state.hideIrrelevantSegments = !state.hideIrrelevantSegments; saveSettings(); render(); }
  ));

  // No cap here (unlike sortedVisibleSegments()'s starred-only slice(0,12)):
  // ensureRideSegments()/loadSegmentExtras() above now fetch every completed
  // segment for this ride, so the card must show all of them too — that's
  // the whole point of "Abgeschlossene Segmente".
  const list = sortedRouteSegments(bucket);
  list.forEach(seg => card.appendChild(renderSegmentRow(seg, bucket)));
  return card;
}

function renderFootnote(){
  return el("div", {class:"footnote"}, [
    "Wetterdaten: Open-Meteo. Wind wird an ausgewählten Punkten entlang der Strecke bzw. am Startpunkt jedes Segments abgefragt und mit der Streckenrichtung verglichen. ",
    state.connected ? el("a", {href:"#", onclick:(e)=>{e.preventDefault(); loadActivitiesAndSegments();}}, ["Neu laden"]) : ""
  ]);
}

// ---------- init ----------
async function init(){
  render();

  // Strava just redirected back to this page with ?code=...
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code");
  let justConnected = false;
  if(codeParam){
    window.history.replaceState({}, document.title, window.location.pathname);
    await connectWithCode(codeParam);
    justConnected = true;
  }

  if(!justConnected){
    const stored = await loadStoredToken();
    if(stored){
      state.loading.connect = true; render();
      try{
        const tokenData = await refreshAccessToken(stored);
        state.accessToken = tokenData.access_token;
        await saveToken(tokenData.refresh_token);
        state.connected = true;
        await loadActivitiesAndSegments();
      }catch(e){
        // stored token invalid, stay on connect screen
      }
      state.loading.connect = false;
      render();
    }
  }
}
init();
</script>
