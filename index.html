    pct: totalMin>0 ? mins[i]/totalMin*100 : 0 }));
  return { zones, totalMin };
}
function actualWeekZoneBreakdown(results){
  const now = new Date();
  const day = (now.getDay()+6)%7;
  const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  const nextMonday = new Date(monday); nextMonday.setDate(monday.getDate()+7);
  const secs = POWER_ZONE_META.map(()=>0);
  const qualitySecs = POWER_ZONE_META.map(()=>0);
  let totalSec = 0, rides = 0;
  (results||[]).forEach(r => {
    const d = new Date(r.date);
    if(d < monday || d >= nextMonday) return;
    if(!r.metrics || !Array.isArray(r.metrics.zoneTimes)) return;
    rides++;
    // Same fallback as weeklyClassProgress()/trainedOnDate(): cached rows
    // computed before intervalZoneTimes existed just fall back to the raw
    // zoneTimes, i.e. read as 100% quality rather than 0%.
    const qzt = Array.isArray(r.metrics.intervalZoneTimes) ? r.metrics.intervalZoneTimes : r.metrics.zoneTimes;
    r.metrics.zoneTimes.forEach((t,i)=>{
      if(i>=secs.length) return;
      secs[i]+=t; totalSec+=t;
      qualitySecs[i] += qzt[i]||0;
    });
  });
  // Quality-% is only meaningful for classes with an actual minimum-duration
  // gate (TRAINING_CONFIG.intervalDetection) -- for ungated zones (recovery/
  // endurance/sprint) intervalZoneTimes is byte-identical to zoneTimes, so
  // the ratio would always read 100 and say nothing; null there means "don't
  // show the overlay" (see appendZoneBars/barRow).
  const gatedZoneIdx = new Set(TRAINING_CLASSES
    .filter(c => c.zoneIdx!=null && TRAINING_CONFIG.intervalDetection.minSecByClass[c.key]!=null)
    .map(c => c.zoneIdx));
  const zones = POWER_ZONE_META.map((z,i)=>({ name:z.name, color:z.color, minutes: secs[i]/60,
    pct: totalSec>0 ? secs[i]/totalSec*100 : 0,
    qualityPct: (gatedZoneIdx.has(i) && secs[i]>0) ? qualitySecs[i]/secs[i]*100 : null }));
  return { zones, totalMin: totalSec/60, rides, weekStart: monday };
}

// ---------- Trainer: time-based (no route) workout generation ----------
// A from-scratch adaptation of the Artifact's original generateWorkout(goal,rp)
// — see this section's header comment for why it's back in the loop instead
// of staying dead code. `kind` is tagged explicitly on every step (the
// Artifact inferred it ad hoc from `pct>=0.85`) so evaluateWorkout() and
// workoutMetrics()/FIT export all agree on which steps are the "hard" ones,
// and the per-goal adaptive-learning factor (LEARNABLE_GOALS) is applied
// directly to those hard steps' target %FTP here, same effect the Artifact's
// route-based path got via buildIntervalSpec's `adj` multiplier.
function generateTimeBasedWorkout(classKey, rp, learning){
  const goal = TRAINING_CLASS_TO_GENERATOR_GOAL[classKey] || 'endurance';
  const acwr = rp.acwr;
  const overloaded = acwr!=null && acwr>1.5;
  const elevated = acwr!=null && acwr>1.25;
  const fresh = acwr!=null && acwr<0.75;
  const rodeHardYesterday = rp.daysSinceHard!=null && rp.daysSinceHard<=1;
  const forceEasy = overloaded || (rodeHardYesterday && goal!=='recovery' && goal!=='endurance');
  const adj = (learning && learning.factor && learning.factor[goal]) || 1;
  const bump = pct => Math.min(1.5, pct*adj);

  let volumeFactor = 1;
  if(elevated && !overloaded) volumeFactor = 0.8;
  if(fresh) volumeFactor = 1.15;

  const seg = (name,minutes,pct,note,kind) => ({ name, minutes, pct, note: note||null, kind: kind||(pct>=0.85?'interval':'other') });
  let title, steps=[], rationale=[], adaptation;

  if(forceEasy && goal!=='recovery'){
    title='Entlastungsfahrt statt Intervalle';
    adaptation='Erholung / Superkompensation';
    steps=[seg('Einrollen',10,0.50,null,'warmup'), seg('Lockere Grundlage',45,0.62,'Ruhig, gleichmäßig, ohne Antritte','cruise'), seg('Ausrollen',8,0.48,null,'cooldown')];
    rationale.push({ type: overloaded?'danger':'warn',
      title: overloaded?'Deine Belastung ist zu hoch für Intervalle':'Du bist gestern hart gefahren',
      text: overloaded
        ? `${rp.freshnessWhy} Ich überschreibe dein gewähltes Ziel bewusst: eine harte Einheit auf diese Ermüdung draufzusetzen bringt keinen Trainingsreiz mehr. Anpassung passiert in der Erholung.`
        : `Deine letzte harte Einheit ist erst ${rp.daysSinceHard===0?'heute':'einen Tag'} her. Zwei intensive Tage in Folge kosten mehr Form als sie bringen.` });
    return { title, steps, rationale, adaptation, overridden:true, classKey };
  }

  switch(goal){
    case 'ftp': {
      const reps = Math.max(2, Math.round(3*volumeFactor));
      const intervalMin = elevated ? 10 : 12;
      title = `${reps} × ${intervalMin} min an der Schwelle`;
      adaptation='Laktat-Toleranz und Schwellenleistung';
      steps.push(seg('Einrollen',12,0.55,null,'warmup'));
      steps.push(seg('Aktivierung',3,0.80,'2× 30s auf Tempo','activation'));
      for(let i=1;i<=reps;i++){
        steps.push(seg(`Intervall ${i}`,intervalMin,bump(0.97),rp.usingHr ? 'Gleichmäßig, knapp unter/an LTHR' : 'Gleichmäßig, knapp unter/an FTP','interval'));
        if(i<reps) steps.push(seg(`Pause ${i}`,5,0.50,null,'rest'));
      }
      steps.push(seg('Ausrollen',10,0.50,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum Schwellenintervalle',
        text: rp.usingHr
          ? `Schwelle steigt am effizientesten durch längere Blöcke knapp an der Schwelle (95–100%). Bei deiner LTHR von ${rp.lthr} bpm sind das etwa ${Math.round(rp.lthr*0.97)} bpm – "kontrolliert hart", nicht wie ein Wettkampf.`
          : `FTP steigt am effizientesten durch längere Blöcke knapp an der Schwelle (95–100%). Bei deinem FTP von ${rp.ftp} W sind das etwa ${Math.round(rp.ftp*0.97)} W – "kontrolliert hart", nicht wie ein Wettkampf.` });
      break;
    }
    case 'vo2max': {
      const reps = Math.max(4, Math.round(5*volumeFactor));
      title = `${reps} × 3 min VO2max-Intervalle`;
      adaptation='Maximale Sauerstoffaufnahme, Herzleistung';
      steps.push(seg('Einrollen',15,0.55,null,'warmup'));
      steps.push(seg('Aktivierung',4,0.85,'3× 20s hart, je 40s locker','activation'));
      for(let i=1;i<=reps;i++){
        const iv = seg(`VO2max ${i}`,3,bump(1.15),'Hart – die letzten 30s sollen brennen','interval');
        if(rp.usingHr) Object.assign(iv, RPE_TARGET_BY_CLASS.vo2max);
        steps.push(iv);
        if(i<reps) steps.push(seg(`Pause ${i}`,3,0.45,'Vollständig locker rollen','rest'));
      }
      steps.push(seg('Ausrollen',10,0.48,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum 3-Minuten-Intervalle',
        text: rp.usingHr
          ? `VO2max-Reize brauchen Zeit "oben". Bei kurzen, harten 3-Minuten-Intervallen hinkt die Herzfrequenz dem Effort zu weit hinterher, um als Echtzeitziel zu taugen – fahre daher nach Gefühl auf RPE 9 (nahezu maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : `VO2max-Reize brauchen Zeit "oben". 3 Minuten bei ca. ${Math.round(rp.ftp*1.15)} W (115% FTP) mit gleichlanger Pause maximieren die Zeit in diesem Bereich, ohne dass du nach zwei Intervallen einbrichst.` });
      break;
    }
    case 'tempo': {
      const reps = Math.max(2, Math.round(3*volumeFactor));
      const intervalMin = elevated ? 10 : 12;
      title = `${reps} × ${intervalMin} min Sweet Spot`;
      adaptation='Muskuläre Ausdauer im Sweet-Spot-Bereich';
      steps.push(seg('Einrollen',12,0.55,null,'warmup'));
      steps.push(seg('Aktivierung',3,0.78,'2× 30s auf Tempo','activation'));
      for(let i=1;i<=reps;i++){
        steps.push(seg(`Sweet-Spot-Block ${i}`,intervalMin,0.90,'Gleichmäßig, kontrolliert hart','interval'));
        if(i<reps) steps.push(seg(`Pause ${i}`,4,0.55,null,'rest'));
      }
      steps.push(seg('Ausrollen',10,0.50,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum Sweet Spot',
        text: rp.usingHr
          ? 'Sweet Spot (ca. 88–92% LTHR) baut muskuläre Ausdauer auf, mit weniger Erholungsbedarf als echte Schwellenintervalle.'
          : 'Sweet Spot (ca. 88–92% FTP) baut muskuläre Ausdauer auf, mit weniger Erholungsbedarf als echte Schwellenintervalle.' });
      break;
    }
    case 'endurance': {
      const baseMin = Math.round((rp.hoursIn7>8?150:120)*volumeFactor);
      title = `${Math.round(baseMin/60*10)/10} h Grundlagenfahrt`;
      adaptation='Fettstoffwechsel, Kapillarisierung, Ermüdungsresistenz';
      steps.push(seg('Einrollen',10,0.52,null,'warmup'));
      steps.push(seg('Grundlage Teil 1',Math.round(baseMin*0.45),0.68,'Du solltest sprechen können','cruise'));
      steps.push(seg('Tempo-Block',15,0.82,'Leicht angehoben, aber weit weg von hart','cruise'));
      steps.push(seg('Grundlage Teil 2',Math.round(baseMin*0.4),0.66,null,'cruise'));
      steps.push(seg('Ausrollen',8,0.50,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum lange und locker',
        text: rp.usingHr
          ? `Grundlagenfahrten wirken über Dauer, nicht Intensität. Bei ca. ${Math.round(rp.lthr*0.67)} bpm bleibst du im Fettstoffwechsel. Die Versuchung ist, "ein bisschen schneller" zu fahren – das macht die Einheit härter, ohne sie wirksamer zu machen.`
          : `Grundlagenfahrten wirken über Dauer, nicht Intensität. Bei ca. ${Math.round(rp.ftp*0.67)} W bleibst du im Fettstoffwechsel. Die Versuchung ist, "ein bisschen schneller" zu fahren – das macht die Einheit härter, ohne sie wirksamer zu machen.` });
      break;
    }
    case 'anaerobic': {
      const sets = Math.max(2, Math.round(3*volumeFactor));
      title = `${sets} Sätze à 5 × 30 s All-out`;
      adaptation='Anaerobe Kapazität, neuromuskuläre Spitzenleistung';
      steps.push(seg('Einrollen',15,0.55,null,'warmup'));
      steps.push(seg('Aktivierung',5,0.85,'3× 15s Sprints mit langer Pause','activation'));
      for(let s2=1;s2<=sets;s2++){
        for(let i=1;i<=5;i++){
          const iv = seg(`Satz ${s2} – Sprint ${i}`,0.5,bump(1.55),'Maximal, aus dem Sattel','interval');
          if(rp.usingHr) Object.assign(iv, RPE_TARGET_BY_CLASS.anaerobic);
          steps.push(iv);
          steps.push(seg('Pause',1.5,0.45,null,'rest'));
        }
        if(s2<sets) steps.push(seg(`Satzpause ${s2}`,8,0.50,'Komplett locker','rest'));
      }
      steps.push(seg('Ausrollen',10,0.48,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum kurze All-out-Sprints',
        text: rp.usingHr
          ? `Anaerobe Kapazität trainierst du nur mit maximalen, kurzen Belastungen und viel Pause. Bei so kurzen, maximalen Sprints hinkt die Herzfrequenz dem Effort viel zu weit hinterher, um als Echtzeitziel zu taugen – fahre daher nach Gefühl auf RPE 10 (maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : `Anaerobe Kapazität trainierst du nur mit maximalen, kurzen Belastungen und viel Pause. Deine beste 1-Minuten-Leistung liegt bei ${rp.p1?rp.p1+' W':'unbekannt'} – die Sprints sollen deutlich darüber liegen.` });
      break;
    }
    case 'sprint': {
      const reps = Math.max(4, Math.round(6*volumeFactor));
      title = `${reps} × 15 s Sprints`;
      adaptation='Neuromuskuläre Spitzenleistung, Sprintkraft';
      steps.push(seg('Einrollen',15,0.55,null,'warmup'));
      steps.push(seg('Aktivierung',5,0.85,'3× 10s Antritte mit langer Pause','activation'));
      for(let i=1;i<=reps;i++){
        const iv = seg(`Sprint ${i}`,0.25,bump(1.7),'Maximal, aus dem Sattel','interval');
        if(rp.usingHr) Object.assign(iv, RPE_TARGET_BY_CLASS.sprint);
        steps.push(iv);
        if(i<reps) steps.push(seg(`Pause ${i}`,4,0.48,'Vollständig locker rollen','rest'));
      }
      steps.push(seg('Ausrollen',10,0.48,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum sehr kurze Sprints',
        text: rp.usingHr
          ? `Neuromuskuläre Leistung trainierst du mit maximalen, sehr kurzen Antritten und vollständiger Erholung dazwischen. Bei 15 s All-out reagiert die Herzfrequenz gar nicht erst schnell genug, um als Ziel zu taugen – fahre daher nach Gefühl auf RPE 10 (maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : 'Neuromuskuläre Leistung trainierst du mit maximalen, sehr kurzen Antritten und vollständiger Erholung dazwischen.' });
      break;
    }
    case 'recovery':
    default: {
      title='Regenerationsfahrt';
      adaptation='Durchblutung, aktive Erholung';
      steps.push(seg('Einrollen',8,0.45,null,'warmup'));
      steps.push(seg('Locker rollen',35,0.55,'Hohe Trittfrequenz, niedriger Druck','cruise'));
      steps.push(seg('Ausrollen',7,0.45,null,'cooldown'));
      rationale.push({ type:'good', title:'Warum so locker',
        text:'Eine Regenerationsfahrt darf sich fast zu leicht anfühlen. Sobald du in Z2/Z3 rutschst, erzeugst du zusätzliche Ermüdung statt sie abzubauen.' });
      break;
    }
  }

  if(fresh && goal!=='recovery') rationale.push({ type:'good', title:'Du bist gut erholt',
    text:`${rp.freshnessWhy} Deshalb habe ich den Umfang leicht angehoben.` });
  else if(elevated && !overloaded && goal!=='recovery') rationale.push({ type:'warn', title:'Umfang reduziert',
    text:`${rp.freshnessWhy} Ich habe die Einheit deshalb kürzer angesetzt als üblich.` });
  if(rp.daysSinceRide!=null && rp.daysSinceRide>=7) rationale.push({ type:'warn',
    title:`Letzte Fahrt vor ${rp.daysSinceRide} Tagen`,
    text: rp.usingHr
      ? 'Nach einer längeren Pause die erste Einheit bewusst konservativ angehen – die Pulswerte von vorher sind gerade nicht dein Maßstab.'
      : 'Nach einer längeren Pause die erste Einheit bewusst konservativ angehen – die Wattwerte von vorher sind gerade nicht dein Maßstab.' });

  return { title, steps, rationale, adaptation, overridden:false, classKey };
}

// ---------- Trainer: deliberate performance test ("Test" class) ----------
// Generates a single deliberate max-effort block at exactly one of
// TEST_DURATIONS_SEC, targeting a conscious margin above the rider's current
// best for that duration (estimateCurrentBestForDuration() above) -- never a
// 1:1 repeat of the existing best (that could never register real
// improvement) and never an undirected "just go all-out" (no target at all).
// No `learning` parameter and NOT in LEARNABLE_GOALS: a one-off max test
// has nothing in common with the repeated, comparable interval sessions the
// adaptive-learning factor is calibrated against, so it must never feed or
// read that factor (see runTrainerEvaluation()'s classKey==='test' guard).
function generateTestWorkout(durationSec, rp){
  const acwr = rp.acwr;
  const overloaded = acwr!=null && acwr>1.5;
  const rodeHardYesterday = rp.daysSinceHard!=null && rp.daysSinceHard<=1;
  const seg = (name,minutes,pct,note,kind) => ({ name, minutes, pct, note: note||null, kind: kind||(pct>=0.85?'interval':'other') });

  // Same overload/freshness safety net as generateTimeBasedWorkout()'s
  // forceEasy branch above -- a maximal test on top of real fatigue wouldn't
  // measure the rider's actual ceiling, only how tired they are, so it's
  // swapped for a recovery ride instead of a deflated, misleading test.
  if(overloaded || rodeHardYesterday){
    return {
      title: 'Entlastungsfahrt statt Test', adaptation: 'Erholung / Superkompensation',
      steps: [seg('Einrollen',10,0.50,null,'warmup'), seg('Lockere Grundlage',45,0.62,'Ruhig, gleichmäßig, ohne Antritte','cruise'), seg('Ausrollen',8,0.48,null,'cooldown')],
      rationale: [{ type: overloaded ? 'danger' : 'warn',
        title: overloaded ? 'Deine Belastung ist zu hoch für einen Test' : 'Du bist gestern hart gefahren',
        text: overloaded
          ? `${rp.freshnessWhy} Ein maximaler Test auf diese Ermüdung draufzusetzen würde ohnehin keinen validen Wert liefern. Anpassung passiert in der Erholung.`
          : `Deine letzte harte Einheit ist erst ${rp.daysSinceHard===0?'heute':'einen Tag'} her. Ein Test unter Resteermüdung würde deine echte Bestleistung nur unterschätzen.` }],
      overridden: true, classKey: 'test', testDurationSec: durationSec, testTargetWatts: null,
    };
  }

  const baseline = estimateCurrentBestForDuration(durationSec, rp);
  if(baseline == null || !rp.ftp){
    return {
      title: 'Test nicht möglich', adaptation: 'Leistungsdaten fehlen', steps: [],
      rationale: [{ type:'warn', title:'Kein Leistungswert verfügbar',
        text:'Für ein Testziel braucht VeloCast einen aktuellen Leistungswert (FTP bzw. eine bisherige Bestleistung für diese Dauer). Ohne Leistungsmesser-Daten aus früheren Fahrten kann kein sinnvolles Testziel berechnet werden.' }],
      overridden: false, classKey: 'test', testDurationSec: durationSec, testTargetWatts: null,
    };
  }

  const margin = TEST_MARGIN_PCT[durationSec] ?? 0.03;
  const targetWatts = Math.round(baseline*(1+margin));
  const pct = targetWatts/rp.ftp;
  const dur = fmtDurLabel(durationSec);
  const minutes = durationSec/60;
  // Only the two short durations (1/5 min) get an RPE target in HF mode --
  // heart rate lags too far behind a 1-5 minute all-out effort to serve as a
  // live target (same reasoning as VO2max/Anaerobic/Sprint's RPE_TARGET_BY_CLASS
  // steps above). The 10/20-minute tests are long enough for HR to track the
  // effort, so they keep a normal %LTHR-equivalent target -- same
  // pct-multiplied-by-rp.lthr path the 'threshold' class already uses via
  // stepTargetValue(), no separate calculation needed. Deliberately gated on
  // durationSec, NOT on TEST_DURATION_CLASS[durationSec] (which maps 600s to
  // 'vo2max' for a different purpose -- see computeTestDueSignal() below --
  // and would incorrectly pull in an RPE target for the 10-minute test too).
  const isShort = durationSec <= 300;
  const targetStep = seg(`Test: ${dur} All-out`, minutes, pct, 'Maximal, möglichst gleichmäßig bis zum Ende durchhalten', 'interval');
  if(rp.usingHr && isShort) Object.assign(targetStep, RPE_TARGET_BY_CLASS[TEST_DURATION_CLASS[durationSec]]);

  const warmupMin = isShort ? 15 : 12;
  const activation = isShort
    ? seg('Aktivierung', durationSec===60?5:4, 0.85, durationSec===60?'3× 15s Antritte mit langer Pause':'3× 20s hart, je 40s locker', 'activation')
    : seg('Aktivierung', 3, 0.80, '2× 30s auf Tempo', 'activation');

  const steps = [
    seg('Einrollen', warmupMin, 0.55, null, 'warmup'),
    activation,
    targetStep,
    seg('Ausrollen', 10, 0.50, null, 'cooldown'),
  ];

  const rationale = [{ type:'good', title:'Warum dieses Ziel',
    text: `Deine aktuell hinterlegte ${dur}-Bestleistung liegt bei ${Math.round(baseline)} W. Das Testziel liegt bewusst ${Math.round(margin*100)}% darüber bei ${targetWatts} W – erreichst oder überschreitest du es, hast du einen frischen, echten Bestwert gefahren. Bestätige den Test danach unten manuell über „Workout auswerten" – VeloCast erkennt eine hochgeladene Fahrt nicht automatisch als diesen Test.` }];

  return { title:`Leistungstest: ${dur} All-out`, steps, rationale, adaptation:'Aktuelle Bestleistung bewusst neu ermitteln',
    overridden:false, classKey:'test', testDurationSec:durationSec, testTargetWatts:targetWatts };
}

// For each of the 4 test durations: "due" when its mapped TRAINING_CLASSES
// class (TEST_DURATION_CLASS) currently sits at HIGH/MEDIUM priority
// (`relevant` -- a test only matters right now if the underlying capacity is
// actually being trained) AND it hasn't been confirmed in >= TEST_STALENESS_DAYS
// days, or never at all (`stale`). Purely additive/read-only over the
// existing priority engine and state.confirmedTests -- computes no new
// priorities or budgets of its own. Sorted by priority tier, then by staleness
// (longest-unconfirmed first) so the single `suggestedDurationSec` picked for
// the duration picker's default is the most urgent one.
function computeTestDueSignal(pp, trainingState, todayIso){
  const tierWeight = { HIGH:3, MEDIUM:2, LOW:1, MAINTENANCE:0 };
  const today = parseIsoDateUTC(todayIso);
  const confirmed = state.confirmedTests || {};
  const entries = TEST_DURATIONS_SEC.map(durationSec => {
    const cls = TEST_DURATION_CLASS[durationSec];
    const tier = (trainingState.priorities && trainingState.priorities[cls]) || 'MAINTENANCE';
    const relevant = tier === 'HIGH' || tier === 'MEDIUM';
    const own = Object.values(confirmed).filter(t => t.durationSec === durationSec);
    const latest = own.length ? own.reduce((a,b)=> new Date(a.confirmedAtIso) > new Date(b.confirmedAtIso) ? a : b) : null;
    const daysSince = latest ? Math.floor((today - parseIsoDateUTC(latest.confirmedAtIso.slice(0,10))) / 86400000) : null;
    const stale = daysSince == null || daysSince >= TEST_STALENESS_DAYS;
    return { durationSec, classKey: cls, tier, relevant, daysSince, stale, due: relevant && stale };
  }).sort((a,b) => {
    const pa = tierWeight[a.tier]||0, pb = tierWeight[b.tier]||0;
    if(pa !== pb) return pb-pa;
    return (b.daysSince ?? Infinity) - (a.daysSince ?? Infinity);
  });
  const dueEntries = entries.filter(e => e.due);
  const suggestedDurationSec = dueEntries.length ? dueEntries[0].durationSec : entries[0].durationSec;
  return { entries, dueEntries, suggestedDurationSec };
}

// ---------- Trainer: route storage (per-day, today only used in Phase 3) ----------
// Same slim-and-cap-by-day pattern as the Artifact's ROUTES_BY_DATE_KEY, own
// "velocast_"-prefixed key so it can never collide with Phase 1/2's caches
// or the main Strecke page's in-memory route state (state.fullRouteCoords
// etc., which this deliberately does NOT touch).
const TRAINER_ROUTES_KEY = 'velocast_trainer_routes';
const TRAINER_ROUTES_MAX_DAYS = 60;
function downsampleTrainerPoints(pts, maxPoints){
  if(pts.length <= maxPoints) return pts;
  const stride = Math.ceil(pts.length/maxPoints);
  const out = [];
  for(let i=0;i<pts.length;i+=stride) out.push(pts[i]);
  if(out[out.length-1] !== pts[pts.length-1]) out.push(pts[pts.length-1]);
  return out;
}
function slimTrainerRoutePoints(pts){
  return downsampleTrainerPoints(pts, 2000).map(p=>({
    lat: Math.round(p.lat*1e5)/1e5, lon: Math.round(p.lon*1e5)/1e5,
    ele: p.ele!=null ? Math.round(p.ele*10)/10 : null, dist: Math.round(p.dist)
  }));
}
function loadTrainerRoutesByDate(){
  try{
    const raw = localStorage.getItem(TRAINER_ROUTES_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return (obj && typeof obj==='object' && !Array.isArray(obj)) ? obj : {};
  }catch(e){ return {}; }
}
function saveTrainerRoutesByDate(all){
  try{ localStorage.setItem(TRAINER_ROUTES_KEY, JSON.stringify(all)); }catch(e){}
}
function saveTrainerRouteForDate(dateKey, fileName, pts){
  const all = loadTrainerRoutesByDate();
  all[dateKey] = { fileName:String(fileName||'Route').slice(0,200), points: slimTrainerRoutePoints(pts), savedAt: new Date().toISOString() };
  const keys = Object.keys(all).sort();
  while(keys.length > TRAINER_ROUTES_MAX_DAYS) delete all[keys.shift()];
  saveTrainerRoutesByDate(all);
}
function removeTrainerRouteForDate(dateKey){
  const all = loadTrainerRoutesByDate();
  if(all[dateKey]){ delete all[dateKey]; saveTrainerRoutesByDate(all); }
}
function loadStoredTrainerRouteForDate(dateKey){
  const all = loadTrainerRoutesByDate();
  const p = all[dateKey];
  if(!p || !Array.isArray(p.points)) return null;
  const pts = p.points.filter(pt=>pt && typeof pt.lat==='number' && typeof pt.lon==='number' && typeof pt.dist==='number');
  if(pts.length < 2) return null;
  return { fileName: typeof p.fileName==='string' ? p.fileName : 'Route', points: pts };
}
const trainerRouteAnalysisCache = new Map();
function getTrainerRouteForDate(dateKey){
  if(trainerRouteAnalysisCache.has(dateKey)) return trainerRouteAnalysisCache.get(dateKey);
  const stored = loadStoredTrainerRouteForDate(dateKey);
  let result = null;
  if(stored){
    try{ result = { fileName: stored.fileName, route: analyzeRoute(stored.points) }; }
    catch(e){ result = null; }
  }
  trainerRouteAnalysisCache.set(dateKey, result);
  return result;
}
function invalidateTrainerRouteCache(dateKey){ trainerRouteAnalysisCache.delete(dateKey); }
// Local (not UTC) calendar-day key for "today" -- new Date().toISOString()
// reads the UTC calendar date, which in Germany (UTC+1/+2) shifts the
// weekly-budget window's Sunday->Monday rollover ~1-2 hours before local
// midnight. localDateKey() (above) already does the correct local-time
// calendar-day computation, so reuse it here instead of reimplementing.
// Note: mondayOfUTC()/parseIsoDateUTC()/addDaysUTC()/toIsoDate() (used by
// the weekly-budget window math once today's key is known) are deliberately
// left UTC-field-based and untouched -- r.date is built from Strava's
// start_date_local, which encodes local wall-clock time with a "Z" suffix,
// so treating its UTC fields as the local calendar fields is already
// correct there. Fixing only the "what day is today" computation here is
// correct and sufficient.
function todayIsoKey(){ return localDateKey(new Date()); }

// GPX upload — reuses parseGpxTrack()/buildCumulativeDistances() (Strecke's
// own GPX pipeline) rather than a second regex-based GPX parser, then zips
// the result into the {lat,lon,ele,dist(meters)} shape analyzeRoute() needs.
function handleTrainerGpxFile(file){
  const tp = state.trainerPage;
  file.text().then(text => {
    const track = parseGpxTrack(text);
    if(!track){ tp.routeError = 'GPX-Datei konnte nicht gelesen werden.'; render(); return; }
    const cumKm = buildCumulativeDistances(track.coords);
    const pts = track.coords.map((c,i)=>({ lat:c[0], lon:c[1], ele: track.eles[i], dist: cumKm[i]*1000 }));
    try{
      const route = analyzeRoute(pts);
      if(!route || route.totalDistanceM < 300) throw new Error('Route zu kurz oder unbrauchbar (unter 300 m).');
      saveTrainerRouteForDate(todayIsoKey(), file.name, pts);
      invalidateTrainerRouteCache(todayIsoKey());
      tp.routeError = null;
    }catch(e){
      tp.routeError = (e && e.message) || String(e);
    }
    tp.workoutPreviewOpen = true;
    render();
  }).catch(()=>{ tp.routeError = 'Datei konnte nicht gelesen werden.'; render(); });
}

// Shared by attachSavedStravaRouteToTrainer() below and the Top-Strecken
// batch scan (ensureTopRouteCandidatesFetched()) — both need to turn a raw
// latlng/altitude/distance stream triple into analyzeRoute()'s {lat,lon,ele,
// dist(meters)} point shape. distance is preferred straight from the stream
// when Strava provides one of matching length; otherwise it's derived from
// latlng via the same haversine cumulative-distance pass used everywhere
// else in the app (buildCumulativeDistances(), km->m).
function streamsToPts(latlng, altitude, distance){
  if(!Array.isArray(latlng) || latlng.length < 2) throw new Error('Für diese Strecke sind keine GPS-Punkte verfügbar.');
  const cumM = (Array.isArray(distance) && distance.length === latlng.length)
    ? distance
    : buildCumulativeDistances(latlng).map(km=>km*1000);
  return latlng.map((p,i)=>({ lat:p[0], lon:p[1], ele: Array.isArray(altitude)?altitude[i]:null, dist: cumM[i] }));
}

// Saved/planned Strava route — reuses fetchRouteStreams() (already used by
// the Strecke page's elevation profile) directly, reading its latlng stream
// too (which normalizeStreams() drops) instead of adding a second fetcher.
async function attachSavedStravaRouteToTrainer(route){
  const tp = state.trainerPage;
  tp.routeError = null;
  tp.loadingRoute = true; render();
  try{
    const raw = await fetchRouteStreams(route.id, state.accessToken);
    const byType = {};
    (Array.isArray(raw)?raw:[]).forEach(s => { if(s && s.type) byType[s.type] = s.data; });
    const pts = streamsToPts(byType.latlng, byType.altitude, byType.distance);
    const analyzed = analyzeRoute(pts);
    if(!analyzed || analyzed.totalDistanceM < 300) throw new Error('Route zu kurz oder unbrauchbar (unter 300 m).');
    saveTrainerRouteForDate(todayIsoKey(), route.name || 'Route', pts);
    invalidateTrainerRouteCache(todayIsoKey());
  }catch(e){
    tp.routeError = (e && e.message) || String(e);
  }
  tp.loadingRoute = false;
  tp.workoutPreviewOpen = true;
  render();
}

// ---------- Trainer: Top-Strecken suitability ranking ----------
// Own cache, isolated from TRAINER_ROUTES_KEY above (that one is "today's
// attached route", a single slot per calendar date that gets overwritten on
// every attach — wrong shape for "every candidate route/activity the
// ranking UI has ever fetched streams for"). Same slim-and-cap convention
// as every other cache in the file (see loadAktivitaetenListCache() etc.):
// defensive parse, sort-by-recency-then-slice on save, smaller fallback cap
// on quota errors. Stores raw slimmed points, never a computed score —
// TRAINING_CONFIG's gradient bands can be overridden any time in
// Einstellungen, so a cached score would go silently stale while cached
// points (route geometry) never do; the score is recomputed live on every
// render instead (cheap, synchronous, no network).
const TOP_ROUTES_CACHE_KEY = 'velocast_top_routes_cache';
const TOP_ROUTES_CACHE_MAX = 150;
function loadTopRoutesCache(){
  try{
    const raw = localStorage.getItem(TOP_ROUTES_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return {};
    const out = {};
    Object.entries(parsed).forEach(([id, entry]) => {
      if(!entry || !Array.isArray(entry.points) || entry.points.length < 2) return;
      out[id] = entry;
    });
    return out;
  }catch(e){ return {}; }
}
function saveTopRoutesCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.entries(cacheObj)
      .sort((a,b) => (b[1].cachedAt||0) - (a[1].cachedAt||0))
      .slice(0, cap);
    const trimmed = {};
    entries.forEach(([id, e]) => { trimmed[id] = e; });
    localStorage.setItem(TOP_ROUTES_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(TOP_ROUTES_CACHE_MAX); }
  catch(e){ try{ attempt(40); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function saveTopRouteCacheEntry(id, entry){
  const all = loadTopRoutesCache();
  all[id] = entry;
  saveTopRoutesCache(all);
}

// In-memory, per-session — mirrors trainerRouteAnalysisCache above, but
// keyed by candidate id instead of date. Lets switching training-class
// chips re-score every candidate (computeRouteSuitability(), cheap) without
// re-running analyzeRoute() on all of them again on every render.
const topRouteAnalysisCache = new Map();
function getAnalyzedTopRoute(id){
  if(topRouteAnalysisCache.has(id)) return topRouteAnalysisCache.get(id);
  const cached = loadTopRoutesCache()[id];
  let result = null;
  if(cached){
    try{ result = analyzeRoute(cached.points); }catch(e){ result = null; }
  }
  topRouteAnalysisCache.set(id, result);
  return result;
}

// Recency cap on the activity side of the candidate pool: state.stravaRoutes
// is already capped by Strava at per_page=30, so this bounds a first-ever
// "Strecken bewerten" click to at most ~50 stream fetches instead of one per
// ride ever completed. A ride from months ago is rarely the relevant
// suggestion for tomorrow's interval session anyway.
const TOP_ROUTES_ACTIVITY_LOOKBACK = 20;

// Combines saved Strava routes (state.stravaRoutes, in-memory only, needs
// ensureStravaRoutesLoaded() to have run) with recently completed rides.
// Reads the activity list straight from its on-disk cache
// (loadAktivitaetenListCache()) rather than state.aktivitaetenPage.items —
// that field is only populated once the Aktivitäten tab has actually loaded
// in this session, whereas the on-disk cache persists across sessions and
// needs no extra fetch to read. Filtered to RIDE_SPORT_TYPES, same
// a.sport_type||a.type fallback already used at the other three call sites
// of that Set.
function buildTopRouteCandidates(){
  const routeCandidates = state.stravaRoutes.map(r => ({
    id: 'route-' + r.id, sourceType: 'route', name: r.name || 'Route',
    dateIso: null, raw: r
  }));
  const activityCache = loadAktivitaetenListCache();
  const activityCandidates = Object.values(activityCache)
    .filter(a => a && RIDE_SPORT_TYPES.has(a.sport_type || a.type))
    .sort(byStartDateDesc)
    .slice(0, TOP_ROUTES_ACTIVITY_LOOKBACK)
    .map(a => ({
      id: 'activity-' + a.id, sourceType: 'activity', name: a.name || 'Aktivität',
      dateIso: a.start_date_local || a.start_date, raw: a
    }));
  return [...routeCandidates, ...activityCandidates];
}

// Diffs buildTopRouteCandidates() against what's already cached and fetches
// exactly the missing ones — geometry never goes stale, so "already cached"
// never needs re-fetching regardless of age. Sequential for-await loop,
// render() after EACH item — this one is a manual, button-triggered scan
// where incremental per-item progress is worth showing, unlike
// loadSegmentExtras() (batches its render() to avoid re-rendering during an
// automatic on-load fetch of up to 30 segments). Per-candidate failures
// (deleted route -> 404, no GPS stream, too short) are skipped silently —
// one bad candidate must not abort the rest of the scan.
async function ensureTopRouteCandidatesFetched(){
  const tp = state.trainerPage;
  const candidates = buildTopRouteCandidates();
  const cached = loadTopRoutesCache();
  const missing = candidates.filter(c => !cached[c.id]);
  tp.topRoutesFetchedCount = candidates.length - missing.length;
  for(const c of missing){
    try{
      let pts;
      if(c.sourceType === 'route'){
        const raw = await fetchRouteStreams(c.raw.id, state.accessToken);
        const byType = {};
        (Array.isArray(raw)?raw:[]).forEach(s => { if(s && s.type) byType[s.type] = s.data; });
        pts = streamsToPts(byType.latlng, byType.altitude, byType.distance);
      } else {
        const raw = await fetchActivityGeoStreams(c.raw.id, state.accessToken);
        const byType = normalizeStreams(raw);
        pts = streamsToPts(byType.latlng, byType.altitude, byType.distance);
      }
      const analyzed = analyzeRoute(pts);
      if(!analyzed || analyzed.totalDistanceM < 300) throw new Error('zu kurz');
      saveTopRouteCacheEntry(c.id, {
        sourceType: c.sourceType, name: c.name, dateIso: c.dateIso,
        distanceM: analyzed.totalDistanceM, points: slimTrainerRoutePoints(pts), cachedAt: Date.now()
      });
      topRouteAnalysisCache.delete(c.id);
    }catch(e){
      // skip this candidate, see comment above
    }
    tp.topRoutesFetchedCount++;
    render();
  }
  tp.topRoutesLoading = false;
  render();
}

// Attaches an already-scored Top-Strecken candidate as today's trainer
// route — same end state as attachSavedStravaRouteToTrainer() above
// (saveTrainerRouteForDate + invalidateTrainerRouteCache), but sourced from
// the already-cached (already-slimmed) points instead of a fresh fetch:
// the whole point of scoring candidates ahead of time is that attaching one
// costs zero additional network calls.
function attachTopRouteCandidate(candidate){
  const tp = state.trainerPage;
  const cached = loadTopRoutesCache()[candidate.id];
  if(!cached){ tp.routeError = 'Strecke nicht mehr im Cache verfügbar — bitte neu bewerten.'; render(); return; }
  saveTrainerRouteForDate(todayIsoKey(), cached.name, cached.points);
  invalidateTrainerRouteCache(todayIsoKey());
  tp.routeError = null;
  tp.workoutPreviewOpen = true;
  render();
}

// ---------- Trainer: adaptive learning ----------
const TRAINER_HISTORY_KEY = 'velocast_trainer_history';
const LEARNABLE_GOALS = ['vo2max','ftp','anaerobic'];
function loadTrainerHistory(){
  try{
    const raw = localStorage.getItem(TRAINER_HISTORY_KEY);
    const p = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(p)) return [];
    return p.filter(e => e && typeof e==='object' && LEARNABLE_GOALS.includes(e.goal) &&
      typeof e.compliance === 'number' && isFinite(e.compliance) && typeof e.date === 'string');
  }catch(e){ return []; }
}
function saveTrainerHistory(list){ try{ localStorage.setItem(TRAINER_HISTORY_KEY, JSON.stringify(list.slice(-100))); }catch(e){} }
function recordEvaluation(goal, activityId, evaluation){
  if(!LEARNABLE_GOALS.includes(goal) || evaluation.complianceWeighted == null) return;
  const list = loadTrainerHistory();
  list.push({ date:new Date().toISOString(), goal, activityId:String(activityId), compliance:evaluation.complianceWeighted });
  saveTrainerHistory(list);
}
function computeLearningFactors(){
  const list = loadTrainerHistory();
  const factor = {};
  LEARNABLE_GOALS.forEach(g => {
    const entries = list.filter(e=>e.goal===g).slice(-8);
    if(entries.length < 2){ factor[g] = 1; return; }
    const avg = entries.reduce((s,e)=>s+e.compliance,0)/entries.length;
    factor[g] = Math.max(0.85, Math.min(1.08, avg));
  });
  return { factor, history:list };
}
function complianceVerdict(complianceWeighted, usingHr){
  const metricLabel = usingHr ? 'des HF-Ziels' : 'der Zielleistung';
  if(complianceWeighted == null) return { verdict:'Keine bewertbaren Intervalle', verdictClass:'warn',
    why: usingHr
      ? 'Diese Einheit hatte keine Ziel-Abschnitte mit festem HF-Ziel (z.B. weil sie nur RPE-Intervalle enthält), oder die Aktivität deckt sie nicht ab.'
      : 'Diese Einheit hatte keine Ziel-Abschnitte mit fester Leistungsvorgabe, oder die Aktivität deckt sie nicht ab.' };
  if(complianceWeighted >= 0.97 && complianceWeighted <= 1.08) return { verdict:'Ziel getroffen', verdictClass:'good',
    why:`Im Schnitt ${(complianceWeighted*100).toFixed(0)}% ${metricLabel} auf den harten Abschnitten – genau im Rahmen.` };
  if(complianceWeighted > 1.08) return { verdict:'Über Ziel gefahren', verdictClass:'good',
    why:`Im Schnitt ${(complianceWeighted*100).toFixed(0)}% ${metricLabel} – du hast die Vorgabe übertroffen. Nächstes Mal etwas höher ansetzen.` };
  if(complianceWeighted >= 0.85) return { verdict:'Knapp verfehlt', verdictClass:'warn',
    why:`Im Schnitt ${(complianceWeighted*100).toFixed(0)}% ${metricLabel} – leicht unter Vorgabe. Kann Tagesform, Ermüdung oder Wind gewesen sein.` };
  return { verdict:'Deutlich verfehlt', verdictClass:'danger',
    why:`Im Schnitt nur ${(complianceWeighted*100).toFixed(0)}% ${metricLabel} erreicht. Die Vorgabe war für diesen Tag zu hoch angesetzt.` };
}
// usingHr picks the %LTHR table/metric instead of %FTP -- see
// TRAINING_CONFIG.targetRangePctLthr's own comment for why the class->band
// mapping itself is a fresh derivation, not a reuse of targetRangePct.
function classTargetRange(classKey, config, usingHr){
  const table = usingHr ? config.targetRangePctLthr : config.targetRangePct;
  return (table && table[classKey]) || null;
}
function classIntervalVerdict(actualValue, metricValue, classKey, config, usingHr){
  if(actualValue == null || !metricValue) return null;
  const range = classTargetRange(classKey, config, usingHr);
  if(!range) return null;
  const pct = actualValue / metricValue;
  if(pct >= range.min && pct <= range.max) return 'in-range';
  return pct < range.min ? 'below' : 'above';
}
// rp (not a bare ftp number) so the HF branch can read rp.usingHr/rp.lthr.
// RPE-tagged steps (s.rpeLabel -- HF-mode VO2max/Anaerobic/Sprint, see
// RPE_TARGET_BY_CLASS) are excluded from the whole class-compliance budget,
// not just the per-step badge in evaluateWorkout(): comparing a measured bpm
// against the class's %LTHR band for THESE steps would be systematically
// misleading, since real HR during a 3s-30s all-out effort never gets close
// to the >100%-LTHR band these classes target -- it would read as "below
// target" on every single RPE interval regardless of actual effort.
function summarizeClassCompliance(perStep, classKey, rp, config){
  const usingHr = rp.usingHr;
  const metricValue = usingHr ? rp.lthr : rp.ftp;
  const intervals = (perStep||[]).filter(s=>s.kind==='interval' && s.span>0 && !s.rpeLabel);
  if(!intervals.length) return null;
  let plannedMin = 0, inRangeMin = 0;
  const rows = intervals.map(s => {
    const actualValue = usingHr ? s.actualHr : s.actualWatts;
    const targetValue = usingHr ? s.targetHr : s.targetWatts;
    const verdict = classIntervalVerdict(actualValue, metricValue, classKey, config, usingHr);
    plannedMin += s.span/60;
    if(verdict === 'in-range') inRangeMin += s.span/60;
    return { name: s.name, actualValue, targetValue, verdict };
  });
  return {
    classKey, usingHr, range: classTargetRange(classKey, config, usingHr), rows,
    plannedMin: Math.round(plannedMin*10)/10,
    inRangeMin: Math.round(inRangeMin*10)/10,
    remainingMin: Math.max(0, Math.round((plannedMin-inRangeMin)*10)/10),

}
// Compares a completed activity's raw stream against a workout's planned
// steps — route-based workouts (steps carry startDist/endDist) are matched
// by distance, time-based workouts by elapsed time. Reads `stream.heartrate`
// (not `heart_rate`) to match normalizeStreams()'s own field naming, which
// mirrors Strava's real stream-type key. Takes rp (not a bare ftp number) so
// the HF branch can compare against stream.heartrate/rp.lthr instead of
// stream.watts/rp.ftp -- power users see zero behavior change (same
// stream.watts gate, same targetWatts math as before).
function evaluateWorkout(stream, workout, rp){
  const steps = (workout && workout.steps) || [];
  const isRoute = steps.length > 0 && steps[0].startDist != null;
  const usingHr = rp.usingHr;
  const primaryKey = usingHr ? 'heartrate' : 'watts';
  if(isRoute){
    if(!stream || !Array.isArray(stream.distance) || !Array.isArray(stream[primaryKey])) return null;
  } else {
    if(!stream || !Array.isArray(stream.time) || !Array.isArray(stream[primaryKey])) return null;
  }
  const axis = isRoute ? stream.distance : stream.time;
  const watts = stream.watts, hr = stream.heartrate;
  const n = axis.length;
  if(n < 4) return null;
  const actualTotal = axis[n-1];

  const avgInRange = (arr, lo, hi) => {
    if(!Array.isArray(arr)) return null;
    let sum=0, c=0;
    for(let i=0;i<n;i++) if(axis[i]>=lo && axis[i]<hi && arr[i]!=null){ sum+=arr[i]; c++; }
    return c ? sum/c : null;
  };
  const maxInRange = (arr, lo, hi) => {
    if(!Array.isArray(arr)) return null;
    let m=null;
    for(let i=0;i<n;i++) if(axis[i]>=lo && axis[i]<hi && arr[i]!=null && (m==null||arr[i]>m)) m=arr[i];
    return m;
  };

  let cursor = 0;
  const perStep = steps.map(s => {
    let lo, hi, span;
    if(isRoute){ lo = s.startDist; hi = s.endDist; span = s.distanceM; }
    else { lo = cursor*60; hi = (cursor+s.minutes)*60; span = s.minutes*60; cursor += s.minutes; }
    const kind = s.kind || (s.pct >= 0.85 ? 'interval' : 'other');
    const actualWatts = avgInRange(watts, lo, hi);
    const actualHr = avgInRange(hr, lo, hi);
    const maxHr = maxInRange(hr, lo, hi);
    const base = { ...s, kind, span,
      actualWatts: actualWatts!=null?Math.round(actualWatts):null,
      actualHr: actualHr!=null?Math.round(actualHr):null,
      maxHr: maxHr!=null?Math.round(maxHr):null };
    // RPE steps never had a real-time bpm target -- no target/achieved
    // comparison for them, measured HR above is still carried through.
    if(s.rpeLabel) return { ...base, targetWatts:null, targetHr:null, achievedPct:null };
    if(usingHr){
      const targetHr = Math.round(s.pct*rp.lthr);
      const achievedPct = actualHr!=null ? actualHr/targetHr : null;
      return { ...base, targetHr, targetWatts:null, achievedPct };
    }
    const targetWatts = Math.round(s.pct*rp.ftp);
    const achievedPct = actualWatts!=null ? actualWatts/targetWatts : null;
    return { ...base, targetWatts, targetHr:null, achievedPct };
  });

  const intervalSteps = perStep.filter(s=>s.kind==='interval' && s.achievedPct!=null && s.span>0);
  const totalIntervalSpan = intervalSteps.reduce((sum,s)=>sum+s.span,0);
  const complianceWeighted = totalIntervalSpan>0
    ? intervalSteps.reduce((sum,s)=>sum+s.achievedPct*s.span,0)/totalIntervalSpan : null;
  const plannedTotal = isRoute ? workout.totalDistanceM : cursor*60;
  const mismatchPct = plannedTotal ? Math.abs(actualTotal-plannedTotal)/plannedTotal*100 : null;

  const v = complianceVerdict(complianceWeighted, usingHr);
  // 'test' is deliberately excluded here: it has no targetRangePct/
  // targetRangePctLthr entry (see TRAINING_CONFIG), so summarizeClassCompliance()
  // would always resolve range:null and inRangeMin:0 -- which would render as
  // a permanent, misleading "0/X Min im Zielbereich" for every single test,
  // pass or fail. The test's own pass/fail is shown separately (see
  // renderTrainerAblaufCard()'s classKey==='test' confirmation block).
  const classCompliance = (workout && workout.classKey && workout.classKey !== 'test')
    ? summarizeClassCompliance(perStep, workout.classKey, rp, TRAINING_CONFIG) : null;
  return { perStep, complianceWeighted, ...v, actualTotal, mismatchPct, isRoute, classCompliance };
}
async function runTrainerEvaluation(workout, rp, learnGoalKey){
  const tp = state.trainerPage;
  if(!tp.evalActivityId){ tp.evalError = 'Bitte eine Aktivität auswählen.'; render(); return; }
  tp.evalLoading = true; tp.evalError = null; tp.evalResult = null; tp.evalTestAchievedWatts = null; render();
  try{
    // fetchActivityPowerStreams() already requests heartrate alongside watts
    // (see its own comment), so the HF branch needs no separate fetch here.
    const raw = await fetchActivityPowerStreams(tp.evalActivityId, state.accessToken);
    const stream = normalizeStreams(raw);
    const evaluation = evaluateWorkout(stream, workout, rp);
    if(!evaluation){
      tp.evalError = rp.usingHr
        ? 'Diese Aktivität hat keine geeigneten Rohdaten-Streams (Herzfrequenzdaten nötig).'
        : 'Diese Aktivität hat keine geeigneten Rohdaten-Streams (Leistungsmesser nötig).';
    } else if(workout.classKey === 'test'){
      // A test isn't a LEARNABLE_GOALS member and must never feed
      // recordEvaluation()'s per-goal adaptive-learning factor -- doing so
      // would silently contaminate e.g. the FTP-interval adjustment factor
      // with a one-off max-effort test result. The confirmed value instead
      // reuses computeMmpFromStream() -- the exact same function that
      // computes every random best value from a normal ride -- applied to
      // the stream already fetched above, so there's no second calculation
      // path and no drift risk between "test result" and "regular best".
      const mmp = computeMmpFromStream(stream);
      tp.evalTestAchievedWatts = (mmp && mmp[workout.testDurationSec] != null) ? mmp[workout.testDurationSec] : null;
      tp.evalResult = evaluation;
    } else {
      recordEvaluation(learnGoalKey, tp.evalActivityId, evaluation);
      tp.evalResult = evaluation;
    }
  }catch(e){
    tp.evalError = (e && e.message) || String(e);
  }
  tp.evalLoading = false;
  render();
}

// ---------- Trainer: .ZWO / .FIT export ----------
function xmlEscape(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
}
function buildZwo(workout, rp, goalLabelText){
  const steps = workout.steps.filter(s=>s.minutes>0);
  const l = [];
  l.push('<?xml version="1.0" encoding="UTF-8"?>');
  l.push('<workout_file>');
  l.push('  <author>VeloCast</author>');
  l.push(`  <name>${xmlEscape(workout.title)}</name>`);
  l.push(`  <description>${xmlEscape(`Ziel: ${goalLabelText}. Erzeugt aus deinen Strava-Daten. Arbeits-FTP ${rp.ftp} W (${rp.ftpSource}). Profil: ${rp.riderType}. Reiz: ${workout.adaptation}.`)}</description>`);
  l.push('  <sportType>bike</sportType>');
  l.push('  <tags></tags>');
  l.push('  <workout>');
  steps.forEach((s,i)=>{
    const dur = Math.max(1, Math.round(s.minutes*60));
    const pwr = Math.round(s.pct*1000)/1000;
    const lo = Math.round(pwr*0.75*1000)/1000;
    const label = xmlEscape(s.name);
    if(i===0) l.push(`    <Warmup Duration="${dur}" PowerLow="${lo}" PowerHigh="${pwr}"><textevent timeoffset="0" message="${label}"/></Warmup>`);
    else if(i===steps.length-1) l.push(`    <Cooldown Duration="${dur}" PowerLow="${pwr}" PowerHigh="${lo}"><textevent timeoffset="0" message="${label}"/></Cooldown>`);
    else l.push(`    <SteadyState Duration="${dur}" Power="${pwr}"><textevent timeoffset="0" message="${label}"/></SteadyState>`);
  });
  l.push('  </workout>');
  l.push('</workout_file>');
  return l.join('\n');
}

// Binary FIT workout encoder — Garmin/Wahoo/Hammerhead all accept this
// natively. Layout: 12-byte header, then definition+data records, then a
// little-endian CRC-16 of everything before it. Ported byte-for-byte from
// the Artifact (cross-checked against the FIT SDK's global message numbers
// for file_id/workout/workout_step); only rp/workout field access changed to
// match this file's own naming, none of the binary layout did.
//
// workout_step's `target_type` (field 3) is the FIT SDK's wkt_step_target
// enum. Verified against the official FIT SDK Profile (Garmin's Profile.xlsx,
// cross-checked via its python-fitparse mirror, since no local FIT SDK/build
// tool is available in this project): 0=speed, 1=heart_rate, 2=open,
// 3=cadence, 4=power, 5=grade, 6=resistance, 7=power_3s, 8=power_10s,
// 9=power_30s, 10=power_lap, 11=swim_stroke — the existing power branch's
// literal `u8(4)` below is that enum's `power`, confirmed correct (a
// generic online summary of this enum can read 3=power/4=grade instead;
// the Profile-derived source above is the authoritative one and is what the
// numbers below follow). `heart_rate`=1 is used for the new HR branch;
// `open`=2 (no real-time target — free ride) is used for RPE-only interval
// steps, since no FIT-native RPE target field exists.
//
// custom_target_value_low/high (fields 5/6) share one raw uint32 range with
// the field-type's own zone-index encoding: for `workout_power`, 0-1000 means
// %FTP and >1000 means watts+1000 (the existing +1000 offset below); for
// `workout_hr`, 0-100 means %max-HR and >100 means bpm+100 — confirmed by the
// same Profile source, so the "real bpm value + 100" convention this file's
// plan called for is exactly the FIT SDK's own bpm_offset constant, not a
// guess.
const FIT_CRC_TABLE = [0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,
                       0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];
function fitCrc(bytes, from, to, crc){
  let c = crc||0;
  for(let i=from;i<to;i++){
    const b = bytes[i];
    let t = FIT_CRC_TABLE[c & 0xF];
    c = ((c>>4) & 0x0FFF) ^ t ^ FIT_CRC_TABLE[b & 0xF];
    t = FIT_CRC_TABLE[c & 0xF];
    c = ((c>>4) & 0x0FFF) ^ t ^ FIT_CRC_TABLE[(b>>4) & 0xF];
  }
  return c & 0xFFFF;
}
const FIT_STEP_NAME_LEN = 24;
function fitString(s, len){
  const out = new Array(len).fill(0);
  const bytes = [];
  for(const ch of String(s==null?'':s)){
    const cp = ch.codePointAt(0);
    if(cp < 0x80) bytes.push(cp);
    else if('äöüÄÖÜß'.includes(ch)){
      ({ 'ä':'ae','ö':'oe','ü':'ue','Ä':'Ae','Ö':'Oe','Ü':'Ue','ß':'ss' }[ch])
        .split('').forEach(c2=>bytes.push(c2.charCodeAt(0)));
    } else bytes.push(0x3F);
  }
  for(let i=0;i<Math.min(bytes.length, len-1);i++) out[i]=bytes[i];
  return out;
}
function buildFit(workout, rp){
  const steps = workout.steps.filter(s=> (s.minutes>0) || (s.distanceM>0));
  const body = [];
  const u8=v=>body.push(v & 0xFF);
  const u16=v=>{ body.push(v & 0xFF, (v>>8) & 0xFF); };
  const u32=v=>{ body.push(v & 0xFF, (v>>8) & 0xFF, (v>>16) & 0xFF, (v>>>24) & 0xFF); };

  // --- file_id (global 0) as local type 0 ---
  u8(0x40); u8(0); u8(0); u16(0); u8(4);
  u8(0); u8(1); u8(0x00);
  u8(1); u8(2); u8(0x84);
  u8(2); u8(2); u8(0x84);
  u8(4); u8(4); u8(0x86);
  u8(0x00);
  u8(5);
  u16(255);
  u16(0);
  u32(Math.max(0, Math.floor(Date.now()/1000) - 631065600));

  // --- workout (global 26) as local type 1 ---
  u8(0x41); u8(0); u8(0); u16(26); u8(4);
  u8(4); u8(1); u8(0x00);
  u8(5); u8(4); u8(0x8C);
  u8(6); u8(2); u8(0x84);
  u8(8); u8(FIT_STEP_NAME_LEN); u8(0x07);
  u8(0x01);
  u8(2);
  u32(0);
  u16(steps.length);
  fitString(workout.title, FIT_STEP_NAME_LEN).forEach(u8);

  // --- workout_step (global 27) as local type 2 ---
  u8(0x42); u8(0); u8(0); u16(27); u8(9);
  u8(254); u8(2); u8(0x84);
  u8(0);   u8(FIT_STEP_NAME_LEN); u8(0x07);
  u8(1);   u8(1); u8(0x00);
  u8(2);   u8(4); u8(0x86);
  u8(3);   u8(1); u8(0x00);
  u8(4);   u8(4); u8(0x86);
  u8(5);   u8(4); u8(0x86);
  u8(6);   u8(4); u8(0x86);
  u8(7);   u8(1); u8(0x00);

  steps.forEach((s,i)=>{
    let targetType, lo, hi, stepName = s.name;
    if(rp.usingHr && s.rpeLabel){
      // VO2max/Anaerobic/Sprint intervals in HF mode carry an RPE target
      // instead of a real-time bpm target (plan §5) — there's no FIT-native
      // RPE field, so `open` (no target, free ride) is the honest fit rather
      // than faking a bpm range. The RPE info is folded into the step name
      // itself since this local message definition has no separate `notes`
      // field (def_num 8, not defined in the field list above) — adding one
      // would also change every power-mode step's byte layout, which the
      // regression requirement rules out.
      //
      // Bug 2 fix: the RPE marker sits as a PREFIX, not a suffix. fitString()
      // below hard-truncates at FIT_STEP_NAME_LEN-1 = 23 bytes, and real base
      // names (route-based `${baseLabel} ${n} (${km} km, ${grad}%)` labels,
      // ~7259/7345; time-based "Satz N – Sprint M" labels, ~7581) routinely
      // run past 23 bytes on their own -- a trailing " (RPE X)" suffix used
      // to get silently cut off in exactly those cases, leaving the step
      // with target_type=open AND no RPE text at all (zero guidance for the
      // rider on-device). A short, fixed-length prefix survives truncation
      // regardless of how long the base name is or grows in the future.
      targetType = 2; // open
      lo = 0; hi = 0;
      stepName = `RPE ${s.rpeTarget} - ${s.name}`; // plain hyphen, not an en-dash: fitString() maps non-ASCII (besides umlauts) to '?', which would land right after the RPE number
    } else {
      // stepTargetValue() (~6000) already resolves pct*ftp vs pct*lthr the
      // same way every other Trainer call site does — for the power branch
      // this is byte-identical to the old `Math.round(s.pct*rp.ftp)`.
      const target = Math.max(1, Math.round(stepTargetValue(s.pct, rp)));
      const offset = rp.usingHr ? 100 : 1000; // workout_hr vs workout_power field-type offset, see comment above
      targetType = rp.usingHr ? 1 : 4; // heart_rate : power
      lo = offset + Math.max(0, target - Math.round(target*0.04));
      hi = offset + target + Math.round(target*0.04);
    }
    const intensity = i===0 ? 2 : (i===steps.length-1 ? 3 : (s.pct<=0.6 ? 1 : 0));
    u8(0x02);
    u16(i);
    fitString(stepName, FIT_STEP_NAME_LEN).forEach(u8);
    if(!workout.routeBased && s.distanceM != null){
      u8(1); // duration_type = distance
      u32(Math.max(100, Math.round(s.distanceM*100)));
    } else {
      u8(0); // duration_type = time
      // Hammerhead Karoo unterstützt keine distanzbasierten Workout-Schritte
      // (importiert sie live als zeitbasiert um) -- Routen-Workouts exportieren
      // deshalb immer zeitbasiert. rseg()-Schritte tragen kein `minutes`, also
      // die Dauer aus der platzierten distanceM über dasselbe Tempo-Modell
      // zurückrechnen, mit dem sie überhaupt erst platziert wurde.
      const durationSec = s.minutes != null ? s.minutes*60 : (s.distanceM/1000) / estimateSpeedKmh(s, rp) * 3600;
      u32(Math.max(1000, Math.round(durationSec*1000)));
    }
    u8(targetType);
    u32(0);
    u32(lo); u32(hi);
    u8(intensity);
  });

  const header = [12, 0x20, 0x00, 0x00, 0,0,0,0, 0x2E,0x46,0x49,0x54];
  header[2] = 100 & 0xFF; header[3] = (100>>8) & 0xFF;
  const len = body.length;
  header[4]=len & 0xFF; header[5]=(len>>8)&0xFF; header[6]=(len>>16)&0xFF; header[7]=(len>>>24)&0xFF;

  const all = header.concat(body);
  const crc = fitCrc(all, 0, all.length, 0);
  all.push(crc & 0xFF, (crc>>8) & 0xFF);
  return new Uint8Array(all);
}
// Binary FIT course (GPS track) encoder — ships the attached route as a
// second, separate FIT file, the way Hammerhead/Garmin/Wahoo devices
// actually pair a route with a structured workout (both selected together at
// ride start). Deliberately minimal: file_id + record messages only.
function downsampleRoutePoints(pts, targetSpacingM){
  targetSpacingM = targetSpacingM || 20;
  if(pts.length < 3) return pts.slice();
  const out = [pts[0]];
  let lastDist = pts[0].dist;
  for(let i=1;i<pts.length-1;i++){
    if(pts[i].dist - lastDist >= targetSpacingM){ out.push(pts[i]); lastDist = pts[i].dist; }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function estimateElapsedSecondsForPoints(pts, segments, rp){
  const t = new Array(pts.length).fill(0);
  let segIdx = 0, elapsed = 0;
  for(let i=1;i<pts.length;i++){
    while(segIdx < (segments.length-1) && pts[i].dist > segments[segIdx].endDist) segIdx++;
    const grad = segments[segIdx] ? segments[segIdx].avgGradient : 0;
    // Kein echtes Pro-Punkt-Leistungsziel für eine reine GPS-Track-ETA
    // verfügbar -- 0.65 landet in "Ausdauer (Z2)", passend zur überwiegenden
    // Grundlagenpace außerhalb platzierter Intervalle. Bewusste Näherung,
    // kein echtes Ziel.
    const kmh = estimateSpeedKmh({ gradient: grad, pct: 0.65 }, rp);
    const dM = pts[i].dist - pts[i-1].dist;
    elapsed += dM > 0 ? dM/1000/kmh*3600 : 0;
    t[i] = elapsed;
  }
  return t;
}
function buildCourseFit(route, rp){
  const smoothed = route.smoothed || route.points.map(p=>p.ele||0);
  const withEle = route.points.map((p,i) => ({ lat:p.lat, lon:p.lon, dist:p.dist, ele: smoothed[i] }));
  const pts = downsampleRoutePoints(withEle, 20);
  const times = estimateElapsedSecondsForPoints(pts, route.segments||[], rp);

  const body = [];
  const u8=v=>body.push(v & 0xFF);
  const u16=v=>{ body.push(v & 0xFF, (v>>8) & 0xFF); };
  const u32=v=>{ body.push(v & 0xFF, (v>>8) & 0xFF, (v>>16) & 0xFF, (v>>>24) & 0xFF); };

  const startEpoch = Math.max(0, Math.floor(Date.now()/1000) - 631065600);

  // --- file_id (global 0) as local type 0, type=6 (course) ---
  u8(0x40); u8(0); u8(0); u16(0); u8(4);
  u8(0); u8(1); u8(0x00);
  u8(1); u8(2); u8(0x84);
  u8(2); u8(2); u8(0x84);
  u8(4); u8(4); u8(0x86);
  u8(0x00);
  u8(6);
  u16(255);
  u16(0);
  u32(startEpoch);

  // --- record (global 20) as local type 1 ---
  u8(0x41); u8(0); u8(0); u16(20); u8(5);
  u8(253); u8(4); u8(0x86);
  u8(0);   u8(4); u8(0x85);
  u8(1);   u8(4); u8(0x85);
  u8(2);   u8(2); u8(0x84);
  u8(5);   u8(4); u8(0x86);

  pts.forEach((p,i) => {
    u8(0x01);
    u32(startEpoch + Math.round(times[i]));
    u32(toSemicircle(p.lat));
    u32(toSemicircle(p.lon));
    u16(Math.max(0, Math.round(((p.ele==null?0:p.ele) + 500) * 5)));
    u32(Math.max(0, Math.round(p.dist*100)));
  });

  const header = [12, 0x20, 0x00, 0x00, 0,0,0,0, 0x2E,0x46,0x49,0x54];
  header[2] = 100 & 0xFF; header[3] = (100>>8) & 0xFF;
  const len = body.length;
  header[4]=len & 0xFF; header[5]=(len>>8)&0xFF; header[6]=(len>>16)&0xFF; header[7]=(len>>>24)&0xFF;

  const all = header.concat(body);
  const crc = fitCrc(all, 0, all.length, 0);
  all.push(crc & 0xFF, (crc>>8) & 0xFF);
  return new Uint8Array(all);

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
// Rohe Binärdaten statt Base64/JSON: buildFit() liefert bereits ein
// Uint8Array, Workers lesen das nativ per request.arrayBuffer() zurück --
// kein Encoding-Overhead.
async function uploadWorkoutToHammerhead(fitBytes, fileName, accessToken){
  const url = `${HAMMERHEAD_UPLOAD_ENDPOINT}?plannedDate=${encodeURIComponent(todayIsoKey())}&filename=${encodeURIComponent(fileName)}`;
  const res = await fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/octet-stream", "Authorization":"Bearer " + accessToken },
    body: fitBytes
  });
  if(res.status === 401){
    // Auch den (noch nicht abgelaufenen, aber von Hammerhead abgelehnten --
    // z.B. Scope entzogen) Token verwerfen, sonst liefert der nächste Klick
    // via ensureHammerheadToken()'s Cache denselben Token erneut aus und
    // landet wieder in einem 401, ohne je den Verbinden-Redirect zu zeigen.
    state.hammerheadConnected = false;
    state.hammerheadAccessToken = null;
    state.hammerheadExpiresAt = null;
    throw new Error("Hammerhead-Verbindung abgelaufen — bitte erneut verbinden.");
  }
  if(!res.ok) throw new Error("Hammerhead-Upload fehlgeschlagen (" + res.status + ")");
  return res.json();
}
function slugify(s){
  return String(s).toLowerCase()
    .replace(/[äöüß]/g, m=>({'ä':'ae','ö':'oe','ü':'ue','ß':'ss'}[m]))
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'workout';
}

// ---------- Trainer: chart ----------
// Same mountChart()/chartRegistry/profilColors() plumbing as the Profil
// charts. Two variants (route elevation+power vs. plain time+power),
// selected by tp.lastWorkout.routeBased — same "one canvas id, swapped
// config" idea as buildTrainerChart() in the Artifact.
// rp instead of a bare ftp number so this can branch on rp.usingHr. The
// power path resolves metric/unitLabel/axisLabel/zoneFn to exactly the same
// values (rp.ftp/'W'/'Watt'/zoneFor) it used before this branch existed, so
// power users see byte-identical chart output.
function buildRouteWorkoutChart(workout, route, rp){
  const c = profilColors();
  const steps = workout.steps;

  // Gleiche Eignungs-Logik wie die "Optimal"/"Akzeptabel"-Tags in
  // renderTrainerAblaufCard() (gradientSuitability() gegen die Steigungs-Bänder
  // der gewählten Klasse), aber durchgehend über das ganze Streckenprofil
  // angewandt statt nur auf bereits platzierte Intervall-Schritte -- so bleibt
  // die Höhenlinie auch dann informativ eingefärbt, wenn placeIntervalsOnRoute()
  // auf einem Abschnitt kein Intervall unterbringen konnte (z.B. ein zu kurzer
  // Anstieg), und wird nicht durch die Zufälligkeit der Platzierung mit
  // ausgeblendet. Quelle ist route.segments (die durchgehende analyzeRoute()-
  // Typisierung des ganzen Tracks), nicht workout.steps. Für
  // SUITABILITY_EXEMPT_CLASSES bleibt die Linie bewusst neutral -- deren
  // Steigungs-Band ist per Definition -99..99 ("jedes Terrain geeignet"), eine
  // Einfärbung wäre dort nur durchgehend grün und ohne Aussage.
  const suitabilityBand = !SUITABILITY_EXEMPT_CLASSES.includes(workout.classKey)
    ? (TRAINING_CONFIG.constraints.byClass[workout.classKey] || {}).gradient : null;
  const tierColorAtDistM = distM => {
    if(!suitabilityBand) return null;
    const seg = (route.segments||[]).find(s => distM >= s.startDist && distM <= s.endDist);
    if(!seg || seg.avgGradient==null) return null;
    const tier = gradientSuitability(seg.avgGradient, suitabilityBand);
    return tier==='ideal' ? c.tail : tier==='acceptable' ? c.cross : c.head;
  };

  const elevPts = [];
  const elevTierColors = [];
  const STRIDE = Math.max(1, Math.floor(route.points.length/400));
  for(let i=0;i<route.points.length;i+=STRIDE){
    elevPts.push({x:route.points[i].dist/1000, y:route.smoothed[i]});
    elevTierColors.push(tierColorAtDistM(route.points[i].dist));
  }
  const lastIdx = route.points.length-1;
  elevPts.push({x:route.points[lastIdx].dist/1000, y:route.smoothed[lastIdx]});
  elevTierColors.push(tierColorAtDistM(route.points[lastIdx].dist));

  const metric = rp.usingHr ? rp.lthr : rp.ftp;
  const unitLabel = rp.usingHr ? 'bpm' : 'W';
  const axisLabel = rp.usingHr ? 'Puls (bpm)' : 'Watt';
  const zoneFn = pct => stepZoneFor(pct, rp);

  const pwrPts = [];
  steps.forEach(s=>{
    const w = Math.round(stepTargetValue(s.pct, rp));
    pwrPts.push({x:s.startDist/1000, y:w});
    pwrPts.push({x:s.endDist/1000, y:w});
  });

  mountChart('velocastTrainerChart', {
    type:'line',
    data:{ datasets:[
      { label:'Höhe', data:elevPts, yAxisID:'y', borderColor:c.chalkDim, backgroundColor:'rgba(152,161,174,0.18)',
        borderWidth:1.5, pointRadius:0, fill:true, tension:.15,
        segment:{ borderColor:ctx=>elevTierColors[ctx.p0DataIndex] || c.chalkDim } },
      { label:'Zielleistung', data:pwrPts, yAxisID:'y2', borderWidth:2.5, pointRadius:0, fill:false,
        segment:{ borderColor:ctx=>{ const idx = Math.min(Math.floor(ctx.p0DataIndex/2), steps.length-1); return zoneFn(steps[idx].pct).color; } } },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'nearest',intersect:false},
      plugins:{ legend:{display:true, labels:{color:c.chalk, boxWidth:12, font:{size:11}}},
        tooltip:{ callbacks:{ title:it=>it.length?`${it[0].parsed.x.toFixed(1)} km`:'',
          label:i=>{
            if(i.dataset.label==='Höhe') return `${Math.round(i.parsed.y)} m`;
            // RPE-Schritte (HF-Modus VO2max/Anaerob/Sprint) zeigen die
            // RPE-Stufe im Tooltip statt einer bpm-Zahl -- gleiche Priorität
            // wie in renderTrainerAblaufCard's Schrittliste.
            const rpeStep = steps[Math.min(Math.floor(i.dataIndex/2), steps.length-1)];
            if(rpeStep && rpeStep.rpeLabel) return rpeStep.rpeLabel;
            return `${i.parsed.y} ${unitLabel} (${zoneFn(i.parsed.y/metric).name})`;
          } } } },
      scales:{ x:{type:'linear', title:{display:true,text:'Kilometer',color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim}},
        y:{position:'left', title:{display:true,text:'Höhe (m)',color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim}},
        y2:{position:'right', title:{display:true,text:axisLabel,color:c.chalkDim}, grid:{display:false}, ticks:{color:c.chalkDim}, beginAtZero:true} } },
  });
}
// Same branching approach as buildRouteWorkoutChart() above.
function drawStepPowerChart(steps, rp){
  const c = profilColors();
  const metric = rp.usingHr ? rp.lthr : rp.ftp;
  const unitLabel = rp.usingHr ? 'bpm' : 'W';
  const axisLabel = rp.usingHr ? 'Puls (bpm)' : 'Watt';
  const lineLabel = rp.usingHr ? 'LTHR' : 'FTP';
  const zoneFn = pct => stepZoneFor(pct, rp);

  const pts=[]; let t=0;
  steps.forEach(s=>{ const w=Math.round(stepTargetValue(s.pct, rp)); pts.push({x:t,y:w}); t+=s.minutes; pts.push({x:t,y:w}); });
  mountChart('velocastTrainerChart', {
    type:'line',
    data:{ datasets:[
      { label:'Zielleistung', data:pts, borderColor:c.route, borderWidth:2.5, pointRadius:0, fill:{target:'origin'},
        backgroundColor: ctx=>{ const g = ctx.chart.ctx.createLinearGradient(0,0,0,ctx.chart.height||300);
          g.addColorStop(0,'rgba(130,162,209,0.20)'); g.addColorStop(1,'rgba(130,162,209,0.02)'); return g; },
        segment:{ borderColor:ctx=>zoneFn(steps[Math.min(Math.floor(ctx.p0DataIndex/2), steps.length-1)].pct).color } },
      { label:lineLabel, data:[{x:0,y:metric},{x:t,y:metric}], borderColor:c.strava, borderDash:[6,4], borderWidth:1.5, pointRadius:0, fill:false },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'nearest',intersect:false},
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{
        title:it=>it.length?`Minute ${Math.round(it[0].parsed.x)}`:'',
        label:i=>{
          // Same RPE priority as buildRouteWorkoutChart() above -- only the
          // 'Zielleistung' dataset maps to real steps (the LTHR/FTP reference
          // line has none).
          if(i.dataset.label==='Zielleistung'){
            const rpeStep = steps[Math.min(Math.floor(i.dataIndex/2), steps.length-1)];
            if(rpeStep && rpeStep.rpeLabel) return rpeStep.rpeLabel;
          }
          return `${i.parsed.y} ${unitLabel} (${Math.round(i.parsed.y/metric*100)}% ${lineLabel}) – ${zoneFn(i.parsed.y/metric).name}`;
        } } } },
      scales:{ x:{type:'linear', title:{display:true,text:'Minuten',color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim}},
        y:{beginAtZero:true, title:{display:true,text:axisLabel,color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim}} } },
  });
}
const TRAINER_CHART_IDS = ['velocastTrainerChart'];
function mountTrainerChart(){
  if(state.activePage !== 'trainer' || !window.Chart){ destroyProfilCharts(TRAINER_CHART_IDS); return; }
  const lw = state.trainerPage.lastWorkout;
  if(!lw || !lw.steps || !lw.steps.length){ destroyProfilCharts(TRAINER_CHART_IDS); return; }
  if(lw.routeBased){
    const todayRoute = getTrainerRouteForDate(todayIsoKey());
    if(todayRoute && todayRoute.route) buildRouteWorkoutChart(lw, todayRoute.route, lw.rp);
    else destroyProfilCharts(TRAINER_CHART_IDS);
  } else {
    drawStepPowerChart(lw.steps, lw.rp);
  }
}

// ---------- Trainer: dashboard rendering ----------
// HIGH/MEDIUM/LOW priority badges reuse the same green/amber/red vocabulary
// the callout classes already reuse for training-load verdicts (see the
// .callout comment above) — HIGH intentionally takes the "attention" red,
// same weight sports apps usually give urgency, not a literal danger signal.
const PRIORITY_BADGE = {
  HIGH:{ label:'Hoch', bg:'var(--head-bg)', fg:'var(--head)' },
  MEDIUM:{ label:'Mittel', bg:'var(--cross-bg)', fg:'var(--cross)' },
  LOW:{ label:'Niedrig', bg:'var(--route-bg)', fg:'var(--route)' },
  MAINTENANCE:{ label:'Erhalt', bg:'var(--asphalt-3)', fg:'var(--chalk-dim)' },
};
const BUDGET_UNIT_LABEL = { minutes:'min', quality:'min (Qualität)', efforts:'Efforts', rides:'Fahrten' };
function formatBudgetLine(budget){
  if(!budget) return '';
  const unitLabel = BUDGET_UNIT_LABEL[budget.unit] || '';
  return `${Math.round(budget.done)}/${Math.round(budget.target)} ${unitLabel}`;
}
function renderTrainerSummaryCards(appLoad, goalLabelText, isAuto){
  const tsbCls = appLoad ? (appLoad.tsb>0?'up':(appLoad.tsb<-20?'down':null)) : null;
  return el('div', {class:'metric-grid'}, [
    metricCard('Fitness (CTL)', appLoad?appLoad.ctl.toFixed(0):'–', '42-Tage-Belastungsschnitt'),
    metricCard('Ermüdung (ATL)', appLoad?appLoad.atl.toFixed(0):'–', '7-Tage-Belastungsschnitt'),
    metricCard('Form (TSB)', appLoad?`${appLoad.tsb>0?'+':''}${appLoad.tsb.toFixed(0)}`:'–', appLoad?appLoad.formVerdict:'Noch keine Daten', tsbCls),
    metricCard('Ziel', goalLabelText, isAuto?'automatisch · größter Hebel':'manuell gewählt')
  ]);
}
function renderTrainerContextCards(rp){
  const freshCls = rp.freshnessClass==='good' ? 'up' : (rp.freshnessClass==='danger' ? 'down' : null);
  const workMetricCard = rp.usingHr
    ? metricCard('Arbeits-LTHR', `${rp.lthr} bpm`, rp.lthrSource)
    : metricCard('Arbeits-FTP', `${rp.ftp} W`, `${rp.ftpSource}${rp.wPerKg?' · '+rp.wPerKg.toFixed(2)+' W/kg':''}`);
  const grid = el('div', {class:'metric-grid'}, [
    workMetricCard,
    metricCard('Frische', rp.freshness, `ATL/CTL: ${rp.acwr!=null?rp.acwr.toFixed(2):'–'}`, freshCls),
    metricCard('Woche bisher', `${rp.hoursIn7.toFixed(1)} h`, `${rp.ridesIn7} Fahrt${rp.ridesIn7===1?'':'en'}`),
    metricCard('Letzte harte Einheit', rp.daysSinceHard!=null?`vor ${rp.daysSinceHard} Tag${rp.daysSinceHard===1?'':'en'}`:'keine erkannt',
      rp.daysSinceRide!=null?`letzte Fahrt vor ${rp.daysSinceRide} Tag${rp.daysSinceRide===1?'':'en'}`:null)
  ]);
  // Issue 3 fix: blendedLoad.error used to be write-only (set by
  // loadBlendedTrainingLoad() but never read by any UI) -- a persistent
  // background-refresh failure (see the staleness trigger in
  // trainerRiderContext()) was silently invisible, even though the cards
  // above keep working fine off the last good cached snapshot. Minimal
  // inline note only, since the cache fallback already covers the
  // functional gap -- this is visibility, not a hard error state.
  if(rp.usingHr && state.trainerPage.blendedLoad.error){
    return el('div', {}, [
      grid,
      el('div', {class:'muted', style:'font-size:12px; margin-top:6px;'},
        [`Trainingsbelastung konnte nicht aktualisiert werden (${state.trainerPage.blendedLoad.error}) – zeigt den zuletzt gespeicherten Stand.`])
    ]);
  }
  return grid;
}
