      const skip = skipCache[id];
      if(skip) return;
      if(a.average_heartrate == null){
        skipCache[id] = { status:'noHr', date: new Date(a.start_date_local || a.start_date) };
        return;
      }
      toFetch.push(a);
    });

    const freshRows = [];
    const concurrency = 4;
    for(let i=0;i<toFetch.length;i+=concurrency){
      const batch = toFetch.slice(i, i+concurrency);
      const results = await Promise.all(batch.map(a => processHrProfileRide(a, token)));
      results.forEach((r, idx) => {
        const a = batch[idx];
        const id = String(a.id);
        if(r.status === 'ok'){ cache[id] = r.row; freshRows.push(r.row); }
        else if(r.status === 'noBestEffort'){ skipCache[id] = { status:'noBestEffort', date: new Date(a.start_date_local || a.start_date) }; }
        // apiError: neither cached nor skip-cached, so it's retried next run
      });
      if(i+concurrency < toFetch.length) await new Promise(r=>setTimeout(r,150));
    }
    saveHrProfileCache(cache);
    saveHrProfileSkipCache(skipCache);

    const allRows = cachedRows.concat(freshRows);
    const best = allRows.reduce((a,b) => {
      if(!a) return b;
      if(CONFIDENCE_WEIGHT[b.confidence] !== CONFIDENCE_WEIGHT[a.confidence]) return CONFIDENCE_WEIGHT[b.confidence] > CONFIDENCE_WEIGHT[a.confidence] ? b : a;
      return b.lthr > a.lthr ? b : a;
    }, null);

    tp.hrProfile.estimate = best ? best.lthr : null;
    tp.hrProfile.source = best ? `aus deinen Fahrten geschätzt (${best.basis}, ${best.confidence}e Zuversicht)` : null;
    if(!best) tp.hrProfile.error = "Keine geeigneten Fahrten mit Herzfrequenzdaten gefunden.";
  }catch(e){
    tp.hrProfile.error = e.message || "HF-Schwelle konnte nicht geschätzt werden.";
  }
  tp.hrProfile.loading = false; tp.hrProfile.loaded = true;
  render();
}

// Cheap, synchronous cache-only fallback for loadHrLthrEstimate() above: on a
// fresh page load state.trainerPage.hrProfile.estimate starts back at null —
// it's in-memory only, never persisted itself — so a user already restored
// into equipmentMode==='hr' from savedSettings would otherwise hit the
// "kein HF-Schwellenwert verfügbar" empty state on every reload until they
// manually click "Automatisch schätzen" again, even though their estimate is
// sitting right there in velocast_hr_profile_cache from last time. This reads
// that cache (no network, no fetchActivitiesPage) and picks the same "best"
// row loadHrLthrEstimate() would land on (highest confidence, ties broken by
// the higher bpm value). Called lazily from trainerRiderContext() below so it
// costs nothing on the power-only path and never blocks the normal render.
function syncCachedHrLthrEstimate(){
  const cache = loadHrProfileCache();
  const best = Object.values(cache).reduce((a,b) => {
    if(!a) return b;
    if(CONFIDENCE_WEIGHT[b.confidence] !== CONFIDENCE_WEIGHT[a.confidence]) return CONFIDENCE_WEIGHT[b.confidence] > CONFIDENCE_WEIGHT[a.confidence] ? b : a;
    return b.lthr > a.lthr ? b : a;
  }, null);
  if(!best) return;
  const tp = state.trainerPage;
  tp.hrProfile.estimate = best.lthr;
  tp.hrProfile.source = `aus deinen Fahrten geschätzt (${best.basis}, ${best.confidence}e Zuversicht)`;
}

// ---------- Trainer: blended training-load model for HF-only users ----------
// buildTrainingLoad() (~2393) only ever sees pp.results, which is Profil's
// own power-meter-only pipeline (device_watts filtered before a stream is
// even fetched) -- HF-only riders always get pp.trainingLoad === null there,
// silencing acwr/freshness/forceEasy entirely (see plan §7). This is a
// separate, additive per-day TSS series built straight from the raw Strava
// activity list instead of pp.results, so HF-only rides are captured too.
//
// Per ride: prefer a watt-based TSS when the ride has power data (mirrors
// buildTrainingLoad()'s own NP/FTP formula exactly, just sourced from the
// activity summary's own weighted_average_watts -- Strava's own NP-equivalent
// computed at upload time -- instead of a stream-derived NP, so this needs NO
// stream fetch at all: every field it reads already sits on the plain
// /athlete/activities list response). Otherwise, if average_heartrate and a
// resolved LTHR are available, fall back to the same simplified hrTSS formula
// used by workoutMetrics()'s HR branch (~6593, plan §6): IF_HR = avgHR/LTHR,
// hrTSS = hours × IF_HR² × 100. A ride with neither is skipped (no TSS that
// day), same as buildTrainingLoad() implicitly skipping rides with no NP.
//
// Independent of the currently active equipmentMode -- this answers "what
// actually happened", not "what is the current target" -- so a power-meter
// ride still contributes a watt-based TSS day even while the rider is
// currently in HR mode, and vice versa.
function buildBlendedTrainingLoad(activities, ftp, lthr){
  const daily = new Map();
  let earliest = null;
  (activities||[]).forEach(a => {
    const sec = a.moving_time || 0;
    if(sec <= 0) return;
    let tss = null;
    if(a.device_watts && a.weighted_average_watts && ftp){
      const np = a.weighted_average_watts, intensity = np/ftp;
      tss = (sec*np*intensity)/(ftp*3600)*100;
    } else if(a.average_heartrate != null && lthr){
      const ifHr = a.average_heartrate/lthr, hours = sec/3600;
      tss = hours*ifHr*ifHr*100;
    }
    if(tss == null || !isFinite(tss)) return;
    const d = new Date(a.date);
    if(isNaN(d.getTime())) return;
    const key = localDateKey(d);
    daily.set(key, (daily.get(key)||0) + tss);
    if(!earliest || d < earliest) earliest = d;
  });
  if(!earliest) return null;

  // Same EWMA procedure as buildTrainingLoad(), via the shared
  // computeEwmaLoadSeries() helper -- 42-day/7-day time constants -- just fed
  // by the blended daily TSS above instead of pp.results' NP-based TSS.
  // formVerdict/rampWeekly come out identical to buildTrainingLoad() too
  // (renderTrainerSummaryCards reads them for the Fitness/Ermüdung/Form cards
  // regardless of equipmentMode) so an HR-only rider gets the same cards
  // filled in, not a permanent "–".
  return computeEwmaLoadSeries(daily, earliest);
}

// Mirrors HR_PROFILE_CACHE_KEY's shape/rationale, under its own key. Caches
// the RAW per-ride summary fields buildBlendedTrainingLoad() needs -- NOT the
// derived CTL/ATL numbers -- since ftp/lthr can change (manual LTHR edited, a
// fresh estimate lands) without invalidating anything cached here; the blend
// is a cheap pure recompute over these rows on every trainerRiderContext() call.
const BLENDED_LOAD_CACHE_KEY = "velocast_blended_load_cache";
const BLENDED_LOAD_CACHE_MAX = 400;
// Same default as pp.rideBudget (~788) and HR_PROFILE_RIDE_BUDGET above --
// no separate "Mehr laden" UI for this pipeline in this phase either.
const BLENDED_LOAD_RIDE_BUDGET = 60;
// Separate key (not bundled into the ride cache) for the last fetch-ATTEMPT
// timestamp -- deliberately NOT the newest ride's date. Gating staleness on
// the newest cached ride's date re-triggers a fetch on every render whenever
// the rider hasn't ridden in >1 day (any rest day), or the fetch itself keeps
// failing, or the account has zero rides -- none of those make a fresh fetch
// any more likely to find newer data, so that version loops: render -> stale
// -> fetch -> render -> stale -> fetch -> ... Gating on "did we already TRY
// recently" instead bounds retries to once per BLENDED_LOAD_REFRESH_MS
// regardless of outcome, fixing the loop while still refreshing periodically.
const BLENDED_LOAD_FETCHED_AT_KEY = "velocast_blended_load_fetched_at";
const BLENDED_LOAD_REFRESH_MS = 6 * 60 * 60 * 1000; // 6h
function loadBlendedLoadCache(){
  try{
    const raw = localStorage.getItem(BLENDED_LOAD_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, row]) => {
      if(!row || typeof row !== "object" || !row.date || !row.id) return;
      out[String(id)] = row;
    });
    return out;
  }catch(e){ return {}; }
}
function saveBlendedLoadCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0, cap);
    const trimmed = {};
    entries.forEach(r => { trimmed[r.id] = r; });
    localStorage.setItem(BLENDED_LOAD_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(BLENDED_LOAD_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function clearBlendedLoadCache(){ try{ localStorage.removeItem(BLENDED_LOAD_CACHE_KEY); }catch(e){} }
function clearBlendedLoadFetchedAt(){ try{ localStorage.removeItem(BLENDED_LOAD_FETCHED_AT_KEY); }catch(e){} }
function loadBlendedLoadFetchedAt(){
  try{ const raw = localStorage.getItem(BLENDED_LOAD_FETCHED_AT_KEY); const n = raw ? Number(raw) : 0; return isFinite(n) ? n : 0; }
  catch(e){ return 0; }
}
function saveBlendedLoadFetchedAt(ts){ try{ localStorage.setItem(BLENDED_LOAD_FETCHED_AT_KEY, String(ts)); }catch(e){} }

// Orchestrates the blend ingestion: paginates /athlete/activities up to
// BLENDED_LOAD_RIDE_BUDGET rides (mirrors loadHrLthrEstimate()'s own
// pagination loop exactly), keeps only the handful of summary fields the
// blend formula needs -- no stream fetch, no concurrency batching required,
// since nothing here needs a per-ride network call -- and caches them.
//
// Triggered from two places: the equipmentMode toggle (eager first load, see
// buildEquipmentModeCard()) AND the normal Trainer-tab render path itself
// (trainerRiderContext(), see the staleness check there) -- a rider who
// leaves equipmentMode='hr' set across sessions would otherwise never
// refresh past that first toggle-triggered fetch, and the cache would go
// stale forever (ACWR decaying toward 0 as it reads an ever-older snapshot).
// The .loading guard above is what keeps both trigger sites safe together --
// whichever call gets here first wins, the other just returns.
// See syncCachedBlendedLoad() below for the cache-only fallback used on reload.
async function loadBlendedTrainingLoad(token, opts){
  opts = opts || {};
  const tp = state.trainerPage;
  if(tp.blendedLoad.loading) return;
  if(!token){ tp.blendedLoad.error = "Bitte zuerst mit Strava verbinden."; render(); return; }
  if(opts.forceRefresh) clearBlendedLoadCache();
  tp.blendedLoad.loading = true; tp.blendedLoad.error = null;
  // Mark the attempt NOW, before the network call, and persist it -- this is
  // what the staleness check in trainerRiderContext() gates on. Set here
  // (not only on success) so a persistently failing fetch still backs off
  // for BLENDED_LOAD_REFRESH_MS instead of being retried on every render.
  tp.blendedLoad.fetchedAt = Date.now();
  saveBlendedLoadFetchedAt(tp.blendedLoad.fetchedAt);
  render();
  let success = false;
  try{
    let candidates = [];
    let page = 1;
    const perPage = 100;
    while(candidates.length < BLENDED_LOAD_RIDE_BUDGET && page <= 10){
      const batch = await fetchActivitiesPage(token, page, perPage);
      if(!batch || !batch.length) break;
      candidates = candidates.concat(batch.filter(a => RIDE_SPORT_TYPES.has(a.sport_type || a.type)));
      if(batch.length < perPage) break;
      page++;
    }
    candidates = candidates.slice(0, BLENDED_LOAD_RIDE_BUDGET);

    const cache = loadBlendedLoadCache();
    candidates.forEach(a => {
      const id = String(a.id);
      cache[id] = {
        id,
        date: a.start_date_local || a.start_date,
        moving_time: a.moving_time || 0,
        device_watts: !!a.device_watts,
        weighted_average_watts: a.weighted_average_watts != null ? a.weighted_average_watts : null,
        average_heartrate: a.average_heartrate != null ? a.average_heartrate : null,
      };
    });
    saveBlendedLoadCache(cache);
    tp.blendedLoad.activities = Object.values(cache);
    success = true;
  }catch(e){
    tp.blendedLoad.error = e.message || "Trainingsbelastung konnte nicht geladen werden.";
  }
  tp.blendedLoad.loading = false;
  // Issue 3 fix: only mark `loaded` on an actual successful fetch. Setting it
  // unconditionally (including on a failed fetch that left `activities` at
  // whatever it was before, possibly still null on a first-ever attempt)
  // used to permanently defeat the `!activities && !loaded` cache-fallback
  // guard in trainerRiderContext() for the rest of the session -- a single
  // transient network blip would then keep a perfectly good previous
  // localStorage snapshot from ever being read again until a full reload.
  // Leaving `loaded` false on failure lets that guard keep retrying
  // syncCachedBlendedLoad() (a cheap, harmless local read) on every render.
  if(success) tp.blendedLoad.loaded = true;
  render();
}

// Cheap, synchronous cache-only fallback for loadBlendedTrainingLoad() above,
// mirroring syncCachedHrLthrEstimate()'s rationale exactly: on a fresh page
// load state.trainerPage.blendedLoad.activities starts back at null (in-
// memory only), so a reload with equipmentMode already 'hr' would otherwise
// show "Unbekannt" freshness until the network pipeline runs again this
// session, even though the raw rows are sitting in BLENDED_LOAD_CACHE_KEY
// from last time. No network call here. Called lazily from
// trainerRiderContext() so it costs nothing on the power-only path.
function syncCachedBlendedLoad(){
  const rows = Object.values(loadBlendedLoadCache());
  if(rows.length) state.trainerPage.blendedLoad.activities = rows;
  // Restore the persisted fetch-attempt timestamp too, so a page reload
  // within BLENDED_LOAD_REFRESH_MS of the last attempt doesn't look "stale"
  // in trainerRiderContext() and immediately re-fetch on first render.
  // Only overwrite when a persisted value actually exists: loadBlendedTrainingLoad()
  // already stamps fetchedAt in memory synchronously before its first await, so if
  // saveBlendedLoadFetchedAt() silently failed (private-mode Safari, quota pressure)
  // this must not clobber that fresh stamp back down to 0 -- doing so would make
  // every render look stale again and re-trigger a fetch loop against a failing API.
  const persisted = loadBlendedLoadFetchedAt();
  if(persisted) state.trainerPage.blendedLoad.fetchedAt = persisted;
}

function trainerRiderContext(pp){
  const rp0 = pp.riderProfile;
  if(!rp0) return null;
  const results = pp.results || [];
  const today = new Date();
  const daysAgo = d => (today-d)/86400000;

  // HF-only resolved LTHR, mirroring rp0.ftp/rp0.ftpSource's shape exactly.
  // rp.lthr/rp.lthrSource/rp.usingHr are read throughout the Trainer tab
  // (charts, step list, zone legend, context cards, gate, generation and
  // evaluation). Resolved BEFORE the load/acwr block below (moved up from
  // this function's original layout) since the blended-load branch needs
  // `lthr` for its hrTSS fallback -- purely a reordering, no behavior change
  // for the lthr/lthrSource/usingHr values themselves.
  //
  // Lazy cache-only fallback (see syncCachedHrLthrEstimate() above) so a
  // reload with equipmentMode already 'hr' doesn't fire the empty-state gate
  // before the full loadHrLthrEstimate() network pipeline has ever run this
  // session. Skipped once that pipeline has run (tp.hrProfile.loaded) so it
  // doesn't fight a real "no estimate found" outcome on every render.
  if(state.equipmentMode === 'hr' && !state.trainerPage.hrProfile.estimate && !state.trainerPage.hrProfile.loaded && !TRAINING_CONFIG.rider.lthrOverride){
    syncCachedHrLthrEstimate();
  }
  const lthrOverride = TRAINING_CONFIG.rider.lthrOverride;
  const lthrEstimate = state.trainerPage.hrProfile.estimate;
  const lthr = lthrOverride || lthrEstimate || null;
  const lthrSource = lthrOverride ? 'manuell in den Einstellungen hinterlegt'
    : (lthrEstimate ? 'aus deinen Fahrten geschätzt' : null);
  const usingHr = state.equipmentMode === 'hr';

  // Trainingsbelastung: power path is byte-for-byte pp.trainingLoad, exactly
  // as before this phase -- zero change for power users. HF path switches to
  // the additive blend source (buildBlendedTrainingLoad, see above), with the
  // same cache-only-on-reload fallback story as the LTHR estimate above.
  let load;
  if(usingHr){
    if(!state.trainerPage.blendedLoad.activities && !state.trainerPage.blendedLoad.loaded){
      syncCachedBlendedLoad();
    }
    // Bug 1 fix (round 2): refresh trigger from the render path itself, not
    // just the equipmentMode toggle's onchange handler (buildEquipmentModeCard()).
    // Without this, a rider who leaves equipmentMode='hr' set across sessions
    // only ever gets ONE fetch (from that first toggle flip) and every later
    // render/reload reads an increasingly stale localStorage snapshot forever
    // -- ACWR silently decays toward 0, the exact inverse of the overload-
    // protection this feature exists for.
    //
    // NOTE: the first version of this fix gated "stale" on the newest CACHED
    // RIDE's date (>1 day old). That re-triggers on every render whenever the
    // rider simply hasn't ridden today (any rest day), or the fetch keeps
    // failing, or the account has zero rides -- fetching never makes the
    // rider's last ride any newer, so render() -> stale -> fetch -> render()
    // -> stale -> fetch -> ... looped without bound. Gating on "did we already
    // ATTEMPT a fetch recently" (fetchedAt, set unconditionally -- success or
    // failure -- at the start of loadBlendedTrainingLoad() and persisted via
    // BLENDED_LOAD_FETCHED_AT_KEY so a page reload doesn't forget it) bounds
    // retries to once per BLENDED_LOAD_REFRESH_MS regardless of outcome,
    // fixing the loop while still refreshing periodically.
    //
    // Deferred via setTimeout(0) rather than calling loadBlendedTrainingLoad()
    // directly here: that function calls render() synchronously before its
    // first await, and trainerRiderContext() itself runs synchronously
    // inside an in-progress render() call (renderTrainerPage() -> here). A
    // same-tick render() call would re-enter the outer render() while it's
    // still building the current DOM tree (app.innerHTML was already
    // cleared) and end up appending a duplicated tree. Deferring to the next
    // tick lets the current render() finish first, so the refresh's own
    // render() is a normal, independent one. blendedLoad.loading is still
    // the guard that prevents duplicate concurrent fetches: even if several
    // renders happen to schedule this before the first callback fires, each
    // scheduled callback checks/sets that flag synchronously and in order,
    // so only the first actually calls the network -- and fetchedAt itself is
    // stamped synchronously at that same moment, before any await, so any
    // further renders in the same tick already see a fresh fetchedAt and
    // don't schedule a second attempt.
    if(state.accessToken && !state.trainerPage.blendedLoad.loading){
      const isStale = (Date.now() - (state.trainerPage.blendedLoad.fetchedAt || 0)) > BLENDED_LOAD_REFRESH_MS;
      if(isStale) setTimeout(()=>{ loadBlendedTrainingLoad(state.accessToken); }, 0);
    }
    load = state.trainerPage.blendedLoad.activities
      ? buildBlendedTrainingLoad(state.trainerPage.blendedLoad.activities, rp0.ftp, lthr)
      : null;
  } else {
    load = pp.trainingLoad;
  }

  const acwr = (load && load.ctl>0) ? load.atl/load.ctl : null;
  const wPerKg = (rp0.weight && rp0.ftp) ? rp0.ftp/rp0.weight : null;

  // Issue 4 fix: hoursIn7/ridesIn7/daysSinceHard/daysSinceRide used to be
  // derived from `results` (pp.results) unconditionally, even in HR mode --
  // but pp.results is Profil's device_watts-filtered pipeline (~2670) and is
  // always empty for HR-only riders, so "Woche bisher" permanently showed
  // "0,0 h / 0 Fahrten", "Letzte harte Einheit" permanently showed "keine
  // erkannt", and the rodeHardYesterday/hoursIn7>8 branches that feed
  // forceEasy/volume logic (~7292, 7478, 7559) were permanently dead in HR
  // mode -- silently weakening the overload guard on top of Bug 1. The HR
  // branch below derives the same four metrics from the blended-load cache
  // rows instead (same raw per-ride data buildBlendedTrainingLoad() above
  // uses -- date + moving_time + watts/heartrate -- covering the rider's
  // full activity history, power+HR combined, not just power rides). The
  // power branch is untouched, byte-for-byte the same computation as before.
  let hoursIn7, ridesIn7, daysSinceHard, daysSinceRide;
  if(usingHr){
    const blendedRows = state.trainerPage.blendedLoad.activities || [];
    const recentRows = blendedRows.filter(r=>{ const d=new Date(r.date); return !isNaN(d.getTime()) && daysAgo(d)<=7; });
    hoursIn7 = recentRows.reduce((s,r)=>s+(r.moving_time||0),0)/3600;
    ridesIn7 = recentRows.length;
    // "Hard" mirrors the power path's >=93%-of-threshold definition, just
    // sourced per-ride from whichever metric that ride actually has: NP vs
    // FTP when it's a power ride, avg HR vs LTHR otherwise (same fallback
    // buildBlendedTrainingLoad() uses for its per-ride TSS above).
    const hardBlendedRows = blendedRows.filter(r=>{
      if(r.device_watts && r.weighted_average_watts && rp0.ftp) return r.weighted_average_watts >= rp0.ftp*0.93;
      if(r.average_heartrate != null && lthr) return r.average_heartrate >= lthr*0.93;
      return false;
    }).sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lastHardBlended = hardBlendedRows.length ? hardBlendedRows[hardBlendedRows.length-1] : null;
    daysSinceHard = lastHardBlended ? Math.floor(daysAgo(new Date(lastHardBlended.date))) : null;
    const sortedRows = blendedRows.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    const lastBlendedRide = sortedRows.length ? sortedRows[sortedRows.length-1] : null;
    daysSinceRide = lastBlendedRide ? Math.floor(daysAgo(new Date(lastBlendedRide.date))) : null;
  } else {
    hoursIn7 = results.filter(r=>daysAgo(r.date)<=7).reduce((s,r)=>s+(r.movingSec||0),0)/3600;
    ridesIn7 = results.filter(r=>daysAgo(r.date)<=7).length;
    const hardRides = results.filter(r=>r.confidence!=='unbestätigt' && r.estFtp!=null && rp0.ftp && r.estFtp>=rp0.ftp*0.93);
    const lastHard = hardRides.length ? hardRides[hardRides.length-1] : null;
    daysSinceHard = lastHard ? Math.floor(daysAgo(lastHard.date)) : null;
    const lastRide = results.length ? results[results.length-1] : null;
    daysSinceRide = lastRide ? Math.floor(daysAgo(lastRide.date)) : null;
  }

  let freshness='Unbekannt', freshnessClass='warn', freshnessWhy='Zu wenig Belastungsdaten für eine Frische-Einschätzung.';
  if(acwr!=null){
    if(acwr>1.5){ freshness='Deutlich überlastet'; freshnessClass='danger';
      freshnessWhy=`Deine Ermüdung (ATL) liegt ${Math.round((acwr-1)*100)}% über deiner Fitness (CTL).`; }
    else if(acwr>1.25){ freshness='Erhöhte Belastung'; freshnessClass='warn';
      freshnessWhy=`ATL liegt ${Math.round((acwr-1)*100)}% über CTL – produktiv, aber bald ist ein Entlastungstag fällig.`; }
    else if(acwr<0.75){ freshness='Frisch / untertrainiert'; freshnessClass='good';
      freshnessWhy=`ATL liegt ${Math.round((1-acwr)*100)}% unter CTL. Gut erholt.`; }
    else { freshness='Ausgeglichen'; freshnessClass='good'; freshnessWhy='Deine Ermüdung entspricht ungefähr deiner Fitness.'; }
  }

  // blendedLoad is exposed (not just acwr) so renderTrainerSummaryCards() can
  // show real Fitness/Ermüdung/Form cards for HR-only riders too, instead of
  // permanent "–" placeholders next to a working Frische/ACWR card -- the
  // rows already carry ctl/atl/tsb/formVerdict, computed identically to
  // pp.trainingLoad's (see buildBlendedTrainingLoad()'s own comment).
  return { ...rp0, wPerKg, acwr, freshness, freshnessClass, freshnessWhy, hoursIn7, ridesIn7, daysSinceHard, daysSinceRide, lthr, lthrSource, usingHr, blendedLoad: usingHr ? load : null,
    speedModel: computeSpeedModel(results) };
}

// rp.usingHr branches to a simplified hrTSS (TrainingPeaks methodology:
// IF_HR = avgHR/LTHR, hrTSS = hours × IF_HR² × 100) instead of NP⁴-weighted
// power TSS -- HR has no NP-equivalent (it's already a self-smoothing,
// slower-moving signal than power, so a rolling 4th-power average would just
// double-smooth it, not add information). The full TrainingPeaks hrTSS
// formula also curve-corrects at very low/high HR; that correction needs a
// reference table this app doesn't have without an external library, so this
// is a deliberate simplification -- plain time-weighted IF_HR², no curve fit.
// `np`/`avgPower` are reused (not renamed) to keep this a single return
// shape both branches' one caller can consume identically; in the HR branch
// they both just hold the time-weighted average target bpm (no NP-style
// weighting exists to make them diverge from one another the way real
// power's np vs avgPower do).
function workoutMetrics(steps, rp){
  const usingHr = rp.usingHr;
  const metricValue = usingHr ? rp.lthr : rp.ftp;
  let totalSec=0;
  if(usingHr){
    let sumPctSec=0;
    steps.forEach(s=>{ const sec=s.minutes*60; totalSec+=sec; sumPctSec+=s.pct*sec; });
    if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0 };
    const avgIF = sumPctSec/totalSec, avgHrTarget = avgIF*metricValue, hours = totalSec/3600;
    return { totalMin:Math.round(totalSec/60), np:Math.round(avgHrTarget), avgPower:Math.round(avgHrTarget), intensityFactor:avgIF,
      tss: Math.round(hours*avgIF*avgIF*100) };
  }
  let sumP4=0, sumP=0;
  steps.forEach(s=>{ const sec=s.minutes*60, w=s.pct*metricValue; totalSec+=sec; sumP4+=Math.pow(w,4)*sec; sumP+=w*sec; });
  if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0 };
  const np=Math.pow(sumP4/totalSec,0.25), intensityFactor=np/metricValue;
  return { totalMin:Math.round(totalSec/60), np:Math.round(np), avgPower:Math.round(sumP/totalSec), intensityFactor,
    tss: Math.round((totalSec*np*intensityFactor)/(metricValue*3600)*100) };
}

// ---------- Trainer: route-based training ----------
// Turns an attached GPX/Strava route into a workout whose hard efforts sit on
// the route's own terrain (climbs) instead of being generic time blocks —
// ported near-verbatim from the Artifact (haversine/GPX parsing itself is
// NOT duplicated here — see handleTrainerGpxFile()/attachSavedStravaRouteToTrainer()
// below, which build the same {lat,lon,ele,dist} point shape by reusing
// VeloCast's own parseGpxTrack()/fetchRouteStreams()/buildCumulativeDistances()).
function smoothElevation(pts, windowM){
  const n = pts.length;
  const out = new Array(n);
  let lo = 0, hi = 0, sum = 0, cnt = 0;
  for(let i=0;i<n;i++){
    while(hi < n && pts[hi].dist - pts[i].dist <= windowM/2){ if(pts[hi].ele!=null){ sum+=pts[hi].ele; cnt++; } hi++; }
    while(lo < i && pts[i].dist - pts[lo].dist > windowM/2){ if(pts[lo].ele!=null){ sum-=pts[lo].ele; cnt--; } lo++; }
    out[i] = cnt>0 ? sum/cnt : (pts[i].ele??0);
  }
  return out;
}
function computeCurvature(pts, windowM){
  windowM = windowM == null ? 300 : windowM;
  const n = pts.length;
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const bearing = new Array(n).fill(0);
  for(let i=0;i<n-1;i++){
    const lat1=toRad(pts[i].lat), lat2=toRad(pts[i+1].lat), dLon=toRad(pts[i+1].lon-pts[i].lon);
    const y = Math.sin(dLon)*Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    bearing[i] = (toDeg(Math.atan2(y,x))+360)%360;
  }
  bearing[n-1] = n>1 ? bearing[n-2] : 0;
  const turn = new Array(n).fill(0);
  for(let i=1;i<n-1;i++){
    let d = Math.abs(bearing[i]-bearing[i-1]);
    if(d > 180) d = 360-d;
    turn[i] = d;
  }
  const curviness = new Array(n).fill(0);
  let lo=0, hi=0, sum=0;
  for(let i=0;i<n;i++){
    while(hi<n && pts[hi].dist-pts[i].dist <= windowM/2){ sum+=turn[hi]; hi++; }
    while(lo<i && pts[i].dist-pts[lo].dist > windowM/2){ sum-=turn[lo]; lo++; }
    const hiIdx = Math.min(hi, n-1), loIdx = Math.min(lo, n-1);
    const span = Math.max(1, pts[hiIdx].dist - pts[loIdx].dist);
    curviness[i] = sum/span*1000;
  }
  return curviness;
}
function detectIntersectionCandidates(pts, thresholdDeg, minGapM){
  thresholdDeg = thresholdDeg == null ? 55 : thresholdDeg;
  minGapM = minGapM == null ? 25 : minGapM;
  const n = pts.length;
  if(n < 3) return [];
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  const bearing = new Array(n-1).fill(0);
  for(let i=0;i<n-1;i++){
    const lat1=toRad(pts[i].lat), lat2=toRad(pts[i+1].lat), dLon=toRad(pts[i+1].lon-pts[i].lon);
    const y = Math.sin(dLon)*Math.cos(lat2);
    const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
    bearing[i] = (toDeg(Math.atan2(y,x))+360)%360;
  }
  const out = [];
  for(let i=1;i<n-1;i++){
    const gapM = pts[i+1].dist - pts[i-1].dist;
    if(gapM <= 0 || gapM > minGapM) continue;
    let d = Math.abs(bearing[i]-bearing[i-1]);
    if(d > 180) d = 360-d;
    if(d >= thresholdDeg) out.push({ idx:i, dist:pts[i].dist, turnDeg:Math.round(d) });
  }
  return out;
}
// Collapses directly-adjacent segments that share a type into one, weighting
// avgGradient/avgCurviness by distance. Used twice inside analyzeRoute():
// once right before the climb-bridging pass (so a gap that's really two
// adjacent same-type raw fragments -- e.g. two "flat" pieces split by a
// sub-30m wobble -- becomes one before the bridge looks for a climb-X-climb
// triple, since otherwise the bridge never even considers it) and once after
// (to catch same-type adjacencies the bridge's own splicing can create).
function consolidateSameType(list, curvyThreshold){
  const out = [];
  list.forEach(seg => {
    const prev = out[out.length-1];
    if(prev && prev.type === seg.type){
      const distanceM = prev.distanceM + seg.distanceM;
      const elevChangeM = prev.elevChangeM + seg.elevChangeM;
      const avgGradient = distanceM > 0 ? elevChangeM/distanceM*100 : 0;
      const avgCurviness = distanceM > 0
        ? (prev.avgCurviness*prev.distanceM + seg.avgCurviness*seg.distanceM)/distanceM : 0;
      Object.assign(prev, { endDist:seg.endDist, endIdx:seg.endIdx, distanceM, elevChangeM, avgGradient,
                             avgCurviness, curvy: avgCurviness > curvyThreshold });
    } else {
      out.push({ ...seg });
    }
  });
  return out;
}
function analyzeRoute(pts, config){
  config = config || TRAINING_CONFIG;
  const rg = config.routeGeneration;
  const curvyThreshold = config.constraints.common.curveDensityThresholdDegPerKm;
  const n = pts.length;
  if(n < 2) return null;
  const totalDistanceM = pts[n-1].dist;
  const smoothed = smoothElevation(pts, rg.elevationSmoothingM);
  const curvinessArr = computeCurvature(pts, rg.curvinessWindowM);

  const LOOKAHEAD_M = rg.gradientLookaheadM, CLIMB_TH = rg.climbGradientThresholdPct, DESCENT_TH = rg.descentGradientThresholdPct;
  const classOf = g => g >= CLIMB_TH ? 'climb' : (g <= DESCENT_TH ? 'descent' : 'flat');
  const grad = new Array(n).fill(0);
  let j = 0;
  for(let i=0;i<n;i++){
    if(j < i) j = i;
    while(j < n-1 && pts[j].dist - pts[i].dist < LOOKAHEAD_M) j++;
    const dd = pts[j].dist - pts[i].dist;
    grad[i] = dd > 5 ? (smoothed[j]-smoothed[i])/dd*100 : 0;
  }

  let raw = [], curClass = classOf(grad[0]), start = 0;
  for(let i=1;i<n;i++){
    const c = classOf(grad[i]);
    if(c !== curClass){ raw.push({ type:curClass, startIdx:start, endIdx:i }); curClass = c; start = i; }
  }
  raw.push({ type:curClass, startIdx:start, endIdx:n-1 });

  const MIN_SEG_M = rg.minSegmentM;
  let merged = [];
  raw.forEach(seg => {
    const distM = pts[seg.endIdx].dist - pts[seg.startIdx].dist;
    if(distM < MIN_SEG_M && merged.length) merged[merged.length-1].endIdx = seg.endIdx;
    else merged.push({ ...seg });
  });
  if(merged.length > 1 && (pts[merged[0].endIdx].dist - pts[merged[0].startIdx].dist) < MIN_SEG_M){
    merged[1].startIdx = merged[0].startIdx;
    merged.shift();
  }

  const rawTyped = merged.map(seg => {
    const p0 = pts[seg.startIdx], p1 = pts[seg.endIdx];
    const e0 = smoothed[seg.startIdx], e1 = smoothed[seg.endIdx];
    const distanceM = p1.dist - p0.dist;
    const elevChangeM = e1 - e0;
    const avgGradient = distanceM > 0 ? elevChangeM/distanceM*100 : 0;
    const type = avgGradient >= CLIMB_TH ? 'climb' : (avgGradient <= DESCENT_TH ? 'descent' : 'flat');
    let curveSum = 0, curveCount = 0;
    for(let i=seg.startIdx;i<=seg.endIdx;i++){ curveSum += curvinessArr[i]; curveCount++; }
    const avgCurviness = curveCount ? curveSum/curveCount : 0;
    return { type, startDist:p0.dist, endDist:p1.dist, distanceM, elevChangeM, avgGradient,
             startIdx:seg.startIdx, endIdx:seg.endIdx, avgCurviness, curvy: avgCurviness > curvyThreshold };
  });

  // Bridges a short, non-descending interruption between two climb segments
  // (e.g. a brief false-flat mid-mountain that dips under
  // climbGradientThresholdPct just long enough to get its own segment) back
  // into one continuous climb. Without this, a sustained climb that never
  // actually loses elevation gets fragmented into pieces too short
  // individually to ever hold a class's minIntervalMin (see
  // placeIntervalsOnRoute) -- even though riding it never feels like the
  // climb ended. Only climb-gap-climb triples qualify, gated on BOTH the
  // gap's length (maxInterruptionM) and how much it actually descends
  // (maxInterruptionDescentPct) -- a real descent between two climbs (steeper
  // than the tolerance) is genuinely separate terrain and stays split
  // regardless of how short it is. Pre-consolidating same-type neighbours
  // (below) before this runs matters: a gap that's really two adjacent
  // "flat" raw fragments split by sub-30m noise would otherwise never even
  // present as a single climb-X-climb triple for this loop to consider. The
  // merge is additionally rejected if the bridged span's own recomputed
  // average gradient would fall back under bridgeMinAvgGradientPct -- a
  // DEDICATED, usually-lower threshold from climbGradientThresholdPct on
  // purpose: climbGradientThresholdPct also drives point classification and
  // per-segment retyping everywhere else on the route, so reusing it here
  // would make a shallow-but-real interruption between two genuine climbs
  // (which necessarily drags the bridged span's own average below the
  // point-level climb threshold -- that's the whole reason this bridge
  // exists) impossible to ever bridge without also reclassifying terrain on
  // every other route. Runs to a fixed point since one merge can create a
  // new climb-gap-climb adjacency with whatever follows.
  const maxGapM = config.constraints.common.maxInterruptionM;
  const maxGapDescentPct = config.constraints.common.maxInterruptionDescentPct;
  const bridgeMinAvgGradientPct = config.constraints.common.bridgeMinAvgGradientPct;
  const bridged = consolidateSameType(rawTyped, curvyThreshold);
  if(maxGapM > 0){
    let mergedAny = true;
    while(mergedAny){
      mergedAny = false;
      for(let i=1;i<bridged.length-1;i++){
        const prev = bridged[i-1], gap = bridged[i], next = bridged[i+1];
        if(prev.type!=='climb' || next.type!=='climb' || gap.type==='climb') continue;
        if(gap.distanceM > maxGapM || gap.avgGradient < maxGapDescentPct) continue;
        const distanceM = next.endDist - prev.startDist;
        const elevChangeM = prev.elevChangeM + gap.elevChangeM + next.elevChangeM;
        const avgGradient = distanceM > 0 ? elevChangeM/distanceM*100 : 0;
        if(avgGradient < bridgeMinAvgGradientPct) continue;
        const avgCurviness = distanceM > 0
          ? (prev.avgCurviness*prev.distanceM + gap.avgCurviness*gap.distanceM + next.avgCurviness*next.distanceM)/distanceM
          : 0;
        const mergedSeg = { type:'climb', startDist:prev.startDist, endDist:next.endDist, distanceM, elevChangeM, avgGradient,
          startIdx:prev.startIdx, endIdx:next.endIdx, avgCurviness, curvy: avgCurviness > curvyThreshold };
        bridged.splice(i-1, 3, mergedSeg);
        mergedAny = true;
        break;
      }
    }
  }

  // Same-type consolidation runs a second time here (see consolidateSameType
  // above the pre-bridge call) to catch adjacencies the bridge's own
  // splicing can create, and also the pre-existing case this pass always
  // handled: two directly-adjacent merged segments that happen to land on
  // the same type without ever going through the bridge at all -- visible
  // e.g. as several consecutive "Verbindung" steps with identical target
  // power in an exported workout, since baselinePctForSegment() only
  // distinguishes by `type`.
  const segments = consolidateSameType(bridged, curvyThreshold);

  let totalElevGainM = 0;
  for(let i=1;i<n;i++){ const d = smoothed[i]-smoothed[i-1]; if(d>0) totalElevGainM += d; }

  const climbs = segments.filter(s=>s.type==='climb' && s.distanceM>=150).sort((a,b)=>b.distanceM-a.distanceM);

  return { points: pts, smoothed, totalDistanceM, totalElevGainM, segments, climbs };
}
function gradientSuitability(gradient, band){
  const g = gradient == null ? 0 : gradient;
  if(!band) return 'unsuitable';
  if(g >= band.idealMin && g <= band.idealMax) return 'ideal';
  if(g >= band.acceptableMin && g <= band.acceptableMax) return 'acceptable';
  return 'unsuitable';
}
function segmentHasIntersection(segment, intersections){
  return (intersections||[]).some(p => p.dist >= segment.startDist && p.dist <= segment.endDist);
}
function evaluateSegmentForClass(segment, classKey, config, opts){
  opts = opts || {};
  const cc = config.constraints.byClass[classKey];
  const reasons = [];
  if(!cc || segment.type === 'descent'){
    return { tier:'unsuitable', reasons:['Gefälle wird für harte Trainingsreize nicht genutzt.'] };
  }
  let tier = gradientSuitability(segment.avgGradient, cc.gradient);
  if(tier === 'unsuitable') reasons.push('Steigung außerhalb des zulässigen Bereichs für diese Klasse.');
  if(!opts.ignoreCurve && segment.curvy){ tier = 'unsuitable'; reasons.push('Abschnitt zu kurvig.'); }
  if(!opts.ignoreIntersections && segmentHasIntersection(segment, opts.intersections)){
    tier = 'unsuitable'; reasons.push('Mögliche Kreuzung/Stop im Abschnitt erkannt.');
  }
  return { tier, reasons };
}
function computeRouteSuitability(route, classKey, config, options){
  const cc = config.constraints.byClass[classKey];
  if(!cc || !route || !route.segments || !route.segments.length){
    return { score:0, workableKm:0, reasons:['Keine Streckendaten vorhanden.'] };
  }
  options = options || {};
  const ignoreCurve = !!options.ignoreCurveConstraints;
  const ignoreIntersections = !!options.ignoreIntersectionConstraints;
  const intersections = options.intersectionCandidates
    || detectIntersectionCandidates(route.points, config.constraints.common.intersectionTurnDeg, config.constraints.common.intersectionGapM);

  let workableM = 0, eligibleM = 0;
  route.segments.forEach(seg => {
    if(seg.type === 'descent') return;
    eligibleM += seg.distanceM;
    const verdict = evaluateSegmentForClass(seg, classKey, config, { ignoreCurve, ignoreIntersections, intersections });
    if(verdict.tier === 'ideal') workableM += seg.distanceM;
    else if(verdict.tier === 'acceptable') workableM += seg.distanceM * 0.6;
  });

  const workableKm = workableM/1000;
  const routeKm = route.totalDistanceM/1000;
  let score = eligibleM > 0 ? Math.round(Math.min(100, workableM/eligibleM*100)) : 0;
  const reasons = [];
  if(routeKm < (cc.minRouteKm||0)){
    score = Math.min(score, 35);
    reasons.push(`Route ist mit ${routeKm.toFixed(0)}km kürzer als die für diese Klasse empfohlenen ${cc.minRouteKm}km.`);
  }
  if(workableKm < (cc.minWorkableKm||0)){
    score = Math.min(score, 40);
    reasons.push(`Nur ${workableKm.toFixed(1)}km geeignetes Terrain gefunden (empfohlen: ${cc.minWorkableKm}km).`);
  }
  if(!reasons.length && score < config.suitability.minAcceptable){
    reasons.push('Zu wenig zusammenhängend geeignetes Terrain für diese Trainingsklasse.');
  }
  return { score, workableKm: Math.round(workableKm*10)/10, reasons };
}

// Gleiche Test-Reihenfolge wie der ursprüngliche if-Chain (NICHT nach
// numerischem Wert sortiert -- g>=6 wird vor g<=-4 geprüft usw.), damit die
// Bucket-Zuordnung für estimateSpeedKmh()'s Fallback byte-identisch zum
// bisherigen Verhalten bleibt. fallbackKmh greift, solange rp.speedModel für
// diese Zelle noch keine ausreichend kalibrierten Daten hat (siehe
// computeSpeedModel unten).
const GRADIENT_BUCKETS = [
  { test: g => g >= 6,  fallbackKmh: 12 },
  { test: g => g >= 3,  fallbackKmh: 16 },
  { test: g => g >= 1,  fallbackKmh: 20 },
  { test: g => g <= -4, fallbackKmh: 42 },
  { test: g => g <= -1, fallbackKmh: 32 },
  { test: () => true,   fallbackKmh: 27 },
];
const GRADIENT_BUCKET_LABELS = ['Steiler Anstieg (≥6%)','Anstieg (3–6%)','Leichter Anstieg (1–3%)',
  'Steile Abfahrt (≤-4%)','Abfahrt (-4…-1%)','Flach (-1…1%)'];
function gradientBucketIndex(g){
  const grad = g == null ? 0 : g;
  for(let i=0;i<GRADIENT_BUCKETS.length;i++) if(GRADIENT_BUCKETS[i].test(grad)) return i;
  return GRADIENT_BUCKETS.length - 1;
}
// rp/seg.pct sind optional -- ohne rp.speedModel (oder ohne genug kalibrierte
// Daten für diese Zelle) verhält sich das exakt wie die alte, feste Tabelle.
function estimateSpeedKmh(seg, rp){
  const g = seg && seg.gradient!=null ? seg.gradient : 0;
  const gIdx = gradientBucketIndex(g);
  const model = rp && rp.speedModel;
  if(model){
    if(rp.usingHr){
      const row = model.gradientRows[gIdx];
      if(row) return row.kmh;
    } else if(seg && seg.pct != null){
      const zIdx = ZONES.indexOf(zoneFor(seg.pct));
      const cell = model.cells[gIdx*ZONES.length + zIdx];
      if(cell) return cell.kmh;
    }
  }
  return GRADIENT_BUCKETS[gIdx].fallbackKmh;
}
function estimateDistanceForMinutes(minutes, gradient, pct, rp){
  return minutes*60 * (estimateSpeedKmh({ gradient, pct }, rp)/3.6);
}
// Bindet grade_smooth/velocity_smooth/watts einer Fahrt in ein Steigung ×
// Leistungszone-Raster (siehe GRADIENT_BUCKETS/ZONES) -- pro Zelle [distM,
// sec]. >30s-Lücken oder <1 m/s (Stopp/Ampel) werden übersprungen, damit ein
// einzelner Stopp eine Zelle nicht künstlich nach unten zieht.
// velocity_smooth/grade_smooth sind Stravas eigene geglättete Streams --
// bewusst genutzt statt selbst aus Höhe/Distanz abgeleitet (vermeidet die
// Rauschprobleme, die detectRideClimbs() für reine Steigungserkennung schon
// mit eigener Glättung lösen musste). Einziger Aufrufer: processProfilRide().
function computeSpeedCalibrationFromStream(stream, ftp){
  const time = stream.time, watts = stream.watts, grade = stream.grade_smooth, vel = stream.velocity_smooth;
  if(!Array.isArray(time) || !Array.isArray(watts) || !Array.isArray(grade) || !Array.isArray(vel) || !ftp) return null;
  const n = Math.min(time.length, watts.length, grade.length, vel.length);
  const cells = Array.from({length: GRADIENT_BUCKETS.length * ZONES.length}, () => [0, 0]); // [distM, sec]
  for(let i=1; i<n; i++){
    const dt = time[i] - time[i-1];
    if(!(dt > 0) || dt > 30) continue;
    if(vel[i] == null || vel[i] < 1) continue;
    if(grade[i] == null || watts[i] == null) continue;
    const gIdx = gradientBucketIndex(grade[i]);
    const zIdx = ZONES.indexOf(zoneFor(watts[i]/ftp));
    const cell = cells[gIdx*ZONES.length + zIdx];
    cell[0] += vel[i]*dt; cell[1] += dt;
  }
  return cells;
}
// ~2 Minuten aufsummierte Fahrzeit über alle Fahrten hinweg, bevor eine Zelle
// als kalibriert gilt statt auf den generischen Schätzwert zurückzufallen --
// genug, um Rauschen auszumitteln, kurz genug, dass häufige Kombinationen
// (flach/Grundlage, mittlere Anstiege bei Schwelle) nach wenigen Fahrten
// kalibriert sind. Seltene Kombinationen (z.B. steile Abfahrt bei
// Schwellenleistung) bleiben ggf. dauerhaft auf dem Fallback -- erwartet,
// kein Bug.
const SPEED_CAL_MIN_SEC = 120;
function computeSpeedModel(results){
  const cells = Array.from({length: GRADIENT_BUCKETS.length*ZONES.length}, () => [0,0]);
  (results||[]).forEach(r => {
    if(!Array.isArray(r.speedCal)) return;
    r.speedCal.forEach((c,i) => { cells[i][0] += c[0]; cells[i][1] += c[1]; });
  });
  const cellModel = cells.map(([distM,sec], i) => {
    const gIdx = Math.floor(i/ZONES.length);
    return sec < SPEED_CAL_MIN_SEC
      ? { kmh: GRADIENT_BUCKETS[gIdx].fallbackKmh, calibrated:false, sec }
      : { kmh: distM/sec*3.6, calibrated:true, sec };
  });
  // Leistungsunabhängiger Steigungs-Rollup -- für HF-Modus, wo s.pct %LTHR
  // statt %FTP ist und sich nicht ohne verfälschende Umrechnung derselben
  // Spalten-Auswahl zuordnen lässt. Verliert die Leistungs-Auflösung, erfasst
  // aber weiterhin den dominanten Fehler (Tabelle ist über alle Steigungen
  // hinweg falsch, unabhängig von der Leistung).
  const gradientRows = GRADIENT_BUCKETS.map((b, gIdx) => {
    let distM=0, sec=0;
    for(let z=0; z<ZONES.length; z++){ const c = cells[gIdx*ZONES.length+z]; distM+=c[0]; sec+=c[1]; }
    return sec < SPEED_CAL_MIN_SEC ? { kmh:b.fallbackKmh, calibrated:false, sec } : { kmh: distM/sec*3.6, calibrated:true, sec };
  });
  return { cells: cellModel, gradientRows };
}
// Shared by placeIntervalsOnRoute() (initial step creation) and
// extendCompressedIntervalsBackward() (re-labeling after a compressed
// interval borrows distance from a preceding cruise step) so both places
// stay in sync on the interval step's display name format.
function intervalStepName(baseLabel, counter, distanceM, gradient){
  return `${baseLabel} ${counter} (${(distanceM/1000).toFixed(2)} km, ${gradient.toFixed(1)}%)`;
}
// Converts a time-based step list into distance-based steps (flat-road
// estimate) for devices that trigger workout steps by distance instead of
// time. Steps that already carry distanceM (route-adaptive workouts) are
// left untouched.
function stepsForDistanceExport(steps){
  return (steps||[]).map(s => s.distanceM != null ? s
    : Object.assign({}, s, { distanceM: estimateDistanceForMinutes(s.minutes||0, 0) }));
}
function baselinePctForSegment(seg, mode){
  const base = mode==='recovery' ? 0.52 : (mode==='endurance' ? 0.66 : 0.62);
  const climbBump = mode==='recovery' ? 0.04 : 0.09;
  const descentDrop = mode==='recovery' ? 0.04 : 0.08;
  let pct = base;
  if(seg.type==='climb') pct += climbBump;
  else if(seg.type==='descent') pct -= descentDrop;
  return Math.max(0.42, Math.min(0.78, pct));
}
const ROUTE_TERRAIN_PROFILES = { endurance: { mode:'endurance' }, recovery: { mode:'recovery' } };
const GOAL_IDEAL_GRADIENT = {
  vo2max:    { min:3, max:9 },
  ftp:       { min:2, max:6 },
  anaerobic: { min:5, max:99 },
};
function gradientMatchScore(gradient, ideal){
  const g = gradient==null ? 0 : gradient;
  if(g >= ideal.min && g <= ideal.max) return 100;
  const dist = g < ideal.min ? ideal.min-g : g-ideal.max;
  return Math.max(15, 100 - dist*18);
}
function computeSpecificityScore(workout, goal){
  const ideal = GOAL_IDEAL_GRADIENT[goal];
  const intervals = (workout.steps||[]).filter(s=>s.kind==='interval');
  if(!ideal || !intervals.length) return null;
  const totalDist = intervals.reduce((s,x)=>s+x.distanceM,0);
  if(!totalDist) return null;
  const weighted = intervals.reduce((s,x)=>s+gradientMatchScore(x.gradient,ideal)*x.distanceM, 0);
  return Math.round(weighted/totalDist);
}

// RPE (Rate of Perceived Exertion, 1-10) targets used INSTEAD of a real-time
// bpm target for HF-mode VO2max/Anaerobic/Sprint interval steps -- these
// efforts are all short enough (3 min down to 15s) that heart rate lags too
// far behind the actual effort to serve as a live target (Sprint included,
// not just the first two -- same HF-inertia problem, if anything worse given
// how short sprint efforts are; see plan §5). s.pct is left untouched on
// these steps (still needed for hrTSS estimation / chart zone coloring), only
// the *displayed* target switches to rpeLabel wherever equipmentMode==='hr'.
const RPE_TARGET_BY_CLASS = {
  vo2max:    { rpeTarget:9,  rpeLabel:'RPE 9 – nahezu maximale Anstrengung' },
  anaerobic: { rpeTarget:10, rpeLabel:'RPE 10 – maximale Anstrengung' },
  sprint:    { rpeTarget:10, rpeLabel:'RPE 10 – maximale Anstrengung' },
};

// Best current estimate for a rider's peak power at a given duration, used by
// generateTestWorkout() below as the "current best" baseline the test target
// is a margin above. Prefers a real measured value from rp.mmpCurve (built in
// buildRiderProfile() from the same recent-90-day ride pool that feeds every
// other best-value display in the app); falls back to deriving it from p20/
// FTP via REFERENCE_RATIOS for a duration the rider simply hasn't produced a
// measured best for yet (e.g. never done a genuine 1-minute all-out effort).
// 1200s (20 min) is the one REFERENCE_RATIOS doesn't cover -- FTP_FACTORS'
// own 20-min/0.95-factor convention already relates it to FTP directly, so
// p20 itself (or ftp/0.95 if p20 is unavailable) is the right baseline there.
function estimateCurrentBestForDuration(durationSec, rp){
  if(rp.mmpCurve && rp.mmpCurve[durationSec] != null) return rp.mmpCurve[durationSec];
  const ftpFactor20 = FTP_FACTORS.find(f=>f.sec===1200);
  const p20 = rp.p20 ?? (rp.ftp!=null && ftpFactor20 ? rp.ftp/ftpFactor20.factor : null);
  if(p20 == null) return null;
  if(durationSec === 1200) return p20;
  const ratio = REFERENCE_RATIOS[durationSec];
  return ratio != null ? p20*ratio : null;
}

// A pure, terrain-independent description of a goal's interval structure —
// reps, duration, target %FTP (or %LTHR/RPE in HF mode) and rest between
// them. Route placement below packs this queue onto the attached route's
// terrain.
function buildIntervalSpec(goal, rp){
  const acwr = rp.acwr;
  const elevated = acwr!=null && acwr>1.25;
  const fresh = acwr!=null && acwr<0.75;
  let volumeFactor = 1;
  if(elevated) volumeFactor = 0.8;
  if(fresh) volumeFactor = 1.15;
  const seg = (label, minutes, pct, note) => ({ label, minutes, pct, note: note||null });

  if(goal === 'ftp'){
    const reps = Math.max(2, Math.round(3*volumeFactor));
    const intervalMin = elevated ? 10 : 12;
    const repsList = [];
    for(let i=1;i<=reps;i++){
      repsList.push({ ...seg('Intervall', intervalMin, 0.97, rp.usingHr ? 'Gleichmäßig, knapp unter/an LTHR' : 'Gleichmäßig, knapp unter/an FTP'),
        restAfter: i<reps ? [seg('Pause', 5, 0.50)] : [] });
    }
    return { title:`${reps} × ${intervalMin} min an der Schwelle`, adaptation:'Laktat-Toleranz und Schwellenleistung',
      warmup: seg('Einrollen', 12, 0.55), activation: seg('Aktivierung', 3, 0.80, '2× 30s auf Tempo'),
      reps: repsList, cooldown: seg('Ausrollen', 10, 0.50),
      rationale:[{ type:'good', title:'Warum Schwellenintervalle',
        text: rp.usingHr
          ? `Schwelle steigt am effizientesten durch längere Blöcke knapp an der Schwelle (95–100%). Bei deiner LTHR von ${rp.lthr} bpm sind das etwa ${Math.round(rp.lthr*0.97)} bpm – "kontrolliert hart", nicht wie ein Wettkampf.`
          : `FTP steigt am effizientesten durch längere Blöcke knapp an der Schwelle (95–100%). Bei deinem FTP von ${rp.ftp} W sind das etwa ${Math.round(rp.ftp*0.97)} W – "kontrolliert hart", nicht wie ein Wettkampf.` }] };
  }
  if(goal === 'vo2max'){
    const reps = Math.max(4, Math.round(5*volumeFactor));
    const repsList = [];
    const rpe = rp.usingHr ? RPE_TARGET_BY_CLASS.vo2max : null;
    for(let i=1;i<=reps;i++){
      repsList.push({ ...seg('VO2max', 3, 1.15, 'Hart – die letzten 30s sollen brennen'), ...rpe,
        restAfter: i<reps ? [seg('Pause', 3, 0.45, 'Vollständig locker rollen')] : [] });
    }
    return { title:`${reps} × 3 min VO2max-Intervalle`, adaptation:'Maximale Sauerstoffaufnahme, Herzleistung',
      warmup: seg('Einrollen', 15, 0.55), activation: seg('Aktivierung', 4, 0.85, '3× 20s hart, je 40s locker'),
      reps: repsList, cooldown: seg('Ausrollen', 10, 0.48),
      rationale:[{ type:'good', title:'Warum 3-Minuten-Intervalle',
        text: rp.usingHr
          ? `VO2max-Reize brauchen Zeit "oben". Bei kurzen, harten 3-Minuten-Intervallen hinkt die Herzfrequenz dem Effort zu weit hinterher, um als Echtzeitziel zu taugen – fahre daher nach Gefühl auf RPE 9 (nahezu maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : `VO2max-Reize brauchen Zeit "oben". 3 Minuten bei ca. ${Math.round(rp.ftp*1.15)} W (115% FTP) mit gleichlanger Pause maximieren die Zeit in diesem Bereich, ohne dass du nach zwei Intervallen einbrichst.` }] };
  }
  if(goal === 'anaerobic'){
    const sets = Math.max(2, Math.round(3*volumeFactor));
    const repsList = [];
    const rpe = rp.usingHr ? RPE_TARGET_BY_CLASS.anaerobic : null;
    for(let s2=1;s2<=sets;s2++){
      for(let i=1;i<=5;i++){
        const restAfter = [seg('Pause', 1.5, 0.45)];
        if(i===5 && s2<sets) restAfter.push(seg('Satzpause', 8, 0.50, 'Komplett locker'));
        repsList.push({ ...seg('Sprint', 0.5, 1.55, 'Maximal, aus dem Sattel'), ...rpe, restAfter });
      }
    }
    return { title:`${sets} Sätze à 5 × 30 s All-out`, adaptation:'Anaerobe Kapazität, neuromuskuläre Spitzenleistung',
      warmup: seg('Einrollen', 15, 0.55), activation: seg('Aktivierung', 5, 0.85, '3× 15s Sprints mit langer Pause'),
      reps: repsList, cooldown: seg('Ausrollen', 10, 0.48),
      rationale:[{ type:'good', title:'Warum kurze All-out-Sprints',
        text: rp.usingHr
          ? `Anaerobe Kapazität trainierst du nur mit maximalen, kurzen Belastungen und viel Pause. Bei so kurzen, maximalen Sprints hinkt die Herzfrequenz dem Effort viel zu weit hinterher, um als Echtzeitziel zu taugen – fahre daher nach Gefühl auf RPE 10 (maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : `Anaerobe Kapazität trainierst du nur mit maximalen, kurzen Belastungen und viel Pause. Deine beste 1-Minuten-Leistung liegt bei ${rp.p1?rp.p1+' W':'unbekannt'} – die Sprints sollen deutlich darüber liegen.` }] };
  }
  if(goal === 'tempo'){
    const reps = Math.max(2, Math.round(3*volumeFactor));
    const intervalMin = elevated ? 10 : 12;
    const repsList = [];
    for(let i=1;i<=reps;i++){
      repsList.push({ ...seg('Sweet-Spot-Block', intervalMin, 0.90, 'Gleichmäßig, kontrolliert hart'),
        restAfter: i<reps ? [seg('Pause', 4, 0.55)] : [] });
    }
    return { title:`${reps} × ${intervalMin} min Sweet Spot`, adaptation:'Muskuläre Ausdauer im Sweet-Spot-Bereich',
      warmup: seg('Einrollen', 12, 0.55), activation: seg('Aktivierung', 3, 0.78, '2× 30s auf Tempo'),
      reps: repsList, cooldown: seg('Ausrollen', 10, 0.50),
      rationale:[{ type:'good', title:'Warum Sweet Spot',
        text: rp.usingHr
          ? 'Sweet Spot (ca. 88–92% LTHR) baut muskuläre Ausdauer auf, mit weniger Erholungsbedarf als echte Schwellenintervalle – gut geeignet, wenn Threshold/VO2max diese Woche schon bedient sind.'
          : 'Sweet Spot (ca. 88–92% FTP) baut muskuläre Ausdauer auf, mit weniger Erholungsbedarf als echte Schwellenintervalle – gut geeignet, wenn Threshold/VO2max diese Woche schon bedient sind.' }] };
  }
  if(goal === 'sprint'){
    const reps = Math.max(4, Math.round(6*volumeFactor));
    const repsList = [];
    const rpe = rp.usingHr ? RPE_TARGET_BY_CLASS.sprint : null;
    for(let i=1;i<=reps;i++){
      repsList.push({ ...seg('Sprint', 0.25, 1.7, 'Maximal, aus dem Sattel'), ...rpe,
        restAfter: i<reps ? [seg('Pause', 4, 0.48, 'Vollständig locker rollen')] : [] });
    }
    return { title:`${reps} × 15 s Sprints`, adaptation:'Neuromuskuläre Spitzenleistung, Sprintkraft',
      warmup: seg('Einrollen', 15, 0.55), activation: seg('Aktivierung', 5, 0.85, '3× 10s Antritte mit langer Pause'),
      reps: repsList, cooldown: seg('Ausrollen', 10, 0.48),
      rationale:[{ type:'good', title:'Warum sehr kurze Sprints',
        text: rp.usingHr
          ? `Neuromuskuläre Leistung trainierst du mit maximalen, sehr kurzen Antritten und vollständiger Erholung dazwischen. Bei 15 s All-out reagiert die Herzfrequenz gar nicht erst schnell genug, um als Ziel zu taugen – fahre daher nach Gefühl auf RPE 10 (maximale Anstrengung), nicht nach einer bpm-Zahl.`
          : 'Neuromuskuläre Leistung trainierst du mit maximalen, sehr kurzen Antritten und vollständiger Erholung dazwischen – Ermüdung würde die Rekrutierung schneller Fasern sofort begrenzen.' }] };
  }
  return null;
}

// Packs a spec's reps (each kept together with its own prescribed rest) onto
// an attached route: climbs first in ride order, then flat sections for
// whatever doesn't fit, so the route carries as much of the full time-based
// prescription as its terrain allows. Descents never host hard efforts.
function placeIntervalsOnRoute(route, spec, adj, classKey, config, options, rp){
  options = options || {};
  const totalDist = route.totalDistanceM;
  let wDist = estimateDistanceForMinutes(spec.warmup.minutes, 0, spec.warmup.pct, rp);
  let aDist = spec.activation ? estimateDistanceForMinutes(spec.activation.minutes, 0, spec.activation.pct, rp) : 0;
  let cDist = estimateDistanceForMinutes(spec.cooldown.minutes, 0, spec.cooldown.pct, rp);
  const reserved = wDist + aDist + cDist;
  if(reserved > totalDist * 0.9){
    const scale = (totalDist*0.9) / Math.max(reserved, 1);
    wDist *= scale; aDist *= scale; cDist *= scale;
  }
  const workStart = wDist + aDist;
  const workEnd = Math.max(workStart, totalDist - cDist);

  const cc = (config && classKey) ? config.constraints.byClass[classKey] : null;
  const clampInterval = m => (cc && cc.maxIntervalMin > 0) ? Math.max(cc.minIntervalMin, Math.min(cc.maxIntervalMin, m)) : m;
  const clampRest = m => cc ? Math.max(cc.minRecoveryMin, m) : m;
  const maxPerSession = (cc && cc.maxIntervalsPerSession > 0) ? cc.maxIntervalsPerSession : Infinity;

  const queue = [];
  spec.reps.forEach(r => {
    const pct = Math.min(1.5, r.pct*adj);
    queue.push({ kind:'interval', label:r.label, minutes:clampInterval(r.minutes), pct, note:r.note, rpeTarget:r.rpeTarget, rpeLabel:r.rpeLabel });
    (r.restAfter||[]).forEach(ra => queue.push({ kind:'rest', label:ra.label, minutes:clampRest(ra.minutes), pct:ra.pct, note:ra.note }));
  });
  const targetIntervalMin = queue.filter(b=>b.kind==='interval').reduce((s,b)=>s+b.minutes,0);

  const zoneSegs = route.segments
    .filter(s => s.endDist > workStart && s.startDist < workEnd)
    .map(s => ({ ...s, startDist: Math.max(s.startDist, workStart), endDist: Math.min(s.endDist, workEnd) }))
    .filter(s => s.endDist - s.startDist > 1);

  const ignoreCurve = !!options.ignoreCurveConstraints;
  const ignoreIntersections = !!options.ignoreIntersectionConstraints;
  const intersections = (classKey && config)
    ? (options.intersectionCandidates
        || detectIntersectionCandidates(route.points, config.constraints.common.intersectionTurnDeg, config.constraints.common.intersectionGapM))
    : [];
  const evalOf = zoneSegs.map(s => (classKey && config)
    ? evaluateSegmentForClass(s, classKey, config, { ignoreCurve, ignoreIntersections, intersections })
    : { tier: (s.type==='descent' || s.curvy ? 'unsuitable' : 'acceptable'), reasons: [] });
  const tierOf = evalOf.map(e => e.tier);
  // Nur echte Ablehnungsgründe (Steigung/Kurvigkeit/Kreuzung) sammeln, nicht
  // die Abfahrten-Ausschlussmeldung (eigener früher return in
  // evaluateSegmentForClass) und nicht Kapazitäts-Lücken aus packPass()
  // (dort wird nie ein reasons-Eintrag erzeugt) -- beides bewusst außerhalb
  // des Scopes.
  const rejectedSegments = zoneSegs
    .map((s, si) => ({ s, reasons: evalOf[si].reasons }))
    .filter(({ s, reasons }) => s.type !== 'descent' && reasons && reasons.length)
    .map(({ s, reasons }) => ({ startDist: s.startDist, endDist: s.endDist, reasons }));

  const assign = new Map();
  let qi = 0, placedCount = 0;
  function packPass(tierFilter, typeFilter){
    for(let si=0; si<zoneSegs.length && qi<queue.length; si++){
      if(assign.has(si) || tierOf[si] !== tierFilter || zoneSegs[si].type !== typeFilter) continue;
      const s = zoneSegs[si];
      const capacity = s.endDist - s.startDist;
      let used = 0;
      const placed = [];
      while(qi < queue.length){
        const block = queue[qi];
        if(block.kind==='interval' && placedCount >= maxPerSession) break;
        let blockDist = estimateDistanceForMinutes(block.minutes, s.avgGradient, block.pct, rp);
        if(typeFilter==='climb' && block.kind==='interval' && used===0 &&
            capacity >= blockDist*0.5 && capacity <= blockDist*1.8){
          blockDist = capacity;
        }
        if(used + blockDist > capacity) break;
        placed.push({ ...block, blockDistM: blockDist });
        used += blockDist; qi++;
        if(block.kind==='interval') placedCount++;
      }
      if(placed.length) assign.set(si, placed);
    }
  }
  packPass('ideal', 'climb');
  packPass('ideal', 'flat');
  packPass('acceptable', 'climb');
  packPass('acceptable', 'flat');

  const placedIntervalMin = queue.slice(0, qi).filter(b=>b.kind==='interval').reduce((s,b)=>s+b.minutes,0);

  const rseg = (name, startDist, endDist, pct, note, kind, type, gradient) =>
    ({ name, distanceM: endDist-startDist, pct, note, kind, startDist, endDist, type, gradient: gradient!=null?gradient:0 });

  const steps = [];
  if(wDist > 0.5) steps.push(rseg(spec.warmup.label, 0, wDist, spec.warmup.pct, spec.warmup.note, 'warmup', 'flat', 0));
  if(aDist > 0.5) steps.push(rseg(spec.activation.label, wDist, wDist+aDist, spec.activation.pct, spec.activation.note, 'activation', 'flat', 0));

  let intervalCounter = 0;
  const baseLabel = spec.reps.length ? spec.reps[0].label : 'Intervall';
  zoneSegs.forEach((s, si) => {
    const placed = assign.get(si);
    if(!placed){
      const pct = baselinePctForSegment(s, 'cruise') * adj;
      const cruiseStep = rseg(`Verbindung (${((s.endDist-s.startDist)/1000).toFixed(1)} km)`, s.startDist, s.endDist, pct,
        s.type==='descent' ? 'Erholen' : 'Ruhig weiterfahren, für den nächsten Abschnitt sparen', 'cruise', s.type, s.avgGradient);
      // Kurvigkeit wird von rseg() nicht übernommen (dessen Feldsatz ist für
      // alle Schritt-Typen einheitlich) -- extendCompressedIntervalsBackward()
      // braucht sie aber, um beim Rückwärts-Leihen dieselbe Eignungsprüfung
      // wie bei der Intervall-Platzierung anzuwenden.
      cruiseStep.curvy = s.curvy;
      steps.push(cruiseStep);
      return;
    }
    let cursor = s.startDist;
    placed.forEach(b => {
      const end = cursor + b.blockDistM;
      if(b.kind === 'interval'){
        intervalCounter++;
        const intervalStep = rseg(intervalStepName(baseLabel, intervalCounter, b.blockDistM, s.avgGradient),
          cursor, end, b.pct, b.note, 'interval', s.type, s.avgGradient);
        // RPE (HF-mode VO2max/Anaerobic/Sprint) rides through the block queue
        // untouched from buildIntervalSpec()'s reps -- see RPE_TARGET_BY_CLASS.
        if(b.rpeLabel){ intervalStep.rpeTarget = b.rpeTarget; intervalStep.rpeLabel = b.rpeLabel; }
        // Nominal (uncompressed) target distance for this interval, computed
        // the same way packPass() does BEFORE its climb-stretch override
        // (blockDist = capacity). Used by extendCompressedIntervalsBackward()
        // below to detect and undo that compression by borrowing distance
        // from a preceding, unused cruise step. Temporary -- deleted again
        // once that pass has processed this step.
        intervalStep.nominalDistM = estimateDistanceForMinutes(b.minutes, s.avgGradient, b.pct, rp);
        intervalStep.baseLabel = baseLabel;
        intervalStep.counter = intervalCounter;
        steps.push(intervalStep);
      } else {
        steps.push(rseg(b.label, cursor, end, b.pct, b.note, 'rest', s.type, s.avgGradient));
      }
      cursor = end;
    });
    if(s.endDist - cursor > 1){
      const pct = baselinePctForSegment(s, 'cruise') * adj;
      const cruiseStep = rseg(`Verbindung (${((s.endDist-cursor)/1000).toFixed(1)} km)`, cursor, s.endDist, pct,
        'Ruhig weiterfahren', 'cruise', s.type, s.avgGradient);
      cruiseStep.curvy = s.curvy;
      steps.push(cruiseStep);
    }
  });

  extendCompressedIntervalsBackward(steps, classKey, config, { ignoreCurve, ignoreIntersections, intersections });

  if(cDist > 0.5) steps.push(rseg(spec.cooldown.label, totalDist-cDist, totalDist, spec.cooldown.pct, spec.cooldown.note, 'cooldown', 'flat', 0));

  return { steps, placedIntervalMin, targetIntervalMin, intervalCount: intervalCounter, targetCount: spec.reps.length, rejectedSegments };
}

// Undoes packPass()'s climb-stretch compression after the fact: when a
// climb segment's capacity forced an interval's actual distanceM below its
// nominal (uncompressed) target -- see nominalDistM, attached at step
// creation time in placeIntervalsOnRoute() above -- walk backward through
// the immediately preceding, still-unused 'cruise' step(s) and donate their
// distance to the interval so it gets closer to its intended duration. The
// interval's endDist (bordering unsuitable terrain ahead) never moves; only
// startDist creeps earlier. Never triggers for EXPANDED intervals
// (distanceM > nominalDistM) -- those are left completely untouched.
// Best-effort: if there isn't enough preceding cruise budget to fully close
// the gap, the interval ends up less short than before but is never dropped
// or errored on. A cruise step must meet the SAME suitability bar used for
// primary interval placement (gradient band, not curvy, no intersection) to
// be borrowed from -- otherwise a compressed interval could get "topped up"
// with e.g. descent pace, which the rider can't realistically hold the
// interval's target power through. Walk stops (doesn't skip over) the first
// unsuitable cruise step it meets, same as it already stops at a rest/other
// step -- contiguous terrain right before the interval is required either way.
function extendCompressedIntervalsBackward(steps, classKey, config, opts){
  opts = opts || {};
  const borrowEligible = cruiseStep => {
    if(!classKey || !config) return cruiseStep.type !== 'descent' && !cruiseStep.curvy;
    const adapted = { type: cruiseStep.type, avgGradient: cruiseStep.gradient,
                       curvy: cruiseStep.curvy, startDist: cruiseStep.startDist, endDist: cruiseStep.endDist };
    return evaluateSegmentForClass(adapted, classKey, config, opts).tier !== 'unsuitable';
  };
  for(let i=0; i<steps.length; i++){
    const step = steps[i];
    if(step.kind !== 'interval' || step.nominalDistM == null) continue;
    let shortfallM = step.nominalDistM - step.distanceM;
    if(shortfallM <= 1){
      delete step.nominalDistM;
      delete step.baseLabel;
      delete step.counter;
      continue;
    }
    let borrowedDistM = 0, borrowedElevM = 0;
    let j = i - 1;
    while(shortfallM > 1 && j >= 0 && steps[j].kind === 'cruise' && borrowEligible(steps[j])){
      // Borrow physical route meters 1:1 against the shortfall -- this is
      // what makes the extended interval's distanceM converge on
      // nominalDistM (the acceptance bar for this fix), rather than a
      // pace-weighted amount that would over- or under-shoot it depending
      // on how different the cruise step's gradient is from the interval's.
      const neededM = shortfallM;
      if(neededM >= steps[j].distanceM){
        // Consume the whole cruise step -- it's fully absorbed into the interval.
        borrowedDistM += steps[j].distanceM;
        borrowedElevM += (steps[j].gradient/100) * steps[j].distanceM;
        shortfallM -= steps[j].distanceM;
        steps.splice(j, 1);
        // Splicing at j shifts everything after it -- including the interval,
        // previously at j+1 -- down by one. Both i (the interval's index) and
        // j must move together to keep the j === i-1 invariant, so the next
        // while-check lands on the step now immediately preceding the
        // interval, not on the interval itself.
        i--;
        j--;
      } else {
        // Enough left in this cruise step to fully close the gap -- trim its tail.
        steps[j].endDist -= neededM;
        steps[j].distanceM -= neededM;
        borrowedDistM += neededM;
        borrowedElevM += (steps[j].gradient/100) * neededM;
        shortfallM = 0;
      }
    }
    if(borrowedDistM > 0){
      step.startDist -= borrowedDistM;
      step.distanceM += borrowedDistM;
      const originalGradientBeforeExtension = step.gradient;
      const origPortionDistM = step.distanceM - borrowedDistM;
      const origPortionElevM = (originalGradientBeforeExtension/100) * origPortionDistM;
      step.gradient = step.distanceM > 0
        ? (origPortionElevM + borrowedElevM) / step.distanceM * 100
        : originalGradientBeforeExtension;
      step.name = intervalStepName(step.baseLabel, step.counter, step.distanceM, step.gradient);
    }
    delete step.nominalDistM;
    delete step.baseLabel;
    delete step.counter;
  }
}

function goalLabel(goal){
  if(GOALS[goal]) return GOALS[goal].label;
  const cls = trainingClass(goal);
  return cls ? cls.label : goal;
}

function generateRouteWorkout(goal, rp, route, learning, config, classKey, options){
  config = config || TRAINING_CONFIG;
  const acwr = rp.acwr;
  const overloaded = acwr!=null && acwr>1.5;
  const rodeHardYesterday = rp.daysSinceHard!=null && rp.daysSinceHard<=1;
  const forceEasy = (overloaded || rodeHardYesterday) && goal!=='recovery';
  const effectiveGoal = forceEasy ? 'recovery' : goal;
  const adj = (learning && learning.factor && learning.factor[effectiveGoal]) || 1;

  if(forceEasy){
    const steps = route.segments.map(s => {
      const pct = baselinePctForSegment(s, 'recovery');
      const label = s.type==='climb' ? 'Anstieg' : (s.type==='descent' ? 'Abfahrt' : 'Flach');
      return { name:`${label} (${(s.distanceM/1000).toFixed(1)} km)`, distanceM:s.distanceM, pct, kind:'terrain',
        startDist:s.startDist, endDist:s.endDist, type:s.type, gradient:s.avgGradient,
        note: s.type==='climb' ? 'Ruhig hochrollen, nicht drücken' : 'Locker rollen lassen' };
    });
    return { title:'Entlastungsfahrt statt Intervalle', steps,
      rationale:[{ type: overloaded?'danger':'warn',
        title: overloaded?'Deine Belastung ist zu hoch für Intervalle':'Du bist gestern hart gefahren',
        text: overloaded
          ? `${rp.freshnessWhy} Ich überschreibe dein gewähltes Ziel bewusst: eine harte Einheit auf diese Ermüdung draufzusetzen bringt keinen Trainingsreiz mehr. Anpassung passiert in der Erholung.`
          : `Deine letzte harte Einheit ist erst ${rp.daysSinceHard===0?'heute':'einen Tag'} her. Zwei intensive Tage in Folge kosten mehr Form als sie bringen.` }],
      adaptation:'Erholung / Superkompensation', overridden:true, routeBased:true,
      totalDistanceM:route.totalDistanceM, intervalSegments:[] };
  }

  if(ROUTE_TERRAIN_PROFILES[goal]){
    const mode = ROUTE_TERRAIN_PROFILES[goal].mode;
    const steps = route.segments.map(s => {
      const pct = baselinePctForSegment(s, mode) * adj;
      const label = s.type==='climb' ? 'Anstieg' : (s.type==='descent' ? 'Abfahrt' : 'Flach');
      return { name:`${label} (${(s.distanceM/1000).toFixed(1)} km)`, distanceM:s.distanceM, pct, kind:'terrain',
        startDist:s.startDist, endDist:s.endDist, type:s.type, gradient:s.avgGradient,
        note: mode==='recovery' ? (s.type==='climb'?'Ruhig hochrollen, nicht drücken':'Locker rollen lassen')
          : (s.type==='climb' ? 'Gleichmäßig durchziehen, nicht sprinten' : s.type==='descent' ? 'Locker rollen, Beine ausschütteln' : 'Ruhiger Grundlagenrhythmus') };
    });
    return { title: `Streckenbasierte ${mode==='recovery'?'Regenerationsfahrt':'Grundlagenfahrt'}`, steps,
      rationale:[{ type:'good', title:'Warum so',
        text: mode==='recovery'
          ? 'Auf der ganzen Strecke bewusst locker: an Anstiegen minimal mehr Druck, an Abfahrten komplett rollen lassen. Keine Intervalle.'
          : 'Die Intensität folgt dem Höhenprofil: an Anstiegen etwas mehr Druck, an Abfahrten Erholung, dazwischen gleichmäßige Grundlage – statt eines starren Zeitplans.' }],
      adaptation: mode==='recovery' ? 'Aktive Erholung' : 'Grundlagenausdauer',
      overridden:false, routeBased:true, totalDistanceM:route.totalDistanceM, intervalSegments:[] };
  }

  const spec = buildIntervalSpec(effectiveGoal, rp) || buildIntervalSpec('ftp', rp);
  const placement = placeIntervalsOnRoute(route, spec, adj, classKey || null, config, options, rp);

  if(placement.intervalCount === 0){
    let noneText = `Die Route bietet kein ausreichend geeignetes Terrain (ideal oder akzeptabel) für „${goalLabel(goal)}" (nur Abfahrten, zu kurvig, außerhalb des Steigungsbands, oder die Route ist zu kurz). Die ganze Strecke wird stattdessen moderat gefahren.`;
    if(placement.rejectedSegments && placement.rejectedSegments.length){
      const bits = placement.rejectedSegments.map(r =>
        `Bei km ${(r.startDist/1000).toFixed(1)}–${(r.endDist/1000).toFixed(1)}: ${r.reasons.join(' ')}`);
      noneText += ' ' + bits.join(' ');
    }
    return { title:'Streckenfahrt (keine passenden Abschnitte für Intervalle gefunden)', steps: placement.steps,
      rationale:[{ type:'warn', title:'Keine passenden Abschnitte', text: noneText }],
      adaptation:'Grundlage (Ersatz)', overridden:false, routeBased:true,
      totalDistanceM:route.totalDistanceM, intervalSegments:[] };
  }

  const rationale = [{ type:'good', title: spec.title,
    text:`Ich habe ${placement.intervalCount} von ${placement.targetCount} geplanten ${spec.reps[0].label}-Wiederholungen auf dieser Route untergebracht – zuerst auf idealem Terrain, bei Bedarf auch auf nur akzeptablem. Dazwischen fährst du terrainabhängig weiter, wie bei einer echten Fahrt statt starrer Zeit-Intervalle.` }];
  if(placement.placedIntervalMin < placement.targetIntervalMin - 0.5){
    let shortfallText = `Von den geplanten ${Math.round(placement.targetIntervalMin)} harten Minuten passen nur ${Math.round(placement.placedIntervalMin)} auf diese Route (zu kurz, zu wenig geeignetes Terrain, oder zu kurvig für gleichmäßige Intervalle). Für die volle Einheit hilft eine längere/geradere Strecke oder das zeitbasierte Workout ohne Route.`;
    if(placement.rejectedSegments && placement.rejectedSegments.length){
      const bits = placement.rejectedSegments.map(r =>
        `Bei km ${(r.startDist/1000).toFixed(1)}–${(r.endDist/1000).toFixed(1)}: ${r.reasons.join(' ')}`);
      shortfallText += ' ' + bits.join(' ');
    }
    rationale.push({ type:'warn', title:'Route reicht nicht für die volle Dosis', text: shortfallText });
  }
  if(Math.abs(adj-1) > 0.005) rationale.push({ type: adj<1 ? 'warn':'good', title:'Aus deiner Historie angepasst',
    text: adj<1
      ? `Bei früheren Einheiten dieses Ziels hast du im Schnitt ${Math.round(adj*100)}% ${rp.usingHr?'des HF-Ziels':'der Zielleistung'} erreicht – ich habe die Vorgabe entsprechend abgesenkt, damit sie realistisch bleibt.`
      : `Bei früheren Einheiten dieses Ziels hast du ${rp.usingHr?'das HF-Ziel':'die Zielleistung'} im Schnitt übertroffen – ich habe die Vorgabe leicht angehoben.` });

  return { title: spec.title, steps: placement.steps, rationale, adaptation: spec.adaptation, overridden:false,
    routeBased:true, totalDistanceM:route.totalDistanceM, intervalSegments:[] };
}

// Maps a Training Decision Engine class onto the generator's goal vocabulary.
// longdistance reuses the endurance terrain-following mode; threshold reuses
// the 'ftp' spec.
const TRAINING_CLASS_TO_GENERATOR_GOAL = {
  recovery:'recovery', endurance:'endurance', longdistance:'endurance',
  tempo:'tempo', threshold:'ftp', vo2max:'vo2max', anaerobic:'anaerobic', sprint:'sprint',
};

function generateWorkoutForOpportunity(opportunity, rp, route, learning, config, options){
  config = config || TRAINING_CONFIG;
  if(!route) return null;
  if(!opportunity.suitable){
    const reasons = (opportunity.suitability && opportunity.suitability.reasons) || [];
    const scoreText = opportunity.suitability ? `Streckeneignung: ${opportunity.suitability.score}/100. ` : '';
    return {
      title: `Route ungeeignet für ${opportunity.className}`, steps: [],
      rationale: [{ type:'danger', title:`Route ungeeignet für ${opportunity.className}`,
        text: `Dein aktuelles Trainingsprofil weist ${opportunity.className} als ${opportunity.priority==='HIGH'?'höchste':'aktuelle'} Priorität aus. ${scoreText}`
          + (reasons.length ? reasons.join(' ') : 'Diese Strecke bietet nicht genug geeignetes Terrain für diesen Trainingsreiz.') }],
      adaptation: opportunity.className, overridden:false, routeBased:true, unsuitable:true, classKey: opportunity.classKey,
      totalDistanceM: route.totalDistanceM, intervalSegments:[],
    };
  }
  const mappedGoal = TRAINING_CLASS_TO_GENERATOR_GOAL[opportunity.classKey] || 'endurance';
  const result = generateRouteWorkout(mappedGoal, rp, route, learning, config, opportunity.classKey, options);
  if(result) result.classKey = opportunity.classKey;
  return result;
}

// Same power-vs-HF branch as workoutMetrics() above (see its comment for the
// hrTSS simplification note) -- route-based twin, speed-estimated per step.
function estimateRouteWorkoutMetrics(steps, rp){
  const usingHr = rp.usingHr;
  const metricValue = usingHr ? rp.lthr : rp.ftp;
  let totalSec=0, totalDistanceM=0;
  if(usingHr){
    let sumPctSec=0;
    steps.forEach(s=>{
      const kmh = estimateSpeedKmh(s, rp);
      const sec = Math.max(1, s.distanceM/1000/kmh*3600);
      totalSec += sec; sumPctSec += s.pct*sec; totalDistanceM += s.distanceM;
    });
    if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0, totalDistanceKm:0 };
    const avgIF = sumPctSec/totalSec, avgHrTarget = avgIF*metricValue, hours = totalSec/3600;
    return { totalMin: Math.round(totalSec/60), np: Math.round(avgHrTarget), avgPower: Math.round(avgHrTarget), intensityFactor: avgIF,
      tss: Math.round(hours*avgIF*avgIF*100), totalDistanceKm: totalDistanceM/1000 };
  }
  let sumP4=0, sumP=0;
  steps.forEach(s=>{
    const kmh = estimateSpeedKmh(s, rp);
    const sec = Math.max(1, s.distanceM/1000/kmh*3600);
    const w = s.pct*metricValue;
    totalSec += sec; sumP4 += Math.pow(w,4)*sec; sumP += w*sec; totalDistanceM += s.distanceM;
  });
  if(totalSec===0) return { totalMin:0, np:0, avgPower:0, intensityFactor:0, tss:0, totalDistanceKm:0 };
  const np = Math.pow(sumP4/totalSec,0.25), intensityFactor = np/metricValue;
  return { totalMin: Math.round(totalSec/60), np: Math.round(np), avgPower: Math.round(sumP/totalSec), intensityFactor,
    tss: Math.round((totalSec*np*intensityFactor)/(metricValue*3600)*100), totalDistanceKm: totalDistanceM/1000 };
}
function workoutZoneBreakdown(steps, routeBased, rp){
  // HF-Zweig iteriert LTHR_ZONES/lthrZoneFor statt ZONES/zoneFor. rp is
  // still guarded as optional (defaults to the power branch) purely as a
  // defensive fallback -- the single current caller always passes rp.
  const zonesTable = (rp && rp.usingHr) ? LTHR_ZONES : ZONES;
  const zoneFn = pct => (rp && rp.usingHr) ? lthrZoneFor(pct) : zoneFor(pct);
  const mins = zonesTable.map(()=>0);
  let totalMin = 0;
  (steps||[]).forEach(s=>{
    let minutes;
    if(routeBased){
      const kmh = estimateSpeedKmh(s, rp);
      minutes = (s.distanceM/1000/kmh*60) || 0;
    } else {
      minutes = s.minutes || 0;
    }
    if(minutes <= 0) return;
    const idx = zonesTable.indexOf(zoneFn(s.pct));
    mins[idx] += minutes;
    totalMin += minutes;
  });
  const zones = zonesTable.map((z,i)=>({ name:z.name, color:z.color, minutes: mins[i],
