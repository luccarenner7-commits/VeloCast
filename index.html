  // which would otherwise wrongly claim there are none.
  if(state.needsManualLoad.segments){
    card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px;"}, [
      "Automatisches Laden ist deaktiviert (siehe Einstellungen)."
    ]));
    card.appendChild(el("button", {class:"btn", style:"width:100%;", onclick: ()=>{ loadSegmentsStep().then(render); }}, ["Segmente laden"]));
    return card;
  }
  if(!state.segments.length){
    card.appendChild(el("div", {class:"empty-state"}, ["Noch keine Favoriten markiert. Herz-Symbol bei einem Segment antippen, um es hier zu sammeln."]));
    return card;
  }

  syncSegmentSortXomOptions();
  syncPersistentInputValue(segmentSortSelect, state.segmentSortBy);
  card.appendChild(el("div", {style:"margin-bottom:14px;"}, [
    el("label", {}, ["Sortierung"]),
    segmentSortSelect
  ]));

  // state.hideIrrelevantSegments is shared with "Abgeschlossene Segmente"
  // (see renderToggleSwitch()'s comment) — toggling it here also changes
  // what that page's list shows, by design.
  card.appendChild(renderToggleSwitch(
    state.hideIrrelevantSegments,
    "Nicht relevante Segmente ausblenden",
    ()=>{ state.hideIrrelevantSegments = !state.hideIrrelevantSegments; saveSettings(); render(); }
  ));

  // Overview map (Task 2): all starred segments with already-loaded geometry
  // on one shared map, above the list, mirroring how the route page always
  // shows its map. Only attached to the DOM when there's actually something
  // to draw — mountRouteMap()/currentRouteKey() key this same check off
  // segmentsWithOverviewGeometry() too, so omitting the container here (zero
  // starred segments, or none with geometry loaded yet) never leaves a blank
  // Leaflet canvas behind.
  if(segmentsWithOverviewGeometry().length){
    card.appendChild(routeMapContainer);
  }

  const bucket = segmentBucket("starred");
  const grid = el("div", {class:"segment-grid"});
  sortedVisibleSegments(bucket).forEach(seg=>{
    grid.appendChild(renderSegmentRow(seg, bucket));
  });
  card.appendChild(grid);

  return card;
}

// "Meine Segmente" nav page (Task 2). Connect-prompt when not connected
// (mirrors renderConnectCard()'s Strava button, since starred segments have
// no meaning without an account); the plain list when connected and nothing
// selected; or — when a starred segment is selected — that segment's detail
// view (map + back button) as the page's ENTIRE content, unlike the route
// page where the equivalent detail view sits above the still-visible full
// list. That's a deliberate difference from the route page's pattern: this
// page has no separate "route" above it to hold a persistent list, so
// swapping the whole page is the natural equivalent of the "Zur Strecke"
// back-button pattern there.
function renderSegmentsPage(){
  if(!state.connected) return renderStravaConnectCard("Meine Segmente", "Verbinde dich mit Strava, um deine markierten (gesternten) Segmente mit Windbewertung zu sehen.");

  if(isShowingSegmentDetail()){
    const bucket = segmentBucket("starred");
    const seg = bucket.list.find(s => s.id === state.selectedSegmentId);
    if(!seg){
      // Same recovery as renderRouteCard()'s equivalent branch: a stale
      // selection whose id no longer exists in the bucket falls through to
      // the plain list instead of an empty "Segment" shell.
      state.selectedSegmentId = null;
      state.selectedSegmentSource = null;
    } else {
      const card = el("div", {class:"card"});
      card.appendChild(renderDetailHeader("Segment", "Zurück zur Liste", () => {
        // Same capture-before-clear + scroll-back idiom as renderRouteCard()'s
        // equivalent back button above — see its comment for why.
        const segId = seg.id, source = "starred";
        state.selectedSegmentId = null; state.selectedSegmentSource = null;
        render();
        requestAnimationFrame(()=>{
          document.getElementById(`segment-row-${source}-${segId}`)?.scrollIntoView({behavior:"smooth", block:"center"});
        });
      }));
      card.appendChild(renderSegmentRow(seg, bucket, {clickable:false}));
      card.appendChild(renderSegmentLeaderboard(seg));
      card.appendChild(routeMapContainer);
      return card;
    }
  }

  return renderSegmentsCard();
}

// "Abgeschlossene Segmente" — segments actually ridden/completed on the
// currently selected Strava ACTIVITY (see ensureRideSegments()), rendered
// with the exact same row treatment as the starred-segments list via the
// shared bucket-based functions above. Only meaningful for a genuine ridden
// activity; a planned/saved route or an uploaded GPX file gets an honest
// explanatory message instead (nothing has been "completed" on those), and
// so does the not-connected case (the activity-detail endpoint needs a
// token).
function renderRouteSegmentsCard(){
  if(!state.fullRouteCoords.length) return null;
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Abgeschlossene Segmente"]));

  const activity = state.selectedActivity;
  const isRideActivity = !!(state.connected && activity && !activity.isRoute && !activity.isGpx);

  if(!isRideActivity){
    card.appendChild(el("div", {class:"empty-state"}, [
      "Nur für bereits gefahrene Aktivitäten verfügbar - geplante Routen und GPX-Dateien haben noch keine abgeschlossenen Segmente."
    ]));
    return card;
  }

  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px; font-size:12px;"}, [
    "Segmente, die auf dieser Fahrt tatsächlich gefahren und abgeschlossen wurden."
  ]));

  if(state.loading.routeSegments){
    card.appendChild(el("div", {class:"loading"}, ["Lade Segmente…"]));
    return card;
  }

  // Local error display for THIS feature — state.error (rendered only inside
  // renderGpxUploadRow() on the GPX tab) would leave a failed "Segmente
  // laden" fetch invisible on every other tab/page, and could linger stale
  // into unrelated later views. routeSegmentsError is scoped to this card
  // and cleared by resetRouteSegments() (selection change) and at the start
  // of every ensureRideSegments() run (retry).
  if(state.routeSegmentsError){
    card.appendChild(el("div", {class:"error", style:"margin-bottom:14px;"}, [state.routeSegmentsError]));
  }

  // Not fetched yet for this activity (also true after a failure — see
  // above) — manual trigger only (see ensureRideSegments()'s comment for why
  // this never runs automatically).
  if(!state.routeSegmentsFetched){
    card.appendChild(el("button", {
      class:"btn secondary", style:"width:100%;",
      onclick: ()=>ensureRideSegments()
    }, ["Segmente laden"]));
    return card;
  }

  const bucket = segmentBucket("route");
  if(!bucket.list.length){
    // Reached only when routeSegmentsFetched is true, i.e. the fetch
    // genuinely completed — never on failure, which returns above instead.
    // A truly empty result here is a normal outcome (a short/flat ride with
    // no segments on it), not an error. No sort dropdown either — nothing to
    // sort.
    card.appendChild(el("div", {class:"empty-state"}, ["Auf dieser Fahrt wurden keine Segmente abgeschlossen."]));
    return card;
  }

  syncXomSortOptions();
  syncPersistentInputValue(routeSegmentSortSelect, state.routeSegmentSortBy);
  card.appendChild(el("div", {style:"margin-bottom:14px;"}, [
    el("label", {}, ["Sortierung"]),
    routeSegmentSortSelect
  ]));

  // Same shared state.hideIrrelevantSegments field as "Meine Segmente"'s
  // switch (see renderToggleSwitch()'s comment) — a segment marked
  // irrelevant from either page disappears from both.
  card.appendChild(renderToggleSwitch(
    state.hideIrrelevantSegments,
    "Nicht relevante Segmente ausblenden",
    ()=>{ state.hideIrrelevantSegments = !state.hideIrrelevantSegments; saveSettings(); render(); }
  ));

  // No cap — ensureRideSegments()/loadSegmentExtras() above fetch every
  // completed segment for this ride, so the card must show all of them too —
  // that's the whole point of "Abgeschlossene Segmente".
  const list = sortedRouteSegments(bucket);
  const grid = el("div", {class:"segment-grid"});
  list.forEach(seg => grid.appendChild(renderSegmentRow(seg, bucket)));
  card.appendChild(grid);
  return card;
}

// One selectable row in the Segmentjäger list. Reuses the exact same
// data/formatting building blocks every other segment row in this app uses —
// computeSegmentStatChips() (which, for the "route" bucket, delegates to
// computeRideEffortStatChips() — this ride's own time, watts, effort rank,
// plus the same KOM/QOM delta chips) and statChip() — but with its own DOM
// assembly and click behavior instead of reusing renderSegmentRow() itself:
// tapping the row toggles this segment's membership in
// state.segmentjaegerSelection instead of navigating into a detail view.
// Two icon buttons live inline in the chips row -- renderFavoriteButton()
// (local "Herz" list) and renderStarButton() (the real Strava star/Live
// Segment) -- both completely independent of the row's own selection state
// and of each other (ev.stopPropagation() inside each keeps a click there
// from also toggling the selection). No "nicht relevant"/leaderboard button
// here though -- segment detail viewing already exists elsewhere in the
// app, see renderSegmentRow()/selectSegment(). Deselected rows get the same
// opacity:0.5 "dimmed" treatment already used app-wide for a disabled
// control (.btn:disabled/.star-btn:disabled/.nav-action:disabled), not a
// new one-off value -- this dims the favorite/star buttons too when the row
// itself is deselected, same as everything else in the row.
function renderSegmentjaegerRow(seg){
  const bucket = segmentBucket("route");
  const selected = !!state.segmentjaegerSelection[seg.id];
  const row = el("div", {
    class: "segment" + (selected ? " selected" : ""),
    style: selected ? null : "opacity:0.5;",
    onclick: ()=>toggleSegmentjaegerSelection(seg)
  });

  row.appendChild(el("div", {class:"top"}, [
    el("div", {style:"flex:1; min-width:0;"}, [
      el("div", {class:"name"}, [seg.name]),
      el("div", {class:"meta", style:"display:flex; justify-content:space-between; gap:10px;"}, [
        el("span", {}, [`${(seg.distance/1000).toFixed(1)} km`]),
        el("span", {}, [`${seg.average_grade}% Ø-Steigung`])
      ])
    ])
  ]));

  // Hero chips + favorite/star buttons always render together in one row,
  // even when there are no hero chips yet (detail still loading) -- same
  // reasoning as renderSegmentRow()'s star button always being reachable
  // regardless of fetch state.
  const stats = computeSegmentStatChips(seg, bucket);
  const chips = el("div", {class:"stat-chips"});
  stats.hero.forEach(s => chips.appendChild(statChip(s.value, s.label, s.style)));
  chips.appendChild(renderFavoriteButton(seg));
  chips.appendChild(renderStarButton(seg, bucket));
  row.appendChild(chips);
  if(stats.secondary.length){
    row.appendChild(el("div", {class:"stat-secondary"}, [stats.secondary.join(" · ")]));
  }
  // Same star-error display renderSegmentRow() already has (~L6844) -- a
  // failed star/unstar here can come from either this row's own star
  // button OR a bulk syncSegmentjaegerStars() run touching this segment,
  // both go through the same applySegmentStar()/state.segmentStars, so one
  // display covers both triggers.
  const starError = state.segmentStars[seg.id] && state.segmentStars[seg.id].error;
  if(starError){
    row.appendChild(el("div", {class:"error", style:"margin-top:8px;"}, [starError]));
  }
  return row;
}

// Segmentjäger nav page: an activity picker, then — once a genuine ridden
// activity is selected and its segments have been loaded via this page's own
// manual "Segmente laden" button (same manual-trigger contract as
// ensureRideSegments()'s other caller, renderRouteSegmentsCard() on the
// Strecke page — deliberately no auto-load on activity selection, see
// ensureRideSegments()'s own comment for why) — the static route+selected-segments map
// (mountSegmentjaegerView()) and the ride-chronological selection list, all
// as one card (same single-card-per-page-section convention renderRouteCard()/
// renderSegmentsCard() already use). Deliberately builds the list straight
// off state.routeSegments in its existing order — NOT through
// sortedRouteSegments()/sortedVisibleSegments(), which would both re-sort it
// and drop segments hidden by the global "nicht relevant" filter; this page
// intentionally shows every completed segment on the ride, in the order they
// were actually ridden, so the rider can plan a target list against the real
// shape of that ride.
function renderSegmentjaegerPage(){
  if(!state.connected) return renderStravaConnectCard("Segmentjäger", "Verbinde dich mit Strava, um aus einer bereits gefahrenen Aktivität realistische Segment-Ziele für einen KOM/QOM- oder Bestzeit-Versuch auszuwählen.");
  // Same global gate renderRouteCard()'s default branch applies (see
  // render()'s state.needsManualLoad.activities check) — this page's picker
  // needs state.activities too, and would otherwise silently show "Keine
  // Aktivitäten gefunden" instead of the actual reason the list is empty.
  if(state.needsManualLoad.activities) return renderManualLoadCard();

  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Segmentjäger"]));
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:14px; font-size:12px;"}, [
    "Wähle eine bereits gefahrene Aktivität — ihre Segmente werden danach als mögliche Ziele für einen KOM/QOM- oder Bestzeit-Versuch vorausgewählt."
  ]));

  renderSegmentjaegerActivityPicker(card);

  const activity = state.selectedActivity;
  const isRideActivity = !!(activity && !activity.isRoute && !activity.isGpx);
  if(!isRideActivity){
    card.appendChild(el("div", {class:"empty-state", style:"margin-top:14px;"}, [
      "Wähle oben eine bereits gefahrene Aktivität aus, um mögliche Segment-Ziele zu sehen."
    ]));
    return card;
  }

  if(state.loading.routeSegments){
    card.appendChild(el("div", {class:"loading", style:"margin-top:14px;"}, ["Lade Segmente…"]));
    return card;
  }
  if(state.routeSegmentsError){
    card.appendChild(el("div", {class:"error", style:"margin-top:14px;"}, [state.routeSegmentsError]));
    card.appendChild(el("button", {
      class:"btn secondary", style:"width:100%; margin-top:8px;",
      onclick: ()=>ensureRideSegments()
    }, ["Erneut versuchen"]));
    return card;
  }
  if(!state.routeSegmentsFetched){
    // Not fetched yet and no error — manual trigger only, same "Segmente
    // laden" button/pattern as renderRouteSegmentsCard()'s on the Strecke
    // page (see ensureRideSegments()'s own "EXPLICITLY USER-TRIGGERED ONLY"
    // contract for why this never fires automatically on activity
    // selection: an uncapped loadSegmentExtras() call per segment would risk
    // Strava's rate limit with no user-visible warning).
    card.appendChild(el("button", {
      class:"btn secondary", style:"width:100%; margin-top:14px;",
      onclick: ()=>ensureRideSegments()
    }, ["Segmente laden"]));
    return card;
  }
  if(!state.routeSegments.length){
    card.appendChild(el("div", {class:"empty-state", style:"margin-top:14px;"}, ["Auf dieser Fahrt wurden keine Segmente abgeschlossen."]));
    return card;
  }

  ensureSegmentjaegerSelection();

  if(state.fullRouteCoords.length) card.appendChild(routeMapContainer);

  const grid = el("div", {class:"segment-grid"});
  state.routeSegments.forEach(seg => grid.appendChild(renderSegmentjaegerRow(seg)));
  card.appendChild(grid);

  // "Auswahl mit Strava-Stern abgleichen" — see syncSegmentjaegerStars()'s
  // own comment for why this is a manual button rather than firing on every
  // row toggle. The plan is recomputed on every render (cheap -- same
  // segment count as the list just built above, no extra API call), so the
  // button's count/disabled-state always reflects the CURRENT selection,
  // including immediately after a partially-failed sync (a failed segment
  // stays mismatched, so it stays counted).
  const syncBucket = segmentBucket("route");
  const syncStarredMap = {};
  state.routeSegments.forEach(seg => { syncStarredMap[seg.id] = segmentIsStarred(seg, syncBucket); });
  const syncPlan = segmentjaegerComputeStarSyncPlan(state.routeSegments, state.segmentjaegerSelection, syncStarredMap);
  const syncCount = syncPlan.toStar.length + syncPlan.toUnstar.length;
  card.appendChild(el("button", {
    class: "btn secondary", style: "width:100%; margin-top:14px;",
    disabled: (state.segmentjaegerSyncRunning || !syncCount) ? "disabled" : null,
    onclick: ()=>syncSegmentjaegerStars()
  }, [
    state.segmentjaegerSyncRunning ? "Wird synchronisiert…"
      : !syncCount ? "Stern-Status ist aktuell"
      : `Auswahl mit Strava-Stern abgleichen (${syncCount})`
  ]));
  card.appendChild(el("div", {class:"muted", style:"margin-top:6px; font-size:12px;"}, [
    "Sternt ausgewählte Segmente auf Strava und entfernt die Markierung bei abgewählten — nur für die Segmente dieser Fahrt, alle anderen Sterne bleiben unangetastet."
  ]));

  return card;
}

// ---------- Profil: charts ----------
// mountChart()/chartRegistry ported from the Artifact (~L3221-3248)
// unchanged in shape — destroy-and-recreate on every call so re-rendering
// never leaks or duplicates a Chart.js instance on the same canvas.
const chartRegistry = {};
function mountChart(id, config){
  const canvas = document.getElementById(id);
  if(!canvas || canvas.offsetParent === null) return null;
  if(chartRegistry[id]){ chartRegistry[id].destroy(); delete chartRegistry[id]; }
  chartRegistry[id] = new Chart(canvas, config);
  return chartRegistry[id];
}

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
// Chart.js theme, read from VeloCast's own CSS custom properties instead of
// the Artifact's light-mode palette (chartTheme() there branched on a
// data-theme attribute VeloCast doesn't have — this app is dark-only).
// grade-2/3/4 step the FTP chart's confidence dots exactly the way they
// already step climb-steepness chips elsewhere (brighter = more certain,
// same direction as gradeColor()); '#fc4c02' is Strava's own brand orange,
// kept as-is to mark "this value came from your Strava profile", a data-
// provenance marker rather than a VeloCast semantic color.
function profilColors(){
  return {
    route: cssVar('--route'), routeBg: cssVar('--route-bg'),
    tail: cssVar('--tail'), head: cssVar('--head'), cross: cssVar('--cross'),
    chalkDim: cssVar('--chalk-dim'), chalk: cssVar('--chalk'), line: cssVar('--line'),
    grade2: cssVar('--grade-2'), grade3: cssVar('--grade-3'), grade4: cssVar('--grade-4'),
    strava: '#fc4c02'
  };
}
if(window.Chart){
  // Small mono labels/ticks/legends match how every other chart-adjacent
  // number in this app (leaderboard, activity meta, stat-chip labels) is
  // already set in IBM Plex Mono — see the .leaderboard/.activity .meta
  // rules above.
  Chart.defaults.font.family = "'IBM Plex Mono', monospace";
  Chart.defaults.font.size = 11;
}

function dayOffsetLabel(first){
  return off => new Date(first.getTime()+off*86400000).toLocaleDateString('de-DE',{day:'2-digit',month:'short'});
}
function tooltipTitleFromOffset(lbl){
  return it => it.length ? lbl(it[0].parsed.x) : '';
}
function dayOffsetXAxis(lbl, c, maxTicksLimit){
  return { type:'linear', grid:{color:c.line}, ticks:{color:c.chalkDim, callback:v=>lbl(v), maxTicksLimit} };
}

function buildFtpChart(){
  const pp = state.profilPage;
  const a = pp.ftpAnalysis;
  if(!a || !window.Chart) return;
  const results = pp.results, first = a.first, c = profilColors();
  const lbl = dayOffsetLabel(first);
  const byConf = conf => results.filter(r=>r.confidence===conf).map(r=>({x:(r.date-first)/86400000, y:r.estFtp}));
  const fp = [];
  if(a.reg) for(let d=0; d<=84; d+=7){ const x=a.daysSinceFirst+d; fp.push({x, y:Math.round(a.reg.slope*x+a.reg.intercept)}); }
  const trendLine = a.ceilingSeries.map(p=>({x:p.x, y:a.reg?Math.round(a.reg.slope*p.x+a.reg.intercept):null}));
  const currentFtp = pp.athleteDetail && pp.athleteDetail.ftp;
  const todayOffset = (a.today-first)/86400000;

  mountChart('velocastFtpChart', {
    type:'line',

function buildProfilKernCharts(){
  const pp = state.profilPage;

  const c = profilColors();
  const now = new Date();
  const cur = buildPowerCurve(pp.results, new Date(now.getTime()-90*86400000), now);

      type:'line',

        { label:'Effizienz (NP/HF)', data:p.map(x=>({x:(x.date-first)/86400000,y:x.ef})),
          borderColor:c.route, backgroundColor:c.route, pointRadius:3, showLine:false },
        ...(E.reg ? [{ label:'Trend',
          data:p.map(x=>({x:(x.date-first)/86400000, y:E.reg.slope*((x.date-first)/86400000)+E.reg.intercept})),
          borderColor:c.chalkDim, borderDash:[4,4], pointRadius:0, fill:false }] : []),
        { label:'Entkopplung %', yAxisID:'y2',
          data:p.filter(x=>x.decoupling!=null).map(x=>({x:(x.date-first)/86400000,y:x.decoupling})),
          borderColor:c.cross, backgroundColor:c.cross, pointRadius:2.5, showLine:false },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'nearest',intersect:false},
        plugins:{ legend:{display:true,labels:{color:c.chalkDim,boxWidth:12,font:{size:11}}},
          tooltip:{ callbacks:{ title: tooltipTitleFromOffset(lbl) } } },
        scales:{ x: dayOffsetXAxis(lbl, c, 7),
          y:{title:{display:true,text:'Watt pro Herzschlag',color:c.chalkDim},grid:{color:c.line},ticks:{color:c.chalkDim}},
          y2:{position:'right',title:{display:true,text:'Entkopplung %',color:c.chalkDim},grid:{display:false},ticks:{color:c.chalkDim}} } },

  const C = pp.climbing;
  if(C && C.sustained.length){

        ...(C.reg ? [{ label:'Trend',
          data:cl.map(x=>({x:(x.date-first)/86400000, y:C.reg.slope*((x.date-first)/86400000)+C.reg.intercept})),
          borderColor:c.chalkDim, borderDash:[4,4], pointRadius:0, fill:false }] : []),
      ]},
      options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'nearest',intersect:false},
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{ title: tooltipTitleFromOffset(lbl), label:i=>`${i.parsed.y.toFixed(2)} W/kg` } } },
        scales:{ x: dayOffsetXAxis(lbl, c, 7),
          y:{title:{display:true,text:'W/kg',color:c.chalkDim},grid:{color:c.line},ticks:{color:c.chalkDim}} } },
    });
  }

// Which chart canvas ids live under each Profil sub-tab, so charts belonging
// to a tab that isn't active right now can be torn down instead of leaked.
const PROFIL_CHART_IDS = {
  ftp: ["velocastFtpChart"],
  form: ["velocastFormChart", "velocastZoneChart"],
  kern: ["velocastPdChart", "velocastEfChart", "velocastClimbChart"]
};
function destroyProfilCharts(ids){
  ids.forEach(id => { if(chartRegistry[id]){ chartRegistry[id].destroy(); delete chartRegistry[id]; } });
}

// Called unconditionally from render()'s requestAnimationFrame block, same
// contract as mountRouteMap(): clean up (destroy chartRegistry entries) on
// any path where a chart's canvas is no longer in the DOM, rather than
// leaving Chart.js instances bound to detached canvases.
function mountProfilCharts(){
  const allIds = Object.values(PROFIL_CHART_IDS).flat();
  if(state.activePage !== "profil" || !window.Chart){ destroyProfilCharts(allIds); return; }
  const pp = state.profilPage;
  if(pp.loading || !pp.loaded || !pp.results.length){ destroyProfilCharts(allIds); return; }
  Object.keys(PROFIL_CHART_IDS).forEach(tab => { if(tab !== pp.subTab) destroyProfilCharts(PROFIL_CHART_IDS[tab]); });
  if(pp.subTab === "form") buildFormCharts();
  else if(pp.subTab === "kern") buildProfilKernCharts();
  else buildFtpChart();
}

function metricCard(label, value, sub, valueCls){
  return el("div", {class:"metric-card"}, [
    el("div", {class:"ml"}, [label]),
    el("div", {class:"mv" + (valueCls ? " "+valueCls : "")}, [String(value)]),
    sub ? el("div", {class:"ms"}, [sub]) : ""
  ]);
}
function calloutBox(cls, title, body){
  return el("div", {class:"callout" + (cls?" "+cls:"")}, [
    el("div", {class:"callout-title"}, [title]),
    el("div", {class:"callout-body"}, [body])
  ]);
}
function barRow(label, pct, color, numText, qualityPct){
  const clampedPct = Math.max(0,Math.min(100,pct||0));
  const fill = qualityPct==null
    ? el("span", {style:`display:block; height:100%; width:100%; background:${color}; border-radius:var(--r-full);`}, [])
    : el("span", {style:"position:relative; display:block; height:100%; width:100%;"}, [
        el("span", {style:`position:absolute; inset:0; background:${color}; opacity:0.35;`}, []),
        el("span", {style:`position:absolute; inset:0; width:${Math.max(0,Math.min(100,qualityPct))}%; background:${color};`}, [])
      ]);
  return el("div", {class:"bar-row"}, [
    el("span", {class:"bar-label"}, [label]),
    el("span", {class:"bar-track"}, [ el("span", {style:`display:block; height:100%; width:${clampedPct}%;`}, [fill]) ]),
    el("span", {class:"bar-num"}, [numText])
  ]);
}
function dataTableNode(headers, rows){
  const thead = el("thead",{},[ el("tr",{}, headers.map(h=>el("th",{},[h]))) ]);
  const tbody = el("tbody",{}, rows.map(r=> el("tr",{}, r.map(cell=>el("td",{}, [cell])))));
  return el("div",{class:"table-scroll"},[ el("table",{class:"data-table"},[thead,tbody]) ]);
}
function legendDot(color, label){
  return el("span", {style:"display:inline-flex; align-items:center; margin-right:12px;"}, [
    el("span", {class:"dot", style:`background:${color};`}, []), label
  ]);
}

}

// FTP-Verlauf & Prognose — ported from the Artifact's renderFtpTab()
// (~L3640-3701): trend chart, linear forecast, comparison to the athlete's
// manually-set Strava FTP, an interpretation panel, and the list of
// activities the estimate was derived from.
function renderProfilFtpSection(frag){
  const pp = state.profilPage, a = pp.ftpAnalysis, results = pp.results;
  const currentFtp = pp.athleteDetail && pp.athleteDetail.ftp;
  const weight = pp.athleteDetail && pp.athleteDetail.weight;
  const wkg = (currentFtp && weight) ? (currentFtp/weight).toFixed(2) : null;
  const hi = results.filter(r=>r.confidence==='hoch').length, me = results.filter(r=>r.confidence==='mittel').length,
        lo = results.filter(r=>r.confidence==='niedrig').length, fl = results.filter(r=>r.confidence==='unbestätigt').length;
  const last = results[results.length-1];
  const trendCls = a && a.weeklySlope>0 ? "up" : (a && a.weeklySlope<0 ? "down" : null);
  const trendArrow = a && a.weeklySlope>0 ? "▲" : (a && a.weeklySlope<0 ? "▼" : "–");

  frag.appendChild(el("div", {class:"metric-grid"}, [
    metricCard("Aktueller FTP (Strava)", currentFtp?`${currentFtp} W`:"–", wkg?`${wkg} W/kg`:(currentFtp?null:"nicht in Strava-Profil hinterlegt")),
    metricCard(`Trend (${CEILING_WINDOW_DAYS}-Tage-Bestwert)`, a && a.weeklySlope!=null ? `${a.weeklySlope>0?'+':''}${a.weeklySlope.toFixed(1)} W` : "n/a",
      `${trendArrow} pro Woche · ${results.length} Fahrten (${hi} hoch/${me} mittel/${lo} niedrig${fl?'/'+fl+' unbestätigt':''})`, trendCls),
    metricCard("Prognose in 8 Wochen", a && a.forecast8!=null ? `${a.forecast8} W` : "n/a",
      a && a.forecast4!=null ? `4 Wo.: ${a.forecast4} W · 12 Wo.: ${a.forecast12} W` : null),
    metricCard("Letzte Leistungsdaten", last ? last.date.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}) : "–",
      last ? `${last.estFtp} W · ${last.movingMin} min` : null)
  ]));

  const chartCard = el("div", {class:"card"});
  const c = profilColors();
  chartCard.appendChild(h2WithInfo("FTP-Verlauf & Prognose", [
    legendDot(c.grade4,"Hoch (20-Min)"), legendDot(c.grade3,"Mittel (10-Min)"), legendDot(c.grade2,"Niedrig (5-Min)"),
    legendDot(c.head,"Unbestätigt"), legendDot(c.tail,`${CEILING_WINDOW_DAYS}-Tage-Bestwert`), legendDot(c.chalkDim,"Trend"), legendDot(c.strava,"Strava-FTP")
  ]));
  chartCard.appendChild(el("div", {class:"chart-box"}, [el("canvas", {id:"velocastFtpChart"})]));
  frag.appendChild(chartCard);

  const interpCard = el("div", {class:"card"});
  const genericIntro = `FTP ist ein Maximalwert: Trend & Prognose zeigen die rollierende ${CEILING_WINDOW_DAYS}-Tage-Bestleistung (höchster bestätigter Schätzwert des letzten Jahres, aus 5-/10-/20-Min-Bestleistungen, per HF-Zeitfenster bestätigt).`;
  const paras = [];
  if(a && a.weeklySlope!=null) paras.push(a.weeklySlope>0 ? `Trend: +${a.weeklySlope.toFixed(1)} W/Woche.` : (a.weeklySlope<0 ? `Trend: −${Math.abs(a.weeklySlope).toFixed(1)} W/Woche.` : "Bestwert stabil."));
  if(fl>0) paras.push(`⚠ ${fl} Aktivität${fl===1?'':'en'} unbestätigt, aus Trend ausgeschlossen.`);
  if(a && currentFtp!=null && a.modelToday!=null){
    const gap = currentFtp - a.modelToday;
    paras.push(Math.abs(gap)<=8 ? `Strava-FTP (${currentFtp} W) passt zum Modell (${gap>=0?'+':''}${gap} W).`
      : (gap>0 ? `Gesetzter FTP liegt ${gap} W über dem Modell.` : `Gesetzter FTP liegt ${Math.abs(gap)} W unter dem Modell.`));
  }
  if(a && a.forecast8!=null) paras.push(`Prognose: ca. ${a.forecast8} W in 8 Wochen (4 Wo.: ${a.forecast4} W, 12 Wo.: ${a.forecast12} W), lineare Extrapolation.`);
  interpCard.appendChild(h2WithInfo("Einordnung", genericIntro));
  paras.forEach(p => interpCard.appendChild(el('div',{style:'margin-bottom:6px;'},[p])));
  frag.appendChild(interpCard);

  const actCard = el("div", {class:"card"});
  const actH2 = el("h2", {style:"display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap;"}, [`Ausgewertete Aktivitäten (${results.length}${pp.stats?` von ${pp.stats.candidates} geprüften`:''})`]);
  actCard.appendChild(actH2);
  results.slice().reverse().slice(0,30).forEach(r => {
    actCard.appendChild(el("div", {class:"activity"}, [
      el("div", {}, [
        el("div", {class:"name"}, [r.name || "Fahrt"]),
        el("div", {class:"meta"}, [`${r.date.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})} · ${r.movingMin} min · ${r.confidence}`])
      ]),
      el("div", {class:"stat-chip"}, [ el("div", {class:"v"}, [`${r.estFtp} W`]), el("div", {class:"l"}, ["FTP-Schätzung"]) ])
    ]));
  });
  if(pp.stats) actH2.appendChild(infoButton(
    `${pp.stats.cached} aus dem lokalen Cache, ${pp.stats.fetched} neu von Strava geladen. ${pp.stats.skippedNoWatts} ohne Leistungsmesser, ${pp.stats.skippedNoBestEffort} ohne 5/10/20-Min-Bestleistung${pp.stats.skippedApiError?`, ${pp.stats.skippedApiError} wegen API-Fehlern übersprungen`:''}.`
  ));
  frag.appendChild(actCard);
}

// Fitness/Fatigue/Form chart, zone-distribution-per-week chart, and the
// polarization-over-last-8-weeks panel.
function renderProfilFormSection(frag){
  const pp = state.profilPage, L = pp.trainingLoad, Z = pp.zoneDist;
  if(!L){
    const card = el("div", {class:"card"});
    card.appendChild(el("div", {class:"empty-state"}, [
      "Keine ausreichenden Leistungsdaten für eine Formkurve. Dafür braucht es Fahrten mit Wattmessung und einem in Strava hinterlegten FTP."
    ]));
    frag.appendChild(card);
    return;
  }
  const ringsCard = el("div", {class:"card"});
  ringsCard.appendChild(renderFormRingsRow(L));
  frag.appendChild(ringsCard);

  const chartCard = el("div", {class:"card"});
  chartCard.appendChild(h2WithInfo("Formkurve (Fitness / Ermüdung / Form)", "TSS aus Normalized Power (nicht Stravas HF-Relative-Effort). CTL = 42-Tage-Schnitt (Fitness), ATL = 7-Tage-Schnitt (Ermüdung), TSB = CTL − ATL (Form). Die ersten Wochen sind ein Einschwing-Artefakt."));
  chartCard.appendChild(el("div", {class:"chart-box"}, [el("canvas", {id:"velocastFormChart"})]));
  frag.appendChild(chartCard);

  const meaningCard = el("div", {class:"card"});
  meaningCard.appendChild(el("h2", {}, ["Was das bedeutet"]));
  const formResults = [calloutBox(L.formClass, L.formVerdict, L.formWhy)];
  if(L.rampWeekly>7) formResults.push(calloutBox('warn', "Steiler Formaufbau", `Deine Fitness steigt um ${L.rampWeekly.toFixed(1)} CTL-Punkte pro Woche. Über 5–7 pro Woche gilt als aggressiv – nachhaltig ist das nur mit konsequenten Entlastungswochen.`));
  meaningCard.appendChild(el("div", {style:"display:flex; flex-direction:column; gap:8px;"}, formResults));

// Profil-Kern — ported from the Artifact's renderProfilTab() (~L3759-3897):
// power-duration curve, best-efforts table, efficiency & decoupling chart,
// fatigue resistance, climbing performance, training focus, and gear.
function renderProfilKernSection(frag){
  const pp = state.profilPage;
  const rp = pp.riderProfile, E = pp.efficiency, C = pp.climbing, D = pp.durability, W = pp.weak;
  const now = new Date();
  const cur = buildPowerCurve(pp.results, new Date(now.getTime()-90*86400000), now);
  const prevTo = new Date(now.getTime()-365*86400000);
  const prev = buildPowerCurve(pp.results, new Date(prevTo.getTime()-90*86400000), prevTo);

  const cmpRows = MMP_DURATIONS_SEC.filter(sec=>cur.curve[sec]!=null).map(sec => {
    const cv = cur.curve[sec], pv = prev.curve[sec];
    const diff = pv ? (cv-pv)/pv*100 : null;
    return { sec, cur:cv, prev:pv, diff, wkg: rp.weight ? cv/rp.weight : null };
  });

  renderProfilKernMetricGrid(frag, rp, E, C, D);
  renderProfilKernPowerCurveCard(frag, cur, prev);
  renderProfilKernBestEffortsTable(frag, cmpRows);
  renderProfilKernEfficiencyCard(frag, E);
  renderProfilKernDurabilityCard(frag, D);
  renderProfilKernClimbingCard(frag, C);
  renderProfilKernWeaknessCard(frag, W);
  renderProfilKernGearCard(frag, pp);
}

// ---------- Aktivitäten: local cache ----------
// Every activity Strava's list endpoint returns (any sport type, power
// meter or not) — deliberately separate from PROFIL_ACTIVITY_CACHE_KEY,
// which only holds the subset that passed FTP analysis (rides with
// device_watts AND a qualifying 5/10/20-min effort, see loadProfilData()).
// The list endpoint's summary objects already carry everything this page's
// list view needs (distance, elevation, speed, watts/HR where present), so
// unlike Profil this cache stores the raw Strava response as-is, no
// derived-metrics processing required just to show a list row.
const AKTIVITAETEN_LIST_CACHE_KEY = "velocast_activity_list_cache";
const AKTIVITAETEN_LIST_CACHE_MAX = 600;

function byStartDateDesc(a, b){
  return new Date(b.start_date_local || b.start_date) - new Date(a.start_date_local || a.start_date);
}

function loadAktivitaetenListCache(){
  try{
    const raw = localStorage.getItem(AKTIVITAETEN_LIST_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, a]) => {
      if(!a || typeof a !== "object" || a.id == null) return;
      out[String(id)] = a;
    });
    return out;
  }catch(e){ return {}; }
}
function saveAktivitaetenListCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort(byStartDateDesc).slice(0, cap);
    const trimmed = {};
    entries.forEach(a => { trimmed[a.id] = a; });
    localStorage.setItem(AKTIVITAETEN_LIST_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(AKTIVITAETEN_LIST_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}

// ---------- Aktivitäten: loading pipeline ----------
// Assumes the caller already set aktivitaetenPage.loading = true (and, for a
// button-triggered call, already rendered that state) — mirrors the
// ensureListItemWindTag() discipline elsewhere in this file: called directly
// from inside a render pass (see renderAktivitaetenPage() below), so it must
// not call render() synchronously itself before the first await, only once
// the fetch actually resolves.
async function loadAktivitaetenList(token, opts){
  opts = opts || {};
  const ap = state.aktivitaetenPage;
  try{
    const cache = loadAktivitaetenListCache();
    if(!opts.more && !ap.items.length){
      // First load (or a refresh before anything's shown yet): paint
      // whatever's cached instantly while the fresh page-1 fetch is in flight.
      ap.items = Object.values(cache).sort(byStartDateDesc);
      // ap.page must track what's actually on screen, not "fetches since page
      // load" - otherwise a cache primed with e.g. 90 items still thinks
      // page 0 was the last fetch, and "Weitere laden" re-requests Strava
      // pages 2 and 3 (already-cached activities) before anything new shows.
      ap.page = Math.floor(ap.items.length / ap.perPage);
    }
    const page = opts.more ? ap.page + 1 : 1;
    const batch = await fetchActivitiesPage(token, page, ap.perPage);
    batch.forEach(a => { cache[String(a.id)] = a; });
    saveAktivitaetenListCache(cache);

    const merged = {};
    ap.items.forEach(a => { merged[String(a.id)] = a; });
    batch.forEach(a => { merged[String(a.id)] = a; });
    ap.items = Object.values(merged).sort(byStartDateDesc);
    // Same reasoning as the cache-prime above, so "Aktualisieren" (which
    // always fetches raw page 1) doesn't rewind the resume point below
    // however far the user had already paged - Math.max keeps it from ever
    // going backwards relative to the page we just actually fetched.
    ap.page = Math.max(page, Math.floor(ap.items.length / ap.perPage));
    ap.hasMore = batch.length === ap.perPage;
    ap.error = null;
  }catch(e){
    ap.error = e.message || "Aktivitäten konnten nicht geladen werden.";
  }
  ap.loading = false; ap.loaded = true;
  render();
}

// Lazy auto-load on first visit to the page — cheap (one page fetch, no
// per-ride stream calls), unlike Profil's manual "Trainingsdaten laden"
// button which exists specifically because that load can mean dozens of API
// calls. Sets `loading` synchronously so the SAME render pass that calls
// this can immediately show the loading card (see the discipline note on
// loadAktivitaetenList() above).
function ensureAktivitaetenData(){
  const ap = state.aktivitaetenPage;
  if(ap.loading || ap.loaded) return;
  ap.loading = true;
  loadAktivitaetenList(state.accessToken, {more:false});
}

// Per-ride stream fetch for the detail view — single-flight per activity id
// (state.aktivitaetenPage.detail.id is the "who this result belongs to"
// guard), reusing fetchActivityPowerStreams()/normalizeStreams() from the
// Profil pipeline verbatim rather than adding a second stream fetcher.
async function loadAktivitaetenDetailStream(id, token){
  const d = state.aktivitaetenPage.detail;
  try{
    const raw = await fetchActivityPowerStreams(id, token);
    if(d.id !== id) return; // selection moved on while this was in flight - discard
    const stream = normalizeStreams(raw);
    d.stream = stream;
    if(Array.isArray(stream.watts) && stream.watts.some(w => w != null)){
      const weightKg = state.profilPage.athleteDetail && state.profilPage.athleteDetail.weight;
      // Same normalization as processProfilRide()'s powerZonesNorm above —
      // real zone boundaries when Profil's Trainingsdaten (state.profilPage.
      // zonesRaw) have been loaded, so zoneTimes below comes back as this
      // ride's actual time-in-zone breakdown instead of an all-zero array.
      // Not guaranteed loaded (see renderAktivitaetenDetailChartSection()'s
      // "Zeit je Zone" section, which simply omits itself when it isn't) —
      // this call site doesn't trigger a fetch, matching the
      // buildPotentialChip()-style "silently unavailable" convention.
      const powerZonesRaw = state.profilPage.zonesRaw && state.profilPage.zonesRaw.power && state.profilPage.zonesRaw.power.zones;
      const powerZonesNorm = Array.isArray(powerZonesRaw) ? powerZonesRaw.map(z=>({ max: z.max===-1 ? null : z.max })) : null;
      const metrics = computeStreamMetrics(stream, powerZonesNorm, weightKg);
      const maxWatts = stream.watts.reduce((m, w) => (w != null && w > m) ? w : m, 0);
      d.metrics = metrics ? { ...metrics, maxWatts: Math.round(maxWatts) } : { maxWatts: Math.round(maxWatts) };
    }
  }catch(e){
    if(d.id !== id) return;
    // A 404 here just means this particular activity has no streams at all
    // (e.g. a manually-entered activity with no GPS/sensor data) - that's
    // not a failure worth an alarming .error box, just nothing to chart.
    if(e.status === 404) d.notAvailable = true;
    else d.error = e.message || "Leistungsdaten nicht verfügbar.";
  }
  if(d.id === id) d.loading = false;
  render();
}

function ensureAktivitaetenDetailStream(id, token){
  const d = state.aktivitaetenPage.detail;
  if(d.id === id) return; // already fetching/fetched/failed for this activity
  d.id = id; d.loading = true; d.error = null; d.notAvailable = false; d.stream = null; d.metrics = null;
  loadAktivitaetenDetailStream(id, token);
}

// ---------- Aktivitäten: chart ----------
// Same mountChart()/chartRegistry/profilColors() plumbing as the Profil
// charts above — destroyProfilCharts() is generic over any id list despite
// its name, so it's reused directly rather than re-implementing teardown.
const AKTIVITAETEN_CHART_IDS = ["velocastActivityChart"];

function buildActivityDetailChart(stream){
  const time = stream.time;
  if(!Array.isArray(time) || time.length < 2) return;
  const watts = stream.watts, altitude = stream.altitude, distance = stream.distance, hr = stream.heartrate;
  const n = time.length;
  const hasWatts = Array.isArray(watts) && watts.some(w => w != null);
  const hasAlt = Array.isArray(altitude) && altitude.some(v => v != null);
  const hasHr = Array.isArray(hr) && hr.some(v => v != null);
  if(!hasWatts && !hasAlt && !hasHr) return;
  // No power meter: fall back to heart rate as the primary trace instead of
  // an empty chart (see Phase 2 spec: "show whatever's available").
  const primaryArr = hasWatts ? watts : (hasHr ? hr : null);
  const primaryLabel = hasWatts ? "Leistung (W)" : "Puls (bpm)";

  const maxPoints = 600; // downsample - a multi-hour ride is one point/second, way more than a line chart needs
  const stride = Math.max(1, Math.ceil(n / maxPoints));
  const c = profilColors();
  const useDistance = Array.isArray(distance) && distance.some(v => v != null);
  const xFor = i => useDistance ? (distance[i] || 0) / 1000 : (time[i] || 0) / 60;
  const xLabel = useDistance ? "Distanz (km)" : "Zeit (min)";

  const primaryData = [], altData = [];
  for(let i = 0; i < n; i += stride){
    const x = xFor(i);
    // Watts: `|| 0` is correct - coasting really is 0 W. HR: a missing/
    // dropped sample must stay a gap (`?? null`), not fake a 0 bpm spike.
    if(primaryArr) primaryData.push({ x, y: hasWatts ? (primaryArr[i] || 0) : (primaryArr[i] ?? null) });
    if(hasAlt) altData.push({ x, y: altitude[i] });
  }
  const datasets = [];
  if(primaryArr) datasets.push({ label:primaryLabel, data:primaryData, borderColor:c.route, backgroundColor:c.routeBg, borderWidth:1.3, pointRadius:0, tension:0.15, fill:!hasAlt, spanGaps: !hasWatts });
  if(hasAlt) datasets.push({ label:"Höhe (m)", data:altData, borderColor:c.chalkDim, borderWidth:1.2, pointRadius:0, tension:0.1, fill:!primaryArr, yAxisID: primaryArr ? "y2" : "y" });
  if(!datasets.length) return;

  mountChart("velocastActivityChart", {
    type:"line",
    data:{ datasets },
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{display:datasets.length>1, labels:{color:c.chalkDim, boxWidth:12, font:{size:11}}},
        tooltip:{ callbacks:{ title: it => it.length ? `${xLabel}: ${it[0].parsed.x.toFixed(1)}` : "" } } },
      scales:{
        x:{ type:"linear", title:{display:true,text:xLabel,color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim} },
        y:{ title:{display:true,text:primaryLabel,color:c.chalkDim}, grid:{color:c.line}, ticks:{color:c.chalkDim} },
        ...(hasAlt && primaryArr ? { y2:{ position:"right", title:{display:true,text:"Höhe (m)",color:c.chalkDim}, grid:{display:false}, ticks:{color:c.chalkDim} } } : {})
      } }
  });
}

// Called unconditionally from render()'s requestAnimationFrame block, same
// contract as mountProfilCharts(): no-op (and tear down) whenever the
// detail chart's canvas isn't actually in the DOM right now.
function mountAktivitaetenChart(){
  const ap = state.aktivitaetenPage;
  if(state.activePage !== "aktivitaeten" || !window.Chart || ap.selectedId == null){
    destroyProfilCharts(AKTIVITAETEN_CHART_IDS);
    return;
  }
  const d = ap.detail;
  if(!d.stream){ destroyProfilCharts(AKTIVITAETEN_CHART_IDS); return; }
  buildActivityDetailChart(d.stream);
}

// One combined summary+chip meta line per row: type/date/distance/elevation/
// duration always shown as plain text (same .activity .meta treatment as
// the route picker's activity rows), power/HR promoted to hero .stat-chips
// (same treatment as renderSegmentRow()'s hero stats) since those are the
// two numbers most worth a glance.
function renderAktivitaetenRow(a){
  const km = ((a.distance || 0) / 1000).toFixed(1);
  const elev = Math.round(a.total_elevation_gain || 0);
  const date = new Date(a.start_date_local || a.start_date).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
  const type = a.sport_type || a.type || "Aktivität";
  const dur = fmtDuration(a.moving_time || 0);
  const chips = [];
  if(a.device_watts && a.average_watts != null) chips.push(statChip(`${Math.round(a.average_watts)} W`, "Ø Leistung"));
  if(a.average_heartrate != null) chips.push(statChip(`${Math.round(a.average_heartrate)} bpm`, "Ø Puls"));

  const row = el("div", {
    id: `activity-row-${a.id}`,
    class:"activity",
    onclick: ()=>{ state.aktivitaetenPage.selectedId = a.id; render(); }
  }, [
    el("div", {style:"min-width:0; flex:1;"}, [
      el("div", {class:"name"}, [a.name || "Aktivität"]),
      el("div", {class:"meta"}, [`${type} · ${date} · ${km} km · ${elev} Hm · ${dur}`])
    ])
  ]);
  if(chips.length) row.appendChild(el("div", {class:"stat-chips", style:"flex-shrink:0;"}, chips));
  return row;
}

function renderAktivitaetenListCard(){
  const ap = state.aktivitaetenPage;
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Aktivitäten"]));
  if(ap.error && ap.items.length) card.appendChild(el("div", {class:"error", style:"margin-bottom:10px;"}, [ap.error]));
  card.appendChild(el("div", {class:"muted", style:"font-size:11px; margin-bottom:10px;"}, [`${ap.items.length} Aktivität${ap.items.length===1?"":"en"} geladen`]));

  card.appendChild(list);

  const footer = el("div", {style:"display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;"});
  if(ap.hasMore){
    footer.appendChild(el("button", {
      class:"btn secondary", style:"padding:8px 14px; font-size:12px;", disabled: ap.loading?"disabled":null,
      onclick: ()=>{ ap.loading = true; render(); loadAktivitaetenList(state.accessToken, {more:true}); }
    }, [ap.loading ? "Lädt…" : "Weitere laden"]));
  } else {
    footer.appendChild(el("div", {class:"muted", style:"font-size:11px;"}, ["Alle Aktivitäten geladen."]));
  }

    onclick: ()=>{ ap.loading = true; render(); loadAktivitaetenList(state.accessToken, {more:false}); }

// Adapts one ride's zoneTimes (raw seconds per zone, see computeStreamMetrics())
// into the same {zones, totalMin} shape actualWeekZoneBreakdown() builds for
// the weekly Trainer-tab aggregate, so this one ride can reuse
// appendZoneBars()/barRow() for visual consistency instead of a new chart
// type. No qualityPct overlay — that's intervalZoneTimes' minimum-duration
// "quality interval" concept for weekly training-load purposes; this section
// deliberately shows the plain per-zone time for this one ride instead (see
// renderAktivitaetenDetailChartSection()'s comment).
function rideZoneBreakdown(zoneTimes){
  const totalSec = zoneTimes.reduce((a,b) => a+b, 0);
  const zones = POWER_ZONE_META.map((z,i) => ({
    name: z.name, color: z.color, minutes: zoneTimes[i]/60,
    pct: totalSec>0 ? zoneTimes[i]/totalSec*100 : 0
  }));
  return { zones, totalMin: totalSec/60 };
}

function renderAktivitaetenDetailChartSection(a){
  const ap = state.aktivitaetenPage;
  const d = ap.detail;
  ensureAktivitaetenDetailStream(a.id, state.accessToken);

  // Mirrors buildActivityDetailChart()'s primary-trace pick (hasWatts /
  // primaryLabel there) so the heading matches whichever trace actually
  // gets plotted, instead of a fixed power-oriented label even when this
  // ride has no power meter and falls back to HR-only.
  const hasWatts = !!(d.stream && Array.isArray(d.stream.watts) && d.stream.watts.some(w => w != null));
  const hasHr = !!(d.stream && Array.isArray(d.stream.heartrate) && d.stream.heartrate.some(v => v != null));
  const heading = !hasWatts && hasHr ? "Herzfrequenz" : "Leistung & Höhe";

  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, [heading]));
  if(d.loading){
    card.appendChild(el("div", {class:"loading"}, ["Lade Leistungsdaten…"]));
  } else if(d.notAvailable){
    card.appendChild(el("div", {class:"empty-state"}, ["Für diese Aktivität sind keine Streckendaten (Leistung/Puls/Höhe) verfügbar."]));
  } else if(d.error){
    card.appendChild(el("div", {class:"error", style:"margin-bottom:10px;"}, [d.error]));
    card.appendChild(el("button", {class:"btn secondary", onclick: ()=>{ d.id = null; render(); }}, ["Erneut versuchen"]));
  } else if(d.stream){
    const hasAny = ["watts","altitude","heartrate"].some(k => Array.isArray(d.stream[k]) && d.stream[k].some(v => v != null));
    if(!hasAny){
      card.appendChild(el("div", {class:"empty-state"}, ["Für diese Aktivität sind keine Streckendaten (Leistung/Puls/Höhe) verfügbar."]));
    } else {
      card.appendChild(el("div", {class:"chart-box"}, [el("canvas", {id:"velocastActivityChart"})]));
      if(d.metrics){
        // On very short/degenerate power streams (< 4 samples, or zero
        // duration) computeStreamMetrics() returns null and the fallback
        // above only sets maxWatts - guard np/avgPower individually instead
        // of assuming all three fields are always present.
        const cards = [];
        if(d.metrics.np != null) cards.push(metricCard("Normalisierte Leistung", `${d.metrics.np} W`, null));
        if(d.metrics.avgPower != null) cards.push(metricCard("Ø Leistung", `${d.metrics.avgPower} W`, null));
        if(d.metrics.maxWatts != null) cards.push(metricCard("Max. Leistung", `${d.metrics.maxWatts} W`, null));
        if(cards.length) card.appendChild(el("div", {class:"metric-grid", style:"margin-top:14px; margin-bottom:0;"}, cards));

        // "Zeit je Zone" (Task 2): needs real zone boundaries, which
        // loadAktivitaetenDetailStream() only has when Profil's
        // Trainingsdaten (state.profilPage.zonesRaw) were already loaded —
        // NOT guaranteed (see that function's comment). Same silent-omission
        // convention as buildPotentialChip(): no data -> no section, no
        // error, no auto-fetch prompt, rather than a broken/all-zero chart.
        // Checking zoneTimes' own sum (not just zonesRaw's presence) also
        // covers the case where the stream was fetched before zonesRaw
        // became available — zoneTimes would then be a stale all-zero array
        // even though zonesRaw exists now.
        if(Array.isArray(d.metrics.zoneTimes) && d.metrics.zoneTimes.some(t => t > 0)){
          card.appendChild(el("div", {style:"display:flex; align-items:center; gap:var(--space-2); font-size:11px; font-weight:600; letter-spacing:0.05em; color:var(--chalk-dim); text-transform:uppercase; margin:16px 0 4px;"}, [
            "Zeit je Zone"
          ]));
          appendZoneBars(card, rideZoneBreakdown(d.metrics.zoneTimes));
        }
      }
    }
  }
  return card;
}

function renderAktivitaetenDetail(a){
  const frag = document.createDocumentFragment();
  const card = el("div", {class:"card"});
  card.appendChild(renderDetailHeader(a.name || "Aktivität", "Zurück zur Liste", () => {
    // Same capture-before-clear + scroll-back idiom as renderSegmentsPage()'s
    // "Zurück zur Liste" button - see its comment for why.
    const id = a.id;
    state.aktivitaetenPage.selectedId = null;
    render();
    requestAnimationFrame(()=>{
      document.getElementById(`activity-row-${id}`)?.scrollIntoView({behavior:"smooth", block:"center"});
    });
  }));

  const date = new Date(a.start_date_local || a.start_date);
  const km = ((a.distance || 0) / 1000).toFixed(1);
  const elev = Math.round(a.total_elevation_gain || 0);
  const avgSpeed = a.average_speed != null ? (a.average_speed * 3.6).toFixed(1) : null;
  const maxSpeed = a.max_speed != null ? (a.max_speed * 3.6).toFixed(1) : null;
  card.appendChild(el("div", {class:"metric-grid"}, [
    metricCard("Datum", date.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}), `${a.sport_type || a.type || "Aktivität"} · ${date.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}`),
    metricCard("Distanz", `${km} km`, `${elev} Hm`),
    metricCard("Fahrzeit", fmtDuration(a.moving_time || 0), a.elapsed_time && a.elapsed_time !== a.moving_time ? `${fmtDuration(a.elapsed_time)} gesamt` : null),
    metricCard("Ø Geschwindigkeit", avgSpeed != null ? `${avgSpeed} km/h` : "–", maxSpeed != null ? `Max ${maxSpeed} km/h` : null)
  ]));
  frag.appendChild(card);

  frag.appendChild(renderAktivitaetenDetailChartSection(a));
  return frag;
}

function renderAktivitaetenPage(){
  const frag = document.createDocumentFragment();
  if(!state.connected){
    frag.appendChild(renderStravaConnectCard("Aktivitäten", "Verbinde dich mit Strava, um deine Aktivitäten zu durchstöbern - mit Distanz, Höhenmetern, Leistung/Puls und Detailansicht je Fahrt."));
    return frag;
  }
  const ap = state.aktivitaetenPage;
  if(ap.selectedId != null){
    const a = ap.items.find(x => String(x.id) === String(ap.selectedId));
    if(a) return renderAktivitaetenDetail(a);
    // Stale selection (e.g. items got reset) - fall through to the list.
    ap.selectedId = null;
  }
  if(!ap.loaded && !ap.loading) ensureAktivitaetenData();
  if(ap.loading && !ap.items.length){
    frag.appendChild(renderAktivitaetenLoadingCard());
    return frag;
  }
  if(ap.error && !ap.items.length){
    frag.appendChild(renderAktivitaetenErrorCard());
    return frag;
  }
  if(ap.loaded && !ap.items.length){
    frag.appendChild(renderAktivitaetenEmptyCard());
    return frag;
  }
  frag.appendChild(renderAktivitaetenListCard());
  return frag;
}

// ==================== Trainer ====================
// Phase 3: goal selection, route-adaptive/time-based workout generation,
// FIT/ZWO export, "Send to Hammerhead", and adaptive learning — ported from
// the strava-ftp-forecast Artifact's renderTrainerTab() and its supporting
// Training Decision Engine (goal/class picker, priority+weekly-budget
// engine, route suitability, interval placement, FIT/ZWO binary writers,
// evaluation/learning loop). Everything below is pure data transformation
// plus el()-based rendering, following the same state/render() discipline as
// the Profil/Aktivitäten pages — no innerHTML-string building or manual
// querySelectorAll wiring like the Artifact's own DOM layer used, since that
// doesn't fit this app's existing pattern.
//
// The Artifact's very last snapshot required a route for ANY workout to be
// generated at all (its own non-route generateWorkout()/`.ZWO` UI branch had
// gone unreachable). The Phase 3 spec explicitly asks for both a route-based
// AND a pure time-based path to stay available, so that gate is relaxed here:
// generateTimeBasedWorkout() below (a from-scratch adaptation of the
// Artifact's original, still-correct generateWorkout()) covers the no-route
// case, and the route-based generator only runs once a route is actually
// attached.

// ---------- Trainer: %FTP zone ladder ----------
// A 6-zone %FTP ladder for workout-STEP coloring (chart segments, step list,
// zone legend) — a different axis from Phase 1's POWER_ZONE_META (Strava's 7
// zones, used for time-in-zone analysis of already-ridden data). Colors reuse
// the first six POWER_ZONE_META hues directly so the two zone systems read as
// the same visual language rather than a clashing second palette.
const ZONES = [
  { max:0.55, name:'Erholung (Z1)', color: POWER_ZONE_META[0].color },
  { max:0.75, name:'Ausdauer (Z2)', color: POWER_ZONE_META[1].color },
  { max:0.90, name:'Tempo (Z3)',    color: POWER_ZONE_META[2].color },
  { max:1.05, name:'Schwelle (Z4)', color: POWER_ZONE_META[3].color },
  { max:1.20, name:'VO2max (Z5)',   color: POWER_ZONE_META[4].color },
  { max:99,   name:'Anaerob (Z6)',  color: POWER_ZONE_META[5].color },
];
function zoneFor(pct){ return ZONES.find(z=>pct<=z.max) || ZONES[ZONES.length-1]; }

// TrainingPeaks/Friel 7-zone %LTHR ladder — the HF analog of ZONES above,
// used once equipmentMode==='hr'. Boundaries are Joe Friel's published %LTHR
// zone system (The Cyclist's Training Bible; also reproduced in
// TrainingPeaks' own zone documentation) — like ZONES, these are fixed,
// published thresholds and not exposed in the Einstellungen tab.
const LTHR_ZONES = [
  { max:0.81, name:'Aktive Erholung (Z1)',     color: POWER_ZONE_META[0].color },
  { max:0.89, name:'Ausdauer (Z2)',            color: POWER_ZONE_META[1].color },
  { max:0.93, name:'Tempo (Z3)',               color: POWER_ZONE_META[2].color },
  { max:0.99, name:'Sub-Schwelle (Z4)',        color: POWER_ZONE_META[3].color },
  { max:1.02, name:'Supra-Schwelle (Z5a)',     color: POWER_ZONE_META[4].color },
  { max:1.06, name:'Aerobe Kapazität (Z5b)',   color: POWER_ZONE_META[5].color },
  { max:99,   name:'Anaerobe Kapazität (Z5c)', color: POWER_ZONE_META[6].color },
];
function lthrZoneFor(pct){ return LTHR_ZONES.find(z=>pct<=z.max) || LTHR_ZONES[LTHR_ZONES.length-1]; }

// Central resolver for every display-only call site below: `pct` is always
// "% of the active threshold metric" (FTP or LTHR) regardless of
// equipmentMode — these two functions are the only place that decides which
// metric that means. Consumed by buildRouteWorkoutChart(), drawStepPowerChart()
// and renderTrainerAblaufCard(). Generation/evaluation/export call sites
// (workoutMetrics, evaluateWorkout, buildFit, buildZwo, generateTimeBasedWorkout,
// buildIntervalSpec, ...) still don't use these helpers — they inline the
// `usingHr ? rp.lthr : rp.ftp` branch themselves instead.
function stepTargetValue(pct, rp){ return rp.usingHr ? pct*rp.lthr : pct*rp.ftp; }
function stepZoneFor(pct, rp){ return rp.usingHr ? lthrZoneFor(pct) : zoneFor(pct); }

// Top-bar goal selector — the classic 5-way manual pick (plus "auto"). Tempo
// and Sprint are only ever reached through the "Workout wählen" class picker
// below, not this dropdown, matching the Artifact's own GOALS scope.
const GOALS = {
  auto:      { label:'🎯 Automatisch (größter Hebel)' },
  ftp:       { label:'FTP / Schwellenleistung erhöhen' },
  vo2max:    { label:'VO2max erhöhen' },
  endurance: { label:'Grundlagenausdauer aufbauen' },
  anaerobic: { label:'Anaerobe Kapazität & Sprint' },
  recovery:  { label:'Regeneration / Entlastung' },
};

// ---------- Trainer: Training Decision Engine ----------
// Central "what should I train on?" model — every number here is a starting
// default, not a validated physiological constant, all in one place so it
// stays inspectable/tunable (a future Einstellungen tab, not built in this
// phase, would be where a rider could override it).
const TRAINING_CLASSES = [
  { key:'recovery',     label:'Erholung',                          zoneIdx:0, unit:'minutes', priorityEligible:false },
  { key:'endurance',    label:'Grundlagenausdauer (Z2)',            zoneIdx:1, unit:'minutes', priorityEligible:true  },

// A manually chosen top-bar goal still maps onto one class and forces it to
// HIGH priority — 'auto' and 'recovery' don't force anything.

const TRAINER_SETTINGS_KEY = 'velocast_trainer_settings';
function loadConfigOverrides(){

function saveConfigOverrides(obj){ try{ localStorage.setItem(TRAINER_SETTINGS_KEY, JSON.stringify(obj)); }catch(e){} }
function deepMergeInto(target, source){

    const sv = source[k];
    if(sv && typeof sv==='object' && !Array.isArray(sv) && target[k] && typeof target[k]==='object') deepMergeInto(target[k], sv);
    else target[k] = sv;
  });

}
function getByPath(obj, path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }
function setByPath(obj, path, value){

// Re-keys Phase 1's detectWeaknesses() flat, goal-tagged item list onto the 8
// TRAINING_CLASSES — a durability/"Ermüdungsresistenz" item routes to
// 'longdistance' instead of 'endurance', since it's specifically about long
// rides under fatigue. Multiple items can map to the same class — the
// strongest one wins.
function classPerformanceScores(weaknessData){
  const scores = {};
  TRAINING_CLASSES.forEach(c => { scores[c.key] = { score:0, why:null }; });
  (weaknessData && weaknessData.items || []).forEach(item => {
    let key = item.goal;
    if(key === 'ftp') key = 'threshold';
    if(key === 'endurance' && item.area === 'Ermüdungsresistenz') key = 'longdistance';
    if(!scores[key]) return;
    if(item.score > scores[key].score) scores[key] = { score: item.score, why: item.why };
  });
  return scores;
}
function computeTrainingPriorities(scores, selectedGoal, config, results, todayIso){
  const cfg = config.priority;
  const neglect = classNeglectWeeks(results, todayIso, config);
  const priorities = {};
  TRAINING_CLASSES.forEach(c => {
    if(!c.priorityEligible){ priorities[c.key] = 'MAINTENANCE'; return; }
    const raw = (scores[c.key] && scores[c.key].score) || 0;
    const neglectBoost = Math.min(config.neglect?.boostMax ?? 24, (neglect[c.key]||0) * (config.neglect?.boostPerWeek ?? 8));
    const total = Math.min(100, raw + (config.classBaselineScore[c.key] || 0) + neglectBoost);
    priorities[c.key] = total >= cfg.highMin ? 'HIGH' : total >= cfg.mediumMin ? 'MEDIUM'
      : total >= cfg.lowMin ? 'LOW' : 'MAINTENANCE';
  });
  if(selectedGoal && GOAL_TO_CLASS[selectedGoal]) priorities[GOAL_TO_CLASS[selectedGoal]] = 'HIGH';
  return priorities;
}
function computeWeeklyBudgetTargets(priorities, config){
  const targets = {};
  TRAINING_CLASSES.forEach(c => {
    const tier = priorities[c.key] || 'MAINTENANCE';
    if(c.key === 'recovery') targets[c.key] = { unit:'minutes', amount: 0 };
    // Verified crash point: without this branch, 'test' falls into the bare
    // `else` below and does config[WEEKLY_QUALITY_TABLE_BY_CLASS['test']][tier]
    // -- WEEKLY_QUALITY_TABLE_BY_CLASS has no 'test' entry, so that's
    // undefined[tier], a TypeError that would crash the whole Trainer tab the
    // moment 'test' entered TRAINING_CLASSES. amount:0 is a placeholder --
    // formatBudgetLine() is never shown for 'test' (see
    // renderTrainerClassPicker()'s isTest branch), so this value is only ever
    // read defensively (reconcileWeeklyBudgets()), never displayed.
    else if(c.key === 'test') targets[c.key] = { unit:'test', amount: 0 };
    else if(c.key === 'endurance') targets[c.key] = { unit:'minutes', amount: config.weeklyEnduranceMinutesByPriority[tier] };
    else if(c.key === 'sprint') targets[c.key] = { unit:'efforts', amount: config.weeklySprintEffortsByPriority[tier] };
    else if(c.key === 'longdistance') targets[c.key] = { unit:'rides', amount: config.weeklyLongRidesByPriority[tier] };
    else targets[c.key] = { unit:'quality', amount: config[WEEKLY_QUALITY_TABLE_BY_CLASS[c.key]][tier] };
  });
  return targets;
}
// UTC-based date-string helpers for the weekly-budget window / "trained on
// date" checks — UTC-only throughout so they line up exactly with
// todayIsoKey() with no local-timezone drift.
function parseIsoDateUTC(iso){
  const [y,m,d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, (m||1)-1, d||1));
}
function toIsoDate(d){ return d.toISOString().slice(0,10); }
function addDaysUTC(d, n){ const out = new Date(d); out.setUTCDate(out.getUTCDate()+n); return out; }
function mondayOfUTC(d){ const day = (d.getUTCDay()+6)%7; return addDaysUTC(d, -day); }

function weeklyClassProgress(results, todayIso, config){
  const monday = mondayOfUTC(parseIsoDateUTC(todayIso));
  const nextMonday = addDaysUTC(monday, 7);
  const progress = {};
  TRAINING_CLASSES.forEach(c => { progress[c.key] = 0; });
  let longRideCount = 0;
  (results||[]).forEach(r => {
    const d = r.date instanceof Date ? r.date : new Date(r.date);
    if(isNaN(d.getTime()) || d < monday || d >= nextMonday) return;
    if(r.metrics && Array.isArray(r.metrics.zoneTimes)){
      // Prefer the interval-gated array so tempo/threshold/vo2max/anaerobic
      // only bank weekly-budget credit for genuine sustained efforts, not
      // scattered spikes -- see computeStreamMetrics(). Falls back to raw
      // zoneTimes for cached rows computed before intervalZoneTimes existed
      // (PROFIL_METRICS_VERSION), which is byte-identical for the
      // ungated classes anyway.
      const zt = Array.isArray(r.metrics.intervalZoneTimes) ? r.metrics.intervalZoneTimes : r.metrics.zoneTimes;
      TRAINING_CLASSES.forEach(c => {
        if(c.zoneIdx != null && zt[c.zoneIdx] != null) progress[c.key] += zt[c.zoneIdx]/60;
      });
    }
    if(r.movingMin != null && r.movingMin >= config.longRideMinMinutes) longRideCount++;
  });
  progress.longdistance = longRideCount;
  progress.sprint = Math.round((progress.sprint||0) / config.sprintMinutesPerEffort);
  return progress;
}
// Consecutive weeks (walking backward from the week before todayIso's week)
// that a class's weekly progress fell below floorFraction of its own fixed
// LOW-tier weekly target. Uses the fixed LOW-tier target rather than
// whatever tier is currently assigned as the reference floor, since
// priority itself now depends on this neglect count -- a dynamically
// assigned target would be circular. Counting stops at the first
// non-neglected week found going backward, and classes with no meaningful
// floor (0/undefined) are skipped (0 neglect weeks) rather than falsely
// flagged.
function classNeglectWeeks(results, todayIso, config){
  const neglect = {};
  const cfg = config.neglect || {};
  const lookbackWeeks = cfg.lookbackWeeks ?? 4;
  const floorFraction = cfg.floorFraction ?? 0.5;
  const thisMonday = mondayOfUTC(parseIsoDateUTC(todayIso));
  // Precompute each lookback week's progress once (not once per class) --
  // weeklyClassProgress() does a full pass over `results`, so this turns
  // O(classes * lookbackWeeks) full passes into O(lookbackWeeks).
  const weekProgress = [];
  for(let i=1; i<=lookbackWeeks; i++){
    const weekIso = toIsoDate(addDaysUTC(thisMonday, -7*i));
    weekProgress.push(weeklyClassProgress(results, weekIso, config));
  }
  TRAINING_CLASSES.forEach(c => {
    neglect[c.key] = 0;
    if(!c.priorityEligible) return;
    // Same per-class target lookup as computeWeeklyBudgetTargets(), fixed to
    // the LOW tier instead of whatever tier is currently assigned.
    let floor;
    if(c.key === 'endurance') floor = config.weeklyEnduranceMinutesByPriority?.LOW;
    else if(c.key === 'sprint') floor = config.weeklySprintEffortsByPriority?.LOW;
    else if(c.key === 'longdistance') floor = config.weeklyLongRidesByPriority?.LOW;
    else floor = config[WEEKLY_QUALITY_TABLE_BY_CLASS[c.key]]?.LOW;
    if(!floor) return;
    let count = 0;
    for(let i=0; i<lookbackWeeks; i++){
      const done = weekProgress[i][c.key] || 0;
      if(done < floor*floorFraction) count++;
      else break;
    }
    neglect[c.key] = count;
  });
  return neglect;
}
function reconcileWeeklyBudgets(targets, progress){
  const out = {};
  TRAINING_CLASSES.forEach(c => {
    const t = targets[c.key];
    if(!t) return;
    const done = progress[c.key] || 0;
    out[c.key] = { unit: t.unit, target: t.amount, done: Math.round(done*10)/10,
      remaining: Math.round(Math.max(0, t.amount-done)*10)/10, complete: t.amount>0 && done>=t.amount };
  });
  return out;
}
function computeTrainingDecisionState(results, weaknessData, selectedGoal, todayIso, config){
  const scores = classPerformanceScores(weaknessData);
  const priorities = computeTrainingPriorities(scores, selectedGoal, config, results, todayIso);
  const targets = computeWeeklyBudgetTargets(priorities, config);
  const progress = weeklyClassProgress(results, todayIso, config);
  const budgets = reconcileWeeklyBudgets(targets, progress);
  return { scores, priorities, budgets, weekStartIso: toIsoDate(mondayOfUTC(parseIsoDateUTC(todayIso))) };
}
function trainedOnDate(results, cls, dateIso, config){
  if(!cls || cls.zoneIdx == null) return false;
  const thresholdMin = config.recentTrainingMinMinutes || 12;
  return (results||[]).some(r => {
    const d = r.date instanceof Date ? r.date : new Date(r.date);
    if(isNaN(d.getTime()) || toIsoDate(d) !== dateIso) return false;
    if(!r.metrics) return false;
    // Same interval-gated preference (with graceful fallback for old cached
    // rows) as weeklyClassProgress() -- see there for rationale.
    const zt = Array.isArray(r.metrics.intervalZoneTimes) ? r.metrics.intervalZoneTimes : r.metrics.zoneTimes;
    return Array.isArray(zt) && (zt[cls.zoneIdx]||0)/60 >= thresholdMin;
  });
}
function pickIntendedTrainingClass(decisionState, results, todayIso, config, forceRecovery){
  if(forceRecovery) return { classKey:'recovery', reason:'safety' };
  const tierWeight = { HIGH:3, MEDIUM:2, LOW:1, MAINTENANCE:0 };
  const yesterdayIso = toIsoDate(addDaysUTC(parseIsoDateUTC(todayIso), -1));
  const ranked = TRAINING_CLASSES.filter(c => c.priorityEligible).slice().sort((a,b) => {
    const pa = tierWeight[decisionState.priorities[a.key]]||0, pb = tierWeight[decisionState.priorities[b.key]]||0;
    if(pa !== pb) return pb-pa;
    return ((decisionState.scores[b.key]&&decisionState.scores[b.key].score)||0) - ((decisionState.scores[a.key]&&decisionState.scores[a.key].score)||0);
  });
  for(const c of ranked){
    const budget = decisionState.budgets[c.key];
    if(budget && budget.target > 0 && budget.complete) continue;
    const cc = config.constraints.byClass[c.key];
    if(cc && cc.noConsecutiveDays && trainedOnDate(results, c, yesterdayIso, config)) continue;
    return { classKey:c.key, reason:'priority' };
  }
  return { classKey:'endurance', reason:'fallback' };
}
// Classes whose value doesn't depend on hitting specific terrain — any route
// supports them, so they skip the segment-level suitability gate entirely.
const SUITABILITY_EXEMPT_CLASSES = ['recovery', 'endurance', 'longdistance', 'test'];
function computeTrainingOpportunity(decisionState, route, results, todayIso, config, rp, options){
  const forceRecovery = !!(rp && ((rp.acwr!=null && rp.acwr>1.5) || (rp.daysSinceHard!=null && rp.daysSinceHard<=1)));
  const intended = pickIntendedTrainingClass(decisionState, results, todayIso, config, forceRecovery);
  const cls = trainingClass(intended.classKey);
  const exempt = SUITABILITY_EXEMPT_CLASSES.includes(intended.classKey);
  const suitability = (!exempt && route) ? computeRouteSuitability(route, intended.classKey, config, options) : null;
  const suitable = exempt || !route || (suitability && suitability.score >= config.suitability.minAcceptable);
  return {
    classKey: intended.classKey, className: cls ? cls.label : intended.classKey, reason: intended.reason,
    forceRecovery, suitability, suitable,
    budget: decisionState.budgets[intended.classKey],
    priority: decisionState.priorities[intended.classKey],
  };
}
function computeOpportunityForClass(decisionState, route, classKey, config, rp, options){
  const cls = trainingClass(classKey);
  const exempt = SUITABILITY_EXEMPT_CLASSES.includes(classKey);
  const suitability = (!exempt && route) ? computeRouteSuitability(route, classKey, config, options) : null;
  const suitable = exempt || !route || (suitability && suitability.score >= config.suitability.minAcceptable);
  return {
    classKey, className: cls ? cls.label : classKey, reason:'manual',
    forceRecovery:false, suitability, suitable,
    budget: decisionState.budgets[classKey],
    priority: decisionState.priorities[classKey],
  };
}

// Extends Phase 1's buildRiderProfile() output with the load/fatigue signals
// the Decision Engine needs (ACWR, freshness, hours/rides this week, days
// since a hard effort) — a read-only overlay rather than widening
// buildRiderProfile() itself, so the Profil tab's own render paths (which
// only ever read the narrower shape) can't be affected by this port. ACWR
// here is ATL/CTL (both already EWMA'd by Phase 1's buildTrainingLoad(), 7-
// day/42-day) rather than the Artifact's acute-vs-chronic sum of Strava's own
// "relative effort" score — VeloCast never fetches relative_effort, and this
// ratio answers the same "how loaded now vs. your longer-term average"
// question using the TSS-based load model Phase 1 already built.
// ---------- Trainer: HF-only LTHR-Schätzung (Ingestion-Pipeline) ----------
// processProfilRide()/loadProfilData() (see Profil pipeline further up)
// reject any ride without a watts stream before ever fetching one, so
// HF-only rides never reach the Profil page's analysis at all. Since Profil
// stays power-only by design (see plan), this is a separate, Trainer-owned
// ingestion that mirrors that pipeline's shape (pagination budget, cache +
// skip-cache, bounded concurrency) but walks HR streams instead of power
// streams. Populates state.trainerPage.hrProfile — see loadHrLthrEstimate().

// Mirrors PROFIL_ACTIVITY_CACHE_KEY/PROFIL_SKIP_CACHE_KEY, but under its own
// key so this pipeline's reload behavior can never affect (or be affected
// by) the Profil page's own cache.
const HR_PROFILE_CACHE_KEY = "velocast_hr_profile_cache";
const HR_PROFILE_CACHE_MAX = 400;
function loadHrProfileCache(){
  try{
    const raw = localStorage.getItem(HR_PROFILE_CACHE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, row]) => {
      if(!row || typeof row !== "object" || !row.date || !row.id) return;
      const d = new Date(row.date);
      if(isNaN(d.getTime())) return;
      out[String(id)] = { ...row, id: String(row.id), date: d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveHrProfileCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.values(cacheObj).sort((a,b)=>b.date-a.date).slice(0, cap);
    const trimmed = {};
    entries.forEach(r => { trimmed[r.id] = r; });
    localStorage.setItem(HR_PROFILE_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(HR_PROFILE_CACHE_MAX); }
  catch(e){ try{ attempt(150); }catch(e2){ /* cache is a speed optimization, not required */ } }
}
function clearHrProfileCache(){ try{ localStorage.removeItem(HR_PROFILE_CACHE_KEY); }catch(e){} }

const HR_PROFILE_SKIP_CACHE_KEY = "velocast_hr_profile_skip_cache";
const HR_PROFILE_SKIP_CACHE_MAX = 800;
const HR_PROFILE_SKIP_STATUSES = new Set(["noHr","noBestEffort"]);
function loadHrProfileSkipCache(){
  try{
    const raw = localStorage.getItem(HR_PROFILE_SKIP_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if(!parsed || typeof parsed !== "object") return {};
    const out = {};
    Object.entries(parsed).forEach(([id, v]) => {
      if(!v || typeof v !== "object" || !HR_PROFILE_SKIP_STATUSES.has(v.status)) return;
      const d = v.date ? new Date(v.date) : new Date(0);
      out[String(id)] = { status:v.status, date: isNaN(d.getTime()) ? new Date(0) : d };
    });
    return out;
  }catch(e){ return {}; }
}
function saveHrProfileSkipCache(cacheObj){
  const attempt = (cap) => {
    const entries = Object.entries(cacheObj).sort((a,b)=>b[1].date-a[1].date).slice(0, cap);
    const trimmed = {};
    entries.forEach(([id,v]) => { const dt = (v.date instanceof Date && !isNaN(v.date.getTime())) ? v.date : new Date(0); trimmed[id] = { status:v.status, date:dt.toISOString() }; });
    localStorage.setItem(HR_PROFILE_SKIP_CACHE_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(HR_PROFILE_SKIP_CACHE_MAX); }
  catch(e){ try{ attempt(200); }catch(e2){} }
}
function clearHrProfileSkipCache(){ try{ localStorage.removeItem(HR_PROFILE_SKIP_CACHE_KEY); }catch(e){} }

// How many recent qualifying rides to consider — fixed budget, no "Mehr
// laden" UI for this pipeline in this phase (unlike pp.rideBudget); a single
// LTHR estimate needs far fewer samples than an FTP trend does.
const HR_PROFILE_RIDE_BUDGET = 60;

async function processHrProfileRide(a, token){
  const id = String(a.id);
  let raw;
  try{ raw = await fetchActivityHrStream(id, token); }
  catch(e){ return { status:'apiError' }; }
  const stream = normalizeStreams(raw);
  if(!stream.time || !stream.heartrate || stream.time.length < 30) return { status:'noBestEffort' };
  const mmp = computeHrMmpFromStream(stream);
  const est = mmp ? estimateLthrFromHrCurve(mmp, a.max_heartrate!=null ? a.max_heartrate : null) : null;
  if(!est) return { status:'noBestEffort' };
  return { status:'ok', row: {
    id, date: new Date(a.start_date_local || a.start_date),
    lthr: est.lthr, sec: est.sec, confidence: est.confidence, basis: est.basis
  }};
}

// Orchestrates the HF-only LTHR estimate: paginates /athlete/activities up
// to HR_PROFILE_RIDE_BUDGET qualifying rides (mirrors loadProfilData()'s
// device_watts filter, just on average_heartrate instead), skips anything
// already known from cache/skip-cache for free, fetches HR streams for
// genuinely new candidates in small concurrent batches, and picks the single
// best estimate (highest-confidence window wins; ties broken by the higher
// bpm value). Deliberately NOT a 42-day-ceiling regression like FTP's
// currentCeiling — LTHR is a physiological ceiling that doesn't trend across
// a season the way FTP does, so one best test-effort is the right model.
//
// Lazy by design: only ever called from the equipmentMode toggle (on first
// switch to 'hr' without an existing override/loaded estimate) or the
// explicit "Automatisch schätzen" button in Einstellungen — never from the
// normal Trainer-tab render path, so it can't block or regress it.
//
// opts.forceRefresh: clears both the estimate cache and the skip cache first,
// so a ride once skipped as noBestEffort/noHr (e.g. before a HR sensor issue
// was fixed, or before the plausibility check above existed) gets a genuine
// re-check instead of staying permanently skipped. Without this, clearHrProfileCache()/
// clearHrProfileSkipCache() had no caller at all.
async function loadHrLthrEstimate(token, opts){
  opts = opts || {};
  const tp = state.trainerPage;
  if(tp.hrProfile.loading) return;
  if(!token){ tp.hrProfile.error = "Bitte zuerst mit Strava verbinden."; render(); return; }
  if(opts.forceRefresh){ clearHrProfileCache(); clearHrProfileSkipCache(); }
  tp.hrProfile.loading = true; tp.hrProfile.error = null;
  render();
  try{
    const cache = loadHrProfileCache();
    const skipCache = loadHrProfileSkipCache();

    let candidates = [];
    let page = 1;
    const perPage = 100;
    while(candidates.length < HR_PROFILE_RIDE_BUDGET && page <= 10){
      const batch = await fetchActivitiesPage(token, page, perPage);
      if(!batch || !batch.length) break;
      candidates = candidates.concat(batch.filter(a => RIDE_SPORT_TYPES.has(a.sport_type || a.type)));
      if(batch.length < perPage) break;
      page++;
    }
    candidates = candidates.slice(0, HR_PROFILE_RIDE_BUDGET);

    const cachedRows = [], toFetch = [];
    candidates.forEach(a => {
      const id = String(a.id);
      const hit = cache[id];
      if(hit){ cachedRows.push(hit); return; }
