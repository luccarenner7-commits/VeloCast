function renderTrainerDecisionDashboard(trainingState, weaknessData, opportunity, budgetsUnavailable, testSignal){
  const card = el('div', {class:'card'});
  card.appendChild(el('h2',{},['Trainings-Dashboard']));
  if(weaknessData) card.appendChild(el('div',{style:'margin-bottom:10px;'},[calloutBox(null, `Größter Hebel: ${weaknessData.headline}`, weaknessData.reason)]));
  card.appendChild(el('div',{style:'margin-bottom:6px; font-weight:600; font-size:13px;'},['Prioritäten & Wochenbudgets']));
  if(budgetsUnavailable){
    // weeklyClassProgress()/classNeglectWeeks() read results[].metrics.zoneTimes,
    // which only ever exists on pp.results' device_watts-filtered rows (see
    // loadProfilData()) -- always empty for HR-only riders, same root cause
    // already fixed for trainerRiderContext()'s own fields ("Issue 4 fix",
    // ~7083). Rather than showing confidently-wrong 0/target bars, say so.
    card.appendChild(el('div',{class:'legend-note'},['Wochenbudgets sind für reine HF-Konten (ohne Leistungsmesser) aktuell nicht verfügbar – die Berechnung basiert auf watt-gemessenen Trainingszonen.']));
  } else {
    TRAINING_CLASSES.filter(c=>c.priorityEligible).forEach(c=>{
      const tier = trainingState.priorities[c.key] || 'MAINTENANCE';
      const badge = PRIORITY_BADGE[tier] || PRIORITY_BADGE.MAINTENANCE;
      const budget = trainingState.budgets[c.key];
      const pct = (budget && budget.target>0) ? Math.max(0,Math.min(100, budget.done/budget.target*100)) : 0;
      const row = el('div', {class:'bar-row'});
      // Badge is a separate flex sibling, NOT nested inside .bar-label — that
      // span has overflow:hidden/white-space:nowrap (see .bar-row .bar-label),
      // which would clip the badge for anything longer than the shortest class
      // names (e.g. "VO2max") once appended as a child of the truncating box.
      row.appendChild(el('span', {class:'bar-label', title:c.label}, [c.label]));
      row.appendChild(el('span', {style:`flex:0 0 auto; padding:1px 7px; border-radius:var(--r-full); font-size:10.5px; font-weight:600; color:${badge.fg}; background:${badge.bg};`}, [badge.label]));
      row.appendChild(el('span',{class:'bar-track'},[el('span',{style:`display:block; height:100%; border-radius:var(--r-full); width:${pct}%; background:${badge.fg};`},[])]));
      row.appendChild(el('span',{class:'bar-num'},[formatBudgetLine(budget)]));
      card.appendChild(row);
    });
  }
  if(opportunity){
    if(opportunity.suitable){
      const suitText = opportunity.suitability ? ` Streckeneignung: ${opportunity.suitability.score}/100.` : '';
      const safetyText = opportunity.forceRecovery ? ' Sicherheitsnetz aktiv: Belastung/Ermüdung überschreiben die normale Priorität.' : '';
      card.appendChild(el('div',{style:'margin-top:10px;'},[calloutBox('good', `Warum ${opportunity.className} heute?`,
        (opportunity.forceRecovery?'Sicherheitsnetz':`Priorität ${(PRIORITY_BADGE[opportunity.priority]||{}).label||opportunity.priority}`) + '.' + suitText + safetyText)]));
    } else {
      const reasons = (opportunity.suitability && opportunity.suitability.reasons) || [];
      card.appendChild(el('div',{style:'margin-top:10px;'},[calloutBox('danger', `Route ungeeignet für ${opportunity.className}`,
        `Streckeneignung: ${opportunity.suitability?opportunity.suitability.score:0}/100. ${reasons.join(' ')}`)]));
    }
  }
  if(testSignal && testSignal.dueEntries.length){
    const labels = testSignal.dueEntries.map(e=>fmtDurLabel(e.durationSec)).join(', ');
    card.appendChild(el('div',{style:'margin-top:10px;'},[calloutBox('warn', 'Test fällig',
      `Für ${labels} liegt seit mindestens ${TEST_STALENESS_DAYS} Tagen kein bestätigter Test vor, obwohl das aktuell trainiert wird. Wähle unten den „Test"-Chip, um deinen Bestwert bewusst neu zu ermitteln.`)]));
  }
  return card;
}
function renderTrainerClassPicker(tp, trainingState, recommendedClassKey, testSignal){
  const card = el('div', {class:'card'});
  card.appendChild(el('h2', {style:'display:flex; align-items:center; gap:8px;'}, ['Workout wählen', infoButton('Wähle die Trainingsart, die du fahren willst. „Empfohlen" markiert, was laut Priorität und Wochenbudget aktuell am meisten bringt.')]));
  const grid = el('div', {class:'class-picker'});
  TRAINING_CLASSES.forEach(c => {
    const isTest = c.key === 'test';
    const tier = trainingState.priorities[c.key] || 'MAINTENANCE';
    // The 'test' chip's weekly-budget tier is always MAINTENANCE
    // (priorityEligible:false) and its formatBudgetLine() text would always
    // read a meaningless "0/0" (see computeWeeklyBudgetTargets()'s test
    // branch) -- both are replaced with a due/last-tested signal instead.
    const testDue = isTest && testSignal && testSignal.dueEntries.length > 0;
    const badge = testDue ? { label:'Fällig', bg:'var(--cross-bg)', fg:'var(--cross)' } : (PRIORITY_BADGE[tier] || PRIORITY_BADGE.MAINTENANCE);
    const budget = trainingState.budgets[c.key];
    const isRecommended = c.key === recommendedClassKey;
    const isSelected = c.key === tp.selectedClassKey;
    let testMetaLine = null;
    if(isTest && testSignal){
      const withDate = testSignal.entries.filter(e=>e.daysSince!=null);
      testMetaLine = withDate.length
        ? `Zuletzt vor ${Math.min(...withDate.map(e=>e.daysSince))} Tag${Math.min(...withDate.map(e=>e.daysSince))===1?'':'en'}`
        : 'Noch nie getestet';
    }
    grid.appendChild(el('button', {
      type:'button', class:'class-pick-card' + (isSelected?' selected':''),
      onclick: ()=>{
        tp.selectedClassKey = c.key; tp.workoutPreviewOpen = true; tp.hammerheadResult = null;
        if(isTest && tp.selectedTestDurationSec == null && testSignal) tp.selectedTestDurationSec = testSignal.suggestedDurationSec;
        render();
      }
    }, [
      el('div', {class:'cpc-title'}, [
        el('span', {}, [c.label]),
        isRecommended ? el('span', {class:'cpc-rec'}, ['Empfohlen']) : ''
      ]),
      el('div', {class:'cpc-meta'}, [
        el('span', {class:'cpc-badge', style:`background:${badge.bg}; color:${badge.fg};`}, [badge.label]),
        isTest
          ? (testMetaLine ? el('span', {class:'cpc-budget'}, [testMetaLine]) : '')
          : (budget ? el('span', {class:'cpc-budget'}, [formatBudgetLine(budget)]) : '')
      ])
    ]));
  });
  card.appendChild(grid);
  return card;
}
// Small duration picker shown instead of renderTrainerRouteCard() whenever
// the 'test' class is selected (a test always uses the time-based path --
// see renderTrainerPage()'s effectiveRouteBased -- so there's no route
// attachment UI to show here). Same pill styling as the existing GPX/
// Gespeicherte-Route source tabs (.source-tab/.source-tabs), reused rather
// than introducing new CSS for a one-off 4-option picker.
function renderTrainerTestDurationPicker(tp, testSignal){
  const card = el('div', {class:'card'});
  card.appendChild(el('h2', {style:'display:flex; align-items:center; gap:8px;'}, ['Testdauer wählen', infoButton('Wähle, wie lange der Test-Abschnitt dauern soll. Der Zielwert wird aus deiner aktuellen Bestleistung für genau diese Dauer berechnet.')]));
  const row = el('div', {class:'source-tabs'});
  TEST_DURATIONS_SEC.forEach(sec => {
    const active = tp.selectedTestDurationSec === sec;
    const entry = testSignal && testSignal.entries.find(e=>e.durationSec===sec);
    row.appendChild(el('div', {
      class:'source-tab' + (active?' active':''),
      onclick: ()=>{ tp.selectedTestDurationSec = sec; render(); }
    }, [fmtDurLabel(sec) + (entry && entry.due ? ' •' : '')]));
  });
  card.appendChild(row);
  return card;
}
// Ranked Top-Strecken suitability list for the currently selected training
// class — a decision aid shown ABOVE the manual attach card below, since
// "here's what's optimal" belongs before "here's how to pick something
// else". Not rendered for SUITABILITY_EXEMPT_CLASSES: gradient-band scoring
// is meaningless for recovery/endurance/longdistance (any terrain is fine
// by design) and 'test' already has its own dedicated route-free UI
// (renderTrainerTestDurationPicker) — this is also enforced structurally at
// the renderTrainerPage() call site, this check just makes it safe to call
// renderTopRoutesCard() directly too.
const TOP_ROUTES_TOP_N = 5;
function renderTopRoutesCard(tp, classKey){
  if(SUITABILITY_EXEMPT_CLASSES.includes(classKey)) return null;
  // Saved routes are only ever fetched lazily (see ensureStravaRoutesLoaded()'s
  // own guard against duplicate/parallel fetches) — normally triggered by
  // opening the Strecke page's "Routes" tab, but a user who opens Trainer
  // first in a fresh session would otherwise silently see zero saved-route
  // candidates with no indication why. Same call-inside-render trigger
  // pattern already used for e.g. ensureElevationProfile().
  ensureStravaRoutesLoaded();
  const card = el('div', {class:'card'});
  card.appendChild(el('h2', {style:'display:flex; align-items:center; gap:8px;'}, [
    'Top-Strecken',
    infoButton('Deine gespeicherten Strava-Routen und zuletzt gefahrenen Strecken, bewertet danach, wie gut ihr Höhenprofil zur gewählten Trainingsklasse passt. Ergebnis kommt aus derselben Steigungs-Analyse, die auch die Intervall-Platzierung auf einer angehängten Strecke nutzt.')
  ]));

  const candidates = buildTopRouteCandidates();
  if(!candidates.length){
    card.appendChild(el('div', {class:'empty-state'}, ['Keine gespeicherten Routen oder Fahrten gefunden.']));
    return card;
  }
  const cache = loadTopRoutesCache();
  const uncachedCount = candidates.filter(c => !cache[c.id]).length;

  const scored = candidates
    .map(c => {
      const analyzed = getAnalyzedTopRoute(c.id);
      if(!analyzed) return null;
      const suitability = computeRouteSuitability(analyzed, classKey, TRAINING_CONFIG, {});
      return { candidate: c, analyzed, suitability };
    })
    .filter(Boolean)
    .sort((a,b) => b.suitability.score - a.suitability.score)
    .slice(0, TOP_ROUTES_TOP_N);

  if(scored.length){
    const list = el('div', {style:'margin-top:8px; display:flex; flex-direction:column; gap:8px;'});
    scored.forEach(({candidate, analyzed, suitability})=>{
      const sourceLabel = candidate.sourceType === 'route' ? 'Route'
        : `Aktivität vom ${new Date(candidate.dateIso).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'})}`;
      list.appendChild(el('div', {class:'activity', style:'cursor:pointer;', onclick: ()=>attachTopRouteCandidate(candidate)}, [
        el('div', {}, [
          el('div', {class:'name'}, [candidate.name]),
          el('div', {class:'meta'}, [`${sourceLabel} · ${(analyzed.totalDistanceM/1000).toFixed(1)} km`])
        ]),
        el('div', {class:'stat-chips'}, [
          statChip(String(Math.round(suitability.score)), 'Eignung'),
          statChip(suitability.workableKm.toFixed(1), 'km geeignet')
        ])
      ]));
    });
    card.appendChild(list);
  } else if(!tp.topRoutesLoading){
    card.appendChild(el('div', {class:'legend-note', style:'margin-top:8px;'}, ['Noch keine Strecken bewertet.']));
  }

  if(tp.topRoutesLoading){
    card.appendChild(el('div', {class:'loading', style:'margin-top:8px;'}, [`Strecken werden bewertet… (${tp.topRoutesFetchedCount}/${candidates.length})`]));
  } else if(uncachedCount > 0){
    card.appendChild(el('button', {class:'btn secondary', style:'margin-top:8px;', onclick: ()=>{
      tp.topRoutesLoading = true; tp.topRoutesError = null; render();
      ensureTopRouteCandidatesFetched();
    }}, [`Strecken bewerten (${uncachedCount})`]));
  }
  if(tp.topRoutesError) card.appendChild(el('div', {class:'error', style:'margin-top:10px;'}, [tp.topRoutesError]));
  return card;
}

function renderTrainerWorkoutPreview(tp, ctx){
  const { workout, workoutExists, hasWorkout, routeBased, rp, metrics, zoneBreakdown, specificity, workoutGoalKey, warnRationale, goodRationale } = ctx;
  const card = el('div', {class:'card'});
  const details = el('details', {class:'tt-collapse', open: tp.workoutPreviewOpen?'open':null,
    ontoggle:(e)=>{ tp.workoutPreviewOpen = e.target.open; }});
  details.appendChild(el('summary', {}, [ el('h2', {}, [workoutExists && workout.title ? `Vorschau: ${workout.title}` : 'Vorschau']) ]));

    body.appendChild(el('div',{class:'legend-note'},['Keine Vorschau verfügbar.']));
  } else {
    if(warnRationale.length){
      const warnRow = el('div', {style:'display:flex; flex-direction:column; gap:8px; margin-bottom:10px;'});
      warnRationale.forEach(r => warnRow.appendChild(calloutBox(r.type==='danger'?'danger':'warn', r.title, r.text)));
      body.appendChild(warnRow);
    }
    if(goodRationale.length){
      const goodRow = el('div', {style:'display:flex; flex-direction:column; gap:8px; margin-bottom:10px;'});
      goodRationale.forEach(r => goodRow.appendChild(calloutBox('good', r.title, r.text)));
      body.appendChild(goodRow);
    }
    if(!hasWorkout){
      details.appendChild(body);
      card.appendChild(details);
      return card;
    }
    const base = slugify(workout.title);
    const actions = el('div', {style:'display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-bottom:10px;'});
    const doFit = ()=>{
      const distMode = !routeBased && !!tp.exportDistanceMode;
      const fitWorkout = distMode ? Object.assign({}, workout, { steps: stepsForDistanceExport(workout.steps) }) : workout;
      downloadBlob(buildFit(fitWorkout, rp), base + (distMode?'-km':'') + '.fit', 'application/octet-stream');
    };
    const sendToHammerhead = async ()=>{
      if(state.loading.hammerheadUpload) return;
      state.loading.hammerheadUpload = true;
      tp.hammerheadResult = null;
      render();
      try{
        const token = await ensureHammerheadToken();
        if(!token){
          state.loading.hammerheadUpload = false;
          window.location.href = await buildHammerheadAuthUrl();
          return;
        }
        const distMode = !routeBased && !!tp.exportDistanceMode;
        const fitWorkout = distMode ? Object.assign({}, workout, { steps: stepsForDistanceExport(workout.steps) }) : workout;
        const fileName = base + (distMode?'-km':'') + '.fit';
        const result = await uploadWorkoutToHammerhead(buildFit(fitWorkout, rp), fileName, token);
        tp.hammerheadResult = { ok:true, name: result.name || fileName };
      }catch(e){
        tp.hammerheadResult = { ok:false, message: e.message || "Senden an Hammerhead fehlgeschlagen." };
      }
      state.loading.hammerheadUpload = false;
      render();
    };
    actions.appendChild(el('button', {
      class:'btn',
      title: state.hammerheadConnected ? 'Direkt ins Hammerhead-Dashboard senden' : 'Mit Hammerhead verbinden und senden',
      disabled: state.loading.hammerheadUpload ? 'disabled' : null,
      onclick: sendToHammerhead
    }, [ state.loading.hammerheadUpload ? 'Sende…' : (state.hammerheadConnected ? '📲 Send to Hammerhead' : '📲 Mit Hammerhead verbinden') ]));
    actions.appendChild(el('button', {class:'btn secondary', title:'Binäres .FIT (Garmin, Wahoo, Hammerhead)', onclick: doFit}, ['.FIT']));
    if(routeBased){
      actions.appendChild(el('button', {class:'btn secondary', title:'GPS-Strecke als separate .FIT-Kursdatei', onclick:()=>{
        const todayRoute = getTrainerRouteForDate(todayIsoKey());
        if(todayRoute && todayRoute.route) downloadBlob(buildCourseFit(todayRoute.route, rp), base+'-strecke.fit', 'application/octet-stream');
      }}, ['.FIT (Strecke)']));
    } else if(rp.usingHr){
      // Zwift's .ZWO format has no native HF-target element (plan §4 row 5)
      // -- rather than faking a fictional watt value, the export is hidden
      // and replaced with an explanation. buildZwo() itself stays untouched
      // and unreachable in HF mode (this is its only call site), so its
      // "Arbeits-FTP X W" description text (plan row 16) never renders.
      actions.appendChild(el('span', {style:'display:inline-flex; align-items:center; gap:var(--space-2); font-size:12px; color:var(--chalk-dim);'}, [
        '.ZWO nicht verfügbar',
        infoButton('Zwift-Workouts benötigen Leistungsziele – im HF-Modus nicht verfügbar.')
      ]));
    } else {
      actions.appendChild(el('button', {class:'btn secondary', title:'Zwift-Workout-Format', onclick:()=>{
        downloadBlob(buildZwo(workout, rp, goalLabel(workoutGoalKey)), base+'.zwo', 'application/xml;charset=utf-8');
      }}, ['.ZWO']));
    }
    body.appendChild(actions);
    if(!routeBased){
      const toggleLabel = el('label', {style:'display:flex; align-items:center; gap:6px; font-size:12px; color:var(--chalk-dim); justify-content:flex-end; margin:-4px 0 10px;'});
      const cb = el('input', {type:'checkbox', onchange:(e)=>{ tp.exportDistanceMode = e.target.checked; }});
      if(tp.exportDistanceMode) cb.checked = true;
      toggleLabel.appendChild(cb);
      toggleLabel.appendChild(document.createTextNode('Schritte in km statt Minuten planen (nur .FIT – Garmin/Wahoo/Hammerhead-Geräte lösen dann per zurückgelegter Strecke statt Zeit aus)'));
      body.appendChild(toggleLabel);
    } else {
      body.appendChild(el('div', {style:'margin:-4px 0 10px;'}, [infoButton('Zwei Dateien: das Workout (Schritte/Ziele) und die Strecke (GPS-Track) separat – auf dem Gerät beide zusammen für die Fahrt auswählen, genau wie bei Hammerhead/Garmin/Wahoo üblich.')]));
    }
    body.appendChild(el('div',{class:'chart-box tall'},[el('canvas',{id:'velocastTrainerChart'})]));
    // Gleiche Ampel wie die Tags in renderTrainerAblaufCard() -- nur für
    // Klassen mit echter Steigungs-Eignungsprüfung (siehe
    // SUITABILITY_EXEMPT_CLASSES), sonst wäre die Legende bedeutungslos.
    if(routeBased && !SUITABILITY_EXEMPT_CLASSES.includes(workout.classKey)){
      body.appendChild(el('div', {style:'margin-top:-4px; margin-bottom:8px;'}, [infoButton([
        legendDot(cssVar('--tail'), 'Optimale Steigung'),
        legendDot(cssVar('--cross'), 'Akzeptable Steigung'),
        legendDot(cssVar('--chalk-dim'), 'Kein Intervall / neutral'),
      ])]));
    }
    if(!routeBased){
      // HF-Zweig: LTHR_ZONES statt ZONES, Referenzlinien-Punkt heißt "LTHR-Linie".
      const legendZones = rp.usingHr ? LTHR_ZONES : ZONES;
      const legendLineLabel = rp.usingHr ? 'LTHR-Linie' : 'FTP-Linie';
      body.appendChild(el('div', {style:'margin-top:-4px; margin-bottom:8px;'}, [infoButton(legendZones.map(z=>legendDot(z.color, z.name)).concat([legendDot('#fc4c02',legendLineLabel)]))]));
    }
    if(tp.hammerheadResult) body.appendChild(renderHammerheadResult(tp.hammerheadResult));
    const cards = [];
    if(routeBased){
      cards.push(metricCard('Distanz', `${metrics.totalDistanceKm.toFixed(1)} km`, `ca. ${Math.floor(metrics.totalMin/60)}:${String(metrics.totalMin%60).padStart(2,'0')} h geschätzt`));
    } else {
      cards.push(metricCard('Dauer', `${Math.floor(metrics.totalMin/60)}:${String(metrics.totalMin%60).padStart(2,'0')} h`, `${metrics.totalMin} Minuten`));
    }
    // HF-Zweig: workoutMetrics()/estimateRouteWorkoutMetrics() liefern in
    // metrics.np/avgPower jetzt einen bpm-Zielwert statt Watt (kein NP-
    // Äquivalent für HF, siehe deren Kommentar) -- Label/Einheit hier
    // entsprechend umbenannt statt fälschlich "Normalized Power ... W" zu
    // zeigen.
    if(rp.usingHr){
      cards.push(metricCard('Ø Ziel-Puls', `${metrics.np} bpm`, `IF (HF) ${metrics.intensityFactor.toFixed(2)}${routeBased?' (geschätzt)':''}`));
      cards.push(metricCard('Trainingsbelastung', `${metrics.tss} hrTSS`, `${metrics.tss<50?'leicht':metrics.tss<100?'moderat':metrics.tss<150?'fordernd':'sehr hart'}${routeBased?' (geschätzt)':''}`));
    } else {
      cards.push(metricCard('Normalized Power', `${metrics.np} W`, `Ø ${metrics.avgPower} W · IF ${metrics.intensityFactor.toFixed(2)}${routeBased?' (geschätzt)':''}`));
      cards.push(metricCard('Trainingsbelastung', `${metrics.tss} TSS`, `${metrics.tss<50?'leicht':metrics.tss<100?'moderat':metrics.tss<150?'fordernd':'sehr hart'}${routeBased?' (geschätzt)':''}`));
    }
    cards.push(metricCard('Trainingsreiz', workout.adaptation, null));
    body.appendChild(el('div',{class:'metric-grid', style:'margin-top:14px;'}, cards));
    if(routeBased && specificity!=null){
      const idealBand = GOAL_IDEAL_GRADIENT[workoutGoalKey];
      body.appendChild(barRow('Terrain-Match', specificity, specificity>=70?'var(--tail)':specificity>=45?'var(--cross)':'var(--head)', specificity+'%'));
      body.appendChild(el('div', {style:'margin-top:-4px;'}, [infoButton(
        `Anteil der harten Trainingszeit auf einer für „${goalLabel(workoutGoalKey)}" passenden Steigung${idealBand?` (ideal ${idealBand.min}–${idealBand.max}%)`:''}. Kein Fitnessgewinn-Wert, nur ein Gelände-Abgleich.`
      )]));
    }
  }
  details.appendChild(body);
  card.appendChild(details);
  return card;
}
function appendZoneBars(card, breakdown, showQuality){
  if(breakdown.totalMin<=0.05){ card.appendChild(el('div',{class:'legend-note'},['Keine Zonendaten.'])); return; }
  breakdown.zones.filter(z=>z.minutes>0.05).forEach(z=>{
    const q = showQuality ? z.qualityPct : null;
    card.appendChild(barRow(z.name, z.pct, z.color, `${Math.round(z.minutes)} min · ${z.pct.toFixed(0)}%`, q));
  });
}

    appendZoneBars(card, actualWeekZones, true);
  } else {
    card.appendChild(el('div',{class:'legend-note'},['Noch keine Fahrten diese Woche.']));

function appendEvaluationResult(box, ev){
  if(ev.mismatchPct!=null && ev.mismatchPct>15){
    box.appendChild(calloutBox('warn', `${ev.isRoute?'Streckenlänge':'Dauer'} weicht ab`,
      `Die Aktivität ist ${ev.mismatchPct.toFixed(0)}% ${ev.isRoute?'länger/kürzer als die hochgeladene Route':'länger/kürzer als das geplante Workout'} – der Abgleich kann dadurch ungenau sein.`));
  }
  box.appendChild(calloutBox(ev.verdictClass, ev.verdict, ev.why));
  const rows = ev.perStep.filter(s=>s.kind==='interval');
  if(rows.length){
    box.appendChild(el('div',{style:'margin-top:10px;'},[dataTableNode(
      ['Abschnitt','Ziel','Ist','Erreicht','Ø/Max HF'],
      rows.map(s=>{
        // RPE-Schritte (HF-Modus VO2max/Anaerob/Sprint) hatten kein
        // Echtzeit-bpm-Ziel -- Ziel/Ist/Erreicht bleiben leer, gemessene
        // HF/Max-HF (letzte Spalte) wird trotzdem informativ gezeigt.
        let ziel, ist, erreicht;
        if(s.rpeLabel){
          ziel = s.rpeLabel; ist = '–'; erreicht = '–';
        } else if(s.targetHr!=null){
          ziel = `${s.targetHr} bpm`;
          ist = s.actualHr!=null ? `${s.actualHr} bpm` : '–';
          erreicht = s.achievedPct!=null ? el('span',{class:s.achievedPct>=0.95?'up':(s.achievedPct<0.85?'down':'')},[`${(s.achievedPct*100).toFixed(0)}%`]) : '–';
        } else {
          ziel = `${s.targetWatts} W`;
          ist = s.actualWatts!=null?`${s.actualWatts} W`:'–';
          erreicht = s.achievedPct!=null ? el('span',{class:s.achievedPct>=0.95?'up':(s.achievedPct<0.85?'down':'')},[`${(s.achievedPct*100).toFixed(0)}%`]) : '–';
        }
        return [s.name, ziel, ist, erreicht, s.actualHr!=null ? `${s.actualHr} / ${s.maxHr??'–'} bpm` : '–'];
      })
    )]));
  } else {
    box.appendChild(el('div',{class:'legend-note'},['Keine harten Ziel-Abschnitte in diesem Workout.']));
  }
  if(ev.classCompliance) box.appendChild(renderClassComplianceNoteEl(ev.classCompliance));
}
function appendLearningDetail(box, learning){
  const learnedGoals = LEARNABLE_GOALS.filter(g=>(learning.history||[]).some(e=>e.goal===g));
  if(!learnedGoals.length){
    box.appendChild(el('div',{class:'legend-note'},['Noch keine ausgewerteten Einheiten – Ziel-Vorgaben passen sich an, sobald du unten eine Fahrt auswertest.']));
    return;
  }
  const goalsBox = el('div', {class:'learn-goals'});
  learnedGoals.forEach(g=>{
    const entries = learning.history.filter(e=>e.goal===g).slice(-8);
    const trend = entries.length>=2 ? (entries[entries.length-1].compliance - entries[0].compliance) : 0;
    const factor = learning.factor[g];
    const barPct = Math.max(4, Math.min(100, (factor/1.15)*100));
    const row = el('div', {class:'learn-goal-row'});
    row.appendChild(el('span',{class:'learn-goal-label'},[GOALS[g].label]));
    row.appendChild(el('span',{class:'bar-track', style:'flex:1; max-width:150px;'},[
      el('span',{style:`display:block; height:100%; border-radius:var(--r-full); width:${barPct}%; background:${factor<0.97?'var(--cross)':factor>1.03?'var(--tail)':'var(--route)'};`},[])
    ]));
    row.appendChild(el('span',{class:'learn-goal-num'},[`${(factor*100).toFixed(0)}%`]));
    row.appendChild(el('span',{class:'learn-goal-trend' + (trend>0.02?' up':trend<-0.02?' down':''), title:`Trend über die letzten ${entries.length} Einheiten`},[trend>0.02?'↑':trend<-0.02?'↓':'→']));
    row.appendChild(el('span',{class:'learn-goal-n'},[`${entries.length} Einheit${entries.length===1?'':'en'}`]));
    goalsBox.appendChild(row);
  });
  box.appendChild(goalsBox);
  box.appendChild(el('div', {style:'margin:6px 0;'}, [infoButton('Anpassungsfaktor je Ziel aus den letzten bis zu 8 ausgewerteten Einheiten – über 100% heißt du hast im Schnitt mehr geleistet als vorgegeben (Vorgabe wird angehoben), unter 100% weniger (Vorgabe wird abgesenkt).')]));
  const recent = learning.history.slice(-8).slice().reverse();
  const details = el('details', {style:'margin-top:2px;'});
  details.appendChild(el('summary',{style:'cursor:pointer; font-size:11.5px; color:var(--chalk-dim);'},[`Letzte ${recent.length} ausgewertete Einheit${recent.length===1?'':'en'}`]));
  details.appendChild(el('div',{style:'margin-top:8px;'},[dataTableNode(['Datum','Ziel','Erreicht'], recent.map(e=>[
    new Date(e.date).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'}),
    GOALS[e.goal]?GOALS[e.goal].label:e.goal,
    `${(e.compliance*100).toFixed(0)}%`
  ]))]));

}
function renderTrainerAblaufCard(tp, ctx){
  const { workout, hasWorkout, rp, learning, learnGoalKey, analysisRides } = ctx;
  const card = el('div',{class:'card'});
  const details = el('details', {class:'tt-collapse'});
  details.appendChild(el('summary',{},[el('h2',{},['Ablauf & Analyse'])]));
  const body = el('div', {style:'margin-top:10px;'});
  if(hasWorkout){
    const stepsBox = el('div', {class:'workout-steps'});
    // HF-Zweig: Anzeigegröße wechselt zu bpm/lthrZoneFor über die zentralen
    // stepZoneFor()/stepTargetValue()-Helper -- s.pct bleibt für alle Klassen
    // unverändert der einzige Durchlaufwert. Für RPE-getaggte Schritte
    // (VO2max/Anaerob/Sprint im HF-Modus, s.rpeLabel gesetzt) wird die
    // RPE-Stufe statt einer bpm-Zahl/% gezeigt -- s.pct ist dort nur noch
    // Backing-Wert für die Zonenfarbe links, kein angezeigtes Ziel mehr.
    // Läuft die kumulierte Position (km bei einer Strecken-Vorschau, sonst
    // verstrichene Minuten) parallel zur Schrittliste mit, damit jede Zeile
    // zeigt, wo im Workout man sich zu Beginn dieses Schritts befindet --
    // nicht nur, wie lang der Schritt selbst ist.
    let runningDistM = 0, runningMin = 0;
    workout.steps.forEach(s=>{
      const z = stepZoneFor(s.pct, rp);
      const amount = s.distanceM!=null ? `${(s.distanceM/1000).toFixed(2)} km` : (s.minutes<1 ? `${Math.round(s.minutes*60)} s` : `${s.minutes} min`);
      const showGrad = s.gradient!=null && s.kind!=='warmup' && s.kind!=='activation' && s.kind!=='cooldown';
      const gradText = showGrad ? ` · Ø ${s.gradient>0?'+':''}${s.gradient.toFixed(1)}%` : '';
      const targetText = s.rpeLabel ? s.rpeLabel
        : `${Math.round(stepTargetValue(s.pct, rp))} ${rp.usingHr ? 'bpm' : 'W'} · ${Math.round(s.pct*100)}%`;
      // s.name trägt für Intervall-/Verbindungsschritte bereits "(X km[, Y%])"
      // (siehe intervalStepName() / die "Verbindung (…)"-Labels) -- unverändert
      // gelassen, weil Export (.FIT/.ZWO) und Auswertungstabelle denselben
      // Namen weiterverwenden. Hier nur für die Anzeige gestrippt, da die
      // Zahl gleich danach in step-meta nochmal steht (die eigentliche
      // "zu viel Text"-Redundanz).
      const displayName = s.name.replace(/ \([\d.]+\s*km(?:,\s*-?[\d.]+%)?\)$/, '');
      const posLabel = workout.routeBased ? `${(runningDistM/1000).toFixed(1)} km` : `${Math.round(runningMin)} min`;
      const row = el('div', {class:'step', style:`border-left-color:${z.color};`});
      row.appendChild(el('span', {class:'step-pos'}, [posLabel]));
      const stepBody = el('div', {class:'step-body'});
      const nameWrap = el('span', {style:'display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap;'});
      nameWrap.appendChild(el('span',{class:'step-name'},[ displayName + (s.note?' – '+s.note:'') ]));
      // Eignung wird bewusst hier neu berechnet statt bei der Platzierung
      // (placeIntervalsOnRoute()) mitgeschrieben: s.gradient kann sich danach
      // noch ändern (extendCompressedIntervalsBackward() mischt Steigung
      // beim rückwärtigen Verlängern), und die Anzeige soll immer zur
      // tatsächlich gezeigten Steigung passen, nicht zu einem veralteten Wert.
      if(s.kind==='interval' && workout.routeBased && s.gradient!=null && !SUITABILITY_EXEMPT_CLASSES.includes(workout.classKey)){
        const band = (TRAINING_CONFIG.constraints.byClass[workout.classKey] || {}).gradient;
        const tier = band ? gradientSuitability(s.gradient, band) : null;
        if(tier==='ideal') nameWrap.appendChild(el('span',{class:'tag tail mini'},['Optimal']));
        else if(tier==='acceptable') nameWrap.appendChild(el('span',{class:'tag cross mini'},['Akzeptabel']));
      }
      stepBody.appendChild(nameWrap);
      stepBody.appendChild(el('span',{class:'step-meta'},[ `${amount} · ${targetText}${gradText}` ]));
      row.appendChild(stepBody);
      stepsBox.appendChild(row);
      runningDistM += (s.distanceM||0);
      runningMin += (s.minutes||0);
    });
    body.appendChild(stepsBox);
  } else {
    body.appendChild(el('div',{class:'legend-note'},['Wähle eine Workout-Art (und optional eine Strecke), um eine Vorschau zu erzeugen.']));
  }

  const learnSection = el('div', {style:'margin-top:18px; padding-top:14px; border-top:1px solid var(--line);'});
  learnSection.appendChild(el('h3',{class:'tsettings-group-title'},['Lern-Anpassung aus deinen Auswertungen']));
  const learnBox = el('div', {});
  appendLearningDetail(learnBox, learning);
  learnSection.appendChild(learnBox);
  body.appendChild(learnSection);

  const evalH3 = el('h3',{class:'tsettings-group-title', style:'display:flex; align-items:center; gap:var(--space-3);'},['Workout auswerten']);
  const evalSection = el('div', {style:'margin-top:18px; padding-top:14px; border-top:1px solid var(--line);'}, [evalH3]);
  if(!hasWorkout){
    evalSection.appendChild(el('div',{class:'legend-note'},['Wähle zuerst eine Workout-Art, um eine Vorschau zum Auswerten zu haben.']));
  } else {
    evalH3.appendChild(infoButton(rp.usingHr
      ? 'Vergleiche eine absolvierte Aktivität mit dieser Vorschau – Ist- gegen Soll-Puls je Abschnitt (Ø-Puls pro Intervall).'
      : 'Vergleiche eine absolvierte Aktivität mit dieser Vorschau – Ist- gegen Soll-Leistung je Abschnitt (Ø-Leistung pro Intervall).'));
    const row = el('div', {style:'display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0;'});
    const select = el('select', {style:'width:auto; min-width:220px; margin-bottom:0;'});
    select.appendChild(el('option',{value:''},['Aktivität wählen…']));
    analysisRides.forEach(r=>{
      const opt = el('option', {value:String(r.id)}, [`${r.date.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})} – ${r.name||'Fahrt'} (${r.movingMin} min)`]);
      if(tp.evalActivityId===String(r.id)) opt.selected = true;
      select.appendChild(opt);
    });
    select.addEventListener('change', e=>{ tp.evalActivityId = e.target.value || null; });
    row.appendChild(select);
    row.appendChild(el('button', {class:'btn', disabled: tp.evalLoading?'disabled':null, onclick: ()=>runTrainerEvaluation(workout, rp, learnGoalKey)}, [tp.evalLoading?'Lädt…':'Auswerten']));
    evalSection.appendChild(row);
    const resultBox = el('div', {});
    if(tp.evalError) resultBox.appendChild(calloutBox('warn', tp.evalError, ''));
    else if(tp.evalResult){
      appendEvaluationResult(resultBox, tp.evalResult);
      // Manual confirmation flow for the 'test' class -- VeloCast has no
      // automatic link between a generated test and a later-uploaded Strava
      // ride (FIT/ZWO export only, no live tracking), so the rider confirms
      // themselves which evaluated ride actually was the test. Guarded on
      // testTargetWatts!=null so this never shows for the forceEasy
      // "Entlastungsfahrt statt Test" override or the "Test nicht möglich"
      // empty-state, neither of which is a real test to confirm.
      if(workout.classKey === 'test' && workout.testTargetWatts != null){
        const achieved = tp.evalTestAchievedWatts;
        const target = workout.testTargetWatts;
        if(achieved == null){
          resultBox.appendChild(calloutBox('warn', 'Kein auswertbarer Testabschnitt gefunden',
            `Diese Fahrt enthält keinen ${fmtDurLabel(workout.testDurationSec)}-Leistungsabschnitt, der ausgewertet werden kann.`));
        } else {
          const passed = achieved >= target;
          resultBox.appendChild(calloutBox(passed?'good':'warn', passed?'Test bestanden':'Test nicht bestanden',
            `Beste ${fmtDurLabel(workout.testDurationSec)}-Leistung in dieser Fahrt: ${Math.round(achieved)} W (Ziel: ${target} W).`));
          resultBox.appendChild(el('button', {class:'btn', style:'margin-top:8px;', onclick: ()=>{
            const ride = state.profilPage.results.find(r=>String(r.id)===String(tp.evalActivityId));
            saveConfirmedTest({
              rideId: String(tp.evalActivityId), durationSec: workout.testDurationSec,
              rideDateIso: toIsoDate(ride ? ride.date : new Date()),
              rideName: (ride && ride.name) || 'Fahrt',
              targetWatts: target, achievedWatts: Math.round(achieved), passed,
              confirmedAtIso: new Date().toISOString()
            });
            render();
          }}, ['Das war der Test']));
        }
      }
    }
    evalSection.appendChild(resultBox);
  }
  body.appendChild(evalSection);
  details.appendChild(body);
  card.appendChild(details);
  return card;
}

// ---------- Trainer: page ----------
function renderTrainerPage(){
  const frag = document.createDocumentFragment();
  if(!state.connected){
    frag.appendChild(renderStravaConnectCard('Trainer', 'Verbinde dich mit Strava, um Trainingsziele, Workout-Vorschläge und Export nach .FIT/.ZWO zu nutzen.'));
    return frag;
  }

  const pp = state.profilPage;
  if(pp.loading){
    const card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, ['Trainer']));
    card.appendChild(el('div', {class:'loading'}, [(pp.progress&&pp.progress.label)||'Lade Trainingsdaten…']));
    frag.appendChild(card);
    return frag;
  }
  if(!pp.loaded){
    const card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, ['Trainer']));
    card.appendChild(el('div', {class:'muted', style:'margin-bottom:14px;'}, [
      state.equipmentMode==='hr'
        ? 'Der Trainer baut auf deinem Leistungsprofil auf (HF-Schwelle, Zonen, Trainingslast). Lade zuerst deine Trainingsdaten — das ist derselbe Ladevorgang wie im Profil-Tab.'
        : 'Der Trainer baut auf deinem Leistungsprofil auf (FTP, Zonen, Trainingslast). Lade zuerst deine Trainingsdaten — das ist derselbe Ladevorgang wie im Profil-Tab.'
    ]));
    if(pp.error) card.appendChild(el('div',{class:'error', style:'margin-bottom:14px;'},[pp.error]));
    card.appendChild(el('button', {class:'btn', style:'width:100%;', onclick: ()=>loadProfilData(state.accessToken)}, ['Trainingsdaten laden']));
    frag.appendChild(card);
    return frag;
  }
  const rp = trainerRiderContext(pp);
  // HF-Zweig: die Gate-Bedingung prüft rp.lthr statt rp.ftp und verweist auf
  // Einstellungen statt Profil, da LTHR (Auto-Schätzung + manueller Override)
  // dort verwaltet wird, nicht im Profil-Tab. rp kann null sein, bevor
  // pp.riderProfile existiert -- in dem Fall auf state.equipmentMode zurückfallen,
  // um trotzdem den richtigen Leerzustand zu zeigen.
  const usingHr = rp ? rp.usingHr : state.equipmentMode === 'hr';
  if(!rp || !(usingHr ? rp.lthr : rp.ftp)){
    const card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, ['Trainer']));
    if(usingHr){
      card.appendChild(el('div', {class:'empty-state'}, ['Kein HF-Schwellenwert (LTHR) verfügbar – hinterlege in den Einstellungen einen manuellen LTHR-Wert oder lass ihn automatisch aus deinen Fahrten schätzen.']));
      card.appendChild(el('button', {class:'btn secondary', style:'margin-top:10px;', onclick: ()=>{ state.activePage='einstellungen'; render(); }}, ['Zu den Einstellungen']));
    } else {
      card.appendChild(el('div', {class:'empty-state'}, ['Kein FTP-Wert verfügbar – im Profil-Tab braucht es entweder ein hinterlegtes Strava-FTP oder auswertbare Fahrten mit Leistungsdaten.']));
      card.appendChild(el('button', {class:'btn secondary', style:'margin-top:10px;', onclick: ()=>{ state.activePage='profil'; render(); }}, ['Zum Profil-Tab']));
    }
    frag.appendChild(card);
    return frag;
  }

  const tp = state.trainerPage;
  const W = pp.weak;
  const chosen = Object.keys(GOALS).includes(tp.goal) ? tp.goal : 'auto';
  const suggestedGoal = (W && W.items && W.items.length) ? W.items[0].goal : 'ftp';
  const effectiveGoal = chosen==='auto' ? suggestedGoal : chosen;
  const learning = computeLearningFactors();
  const todayIso = todayIsoKey();
  const todayRoute = getTrainerRouteForDate(todayIso);
  const routeBased = !!(todayRoute && todayRoute.route);

  const trainingState = computeTrainingDecisionState(pp.results, W, chosen, todayIso, TRAINING_CONFIG);
  const dashboardOpportunity = computeTrainingOpportunity(trainingState, routeBased?todayRoute.route:null, pp.results, todayIso, TRAINING_CONFIG, rp, {});
  const recommendedClassKey = dashboardOpportunity ? dashboardOpportunity.classKey : null;
  // 'test' never reaches recommendedClassKey (pickIntendedTrainingClass()
  // only ranks priorityEligible classes, and 'test' is deliberately not one),
  // so this is purely about a rider MANUALLY choosing the Test chip below.
  const testSignal = computeTestDueSignal(pp, trainingState, todayIso);

  if(tp.selectedClassKey && !trainingClass(tp.selectedClassKey)) tp.selectedClassKey = null;
  const selectedClassObj = tp.selectedClassKey ? trainingClass(tp.selectedClassKey) : null;
  // A 'test' selection always uses the time-based path, regardless of
  // whether a route happens to be attached today -- a deliberate test target
  // has no business being warped onto arbitrary terrain via
  // generateWorkoutForOpportunity()/placeIntervalsOnRoute(). Every
  // routeBased-branching call below reads this instead of the raw
  // `routeBased`, so the fix applies consistently start to finish (workout
  // generation, metrics, zone breakdown, chart, route card vs. duration
  // picker, .FIT/.ZWO export options).
  const effectiveRouteBased = routeBased && tp.selectedClassKey !== 'test';
  const opportunity = tp.selectedClassKey
    ? computeOpportunityForClass(trainingState, effectiveRouteBased?todayRoute.route:null, tp.selectedClassKey, TRAINING_CONFIG, rp, {})
    : null;

  let workout = null, workoutGoalKey = null;
  if(opportunity){
    // Without this branch, opportunity.classKey==='test' would fall through
    // to generateWorkoutForOpportunity()/generateTimeBasedWorkout(), whose
    // TRAINING_CLASS_TO_GENERATOR_GOAL['test'] lookup is undefined and would
    // silently fall back to 'endurance' -- a generic endurance ride instead
    // of an actual test, with no error to signal the mismatch.
    if(opportunity.classKey === 'test') workout = generateTestWorkout(tp.selectedTestDurationSec || TEST_DURATIONS_SEC[0], rp);
    else if(effectiveRouteBased) workout = generateWorkoutForOpportunity(opportunity, rp, todayRoute.route, learning, TRAINING_CONFIG, {});
    else workout = generateTimeBasedWorkout(opportunity.classKey, rp, learning);
    // `|| workout.classKey` fallback only ever fires for 'test' (every other
    // TRAINING_CLASSES key has a TRAINING_CLASS_TO_GENERATOR_GOAL entry) --
    // lets goalLabel()'s trainingClass() fallback resolve it to "Test" for
    // the .ZWO description/export instead of the literal string "null".
    workoutGoalKey = workout && workout.classKey ? (TRAINING_CLASS_TO_GENERATOR_GOAL[workout.classKey]||workout.classKey) : null;
  }
  const workoutExists = !!workout;
  const hasWorkout = !!(workout && workout.steps && workout.steps.length);
  tp.lastWorkout = hasWorkout ? { steps:workout.steps, rp, routeBased: effectiveRouteBased, classKey: workout.classKey } : null;
  const metrics = hasWorkout ? (effectiveRouteBased ? estimateRouteWorkoutMetrics(workout.steps, rp) : workoutMetrics(workout.steps, rp)) : null;
  const zoneBreakdown = hasWorkout ? workoutZoneBreakdown(workout.steps, effectiveRouteBased, rp) : null;
  const specificity = (hasWorkout && effectiveRouteBased) ? computeSpecificityScore(workout, workoutGoalKey) : null;
  const warnRationale = workoutExists ? (workout.rationale||[]).filter(r=>r.type==='warn'||r.type==='danger') : [];
  const goodRationale = workoutExists ? (workout.rationale||[]).filter(r=>r.type==='good') : [];
  const actualWeekZones = actualWeekZoneBreakdown(pp.results);
  const learnGoalKey = LEARNABLE_GOALS.includes(workoutGoalKey) ? workoutGoalKey : effectiveGoal;
  const analysisRides = pp.results.slice().sort((a,b)=>b.date-a.date).slice(0,25);

  frag.appendChild(renderTrainerSummaryCards(rp.usingHr ? rp.blendedLoad : pp.trainingLoad, GOALS[chosen]?GOALS[chosen].label:chosen, chosen==='auto'));
  frag.appendChild(renderTrainerContextCards(rp));
  frag.appendChild(renderTrainerGoalBar(chosen, rp));
  frag.appendChild(renderTrainerDecisionDashboard(trainingState, W, dashboardOpportunity, rp.usingHr && !pp.results.length, testSignal));
  frag.appendChild(renderTrainerClassPicker(tp, trainingState, recommendedClassKey, testSignal));
  if(selectedClassObj){
    if(tp.selectedClassKey === 'test') frag.appendChild(renderTrainerTestDurationPicker(tp, testSignal));
    else {
      const topRoutesCard = renderTopRoutesCard(tp, tp.selectedClassKey);
      if(topRoutesCard) frag.appendChild(topRoutesCard);
      frag.appendChild(renderTrainerRouteCard(tp, selectedClassObj, todayRoute));
    }
    frag.appendChild(renderTrainerWorkoutPreview(tp, { workout, workoutExists, hasWorkout, routeBased: effectiveRouteBased, rp, metrics, zoneBreakdown, specificity, workoutGoalKey, warnRationale, goodRationale }));
  }
  frag.appendChild(renderTrainerZonesCard(hasWorkout, zoneBreakdown, effectiveRouteBased, actualWeekZones, rp));
  frag.appendChild(renderTrainerAblaufCard(tp, { workout, hasWorkout, rp, learning, learnGoalKey, analysisRides }));
  frag.appendChild(el('div',{class:'legend-note'},[`Trainingsempfehlungen sind aus deinen Daten abgeleitete Orientierung, kein Ersatz für individuelle Trainerbetreuung oder ärztliche Abklärung. Achte auf Signale deines Körpers, die in ${rp.usingHr?'Pulswerten':'Wattwerten'} nicht auftauchen.`]));
  return frag;
}

// Persists one edited value both into the live TRAINING_CONFIG (so it takes
// effect immediately, same object every call site already reads) and into
// the override diff saved under TRAINER_SETTINGS_KEY (so only what actually
// changed survives a reload, not a full copy of TRAINING_CONFIG).
function setConfigOverride(path, value){
  const overrides = loadConfigOverrides();
  const parts = path.split('.');
  let o = overrides;
  for(let i=0;i<parts.length-1;i++){
    if(!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = value;
  saveConfigOverrides(overrides);
}

// Flashes the "Gespeichert ✓" note directly (no full render()) so an edit
// doesn't scroll-jump or collapse the <details> the rider is currently in.
let einstellungenSavedTimer = null;
function flashSettingsSaved(){
  const note = document.getElementById('settingsSavedNote');
  if(!note) return;
  note.style.opacity = '1';
  clearTimeout(einstellungenSavedTimer);
  einstellungenSavedTimer = setTimeout(()=>{ note.style.opacity = '0'; }, 1500);
}

// Shared by settingsFieldRow() and settingsFieldChip() -- one field's help
// text (what it does + directional effect + example + current default),
// which now lives inside an infoButton() popover instead of an always-visible
// paragraph (see Part A).
function fieldHelpText(path, def){
  const dflt = getByPath(TRAINING_CONFIG_DEFAULTS, path);
  const dfltText = def.bool ? (dflt ? 'an' : 'aus') : (dflt + (def.unit ? ' ' + def.unit : ''));
  let effectText = '';
  if(def.inert){
    // no directional effect to show -- field isn't wired into any logic yet
  } else if(def.bool){
    effectText = ` Aktiv: ${def.on} Inaktiv: ${def.off}`;
  } else {
    effectText = ` Höher: ${def.up} Niedriger: ${def.down}`;
  }
  return `${def.help}${effectText} Beispiel: ${def.example} Standard: ${dfltText}.`;
}

function settingsFieldRow(path, def){
  const val = getByPath(TRAINING_CONFIG, path);
  const id = 'sf-' + path.replace(/\./g, '-');

  let inputEl;
  if(def.bool){
    const cb = el('input', {type:'checkbox', id, onchange:(e)=>{
      setByPath(TRAINING_CONFIG, path, e.target.checked);
      setConfigOverride(path, e.target.checked);
      flashSettingsSaved();
    }});
    if(val) cb.checked = true;
    inputEl = el('label', {class:'tsettings-switch'}, [cb, el('span', {class:'tsettings-slider'})]);
  } else {
    const numInput = el('input', {type:'number', id, step:def.step||1, value:val, onchange:(e)=>{
      let value = parseFloat(e.target.value);
      if(!isFinite(value)){ value = getByPath(TRAINING_CONFIG_DEFAULTS, path); e.target.value = value; }
      setByPath(TRAINING_CONFIG, path, value);
      setConfigOverride(path, value);
      flashSettingsSaved();
    }});
    const wrapChildren = [numInput];
    if(def.unit) wrapChildren.push(el('span', {class:'tsettings-unit'}, [def.unit]));
    inputEl = el('span', {class:'tsettings-input-wrap'}, wrapChildren);
  }

  const label = el('label', {for:id, style:'display:flex; align-items:center; gap:var(--space-2);'}, [def.label, infoButton(fieldHelpText(path, def))]);
  const main = el('div', {class:'tsettings-row-main'}, [label, inputEl]);
  return el('div', {class:'tsettings-row'}, [main]);
}

// Chip form of settingsFieldRow() used for the per-class constraint fields
// (see buildClassSettingsSection()): a compact read-only .stat-chip by
// default, expanding in place into the same real <input>/toggle
// settingsFieldRow() uses once tapped -- same setConfigOverride/setByPath/
// flashSettingsSaved wiring, only the presentation differs. Toggling chip vs.
// input is a direct DOM swap (no render()), same reasoning as infoButton().
function settingsFieldChip(path, def){
  const val = getByPath(TRAINING_CONFIG, path);
  const id = 'sf-' + path.replace(/\./g, '-');
  const chipText = v => {
    if(def.bool) return v ? 'an' : 'aus';
    if(/(^|\.)gradient\./.test(path) && (v === -99 || v === 99)) return 'Unbegrenzt';
    return v + (def.unit ? ' ' + def.unit : '');
  };

  const chipV = el('div', {class:'v'}, [chipText(val)]);
  const chip = el('button', {type:'button', class:'stat-chip neutral', title:'Bearbeiten'}, [chipV, el('div', {class:'l'}, [def.label])]);

  let inputEl, currentInput;
  const collapse = ()=>{
    chipV.textContent = chipText(def.bool ? currentInput.checked : parseFloat(currentInput.value));
    inputWrap.style.display = 'none';
    chip.style.display = '';
  };
  if(def.bool){
    currentInput = el('input', {type:'checkbox', id, onchange:(e)=>{
      setByPath(TRAINING_CONFIG, path, e.target.checked);
      setConfigOverride(path, e.target.checked);
      flashSettingsSaved();
      collapse();
    }});
    if(val) currentInput.checked = true;
    inputEl = el('label', {class:'tsettings-switch'}, [currentInput, el('span', {class:'tsettings-slider'})]);
  } else {
    currentInput = el('input', {type:'number', id, step:def.step||1, value:val, style:'width:76px; margin-bottom:0;', onchange:(e)=>{
      let value = parseFloat(e.target.value);
      if(!isFinite(value)){ value = getByPath(TRAINING_CONFIG_DEFAULTS, path); e.target.value = value; }
      setByPath(TRAINING_CONFIG, path, value);
      setConfigOverride(path, value);
      flashSettingsSaved();
      collapse();
    }});
    const wrapChildren = [currentInput];
    if(def.unit) wrapChildren.push(el('span', {class:'tsettings-unit'}, [def.unit]));
    inputEl = el('span', {class:'tsettings-input-wrap'}, wrapChildren);
  }
  currentInput.addEventListener('blur', collapse);

  const inputWrap = el('span', {class:'tsettings-chip-input', style:'display:none;'}, [inputEl]);
  chip.addEventListener('click', ()=>{
    chip.style.display = 'none';
    inputWrap.style.display = 'inline-flex';
    currentInput.focus();
  });

  return el('span', {class:'tsettings-chip-item'}, [chip, inputWrap, infoButton(fieldHelpText(path, def))]);
}

function buildClassSettingsSection(c){
  // 'test' deliberately has no constraints.byClass/targetRangePct entry (its
  // target comes from the rider's own measured best + a fixed TEST_MARGIN_PCT,
  // not from a tunable %FTP band or route-placement geometry) -- rendering
  // the normal chip grid for it would read every field via getByPath() as
  // `undefined` (silently returned, not a crash, since constraints.byClass.test
  // itself is undefined) and show "undefined °" text throughout. Short-circuit
  // with an explanatory note instead.
  if(c.key === 'test'){
    const body = el('div', {style:'margin-top:10px;'}, [
      el('div', {class:'legend-note'}, ['Der Leistungstest hat keine Strecken-/Intervall-Einstellungen – das Testziel wird direkt aus deiner aktuellen Bestleistung je Dauer berechnet (siehe Trainer-Tab).'])
    ]);
    return el('details', {class:'tt-collapse tsettings-class'}, [
      el('summary', {}, [el('h3', {class:'tsettings-group-title', style:'display:inline; margin:0;'}, [c.label])]),
      body
    ]);
  }
  const basePath = `constraints.byClass.${c.key}`;
  const exempt = SUITABILITY_EXEMPT_CLASSES.includes(c.key);
  const body = el('div', {style:'margin-top:10px;'});
  if(exempt){
    body.appendChild(el('div', {style:'margin-bottom:10px; display:flex; align-items:center; gap:var(--space-2);'}, [
      el('span', {class:'legend-note', style:'margin:0;'}, ['Terrainfolgende Klasse']),
      infoButton('Diese Klasse ist terrainfolgend über die ganze Strecke geplant (kein Intervall-Placement) – die Steigungsfelder unten fließen aktuell nicht in ihre Eignungsprüfung ein, bleiben aber editierbar für spätere Nutzung.')
    ]));
  }
  const fieldByKey = {};
  CLASS_SETTINGS_FIELDS.forEach(def => fieldByKey[def.key] = def);
  CLASS_SETTINGS_GROUPS.forEach(group => {
    const chips = el('div', {class:'stat-chips'}, group.keys.map(key => settingsFieldChip(`${basePath}.${key}`, fieldByKey[key])));
    body.appendChild(el('div', {class:'tsettings-group'}, [
      el('h3', {class:'tsettings-group-title'}, [group.title]),
      chips
    ]));
  });
  // Tempo/Schwelle/VO2max/Anaerob each got their own weekly-quality-minutes
  // table (used to be one shared value for all four) -- expose it here as a
  // 5th chip group, same pattern as above. Other classes have no entry in
  // WEEKLY_QUALITY_TABLE_BY_CLASS and get nothing extra.
  const budgetTable = WEEKLY_QUALITY_TABLE_BY_CLASS[c.key];
  if(budgetTable){
    const budgetChips = el('div', {class:'stat-chips'}, WEEKLY_QUALITY_TIER_FIELDS.map(def => settingsFieldChip(`${budgetTable}.${def.key}`, def)));
    body.appendChild(el('div', {class:'tsettings-group'}, [
      el('h3', {class:'tsettings-group-title'}, ['Wochenziel nach Priorität']),
      budgetChips
    ]));
  }
  body.appendChild(el('button', {class:'btn secondary', style:'margin-top:12px;', onclick: ()=>{ resetConfigSlice(basePath); if(budgetTable) resetConfigSlice(budgetTable); render(); }}, ['Diese Klasse auf Standard zurücksetzen']));
  const summary = el('summary', {}, [el('h3', {class:'tsettings-group-title', style:'display:inline; margin:0;'}, [c.label])]);
  return el('details', {class:'tt-collapse tsettings-class'}, [summary, body]);
}

// Resets one config subtree (a whole class's constraints, the common block,
// or routeGeneration) back to TRAINING_CONFIG_DEFAULTS and removes it from
// the persisted override diff -- same basePath granularity the per-section
// "auf Standard zurücksetzen" buttons operate on.
function resetConfigSlice(basePath){
  const defaultSlice = JSON.parse(JSON.stringify(getByPath(TRAINING_CONFIG_DEFAULTS, basePath)));
  setByPath(TRAINING_CONFIG, basePath, defaultSlice);
  const overrides = loadConfigOverrides();
  const parts = basePath.split('.');
  let o = overrides;
  for(let i=0;i<parts.length-1;i++){
    if(!o[parts[i]] || typeof o[parts[i]] !== 'object') return;
    o = o[parts[i]];
  }
  delete o[parts[parts.length-1]];
  saveConfigOverrides(overrides);
}

// Manual LTHR override row — reuses TRAINING_CONFIG.rider.lthrOverride via
// the exact same setConfigOverride()/getByPath()/setByPath() persistence
// settingsFieldRow() itself uses, just with bespoke rendering: unlike every
// other numeric field, `null` here is a meaningful, common, *intended* state
// ("keep using the auto-estimate") rather than a parse failure to fall back
// from, so it can't reuse settingsFieldRow()'s plain number-input branch
// as-is.
function buildLthrOverrideRow(){
  const path = 'rider.lthrOverride';
  const val = getByPath(TRAINING_CONFIG, path);
  const id = 'sf-' + path.replace(/\./g, '-');
  const hp = state.trainerPage.hrProfile;

  const numInput = el('input', {type:'number', id, step:1, min:80, max:220, value: val==null ? '' : val, placeholder:'automatisch geschätzt', onchange:(e)=>{
    const raw = e.target.value.trim();
    let value = raw==='' ? null : parseFloat(raw);
    if(value != null && !isFinite(value)){ value = getByPath(TRAINING_CONFIG_DEFAULTS, path); e.target.value = value==null ? '' : value; }
    // The input's min/max=80/220 attrs are advisory only -- they don't clamp
    // a value read via e.target.value in an onchange handler, so a stray
    // entry like 500 would otherwise flow straight into rp.lthr unchecked.
    // Clamp into the same sanity range the auto-estimate is held to
    // (estimateLthrFromHrCurve() above).
    if(value != null){ value = Math.min(220, Math.max(80, value)); e.target.value = value; }
    setByPath(TRAINING_CONFIG, path, value);
    setConfigOverride(path, value);
    flashSettingsSaved();
  }});
  const inputEl = el('span', {class:'tsettings-input-wrap'}, [numInput, el('span', {class:'tsettings-unit'}, ['bpm'])]);

  const helpText = 'Manuell hinterlegter HF-Schwellenwert (LTHR). Leer lassen, um die automatische Schätzung aus deinen Fahrten zu nutzen. Bestimmt bei aktiviertem "Nur Herzfrequenzgurt"-Modus die Trainingszonen und Workout-Ziele im Trainer-Tab.';
  const label = el('label', {for:id, style:'display:flex; align-items:center; gap:var(--space-2);'}, ['Manuelle LTHR', infoButton(helpText)]);
  const main = el('div', {class:'tsettings-row-main'}, [label, inputEl]);

  // Override checked first now: TRAINING_CONFIG.rider.lthrOverride always
  // wins in trainerRiderContext(), so once a manual value is active that's
  // the primary status. A stale error from an earlier failed auto-estimate
  // is demoted to a small secondary line underneath instead of being shown
  // as *the* status -- otherwise it keeps looking like the manual entry
  // itself failed, even though it saved fine and is in effect.
  let statusText, statusSubText = null;
  if(val != null){
    statusText = `Manueller Wert aktiv (${val} bpm) – überschreibt die automatische Schätzung.`;
    if(hp.error) statusSubText = `Letzte automatische Schätzung fehlgeschlagen: ${hp.error}`;
  }
  else if(hp.error) statusText = hp.error;
  else if(hp.loading) statusText = 'Schätzung läuft…';
  else if(hp.estimate) statusText = `Automatisch geschätzt: ${hp.estimate} bpm (${hp.source || ''})`;
  else statusText = 'Noch keine automatische Schätzung vorhanden.';

  // Plain click reuses the cache (no forceRefresh) so it can't burn through
  // Strava's rate limit on a couple of accidental double-clicks. forceRefresh
  // only kicks in once an estimate already exists and the rider clicks again
  // -- at that point "get me a fresh one" is the only plausible intent left,
  // since a from-scratch run already reads the cache for free.
  const hasEstimate = !!hp.estimate;
  const estimateBtn = el('button', {type:'button', class:'btn secondary', style:'margin-top:8px;',
    disabled: (hp.loading || !state.accessToken) ? 'disabled' : null,
    onclick: ()=>{ loadHrLthrEstimate(state.accessToken, {forceRefresh: hasEstimate}); }
  }, [hp.loading ? 'Schätzung läuft…' : (hasEstimate ? 'Neu berechnen' : 'Automatisch schätzen')]);

  const statusChildren = [el('div', {class:'muted', style:'font-size:12px; margin-top:4px;'}, [statusText])];
  if(statusSubText) statusChildren.push(el('div', {class:'muted', style:'font-size:11px; margin-top:2px;'}, [statusSubText]));

  return el('div', {class:'tsettings-row'}, [
    main,
    ...statusChildren,
    estimateBtn
  ]);
}

// New card, deliberately named differently from Profil's "Ausrüstung" card
// (Verschleißteile) to avoid a naming collision — this one switches whether
// the Trainer tab is powered by a power meter (FTP) or a heart-rate strap
// alone (LTHR). See plan §3.
function buildEquipmentModeCard(){
  const card = el('div', {class:'card'});
  card.appendChild(el('h2', {style:'display:flex; align-items:center; gap:8px;'}, [
    'Leistungsmesser oder Herzfrequenz',
    infoButton('Bestimmt, ob Trainingszonen, Workout-Ziele und Trainingsbelastung aus Watt (FTP) oder aus Herzfrequenz (LTHR) berechnet werden.')
  ]));

  const usingHr = state.equipmentMode === 'hr';
  const toggleId = 'sf-equipmentMode';
  const cb = el('input', {type:'checkbox', id:toggleId, onchange:(e)=>{
    const next = e.target.checked ? 'hr' : 'power';
    state.equipmentMode = next;
    saveSettings();
    // Lazy-trigger, per plan: only on the first switch to 'hr' when there's
    // neither a manual override nor an already-loaded estimate — never
    // blocks this render, loadHrLthrEstimate() re-renders itself when done.
    if(next==='hr' && !TRAINING_CONFIG.rider.lthrOverride && !state.trainerPage.hrProfile.loaded && !state.trainerPage.hrProfile.loading && state.accessToken){
      loadHrLthrEstimate(state.accessToken);
    }
    // Same lazy-trigger idea for the blended training-load model (plan §7) --
    // independent of any lthrOverride check since this ingests raw activity
    // rows, not a derived LTHR number; buildBlendedTrainingLoad() recomputes
    // from those rows fresh on every trainerRiderContext() call regardless of
    // what ftp/lthr currently resolve to.
    if(next==='hr' && !state.trainerPage.blendedLoad.loaded && !state.trainerPage.blendedLoad.loading && state.accessToken){
      loadBlendedTrainingLoad(state.accessToken);
    }
    // render() replaces the DOM subtree (incl. #settingsSavedNote), so
    // flashSettingsSaved() must run AFTER it — calling it first grabs the
    // about-to-be-detached node and its setTimeout writes to nothing.
    render();
    flashSettingsSaved();
  }});
  if(usingHr) cb.checked = true;
  const toggleInput = el('label', {class:'tsettings-switch'}, [cb, el('span', {class:'tsettings-slider'})]);
  const toggleLabel = el('label', {for:toggleId}, [usingHr ? 'Nur Herzfrequenzgurt' : 'Leistungsmesser']);
  card.appendChild(el('div', {class:'tsettings-row'}, [
    el('div', {class:'tsettings-row-main'}, [toggleLabel, toggleInput])
  ]));

  card.appendChild(buildLthrOverrideRow());
  card.appendChild(el('button', {class:'btn secondary', style:'margin-top:8px;', onclick: ()=>{ resetConfigSlice('rider'); render(); }}, ['Zurücksetzen']));

  return card;
}

// Rein informativ, keine editierbaren Werte -- das Tempo-Modell wird
// automatisch aus der Fahrhistorie berechnet (siehe computeSpeedModel()),
// nicht manuell gepflegt.
function buildSpeedCalibrationSection(){
  const results = state.profilPage.results || [];
  const model = computeSpeedModel(results);
  const card = el('div', {class:'card'});
  card.appendChild(el('h2', {style:'display:flex; align-items:center; gap:8px;'}, [
    'Persönliches Tempo-Modell',
    infoButton('Wie schnell du auf verschiedenen Steigungen bei unterschiedlicher Leistung tatsächlich fährst, aus deinen eigenen Strava-Fahrten berechnet. Blass dargestellte Felder haben noch zu wenig eigene Daten und nutzen einen generischen Schätzwert. Bestimmt, wie viel Streckendistanz ein zeitbasiertes Intervall auf einer Route beansprucht.')
  ]));
  const totalSec = model.cells.reduce((s,c)=>s+c.sec, 0);
  if(totalSec < SPEED_CAL_MIN_SEC){
    card.appendChild(el('div', {class:'legend-note'}, ['Noch nicht genug Fahrten für eine persönliche Kalibrierung — Schätzwerte werden verwendet.']));
    return card;
  }
  const details = el('details', {class:'tt-collapse'});
  details.appendChild(el('summary', {}, [el('h3', {class:'tsettings-group-title', style:'display:inline; margin:0;'}, ['Tabelle anzeigen'])]));
  const body = el('div', {style:'margin-top:10px;'});
  GRADIENT_BUCKETS.forEach((b, gIdx) => {
    const chips = el('div', {class:'stat-chips'}, ZONES.map((z, zIdx) => {
      const cell = model.cells[gIdx*ZONES.length + zIdx];
      return statChip(Math.round(cell.kmh)+' km/h', z.name, cell.calibrated ? null : 'opacity:0.55;');
    }));
    body.appendChild(el('div', {class:'tsettings-group'}, [
      el('h3', {class:'tsettings-group-title'}, [GRADIENT_BUCKET_LABELS[gIdx]]), chips
    ]));
  });
  details.appendChild(body);
  card.appendChild(details);
  return card;
}

// ---------- Reifendruck page ----------
// One number-input field row, styled like settingsFieldRow() but bound to
// state.tirePressure.settings directly instead of TRAINING_CONFIG (a
// separate, unrelated settings object) -- onchange (not oninput) so a full
// render() while the rider is mid-keystroke never happens, same reasoning as
// settingsFieldRow() itself.
//
// `defaultValue` (optional): rider/bike weight and tire width legitimately
// go back to `null` when cleared -- that's exactly what gates the
// "Fahrergewicht, Radgewicht und Reifenbreite eingeben..." empty state, a
// normal, visible, recoverable state. reminderThresholdPercent is different:
// it's not shown anywhere as "incomplete", it just silently multiplies into
// isPressureLow()'s comparison (targetBar * (threshold/100)). If it were
// allowed to become null there, isPressureLow() would compare against 0 and
// the startup low-pressure reminder would silently stop firing forever with
// no visible sign why. So the threshold call site below passes a hard
// default (85, matching TIRE_PRESSURE defaults) and, on invalid/cleared
// input, resets both the stored value and the input's displayed value to
// it -- same reset-and-reflect-in-the-DOM pattern as settingsFieldRow()
// (index.html ~11521). Callers that don't pass defaultValue keep the old
// null-on-invalid behavior.
function tirePressureNumberRow(data, key, label, unit, step, defaultValue){
  const s = data.settings;
  const id = 'tp-' + key;
  const input = el('input', {type:'number', id, step: step || 1, min: '0', value: s[key] != null ? s[key] : '', onchange: (e) => {
    const v = parseFloat(e.target.value);
    if(isFinite(v) && v > 0){
      s[key] = v;
    } else if(defaultValue != null){
      s[key] = defaultValue;
      e.target.value = defaultValue;
    } else {
      s[key] = null;
    }
    saveTirePressureData(data);
    state.tirePressureReminder = computeTirePressureReminder(data);
    // Deliberately NOT render(): a full render() tears down and rebuilds the
    // entire #app DOM, which would destroy the very input node under the
    // rider's cursor mid-interaction (a number input's spinner-arrow click
    // fires `change` immediately, before the click sequence finishes) and
    // close any currently-open infoButton() popover elsewhere on the page --
    // same reasoning as settingsFieldRow()/settingsFieldChip() above. Only
    // the per-wheel target-pressure chips need to reflect the new value, so
    // update just those, scoped to #tp-wheels-container.
    refreshTirePressureWheelsSection(data);
  }});
  const wrap = el('span', {class: 'tsettings-input-wrap'}, [input, unit ? el('span', {class: 'tsettings-unit'}, [unit]) : null]);
  const main = el('div', {class: 'tsettings-row-main'}, [el('label', {for: id}, [label]), wrap]);
  return el('div', {class: 'tsettings-row'}, [main]);
}
