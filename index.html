<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rückenwind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --asphalt: #14171d;
    --asphalt-2: #1c212a;
    --asphalt-3: #262c37;
    --line: #333a47;
    --chalk: #f2efe9;
    --chalk-dim: #98a1ae;
    --tail: #4fb08c;
    --tail-bg: rgba(79,176,140,0.12);
    --head: #e2574c;
    --head-bg: rgba(226,87,76,0.12);
    --cross: #e2b23e;
    --cross-bg: rgba(226,178,62,0.12);
    --route: #6b8fc2;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:transparent; color:var(--chalk); }
  body{
    font-family:'Inter', sans-serif;
    background: var(--asphalt);
    min-height:100vh;
  }
  .app{ max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 22px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size: 26px; letter-spacing: -0.02em; margin:0;
    color: var(--chalk);
  }
  .brand h1 span{ color: var(--tail); }
  .brand .status{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.08em; }
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--head); }
  .dot.on{ background: var(--tail); }

  .card{
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    margin: 0 0 14px; color: var(--chalk);
    text-transform: uppercase; letter-spacing:0.06em;
  }
  .muted{ color: var(--chalk-dim); font-size: 14px; line-height:1.55; }

  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    background: var(--tail); color: #0d1712; border:none; border-radius:10px;
    padding: 12px 18px; cursor:pointer; letter-spacing:0.01em;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn.secondary{ background: var(--asphalt-3); color: var(--chalk); border:1px solid var(--line); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  input[type=text], input[type=datetime-local], input[type=number]{
    width:100%; background: var(--asphalt); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color: var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;
    margin-bottom:10px;
  }
  label{ font-size:12px; color:var(--chalk-dim); display:block; margin-bottom:6px; font-family:'IBM Plex Mono', monospace; }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }

  .settings-row{ display:grid; grid-template-columns: repeat(3, minmax(190px,1fr)); gap:10px; margin-bottom:16px; }
  .settings-row > div{ min-width:0; }
  @media (max-width:620px){ .settings-row{ grid-template-columns: 1fr; } }

  /* Route source tabs */
  .source-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .source-tab{
    flex:1; text-align:center; padding:9px 8px; border-radius:8px; border:1px solid var(--line);
    background:var(--asphalt); color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .source-tab:hover{ border-color:var(--route); }
  .source-tab.active{ background:var(--tail-bg); border-color:var(--tail); color:var(--tail); }

  /* Activity picker */
  .activity{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 14px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
    cursor:pointer; background: var(--asphalt);
  }
  .activity:hover{ border-color: var(--route); }
  .activity.selected{ border-color: var(--tail); background: var(--tail-bg); }
  .activity .name{ font-weight:600; font-size:14px; }
  .activity .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:2px; }

  /* Wind rail — signature element */
  .rail{ position:relative; padding: 10px 0 26px; }
  .rail-line{
    position:relative; height: 3px; background: linear-gradient(90deg, var(--route), var(--asphalt-3));
    border-radius:2px; margin: 34px 6px 0;
  }
  .rail-point{
    position:absolute; top:-34px; transform: translateX(-50%);
    display:flex; flex-direction:column; align-items:center; width: 64px;
  }
  .rail-point .arrow{
    width:22px; height:22px; margin-bottom:4px;
    transition: transform 0.2s ease;
  }
  .rail-point .kmh{ font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; }
  .rail-point .lbl{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--chalk-dim); margin-top:2px; text-align:center; white-space:nowrap; }
  .rail-point .dotmark{ width:9px; height:9px; border-radius:50%; background: var(--route); margin-top:6px; border:2px solid var(--asphalt-2); }

  .legend{ display:flex; gap:18px; margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .swatch{ width:10px; height:10px; border-radius:2px; }

  /* Route map */
  #route-map{
    width:100%; height:340px; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background: var(--asphalt);
  }
  .wind-marker{ display:flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    box-shadow: 0 0 0 2px rgba(20,23,29,0.85), 0 2px 6px rgba(0,0,0,0.4);
  }
  .leaflet-popup-content-wrapper{ background: var(--asphalt-2); color: var(--chalk); border-radius:8px; }
  .leaflet-popup-content{ font-family:'IBM Plex Mono', monospace; font-size:12px; margin:8px 10px; }
  .leaflet-popup-tip{ background: var(--asphalt-2); }
  .leaflet-container{ font-family:'Inter', sans-serif; }

  /* Segments */
  .segment{
    display:flex; flex-direction:column; gap:10px; cursor:pointer;
    padding:14px; border-radius:10px; margin-bottom:8px; border:1px solid var(--line);
  }
  .segment:hover{ border-color:var(--route); }
  .segment.static{ cursor:default; }
  .segment.static:hover{ border-color:var(--line); }
  .segment.static.selected:hover{ border-color:var(--tail); }
  .segment.selected{ border-color:var(--tail); background:var(--tail-bg); }
  .segment .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .segment .left{ display:flex; align-items:flex-start; gap:12px; min-width:0; flex:1; }
  .segment .arrow-badge{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .segment .name{ font-weight:600; font-size:14px; }
  .segment .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:3px; }
  .segment .stat-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .segment .stat-chip{
    display:inline-flex; align-items:center; white-space:nowrap;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; font-weight:600;
    color:var(--route); background:rgba(107,143,194,0.14);
    border-radius:6px; padding:4px 8px;
  }
  .tag{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:6px; white-space:nowrap;
  }
  .tag.tail{ background:var(--tail-bg); color:var(--tail); }
  .tag.head{ background:var(--head-bg); color:var(--head); }
  .tag.cross{ background:var(--cross-bg); color:var(--cross); }
  .tag.mini{ padding:3px 6px; font-size:10px; }
  .wind-mix-mini{ display:flex; gap:4px; flex-shrink:0; }

  .weather-strip{ display:flex; gap:14px; overflow-x:auto; padding-bottom:4px; }
  .weather-chip{
    flex: 0 0 auto; min-width:76px; text-align:center; background:var(--asphalt);
    border:1px solid var(--line); border-radius:10px; padding:10px 8px; cursor:pointer;
  }
  .weather-chip:hover{ border-color:var(--route); }
  .weather-chip .t{ font-family:'IBM Plex Mono', monospace; font-size:13px; font-weight:600; }
  .weather-chip .hr{ font-size:10px; color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace; }
  .weather-chip .w{ font-size:11px; color:var(--route); margin-top:4px; font-family:'IBM Plex Mono', monospace; }

  .error{ color: var(--head); font-size:13px; font-family:'IBM Plex Mono', monospace; margin-top:8px; }
  .loading{ color: var(--chalk-dim); font-size:13px; font-family:'IBM Plex Mono', monospace; }

  .footnote{ font-size:11px; color: var(--chalk-dim); margin-top:26px; line-height:1.6; }
  a{ color: var(--route); }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STRAVA_CLIENT_ID = "268232";
// Token exchange happens server-side (Cloudflare Worker) so the Strava
// client secret never ships to the browser. Replace with your deployed
// worker URL, e.g. "https://rueckenwind-oauth.<subdomain>.workers.dev".
const TOKEN_ENDPOINT = "https://rueckenwind-oauth.lucca-renner7.workers.dev";

function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalInputValue(date){
  return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}
function defaultStartTime(){
  const d = new Date(); d.setMinutes(d.getMinutes()+60);
  return toLocalInputValue(d);
}
function fmtTime(date){
  if(!date) return "--:--";
  return pad2(date.getHours())+":"+pad2(date.getMinutes());
}
function fmtDuration(sec){
  if(sec == null) return null;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}

const savedSettings = loadSettings();

let state = {
  connected: false,
  athlete: null,
  accessToken: null,
  activities: [],
  selectedActivity: null,
  routePoints: [], // [{lat,lon,bearing,distanceKm,arrivalTime}] - sampled points used for wind markers
  fullRouteCoords: [], // [[lat,lon], ...] full-resolution line for the map
  weatherAtRoute: [], // aligned with routePoints
  startTime: defaultStartTime(),
  avgSpeedKmh: savedSettings.avgSpeedKmh || 25,
  routePointDistanceKm: savedSettings.routePointDistanceKm || 10,
  segments: [],
  segmentWeather: {}, // id -> weather
  segmentDetails: {}, // id -> detailed segment (PR, KOM/QOM, elevation, effort count)
  segmentPrWatts: {}, // id -> {watts, measured} for the PR effort, fetched lazily on click
  segmentSortBy: "default",
  selectedSegmentId: null, // when set, the map shows this segment instead of the full route
  routeSourceTab: "activities", // "routes" | "activities" | "gpx"
  stravaRoutes: [], // saved/planned Strava routes, fetched lazily when that tab opens
  routeInfoTab: "elevation", // "elevation" | "beststart"
  elevationProfile: null, // {distances:[km,...], elevations:[m,...]} for the current route, or null if not (yet) loaded
  routeWindCache: {}, // "activity-123" / "route-45" -> {type, windSpeed} quick wind rating for list chips
  windFieldEnabled: false, // "Windfeld" overlay toggle - grid of small wind arrows over the route's map area
  windFieldPoints: null, // [{lat,lon,windSpeed,windDir}, ...] for the overlay, or null if not (yet) loaded for the current route
  loading: {},
  error: null,
  authCodeInput: ""
};

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") e.className = attrs[k];
    else if(k === "html") e.innerHTML = attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

// Strava segment/activity names come from arbitrary Strava users (anyone can
// create a public segment), so they're untrusted text — must be escaped
// before ever landing in a raw HTML string (e.g. Leaflet popup content).
function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// ---------- polyline decode (Strava / Google encoded polyline) ----------
function decodePolyline(str){
  let index = 0, lat = 0, lng = 0, coords = [];
  while (index < str.length) {
    let b, shift = 0, result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += dlat;
    shift = 0; result = 0;
    do { b = str.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
    lng += dlng;
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

function bearingBetween(p1, p2){
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const y = Math.sin(Δλ)*Math.cos(φ2);
  const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  let θ = Math.atan2(y,x)*180/Math.PI;
  return (θ+360)%360;
}

function haversineKm(p1, p2){
  const R = 6371;
  const φ1 = p1[0]*Math.PI/180, φ2 = p2[0]*Math.PI/180;
  const Δφ = (p2[0]-p1[0])*Math.PI/180;
  const Δλ = (p2[1]-p1[1])*Math.PI/180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildCumulativeDistances(coords){
  const cum = [0];
  for(let i=1;i<coords.length;i++){
    cum.push(cum[i-1] + haversineKm(coords[i-1], coords[i]));
  }
  return cum;
}

function estimateArrival(startDate, distanceKm, avgSpeedKmh){
  const hours = distanceKm / Math.max(1, avgSpeedKmh);
  return new Date(startDate.getTime() + hours*3600*1000);
}

function pickRoutePoints(coords, cumDist, stepKm){
  if(coords.length < 2) return [];

  const step = Math.max(1, stepKm);
  const totalDistance = cumDist[cumDist.length - 1] || 0;
  const points = [];
  let targetDistance = 0;
  let idx = 0;

  while (targetDistance <= totalDistance + 1e-9) {
    while (idx < cumDist.length - 1 && cumDist[idx] < targetDistance) idx++;
    const p = coords[idx];
    const nextIdx = idx + 1 < coords.length ? idx + 1 : idx;
    const prevIdx = idx > 0 ? idx - 1 : idx;
    const bearing = idx < coords.length - 1 ? bearingBetween(coords[idx], coords[nextIdx]) : bearingBetween(coords[prevIdx], coords[idx]);
    points.push({ lat: p[0], lon: p[1], bearing, distanceKm: cumDist[idx], idx });
    targetDistance += step;
  }

  if (points.length && points[points.length - 1].distanceKm < totalDistance - 1e-6) {
    const last = coords[coords.length - 1];
    const lastIdx = coords.length - 1;
    points.push({
      lat: last[0],
      lon: last[1],
      bearing: bearingBetween(coords[lastIdx - 1] || coords[lastIdx], coords[lastIdx]),
      distanceKm: cumDist[lastIdx],
      idx: lastIdx
    });
  }

  return points;
}

// ---------- wind relative classification ----------
function windRelative(routeBearing, windFromDeg){
  // windFromDeg = direction wind is coming FROM (meteorological convention)
  // wind blowing TOWARD = windFromDeg + 180
  const windToward = (windFromDeg + 180) % 360;
  let diff = Math.abs(routeBearing - windToward);
  if(diff > 180) diff = 360 - diff;
  // diff small = tailwind (wind pushes same direction as travel)
  if(diff <= 55) return { type:"tail", diff };
  if(diff >= 125) return { type:"head", diff };
  return { type:"cross", diff };
}

// Distance-weighted breakdown of the whole route by wind relation, so a
// short but very headwind-y stretch doesn't count the same as a long one.
function computeWindMix(){
  const pts = state.routePoints;
  let tailDist = 0, crossDist = 0, totalDist = 0;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const dist = pts[i+1].distanceKm - pts[i].distanceKm;
    if(dist <= 0) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    if(rel.type === "tail") tailDist += dist;
    else if(rel.type === "cross") crossDist += dist;
    totalDist += dist;
  }
  if(totalDist <= 0) return null;
  const tailPct = Math.round(tailDist / totalDist * 100);
  const crossPct = Math.round(crossDist / totalDist * 100);
  const headPct = Math.max(0, 100 - tailPct - crossPct);
  return { tailPct, crossPct, headPct };
}

// Thresholds for the strong-wind banner. Sustained wind and gusts are judged
// separately since gusts spike well above the sustained speed even on an
// otherwise rideable day.
const STRONG_WIND_KMH = 35;
const STRONG_GUST_KMH = 50;

// Scans the already-fetched weather at each route point (no extra API calls)
// for the worst sustained wind / gust expected anywhere along the route at
// the currently chosen start time, so a gusty stretch in the middle of an
// otherwise calm route still surfaces a warning.
function computeStrongWindWarning(){
  let maxWind = 0, maxGust = 0;
  state.weatherAtRoute.forEach(w=>{
    if(!w) return;
    if(w.windSpeed > maxWind) maxWind = w.windSpeed;
    if(w.windGust > maxGust) maxGust = w.windGust;
  });
  if(maxWind < STRONG_WIND_KMH && maxGust < STRONG_GUST_KMH) return null;
  return { maxWind, maxGust };
}

// ---------- wind field overlay (grid of small wind arrows over the map) ----------
// Optional, off by default (toggle in renderRouteCard): a static NxN grid of
// wind arrows spanning the route's map bounds, similar in spirit to a
// Windy.com-style field but without animation. Open-Meteo accepts
// comma-separated lists of coordinates in a single request, so the whole
// grid costs exactly one extra API call, regardless of grid size.
const WIND_FIELD_GRID_SIZE = 10; // 10x10 = 100 points per fetch (Open-Meteo's per-request location cap)

function computeWindFieldGridPoints(bounds){
  const south = bounds.getSouth(), north = bounds.getNorth();
  const west = bounds.getWest(), east = bounds.getEast();
  const points = [];
  for(let i=0;i<WIND_FIELD_GRID_SIZE;i++){
    for(let j=0;j<WIND_FIELD_GRID_SIZE;j++){
      points.push({
        lat: south + (north - south) * (i + 0.5) / WIND_FIELD_GRID_SIZE,
        lon: west + (east - west) * (j + 0.5) / WIND_FIELD_GRID_SIZE
      });
    }
  }
  return points;
}

function windSpeedColor(kmh){
  if(kmh < 15) return "#4fb08c";
  if(kmh < 30) return "#e2b23e";
  if(kmh < 45) return "#e2895c";
  return "#e2574c";
}

async function ensureWindField(bounds){
  if(state.windFieldPoints || state.loading.windField) return;
  state.loading.windField = true; render();
  const grid = computeWindFieldGridPoints(bounds);
  try{
    const lats = grid.map(p => p.lat.toFixed(3)).join(",");
    const lons = grid.map(p => p.lon.toFixed(3)).join(",");
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&hourly=wind_speed_10m,wind_direction_10m&forecast_days=7&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("Winddaten nicht verfügbar");
    const data = await res.json();
    const results = Array.isArray(data) ? data : [data];
    const targetDate = new Date(state.startTime);
    state.windFieldPoints = results.map((r, i)=>{
      const hours = r.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - targetDate);
        if(diff < best){ best = diff; idx = hi; }
      });
      return {
        lat: grid[i].lat,
        lon: grid[i].lon,
        windSpeed: r.hourly.wind_speed_10m[idx],
        windDir: r.hourly.wind_direction_10m[idx]
      };
    });
  }catch(e){
    state.windFieldPoints = [];
  }
  state.loading.windField = false;
  render();
}

// Finds the best departure times for the current route within the next 48h,
// reusing the hourly forecast we already fetched per route point (Open-Meteo
// returns 7 days of hourly data in a single call) — no extra API requests.
function findBestStartTimes(){
  const pts = state.routePoints;
  if(!pts.length || !state.weatherAtRoute.some(w => w && w.hourly)) return [];

  const now = new Date();
  now.setMinutes(0, 0, 0);
  now.setHours(now.getHours() + 1);
  const candidates = [];
  for(let h=0; h<48; h++){
    candidates.push(new Date(now.getTime() + h*3600*1000));
  }

  const scored = candidates.map(startDate=>{
    let totalDist = 0, tailDist = 0, headDist = 0, sumDiff = 0;
    for(let i=0;i<pts.length-1;i++){
      const w = state.weatherAtRoute[i];
      if(!w || !w.hourly) continue;
      const dist = pts[i+1].distanceKm - pts[i].distanceKm;
      if(dist <= 0) continue;

      const arrival = estimateArrival(startDate, pts[i].distanceKm, state.avgSpeedKmh);
      const hours = w.hourly.time;
      let idx = 0, best = Infinity;
      hours.forEach((t,hi)=>{
        const diff = Math.abs(new Date(t) - arrival);
        if(diff < best){ best = diff; idx = hi; }
      });
      const windDir = w.hourly.wind_direction_10m[idx];
      const rel = windRelative(pts[i].bearing, windDir);
      sumDiff += rel.diff * dist;
      totalDist += dist;
      if(rel.type === "tail") tailDist += dist;
      if(rel.type === "head") headDist += dist;
    }
    if(totalDist <= 0) return null;
    return {
      startDate,
      avgDiff: sumDiff / totalDist,
      tailPct: Math.round(tailDist / totalDist * 100),
      headPct: Math.round(headDist / totalDist * 100)
    };
  }).filter(Boolean);

  scored.sort((a,b) => a.avgDiff - b.avgDiff);
  return scored.slice(0, 3);
}

async function ensureElevationProfile(){
  if(state.elevationProfile !== null || state.loading.elevation) return;
  if(!state.selectedActivity || state.selectedActivity.isGpx) return;
  state.loading.elevation = true; render();
  try{
    let raw;
    if(state.selectedActivity.isRoute){
      raw = await fetchRouteStreams(state.selectedActivity.id.replace(/^route-/, ""), state.accessToken);
    } else {
      raw = await fetchActivityStreams(state.selectedActivity.id, state.accessToken);
    }
    const streams = normalizeStreams(raw);
    // Strava's distance stream is in meters; elevationProfile.distances is
    // documented (and consumed by renderElevationChart) as km.
    state.elevationProfile = (streams.distance && streams.altitude)
      ? { distances: streams.distance.map(d => d / 1000), elevations: streams.altitude }
      : { distances: [], elevations: [] };
  }catch(e){
    state.elevationProfile = { distances: [], elevations: [] };
  }
  state.loading.elevation = false;
  render();
}

function renderElevationChart(){
  if(state.loading.elevation){
    return el("div", {class:"loading"}, ["Lade Höhenprofil…"]);
  }
  const profile = state.elevationProfile;
  if(!profile || profile.distances.length < 2){
    return el("div", {class:"muted", style:"font-size:12px;"}, ["Für diese Strecke sind keine Höhendaten verfügbar."]);
  }
  const { distances, elevations } = profile;
  const width = 600, height = 140, pad = 6;
  const minE = Math.min(...elevations), maxE = Math.max(...elevations);
  const rangeE = Math.max(1, maxE - minE);
  const totalD = distances[distances.length - 1] || 1;
  const x = d => pad + (d / totalD) * (width - pad*2);
  const y = e => (height - pad) - ((e - minE) / rangeE) * (height - pad*2);

  let linePath = `M ${x(distances[0]).toFixed(1)} ${y(elevations[0]).toFixed(1)}`;
  for(let i=1;i<distances.length;i++){
    linePath += ` L ${x(distances[i]).toFixed(1)} ${y(elevations[i]).toFixed(1)}`;
  }
  const areaPath = `${linePath} L ${x(totalD).toFixed(1)} ${height-pad} L ${x(distances[0]).toFixed(1)} ${height-pad} Z`;

  const svg = `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:140px; display:block;">
    <path d="${areaPath}" fill="rgba(107,143,194,0.18)" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="#6b8fc2" stroke-width="2"/>
  </svg>`;

  return el("div", {}, [
    el("div", {html: svg}),
    el("div", {class:"muted", style:"display:flex; justify-content:space-between; margin-top:8px; font-size:11px; font-family:'IBM Plex Mono', monospace;"}, [
      el("span", {}, [`${Math.round(minE)} – ${Math.round(maxE)} m`]),
      el("span", {}, [`${totalD.toFixed(1)} km`])
    ])
  ]);
}

function renderBestStartContent(card){

function renderRouteInfoTabsCard(){
  if(state.selectedSegmentId) return null;

function arrowSvg(routeBearing, windFromDeg, color){
  // arrow points in the direction wind blows TOWARD, rotated relative to route bearing (route = "up")
  const windToward = (windFromDeg + 180) % 360;
  const relAngle = windToward - routeBearing;
  return `<svg viewBox="0 0 24 24" style="transform:rotate(${relAngle}deg)">
    <path d="M12 3 L18 15 L12 11.5 L6 15 Z" fill="${color}"/>
  </svg>`;
}

// Strava's activity streams come back key_by_type (an object), route streams
// come back as an array of {type, data} — normalize both to {distance, altitude}.
function normalizeStreams(raw){
  const byType = {};
  if(Array.isArray(raw)){
    raw.forEach(s => { if(s && s.type) byType[s.type] = s.data; });
  } else if(raw){
    Object.keys(raw).forEach(k => { byType[k] = raw[k] && raw[k].data; });
  }
  return byType;
}

// ---------- Open-Meteo ----------
async function fetchWeather(lat, lon, targetDate){
  targetDate = targetDate || new Date();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation_probability&forecast_days=7&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Wetterdaten nicht verfügbar");
  const data = await res.json();
  // find the forecast hour closest to the target (arrival) time
  const hours = data.hourly.time;
  let idx = 0, best = Infinity;
  hours.forEach((t,i)=>{
    const diff = Math.abs(new Date(t) - targetDate);
    if(diff < best){ best = diff; idx = i; }
  });
  return {
    temp: data.hourly.temperature_2m[idx],
    windSpeed: data.hourly.wind_speed_10m[idx],
    windDir: data.hourly.wind_direction_10m[idx],
    windGust: data.hourly.wind_gusts_10m[idx],
    precip: data.hourly.precipitation_probability[idx],
    forecastTime: new Date(hours[idx]),
    hourly: data.hourly,
    idx
  };
}

  app.innerHTML = "";
  app.appendChild(renderBrand());

async function connectWithCode(code){
  state.error = null;
  state.loading.connect = true; render();
  try{
    const tokenData = await exchangeCode(code);
    state.accessToken = tokenData.access_token;
    state.athlete = tokenData.athlete;
    await saveToken(tokenData.refresh_token);
    state.connected = true;
    await loadActivitiesAndSegments();
  }catch(e){
    state.error = e.message || "Verbindung fehlgeschlagen.";
  }
  state.loading.connect = false;
  render();
}

async function loadActivitiesAndSegments(){
  state.loading.activities = true; render();
  try{
    state.activities = await fetchActivities(state.accessToken);
    if(state.activities.length){
      await selectActivity(state.activities[0]);
    }
  }catch(e){ state.error = e.message; }
  state.loading.activities = false;

  state.loading.segments = true; render();
  try{
    state.segments = await fetchStarredSegments(state.accessToken);
    await loadSegmentExtras();
  }catch(e){ state.error = e.message; }
  state.loading.segments = false;
  render();
}

async function selectActivity(activity){
  state.selectedActivity = activity;
  state.elevationProfile = null;
  state.windFieldPoints = null;
  render();
  if(!activity.map || !activity.map.summary_polyline){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  const coords = decodePolyline(activity.map.summary_polyline);
  state.fullRouteCoords = coords;
  const cumDist = buildCumulativeDistances(coords);
  state.routePoints = pickRoutePoints(coords, cumDist, state.routePointDistanceKm);
  render();
  await loadRouteWeather();
}

// Re-samples routePoints from the already-loaded fullRouteCoords — used
// whenever Punktabstand changes, and after loading a GPX file or a saved
// Strava route, since the full coordinate list doesn't need to change,
// just how it's sliced into wind-sample points.
function recomputeRoutePoints(){
  if(!state.fullRouteCoords.length) return;
  const cumDist = buildCumulativeDistances(state.fullRouteCoords);
  state.routePoints = pickRoutePoints(state.fullRouteCoords, cumDist, state.routePointDistanceKm);
  render();
  loadRouteWeather();
}

function selectRouteSourceTab(tab){
  state.routeSourceTab = tab;
  render();
  if(tab === "routes") ensureStravaRoutesLoaded();
}

async function ensureStravaRoutesLoaded(){
  if(state.stravaRoutes.length || state.loading.routes) return;
  state.loading.routes = true; render();
  try{
    state.stravaRoutes = await fetchStravaRoutes(state.accessToken);
  }catch(e){
    state.error = e.message;
  }
  state.loading.routes = false;
  render();
}

async function selectStravaRoute(route){
  state.selectedActivity = { id: "route-" + route.id, name: route.name, isRoute: true };
  state.elevationProfile = null;
  state.windFieldPoints = null;
  render();
  const poly = route.map && (route.map.polyline || route.map.summary_polyline);
  if(!poly){
    state.routePoints = [];
    state.fullRouteCoords = [];
    state.weatherAtRoute = [];
    return;
  }
  state.fullRouteCoords = decodePolyline(poly);
  recomputeRoutePoints();
}

// ---------- GPX import ----------
// Lets the wind/map pipeline run on any route, not just past Strava
// activities — works without being connected to Strava at all.
function parseGpxTrack(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if(doc.querySelector("parsererror")) return null;
  const points = [...doc.querySelectorAll("trkpt, rtept")];
  const coords = [], eles = [];
  points.forEach(p=>{
    const lat = parseFloat(p.getAttribute("lat"));
    const lon = parseFloat(p.getAttribute("lon"));
    if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    coords.push([lat, lon]);
    const eleEl = p.querySelector("ele");
    const ele = eleEl ? parseFloat(eleEl.textContent) : NaN;
    eles.push(Number.isFinite(ele) ? ele : null);
  });
  return coords.length >= 2 ? { coords, eles } : null;
}

async function loadGpxFile(file){
  state.error = null;
  let track = null;
  try{
    track = parseGpxTrack(await file.text());
  }catch(e){
    track = null;
  }
  if(!track){
    state.error = "GPX-Datei konnte nicht gelesen werden.";
    render();
    return;
  }
  state.selectedActivity = { name: file.name.replace(/\.gpx$/i, ""), isGpx: true };
  state.windFieldPoints = null;
  state.fullRouteCoords = track.coords;
  state.elevationProfile = track.eles.every(e => e != null)
    ? { distances: buildCumulativeDistances(track.coords), elevations: track.eles }
    : { distances: [], elevations: [] };
  recomputeRoutePoints();
}

async function loadRouteWeather(){
  if(!state.routePoints.length) return;
  state.loading.weather = true; render();
  const startDate = new Date(state.startTime);
  const weatherResults = [];
  for(const p of state.routePoints){
    const arrival = estimateArrival(startDate, p.distanceKm, state.avgSpeedKmh);
    p.arrivalTime = arrival;
    try{
      const w = await fetchWeather(p.lat.toFixed(4), p.lon.toFixed(4), arrival);
      weatherResults.push(w);
    }catch(e){
      weatherResults.push(null);
    }
  }
  state.weatherAtRoute = weatherResults;
  state.loading.weather = false;
  render();
}

async function loadSegmentExtras(){
  for(const seg of state.segments.slice(0, 12)){
    if(seg.start_latlng){
      try{
        const w = await fetchWeather(seg.start_latlng[0].toFixed(4), seg.start_latlng[1].toFixed(4));
        state.segmentWeather[seg.id] = w;
      }catch(e){
        state.segmentWeather[seg.id] = null;
      }
    }
    try{
      state.segmentDetails[seg.id] = await fetchSegmentDetail(seg.id, state.accessToken);
    }catch(e){
      state.segmentDetails[seg.id] = null;
    }
    render();
  }
}

// PR power isn't in the segment summary — it takes a whole extra activity
// fetch per segment to find it, so we only do this on demand (when a
// segment is clicked) instead of eagerly for all visible segments, to keep
// Strava API usage down.
async function ensureSegmentPrWatts(seg){
  if(state.segmentPrWatts[seg.id] !== undefined) return;
  const detail = state.segmentDetails[seg.id];
  const prActivityId = detail && detail.athlete_segment_stats && detail.athlete_segment_stats.pr_activity_id;
  if(!prActivityId){ state.segmentPrWatts[seg.id] = null; return; }
  try{
    const activity = await fetchActivityDetail(prActivityId, state.accessToken);
    const effort = (activity.segment_efforts || []).find(e => e.segment && e.segment.id === seg.id);
    state.segmentPrWatts[seg.id] = (effort && effort.average_watts != null)
      ? { watts: Math.round(effort.average_watts), measured: !!effort.device_watts }
      : null;
  }catch(e){
    state.segmentPrWatts[seg.id] = null;
  }
  render();
}

// Distance-weighted tail/cross/head wind-mix for a route/activity list chip.
// The polyline is decoded and split into bearings entirely client-side
// (free); only a single Open-Meteo call is made (wind at the start point) to
// classify all of those segments against, so this stays cheap enough to run
// for every visible list item.
async function ensureListItemWindTag(key, polyline){
  if(state.routeWindCache[key] !== undefined) return;
  state.routeWindCache[key] = null;
  if(!polyline) return;
  const coords = decodePolyline(polyline);
  if(coords.length < 2) return;
  try{
    const w = await fetchWeather(coords[0][0].toFixed(4), coords[0][1].toFixed(4));
    let tailDist = 0, crossDist = 0, totalDist = 0;
    for(let i=0;i<coords.length-1;i++){
      const dist = haversineKm(coords[i], coords[i+1]);
      if(dist <= 0) continue;
      const bearing = bearingBetween(coords[i], coords[i+1]);
      const rel = windRelative(bearing, w.windDir);
      if(rel.type === "tail") tailDist += dist;
      else if(rel.type === "cross") crossDist += dist;
      totalDist += dist;
    }
    if(totalDist <= 0) return;
    const tailPct = Math.round(tailDist / totalDist * 100);
    const crossPct = Math.round(crossDist / totalDist * 100);
    const headPct = Math.max(0, 100 - tailPct - crossPct);
    state.routeWindCache[key] = { tailPct, crossPct, headPct };
    render();
  }catch(e){
    // leave cached as null (no rating shown)
  }
}

function renderListItemWindTag(key){
  const mix = state.routeWindCache[key];
  if(!mix) return null;
  return el("div", {class:"wind-mix-mini"}, [
    el("div", {class:"tag mini tail", title:"Rückenwind"}, [`${mix.tailPct}%`]),
    el("div", {class:"tag mini cross", title:"Seitenwind"}, [`${mix.crossPct}%`]),
    el("div", {class:"tag mini head", title:"Gegenwind"}, [`${mix.headPct}%`])
  ]);
}

function renderRouteCard(){
  const card = el("div", {class:"card"});

  if(state.selectedSegmentId){
    const seg = state.segments.find(s => s.id === state.selectedSegmentId);
    card.appendChild(el("div", {style:"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px;"}, [
      el("h2", {style:"margin:0;"}, ["Segment"]),
      el("button", {class:"btn secondary", style:"padding:8px 14px; font-size:12px;", onclick:()=>{ state.selectedSegmentId = null; render(); }}, ["Zur Strecke"])
    ]));

    if(seg){
      card.appendChild(renderSegmentRow(seg, {clickable:false}));
    }

    card.appendChild(el("div", {id:"route-map", style:"margin-top:14px;"}));
    return card;
  }

  card.appendChild(el("h2", {}, ["Strecke"]));

  const settingsRow = el("div", {class:"settings-row"}, [
    el("div", {}, [
      el("label", {}, ["Startzeit"]),
      el("div", {style:"display:flex; justify-content:center;"}, [
        el("input", {type:"datetime-local", style:"width:100%;", value: state.startTime, onchange:(e)=>{ state.startTime = e.target.value; loadRouteWeather(); }})
      ])
    ]),
    el("div", {}, [
      el("label", {}, ["Ø Geschwindigkeit (km/h)"]),
      el("input", {type:"number", style:"width:100%;", min:"5", max:"60", step:"1", value: state.avgSpeedKmh, onchange:(e)=>{ state.avgSpeedKmh = parseFloat(e.target.value) || 25; saveSettings(); loadRouteWeather(); }})
    ]),
    el("div", {}, [
      el("label", {}, ["Punktabstand"]),
      el("select", {
        style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:8px; padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
        onchange:(e)=>{
          state.routePointDistanceKm = parseInt(e.target.value, 10) || 10;
          saveSettings();
          if(state.fullRouteCoords.length) recomputeRoutePoints();
        }
      }, [
        el("option", {value:"5", selected: state.routePointDistanceKm === 5 ? "selected" : null}, ["alle 5 km"]),
        el("option", {value:"10", selected: state.routePointDistanceKm === 10 ? "selected" : null}, ["alle 10 km"]),
        el("option", {value:"15", selected: state.routePointDistanceKm === 15 ? "selected" : null}, ["alle 15 km"]),
        el("option", {value:"20", selected: state.routePointDistanceKm === 20 ? "selected" : null}, ["alle 20 km"]),
        el("option", {value:"25", selected: state.routePointDistanceKm === 25 ? "selected" : null}, ["alle 25 km"])
      ])
    ])
  ]);
  card.appendChild(settingsRow);
  card.appendChild(el("div", {class:"muted", style:"margin-bottom:12px; font-size:12px;"}, ["Wetterwerte werden jeweils für den erwarteten Ankunftszeitpunkt an diesem Punkt berechnet."]));

  if(!state.connected){
    card.appendChild(renderGpxUploadRow());
  } else {
    const tabs = [
      {id:"routes", label:"Routen"},
      {id:"activities", label:"Fahrten"},
      {id:"gpx", label:"GPX"}
    ];
    card.appendChild(el("div", {class:"source-tabs"}, tabs.map(t =>
      el("div", {
        class:"source-tab" + (state.routeSourceTab === t.id ? " active" : ""),
        onclick: ()=>selectRouteSourceTab(t.id)
      }, [t.label])
    )));

    if(state.routeSourceTab === "routes"){
      if(state.loading.routes){
        card.appendChild(el("div", {class:"loading"}, ["Lade Routen…"]));
      } else if(state.stravaRoutes.length){
        const list = el("div", {});
        state.stravaRoutes.slice(0,10).forEach(route=>{
          const key = "route-" + route.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === key;
          const km = (route.distance/1000).toFixed(1);
          const poly = route.map && (route.map.polyline || route.map.summary_polyline);
          ensureListItemWindTag(key, poly);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectStravaRoute(route)}, [
            el("div", {}, [
              el("div", {class:"name"}, [route.name]),
              el("div", {class:"meta"}, [`${km} km · ${Math.round(route.elevation_gain || 0)} Hm`])
            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else {
        card.appendChild(el("div", {class:"muted"}, ["Keine gespeicherten Routen gefunden."]));
      }
    } else if(state.routeSourceTab === "activities"){
      if(state.loading.activities){
        card.appendChild(el("div", {class:"loading"}, ["Lade letzte Aktivitäten…"]));
      } else if(state.activities.length){
        const list = el("div", {});
        state.activities.filter(a => a.type === "Ride" || a.type === "VirtualRide" || a.type === "GravelRide" || a.type === "MountainBikeRide" || !a.type).slice(0,5).forEach(a=>{
          const key = "activity-" + a.id;
          const isSel = state.selectedActivity && state.selectedActivity.id === a.id;
          const km = (a.distance/1000).toFixed(1);
          const date = new Date(a.start_date_local).toLocaleDateString("de-DE", {day:"2-digit", month:"2-digit", year:"numeric"});
          ensureListItemWindTag(key, a.map && a.map.summary_polyline);
          const item = el("div", {class:"activity" + (isSel?" selected":""), onclick: ()=>selectActivity(a)}, [
            el("div", {}, [
              el("div", {class:"name"}, [a.name]),
              el("div", {class:"meta"}, [`${date} · ${km} km`])
            ]),
            renderListItemWindTag(key)
          ]);
          list.appendChild(item);
        });
        card.appendChild(list);
      } else if(!state.fullRouteCoords.length){
        card.appendChild(el("div", {class:"muted"}, ["Keine Aktivitäten gefunden."]));
      }
    } else if(state.routeSourceTab === "gpx"){
      card.appendChild(renderGpxUploadRow());
    }
  }

  if(state.loading.weather){
    card.appendChild(el("div", {class:"loading", style:"margin-top:14px;"}, ["Berechne Wind entlang der Strecke…"]));
  } else if(state.routePoints.length && state.weatherAtRoute.length){
    const mix = computeWindMix();
    if(mix){
      card.appendChild(el("div", {style:"margin-top:14px;"}, [
        el("div", {style:"display:flex; height:8px; border-radius:4px; overflow:hidden;"}, [
          el("div", {style:`flex:${mix.tailPct}; background:var(--tail);`}),
          el("div", {style:`flex:${mix.crossPct}; background:var(--cross);`}),
          el("div", {style:`flex:${mix.headPct}; background:var(--head);`})
        ]),
        el("div", {style:"display:flex; justify-content:space-between; margin-top:6px; font-size:11px; font-family:'IBM Plex Mono', monospace;"}, [
          el("span", {style:"color:var(--tail);"}, [`${mix.tailPct}% Rückenwind`]),
          el("span", {style:"color:var(--cross);"}, [`${mix.crossPct}% Seitenwind`]),
          el("span", {style:"color:var(--head);"}, [`${mix.headPct}% Gegenwind`])
        ])
      ]));
    }
    const strongWind = computeStrongWindWarning();
    if(strongWind){
      const parts = [];
      if(strongWind.maxWind >= STRONG_WIND_KMH) parts.push(`${Math.round(strongWind.maxWind)} km/h Wind`);
      if(strongWind.maxGust >= STRONG_GUST_KMH) parts.push(`${Math.round(strongWind.maxGust)} km/h Böen`);
      card.appendChild(el("div", {style:"margin-top:14px; padding:10px 12px; border-radius:8px; background:var(--head-bg); border:1px solid var(--head); display:flex; align-items:center; gap:8px;"}, [
        el("span", {style:"font-size:15px;"}, ["⚠"]),
        el("span", {style:"font-size:12.5px; color:var(--head); font-family:'IBM Plex Mono', monospace;"}, [
          `Starker Wind entlang der Strecke: bis zu ${parts.join(" · ")}`
        ])
      ]));
    }
    card.appendChild(el("div", {style:"display:flex; align-items:center; gap:8px; margin-top:14px; cursor:pointer;", onclick:()=>{ state.windFieldEnabled = !state.windFieldEnabled; render(); }}, [
      el("div", {style:`width:34px; height:20px; border-radius:10px; flex-shrink:0; background:${state.windFieldEnabled ? "var(--tail)" : "var(--asphalt-3)"}; position:relative; transition:background 0.15s;`}, [
        el("div", {style:`width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:2px; left:${state.windFieldEnabled ? "16px" : "2px"}; transition:left 0.15s;`})
      ]),
      el("span", {class:"muted", style:"font-size:12px;"}, [
        "Windfeld der Umgebung anzeigen" + (state.windFieldEnabled && state.loading.windField ? " (lädt…)" : "")
      ])
    ]));
    if(state.windFieldEnabled){
      card.appendChild(el("div", {class:"muted", style:"font-size:10.5px; margin-top:4px;"}, [
        "Windstärke: grün <15 · gelb <30 · orange <45 · rot ≥45 km/h"
      ]));
    }
    card.appendChild(el("div", {id:"route-map", style:"margin-top:14px;"}));
    const legend = el("div", {class:"legend", style:"margin-top:10px;"}, [
      el("span",{},[el("span",{class:"swatch", style:"background:var(--tail)"}), "Rückenwind"]),
      el("span",{},[el("span",{class:"swatch", style:"background:var(--cross)"}), "Seitenwind"]),
      el("span",{},[el("span",{class:"swatch", style:"background:var(--head)"}), "Gegenwind"]),
    ]);
    card.appendChild(legend);

    const first = state.weatherAtRoute.find(w=>w);
    if(first){
      const strip = el("div", {class:"weather-strip", style:"margin-top:16px;"});
      state.routePoints.forEach((p,i)=>{
        const w = state.weatherAtRoute[i];
        if(!w) return;
        strip.appendChild(el("div", {class:"weather-chip", onclick:()=>{
          const marker = routeMarkerByIndex[i];
          if(marker){
            if(leafletMapInstance) leafletMapInstance.panTo(marker.getLatLng());
            marker.openPopup();
          }
          const mapEl = document.getElementById("route-map");
          if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
        }}, [
          el("div", {class:"t"}, [Math.round(w.temp) + "°"]),
          el("div", {class:"hr"}, ["Ankunft " + fmtTime(p.arrivalTime) + " · " + p.distanceKm.toFixed(0) + " km"]),
          el("div", {class:"w"}, [w.precip + "% Regen"])
        ]));
      });
      card.appendChild(strip);
    }
  } else if(state.selectedActivity && !state.fullRouteCoords.length){
    card.appendChild(el("div", {class:"muted", style:"margin-top:12px;"}, ["Für diese Aktivität liegt keine Streckenkarte vor."]));
  }

  return card;
}

let leafletMapInstance = null;
let routeMarkerByIndex = {}; // routePoints index -> Leaflet marker (for weather-chip clicks)

function mountRouteMap(){
  const container = document.getElementById("route-map");
  if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
  if(!container) return;

  if(state.selectedSegmentId){
    mountSegmentView(container, state.selectedSegmentId);
  } else if(state.fullRouteCoords.length){
    mountFullRouteView(container);
  }
}

function mountSegmentView(container, segId){
  const seg = state.segments.find(s => s.id === segId);
  const detail = state.segmentDetails[segId];
  const poly = detail && detail.map && (detail.map.polyline || detail.map.summary_polyline);
  if(!seg || !poly) return;

  const coords = decodePolyline(poly);
  const latlngs = coords.map(c => [c[0], c[1]]);

  const map = L.map(container, { scrollWheelZoom:true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap Mitwirkende &copy; CARTO',
    maxZoom: 20,
    subdomains: 'abcd'
  }).addTo(map);

  let color = "#6b8fc2", label = escapeHtml(seg.name);
  const w = state.segmentWeather[segId];
  if(w && seg.start_latlng && seg.end_latlng){
    const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
    const rel = windRelative(bearing, w.windDir);
    color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#e2574c" : "#e2b23e";
    const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
    label = `<b>${escapeHtml(seg.name)}</b><br>${typeLabel} · ${Math.round(w.windSpeed)} km/h`;
  }

  const line = L.polyline(latlngs, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(map);
  map.fitBounds(line.getBounds(), { padding:[30,30] });
  line.bindPopup(label).openPopup();

  L.circleMarker(latlngs[0], { radius:6, weight:2, color:"#14171d", fillColor:"#4fb08c", fillOpacity:1 })
    .addTo(map).bindTooltip("Start");
  L.circleMarker(latlngs[latlngs.length - 1], { radius:6, weight:2, color:"#14171d", fillColor:"#e2574c", fillOpacity:1 })
    .addTo(map).bindTooltip("Ziel");

  // wind direction arrow at the segment's midpoint — points where the wind
  // blows toward, absolute compass direction (north-up), same convention
  // as the full-route markers
  if(w){
    const midPoint = latlngs[Math.floor(latlngs.length / 2)];
    const rotateDeg = (w.windDir + 180) % 360;
    const icon = L.divIcon({
      className: "",
      html: `<svg width="26" height="26" viewBox="0 0 16 16" style="transform:rotate(${rotateDeg}deg); filter: drop-shadow(0 0 2px rgba(20,23,29,0.9));">
               <circle cx="8" cy="8" r="2.4" fill="${color}" opacity="0.95"/>
               <line x1="8" y1="13.5" x2="8" y2="3" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
               <path d="M3.8 6.6 L8 2 L12.2 6.6" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
             </svg>`,
      iconSize: [26,26], iconAnchor: [13,13]
    });
    L.marker(midPoint, { icon }).addTo(map).bindPopup(label);
  }

  leafletMapInstance = map;
}

function mountFullRouteView(container){
  const map = L.map(container, { scrollWheelZoom:true });
  // Light, low-detail grayscale basemap instead of the colorful default OSM
  // tiles — much higher contrast for the colored wind line, and easier to
  // read on a phone in direct sunlight.
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap Mitwirkende &copy; CARTO',
    maxZoom: 20,
    subdomains: 'abcd'
  }).addTo(map);

  const coords = state.fullRouteCoords;
  const latlngs = coords.map(c=>[c[0], c[1]]);

  // faint base line — carries the route where no wind data covers it
  const baseLine = L.polyline(latlngs, { color:"#333a47", weight:3, opacity:0.55, lineCap:"round", lineJoin:"round" }).addTo(map);
  map.fitBounds(baseLine.getBounds(), { padding:[26,26] });

  // optional "Windfeld" overlay — a static grid of small wind arrows under
  // the route line, toggled in renderRouteCard(). Added before the route
  // line/markers below so it stays visually underneath them.
  if(state.windFieldEnabled){
    if(!state.windFieldPoints && !state.loading.windField){
      ensureWindField(map.getBounds());
    } else if(state.windFieldPoints){
      state.windFieldPoints.forEach(p=>{
        const color = windSpeedColor(p.windSpeed);
        const rotateDeg = (p.windDir + 180) % 360;
        const icon = L.divIcon({
          className: "",
          html: `<svg width="11" height="11" viewBox="0 0 16 16" style="transform:rotate(${rotateDeg}deg); opacity:0.6;">
                   <line x1="8" y1="13" x2="8" y2="4" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/>
                   <path d="M4.8 6.6 L8 3 L11.2 6.6" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                 </svg>`,
          iconSize: [11,11], iconAnchor: [5.5,5.5]
        });
        L.marker([p.lat, p.lon], { icon }).addTo(map).bindTooltip(`${Math.round(p.windSpeed)} km/h`);
      });
    }
  }

  // continuous colored line: one segment per stretch between two
  // consecutive wind-sampled points, colored by that stretch's wind relation
  const pts = state.routePoints;
  for(let i=0;i<pts.length-1;i++){
    const w = state.weatherAtRoute[i];
    if(!w) continue;
    const rel = windRelative(pts[i].bearing, w.windDir);
    const color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#e2574c" : "#e2b23e";
    const from = pts[i].idx, to = pts[i+1].idx;
    if(to <= from) continue;
    const segCoords = coords.slice(from, to + 1).map(c=>[c[0], c[1]]);
    L.polyline(segCoords, { color, weight:5, opacity:0.95, lineCap:"round", lineJoin:"round" }).addTo(map);
  }

  // small chevrons along the line showing which way the ride goes — placed
  // at even distance intervals independent of the (much sparser)
  // wind-sample points, so direction stays legible on loops/out-and-backs
  // regardless of the chosen Punktabstand.
  const cumDist = buildCumulativeDistances(coords);
  const totalKm = cumDist[cumDist.length - 1] || 0;
  if(totalKm > 0){
    const chevronCount = Math.min(20, Math.max(4, Math.round(totalKm / 2)));
    const spacingKm = totalKm / chevronCount;
    for(let c=1;c<chevronCount;c++){
      const targetKm = c * spacingKm;
      let idx = cumDist.findIndex(d => d >= targetKm);
      if(idx <= 0) idx = 1;
      if(idx >= coords.length) idx = coords.length - 1;
      const bearing = bearingBetween(coords[idx-1], coords[idx]);
      const icon = L.divIcon({
        className: "",
        html: `<svg width="14" height="14" viewBox="0 0 16 16" style="transform:rotate(${bearing}deg); filter: drop-shadow(0 0 1.5px rgba(20,23,29,0.9));">
                 <path d="M8 2.5 L12.5 11 L8 8.8 L3.5 11 Z" fill="#f2efe9" opacity="0.95"/>
               </svg>`,
        iconSize: [14,14], iconAnchor: [7,7]
      });
      L.marker(coords[idx], { icon, interactive:false }).addTo(map);
    }
  }

  // small dots at each sampled point (no more rotated arrow glyphs — the
  // colored line segments + the Windfeld overlay already convey wind
  // direction/type, this is now just an anchor for the weather-strip chips
  // below the map to pan to / open a popup on) — skip points that sit too
  // close to an already-placed marker (e.g. where the route crosses itself)
  const markerDedupeRadiusKm = 0.5;
  const shownMarkerPositions = [];
  routeMarkerByIndex = {};
  pts.forEach((p,i)=>{
    const near = shownMarkerPositions.find(m => haversineKm([m.lat, m.lon], [p.lat, p.lon]) < markerDedupeRadiusKm);
    if(near){ routeMarkerByIndex[i] = near.marker; return; }

    const w = state.weatherAtRoute[i];
    let color = "#98a1ae", label = "Keine Winddaten";
    if(w){
      const rel = windRelative(p.bearing, w.windDir);
      color = rel.type === "tail" ? "#4fb08c" : rel.type === "head" ? "#e2574c" : "#e2b23e";
      const typeLabel = rel.type === "tail" ? "Rückenwind" : rel.type === "head" ? "Gegenwind" : "Seitenwind";
      label = `<b>Ankunft ${fmtTime(p.arrivalTime)} Uhr</b> · ${p.distanceKm.toFixed(0)} km<br><b>${typeLabel}</b><br>${Math.round(w.windSpeed)} km/h · ${Math.round(w.temp)}° · ${w.precip}% Regen`;
    }
    const marker = L.circleMarker([p.lat, p.lon], { radius:5, weight:2, color:"#14171d", fillColor:color, fillOpacity:0.95 })
      .addTo(map).bindPopup(label);
    shownMarkerPositions.push({ lat:p.lat, lon:p.lon, marker });
    routeMarkerByIndex[i] = marker;
  });

  leafletMapInstance = map;
}

// PR time, PR watts, KOM/QOM, elevation gain, effort count — as short
// display strings, used both in the segment list and the segment map view.
function computeSegmentStatChips(seg){
  const detail = state.segmentDetails[seg.id];
  const stats = [];
  if(detail){
    const pr = detail.athlete_segment_stats && detail.athlete_segment_stats.pr_elapsed_time;
    if(pr != null) stats.push(`PR ${fmtDuration(pr)}`);
    const prWatts = state.segmentPrWatts[seg.id];
    if(prWatts) stats.push(`${prWatts.measured ? "" : "~"}${prWatts.watts} W`);
    if(detail.xoms && detail.xoms.kom) stats.push(`KOM ${detail.xoms.kom}`);
    if(detail.xoms && detail.xoms.qom) stats.push(`QOM ${detail.xoms.qom}`);
    if(detail.total_elevation_gain != null) stats.push(`${Math.round(detail.total_elevation_gain)} Hm`);
    const effortCount = detail.athlete_segment_stats && detail.athlete_segment_stats.effort_count;
    if(effortCount) stats.push(`${effortCount}× gefahren`);
  }
  return stats;
}

// diff = 0 means pure tailwind, 180 means pure headwind (see windRelative)
function segmentTailwindDiff(seg){
  const w = state.segmentWeather[seg.id];
  if(!w || !seg.start_latlng || !seg.end_latlng) return Infinity;
  const bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  return windRelative(bearing, w.windDir).diff;
}

function sortedVisibleSegments(){
  const list = state.segments.slice(0, 12);
  const effortCount = seg => (state.segmentDetails[seg.id] && state.segmentDetails[seg.id].athlete_segment_stats && state.segmentDetails[seg.id].athlete_segment_stats.effort_count) || 0;
  switch(state.segmentSortBy){
    case "effort": return list.slice().sort((a,b) => effortCount(b) - effortCount(a));
    case "shortest": return list.slice().sort((a,b) => a.distance - b.distance);
    case "longest": return list.slice().sort((a,b) => b.distance - a.distance);
    case "steepest": return list.slice().sort((a,b) => b.average_grade - a.average_grade);
    case "tailwind": return list.slice().sort((a,b) => segmentTailwindDiff(a) - segmentTailwindDiff(b));
    default: return list;
  }
}

// Renders a single segment "card" (icon, name, distance/grade, wind tag,
// stat chips) — shared between the segments list and the segment map view,
// so both look identical.
function renderSegmentRow(seg, opts){
  opts = opts || {};
  const w = state.segmentWeather[seg.id];
  let bearing = null;
  if(seg.start_latlng && seg.end_latlng){
    bearing = bearingBetween(seg.start_latlng, seg.end_latlng);
  }
  const isSelected = state.selectedSegmentId === seg.id;
  const clickable = opts.clickable !== false;
  const rowClass = "segment" + (isSelected ? " selected" : "") + (clickable ? "" : " static");
  const row = el("div", clickable ? {class:rowClass, onclick:()=>selectSegment(seg)} : {class:rowClass});

  let badgeColor = "var(--chalk-dim)", tagClass = "", tagText = "k.A.", arrowHtml = "";
  if(w && bearing !== null){
    const rel = windRelative(bearing, w.windDir);
    badgeColor = rel.type === "tail" ? "var(--tail)" : rel.type==="head" ? "var(--head)" : "var(--cross)";
    tagClass = rel.type === "tail" ? "tail" : rel.type==="head" ? "head" : "cross";
    tagText = (rel.type === "tail" ? "Rückenwind" : rel.type==="head" ? "Gegenwind" : "Seitenwind") + " · " + Math.round(w.windSpeed) + " km/h";
    arrowHtml = arrowSvg(bearing, w.windDir, "#0d1712");
  }
  const badge = el("div", {class:"arrow-badge", style:`background:${badgeColor}`, html: arrowHtml});

  const info = el("div", {style:"flex:1; min-width:0;"}, [
    el("div", {class:"name"}, [seg.name]),
    el("div", {class:"meta", style:"display:flex; justify-content:space-between; gap:10px;"}, [
      el("span", {}, [`${(seg.distance/1000).toFixed(1)} km`]),
      el("span", {}, [`${seg.average_grade}% Ø-Steigung`])
    ])
  ]);
  const left = el("div", {class:"left"}, [badge, info]);
  const top = el("div", {class:"top"}, [left, el("div", {class:"tag " + tagClass}, [tagText])]);
  row.appendChild(top);

  const stats = computeSegmentStatChips(seg);
  if(stats.length){
    const chips = el("div", {class:"stat-chips"});
    stats.forEach(s => chips.appendChild(el("span", {class:"stat-chip"}, [s])));
    row.appendChild(chips);
  }

  return row;
}

function selectSegment(seg){
  state.selectedSegmentId = state.selectedSegmentId === seg.id ? null : seg.id;
  render();
  if(state.selectedSegmentId) ensureSegmentPrWatts(seg);
  requestAnimationFrame(()=>{
    const mapEl = document.getElementById("route-map");
    if(mapEl) mapEl.scrollIntoView({behavior:"smooth", block:"center"});
  });
}

function renderSegmentsCard(){
  const card = el("div", {class:"card"});
  card.appendChild(el("h2", {}, ["Markierte Segmente"]));

  if(state.loading.segments){
    card.appendChild(el("div", {class:"loading"}, ["Lade Segmente & Wind…"]));
    return card;
  }
  if(!state.segments.length){
    card.appendChild(el("div", {class:"muted"}, ["Keine markierten (gesternten) Segmente gefunden."]));
    return card;
  }

  card.appendChild(el("div", {style:"margin-bottom:14px;"}, [
    el("label", {}, ["Sortierung"]),
    el("select", {
      style:"width:100%; background:var(--asphalt); border:1px solid var(--line); border-radius:8px; padding:11px 12px; color:var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;",
      onchange:(e)=>{ state.segmentSortBy = e.target.value; render(); }
    }, [
      el("option", {value:"default", selected: state.segmentSortBy==="default" ? "selected" : null}, ["Standard"]),
      el("option", {value:"tailwind", selected: state.segmentSortBy==="tailwind" ? "selected" : null}, ["Bester Rückenwind zuerst"]),
      el("option", {value:"effort", selected: state.segmentSortBy==="effort" ? "selected" : null}, ["Am häufigsten gefahren"]),
      el("option", {value:"shortest", selected: state.segmentSortBy==="shortest" ? "selected" : null}, ["Länge: kurz → lang"]),
      el("option", {value:"longest", selected: state.segmentSortBy==="longest" ? "selected" : null}, ["Länge: lang → kurz"]),
      el("option", {value:"steepest", selected: state.segmentSortBy==="steepest" ? "selected" : null}, ["Steilste zuerst"])
    ])
  ]));

  sortedVisibleSegments().forEach(seg=>{
    card.appendChild(renderSegmentRow(seg));
  });

  return card;
}

function renderFootnote(){
  return el("div", {class:"footnote"}, [
    "Wetterdaten: Open-Meteo. Wind wird an ausgewählten Punkten entlang der Strecke bzw. am Startpunkt jedes Segments abgefragt und mit der Streckenrichtung verglichen. ",
    state.connected ? el("a", {href:"#", onclick:(e)=>{e.preventDefault(); loadActivitiesAndSegments();}}, ["Neu laden"]) : ""
  ]);
}

// ---------- init ----------
async function init(){
  render();

  // Strava just redirected back to this page with ?code=...
  const params = new URLSearchParams(window.location.search);
  const codeParam = params.get("code");
  if(codeParam){
    window.history.replaceState({}, document.title, window.location.pathname);
    await connectWithCode(codeParam);
    return;
  }

  const stored = await loadStoredToken();
  if(stored){
    state.loading.connect = true; render();
    try{
      const tokenData = await refreshAccessToken(stored);
      state.accessToken = tokenData.access_token;
      await saveToken(tokenData.refresh_token);
      state.connected = true;
      await loadActivitiesAndSegments();
    }catch(e){
      // stored token invalid, stay on connect screen
    }
    state.loading.connect = false;
    render();
  }
}
init();
</script>
</body>
</html>
