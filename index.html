<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VeloCast</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14171d">
<!-- iOS doesn't fully honor the manifest above yet, so it needs its own
     "add to home screen" hints for the standalone (no browser chrome) look. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VeloCast">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
  :root{
    --asphalt: #14171d;
    --asphalt-2: #1c212a;
    --asphalt-3: #262c37;
    --line: #333a47;
    --chalk: #f2efe9;
    --chalk-dim: #98a1ae;
    /* Locked wind-favorability triad — tail/cross/head are used TOGETHER
       to mean tailwind/crosswind/headwind favorability in scannable, repeated
       data (route line, tags, chart lines, wind-mix bar/rings). Any other
       "state" color (selected, active, connected, error, climb grade,
       wind-speed intensity, etc.) intentionally uses --route (neutral info
       blue) or one of the dedicated intensity ramps below instead, so
       green/amber/red never gets diluted with an unrelated meaning across
       repeated UI. The one deliberate exception is the strong-wind safety
       banner (see computeStrongWindWarning / its render in renderRouteCard):
       it's a rare, one-off alarm rather than a repeated data point a user
       scans across many rows, so red-as-danger there is a distinct, legitimate
       UX pattern on its own — not the same "could be misread as tailwind"
       risk as e.g. coloring every Windfeld arrow or every climb chip.
       --accent is a second, separate exception: it happens to share
       tail-green's hue for brand/primary-action identity (wordmark, CTA
       button) — that's a *brand* color choice, not a wind-favorability
       signal, so it's named and used separately from --tail. */
    --tail: #4fb08c;
    --tail-bg: rgba(79,176,140,0.12);
    --head: #f2766b;
    --head-bg: rgba(242,118,107,0.12);
    --cross: #e2b23e;
    --cross-bg: rgba(226,178,62,0.12);
    --accent: #4fb08c;
    /* Text-auf-Akzent-Farbe: von jedem Element genutzt, das auf einer vollen
       --accent-Fläche sitzt und dunklen statt hellen Text für Kontrast braucht
       — primärer Button, Settings-Switch-Knopf, Wind-Pfeil-Icon im farbigen
       Badge. War dreimal unabhängig als #0d1712-Literal vorhanden. */
    --ink-on-accent: #0d1712;
    /* Neutral informational accent — hover/selected/active UI states, links,
       non-wind stat chips (PR time, distance, KOM…), the elevation chart
       line. Deliberately not part of the wind vocabulary above. */
    --route: #82a2d1;
    --route-bg: rgba(130,162,209,0.14);
    /* --asphalt at 60% alpha, following the --tail-bg/--head-bg/--cross-bg/
       --route-bg pattern above (a dedicated rgba "-bg" token paired with its
       base color) — needed because a raw CSS custom property can't be
       alpha-blended on use without color-mix(), which this file otherwise
       avoids. Used for the nav drawer's backdrop scrim. */
    --asphalt-bg-60: rgba(20,23,29,0.6);
    /* Climb-grade intensity ramp: a separate, single-hue (blue) scale for
       steepness, distinct from the wind-favorability colors so a steep climb
       chip never reads as "headwind". Brightness (light = more intense)
       stands in for intensity. Tuned for the DARK climb-chart/chip context
       (asphalt-family backgrounds) — do not reuse this ramp anywhere the
       backdrop is light (see --wind-* below for that case). */
    --grade-1: #7f97bd; --grade-1-bg: rgba(127,151,189,0.10);
    --grade-2: #82a2d1; --grade-2-bg: rgba(130,162,209,0.14);
    --grade-3: #9fb8dc; --grade-3-bg: rgba(159,184,220,0.18);
    --grade-4: #c3d5ec; --grade-4-bg: rgba(195,213,236,0.22);
    /* Wind-speed (absolute, not direction-relative) intensity ramp for the
       Windfeld map overlay — its own token family, deliberately NOT the
       --grade-* ramp above, because the Leaflet basemap tiles are light
       (cartodb light_all, ~#f2f0eb), the inverse of the dark climb-chart
       context --grade-* was tuned for. Direction is reversed from --grade-*
       too: here DARKER/more saturated = stronger wind, so the most
       dangerous reading is the most visually prominent against light tiles,
       not the least. Alpha is baked into each stop (not a separate opacity
       multiplier) so contrast against the tiles can be tuned per step —
       measured (blended-pixel vs. #f2f0eb) at roughly 3.2:1 / 4.8:1 / 7.3:1 /
       11.7:1 for tiers 1→4, all above the 3:1 WCAG floor for non-text
       graphics conveying information. */
    --wind-1: rgba(90,123,168,0.90);
    --wind-2: rgba(63,95,143,0.92);
    --wind-3: rgba(42,69,112,0.94);
    --wind-4: rgba(22,41,77,0.97);
    /* KOM/QOM closeness ramp: its own dedicated 2-tier family for "how close
       is this athlete's PR to the record time", deliberately separate from
       --tail/--head/--cross (wind favorability) and --accent (brand/CTA) —
       same discipline as --grade-*/--wind-* above, one color family per
       semantic meaning. A violet/plum hue is used because it's otherwise
       unused anywhere in this palette (wind favorability is green/red/amber,
       --route/--grade-* are blue, --wind-* is blue) — so "close to the
       record" can't be misread as any of those. --kom-near is the closer/
       more-prominent tier (within ~5% of the record time), --kom-mid the
       milder "getting close" tier (within ~15%); anything beyond that stays
       on the chip's plain neutral --route/--route-bg styling with no
       highlight at all. See buildXomChip(). */
    --kom-near: #c792ea; --kom-near-bg: rgba(199,146,234,0.16);
    --kom-mid: #9b86bd; --kom-mid-bg: rgba(155,134,189,0.12);
    /* Shape system: one radius per element category, applied everywhere that
       category appears. Circular controls (toggle, arrow-badge, swatch) are
       an intentional exception — they're glyphs/switches, not chips. */
    --r-xs: 6px;   /* tags, stat-chips */
    --r-sm: 8px;   /* inputs, selects, popups */
    --r-md: 10px;  /* buttons, list rows, weather chips */
    --r-lg: 14px;  /* cards, map container */
    --r-full: 999px; /* pills */
    /* Spacing-Skala: benannt nach den im File bereits dominanten Werten (siehe
       Kommentar bei --r-xs für dieselbe Disziplin) — kein aspirationales 4/8-
       Raster, daher ändert die Anwendung dieser Tokens nie einen bestehenden
       Pixel-Wert. Nur an den konkret als inkonsistent identifizierten Stellen
       angewendet, nicht flächendeckend über jedes margin/padding/gap im File. */
    --space-1: 4px;
    --space-2: 6px;
    --space-3: 8px;
    --space-4: 10px;
    --space-5: 14px;
    --space-6: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:transparent; color:var(--chalk); }
  body{
    font-family:'Inter', sans-serif;
    background: var(--asphalt);
    min-height:100vh;
  }
  .app{ max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }

  .brand{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 22px; }
  .brand .brand-left{ display:flex; align-items:baseline; gap:12px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size: 26px; letter-spacing: -0.02em; margin:0;
    color: var(--chalk);
  }
  .brand h1 span{ color: var(--accent); }
  .brand .status{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--chalk-dim); text-transform:uppercase; letter-spacing:0.08em; }

  /* Hamburger nav trigger and star/un-star-on-Strava action button share one
     plain-icon-button recipe — asphalt-3 fill, line border, route border on
     hover — so they read as a consistent icon-button pattern across the app
     (see renderStarButton() for the star's .on/:disabled states). Same
     "neutral surface + hover" recipe also repeats, with different box
     models, in .info-btn, .source-tab, .weather-chip, button.stat-chip, and
     .tsettings-class's <summary> hover — those are deliberately NOT merged
     into a shared base class in this pass because their sizing/shape
     diverges too much for a safe surgical change. */
  .hamburger-btn, .star-btn{
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; align-self:center;
    background: var(--asphalt-3); border:1px solid var(--line); border-radius:var(--r-sm);
    cursor:pointer; padding:0;
  }
  .hamburger-btn{ width:32px; height:32px; }
  .star-btn{ width:30px; height:30px; }
  .hamburger-btn:hover, .star-btn:hover{ border-color:var(--route); }
  .star-btn.on{ border-color:var(--route); background:var(--route-bg); }
  .star-btn:disabled{ opacity:0.5; cursor:default; }
  .hamburger-btn svg, .star-btn svg{ display:block; }

  /* "Nicht relevant" toggle — same .star-btn icon-button shape/sizing, but
     its .on tint uses --head (the app's existing red, otherwise only used
     for headwind/warnings) instead of --route, so a marked-irrelevant
     segment's button can never be mistaken for the star button's on-state
     at a glance (see renderIrrelevantButton()/hideIconSvg()). */
  .hide-btn.on{ border-color:var(--head); background:var(--head-bg); }

  /* Left slide-in nav drawer + backdrop. Both are plain el()-built nodes
     recreated on every render() like the rest of the tree (unlike
     routeMapContainer/the settings inputs, neither holds any mid-interaction
     native browser state, so there's no Safari-crash-style reason to make
     them persistent module-level nodes). The slide transition is real CSS
     (transform/opacity), which the file-wide
     `@media (prefers-reduced-motion: reduce)` rule below already collapses
     to instant show/hide for every element, this one included. */
  .nav-backdrop{
    position:fixed; inset:0; background:var(--asphalt-bg-60);
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
    z-index:40;
  }
  .nav-backdrop.open{ opacity:1; pointer-events:auto; }
  .nav-drawer{
    position:fixed; top:0; left:0; bottom:0; width:260px; max-width:80vw;
    background:var(--asphalt-2); border-right:1px solid var(--line);
    transform:translateX(-100%); transition:transform 0.22s ease;
    z-index:41; padding:24px 16px; display:flex; flex-direction:column; gap:var(--space-1);
    overflow-y:auto;
  }
  .nav-drawer.open{ transform:translateX(0); }
  .nav-drawer .nav-drawer-title{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:18px;
    letter-spacing:-0.02em; margin:0 0 18px; color:var(--chalk);
  }
  .nav-drawer .nav-drawer-title span{ color:var(--accent); }
  /* Same neutral "active" treatment as .source-tab.active (asphalt-3 fill +
     chalk border/text) for visual consistency across the app's tab/nav
     controls. */
  .nav-item{
    padding:12px 14px; border-radius:var(--r-md); cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    color:var(--chalk-dim); border:1px solid transparent;
  }
  .nav-item:hover{ border-color:var(--route); color:var(--chalk); }
  .nav-item.active{ background:var(--asphalt-3); border-color:var(--chalk); color:var(--chalk); }
  /* Divider above the drawer's bottom-of-list, connected-only utility
     actions (logout, external Strava-settings link) — visually separates
     them from the page-nav items above so they don't read as a third
     destination tab. */
  .nav-drawer-divider{ height:1px; background:var(--line); margin:8px 4px; flex-shrink:0; }
  /* Same padding/radius rhythm as .nav-item so it lines up in the list, but
     deliberately muted (chalk-dim, no .active-style highlight state) since
     these are one-shot actions/an external doorway, not a "currently on this
     page" destination — reusing .nav-item.active here would wrongly imply
     that. Shared by both the <button> (logout) and <a> (external link)
     variants. */
  .nav-action{
    display:block; width:100%; box-sizing:border-box; text-align:left;
    padding:12px 14px; border-radius:var(--r-md); cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px;
    color:var(--chalk-dim); border:1px solid transparent; background:none;
    text-decoration:none;
  }
  .nav-action:hover{ border-color:var(--route); color:var(--chalk); }
  .nav-action:disabled{ opacity:0.5; cursor:default; }
  /* Connection status is a UI on/off state, not a wind-favorability judgment
     — deliberately neutral (chalk-dim/route) rather than red/green so it
     can't be misread as "bad wind / good wind". */
  .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--chalk-dim); }
  .dot.on{ background: var(--route); }

  .card{
    background: var(--asphalt-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px;
    margin-bottom: 16px;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:600;
    margin: 0 0 14px; color: var(--chalk);
    text-transform: uppercase; letter-spacing:0.06em;
  }
  .muted{ color: var(--chalk-dim); font-size: 14px; line-height:1.55; }

  .btn{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    background: var(--accent); color: var(--ink-on-accent); border:none; border-radius:var(--r-md);
    padding: 12px 18px; cursor:pointer; letter-spacing:0.01em;
  }
  .btn:hover{ filter: brightness(1.08); }
  .btn.secondary{ background: var(--asphalt-3); color: var(--chalk); border:1px solid var(--line); }
  .btn:disabled{ opacity:0.5; cursor:default; }

  input[type=text], input[type=datetime-local], input[type=number], select{
    width:100%; background: var(--asphalt); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:11px 12px; color: var(--chalk); font-family:'IBM Plex Mono', monospace; font-size:13px;
    margin-bottom:10px;
  }
  label{ font-size:12px; color:var(--chalk-dim); display:block; margin-bottom:6px; font-family:'IBM Plex Mono', monospace; }

  .settings-row{ display:grid; grid-template-columns: repeat(3, minmax(190px,1fr)); gap:10px; margin-bottom:16px; }
  .settings-row > div{ min-width:0; }
  @media (max-width:620px){ .settings-row{ grid-template-columns: 1fr; } }

  /* Route source tabs. "Active" is a UI-selection state, not a wind
     judgment — kept neutral (chalk on asphalt-3) rather than tail-green so
     it can't be misread as "this tab = good wind". */
  .source-tabs{ display:flex; gap:var(--space-2); margin-bottom:14px; }
  .source-tab{
    flex:1; text-align:center; padding:9px 8px; border-radius:var(--r-sm); border:1px solid var(--line);
    background:var(--asphalt); color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .source-tab:hover{ border-color:var(--route); }
  .source-tab.active{ background:var(--asphalt-3); border-color:var(--chalk); color:var(--chalk); }

  /* Activity picker. Same rule: "selected" is a neutral UI state (uses the
     --route info accent, consistent with hover), never tail/head/cross. */
  .activity{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 14px; border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:8px;
    cursor:pointer; background: var(--asphalt);
  }
  .activity:hover{ border-color: var(--route); }
  .activity.selected{ border-color: var(--route); background: var(--route-bg); }
  .activity .name{ font-weight:600; font-size:14px; }
  .activity .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:2px; }

  .legend{ display:flex; gap:18px; margin-top:10px; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); }
  .legend span{ display:flex; align-items:center; gap:6px; }
  /* Small 10px legend marks read fine at a tighter radius than the 6px chip
     scale below — kept as a deliberate exception, not a stray value. */
  .swatch{ width:10px; height:10px; border-radius:2px; }

  /* Route map — same large-container radius as .card since it visually
     behaves like one. */
  #route-map{
    width:100%; height:340px; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--line); background: var(--asphalt);
  }
  .leaflet-popup-content-wrapper{ background: var(--asphalt-2); color: var(--chalk); border-radius:var(--r-sm); }
  .leaflet-popup-content{ font-family:'IBM Plex Mono', monospace; font-size:12px; margin:8px 10px; }
  .leaflet-popup-tip{ background: var(--asphalt-2); }
  .leaflet-container{ font-family:'Inter', sans-serif; }

  /* Segments */
  .segment{
    display:flex; flex-direction:column; gap:var(--space-4); cursor:pointer;
    padding:14px; border-radius:var(--r-md); margin-bottom:8px; border:1px solid var(--line);
  }
  .segment:hover{ border-color:var(--route); }
  .segment.static{ cursor:default; }
  .segment.static:hover{ border-color:var(--line); }
  .segment.static.selected:hover{ border-color:var(--route); }
  .segment.selected{ border-color:var(--route); background:var(--route-bg); }
  .segment .top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .segment .left{ display:flex; align-items:flex-start; gap:12px; min-width:0; flex:1; }
  .segment .arrow-badge{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .segment .name{ font-weight:600; font-size:14px; }
  .segment .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:3px; }
  /* Stat chips: hero-numeral pill — a bold, larger value line over a small
     uppercase label line, instead of one flat string, so the number (PR
     time, watts, climb length…) reads at a glance. */
  .stat-chips{ display:flex; flex-wrap:wrap; gap:var(--space-3); }
  .stat-chip{
    display:inline-flex; flex-direction:column; align-items:flex-start; white-space:nowrap;
    color:var(--route); background:var(--route-bg);
    border-radius:var(--r-xs); padding:5px 9px; min-width:0;
  }
  .stat-chip .v{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; line-height:1.1; letter-spacing:-0.01em; color:inherit; }
  .stat-chip .l{ font-family:'IBM Plex Mono', monospace; font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:inherit; opacity:0.75; margin-top:2px; }
  /* Neutral variant for chips that aren't a semantic route-blue "info" stat
     (e.g. an editable settings value) — same asphalt-3/line/chalk vocabulary
     .btn.secondary/.nav-item.active/.source-tab.active already use for
     "neutral interactive surface", instead of borrowing the route-blue that
     would misread as the wind/PR-style info chips elsewhere. */
  .stat-chip.neutral{ color:var(--chalk); background:var(--asphalt-3); border:1px solid var(--line); }
  button.stat-chip{ border:none; font:inherit; cursor:pointer; text-align:left; -webkit-appearance:none; appearance:none; }
  button.stat-chip:hover{ border-color:var(--route); }
  /* Demoted/secondary segment stats (Watt, all-time PR, Hm, × gefahren,
     effort rank) — one quiet compact line instead of equally-loud hero
     chips, so only the 1-2 stats computeSegmentStatChips()/
     computeRideEffortStatChips() picked as `hero` compete for attention.
     Still visible, just not shouting — same muted mono treatment as
     .segment .meta, values joined with " · " dividers instead of separate
     boxes. */
  .stat-secondary{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:7px; line-height:1.5; }
  .tag{
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:var(--r-xs); white-space:nowrap;
  }
  .tag.tail{ background:var(--tail-bg); color:var(--tail); }
  .tag.head{ background:var(--head-bg); color:var(--head); }
  .tag.cross{ background:var(--cross-bg); color:var(--cross); }
  .tag.mini{ padding:3px 6px; font-size:10px; }
  .wind-mix-mini{ display:flex; gap:var(--space-1); flex-shrink:0; }

  /* Weather chip: temperature is the hero numeral (principle: oversized
     primary metric, muted secondary text underneath). */
  .weather-strip{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; }
  .weather-chip{
    flex: 0 0 auto; min-width:84px; text-align:center; background:var(--asphalt);
    border:1px solid var(--line); border-radius:var(--r-md); padding:12px 10px 10px; cursor:pointer;
  }
  .weather-chip:hover{ border-color:var(--route); }
  .weather-chip .t{ font-family:'Space Grotesk', sans-serif; font-size:28px; font-weight:700; letter-spacing:-0.02em; line-height:1; color:var(--chalk); }
  .weather-chip .hr{ font-size:10px; color:var(--chalk-dim); font-family:'IBM Plex Mono', monospace; margin-top:7px; }
  .weather-chip .w{ font-size:11px; color:var(--route); margin-top:3px; font-family:'IBM Plex Mono', monospace; }

  /* Errors are app/network failures, not a wind judgment — kept off the
     red/amber wind vocabulary entirely and rendered as a neutral chip
     instead (bold chalk text, accent left-border). */
  .error{
    color: var(--chalk); font-size:13px; font-weight:600; font-family:'IBM Plex Mono', monospace;
    margin-top:8px; padding:8px 10px; background:var(--asphalt-3); border:1px solid var(--line);
    border-left:3px solid var(--chalk-dim); border-radius:var(--r-sm);
  }
  .loading{ color: var(--chalk-dim); font-size:13px; font-family:'IBM Plex Mono', monospace; }

  /* Segment Top-10 leaderboard (renderSegmentLeaderboard()) — the app's only
     table-like layout, deliberately dense/compact rather than another stack
     of .segment-style card rows: fixed grid columns (not manual flex gaps)
     so rank/time/watts/HR line up as an aligned table despite being built
     from el() divs, small mono type + tight padding for a scannable ranked
     list of 10 rows, alternating-row tint instead of per-row borders/cards. */
  .leaderboard{ font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .leaderboard-row{
    display:grid; grid-template-columns: 20px 1fr 50px 48px 52px; gap:8px;
    align-items:center; padding:5px 6px; border-radius:var(--r-xs);
  }
  .leaderboard-row:nth-child(even){ background:var(--asphalt-3); }
  .leaderboard-head{
    color:var(--chalk-dim); font-size:9px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.05em; background:none !important; border-bottom:1px solid var(--line);
    border-radius:0; margin-bottom:2px; padding-bottom:6px;
  }
  .lb-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .lb-num{ text-align:right; color:var(--chalk-dim); white-space:nowrap; }

  .footnote{ font-size:11px; color: var(--chalk-dim); margin-top:26px; line-height:1.6; }
  a{ color: var(--route); }

  /* Plain (non-pill) hero value + muted label pair — used for summary
     figures that sit inline rather than inside a chip (elevation min/max,
     total distance, climb km range). */
  .stat-block{ display:flex; flex-direction:column; }
  .stat-block.right{ align-items:flex-end; text-align:right; }
  .stat-block .sb-v{ font-family:'Space Grotesk', sans-serif; font-size:26px; font-weight:700; color:var(--chalk); line-height:1.1; letter-spacing:-0.02em; }
  .stat-block .sb-l{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); margin-top:2px; }

  /* Wind-mix breakdown: hero percentages above a thin pill-shaped bar,
     rather than small inline labels — same hero/secondary hierarchy as the

  .wind-mix-stats{ display:flex; justify-content:space-between; gap:var(--space-4); margin-bottom:8px; }
  .wind-mix-stat{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .wind-mix-stat .v{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; line-height:1; letter-spacing:-0.01em; }
  .wind-mix-stat .l{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); margin-top:4px; text-transform:uppercase; letter-spacing:0.04em; }
  .wind-mix-bar{ display:flex; height:8px; border-radius:var(--r-full); overflow:hidden; background:var(--asphalt-3); }

  /* ---------- Profil page ---------- */
  /* Sub-nav between the three merged Profil sections — identical markup/
     behavior to the route-source .source-tabs above, just a second instance
     since one .source-tabs row is already scoped to routeSourceTab. */
  .metric-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .metric-card{
    background: var(--asphalt); border:1px solid var(--line); border-radius:var(--r-md);
    padding:12px 14px;
  }
  .metric-card .ml{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .metric-card .mv{ font-family:'Space Grotesk', sans-serif; font-size:22px; font-weight:700; letter-spacing:-0.01em; color:var(--chalk); margin-top:4px; line-height:1.1; }
  .metric-card .mv.up{ color:var(--tail); }
  .metric-card .mv.down{ color:var(--head); }
  .metric-card .ms{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); margin-top:5px; line-height:1.4; }

  /* Chart.js canvases need an explicit-height positioned box — Chart.js
     resizes to fill its parent, and without a fixed height a `responsive`
     canvas collapses to 0px. */
  .chart-box{ position:relative; height:260px; margin-bottom:10px; }
  .chart-box.short{ height:190px; }

  /* Verdict callouts (Formkurve/Effizienz/Ermüdungsresistenz interpretation
     text) — a training-load status (good/caution/concerning), NOT a wind
     judgment. Reuses the --tail/--cross/--head hues the same way --accent
     already reuses --tail's hue for the brand mark (see the --accent comment
     at the top of this file): a deliberate cross-domain reuse of the same
     green/amber/red vocabulary, safe here because these callouts never
     appear anywhere near actual wind data, so there's no risk of one being

  .callout{
    padding:12px 14px; border-radius:var(--r-md); border:1px solid var(--line);
    background:var(--asphalt); border-left:3px solid var(--chalk-dim);
  }
  .callout .callout-title{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; color:var(--chalk); margin-bottom:4px; }
  .callout .callout-body{ font-size:12px; color:var(--chalk-dim); line-height:1.55; }
  .callout.good{ border-left-color:var(--tail); }
  .callout.good .callout-title{ color:var(--tail); }
  .callout.warn{ border-left-color:var(--cross); }
  .callout.warn .callout-title{ color:var(--cross); }
  .callout.danger{ border-left-color:var(--head); }
  .callout.danger .callout-title{ color:var(--head); }

  /* Generic horizontal comparison/progress bar (zone polarization %, weak-
     point score, gear wear) — same pill-track visual language as
     .wind-mix-bar but a separate class since it's not tied to wind
     favorability: fill color is passed inline per use instead of coming
     from the tail/head/cross vocabulary. */
  .bar-row{ display:flex; align-items:center; gap:var(--space-3); margin-bottom:8px; font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .bar-row .bar-label{ flex:0 0 130px; color:var(--chalk-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-row .bar-track{ flex:1; height:8px; border-radius:var(--r-full); overflow:hidden; background:var(--asphalt-3); }
  .bar-row .bar-num{ flex:0 0 auto; color:var(--chalk-dim); white-space:nowrap; }

  .data-table{ width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .data-table th{
    text-align:left; color:var(--chalk-dim); font-size:9px; font-weight:600; text-transform:uppercase;
    letter-spacing:0.05em; border-bottom:1px solid var(--line); padding:0 8px 6px; white-space:nowrap;
  }
  .data-table td{ padding:6px 8px; white-space:nowrap; }
  .data-table tbody tr:nth-child(even){ background:var(--asphalt-3); }
  .table-scroll{ overflow-x:auto; }

  .legend-note{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--chalk-dim); line-height:1.6; margin-top:8px; }
  .empty-state{ color:var(--chalk-dim); font-size:13px; line-height:1.6; padding:6px 0; }

  /* Click-to-reveal info button (see infoButton()) — sitewide replacement for
     a chunk of the always-visible .legend-note captions above: the label/
     heading/chart itself stays visible, the explanatory prose collapses
     behind this small (i) glyph until tapped. Deliberately plain/monoline,
     same "outline glyph, no fill/shadow/gradient" restraint as
     hamburgerIconSvg()/starIconSvg() rather than a colorful badge. */
  .info-wrap{ position:relative; display:inline-flex; vertical-align:middle; }
  .info-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:15px; height:15px; flex-shrink:0; border-radius:50%; padding:0;
    background:none; border:1px solid var(--chalk-dim); color:var(--chalk-dim);
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; line-height:1;
    cursor:pointer;
  }
  .info-btn:hover, .info-btn.open{ border-color:var(--chalk); color:var(--chalk); }
  .info-popover{
    display:none; position:absolute; z-index:20; top:20px; left:0;
    width:max-content; max-width:min(240px, calc(100vw - 56px));
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:var(--r-sm);
    padding:8px 10px; font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    color:var(--chalk-dim); line-height:1.55; text-transform:none; letter-spacing:normal; font-weight:400;
  }
  .info-popover.open{ display:block; }
  .info-popover.flip-x{ left:auto; right:0; }
  .info-popover.flip-y{ top:auto; bottom:20px; }

  /* ---------- Trainer page ---------- */
  /* Taller variant of .chart-box for the workout-preview chart (route
     elevation+power or time+power), which needs more vertical room than the
     Profil tab's 260px charts to stay readable with two y-axes. */
  .chart-box.tall{ height:320px; }
  /* Generic good/bad inline text color, same tail/head vocabulary as
     .metric-card .mv.up/.down above but usable outside a metric-card (e.g.
     the evaluation table's "erreicht %" cells). */
  .up{ color:var(--tail); }
  .down{ color:var(--head); }

  /* "Workout wählen" grid — one card per TRAINING_CLASSES entry. */
  .class-picker{ display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:8px; }
  .class-pick-card{
    text-align:left; background:var(--asphalt); border:1px solid var(--line); border-radius:var(--r-md);
    padding:10px 12px; cursor:pointer; font-family:'Inter', sans-serif;
  }
  .class-pick-card:hover{ border-color:var(--route); }
  .class-pick-card.selected{ border-color:var(--route); background:var(--route-bg); }
  .cpc-title{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; font-weight:600; font-size:13px; color:var(--chalk); }
  .cpc-title > span:first-child{ flex:1 1 auto; min-width:0; }
  .cpc-rec{ flex:0 0 auto; font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--tail); white-space:nowrap; }
  .cpc-meta{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
  .cpc-badge{ font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600; padding:2px 7px; border-radius:var(--r-full); }
  .cpc-budget{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--chalk-dim); }

  /* Generated-workout step list ("Ablauf & Analyse"), one row per step,
     left-border tinted by that step's %FTP zone (see zoneFor()). */
  .workout-steps{ display:flex; flex-direction:column; gap:var(--space-2); }
  .step{
    border-left:3px solid var(--line); padding:6px 10px; display:flex; justify-content:space-between;
    gap:10px; flex-wrap:wrap; background:var(--asphalt); border-radius:0 var(--r-sm) var(--r-sm) 0;
  }
  .step-name{ font-size:12.5px; color:var(--chalk); }
  .step-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--chalk-dim); white-space:nowrap; }

  /* Collapsible <details> sections (workout preview, Ablauf & Analyse) —
     hide the native marker and let the summary's own <h2> carry the
     disclosure visually, consistent with every other card's h2 header. */
  .tt-collapse summary{ cursor:pointer; list-style:none; }
  .tt-collapse summary::-webkit-details-marker{ display:none; }
  .tt-collapse summary h2{ display:inline; margin:0; }

  /* Einstellungen tab: one row per TRAINING_CONFIG field (see
     settingsFieldRow()). Deliberately its own "tsettings-" namespace, not a
     reuse of .settings-row above — that one belongs to the unrelated route
     planner's Punktabstand block and has a different (3-column grid) layout. */
  .tsettings-class{ border:1px solid var(--line); border-radius:var(--r-md); padding:6px 14px; margin-bottom:8px; background:var(--asphalt); }
  .tsettings-class:last-of-type{ margin-bottom:0; }
  .tsettings-class:hover{ border-color:var(--route); }
  .tsettings-row{ padding:7px 0; border-top:1px solid var(--line); }
  .tsettings-row:first-of-type{ border-top:none; }
  .tsettings-row-main{ display:flex; align-items:center; gap:var(--space-4); }
  .tsettings-row-main label{ flex:1; font-size:12.5px; margin-bottom:0; color:var(--chalk); }
  .tsettings-input-wrap{ display:flex; align-items:center; gap:5px; flex:none; }
  .tsettings-input-wrap input[type="number"]{ width:80px; margin-bottom:0; }
  .tsettings-unit{ font-size:11px; color:var(--chalk-dim); min-width:30px; }
  .tsettings-saved-note{ font-size:11.5px; color:var(--tail); opacity:0; transition:opacity .3s; }
  /* Grouped per-class constraint chips (see settingsFieldChip()/
     buildClassSettingsSection()) — a named .tsettings-group per sub-section
     (Steigung/Intervall-Struktur/Wochenbudget/Streckenlänge), each holding a
     row of .stat-chip.neutral chips that expand into their real input in
     place on click, same direct-DOM-toggle approach as flashSettingsSaved()
     above rather than a full render(). */
  .tsettings-group{ margin-top:12px; }
  .tsettings-group:first-child{ margin-top:0; }
  .tsettings-group-title{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:600; color:var(--chalk-dim); margin:0 0 8px; }
  .tsettings-chip-item{ display:inline-flex; align-items:center; gap:var(--space-2); }
  .tsettings-chip-input{ display:inline-flex; align-items:center; gap:5px; }
  .tsettings-chip-input .tsettings-unit{ min-width:0; }
  .tsettings-switch{ position:relative; display:inline-block; width:34px; height:19px; flex-shrink:0; }
  .tsettings-switch input{ opacity:0; width:0; height:0; }
  .tsettings-switch .tsettings-slider{ position:absolute; cursor:pointer; inset:0; background:var(--asphalt-3); border-radius:var(--r-full); transition:.15s; }
  .tsettings-switch .tsettings-slider::before{ content:""; position:absolute; height:14px; width:14px; left:2.5px; top:2.5px; background:var(--chalk); border-radius:50%; transition:.15s; }
  .tsettings-switch input:checked + .tsettings-slider{ background:var(--accent); }
  .tsettings-switch input:checked + .tsettings-slider::before{ transform:translateX(15px); background:var(--ink-on-accent); }

  /* Per-goal adaptive-learning rows ("Lern-Anpassung aus deinen Auswertungen"). */
  .learn-goals{ display:flex; flex-direction:column; gap:var(--space-3); }
  .learn-goal-row{ display:flex; align-items:center; gap:var(--space-3); font-family:'IBM Plex Mono', monospace; font-size:11px; }
  .learn-goal-label{ flex:0 0 130px; color:var(--chalk-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .learn-goal-num{ flex:0 0 auto; color:var(--chalk-dim); }
  .learn-goal-trend{ flex:0 0 auto; }
  .learn-goal-trend.up{ color:var(--tail); }
  .learn-goal-trend.down{ color:var(--head); }
  .learn-goal-n{ flex:0 0 auto; color:var(--chalk-dim); font-size:10px; }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>

<body>
<div class="app" id="app"></div>

<script>
const STRAVA_CLIENT_ID = "268232";
// Token exchange happens server-side (Cloudflare Worker) so client secrets
// never ship to the browser. Replace with your deployed worker URL, e.g.
// "https://rueckenwind-oauth.<subdomain>.workers.dev".
const TOKEN_ENDPOINT = "https://rueckenwind-oauth.lucca-renner7.workers.dev";
// Die Client ID ist nicht geheim (sie steht ohnehin öffentlich in der
// OAuth-Redirect-URL) -- statt sie hier UND als Worker-Env-Var zu pflegen,
// wird sie beim Verbinden vom Worker geholt (eine Quelle der Wahrheit,
// siehe HAMMERHEAD_CLIENT_ID im Worker/Cloudflare-Dashboard).
const HAMMERHEAD_CLIENT_ID_ENDPOINT = TOKEN_ENDPOINT + "/hammerhead/client-id";
const HAMMERHEAD_TOKEN_ENDPOINT = TOKEN_ENDPOINT + "/hammerhead/token";
const HAMMERHEAD_UPLOAD_ENDPOINT = TOKEN_ENDPOINT + "/hammerhead/upload";

function pad2(n){ return String(n).padStart(2,'0'); }
function toLocalInputValue(date){
  return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}T${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}
function defaultStartTime(){
  const d = new Date(); d.setMinutes(d.getMinutes()+60);
  return toLocalInputValue(d);
}
function fmtTime(date){
  if(!date) return "--:--";
  return pad2(date.getHours())+":"+pad2(date.getMinutes());
}
function fmtDuration(sec){
  if(sec == null) return null;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
  return h > 0 ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
// Inverse of fmtDuration(sec) — parses a duration string (the shape Strava
// returns for detail.xoms.kom/.qom) back into total seconds. Handles the two
// confirmed formats seen in real usage: colon-separated "M:SS"/"H:MM:SS"
// (the common case), and bare-seconds-with-"s"-suffix like "27s" (observed
// for short segments, where Strava apparently skips the "0:27" form
// entirely). Strava's exact formatting rules aren't documented anywhere this
// app can query live, so there's no way to confirm every format it might
// ever use — null remains the safe fallback for anything that isn't one of
// these two confirmed shapes, so a genuinely unrecognized format degrades to
// "no delta shown" (see buildXomChip) rather than a wrong delta or a crash.
// Never throws, never returns NaN.
function parseDuration(str){
  if(typeof str !== "string") return null;
  const trimmed = str.trim();
  const bareSeconds = trimmed.match(/^(\d+)s$/);
  if(bareSeconds) return Number(bareSeconds[1]);
  const parts = trimmed.split(":");
  if(parts.length !== 2 && parts.length !== 3) return null;
  const nums = parts.map(p => p.trim() === "" ? NaN : Number(p));
  if(nums.some(n => !Number.isFinite(n) || n < 0)) return null;
  const sec = nums.length === 3
    ? nums[0]*3600 + nums[1]*60 + nums[2]
    : nums[0]*60 + nums[1];
  return Number.isFinite(sec) ? sec : null;
}

const savedSettings = loadSettings();

// ---------- Deliberater Leistungstest ("Test"-Klasse) ----------
// Fixe Dauern (45min/5s-Sprint bewusst außerhalb des Scopes) und die
// bewusste Marge über dem aktuellen Bestwert je Dauer -- kürzere Tests
// bekommen eine größere Marge, weil ihre Bestwerte von Versuch zu Versuch
// stärker streuen als längere, stabilere Efforts. Platziert hier (statt bei
// REFERENCE_RATIOS/TRAINING_CLASSES weiter unten im File), weil
// loadConfirmedTests() direkt darunter TEST_DURATIONS_SEC schon beim Aufbau
// von `let state = {...}` (state.confirmedTests) braucht -- ein
// Vorwärtsverweis auf eine später im Skript deklarierte const würde dort mit
// einem TDZ-ReferenceError abstürzen.
const TEST_DURATIONS_SEC = [60, 300, 600, 1200];
const TEST_DURATION_CLASS = { 60:'anaerobic', 300:'vo2max', 600:'vo2max', 1200:'threshold' };
const TEST_MARGIN_PCT = { 60:0.06, 300:0.04, 600:0.03, 1200:0.02 };

// Bestätigte Testergebnisse -- eigener, von PROFIL_ACTIVITY_CACHE_KEY (siehe
// oben) unabhängiger localStorage-Key, gleiches Isolationsprinzip wie
// HR_PROFILE_CACHE_KEY weiter unten im File: ein Profil-forceRefresh/
// Cache-Trim darf eine bewusste Nutzerbestätigung nie wegwischen können.
const CONFIRMED_TESTS_KEY = 'velocast_confirmed_tests';
const CONFIRMED_TESTS_MAX = 200;
function loadConfirmedTests(){
  try{
    const raw = localStorage.getItem(CONFIRMED_TESTS_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') return {};
    const out = {};
    Object.entries(parsed).forEach(([key, t]) => {
      if(!t || typeof t !== 'object' || !t.rideId || !TEST_DURATIONS_SEC.includes(t.durationSec)) return;
      out[key] = { ...t };
    });
    return out;
  }catch(e){ return {}; }
}
function saveConfirmedTests(obj){
  const attempt = (cap) => {
    const entries = Object.values(obj).sort((a,b)=> new Date(b.confirmedAtIso) - new Date(a.confirmedAtIso)).slice(0, cap);
    const trimmed = {}; entries.forEach(t => { trimmed[`${t.rideId}:${t.durationSec}`] = t; });
    localStorage.setItem(CONFIRMED_TESTS_KEY, JSON.stringify(trimmed));
  };
  try{ attempt(CONFIRMED_TESTS_MAX); }catch(e){ try{ attempt(50); }catch(e2){} }
}
function saveConfirmedTest(entry){
  const all = loadConfirmedTests();
  all[`${entry.rideId}:${entry.durationSec}`] = entry;
  saveConfirmedTests(all);
  state.confirmedTests = all;
}

let state = {
  connected: false,
  athlete: null,
  accessToken: null,
  hammerheadConnected: false,
  hammerheadAccessToken: null,
  hammerheadExpiresAt: null, // epoch ms
  activities: [],
  selectedActivity: null,
  routePoints: [], // [{lat,lon,bearing,distanceKm,arrivalTime}] - sampled points used for wind markers
  fullRouteCoords: [], // [[lat,lon], ...] full-resolution line for the map
  weatherAtRoute: [], // aligned with routePoints
  startTime: defaultStartTime(),
  avgSpeedKmh: savedSettings.avgSpeedKmh || 25,
  routePointDistanceKm: savedSettings.routePointDistanceKm || 10,
  // Shared "nicht relevant" curation, same category as avgSpeedKmh/
  // routePointDistanceKm above (a local rider preference, not Strava-derived
  // data) — see loadSettings()/saveSettings() for the persistence and
  // isSegmentIrrelevant()/toggleSegmentIrrelevant() for the read/write API.
  // `!= null` (not `||`) so an explicit saved `false` survives a reload
  // instead of being coerced back to the true default.
  hideIrrelevantSegments: savedSettings.hideIrrelevantSegments != null ? savedSettings.hideIrrelevantSegments : true,
  // id -> true map, mirroring state.segmentStars' id-keyed-object shape for
  // O(1) lookup. Rebuilt from the plain id array saveSettings() persists
  // (see loadSettings()'s JSON round-trip note there). ONE global set, not
  // one per segment list: the same Strava segment id is the same real-world
  // segment whether it's showing on "Meine Segmente" or "Abgeschlossene
  // Segmente", so marking it irrelevant from either page must hide it on
  // both (see visibleSegmentList()).
  irrelevantSegmentIds: (savedSettings.irrelevantSegmentIds || []).reduce((acc, id) => { acc[id] = true; return acc; }, {}),
  segments: [],
  segmentWeather: {}, // id -> weather
  segmentDetails: {}, // id -> detailed segment (PR, KOM/QOM, elevation, effort count)
  segmentPrWatts: {}, // id -> {watts, measured} for the PR effort, fetched lazily on click
  // id -> {loading, entries, error} for a segment's Top-10 leaderboard (see
  // fetchSegmentLeaderboard()/ensureSegmentLeaderboard()). Same transient,
  // NOT-persisted-to-localStorage session cache as segmentPrWatts/
  // routeSegmentDetails above (id-keyed regardless of which bucket the
  // segment belongs to, since the leaderboard is a property of the segment
  // itself, not of "starred" vs. "route"). Lazily fetched on demand — see
  // renderSegmentLeaderboard()'s "Top 10 anzeigen" button — never eagerly,
  // to avoid burning an extra Strava API call per segment shown.
  segmentLeaderboards: {},
  segmentSortBy: "default",
  selectedSegmentId: null, // when set, the map shows this segment instead of the full route
  selectedSegmentSource: null, // "starred" | "route" - which of the two segment buckets selectedSegmentId belongs to
  // "Abgeschlossene Segmente": segments the athlete actually rode and
  // completed on the currently selected Strava ACTIVITY (a genuine past
  // ride), read straight from that activity's own segment_efforts (see
  // ensureRideSegments()/fetchActivityDetail()) — NOT a geographic guess at
  // segments merely near the route's path (that's what this used to be;
  // replaced because it answered the wrong question). Kept in a separate
  // parallel bucket from the user's starred segments above so the two
  // sources never overwrite each other's weather/details/PR-watts data (see
  // segmentBucket()).
  routeSegments: [],
  routeSegmentWeather: {},
  routeSegmentDetails: {},
  routeSegmentPrWatts: {},
  // seg.id -> this specific ride's DetailedSegmentEffort (elapsed_time,
  // average_watts, pr_rank, kom_rank, …) for that segment — the richer,
  // ride-specific numbers computeSegmentStatChips() prefers over the
  // all-time-PR lookup the starred-segments bucket uses, since we already
  // have them from the single activity-detail fetch. See
  // ensureRideSegments().
  routeSegmentEfforts: {},
  // Independent sort selection for the "Abgeschlossene Segmente" card —
