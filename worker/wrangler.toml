name = "rueckenwind-oauth"
main = "src/index.js"
compatibility_date = "2026-08-04"

[vars]
# Public by design (used in the OAuth authorize redirect on the frontend too).
STRAVA_CLIENT_ID = "268232"
HAMMERHEAD_CLIENT_ID = "REPLACE_ME"
# Restrict this to your GitHub Pages origin once deployed, e.g.
# "https://<username>.github.io"
ALLOWED_ORIGIN = "*"

# STRAVA_CLIENT_SECRET / HAMMERHEAD_CLIENT_SECRET are NOT set here (this file
# is safe to commit). Set them with:
#   wrangler secret put STRAVA_CLIENT_SECRET
#   wrangler secret put HAMMERHEAD_CLIENT_SECRET
# (or, since this project deploys via the Cloudflare dashboard rather than
# the wrangler CLI: Worker -> Settings -> Variables and Secrets -> Add,
# type "Secret")

# Required for the /sync route (device sync: Reifendruck, Kette, ...) --
# needs a KV namespace created once in the Cloudflare dashboard (Worker ->
# Settings -> Bindings -> Add -> KV Namespace, variable name "SYNC_KV"),
# same dashboard-based workflow as the secrets above. Fill in the real id
# after creating it (find it under Storage & Databases -> KV in the
# dashboard, or `wrangler kv namespace list` if you switch to the CLI).
# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "REPLACE_ME"
