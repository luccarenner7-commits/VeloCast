# ==============================================================================
# WARNUNG: Diese Datei ist NUR Dokumentation/Referenz -- NICHT in ihrem
# aktuellen Zustand deploybar. Dieses Projekt wird über das Cloudflare-
# Dashboard deployt (Worker -> Code bearbeiten -> Deploy), NICHT per
# `wrangler deploy`. Würde trotzdem jemand `wrangler deploy` aus diesem
# Verzeichnis ausführen, würde das mit den Werten unten GLEICHZEITIG:
#   - den Hammerhead-Login deaktivieren (HAMMERHEAD_CLIENT_ID = Platzhalter)
#   - den Origin-Schutz des Workers komplett abschalten (ALLOWED_ORIGIN = "*")
#   - den gesamten Geräte-Sync zum Absturz bringen (SYNC_KV-Bindung weiter
#     unten ist auskommentiert, env.SYNC_KV wäre dann undefined)
# Vor einem echten `wrangler deploy` müssten ALLE drei Werte unten durch die
# echten, im Cloudflare-Dashboard bereits gesetzten Werte ersetzt werden.
# ==============================================================================
name = "rueckenwind-oauth"
main = "src/index.js"
compatibility_date = "2026-08-04"

[vars]
# Public by design (used in the OAuth authorize redirect on the frontend too).
STRAVA_CLIENT_ID = "268232"
HAMMERHEAD_CLIENT_ID = "REPLACE_ME"
# Restrict this to your GitHub Pages origin once deployed, e.g.
# "https://<username>.github.io"
ALLOWED_ORIGIN = "*"
# Comma-separated Strava athlete ids allowed to use /sync (see
# isAllowedAthlete() in src/index.js) -- without this, ANY Strava account
# could read/write this Worker's /sync KV storage. Not secret (an athlete id
# isn't a credential, same sensitivity as STRAVA_CLIENT_ID above), but must
# actually be set -- the Worker fails closed (denies everyone) if this is
# empty.
ALLOWED_ATHLETE_IDS = "177534499"

# STRAVA_CLIENT_SECRET / HAMMERHEAD_CLIENT_SECRET are NOT set here (this file
# is safe to commit). Set them with:
#   wrangler secret put STRAVA_CLIENT_SECRET
#   wrangler secret put HAMMERHEAD_CLIENT_SECRET
# (or, since this project deploys via the Cloudflare dashboard rather than
# the wrangler CLI: Worker -> Settings -> Variables and Secrets -> Add,
# type "Secret")

# Required for the /sync route (device sync: Reifendruck, Kette, ...) --
# needs a KV namespace created once in the Cloudflare dashboard (Worker ->
# Settings -> Bindings -> Add -> KV Namespace, variable name "SYNC_KV"),
# same dashboard-based workflow as the secrets above. Fill in the real id
# after creating it (find it under Storage & Databases -> KV in the
# dashboard, or `wrangler kv namespace list` if you switch to the CLI).
# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "REPLACE_ME"
